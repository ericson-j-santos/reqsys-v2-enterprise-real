title: Designação do responsável executivo pelo programa de segurança cibernética
mode: advisory
notes: >
  Este arquivo é a fonte de verdade estrutural para o responsável executivo exigido
  pelo controle BACEN-08. Nenhum nome é preenchido por automação/IA — a designação
