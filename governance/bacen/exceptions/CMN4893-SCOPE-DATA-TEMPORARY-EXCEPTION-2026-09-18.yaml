rationale: >-
  A decisão humana de tratar a família CMN-4893 como applicable foi registrada,
  mas os identificadores reais da entidade jurídica e do tipo institucional ainda
  não possuem fonte autoritativa verificável no repositório. A exceção evita que
  essa ausência bloqueie PR, DEV e STG, preservando a verdade regulatória:
  nenhum valor fictício é criado, o arquivo de decisão final continua fail-closed
  e PROD permanece bloqueado até o escopo institucional real ser identificado.

