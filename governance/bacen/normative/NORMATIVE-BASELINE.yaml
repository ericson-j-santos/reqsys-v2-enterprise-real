  scope: initial_minimum_controls
  scope_note: >-
    Este incremento modela os 14 procedimentos e controles mínimos do art. 3º,
    § 2º, da Resolução CMN nº 4.893/2021, com redação introduzida pela Resolução
    CMN nº 5.274/2025. Requisitos adicionais do art. 3º-A, detalhamentos dos
    §§ 7º a 12, arts. 22-A, 22-B e 23 e documentos vivos do SFN permanecem fora
    desta baseline inicial e devem ser incorporados em incrementos posteriores.
  regulations:
    - uid: reg-cmn-4893
