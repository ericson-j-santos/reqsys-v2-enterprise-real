      role: base
      published_at: "2021-02-26"
      consolidated_as_of: "2026-09-02"
      official_source: "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?numero=4893&tipo=Resolu%C3%A7%C3%A3o+CMN"
    - uid: reg-cmn-5274
      reference: "CMN 5.274/2025"
      role: amendment
      published_at: "2025-12-18"
      adaptation_deadline: "2026-03-01"
      official_source: "https://www.bcb.gov.br/estabilidadefinanceira/exibenormativo?numero=5274&tipo=Resolu%C3%A7%C3%A3o+CMN"
  referenced_documents: []
  referenced_documents_state: nao_avaliado

applicability:
