services:
  api:
    environment:
      GITHUB_SHA: ${REQSYS_BUILD_SHA:?REQSYS_BUILD_SHA is required}
      APP_ENV: development
      ALLOW_DEMO_LOGIN: "false"
      AZURE_TENANT_ID: 6d09c88c-0617-490c-8329-305e577684bc
      AZURE_CLIENT_ID: 4061c542-cdc1-4007-ab57-40ab8f9109fc
      APP_PUBLIC_URL: https://ericson-j-santos.github.io/reqsys-v2-enterprise-real/dev
      CORS_ORIGINS: http://localhost:8083,http://127.0.0.1:8083,https://ericson-j-santos.github.io

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: /api

  nginx:
    volumes:
      - ./infra/nginx/default.pc24x7-public-dev.conf:/etc/nginx/conf.d/default.conf:ro
