services:
  codex-worker-pool:
    build:
      context: ./services/codex-worker-pool
    restart: unless-stopped
    ports:
      - "127.0.0.1:8097:8097"
    environment:
      CODEX_WORKER_POOL_DB: /data/codex-worker-pool.db
      CODEX_WORKER_POOL_API_TOKEN_FILE: /run/secrets/codex_worker_pool_api_token
      CODEX_WORKER_POOL_HEARTBEAT_TTL_SECONDS: "90"
      CODEX_WORKER_POOL_LEASE_SECONDS: "120"
      CODEX_WORKER_POOL_MAX_ATTEMPTS: "3"
    volumes:
      - codex-worker-pool-state:/data
      - "${CODEX_WORKER_POOL_API_TOKEN_FILE_HOST:?configure CODEX_WORKER_POOL_API_TOKEN_FILE_HOST}:/run/secrets/codex_worker_pool_api_token:ro"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8097/health', timeout=3).read()"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  codex-worker-pool-state:
