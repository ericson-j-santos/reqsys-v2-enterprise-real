# Rate limiting: max 20 req/s por IP global; 5 req/s na rota de login; 5 req/s no cofre (ADR-041)
limit_req_zone $binary_remote_addr zone=global:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m  rate=5r/s;
limit_req_zone $binary_remote_addr zone=cofre:10m  rate=5r/s;
limit_req_status 429;

server {
  listen 80;
  server_name _;

  # Redireciona HTTP -> HTTPS quando SSL estiver ativo
  # Descomente apos configurar certificado Let's Encrypt:
  # return 301 https://$host$request_uri;

  # Headers de seguranca HTTP
  add_header X-Frame-Options           "DENY"                              always;
  add_header X-Content-Type-Options    "nosniff"                           always;
  add_header Referrer-Policy           "strict-origin-when-cross-origin"   always;
  add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;
  add_header Content-Security-Policy
    "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; connect-src 'self'"
    always;

  # Headers propagados para o backend
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;

  # Timeouts e buffer
  proxy_read_timeout    60s;
  proxy_connect_timeout 10s;
  client_max_body_size  4m;

  # Rate limit global
  limit_req zone=global burst=40 nodelay;

  location /api/v1/auth/login {
    limit_req zone=login burst=10 nodelay;
    proxy_pass http://api:8000/v1/auth/login;
  }

  location /api/v1/cofre/ {
    limit_req zone=cofre burst=10 nodelay;
    proxy_pass http://api:8000/v1/cofre/;
  }

  # Rotas que o backend registra com o prefixo /api literal (runtime/*, requisitos/*,
  # operational-autonomy, integracoes/pentaho, govbi, rag, connectors, workflows): o
  # `location /api/` abaixo remove o prefixo e o backend receberia /runtime/health → 404.
  # Aqui o URI original é repassado inteiro (proxy_pass sem URI).
  location ~ ^/api/(runtime|requisitos|operational-autonomy|integracoes|govbi|rag|connectors|workflows|internal)(/|$) {
    proxy_pass http://api:8000;
  }

  # Páginas HTML servidas pelo backend sem prefixo /api — mantidas acessíveis via gateway.
  location = /api/runtime {
    proxy_pass http://api:8000/runtime;
  }

  location = /api/runtime/evidence {
    proxy_pass http://api:8000/runtime/evidence;
  }

  location /api/ {
    proxy_pass http://api:8000/;
  }


  # O frontend de produção não publica endpoints de desenvolvimento Vite.
  location = /@vite/client {
    return 404;
  }

  location ^~ /src/ {
    return 404;
  }

  location = /favicon.ico {
    access_log off;
    log_not_found off;
    return 204;
  }

  location / {
    proxy_pass http://frontend:80/;
  }
}

