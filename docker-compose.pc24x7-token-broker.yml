services:
  agent-token-broker:
    build:
      context: .
      dockerfile: backend/token_broker/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:${BROKER_HOST_PORT:-18080}:8080"
    environment:
      BROKER_BOOTSTRAP_ENABLED: "${BROKER_BOOTSTRAP_ENABLED:-true}"
      BROKER_PUBLIC_BASE_URL: "${BROKER_PUBLIC_BASE_URL:?configure a stable HTTPS endpoint}"
      BROKER_TOKEN_STATE_DB_PATH: /var/lib/reqsys-token-broker/token-broker.db
      BROKER_AUDIENCE: reqsys-copilot-agent-token-broker
      BROKER_ALLOWED_REPOSITORY: ericson-j-santos/reqsys-v2-enterprise-real
      BROKER_ALLOWED_WORKFLOW_REF: ericson-j-santos/reqsys-v2-enterprise-real/.github/workflows/pending-development-orchestrator.yml@refs/heads/main
      BROKER_ALLOWED_REF: refs/heads/main
      BROKER_ALLOWED_EVENTS: workflow_dispatch,schedule
    volumes:
      - reqsys-token-broker-state:/var/lib/reqsys-token-broker
    secrets:
      - broker_token_state_encryption_key
    command:
      - /bin/sh
      - -ec
      - |
        test -s /run/secrets/broker_token_state_encryption_key
        export BROKER_TOKEN_STATE_ENCRYPTION_KEY="$$(cat /run/secrets/broker_token_state_encryption_key)"
        exec uvicorn token_broker.app:app --host 0.0.0.0 --port 8080 --workers 1
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  reqsys-token-broker-state:

secrets:
  broker_token_state_encryption_key:
    file: "${BROKER_TOKEN_STATE_ENCRYPTION_KEY_FILE:?configure the host secret file path}"
