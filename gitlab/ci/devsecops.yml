gitlab_devsecops_baseline:
  stage: security
  image: python:3.12-slim
  script:
    - mkdir -p audit
    - python gitlab/scripts/generate_devsecops_baseline.py --output audit/gitlab-devsecops-report.json --markdown audit/gitlab-devsecops-report.md
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - audit/gitlab-devsecops-report.json
      - audit/gitlab-devsecops-report.md

secret_detection_gitleaks:
  stage: security
  image:
    name: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    entrypoint: [""]
  script:
    - mkdir -p audit
    - gitleaks detect --source . --no-git --redact --config .gitleaks.toml
        --report-format json --report-path audit/gitlab-secret-detection-report.json
        --exit-code 1
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - audit/gitlab-secret-detection-report.json

backend_dependency_scanning_pip_audit:
  stage: security
  image: python:3.12-slim
  before_script:
    - python -m pip install --upgrade pip pip-audit
  script:
    - mkdir -p audit
    - pip-audit -r backend/requirements-audit.txt --no-deps --format json --output audit/gitlab-pip-audit-report.json
    - pip-audit -r backend/requirements-audit.txt --no-deps
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - audit/gitlab-pip-audit-report.json

frontend_dependency_scanning_npm_audit:
  stage: security
  image: node:20-slim
  before_script:
    - cd frontend
    - npm ci
  script:
    - mkdir -p ../audit
    - npm audit --audit-level=high --json > ../audit/gitlab-npm-audit-report.json || true
    - npm audit --audit-level=high
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - audit/gitlab-npm-audit-report.json

container_scanning_trivy:
  stage: security
  image:
    name: aquasec/trivy:0.74.0@sha256:62b1e65e8869bc4b4c6aa4fa2b21595256c7c2f6018a9d9ad61caf87187c1969
    entrypoint: [""]
  script:
    - mkdir -p audit
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL --format json --output audit/gitlab-trivy-report.json .
    - trivy fs --exit-code 0 --severity HIGH,CRITICAL .
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - audit/gitlab-trivy-report.json
