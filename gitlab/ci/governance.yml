gitlab_governance_validation:
  stage: governance
  image: python:3.12-slim
  script:
    - mkdir -p audit
    - python gitlab/scripts/validate_gitlab_governance.py --output audit/gitlab-governance-report.md
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - audit/gitlab-governance-report.md

# Automatic (not manual): --output-dir without --apply is read-only by
# construction (Config.from_environment(dry_run=not args.apply) gates every
# mutating call in provision_gitlab_governance.py behind `if not
# config.dry_run`), so there is no real-write risk in running it on every
# push to main. Was previously `when: manual` and never actually clicked
# (see audit trail before this change) — this closes that recurring human
# step. `_apply` below stays manual: it performs real writes.
# Required protected variable: GITLAB_PROVISIONING_TOKEN (api scope).
# Optional source variables are copied without being printed:
# GITLAB_GOVERNANCE_TOKEN_SOURCE and FLY_API_TOKEN_SOURCE.
gitlab_governance_provision_dry_run:
  stage: governance
  image: python:3.12-alpine
  script:
    - python gitlab/scripts/provision_gitlab_governance.py --output-dir audit
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - audit/gitlab-governance-provisioning.json
      - audit/gitlab-governance-provisioning.md
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true

gitlab_governance_provision_apply:
  stage: governance
  image: python:3.12-alpine
  script:
    - python gitlab/scripts/provision_gitlab_governance.py --apply --output-dir audit
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - audit/gitlab-governance-provisioning.json
      - audit/gitlab-governance-provisioning.md
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: true

# Routes open issues labelled ia:* to their domain branch (see
# gitlab/docs/GITLAB_OPERATING_MODEL.md). Protected, idempotent, same
# GITLAB_PROVISIONING_TOKEN as the jobs above. Automatic like the governance
# dry-run above, for the same reason: route_issue_by_label.py gates every
# mutating call behind `if config.dry_run` too, so no branch/label/comment
# writes happen without --apply. `_apply` below (real writes) stays manual.
gitlab_route_issues_dry_run:
  stage: governance
  image: python:3.12-alpine
  script:
    - python gitlab/scripts/route_issue_by_label.py --output-dir audit
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - audit/gitlab-issue-routing.json
      - audit/gitlab-issue-routing.md
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
  allow_failure: true

gitlab_route_issues_apply:
  stage: governance
  image: python:3.12-alpine
  script:
    - python gitlab/scripts/route_issue_by_label.py --apply --output-dir audit
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - audit/gitlab-issue-routing.json
      - audit/gitlab-issue-routing.md
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: manual
  allow_failure: true
