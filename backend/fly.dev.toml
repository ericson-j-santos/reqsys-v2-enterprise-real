app = "reqsys-api-dev"
primary_region = "gru"
kill_signal = "SIGINT"
kill_timeout = "5s"

[build]
  dockerfile = "Dockerfile.fly"

[env]
  APP_ENV = "development"
  PUBLIC_ENVIRONMENT = "development"
  ALLOW_DEMO_LOGIN = "true"
  DATABASE_URL = "sqlite:////data/reqsys.db"
  JWT_EXP_MINUTES = "60"
  CORS_ORIGINS = "https://reqsys-app-dev.fly.dev,https://tieridev.duckdns.org,http://localhost:5173,http://localhost:8081"
  SDD_SPECS_PATH = "/app/specs"
  REQSYS_ML_REQUISITOS_MODO = "shadow"

[[mounts]]
  source = "reqsys_data_dev"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "15s"
    timeout = "5s"
    grace_period = "30s"
    method = "GET"
    path = "/health"
    protocol = "http"

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/runtime/health"
    protocol = "http"

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "45s"
    method = "GET"
    path = "/api/runtime/readiness"
    protocol = "http"

[[vm]]
  # 512mb bastava ate 2026-09-04; todo deploy DEV desde 2026-09-05 falha no
  # smoke pos-deploy (API nunca fica pronta) sem nenhuma mudanca de codigo de
  # backend em comum entre os commits afetados - indicio de OOM no boot com o
  # acumulo de dependencias dos ultimos incrementos. Sem acesso a flyctl
  # logs/status para confirmar a causa raiz; este aumento e mitigacao
  # best-effort, nao confirmacao do diagnostico.
  memory = "1024mb"
  cpu_kind = "shared"
  cpus = 1
