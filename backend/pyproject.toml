[tool.coverage.run]
source = ["app"]
branch = true
omit = [
  "app/__init__.py",
  "app/models/__init__.py",
  "app/db.py",
  "app/models/*.py",
  "app/schemas/*.py",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
precision = 2
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.*:",
  "raise NotImplementedError",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
asyncio_mode = "auto"

[tool.mutmut]
source_paths = ["app"]
only_mutate = ["app/core/*"]
pytest_add_cli_args_test_selection = ["tests"]
pytest_add_cli_args = ["-o", "pythonpath=../.."]
also_copy = [
  "copilot_memory_core",
  "copilot_memory_powerautomate_complete.py",
  "copilot_memory_simple_package.py",
  "data",
  "diagram_generator_portable",
  "ocr_evidencia",
  "token_broker",
  "wsjf_workbook_package.py",
]

[tool.ruff.lint.per-file-ignores]
"app/core/runtime_analytics.py" = ["E303", "E305"]
