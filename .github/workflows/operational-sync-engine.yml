name: Operational Sync Engine

on:
  pull_request:
    paths:
      - 'tools/operational_sync/**'
      - 'tests/test_operational_sync_engine.py'
      - '.github/workflows/operational-sync-engine.yml'
  workflow_dispatch:
    inputs:
      input_path:
        description: 'Arquivo JSON versionado com evidência operacional real'
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: operational-sync-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: Validate Operational Sync contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Testar contrato
        run: python -m unittest discover -s tests -p 'test_operational_sync_engine.py' -v

      - name: Gerar snapshot
        env:
          INPUT_PATH: ${{ github.event.inputs.input_path || '' }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ -n "$INPUT_PATH" ]]; then
            test -f "$INPUT_PATH"
            args+=(--input "$INPUT_PATH")
          fi
          python tools/operational_sync/operational_sync_engine.py             "${args[@]}"             --output artifacts/operational-sync-snapshot.json

      - name: Validar semântica fail-closed
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path('artifacts/operational-sync-snapshot.json').read_text())
          assert data['schema_version'] == '1.1.0'
          assert data['status'] in {'evidence_required', 'acao_requerida', 'estavel'}
          if data['tasks_total'] == 0:
              assert data['operational_evidence'] is False
              assert data['status'] == 'evidence_required'
          PY

      - name: Publicar snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: operational-sync-snapshot-${{ github.run_id }}
          path: artifacts/operational-sync-snapshot.json
          if-no-files-found: error
          retention-days: 30
