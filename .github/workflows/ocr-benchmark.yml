name: OCR Benchmark Gate
on:
  pull_request:
    paths:
      - 'backend/ocr_evidencia/**'
      - 'backend/app/ocr/**'
      - 'backend/app/api/ocr_review.py'
      - 'backend/ocr_tests/**'
      - 'frontend/src/views/OcrReviewView.vue'
      - 'frontend/src/services/ocrReview.js'
      - 'frontend/src/router/index.js'
      - 'frontend/src/constants/navCatalog.js'
      - 'scripts/ocr_*.py'
      - 'scripts/prepare_ocr_runtime_package.py'
      - 'scripts/validate_ocr_local_fallback_parity.py'
      - 'config/ocr-engine-lock.json'
      - 'config/ocr-build-toolchain.json'
      - 'tests/test_prepare_ocr_runtime_package.py'
      - 'tests/test_ocr_external_package_workflow.py'
      - 'tests/test_ocr_external_runtime_package.py'
      - 'tests/test_ocr_local_fallback_parity.py'
      - '.sdd/specs/ocr-wheel-reproducibility.*'
      - '.sdd/specs/ocr-*.requirements.md'
      - '.sdd/specs/ocr-*.spec.json'
      - 'benchmark/ocr/**'
      - '.github/actions/prepare-ocr-runtime/**'
      - '.github/workflows/ocr-benchmark.yml'
      - '.github/workflows/fly-dev-fast-deploy.yml'
      - '.github/workflows/fly-enterprise-sync.yml'
      - 'backend/Dockerfile'
      - 'backend/pyproject.toml'
      - 'backend/vendor/ocr-evidence-engine/**'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ocr-benchmark-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  OCR_ENGINE_SHA: '15dd067032d7c55e22186ef3587c0d694d0392fd'
jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
      - name: Instalar dependências mínimas do contrato OCR
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==9.0.3 \
            sqlalchemy==2.0.41 \
            cryptography==50.0.0 \
            pydantic==2.13.4 \
            pydantic-settings==2.7.1
      - name: Testar bounded context, criptografia e políticas
        working-directory: backend
        run: pytest -q ocr_tests
      - name: Provar fail-closed de datasets restritos no CI corporativo
        run: |
          set +e
          python scripts/ocr_dataset_policy.py midv-2020 --context corporate-ci --accepted; midv=$?
          python scripts/ocr_dataset_policy.py xfund-pt --context corporate-ci --accepted; xfund=$?
          python scripts/ocr_dataset_policy.py funsd --context corporate-ci --accepted; funsd=$?
          set -e
          test "$midv" -eq 3
          test "$xfund" -eq 3
          test "$funsd" -eq 3
  external-package-contract:
    name: OCR External Package Contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout ReqSys
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'

      - name: Instalar dependências mínimas do consumidor
        run: |
          python -m pip install --disable-pip-version-check \
            pytest==9.0.3 \
            sqlalchemy==2.0.41 \
            cryptography==50.0.0 \
            pydantic==2.13.4 \
            pydantic-settings==2.7.1

      - name: Isolar a cópia local e provar ausência do pacote
        shell: bash
        run: |
          set -euo pipefail
          test -d backend/ocr_evidencia
          mv backend/ocr_evidencia "$RUNNER_TEMP/ocr_evidencia_local_copy"
          set +e
          PYTHONPATH=backend python -c 'import ocr_evidencia' >/tmp/ocr-local-negative.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          echo "OCR_EXTERNAL_NEGATIVE_CONTROL_OK"

      - name: Preparar pacote OCR canônico e reproduzível
        id: ocr-package
        uses: ./.github/actions/prepare-ocr-runtime
        with:
          app-id: ${{ vars.REQSYS_STACK_REBASE_APP_ID }}
          private-key: ${{ secrets.REQSYS_STACK_REBASE_PRIVATE_KEY }}

      - name: Validar paridade do fallback local com engine pinado
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_ocr_local_fallback_parity.py \
            --local-root "$RUNNER_TEMP/ocr_evidencia_local_copy" \
            --engine-checkout .external/ocr-evidence-engine-a \
            --lock config/ocr-engine-lock.json \
            --reqsys-root . \
            --output artifacts/ocr-local-fallback-parity.json

      - name: Controle negativo de drift do fallback local
        shell: bash
        run: |
          set -euo pipefail
          tampered="$RUNNER_TEMP/ocr_evidencia_local_tampered"
          cp -a "$RUNNER_TEMP/ocr_evidencia_local_copy" "$tampered"
          printf '\n# drift-negative-control\n' >> "$tampered/dominio/nome.py"
          set +e
          python scripts/validate_ocr_local_fallback_parity.py \
            --local-root "$tampered" \
            --engine-checkout .external/ocr-evidence-engine-a \
            --lock config/ocr-engine-lock.json \
            --reqsys-root . > "$RUNNER_TEMP/ocr-parity-negative.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/ocr-parity-negative.log"
          test "$rc" -eq 3
          grep -q 'python_drift:dominio/nome.py' "$RUNNER_TEMP/ocr-parity-negative.log"
          echo "OCR_LOCAL_FALLBACK_DRIFT_NEGATIVE_CONTROL_OK"

      - name: Instalar somente o wheel canônico verificado
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.ocr-package.outputs.ocr-sha }}" = "$OCR_ENGINE_SHA"
          python -m pip install --disable-pip-version-check --no-deps backend/vendor/ocr-evidence-engine/*.whl

      - name: Provar origem externa e executar contratos do ReqSys
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=backend python - <<'PY'
          from pathlib import Path
          import ocr_evidencia

          origin = Path(ocr_evidencia.__file__).resolve()
          repository = Path.cwd().resolve()
          local_copy = repository / "backend" / "ocr_evidencia"
          external_checkout = repository / ".external" / "ocr-evidence-engine"

          if str(origin).startswith(str(local_copy)):
              raise SystemExit(f"ocr_origin_is_local_copy:{origin}")
          if str(origin).startswith(str(external_checkout)):
              raise SystemExit(f"ocr_origin_is_checkout_not_installed_package:{origin}")
          if "site-packages" not in origin.parts:
              raise SystemExit(f"ocr_origin_is_not_site_packages:{origin}")
          if ocr_evidencia.__version__ != "1.2.0":
              raise SystemExit(f"ocr_version_mismatch:{ocr_evidencia.__version__}")

          print(f"OCR_EXTERNAL_IMPORT_OK origin={origin.name} version={ocr_evidencia.__version__}")
          PY
          PYTHONPATH=backend python -m pytest -q backend/ocr_tests

      - name: Validar evidência durável do pacote OCR
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          bundle = Path("backend/vendor/ocr-evidence-engine")
          report_path = Path("artifacts/ocr-reproducibility-report.json")
          toolchain_path = Path("artifacts/ocr-build-toolchain.json")
          lock = json.loads(Path("config/ocr-engine-lock.json").read_text(encoding="utf-8"))
          report = json.loads(report_path.read_text(encoding="utf-8"))

          wheels = sorted(bundle.glob("*.whl"))
          if len(wheels) != 1:
              raise SystemExit(f"ocr_durable_artifact_wheel_count_invalid:{len(wheels)}")
          wheel = wheels[0]
          required = {
              wheel.name,
              "MANIFEST.sha256",
              "SHA256SUMS",
              "provenance.json",
          }
          actual = {path.name for path in bundle.iterdir() if path.is_file()}
          if actual != required:
              raise SystemExit(
                  "ocr_durable_artifact_file_set_mismatch:"
                  f"expected={sorted(required)}:actual={sorted(actual)}"
              )
          if not toolchain_path.is_file():
              raise SystemExit("ocr_durable_artifact_toolchain_missing")
          if report.get("source_sha") != lock["sha"]:
              raise SystemExit("ocr_durable_artifact_source_sha_mismatch")
          if report.get("byte_identical") is not True:
              raise SystemExit("ocr_durable_artifact_not_byte_identical")
          if report.get("negative_control_detected") is not True:
              raise SystemExit("ocr_durable_artifact_negative_control_missing")
          if report.get("build_a") != report.get("build_b"):
              raise SystemExit("ocr_durable_artifact_build_hashes_mismatch")

          expected_hashes = report["build_b"]
          expected_names = {wheel.name, "MANIFEST.sha256", "SHA256SUMS"}
          if set(expected_hashes) != expected_names:
              raise SystemExit("ocr_durable_artifact_report_file_set_mismatch")
          for name, expected_digest in expected_hashes.items():
              actual_digest = hashlib.sha256((bundle / name).read_bytes()).hexdigest()
              if actual_digest != expected_digest:
                  raise SystemExit(f"ocr_durable_artifact_hash_mismatch:{name}")

          if (bundle / "MANIFEST.sha256").read_bytes() != (bundle / "SHA256SUMS").read_bytes():
              raise SystemExit("ocr_durable_artifact_manifest_compatibility_mismatch")

          print(
              "OCR_DURABLE_ARTIFACT_OK "
              f"source_sha={report['source_sha']} "
              f"wheel_sha256={expected_hashes[wheel.name]} "
              f"manifest_sha256={expected_hashes['MANIFEST.sha256']}"
          )
          PY

      - name: Publicar bundle OCR reproduzível
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ocr-runtime-package-${{ github.sha }}
          path: |
            backend/vendor/ocr-evidence-engine/*.whl
            backend/vendor/ocr-evidence-engine/MANIFEST.sha256
            backend/vendor/ocr-evidence-engine/SHA256SUMS
            backend/vendor/ocr-evidence-engine/provenance.json
            artifacts/ocr-build-toolchain.json
            artifacts/ocr-reproducibility-report.json
          if-no-files-found: error
          retention-days: 90

  external-runtime-image-contract:
    name: OCR External Runtime Image Contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout ReqSys
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'

      - name: "Controle negativo: build externo sem wheel deve falhar"
        shell: bash
        run: |
          set -euo pipefail
          set +e
          docker build \
            --file backend/Dockerfile \
            --tag reqsys-ocr-negative:${{ github.sha }} \
            --build-arg "OCR_EXTERNAL_PACKAGE_REQUIRED=1" \
            --build-arg "OCR_ENGINE_SHA=$OCR_ENGINE_SHA" \
            --build-arg "OCR_ENGINE_VERSION=1.2.0" \
            backend > /tmp/ocr-negative-build.log 2>&1
          rc=$?
          set -e
          test "$rc" -ne 0
          echo "OCR_EXTERNAL_RUNTIME_NEGATIVE_CONTROL_OK"

      - name: Preparar pacote OCR externo
        id: ocr-runtime
        uses: ./.github/actions/prepare-ocr-runtime
        with:
          app-id: ${{ vars.REQSYS_STACK_REBASE_APP_ID }}
          private-key: ${{ secrets.REQSYS_STACK_REBASE_PRIVATE_KEY }}

      - name: Build da imagem com OCR externo obrigatório
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.ocr-runtime.outputs.ocr-sha }}" = "$OCR_ENGINE_SHA"
          docker build \
            --file backend/Dockerfile \
            --tag reqsys-ocr-external:${{ github.sha }} \
            --build-arg "GITHUB_SHA=${{ github.sha }}" \
            --build-arg "OCR_EXTERNAL_PACKAGE_REQUIRED=1" \
            --build-arg "OCR_ENGINE_SHA=${{ steps.ocr-runtime.outputs.ocr-sha }}" \
            --build-arg "OCR_ENGINE_VERSION=${{ steps.ocr-runtime.outputs.ocr-version }}" \
            backend

      - name: Provar import externo dentro da imagem
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --entrypoint python reqsys-ocr-external:${{ github.sha }} -c '
          from pathlib import Path
          import ocr_evidencia

          origin = Path(ocr_evidencia.__file__).resolve()
          if Path("/app/ocr_evidencia").exists():
              raise SystemExit("local_ocr_copy_present")
          if "site-packages" not in origin.parts:
              raise SystemExit(f"ocr_origin_not_site_packages:{origin}")
          if ocr_evidencia.__version__ != "1.2.0":
              raise SystemExit(f"ocr_version_mismatch:{ocr_evidencia.__version__}")
          print(f"OCR_EXTERNAL_RUNTIME_OK origin={origin.name} version={ocr_evidencia.__version__}")
          '

  synthetic-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
      - name: Instalar runtime OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por imagemagick poppler-utils fonts-dejavu-core
      - name: Executar CER, Exact Match e False AUTO
        run: |
          python scripts/ocr_benchmark.py --output artifacts/ocr-benchmark.json synthetic --workdir artifacts/ocr-work
      - name: Publicar evidência do benchmark
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ocr-benchmark
          path: artifacts/ocr-benchmark.json
          if-no-files-found: error
  evidence-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12.15'
      - name: Instalar runtime do Evidence Gate v2
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-por imagemagick poppler-utils fonts-dejavu-core
          python -m pip install --disable-pip-version-check reportlab==5.0.1
      - name: Executar os 10 cenários documentais governados
        run: |
          python scripts/ocr_evidence_gate_v2.py \
            --output artifacts/ocr-evidence-v2.json \
            --workdir artifacts/ocr-evidence-v2-work
      - name: Publicar evidência sem texto OCR bruto
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ocr-evidence-v2
          path: artifacts/ocr-evidence-v2.json
          if-no-files-found: error
