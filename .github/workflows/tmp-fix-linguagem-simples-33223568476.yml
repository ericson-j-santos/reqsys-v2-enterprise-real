name: Correção objetiva linguagem simples 33223568476

on:
  push:
    branches:
      - fix/linguagem-simples-33223568476

permissions:
  contents: write

jobs:
  corrigir:
    runs-on: ubuntu-24.04
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          ref: fix/linguagem-simples-33223568476
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Aplicar substituições objetivas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "frontend/src/components/PageHeader.vue": [
                  ('title="Pipeline"', 'title="Fluxo"'),
              ],
              "frontend/src/views/CodexView.vue": [
                  ('placeholder="Repositório, branch, fluxo de trabalho, requisito..."', 'placeholder="Repositório, versão de código, fluxo de trabalho, requisito..."'),
              ],
              "frontend/src/views/CoordenacaoAdrView.vue": [
                  ('titulo="Coordenação Geral de ADRs"', 'titulo="Coordenação Geral de Decisões de Arquitetura"'),
                  ('subtitulo="Cada ADR (001 a 012) tem um coordenador especialista; a coordenação geral classifica a demanda, aponta ADRs relacionados e detecta violações de gate em tempo real."', 'subtitulo="Cada decisão de arquitetura (001 a 012) tem um coordenador especialista; a coordenação geral classifica a demanda, aponta decisões relacionadas e detecta violações de validação em tempo real."'),
              ],
              "frontend/src/views/CopilotMemoryInstallerView.vue": [
                  ('title="Executor ALM"', 'title="Administração do ciclo de entrega"'),
              ],
              "frontend/src/views/HubLowCodeView.vue": [
                  ('label="HTTP POST URL do trigger"', 'label="Endereço para envio HTTP"'),
              ],
              "frontend/src/views/MonitoramentoOperacionalView.vue": [
                  ('Correlation analytics', 'Análise de correlação'),
                  ('Score de governança', 'Índice de governança'),
                  ('Status geral', 'Situação geral'),
                  ('Score atual', 'Índice atual'),
                  ('Merge estabilizado', 'Integração de alterações estabilizada'),
                  ('Histórico merge readiness', 'Histórico de prontidão da integração de alterações'),
              ],
              "frontend/src/views/RecomendacoesIAView.vue": [
                  ('Score pós-correção', 'Índice pós-correção'),
              ],
              "frontend/src/views/SpecsView.vue": [
                  ('Especificações de funcionalidades · my-first-spec-project', 'Especificações de funcionalidades · meu-primeiro-projeto'),
                  ('Título da feature *', 'Título da funcionalidade *'),
              ],
              "frontend/src/views/TaskConsoleView.vue": [
                  ('Status envio', 'Situação do envio'),
              ],
          }

          status_files = [
              "frontend/src/views/GovBIView.vue",
              "frontend/src/views/PainelIntegracaoView.vue",
              "frontend/src/views/PipelineView.vue",
              "frontend/src/views/RequisitosView.vue",
              "frontend/src/views/TaskConsoleView.vue",
          ]

          def replace_checked(path: Path, old: str, new: str):
              text = path.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"Texto esperado não encontrado em {path}: {old}")
              path.write_text(text.replace(old, new), encoding="utf-8")

          for file_name, changes in replacements.items():
              path = Path(file_name)
              for old, new in changes:
                  replace_checked(path, old, new)

          visible_status_patterns = [
              ('>Status<', '>Situação<'),
              ('label="Status"', 'label="Situação"'),
              ('title="Status"', 'title="Situação"'),
              ('subtitle="Status"', 'subtitle="Situação"'),
              ("title: 'Status'", "title: 'Situação'"),
              ('title: "Status"', 'title: "Situação"'),
              ("text: 'Status'", "text: 'Situação'"),
              ('text: "Status"', 'text: "Situação"'),
          ]

          for file_name in status_files:
              path = Path(file_name)
              text = path.read_text(encoding="utf-8")
              original = text
              for old, new in visible_status_patterns:
                  text = text.replace(old, new)
              if text == original:
                  raise SystemExit(f"Nenhum rótulo Status alterado em {file_name}")
              path.write_text(text, encoding="utf-8")

          painel = Path("frontend/src/views/PainelIntegracaoView.vue")
          text = painel.read_text(encoding="utf-8")
          text = text.replace(':title="itemSelecionado.status"', ':title="situacaoItemSelecionado"')
          marker = "const itemSelecionado = ref(null)"
          if marker not in text:
              raise SystemExit("Marcador itemSelecionado não encontrado")
          if "const situacaoItemSelecionado = computed" not in text:
              text = text.replace(
                  marker,
                  marker + "\nconst situacaoItemSelecionado = computed(() => itemSelecionado.value?.status || '—')",
                  1,
              )
          painel.write_text(text, encoding="utf-8")
          PY

      - name: Validar verificador
        run: node --test frontend/scripts/validate-user-facing-language.test.mjs

      - name: Validar textos apresentados ao usuário
        run: node frontend/scripts/validate-user-facing-language.mjs

      - name: Registrar correção
        shell: bash
        run: |
          rm .github/workflows/tmp-fix-linguagem-simples-33223568476.yml
          git config user.name "reqsys-ci-bot"
          git config user.email "actions@users.noreply.github.com"
          git add frontend/src .github/workflows/tmp-fix-linguagem-simples-33223568476.yml
          git diff --cached --check
          git commit -m "fix(ux): corrigir termos rejeitados pelo gate de linguagem simples"
          git push origin HEAD:fix/linguagem-simples-33223568476
