name: OCR Private Evidence Proxy 20261020

on:
  push:
    branches:
      - audit/ocr-private-evidence-proxy-20261020-f487837f
    paths:
      - .github/workflows/ocr-private-evidence-proxy-20261020.yml

permissions:
  contents: read

concurrency:
  group: ocr-private-evidence-proxy-20261020-f487837f
  cancel-in-progress: false

env:
  REQSYS_MAIN_SHA: f487837fa553a0f5f8af753963539e60a79dbe19
  OCR_REPOSITORY: ericson-j-santos/ocr-evidence-engine
  OCR_SOURCE_SHA: 2e0a860de2856f5c1711f4f9eabd1e80c6e43781
  OCR_MAIN_SHA: baa1f539c148be67ecea891f7037b97b987d5ee5
  OCR_CI_BLOB_SHA: fa8ff34ce6aec43af223dd70a53df5135076150c
  CORRELATION_ID: ocr-private-evidence-proxy-20261020-f487837f

jobs:
  preflight:
    name: Bind public zero-cost proxy scope
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify public repository, immutable main and additive audit scope
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 0
          script: |
            const {owner, repo} = context.repo;
            const expectedRepo = 'ericson-j-santos/reqsys-v2-enterprise-real';
            const expectedMain = 'f487837fa553a0f5f8af753963539e60a79dbe19';
            const expectedBranch = 'audit/ocr-private-evidence-proxy-20261020-f487837f';
            const expectedFile = '.github/workflows/ocr-private-evidence-proxy-20261020.yml';
            if (owner + '/' + repo !== expectedRepo) throw new Error('proxy_repository_mismatch');
            if (context.payload.repository.private !== false) throw new Error('proxy_repository_must_be_public');
            if (context.actor !== 'ericson-j-santos') throw new Error('proxy_actor_mismatch');
            if (context.ref !== 'refs/heads/' + expectedBranch) throw new Error('proxy_branch_mismatch');
            const main = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            if (main.data.object.sha !== expectedMain) throw new Error('reqsys_main_changed');
            const head = await github.rest.git.getRef({owner, repo, ref: 'heads/' + expectedBranch});
            if (head.data.object.sha !== context.sha) throw new Error('proxy_head_mismatch');
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: expectedMain + '...' + context.sha
            });
            if (comparison.data.behind_by !== 0 ||
                comparison.data.files.length !== 1 ||
                comparison.data.files[0].filename !== expectedFile ||
                comparison.data.files[0].status !== 'added') {
              throw new Error('proxy_scope_not_exactly_one_added_workflow');
            }
            core.info('OCR_PROXY_PUBLIC_ZERO_COST_SCOPE_OK ' + context.sha);

  test:
    name: Private engine tests / Python ${{ matrix.python-version }}
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - name: Mint read-only token for private OCR source
        id: ocr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.REQSYS_STACK_REBASE_APP_ID }}
          private-key: ${{ secrets.REQSYS_STACK_REBASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ocr-evidence-engine
          permission-contents: read
      - name: Checkout exact private OCR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ericson-j-santos/ocr-evidence-engine
          ref: 2e0a860de2856f5c1711f4f9eabd1e80c6e43781
          token: ${{ steps.ocr-token.outputs.token }}
          path: .external/ocr-engine
          persist-credentials: false
          fetch-depth: 0
      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify exact private source and current refs
        shell: bash
        env:
          GH_TOKEN: ${{ steps.ocr-token.outputs.token }}
        working-directory: .external/ocr-engine
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OCR_SOURCE_SHA"
          test "$(git hash-object .github/workflows/ci.yml)" = "$OCR_CI_BLOB_SHA"
          test "$(gh api repos/$OCR_REPOSITORY/git/ref/heads/main --jq '.object.sha')" = "$OCR_MAIN_SHA"
          test "$(gh api repos/$OCR_REPOSITORY/git/ref/heads/audit/baseline92-reference-v1.0-20261020 --jq '.object.sha')" = "$OCR_SOURCE_SHA"
      - name: Install exact development dependencies
        working-directory: .external/ocr-engine
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Compile
        working-directory: .external/ocr-engine
        run: python -m compileall -q src scripts
      - name: Run complete test suite
        working-directory: .external/ocr-engine
        run: python -m pytest -q
      - name: Dataset policy negative control
        working-directory: .external/ocr-engine
        shell: bash
        run: |
          set +e
          python scripts/ocr_dataset_policy.py midv-2020 --context corporate-ci --accepted
          code=$?
          set -e
          test "$code" -eq 3
      - name: Build package
        working-directory: .external/ocr-engine
        run: python -m build

  recover-evidence:
    name: Recover sanitized private CI evidence
    needs: [preflight, test]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Mint read-only token for private OCR source
        id: ocr-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1
        with:
          app-id: ${{ vars.REQSYS_STACK_REBASE_APP_ID }}
          private-key: ${{ secrets.REQSYS_STACK_REBASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ocr-evidence-engine
          permission-contents: read
      - name: Checkout exact private OCR source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ericson-j-santos/ocr-evidence-engine
          ref: 2e0a860de2856f5c1711f4f9eabd1e80c6e43781
          token: ${{ steps.ocr-token.outputs.token }}
          path: .external/ocr-engine
          persist-credentials: false
          fetch-depth: 0
      - name: Configure Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Verify exact private source and current refs
        shell: bash
        env:
          GH_TOKEN: ${{ steps.ocr-token.outputs.token }}
        working-directory: .external/ocr-engine
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$OCR_SOURCE_SHA"
          test "$(git hash-object .github/workflows/ci.yml)" = "$OCR_CI_BLOB_SHA"
          test "$(gh api repos/$OCR_REPOSITORY/git/ref/heads/main --jq '.object.sha')" = "$OCR_MAIN_SHA"
          test "$(gh api repos/$OCR_REPOSITORY/git/ref/heads/audit/baseline92-reference-v1.0-20261020 --jq '.object.sha')" = "$OCR_SOURCE_SHA"
      - name: Install OCR runtime and development dependencies
        working-directory: .external/ocr-engine
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             tesseract-ocr tesseract-ocr-por imagemagick poppler-utils fonts-dejavu-core
          python -m pip install --upgrade pip build
          python -m pip install -e ".[dev]"
          mkdir -p artifacts proxy-work "$GITHUB_WORKSPACE/proxy-evidence"
      - name: Validate baseline92 contract disposition with negative controls
        working-directory: .external/ocr-engine
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_baseline92_contract_disposition.py             --repository-root .             --output "$RUNNER_TEMP/contract-disposition.json" >/dev/null
          python -m pytest -q tests/test_baseline92_contract_disposition.py
      - name: Positive synthetic benchmark
        working-directory: .external/ocr-engine
        run: |
          python scripts/ocr_benchmark.py             --output artifacts/ocr-benchmark.json             synthetic             --workdir artifacts/ocr-work
      - name: Benchmark negative gate control
        working-directory: .external/ocr-engine
        shell: bash
        run: |
          set -euo pipefail
          printf '%s
' '{"expected":"MARIA SILVA","predicted":"MAR1A SILVA","state":"AUTO"}' > artifacts/negative.jsonl
          set +e
          python scripts/ocr_benchmark.py             --output artifacts/negative-gate.json             --exact-min 0             --cer-max 1             --false-auto-max 0             evaluate artifacts/negative.jsonl
          code=$?
          set -e
          test "$code" -eq 2
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("artifacts/negative-gate.json").read_text(encoding="utf-8"))
          assert payload["gate"] == "FAIL"
          assert payload["metrics"]["false_auto_total"] == 1
          PY
      - name: Build and verify private distribution without publishing private bytes
        working-directory: .external/ocr-engine
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/distribution
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export PYTHONHASHSEED=0
          python -m build --wheel --outdir artifacts/distribution
          python scripts/ocr_distribution_evidence.py generate             --bundle-dir artifacts/distribution             --repository "$OCR_REPOSITORY"             --git-sha "$OCR_SOURCE_SHA"
          python scripts/ocr_distribution_evidence.py verify             --bundle-dir artifacts/distribution             --expected-repository "$OCR_REPOSITORY"             --expected-git-sha "$OCR_SOURCE_SHA"
          cp -a artifacts/distribution "$RUNNER_TEMP/tampered-distribution"
          python - <<'PY'
          import os
          from pathlib import Path
          root = Path(os.environ["RUNNER_TEMP"]) / "tampered-distribution"
          wheel = next(root.glob("*.whl"))
          with wheel.open("ab") as handle:
              handle.write(b"TAMPER")
          PY
          set +e
          output="$(python scripts/ocr_distribution_evidence.py verify             --bundle-dir "$RUNNER_TEMP/tampered-distribution"             --expected-repository "$OCR_REPOSITORY"             --expected-git-sha "$OCR_SOURCE_SHA" 2>&1)"
          code=$?
          set -e
          printf '%s
' "$output"
          test "$code" -eq 2
          printf '%s
' "$output" | grep -Eq 'code=(size_mismatch|sha256_mismatch)'
          WHEEL="$(find artifacts/distribution -maxdepth 1 -type f -name 'ocr_evidence_engine-*.whl' -print -quit)"
          test -n "$WHEEL"
          python -m venv "$RUNNER_TEMP/ocr-consumer-venv"
          "$RUNNER_TEMP/ocr-consumer-venv/bin/python" -m pip install --no-deps "$WHEEL"
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/ocr-consumer-venv/bin/python" - <<'PY'
          from ocr_evidencia import __version__
          from ocr_evidencia.dominio.nome import EstadoConsensoNome, LeituraOCRNome, consensuar_nome
          assert __version__ == "1.2.0"
          result = consensuar_nome([
              LeituraOCRNome("MARIA SILVA", 1.0, origem="proxy-a"),
              LeituraOCRNome("MARIA SILVA", 1.0, origem="proxy-b"),
              LeituraOCRNome("MARIA SILVA", 1.0, origem="proxy-c"),
          ])
          assert result.valor == "MARIA SILVA"
          assert result.estado is EstadoConsensoNome.AUTO
          print("EXTERNAL_CONSUMER_OK")
          PY
      - name: Gold standard, reproducibility and negative self-test
        working-directory: .external/ocr-engine
        shell: bash
        run: |
          set -euo pipefail
          python scripts/gold_standard_gate.py             --expected-sha "$OCR_SOURCE_SHA"             --output artifacts/gold-standard.json
          mkdir -p artifacts/repro/a artifacts/repro/b
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          export PYTHONHASHSEED=0
          python -m build --wheel --outdir artifacts/repro/a
          python -m build --wheel --outdir artifacts/repro/b
          A="$(find artifacts/repro/a -maxdepth 1 -type f -name '*.whl' -print -quit)"
          B="$(find artifacts/repro/b -maxdepth 1 -type f -name '*.whl' -print -quit)"
          test -n "$A" && test -n "$B"
          cmp "$A" "$B"
          sha256sum "$A" "$B" > "$RUNNER_TEMP/reproducible-wheel.sha256"
          trap 'rm -f src/ocr_evidencia/_gold_negative_control.py' EXIT
          printf '%s
' 'import socket' > src/ocr_evidencia/_gold_negative_control.py
          set +e
          output="$(python scripts/gold_standard_gate.py --expected-sha "$OCR_SOURCE_SHA" 2>&1)"
          code=$?
          set -e
          printf '%s
' "$output"
          test "$code" -eq 2
          printf '%s
' "$output" | grep -q 'network_import_forbidden:'
          rm -f src/ocr_evidencia/_gold_negative_control.py
          trap - EXIT
          python scripts/gold_standard_gate.py             --expected-sha "$OCR_SOURCE_SHA"             --output artifacts/gold-standard.json
      - name: Build sanitized evidence only
        working-directory: .external/ocr-engine
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          root = Path.cwd()
          evidence_root = Path(os.environ["GITHUB_WORKSPACE"]) / "proxy-evidence"
          contract = json.loads((Path(os.environ["RUNNER_TEMP"]) / "contract-disposition.json").read_text())
          benchmark = json.loads((root / "artifacts/ocr-benchmark.json").read_text())
          negative = json.loads((root / "artifacts/negative-gate.json").read_text())
          gold_path = root / "artifacts/gold-standard.json"
          distribution = sorted((root / "artifacts/distribution").iterdir())
          wheels = [p for p in distribution if p.suffix == ".whl"]
          assert len(wheels) == 1
          repro_a = next((root / "artifacts/repro/a").glob("*.whl"))
          repro_b = next((root / "artifacts/repro/b").glob("*.whl"))
          assert repro_a.read_bytes() == repro_b.read_bytes()
          assert contract["status"] == "VALIDATED_REFERENCE_ONLY_NO_MIGRATION"
          assert contract["current_engine"]["baseline_functional_certified"] is False
          assert contract["current_engine"]["semantic_equivalence"] == "NOT_PROVEN"
          assert contract["historical_test_bodies_executed_by_this_validation"] == 0
          assert contract["decisions"] == {"MIGRATE": 0, "PRESERVE_REFERENCE_ONLY": 5, "SEPARATE": 3}
          assert len(contract["negative_controls_passed"]) == 21
          assert negative["gate"] == "FAIL"
          assert negative["metrics"]["false_auto_total"] == 1

          def digest(path):
              return hashlib.sha256(path.read_bytes()).hexdigest()

          payload = {
              "schema_version": "1.0.0",
              "correlation_id": os.environ["CORRELATION_ID"],
              "public_executor_repository": os.environ["GITHUB_REPOSITORY"],
              "public_executor_sha": os.environ["GITHUB_SHA"],
              "public_runner": "ubuntu-latest",
              "cost_classification": "COST_ZERO_CONFIRMED_PUBLIC_STANDARD_RUNNER",
              "private_source": {
                  "repository": os.environ["OCR_REPOSITORY"],
                  "commit_sha": os.environ["OCR_SOURCE_SHA"],
                  "main_sha_observed": os.environ["OCR_MAIN_SHA"],
                  "ci_blob_sha": os.environ["OCR_CI_BLOB_SHA"],
                  "raw_private_bytes_uploaded": False,
              },
              "matrix": {
                  "python_versions_required": ["3.11", "3.12"],
                  "evidence_job_depends_on_matrix_success": True,
              },
              "contract_disposition": {
                  "status": contract["status"],
                  "decisions": contract["decisions"],
                  "negative_controls_passed": len(contract["negative_controls_passed"]),
                  "baseline_functional_certified": contract["current_engine"]["baseline_functional_certified"],
                  "semantic_equivalence": contract["current_engine"]["semantic_equivalence"],
                  "historical_test_bodies_executed": contract["historical_test_bodies_executed_by_this_validation"],
              },
              "benchmark": {
                  "gate": benchmark.get("gate"),
                  "metrics": benchmark.get("metrics", {}),
                  "sha256": digest(root / "artifacts/ocr-benchmark.json"),
                  "negative_gate_control_passed": True,
                  "negative_gate_sha256": digest(root / "artifacts/negative-gate.json"),
              },
              "distribution": {
                  "verified": True,
                  "tamper_negative_control_passed": True,
                  "external_consumer_passed": True,
                  "files": [
                      {"name": p.name, "size": p.stat().st_size, "sha256": digest(p)}
                      for p in distribution
                  ],
                  "private_distribution_uploaded": False,
              },
              "gold_standard": {
                  "positive_gate_passed": True,
                  "negative_network_import_control_passed": True,
                  "final_revalidation_passed": True,
                  "gold_evidence_sha256": digest(gold_path),
                  "reproducible_wheel_byte_identical": True,
                  "reproducible_wheel_sha256": digest(repro_a),
              },
              "production_touched": False,
              "private_repository_mutated": False,
              "pin_changed": False,
          }
          evidence_root.mkdir(parents=True, exist_ok=True)
          out = evidence_root / "evidence.json"
          out.write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          (evidence_root / "SHA256SUMS").write_text(
              digest(out) + "  evidence.json\n", encoding="utf-8"
          )
          print(json.dumps(payload, sort_keys=True))
          PY
      - name: Fail closed against accidental private-byte publication
        shell: bash
        run: |
          set -euo pipefail
          test "$(find proxy-evidence -type f | wc -l)" -eq 2
          test -f proxy-evidence/evidence.json
          test -f proxy-evidence/SHA256SUMS
          test "$(find proxy-evidence -type f \( -name '*.py' -o -name '*.whl' -o -name '*.zip' \) | wc -l)" -eq 0
          test "$(du -sb proxy-evidence | cut -f1)" -lt 100000
          sha256sum -c proxy-evidence/SHA256SUMS
          rm -rf .external
          test ! -e .external
      - name: Re-read ReqSys main after private validation
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        with:
          retries: 0
          script: |
            const {owner, repo} = context.repo;
            const main = await github.rest.git.getRef({owner, repo, ref: 'heads/main'});
            if (main.data.object.sha !== 'f487837fa553a0f5f8af753963539e60a79dbe19') {
              throw new Error('reqsys_main_changed_during_proxy');
            }
            core.info('OCR_PROXY_REQSYS_MAIN_UNCHANGED');
      - name: Upload sanitized evidence only
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ocr-private-evidence-proxy-${{ github.run_id }}
          path: proxy-evidence/
          if-no-files-found: error
          retention-days: 7
