name: Observability STG PROD Contract

on:
  pull_request:
    paths:
      - "services/environment-observability-api/compose.observability.stg.yml"
      - "services/environment-observability-api/compose.observability.prod.yml"
      - "services/environment-observability-api/observability/stg/**"
      - "services/environment-observability-api/observability/prod/**"
      - "services/environment-observability-api/tests/test_stg_prod_observability_contract.py"
      - "docs/padrao-ouro/OBSERVABILITY_STG_PROD_ALERTING.md"
      - ".github/workflows/observability-stg-prod-contract.yml"
  push:
    branches: [main, feat/observability-stg-prod-alerts-20260919]
    paths:
      - "services/environment-observability-api/compose.observability.stg.yml"
      - "services/environment-observability-api/compose.observability.prod.yml"
      - "services/environment-observability-api/observability/stg/**"
      - "services/environment-observability-api/observability/prod/**"
      - "services/environment-observability-api/tests/test_stg_prod_observability_contract.py"
      - "docs/padrao-ouro/OBSERVABILITY_STG_PROD_ALERTING.md"
      - ".github/workflows/observability-stg-prod-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: observability-stg-prod-contract-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-stg-prod-contract:
    name: Validate OBS-P1 STG/PROD contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install test dependencies
        run: python -m pip install --upgrade pytest pyyaml

      - name: Run STG/PROD observability contract tests
        run: python -m pytest services/environment-observability-api/tests/test_stg_prod_observability_contract.py -q
