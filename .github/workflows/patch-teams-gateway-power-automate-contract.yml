name: Aplicar correção do contrato Power Automate no gateway

on:
  push:
    branches:
      - fix/teams-gateway-power-automate-contract
    paths:
      - ".github/workflows/patch-teams-gateway-power-automate-contract.yml"

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/teams-gateway-power-automate-contract
          fetch-depth: 0

      - name: Aplicar patch determinístico
        run: python tools/patch_teams_gateway_power_automate_contract.py

      - name: Validar sintaxe e diff
        run: |
          python -m py_compile backend/app/services/teams_gateway.py backend/tests/test_teams_gateway_service.py
          git diff --check

      - name: Commitar correção na mesma branch
        run: |
          git config user.name "reqsys-automation"
          git config user.email "60470500+ericson-j-santos@users.noreply.github.com"
          git add backend/app/services/teams_gateway.py backend/tests/test_teams_gateway_service.py
          git commit -m "fix(teams): adaptar gateway ao contrato Power Automate governado"
          git push origin HEAD:fix/teams-gateway-power-automate-contract
