name: Agent Build Homologation BACEN Gate Artifact

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-build-homologation-bacen-gate-artifact
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'agent/homologation-bacen-prod-gate-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/homologation-bacen-prod-gate-v1
          fetch-depth: 0
          persist-credentials: false

      - name: Apply strict patch locally
        run: python scripts/agent_patch_homologation_bacen_gate.py

      - name: Validate generated contract
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('.github/workflows/fly-environment-homologation-gate.yml').read_text()
          required = [
              '# REQSYS_PRODUCTION_GOVERNANCE_GATE',
              '  production-gate:',
              "inputs.environment == 'prod' && inputs.deploy == true",
              'uses: ./.github/workflows/bacen-production-hard-gate.yml',
              '      - production-gate',
              "needs.production-gate.result == 'success' || needs.production-gate.result == 'skipped'",
          ]
          missing = [item for item in required if item not in text]
          if missing:
              raise SystemExit(f'missing contract markers: {missing}')
          if text.index('  production-gate:') > text.index('  deploy:'):
              raise SystemExit('production gate must precede deploy')
          PY

      - name: Publish generated workflow
        uses: actions/upload-artifact@v4
        with:
          name: homologation-bacen-gate-generated
          path: .github/workflows/fly-environment-homologation-gate.yml
          if-no-files-found: error
          retention-days: 7
