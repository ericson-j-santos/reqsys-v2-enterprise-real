name: Ops Diagnose PC24x7 Teams E2E 20260919

on:
  push:
    branches:
      - ops/diag-pc24x7-teams-20260919
    paths:
      - ".github/workflows/ops-diag-pc24x7-teams-20260919.yml"

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      REQSYS_API_BASE_URL: https://reqsys-api-dev.fly.dev
      COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
      PC24X7_TEAMS_E2E_CORRELATION_ID: pc24x7-diag-${{ github.run_id }}-${{ github.run_attempt }}
      PC24X7_TEAMS_E2E_PROVIDER: gemini
      PC24X7_TEAMS_E2E_MODEL: gemini-2.5-flash

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Executar E2E efêmero atual
        run: |
          python scripts/pc24x7_teams_ephemeral_e2e.py             --evidence-path artifacts/pc24x7-teams-ephemeral-e2e/evidence.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pc24x7-teams-current-diagnostic-${{ github.run_id }}
          path: artifacts/pc24x7-teams-ephemeral-e2e/evidence.json
          if-no-files-found: error
          retention-days: 7
