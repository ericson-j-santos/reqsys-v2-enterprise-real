name: Actions Dispatcher — ReqSys

on:
  repository_dispatch:
    types:
      - governed_post_merge_validation
  workflow_dispatch:
    inputs:
      ref:
        description: "Branch, tag ou SHA para executar"
        required: false
        default: "main"
      mode:
        description: "Modo de disparo: all, essential ou post-merge"
        required: false
        default: "essential"
      merge_sha:
        description: "Merge SHA para recuperação post-merge"
        required: false
      pr_number:
        description: "PR mergeada para recuperação post-merge"
        required: false
      head_sha:
        description: "HEAD pré-merge para recuperação post-merge"
        required: false
      test_case:
        description: "Controle interno: normal, replay ou missing-required-workflow"
        required: false
        default: "normal"

permissions:
  actions: write
  contents: write
  pull-requests: read
  issues: write

concurrency:
  group: actions-dispatcher-${{ github.event.client_payload.merge_sha || github.event.inputs.merge_sha || github.event.inputs.ref || github.run_id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.mode != 'post-merge'
    name: Disparar workflows governados manualmente
    runs-on: ubuntu-latest
    steps:
      - name: Definir alvo e modo
        id: config
        shell: bash
        run: |
          set -euo pipefail
          REF="${{ github.event.inputs.ref || 'main' }}"
          MODE="${{ github.event.inputs.mode || 'essential' }}"
          echo "ref=$REF" >> "$GITHUB_OUTPUT"
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"

      - name: Disparar workflows
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER_REPO: ${{ github.repository }}
          TARGET_REF: ${{ steps.config.outputs.ref }}
          MODE: ${{ steps.config.outputs.mode }}
        shell: bash
        run: |
          set -uo pipefail

          essential_workflows=(
            "ci.yml"
            "governance-quality-gates.yml"
            "governanca-padrao-ouro.yml"
            "codex-local-online.yml"
          )

          all_workflows=(
            "ci.yml"
            "governance-quality-gates.yml"
            "governanca-padrao-ouro.yml"
            "codex-local-online.yml"
            "nginx-security.yml"
            "validar-painel-ciclo.yml"
            "deploy-reqsys-showcase-pages.yml"
          )

          if [[ "$MODE" == "all" ]]; then
            workflows=("${all_workflows[@]}")
          else
            workflows=("${essential_workflows[@]}")
          fi

          echo "## Actions Dispatcher" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Execução somente manual; gatilhos automáticos redundantes foram removidos." >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Campo | Valor |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Ref | $TARGET_REF |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Modo | $MODE |" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Workflow | Status |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---:|" >> "$GITHUB_STEP_SUMMARY"

          failures=0
          for workflow in "${workflows[@]}"; do
            if ! gh api "repos/$OWNER_REPO/actions/workflows/$workflow" --silent >/dev/null 2>&1; then
              echo "| $workflow | not_found |" >> "$GITHUB_STEP_SUMMARY"
              continue
            fi

            if gh workflow run "$workflow" --repo "$OWNER_REPO" --ref "$TARGET_REF"; then
              echo "| $workflow | dispatched |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "| $workflow | dispatch_failed |" >> "$GITHUB_STEP_SUMMARY"
              failures=$((failures + 1))
            fi
          done

          if [[ "$failures" -gt 0 ]]; then
            echo "Dispatcher concluiu com $failures falha(s) de disparo. Verifique se os workflows possuem workflow_dispatch habilitado." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

  materialize-post-merge:
    if: github.event_name == 'repository_dispatch' || github.event.inputs.mode == 'post-merge'
    name: Materialize exact-SHA post-merge evidence
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Dispatch, wait, validate and clean temporary ref
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const payload = context.eventName === 'repository_dispatch'
              ? (context.payload.client_payload || {})
              : (context.payload.inputs || {});

            const mergeSha = String(payload.merge_sha || '').trim().toLowerCase();
            const headSha = String(payload.head_sha || '').trim().toLowerCase();
            const prNumber = Number(payload.pr_number);
            const testCase = String(payload.test_case || 'normal').trim();
            const allowedTestCases = new Set(['normal', 'replay', 'missing-required-workflow']);
            const shaPattern = /^[0-9a-f]{40}$/;
            const evidence = {
              schema_version: '1.0.0',
              generated_at: new Date().toISOString(),
              repository: context.repo.owner + '/' + context.repo.repo,
              event_name: context.eventName,
              merge_sha: mergeSha,
              head_sha: headSha,
              pr_number: prNumber,
              test_case: testCase,
              required_workflows: [],
              main_validation: null,
              dispatches_created: [],
              reused_run_ids: [],
              negative_control_detected: false,
              temporary_ref: null,
              replay_safe: true,
              production_touched: false,
              secrets_exposed: false,
              status: 'running',
            };

            fs.mkdirSync('audit', { recursive: true });
            const required = [
              { file: 'ci.yml', name: 'CI — ReqSys v2 Enterprise' },
              { file: 'governance-quality-gates.yml', name: 'Governance Quality Gates' },
              { file: 'governanca-padrao-ouro.yml', name: 'Governança Padrão Ouro' },
            ];
            if (testCase === 'missing-required-workflow') {
              required.push({
                file: '__missing-required-workflow-control__.yml',
                name: 'Missing Required Workflow — negative control',
                negative_control: true,
              });
            }
            const mainValidation = {
              file: 'main-post-merge-validation.yml',
              name: 'Main Post-Merge Validation',
            };
            const maxWaitMs = 20 * 60 * 1000;
            const pollMs = 10000;
            const temporaryBranch = 'post-merge-validation/' + mergeSha;
            const temporaryRef = 'heads/' + temporaryBranch;
            const { owner, repo } = context.repo;
            let refReady = false;

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            async function listRuns() {
              return await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                head_sha: mergeSha,
                per_page: 100,
              });
            }

            function matchingRuns(runs, workflowName, requiredEvent = null) {
              return runs
                .filter((run) => run.name === workflowName)
                .filter((run) => requiredEvent === null || run.event === requiredEvent)
                .sort((a, b) => String(b.created_at).localeCompare(String(a.created_at)));
            }

            function classify(matches) {
              const success = matches.find(
                (run) => run.status === 'completed' && run.conclusion === 'success'
              );
              if (success) return { state: 'success', run: success };
              const active = matches.find((run) => run.status !== 'completed');
              if (active) return { state: 'active', run: active };
              if (matches.length > 0) return { state: 'failed', run: matches[0] };
              return { state: 'missing', run: null };
            }

            async function waitFor(workflows, requiredEvent = null) {
              const deadline = Date.now() + maxWaitMs;
              while (Date.now() < deadline) {
                const runs = await listRuns();
                const states = workflows.map((workflow) => {
                  const matches = matchingRuns(runs, workflow.name, requiredEvent);
                  return { workflow, ...classify(matches) };
                });
                const failed = states.find((item) => item.state === 'failed');
                if (failed) {
                  throw new Error(
                    'POST_MERGE_WORKFLOW_FAILED ' + failed.workflow.name +
                    ' run=' + failed.run.id +
                    ' conclusion=' + String(failed.run.conclusion)
                  );
                }
                if (states.every((item) => item.state === 'success')) return states;
                await sleep(pollMs);
              }
              throw new Error('POST_MERGE_WORKFLOW_TIMEOUT');
            }

            try {
              if (!shaPattern.test(mergeSha)) throw new Error('MERGE_SHA_INVALID');
              if (!shaPattern.test(headSha)) throw new Error('HEAD_SHA_INVALID');
              if (!Number.isInteger(prNumber) || prNumber <= 0) throw new Error('PR_NUMBER_INVALID');
              if (!allowedTestCases.has(testCase)) throw new Error('TEST_CASE_INVALID');

              const { data: pr } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              if (!pr.merged) throw new Error('PR_NOT_MERGED');
              if (String(pr.merge_commit_sha || '').toLowerCase() !== mergeSha) {
                throw new Error('MERGE_SHA_DOES_NOT_MATCH_PR');
              }
              if (String(pr.head.sha || '').toLowerCase() !== headSha) {
                throw new Error('HEAD_SHA_DOES_NOT_MATCH_PR');
              }

              try {
                const existing = await github.rest.git.getRef({ owner, repo, ref: temporaryRef });
                if (String(existing.data.object.sha || '').toLowerCase() !== mergeSha) {
                  throw new Error('TEMP_REF_SHA_MISMATCH');
                }
              } catch (error) {
                if (error.status !== 404) throw error;
                await github.rest.git.createRef({
                  owner,
                  repo,
                  ref: 'refs/' + temporaryRef,
                  sha: mergeSha,
                });
              }
              refReady = true;
              evidence.temporary_ref = temporaryBranch;

              let runs = await listRuns();
              for (const workflow of required) {
                const state = classify(matchingRuns(runs, workflow.name));
                if (state.state === 'failed') {
                  throw new Error('EXISTING_POST_MERGE_FAILURE ' + workflow.name + ' run=' + state.run.id);
                }
                if (state.state === 'success') {
                  evidence.reused_run_ids.push(state.run.id);
                  continue;
                }
                if (state.state === 'missing' && workflow.negative_control === true) {
                  throw new Error('NEGATIVE_CONTROL_REQUIRED_WORKFLOW_MISSING');
                }
                if (state.state === 'missing') {
                  await github.rest.actions.createWorkflowDispatch({
                    owner,
                    repo,
                    workflow_id: workflow.file,
                    ref: temporaryBranch,
                  });
                  evidence.dispatches_created.push(workflow.name);
                }
              }

              const requiredStates = await waitFor(required);
              evidence.required_workflows = requiredStates.map((item) => ({
                name: item.workflow.name,
                run_id: item.run.id,
                event: item.run.event,
                conclusion: item.run.conclusion,
                head_sha: item.run.head_sha,
                html_url: item.run.html_url,
              }));

              runs = await listRuns();
              const existingMain = classify(matchingRuns(runs, mainValidation.name, 'workflow_dispatch'));
              if (existingMain.state === 'failed') {
                throw new Error('EXISTING_MAIN_VALIDATION_FAILURE run=' + existingMain.run.id);
              }
              if (existingMain.state === 'success') {
                evidence.reused_run_ids.push(existingMain.run.id);
              }
              if (existingMain.state === 'missing') {
                await github.rest.actions.createWorkflowDispatch({
                  owner,
                  repo,
                  workflow_id: mainValidation.file,
                  ref: temporaryBranch,
                  inputs: { commit_sha: mergeSha },
                });
                evidence.dispatches_created.push(mainValidation.name);
              }

              const mainStates = await waitFor([mainValidation], 'workflow_dispatch');
              const mainRun = mainStates[0].run;
              evidence.main_validation = {
                name: mainValidation.name,
                run_id: mainRun.id,
                event: mainRun.event,
                conclusion: mainRun.conclusion,
                head_sha: mainRun.head_sha,
                html_url: mainRun.html_url,
              };
              evidence.status = 'passed';
            } catch (error) {
              evidence.status = 'failed';
              evidence.error_code = String(error && error.message ? error.message : error).slice(0, 300);
              if (evidence.error_code === 'NEGATIVE_CONTROL_REQUIRED_WORKFLOW_MISSING') {
                evidence.negative_control_detected = true;
              }
              core.setFailed(evidence.error_code);
            } finally {
              if (refReady) {
                try {
                  const current = await github.rest.git.getRef({ owner, repo, ref: temporaryRef });
                  if (String(current.data.object.sha || '').toLowerCase() === mergeSha) {
                    await github.rest.git.deleteRef({ owner, repo, ref: temporaryRef });
                    evidence.temporary_ref_removed = true;
                  } else {
                    evidence.temporary_ref_removed = false;
                    evidence.cleanup_error = 'TEMP_REF_SHA_CHANGED';
                    core.setFailed(evidence.cleanup_error);
                  }
                } catch (error) {
                  if (error.status === 404) {
                    evidence.temporary_ref_removed = true;
                  } else {
                    evidence.temporary_ref_removed = false;
                    evidence.cleanup_error = 'TEMP_REF_CLEANUP_FAILED';
                    core.setFailed(evidence.cleanup_error);
                  }
                }
              }
              evidence.generated_at = new Date().toISOString();
              fs.writeFileSync(
                'audit/governed-post-merge-materialization.json',
                JSON.stringify(evidence, null, 2) + '\n'
              );
            }

      - name: Upload governed post-merge evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: governed-post-merge-materialization-${{ github.event.client_payload.merge_sha || github.event.inputs.merge_sha || github.run_id }}
          path: audit/governed-post-merge-materialization.json
          if-no-files-found: error
          retention-days: 30
  checkpoint-and-advance-recovered-queue:
    if: github.event_name == 'repository_dispatch'
    needs: materialize-post-merge
    name: Checkpoint e avanço da fila recuperada
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Registrar checkpoint e disparar próxima sincronização
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const payload = context.payload.client_payload || {};
            const prNumber = Number(payload.pr_number);
            const headSha = String(payload.head_sha || '');
            const mergeSha = String(payload.merge_sha || '');
            if (!Number.isInteger(prNumber) || prNumber <= 0) { core.setFailed('PR_NUMBER_INVALID'); return; }
            const { owner, repo } = context.repo;
            const marker = '<!-- reqsys-recovered-queue-checkpoint -->';
            const body = [
              marker,
              '## Fila recuperada — checkpoint pós-merge',
              '',
              `- PR: #${prNumber}`,
              `- HEAD pré-merge: \`${headSha}\``,
              `- Merge SHA validado: \`${mergeSha}\``,
              `- Evidência pós-merge: Actions Dispatcher run ${context.runId}`,
              '- Estado: merged_post_validation_passed',
              '- Próximo passo: sincronizar a PR ci:recuperado mais antiga ainda aberta.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: prNumber, per_page: 100 });
            const existing = comments.find((item) => String(item.body || '').includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: prNumber, body });
            await github.rest.actions.createWorkflowDispatch({ owner, repo, workflow_id: 'repository-governance-agent.yml', ref: 'main' });
            await core.summary.addHeading('Fila recuperada — continuidade').addRaw([
              `PR mergeada: #${prNumber}`,
              `Merge SHA: \`${mergeSha}\``,
              'Checkpoint persistido no PR.',
              'Repository Governance Agent disparado para a próxima PR recuperada.',
            ].join('\n')).write();

  notify-recovered-queue-merge:
    if: github.event_name == 'repository_dispatch'
    needs: [materialize-post-merge, checkpoint-and-advance-recovered-queue]
    name: Notificar merge da fila no Teams
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      TEAMS_WEBHOOK_RECIPIENT: ${{ secrets.TEAMS_WEBHOOK_RECIPIENT }}
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Validar configuração do Teams
        id: teams
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TEAMS_WEBHOOK_URL:-}" || -z "${TEAMS_WEBHOOK_RECIPIENT:-}" ]]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Teams não configurado::Checkpoint GitHub persistido; notificação imediata ignorada."
            exit 0
          fi
          echo "::add-mask::$TEAMS_WEBHOOK_URL"
          echo "::add-mask::$TEAMS_WEBHOOK_RECIPIENT"
          echo "configured=true" >> "$GITHUB_OUTPUT"
      - name: Enviar checkpoint pós-merge
        if: steps.teams.outputs.configured == 'true'
        env:
          PR_NUMBER: ${{ github.event.client_payload.pr_number }}
          HEAD_SHA: ${{ github.event.client_payload.head_sha }}
          MERGE_SHA: ${{ github.event.client_payload.merge_sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          message="PR #${PR_NUMBER} integrada e validada pós-merge. HEAD pré-merge: ${HEAD_SHA}. Merge SHA: ${MERGE_SHA}. Próxima PR recuperada encaminhada ao Repository Governance Agent. Evidência: ${RUN_URL}"
          python tools/geradores/teams_graph_gateway_autocontido.py send-webhook --title "ReqSys — fila recuperada avançou" --message "$message"
