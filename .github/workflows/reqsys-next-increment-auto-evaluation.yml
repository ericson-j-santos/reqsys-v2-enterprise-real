name: ReqSys Next Increment Auto Evaluation

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - ReqSys Fly Runtime P0
    types:
      - completed
  schedule:
    - cron: '17 * * * *'
  push:
    branches: [main]
    paths:
      - 'scripts/evaluate_reqsys_next_increment.py'
      - 'scripts/external_wait_partition.py'
      - 'tests/test_evaluate_reqsys_next_increment.py'
      - 'tests/test_external_wait_partition.py'
      - '.github/workflows/reqsys-next-increment-auto-evaluation.yml'
      - '.github/workflows/reqsys-external-wait-recorder.yml'
      - 'docs/contracts/reqsys-next-increment-auto-evaluation.md'

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: read

concurrency:
  group: reqsys-next-increment-auto-evaluation
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Run focused tests
        run: >-
          python -m pytest -q
          tests/test_evaluate_reqsys_next_increment.py
          tests/test_external_wait_partition.py
      - name: Collect PRs, merged delivery velocity and workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
          API_TIMEOUT_SECONDS: '30'
          MERGED_PR_MAX_PAGES: '2'
          RUN_MAX_PAGES: '3'
        run: |
          set -euo pipefail
          mkdir -p .tmp artifacts/reqsys-next-increment-auto-evaluation

          : > .tmp/prs.jsonl
          timeout "${API_TIMEOUT_SECONDS}s" gh api \
            "repos/${{ github.repository }}/pulls?state=open&per_page=100&page=1" \
            --jq '.[] | {number, state, draft, mergeable: (.mergeable // null), auto_merge_enabled: (.auto_merge != null), created_at, updated_at, html_url}' \
            > .tmp/prs.jsonl
          jq -s '.' .tmp/prs.jsonl > .tmp/prs.json

          : > .tmp/merged-prs.jsonl
          for page in $(seq 1 "$MERGED_PR_MAX_PAGES"); do
            timeout "${API_TIMEOUT_SECONDS}s" gh api \
              "repos/${{ github.repository }}/pulls?state=closed&sort=updated&direction=desc&per_page=100&page=${page}" \
              --jq '.[] | select(.merged_at != null) | {number, created_at, merged_at, merge_commit_sha, updated_at, html_url}' \
              >> .tmp/merged-prs.jsonl
          done
          jq -s '.' .tmp/merged-prs.jsonl > .tmp/merged-prs.json

          : > .tmp/runs.jsonl
          for page in $(seq 1 "$RUN_MAX_PAGES"); do
            timeout "${API_TIMEOUT_SECONDS}s" gh api \
              "repos/${{ github.repository }}/actions/runs?per_page=100&page=${page}" \
              --jq '.workflow_runs[] | {id, name, status, conclusion, event, head_branch, head_sha, created_at, updated_at, html_url}' \
              >> .tmp/runs.jsonl
          done
          jq -s '.' .tmp/runs.jsonl > .tmp/runs.json

      - name: Collect structured external-wait ledger
        env:
          GH_TOKEN: ${{ github.token }}
          API_TIMEOUT_SECONDS: '30'
          LEDGER_ISSUE: '1683'
          COMMENT_MAX_PAGES: '3'
        run: |
          set -euo pipefail
          : > .tmp/external-wait-comments.jsonl
          collection_ok=true
          collection_error=""

          for page in $(seq 1 "$COMMENT_MAX_PAGES"); do
            set +e
            payload="$(timeout "${API_TIMEOUT_SECONDS}s" gh api \
              "repos/${{ github.repository }}/issues/${LEDGER_ISSUE}/comments?per_page=100&page=${page}" 2>.tmp/external-wait-collector.err)"
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              collection_ok=false
              collection_error="github_issue_comments_collection_failed_rc_${rc}"
              break
            fi

            printf '%s' "$payload" \
              | jq -c '.[] | {id, html_url, created_at, updated_at, author_association, user: {login: .user.login}, body}' \
              >> .tmp/external-wait-comments.jsonl
            count="$(printf '%s' "$payload" | jq 'length')"
            if [ "$count" -lt 100 ]; then
              break
            fi
          done

          jq -s '.' .tmp/external-wait-comments.jsonl > .tmp/external-wait-comments.json
          COLLECTION_OK="$collection_ok" COLLECTION_ERROR="$collection_error" python - <<'PY'
          import json
          import os
          from pathlib import Path
          Path(".tmp/external-wait-collection-status.json").write_text(
              json.dumps({
                  "ok": os.environ["COLLECTION_OK"] == "true",
                  "error": os.environ["COLLECTION_ERROR"] or None,
              }, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Collect public runtime and SHA-linked build evidence
        env:
          REQSYS_RUNTIME_BASE_URL: https://reqsys-api.fly.dev
        run: |
          python - <<'PY'
          import json, os, time, urllib.error, urllib.request
          from datetime import datetime, timezone

          base = os.environ['REQSYS_RUNTIME_BASE_URL'].rstrip('/')
          paths = ['/health', '/api/runtime/health', '/api/runtime/readiness', '/api/runtime/liveness']
          endpoints = []
          for path in paths:
              started = time.perf_counter()
              code = None
              error = None
              try:
                  with urllib.request.urlopen(base + path, timeout=15) as response:
                      code = response.status
                      response.read(4096)
              except urllib.error.HTTPError as exc:
                  code = exc.code
                  error = str(exc)
              except Exception as exc:
                  error = f'{type(exc).__name__}: {exc}'
              endpoints.append({
                  'name': path,
                  'url': base + path,
                  'http_code': code,
                  'ok': code == 200,
                  'latency_ms': round((time.perf_counter() - started) * 1000, 2),
                  'error': error,
              })

          build_info = {}
          build_error = None
          try:
              with urllib.request.urlopen(base + '/api/runtime/build-info', timeout=15) as response:
                  payload = json.loads(response.read().decode('utf-8'))
                  if response.status == 200 and payload.get('success') is True:
                      build_info = payload.get('data') or {}
                  else:
                      build_error = f"unexpected build-info response: HTTP {response.status}"
          except Exception as exc:
              build_error = f'{type(exc).__name__}: {exc}'

          observed_at = datetime.now(timezone.utc).isoformat()
          with open('.tmp/runtime.json', 'w', encoding='utf-8') as handle:
              json.dump({
                  'base_url': base,
                  'observed_at': observed_at,
                  'build_sha': build_info.get('build_sha'),
                  'environment': build_info.get('environment'),
                  'build_info': build_info,
                  'build_info_error': build_error,
                  'endpoints': endpoints,
              }, handle, indent=2)
          PY

      - name: Download latest instrumented artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p .tmp/readiness .tmp/history
          READINESS_RUN="$(gh run list --workflow instrumented-executive-readiness.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          HISTORY_RUN="$(gh run list --workflow instrumented-executive-history.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          if [ -n "$READINESS_RUN" ]; then gh run download "$READINESS_RUN" -n instrumented-executive-readiness -D .tmp/readiness || true; fi
          if [ -n "$HISTORY_RUN" ]; then gh run download "$HISTORY_RUN" -n instrumented-executive-history -D .tmp/history || true; fi
          READINESS_FILE="$(find .tmp/readiness -name '*.json' -print -quit)"
          HISTORY_FILE="$(find .tmp/history -name '*.json' -print -quit)"
          [ -n "$READINESS_FILE" ] && cp "$READINESS_FILE" .tmp/readiness.json || echo '{}' > .tmp/readiness.json
          [ -n "$HISTORY_FILE" ] && cp "$HISTORY_FILE" .tmp/history.json || echo '{}' > .tmp/history.json

      - name: Evaluate next safe increment
        run: |
          python scripts/evaluate_reqsys_next_increment.py \
            --prs .tmp/prs.json \
            --merged-prs .tmp/merged-prs.json \
            --runs .tmp/runs.json \
            --readiness .tmp/readiness.json \
            --history .tmp/history.json \
            --runtime .tmp/runtime.json \
            --availability-target-minutes 30 \
            --output-json artifacts/reqsys-next-increment-auto-evaluation/report.json \
            --output-md artifacts/reqsys-next-increment-auto-evaluation/report.md

      - name: Enrich report with external wait partition
        run: |
          python scripts/external_wait_partition.py \
            --comments .tmp/external-wait-comments.json \
            --collection-status .tmp/external-wait-collection-status.json \
            --report artifacts/reqsys-next-increment-auto-evaluation/report.json \
            --markdown artifacts/reqsys-next-increment-auto-evaluation/report.md

      - name: Publish executive summary
        run: cat artifacts/reqsys-next-increment-auto-evaluation/report.md >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: reqsys-next-increment-auto-evaluation
          path: artifacts/reqsys-next-increment-auto-evaluation/
          retention-days: 90
