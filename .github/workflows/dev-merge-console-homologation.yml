name: DEV Merge Console Homologation

on:
  push:
    branches:
      - ops/dev-merge-console-fly-preflight
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    name: Validar acesso Fly DEV e secret do backend
    runs-on: ubuntu-latest
    environment: development

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar arquivos do console
        shell: bash
        run: |
          set -euo pipefail

          test -f backend/app/api/github_merge_console.py
          test -f frontend/src/views/GitHubMergeConsoleView.vue

          grep -Fq "prefix='/v1/admin/github-merge'" \
            backend/app/api/github_merge_console.py

          grep -Fq "/admin/github-merge" \
            frontend/src/router/index.js

          echo "Preflight de código concluído."

      - name: Validar credencial Fly sem expor valor
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${FLY_API_TOKEN:-}" || {
            echo "FLY_API_TOKEN ausente no environment development."
            exit 1
          }
          echo "FLY_API_TOKEN disponível no environment development."

      - name: Setup Flyctl pinado
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Validar acesso ao app e secret GITHUB_TOKEN sem ler valor
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          flyctl status --app reqsys-api-dev >/dev/null

          if ! flyctl secrets list --app reqsys-api-dev 2>/dev/null \
            | awk 'NR>1 {print $1}' \
            | grep -Fxq 'GITHUB_TOKEN'; then
            echo "GITHUB_TOKEN não está configurado como secret do backend DEV."
            exit 2
          fi

          echo "Acesso Fly DEV validado e GITHUB_TOKEN presente por nome no backend DEV."
