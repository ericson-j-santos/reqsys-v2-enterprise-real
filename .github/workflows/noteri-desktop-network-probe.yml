name: Noteri to Desktop Network Probe

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/noteri-desktop-network-probe-*"
    paths:
      - "scripts/noteri_desktop_network_probe.py"
      - ".github/workflows/noteri-desktop-network-probe.yml"
      - ".sdd/specs/noteri-desktop-network-probe.*"
      - "tests/test_noteri_desktop_network_probe.py"

permissions:
  contents: read

concurrency:
  group: noteri-desktop-network-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Diagnose Desktop reachability from Noteri
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    env:
      CORRELATION_ID: noteri-desktop-network-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts/noteri-desktop-network/evidence.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Probe fixed Desktop target
        shell: powershell
        run: python scripts/noteri_desktop_network_probe.py --confirm PROBE-NOTERI-DESKTOP-NETWORK --correlation-id "$env:CORRELATION_ID" --evidence-file "$env:EVIDENCE_FILE"

      - name: Upload sanitized network evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-desktop-network-${{ github.run_id }}
          path: artifacts/noteri-desktop-network/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: powershell
        run: |
          "## Noteri -> Desktop Network Probe" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Fonte fixa: Noteri" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Destino fixo: DESKTOP-PDQK954" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Porta DEV fixa: 8081" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- RDC necessário: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Correlation ID: $env:CORRELATION_ID" | Add-Content $env:GITHUB_STEP_SUMMARY
