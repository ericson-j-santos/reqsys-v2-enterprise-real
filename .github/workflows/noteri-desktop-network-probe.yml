name: Noteri to Desktop Network Probe

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/noteri-desktop-network-probe-*"
      - "fix/self-hosted-dev-restore-20261003"
      - "fix/noteri-desktop-orchestrator-status-*"
      - "hotfix/noteri-desktop-orchestrator-runner-recovery-*"
    paths:
      - "scripts/noteri_desktop_network_probe.py"
      - "scripts/noteri_dev_backup_metadata.py"
      - "scripts/noteri_desktop_orchestrator_runner_recovery.py"
      - "scripts/noteri_desktop_dev_http_probe.py"
      - "scripts/noteri_desktop_orchestrator_status_probe.py"
      - ".github/workflows/noteri-desktop-network-probe.yml"
      - ".github/workflows/reqsys-authorized-actions-gateway.yml"
      - ".github/self-hosted-runner-policy.json"
      - ".sdd/specs/noteri-desktop-network-probe.*"
      - "tests/test_reqsys_authorized_actions_gateway.py"
      - "tests/test_noteri_desktop_network_probe.py"
      - "tests/test_noteri_desktop_orchestrator_runner_recovery.py"
      - "tests/test_noteri_desktop_dev_http_probe.py"
      - "tests/test_noteri_desktop_orchestrator_status_probe.py"

permissions:
  contents: read

concurrency:
  group: noteri-desktop-network-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Diagnose Desktop reachability from Noteri
    if: ${{ github.event_name == 'workflow_dispatch' || (github.ref_name != 'main' && github.ref_name != 'fix/self-hosted-dev-restore-20261003' && github.ref_name != 'fix/noteri-desktop-network-probe-status-8787-20260929' && !startsWith(github.ref_name, 'fix/noteri-desktop-orchestrator-status-') && !startsWith(github.ref_name, 'fix/noteri-desktop-network-probe-http-8083-') && !startsWith(github.ref_name, 'hotfix/noteri-desktop-orchestrator-runner-recovery-')) }}
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 15
    env:
      TARGET_REPO: ${{ github.workspace }}
      RULES_SHA: d26351458b17c917100efc3b736dcc6d53a646cb
      CORRELATION_ID: noteri-desktop-network-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\noteri-desktop-network\evidence.json
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned portable Python 3.12
        shell: powershell
        env:
          PORTABLE_PYTHON_VERSION: "3.12.10"
          PORTABLE_PYTHON_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PORTABLE_PYTHON_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
          PORTABLE_PIP_URL: https://files.pythonhosted.org/packages/b7/3f/945ef7ab14dc4f9d7f40288d2df998d1837ee0888ec3659c813487572faa/pip-25.2-py3-none-any.whl
          PORTABLE_PIP_SHA256: 6d67a2b4e7f14d8b31b8b52648866fa717f45a1eb70e83002f4331d07e953717
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          if ($env:COMPUTERNAME -ne "Noteri") { throw "NOTERI_HOST_MISMATCH" }
          $root = Join-Path $env:RUNNER_TEMP ("reqsys-python-" + $env:PORTABLE_PYTHON_VERSION + "-" + $env:GITHUB_JOB + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $zip = "$root.zip"
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest -Uri $env:PORTABLE_PYTHON_URL -OutFile $zip -UseBasicParsing -TimeoutSec 120
          $observedHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($observedHash -ne $env:PORTABLE_PYTHON_SHA256) { throw "portable_python_sha256_mismatch:$observedHash" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $python = Join-Path $root "python.exe"
          if (-not (Test-Path -LiteralPath $python)) { throw "portable_python_executable_missing" }
          $observedVersion = (& $python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne "Python $env:PORTABLE_PYTHON_VERSION") {
            throw "portable_python_version_mismatch:$observedVersion"
          }
          $siteDir = Join-Path $root "Lib\site-packages"
          New-Item -ItemType Directory -Force $siteDir | Out-Null
          $pipFilename = "pip-25.2-py3-none-any.whl"
          $pipWheel = Join-Path $root $pipFilename
          Invoke-WebRequest -Uri $env:PORTABLE_PIP_URL -OutFile $pipWheel -UseBasicParsing -TimeoutSec 120
          if ((Get-FileHash -LiteralPath $pipWheel -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PORTABLE_PIP_SHA256) { throw "portable_pip_sha256_mismatch" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($pipWheel, $siteDir)
          $pth = Join-Path $root "python312._pth"
          $pthLines = @("python312.zip", ".", "Lib\site-packages", "import site")
          [System.IO.File]::WriteAllLines($pth, $pthLines, (New-Object System.Text.UTF8Encoding($false)))
          if ($env:PYTHONNOUSERSITE -ne "1") { throw "portable_python_user_site_not_disabled" }
          "REQSYS_PYTHON_SITE=$siteDir" | Add-Content $env:GITHUB_ENV
          "REQSYS_PYTHON=$python" | Add-Content $env:GITHUB_ENV

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rulesScripts = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts"
          $pth = Join-Path (Split-Path -Parent $env:REQSYS_PYTHON) "python312._pth"
          if (-not (Test-Path -LiteralPath $pth)) { throw "PORTABLE_PYTHON_PTH_MISSING" }
          if (@(Get-Content -LiteralPath $pth) -notcontains $rulesScripts) { Add-Content -LiteralPath $pth -Value $rulesScripts }
          $launcher = Join-Path $rulesScripts "session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $syncRef = "origin/$env:GITHUB_REF_NAME"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "noteri-desktop-network",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", $syncRef
          )
          $raw = & $env:REQSYS_PYTHON $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Install pinned probe dependencies through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-dependencies",
            "run", "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2", "--timeout", "240",
            "--expected-head", $env:ANCHOR_SHA,
            "--", "$env:REQSYS_PYTHON", "-m", "pip", "--isolated", "install",
            "--disable-pip-version-check", "--index-url", "https://pypi.org/simple",
            "--no-user", "--only-binary=:all:", "--target", "$env:REQSYS_PYTHON_SITE",
            "pytest==8.4.2", "pywin32==311"
          )
          & $env:REQSYS_PYTHON $gateway @args
          exit $LASTEXITCODE

      - name: Validate targeted tests through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-tests",
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "$env:REQSYS_PYTHON", "-m", "pytest", "tests/test_noteri_desktop_network_probe.py", "-q"
          )
          & "$env:REQSYS_PYTHON" $gateway @args
          exit $LASTEXITCODE

      - name: Probe fixed Desktop target through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $probeScript = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_network_probe.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "$env:REQSYS_PYTHON", $probeScript,
            "--confirm", "PROBE-NOTERI-DESKTOP-NETWORK",
            "--correlation-id", $env:CORRELATION_ID,
            "--evidence-file", $env:EVIDENCE_REL
          )
          & $env:REQSYS_PYTHON $gateway @args
          exit $LASTEXITCODE

      - name: Upload sanitized network evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-desktop-network-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\noteri-desktop-network\evidence.json
          if-no-files-found: warn
          retention-days: 30


  orchestrator_runner_recovery:
    if: ${{ github.event_name == 'push' && (github.ref_name == 'main' || startsWith(github.ref_name, 'hotfix/noteri-desktop-orchestrator-runner-recovery-')) }}
    name: Recover Desktop runner through Engineering Orchestrator
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 15
    env:
      RULES_SHA: d26351458b17c917100efc3b736dcc6d53a646cb
      CORRELATION_ID: desktop-runner-orchestrator-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts/noteri-desktop-orchestrator-runner-recovery/evidence.json

    steps:
      - name: Assert exact Noteri host
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne "Noteri") {
            throw "NOTERI_HOST_MISMATCH"
          }

      - name: Checkout immutable source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned portable Python 3.12
        shell: powershell
        env:
          PORTABLE_PYTHON_VERSION: "3.12.10"
          PORTABLE_PYTHON_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PORTABLE_PYTHON_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          if ($env:COMPUTERNAME -ne "Noteri") { throw "NOTERI_HOST_MISMATCH" }
          $root = Join-Path $env:RUNNER_TEMP ("reqsys-python-" + $env:PORTABLE_PYTHON_VERSION + "-" + $env:GITHUB_JOB + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $zip = "$root.zip"
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest -Uri $env:PORTABLE_PYTHON_URL -OutFile $zip -UseBasicParsing -TimeoutSec 120
          $observedHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($observedHash -ne $env:PORTABLE_PYTHON_SHA256) { throw "portable_python_sha256_mismatch:$observedHash" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $python = Join-Path $root "python.exe"
          if (-not (Test-Path -LiteralPath $python)) { throw "portable_python_executable_missing" }
          $observedVersion = (& $python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne "Python $env:PORTABLE_PYTHON_VERSION") {
            throw "portable_python_version_mismatch:$observedVersion"
          }
          "REQSYS_PYTHON=$python" | Add-Content $env:GITHUB_ENV

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed Noteri session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rulesScripts = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts"
          $pth = Join-Path (Split-Path -Parent $env:REQSYS_PYTHON) "python312._pth"
          if (-not (Test-Path -LiteralPath $pth)) { throw "PORTABLE_PYTHON_PTH_MISSING" }
          if (@(Get-Content -LiteralPath $pth) -notcontains $rulesScripts) { Add-Content -LiteralPath $pth -Value $rulesScripts }
          $launcher = Join-Path $rulesScripts "session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--repo", $env:GITHUB_WORKSPACE,
            "--session-prefix", "desktop-runner",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/$env:GITHUB_REF_NAME"
          )
          $raw = & "$env:REQSYS_PYTHON" $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = (@($raw)[-1] | ConvertFrom-Json)
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          Write-Host "SESSION_LAUNCH_OK head=$($data.head)"

      - name: Recover Desktop GitHub runner through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_orchestrator_runner_recovery.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "120",
            "--expected-head", "${{ github.sha }}",
            "--",
            "$env:REQSYS_PYTHON", $script,
            "--confirm", "RECOVER-DESKTOP-GITHUB-RUNNER-VIA-ORCHESTRATOR",
            "--correlation-id", $env:CORRELATION_ID,
            "--evidence-file", $env:EVIDENCE_REL,
            "--timeout-seconds", "75"
          )
          & $env:REQSYS_PYTHON $gateway @args
          exit $LASTEXITCODE

      - name: Validate sanitized physical evidence
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $path = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          $e = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          if (-not $e.ok) { throw "RUNNER_RECOVERY_NOT_OK" }
          if ($e.result -ne "DESKTOP_GITHUB_RUNNER_RECOVERY_COMPLETED") { throw "RUNNER_RECOVERY_RESULT_MISMATCH" }
          if ($e.source_host -ne "Noteri") { throw "SOURCE_HOST_MISMATCH" }
          if ($e.target_host -ne "DESKTOP-PDQK954") { throw "TARGET_HOST_MISMATCH" }
          if ($e.control_plane_port -ne 8787) { throw "CONTROL_PLANE_PORT_MISMATCH" }
          if ($e.task_type -ne "host.github_runner.recover.v1") { throw "TASK_TYPE_MISMATCH" }
          if (-not $e.replay_idempotent) { throw "IDEMPOTENCY_MISSING" }
          if (-not $e.negative_read_control) { throw "NEGATIVE_CONTROL_MISSING" }
          if (-not $e.independent_readback) { throw "INDEPENDENT_READBACK_MISSING" }
          if ($e.remote_shell_used) { throw "REMOTE_SHELL_USED" }
          if ($e.credentials_supplied) { throw "CREDENTIALS_SUPPLIED" }
          if ($e.secrets_read) { throw "SECRETS_READ" }
          if ($e.production_touched) { throw "PRODUCTION_TOUCHED" }
          if ($e.reboot_performed) { throw "REBOOT_PERFORMED" }

      - name: Upload sanitized recovery evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: noteri-desktop-orchestrator-runner-recovery-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}/artifacts/noteri-desktop-orchestrator-runner-recovery/evidence.json
          if-no-files-found: error
          retention-days: 30

  dev_http_probe:
    name: Diagnose Desktop DEV HTTP route from Noteri
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'fix/noteri-desktop-network-probe-http-8083-') || startsWith(github.ref_name, 'fix/noteri-desktop-network-probe-python-') }}
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 15
    env:
      TARGET_REPO: ${{ github.workspace }}
      RULES_SHA: d26351458b17c917100efc3b736dcc6d53a646cb
      CORRELATION_ID: noteri-desktop-dev-http-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\noteri-desktop-dev-http\evidence.json
      PYTHONNOUSERSITE: "1"
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned portable Python 3.12
        shell: powershell
        env:
          PORTABLE_PYTHON_VERSION: "3.12.10"
          PORTABLE_PYTHON_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PORTABLE_PYTHON_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
          PORTABLE_PIP_URL: https://files.pythonhosted.org/packages/b7/3f/945ef7ab14dc4f9d7f40288d2df998d1837ee0888ec3659c813487572faa/pip-25.2-py3-none-any.whl
          PORTABLE_PIP_SHA256: 6d67a2b4e7f14d8b31b8b52648866fa717f45a1eb70e83002f4331d07e953717
        run: |
          $ErrorActionPreference = "Stop"
          $ProgressPreference = "SilentlyContinue"
          if ($env:COMPUTERNAME -ne "Noteri") { throw "NOTERI_HOST_MISMATCH" }
          $root = Join-Path $env:RUNNER_TEMP ("reqsys-python-" + $env:PORTABLE_PYTHON_VERSION + "-" + $env:GITHUB_JOB + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $zip = "$root.zip"
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest -Uri $env:PORTABLE_PYTHON_URL -OutFile $zip -UseBasicParsing -TimeoutSec 120
          $observedHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($observedHash -ne $env:PORTABLE_PYTHON_SHA256) { throw "portable_python_sha256_mismatch:$observedHash" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $python = Join-Path $root "python.exe"
          if (-not (Test-Path -LiteralPath $python)) { throw "portable_python_executable_missing" }
          $observedVersion = (& $python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne "Python $env:PORTABLE_PYTHON_VERSION") {
            throw "portable_python_version_mismatch:$observedVersion"
          }
          $siteDir = Join-Path $root "Lib\site-packages"
          New-Item -ItemType Directory -Force $siteDir | Out-Null
          $pipFilename = "pip-25.2-py3-none-any.whl"
          $pipWheel = Join-Path $root $pipFilename
          Invoke-WebRequest -Uri $env:PORTABLE_PIP_URL -OutFile $pipWheel -UseBasicParsing -TimeoutSec 120
          if ((Get-FileHash -LiteralPath $pipWheel -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PORTABLE_PIP_SHA256) { throw "portable_pip_sha256_mismatch" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [System.IO.Compression.ZipFile]::ExtractToDirectory($pipWheel, $siteDir)
          $pth = Join-Path $root "python312._pth"
          $pthLines = @("python312.zip", ".", "Lib\site-packages", "import site")
          [System.IO.File]::WriteAllLines($pth, $pthLines, (New-Object System.Text.UTF8Encoding($false)))
