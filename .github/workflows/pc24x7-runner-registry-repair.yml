name: PC24x7 Runner Registry Repair

on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: pc24x7-runner-registry-repair
  cancel-in-progress: false

jobs:
  repair:
    name: Probe and repair exact PC24x7 runner registry
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVIDENCE_FILE: artifacts/pc24x7-runner-registry-repair/evidence.json
      GH_TOKEN: ${{ secrets.GH_PAT_ACTIONS }}
    steps:
      - name: Validate governed runner admin credential
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::GH_PAT_ACTIONS is not configured."
            exit 2
          fi

      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Probe and repair exact runner registration
        run: |
          python scripts/pc24x7_runner_registry_repair.py \
            --confirm REPAIR-PC24X7-RUNNER-REGISTRY \
            --evidence-file "$EVIDENCE_FILE"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc24x7-runner-registry-repair-${{ github.run_id }}
          path: artifacts/pc24x7-runner-registry-repair/evidence.json
          if-no-files-found: error
          retention-days: 30
