name: PC24x7 Teams Service Token Bootstrap

on:
  pull_request:
    paths:
      - 'scripts/bootstrap_pc24x7_teams_service_token.py'
      - 'scripts/reconcile_pc24x7_teams_dev_runtime.py'
      - 'scripts/recreate_cofre_dev_pc24x7.py'
      - 'config/pc24x7-teams-bot-runtime.override.yml'
      - 'scripts/resolve_pc24x7_dev_locator.mjs'
      - 'tests/test_bootstrap_pc24x7_teams_service_token.py'
      - 'tests/test_reconcile_pc24x7_teams_dev_runtime.py'
      - 'tests/test_pc24x7_teams_token_bootstrap_workflow.py'
      - '.github/workflows/pc24x7-teams-token-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap_pc24x7_teams_service_token.py'
      - 'scripts/reconcile_pc24x7_teams_dev_runtime.py'
      - 'scripts/recreate_cofre_dev_pc24x7.py'
      - 'config/pc24x7-teams-bot-runtime.override.yml'
      - 'scripts/resolve_pc24x7_dev_locator.mjs'
      - 'tests/test_pc24x7_teams_token_bootstrap_workflow.py'
      - '.github/workflows/pc24x7-teams-token-bootstrap.yml'
  schedule:
    - cron: '17 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: pc24x7-teams-service-token-bootstrap-dev
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe e testes
        run: |
          python -m py_compile scripts/bootstrap_pc24x7_teams_service_token.py scripts/reconcile_pc24x7_teams_dev_runtime.py
          python -m pip install --disable-pip-version-check pytest==9.0.3
          pytest -q tests/test_bootstrap_pc24x7_teams_service_token.py tests/test_reconcile_pc24x7_teams_dev_runtime.py tests/test_pc24x7_teams_token_bootstrap_workflow.py

  probe-repository-admin-jwt:
    if: github.event_name == 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
    steps:
      - name: Verificar presença no escopo do repositório sem expor valor
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${COFRE_ADMIN_JWT:-}" ]; then
            echo 'REPOSITORY_ADMIN_JWT_PRESENT=true'
          else
            echo 'REPOSITORY_ADMIN_JWT_PRESENT=false'
          fi


  reconcile-runtime-dev:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    environment: development
    timeout-minutes: 20
    env:
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      EVIDENCE_FILE: artifacts/pc24x7-teams-runtime-reconcile/evidence.json
      CORRELATION_ID: pc24x7-teams-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validar configuração OIDC sem expor valores
        shell: powershell
        run: |
          $names = @('REQSYS_KEY_VAULT_NAME','CCP_AZURE_CLIENT_ID','CCP_AZURE_TENANT_ID','CCP_AZURE_SUBSCRIPTION_ID')
          foreach ($name in $names) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Error "$name não configurado. Reconciliação permanece fail-closed."
              exit 2
            }
          }

      - name: Login Azure por OIDC para reconciliar runtime DEV
        uses: azure/login@v2
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Reconciliar runtime PC24x7 DEV no SHA do workflow
        shell: powershell
        run: |
          python scripts/reconcile_pc24x7_teams_dev_runtime.py --confirm RECONCILE-PC24X7-TEAMS-DEV --expected-sha "${{ github.sha }}" --vault-name "$env:REQSYS_KEY_VAULT_NAME" --expected-tenant-id "$env:CCP_AZURE_TENANT_ID" --correlation-id "$env:CORRELATION_ID" --evidence-file "$env:EVIDENCE_FILE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar evidência sanitizada da reconciliação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc24x7-teams-runtime-reconcile-${{ github.run_id }}
          path: artifacts/pc24x7-teams-runtime-reconcile/evidence.json
          if-no-files-found: error
          retention-days: 30

  bootstrap-dev:
    if: github.event_name != 'pull_request'
    needs: [contract, reconcile-runtime-dev]
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    env:
      COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      PC24X7_TEAMS_SERVICE_TOKEN_SECRET: reqsys-pc24x7-teams-service-token
      PC24X7_TEAMS_ALLOW_PROVISION: 'true'
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Preparar Node para locator DEV assinado
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Validar contrato fail-closed do locator
        shell: bash
        run: node scripts/resolve_pc24x7_dev_locator.mjs --self-test

      - name: Resolver runtime PC24x7 DEV vigente
        id: locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pc24x7-teams-token
          node scripts/resolve_pc24x7_dev_locator.mjs             --output artifacts/pc24x7-teams-token/signed-locator.json

      - name: Inicializar evidência sanitizada
        shell: bash
        run: |
          cat > pc24x7-teams-token-bootstrap.json <<'JSON'
          {"status":"blocked","reason":"READINESS_NOT_EXECUTED","environment":"dev","mode":"provision_if_missing","token_created":false,"secret_value_exposed":false}
          JSON

      - name: Validar runtime PC24x7 no mesmo SHA
        shell: bash
        env:
          REQSYS_API_BASE_URL: ${{ steps.locator.outputs.base_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          evidence_path = Path('pc24x7-teams-token-bootstrap.json')
          base = os.environ['REQSYS_API_BASE_URL'].rstrip('/')
          expected = os.environ['EXPECTED_SHA'].strip().lower()

          def fail(reason, *, observed_sha=None, exit_code=4):
              payload = {
                  'status': 'blocked',
                  'reason': reason,
                  'environment': 'dev',
                  'mode': 'provision_if_missing',
                  'token_created': False,
                  'secret_value_exposed': False,
                  'production_touched': False,
              }
              if observed_sha is not None:
                  payload['expected_sha'] = expected
                  payload['observed_sha'] = observed_sha
              evidence_path.write_text(json.dumps(payload, ensure_ascii=False) + '\n', encoding='utf-8')
              raise SystemExit(exit_code)

          try:
              request = Request(
                  base + '/api/runtime/build-info',
                  headers={'Accept': 'application/json', 'User-Agent': 'reqsys-teams-token-bootstrap/2.0'},
              )
              with urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read(262_144).decode('utf-8'))
          except (HTTPError, URLError, TimeoutError, OSError, json.JSONDecodeError):
              fail('pc24x7_runtime_probe_failed', exit_code=3)

          data = payload.get('data', payload) if isinstance(payload, dict) else {}
          observed = str(data.get('build_sha') or data.get('commit_sha') or '').strip().lower()
          if observed != expected:
              fail('pc24x7_runtime_sha_mismatch', observed_sha=observed)
          print(f'PC24x7 runtime SHA validado: {observed}')
          PY

      - name: Exportar runtime PC24x7 DEV
        shell: bash
        env:
          RESOLVED_API_BASE: ${{ steps.locator.outputs.base_url }}
        run: |
          set -euo pipefail
          test -n "$RESOLVED_API_BASE"
          printf 'REQSYS_API_BASE_URL=%s\n' "$RESOLVED_API_BASE" >> "$GITHUB_ENV"

      - name: Validar configuração governada
        shell: bash
        run: |
          set -euo pipefail
          for name in CCP_AZURE_CLIENT_ID CCP_AZURE_TENANT_ID CCP_AZURE_SUBSCRIPTION_ID COFRE_ADMIN_JWT; do
            if [ -z "${!name:-}" ]; then
              printf '%s\n' '{"status":"blocked","reason":"GOVERNED_CONFIGURATION_MISSING","environment":"dev","mode":"provision_if_missing","token_created":false,"secret_value_exposed":false}' > pc24x7-teams-token-bootstrap.json
              echo "::error::$name não configurado. Bootstrap permanece fail-closed."
              exit 2
            fi
          done

      - name: Login Azure por OIDC da identidade mutadora
        uses: azure/login@v2
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Instalar cliente Key Vault
        run: python -m pip install --disable-pip-version-check azure-identity azure-keyvault-secrets

      - name: Validar ou provisionar token S2S DEV
        id: bootstrap
        shell: bash
        run: |
          set +e
          output="$(python scripts/bootstrap_pc24x7_teams_service_token.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output" | tee pc24x7-teams-token-bootstrap.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc24x7-teams-token-bootstrap-${{ github.run_id }}
          path: |
            pc24x7-teams-token-bootstrap.json
            artifacts/pc24x7-teams-token/signed-locator.json
          if-no-files-found: error
          retention-days: 30

      - name: Atualizar issue 1532
        if: always()
        uses: actions/github-script@v7
        env:
          READY: ${{ steps.bootstrap.outputs.ready }}
        with:
          script: |
            const marker = '<!-- reqsys-pc24x7-teams-token-bootstrap -->';
            const ready = process.env.READY === 'true';
            const body = `${marker}\n## PC24x7 Teams — token S2S DEV\n\n` +
              `- estado: \`${ready ? 'READY' : 'BLOCKED'}\`;\n` +
              `- modo: \`provision_if_missing\`;\n` +
              `- escopo: \`teams_gateway:ai_conversations\`;\n` +
              `- armazenamento: \`Azure Key Vault / reqsys-pc24x7-teams-service-token\`;\n` +
              `- valor do segredo exposto: \`não\`;\n` +
              `- execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.\n\n` +
              (ready ? 'Token existente foi reutilizado ou um novo token escopado foi emitido, armazenado e validado pela rota readiness.' : 'Bootstrap falhou fechado; nenhum valor sensível foi publicado.');
            const comments = await github.paginate(github.rest.issues.listComments, {owner: context.repo.owner, repo: context.repo.repo, issue_number: 1532, per_page: 100});
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 1532, body});

      - name: Falhar fechado se token não estiver pronto
        if: steps.bootstrap.outputs.ready != 'true'
        run: exit 4
