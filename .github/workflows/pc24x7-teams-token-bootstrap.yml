name: PC24x7 Teams Service Token Bootstrap

on:
  pull_request:
    paths:
      - 'scripts/bootstrap_pc24x7_teams_service_token.py'
      - 'scripts/reconcile_pc24x7_teams_dev_runtime.py'
      - 'scripts/recreate_cofre_dev_pc24x7.py'
      - 'config/pc24x7-teams-bot-runtime.override.yml'
      - 'scripts/resolve_pc24x7_dev_locator.mjs'
      - 'tests/test_bootstrap_pc24x7_teams_service_token.py'
      - 'tests/test_reconcile_pc24x7_teams_dev_runtime.py'
      - 'tests/test_pc24x7_teams_token_bootstrap_workflow.py'
      - '.github/workflows/pc24x7-teams-token-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap_pc24x7_teams_service_token.py'
      - 'scripts/reconcile_pc24x7_teams_dev_runtime.py'
      - 'scripts/recreate_cofre_dev_pc24x7.py'
      - 'config/pc24x7-teams-bot-runtime.override.yml'
      - 'scripts/resolve_pc24x7_dev_locator.mjs'
      - 'tests/test_pc24x7_teams_token_bootstrap_workflow.py'
      - '.github/workflows/pc24x7-teams-token-bootstrap.yml'
  schedule:
    - cron: '17 11 * * 1-5'
  workflow_dispatch:
    inputs:
      mode:
        description: Token S2S a validar/provisionar
        required: true
        default: teams
        type: choice
        options:
          - teams
          - cofre-runtime

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: pc24x7-teams-service-token-bootstrap-dev
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Validar sintaxe e testes
        run: |
          python -m py_compile scripts/bootstrap_pc24x7_teams_service_token.py scripts/reconcile_pc24x7_teams_dev_runtime.py
          python -m pip install --disable-pip-version-check pytest==9.0.3
          pytest -q tests/test_bootstrap_pc24x7_teams_service_token.py tests/test_reconcile_pc24x7_teams_dev_runtime.py tests/test_pc24x7_teams_token_bootstrap_workflow.py

  reconcile-runtime-dev:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    environment: development
    timeout-minutes: 25
    env:
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      EVIDENCE_FILE: artifacts/pc24x7-teams-runtime-reconcile/evidence.json
      CORRELATION_ID: pc24x7-teams-runtime-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validar configuração OIDC sem expor valores
        shell: powershell
        run: |
          $names = @('REQSYS_KEY_VAULT_NAME','CCP_AZURE_CLIENT_ID','CCP_AZURE_TENANT_ID','CCP_AZURE_SUBSCRIPTION_ID')
          foreach ($name in $names) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Error "$name não configurado. Reconciliação permanece fail-closed."
              exit 2
            }
          }

      - name: Login Azure por OIDC para reconciliar runtime DEV
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Reconciliar runtime PC24x7 DEV no SHA do workflow
        shell: powershell
        run: |
          python scripts/reconcile_pc24x7_teams_dev_runtime.py --confirm RECONCILE-PC24X7-TEAMS-DEV --expected-sha "${{ github.sha }}" --vault-name "$env:REQSYS_KEY_VAULT_NAME" --expected-tenant-id "$env:CCP_AZURE_TENANT_ID" --correlation-id "$env:CORRELATION_ID" --evidence-file "$env:EVIDENCE_FILE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar evidência sanitizada da reconciliação
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pc24x7-teams-runtime-reconcile-${{ github.run_id }}
          path: artifacts/pc24x7-teams-runtime-reconcile/evidence.json
          if-no-files-found: error
          retention-days: 30

  bootstrap-token-dev:
    if: github.event_name != 'pull_request'
    needs: [contract, reconcile-runtime-dev]
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    environment: development
    timeout-minutes: 15
    outputs:
      bootstrap_ready: ${{ steps.bootstrap.outputs.ready }}
    env:
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      PC24X7_TEAMS_SERVICE_TOKEN_SECRET: ${{ inputs.mode == 'cofre-runtime' && 'reqsys-cofre-runtime-evidence-service-token' || 'reqsys-pc24x7-teams-service-token' }}
      REQSYS_SERVICE_TOKEN_SCOPE: ${{ inputs.mode == 'cofre-runtime' && 'cofre:runtime_evidence' || 'teams_gateway:ai_conversations' }}
      REQSYS_SERVICE_TOKEN_LABEL: ${{ inputs.mode == 'cofre-runtime' && 'cofre-runtime-evidence-dev' || 'pc24x7-teams-dev' }}
      REQSYS_SERVICE_TOKEN_VALIDATION_PATH: ${{ inputs.mode == 'cofre-runtime' && '/v1/cofre/runtime/control-status' || '/v1/teams-gateway/ai-conversations/readiness' }}
      PC24X7_TEAMS_ALLOW_PROVISION: 'true'
      PC24X7_LOCAL_COFRE_CONTAINER: wt-pc24x7-piloto-api-1
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validar configuração OIDC sem expor valores
        shell: powershell
        run: |
          $names = @('REQSYS_KEY_VAULT_NAME','CCP_AZURE_CLIENT_ID','CCP_AZURE_TENANT_ID','CCP_AZURE_SUBSCRIPTION_ID')
          foreach ($name in $names) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              Write-Error "$name não configurado. Bootstrap permanece fail-closed."
              exit 2
            }
          }

      - name: Login Azure por OIDC para bootstrap DEV
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Resolver runtime PC24x7 DEV para bootstrap
        id: locator_bootstrap
        shell: powershell
        run: |
          node scripts/resolve_pc24x7_dev_locator.mjs --output artifacts/pc24x7-teams-runtime-reconcile/signed-locator.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Instalar cliente Key Vault no PC24x7
        shell: powershell
        run: python -m pip install --disable-pip-version-check azure-identity azure-keyvault-secrets

      - name: Validar ou provisionar token S2S no PC24x7
        id: bootstrap
        shell: powershell
        env:
          REQSYS_API_BASE_URL: ${{ steps.locator_bootstrap.outputs.base_url }}
          COFRE_API_URL: ${{ steps.locator_bootstrap.outputs.base_url }}
        run: |
          python scripts/bootstrap_pc24x7_teams_service_token.py | Tee-Object -FilePath pc24x7-teams-token-bootstrap.json
          if ($LASTEXITCODE -eq 0) {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
          } else {
            "ready=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
            exit $LASTEXITCODE
          }

      - name: Publicar evidência sanitizada do bootstrap
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pc24x7-teams-token-bootstrap-${{ github.run_id }}
          path: |
            pc24x7-teams-token-bootstrap.json
            artifacts/pc24x7-teams-runtime-reconcile/signed-locator.json
          if-no-files-found: warn
          retention-days: 30


  bootstrap-dev:
    if: github.event_name != 'pull_request'
    needs: [contract, reconcile-runtime-dev, bootstrap-token-dev]
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Confirmar resultado sanitizado do bootstrap PC24x7
        shell: bash
        env:
          READY: ${{ needs.bootstrap-token-dev.outputs.bootstrap_ready }}
        run: |
          set -euo pipefail
          test "$READY" = "true" || { echo "::error::PC24x7_BOOTSTRAP_NOT_READY"; exit 4; }
          echo "PC24x7_BOOTSTRAP_READY=true"
