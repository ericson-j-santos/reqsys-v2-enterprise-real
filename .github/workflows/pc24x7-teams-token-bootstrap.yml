name: PC24x7 Teams Service Token Bootstrap

on:
  pull_request:
    paths:
      - 'scripts/bootstrap_pc24x7_teams_service_token.py'
      - 'tests/test_bootstrap_pc24x7_teams_service_token.py'
      - 'tests/test_pc24x7_teams_token_bootstrap_workflow.py'
      - '.github/workflows/pc24x7-teams-token-bootstrap.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/bootstrap_pc24x7_teams_service_token.py'
      - 'tests/test_pc24x7_teams_token_bootstrap_workflow.py'
      - '.github/workflows/pc24x7-teams-token-bootstrap.yml'
  schedule:
    - cron: '17 11 * * 1-5'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: pc24x7-teams-service-token-bootstrap-dev
  cancel-in-progress: false

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validar sintaxe e testes
        run: |
          python -m py_compile scripts/bootstrap_pc24x7_teams_service_token.py
          python -m pip install --disable-pip-version-check pytest==9.0.3
          pytest -q tests/test_bootstrap_pc24x7_teams_service_token.py tests/test_pc24x7_teams_token_bootstrap_workflow.py

  probe-repository-admin-jwt:
    if: github.event_name == 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
    steps:
      - name: Verificar presença no escopo do repositório sem expor valor
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${COFRE_ADMIN_JWT:-}" ]; then
            echo 'REPOSITORY_ADMIN_JWT_PRESENT=true'
          else
            echo 'REPOSITORY_ADMIN_JWT_PRESENT=false'
          fi

  bootstrap-dev:
    if: github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    env:
      REQSYS_API_BASE_URL: https://reqsys-api-dev.fly.dev
      COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      PC24X7_TEAMS_SERVICE_TOKEN_SECRET: reqsys-pc24x7-teams-service-token
      PC24X7_TEAMS_ALLOW_PROVISION: 'true'
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Inicializar evidência sanitizada
        shell: bash
        run: |
          cat > pc24x7-teams-token-bootstrap.json <<'JSON'
          {"status":"blocked","reason":"READINESS_NOT_EXECUTED","environment":"dev","mode":"provision_if_missing","token_created":false,"secret_value_exposed":false}
          JSON

      - name: Validar configuração governada
        shell: bash
        run: |
          set -euo pipefail
          for name in CCP_AZURE_CLIENT_ID CCP_AZURE_TENANT_ID CCP_AZURE_SUBSCRIPTION_ID COFRE_ADMIN_JWT; do
            if [ -z "${!name:-}" ]; then
              printf '%s\n' '{"status":"blocked","reason":"GOVERNED_CONFIGURATION_MISSING","environment":"dev","mode":"provision_if_missing","token_created":false,"secret_value_exposed":false}' > pc24x7-teams-token-bootstrap.json
              echo "::error::$name não configurado. Bootstrap permanece fail-closed."
              exit 2
            fi
          done

      - name: Login Azure por OIDC da identidade mutadora
        uses: azure/login@v2
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Instalar cliente Key Vault
        run: python -m pip install --disable-pip-version-check azure-identity azure-keyvault-secrets

      - name: Validar ou provisionar token S2S DEV
        id: bootstrap
        shell: bash
        run: |
          set +e
          output="$(python scripts/bootstrap_pc24x7_teams_service_token.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output" | tee pc24x7-teams-token-bootstrap.json
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pc24x7-teams-token-bootstrap-${{ github.run_id }}
          path: pc24x7-teams-token-bootstrap.json
          if-no-files-found: error
          retention-days: 30

      - name: Atualizar issue 1532
        if: always()
        uses: actions/github-script@v7
        env:
          READY: ${{ steps.bootstrap.outputs.ready }}
        with:
          script: |
            const marker = '<!-- reqsys-pc24x7-teams-token-bootstrap -->';
            const ready = process.env.READY === 'true';
            const body = `${marker}\n## PC24x7 Teams — token S2S DEV\n\n` +
              `- estado: \`${ready ? 'READY' : 'BLOCKED'}\`;\n` +
              `- modo: \`provision_if_missing\`;\n` +
              `- escopo: \`teams_gateway:ai_conversations\`;\n` +
              `- armazenamento: \`Azure Key Vault / reqsys-pc24x7-teams-service-token\`;\n` +
              `- valor do segredo exposto: \`não\`;\n` +
              `- execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.\n\n` +
              (ready ? 'Token existente foi reutilizado ou um novo token escopado foi emitido, armazenado e validado pela rota readiness.' : 'Bootstrap falhou fechado; nenhum valor sensível foi publicado.');
            const comments = await github.paginate(github.rest.issues.listComments, {owner: context.repo.owner, repo: context.repo.repo, issue_number: 1532, per_page: 100});
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body});
            else await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 1532, body});

      - name: Falhar fechado se token não estiver pronto
        if: steps.bootstrap.outputs.ready != 'true'
        run: exit 4
