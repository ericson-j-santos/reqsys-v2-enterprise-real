name: BACEN Executive Designation Lifecycle

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/EXECUTIVE-DESIGNATION.yaml"
      - "scripts/generate_bacen_executive_designation_lifecycle.py"
      - ".github/workflows/bacen-executive-designation-lifecycle.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/EXECUTIVE-DESIGNATION.yaml"
      - "scripts/generate_bacen_executive_designation_lifecycle.py"
  schedule:
    - cron: "23 8 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML
      - run: python -m py_compile scripts/generate_bacen_executive_designation_lifecycle.py
      - run: >-
          python scripts/generate_bacen_executive_designation_lifecycle.py
          --designation governance/bacen/EXECUTIVE-DESIGNATION.yaml
          --output artifacts/bacen/bacen-08-executive-designation-lifecycle.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-08-executive-designation-lifecycle
          path: artifacts/bacen/bacen-08-executive-designation-lifecycle.json
          if-no-files-found: error
          retention-days: 365
