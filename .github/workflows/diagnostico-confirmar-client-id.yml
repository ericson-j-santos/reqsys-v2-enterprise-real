name: Diagnostico - Confirmar identidade POWER_PLATFORM_CLIENT_ID

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hash:
    name: Calcular hash do appId (nao expoe o valor)
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 5
    steps:
      - name: Hash SHA-256 do POWER_PLATFORM_CLIENT_ID
        env:
          POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$POWER_PLATFORM_CLIENT_ID" | sha256sum | awk '{print "sha256(appId) =", $1}'
