name: TODO Event Relay — Teams + GitLab

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
  push:
    paths:
      - '.github/workflows/todo-event-relay.yml'
      - 'scripts/todo_event_relay_snapshot.py'
      - 'tests/test_todo_event_relay_snapshot.py'
      - 'config/control-plane-lifecycle-policy.json'

permissions:
  contents: write
  id-token: write

concurrency:
  group: todo-event-relay
  cancel-in-progress: true

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: reqsys-power-platform-dev
    env:
      PLANNER_TEAMS_DEV_TEAM_ID: 07936381-2d94-41db-9f46-a7b28008caba
      PLANNER_TEAMS_DEV_CHANNEL_ID: 19:ZW3ncXvFEGrJY-9yHd2MuFiRstJ8TQGmz2Fr_KUXqCI1@thread.tacv2
      GITLAB_PROJECT_ID: '84366761'

    steps:
      - name: Checkout do código produtor
        uses: actions/checkout@v4
        with:
          path: source

      - name: Testar contrato do produtor
        working-directory: source
        run: python -m pytest tests/test_todo_event_relay_snapshot.py -q

      - name: Autenticar no Microsoft Entra por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          tenant-id: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolver token Graph efêmero
        shell: bash
        run: |
          set -euo pipefail
          token="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          echo "POWER_PLATFORM_GRAPH_ACCESS_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Resolver credencial GitLab pelo Control Plane
        uses: ./source/.github/actions/resolve-managed-credential
        with:
          credential-id: gitlab-main-mirror
          consumer: github-actions:todo-event-relay
          export-env: GITLAB_MIRROR_TOKEN
          vault-name: ${{ vars.REQSYS_KEY_VAULT_NAME }}
          azure-client-id: ${{ vars.CCP_AZURE_CLIENT_ID_GITLAB }}
          azure-tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          evidence-path: source/audit/todo-event-relay-credential-resolution.json

      - name: Checkout da fila Git dedicada
        uses: actions/checkout@v4
        with:
          ref: todo-event-relay
          path: relay
          fetch-depth: 1

      - name: Gerar snapshot normalizado
        shell: bash
        run: |
          set -euo pipefail
          python source/scripts/todo_event_relay_snapshot.py --output relay/relay/snapshot.json
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('relay/relay/snapshot.json').read_text(encoding='utf-8'))
          assert p['contract'] == 'todo-event-relay-snapshot-v1'
          assert p['secret_values_persisted'] is False
          assert p['source_counts']['teams'] > 0
          assert p['source_counts']['gitlab'] > 0
          print('RELAY_SNAPSHOT_READY=true')
          PY

      - name: Publicar snapshot na branch relay
        working-directory: relay
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(git status --porcelain -- relay/snapshot.json)" ]; then
            echo 'RELAY_CHANGED=false'
            exit 0
          fi
          git config user.name 'reqsys-todo-relay[bot]'
          git config user.email 'reqsys-todo-relay[bot]@users.noreply.github.com'
          git add relay/snapshot.json
          git commit -m "chore(relay): refresh Teams/GitLab snapshot"
          git push origin HEAD:todo-event-relay
          echo 'RELAY_CHANGED=true'

      - name: Publicar evidência não sensível
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-event-relay-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            relay/relay/snapshot.json
            source/audit/todo-event-relay-credential-resolution.json
          if-no-files-found: warn
          retention-days: 14
