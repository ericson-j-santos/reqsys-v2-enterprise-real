name: Teams Power Platform Trigger URI Probe

on:
  pull_request:
    paths:
      - ".github/workflows/teams-powerplatform-trigger-uri-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FLOW_DISPLAY_NAME: robo_envia_teamsv2
  FLY_APP: reqsys-api-dev
  ARTIFACT_DIR: artifacts/teams-powerplatform-trigger-uri-probe

jobs:
  descobrir-e-sincronizar:
    name: Descobrir flowTriggerUri sem expor segredo
    runs-on: windows-latest
    environment:
      name: reqsys-power-platform-dev
    timeout-minutes: 25
    env:
      POWERPLATFORM_DEV_ENVIRONMENT_URL: ${{ secrets.POWER_PLATFORM_ENVIRONMENT_URL }}
      POWERPLATFORM_APP_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
      POWERPLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
      POWERPLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar configuração sem revelar valores
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null
          $state = [ordered]@{
            POWERPLATFORM_DEV_ENVIRONMENT_URL = -not [string]::IsNullOrWhiteSpace($env:POWERPLATFORM_DEV_ENVIRONMENT_URL)
            POWERPLATFORM_APP_ID = -not [string]::IsNullOrWhiteSpace($env:POWERPLATFORM_APP_ID)
            POWERPLATFORM_CLIENT_SECRET = -not [string]::IsNullOrWhiteSpace($env:POWERPLATFORM_CLIENT_SECRET)
            POWERPLATFORM_TENANT_ID = -not [string]::IsNullOrWhiteSpace($env:POWERPLATFORM_TENANT_ID)
            FLY_API_TOKEN = -not [string]::IsNullOrWhiteSpace($env:FLY_API_TOKEN)
          }
          $state | ConvertTo-Json | Set-Content -Encoding UTF8 "$env:ARTIFACT_DIR/secret-availability.json"
          $state | ConvertTo-Json -Compress | Write-Host
          foreach ($name in @('POWERPLATFORM_DEV_ENVIRONMENT_URL','POWERPLATFORM_APP_ID','POWERPLATFORM_CLIENT_SECRET','POWERPLATFORM_TENANT_ID')) {
            if (-not $state[$name]) { throw "BLOQUEIO: configuração obrigatória ausente: $name" }
          }

      - name: Instalar módulos administrativos Power Platform
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Microsoft.PowerApps.Administration.PowerShell -Scope CurrentUser -Force -AllowClobber
          Install-Module Microsoft.PowerApps.PowerShell -Scope CurrentUser -Force -AllowClobber
          Import-Module Microsoft.PowerApps.Administration.PowerShell -Force
          Import-Module Microsoft.PowerApps.PowerShell -Force
          Write-Host "Windows PowerShell $($PSVersionTable.PSVersion) com módulos Power Platform carregados."

      - name: Descobrir URI do gatilho via Get-AdminFlow
        id: flow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          Import-Module Microsoft.PowerApps.Administration.PowerShell -Force
          Import-Module Microsoft.PowerApps.PowerShell -Force

          Add-PowerAppsAccount `
            -Endpoint prod `
            -TenantID $env:POWERPLATFORM_TENANT_ID `
            -ApplicationId $env:POWERPLATFORM_APP_ID `
            -ClientSecret $env:POWERPLATFORM_CLIENT_SECRET | Out-Null

          $targetUrl = $env:POWERPLATFORM_DEV_ENVIRONMENT_URL.TrimEnd('/').ToLowerInvariant()
          $targetEnvironment = $null
          foreach ($candidate in @(Get-AdminPowerAppEnvironment)) {
            $candidateJson = $candidate | ConvertTo-Json -Depth 30 -Compress
            if ($candidateJson.ToLowerInvariant().Contains($targetUrl)) {
              $targetEnvironment = $candidate
              break
            }
          }
          if ($null -eq $targetEnvironment) {
            throw 'BLOQUEIO: ambiente Power Platform DEV não localizado pela URL governada.'
          }

          $environmentName = [string]$targetEnvironment.EnvironmentName
          if ([string]::IsNullOrWhiteSpace($environmentName)) {
            throw 'BLOQUEIO: EnvironmentName não retornado pelo Power Platform.'
          }

          $matches = @(Get-AdminFlow -EnvironmentName $environmentName | Where-Object {
            $_.DisplayName -eq $env:FLOW_DISPLAY_NAME
          })
          if ($matches.Count -ne 1) {
            throw "BLOQUEIO: esperado 1 fluxo '$($env:FLOW_DISPLAY_NAME)'; encontrados $($matches.Count)."
          }

          $flow = $matches[0]
          $flowName = [string]$flow.FlowName
          $flowTriggerUri = $null
          if ($null -ne $flow.Internal -and $null -ne $flow.Internal.properties) {
            $flowTriggerUri = [string]$flow.Internal.properties.flowTriggerUri
          }

          if ([string]::IsNullOrWhiteSpace($flowTriggerUri) -and -not [string]::IsNullOrWhiteSpace($flowName)) {
            $detail = Get-AdminFlow -EnvironmentName $environmentName -FlowName $flowName
            if ($null -ne $detail.Internal -and $null -ne $detail.Internal.properties) {
              $flowTriggerUri = [string]$detail.Internal.properties.flowTriggerUri
            }
          }

          $result = [ordered]@{
            environment_resolved = $true
            flow_resolved = $true
            flow_name_present = -not [string]::IsNullOrWhiteSpace($flowName)
            flow_trigger_uri_present = -not [string]::IsNullOrWhiteSpace($flowTriggerUri)
            fly_token_present_in_powerplatform_environment = -not [string]::IsNullOrWhiteSpace($env:FLY_API_TOKEN)
          }
          $result | ConvertTo-Json | Set-Content -Encoding UTF8 "$env:ARTIFACT_DIR/probe.json"
          $result | ConvertTo-Json -Compress | Write-Host

          if ([string]::IsNullOrWhiteSpace($flowTriggerUri)) {
            throw 'BLOQUEIO: Get-AdminFlow autenticou e localizou o fluxo, mas não expôs flowTriggerUri.'
          }

          Write-Output "::add-mask::$flowTriggerUri"
          $flowTriggerUri | Set-Content -NoNewline -Encoding UTF8 "$env:RUNNER_TEMP/teams_callback_url"
          "callback_discovered=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding ascii -Append

      - name: Setup Flyctl
        if: steps.flow.outputs.callback_discovered == 'true' && env.FLY_API_TOKEN != ''
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Sincronizar callback no Fly DEV sem revelar valor
        if: steps.flow.outputs.callback_discovered == 'true' && env.FLY_API_TOKEN != ''
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $callbackUrl = (Get-Content "$env:RUNNER_TEMP/teams_callback_url" -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($callbackUrl)) { throw 'Callback descoberto ficou vazio no arquivo efêmero.' }
          Write-Output "::add-mask::$callbackUrl"
          & flyctl secrets set "TEAMS_NOTIFICATIONS_WEBHOOK_URL=$callbackUrl" --app $env:FLY_APP
          if ($LASTEXITCODE -ne 0) { throw "flyctl secrets set falhou com código $LASTEXITCODE" }
          $result = [ordered]@{
            callback_discovered = $true
            fly_token_present = $true
            synced_to_fly = $true
            fly_app = $env:FLY_APP
            secret_name = 'TEAMS_NOTIFICATIONS_WEBHOOK_URL'
          }
          $result | ConvertTo-Json | Set-Content -Encoding UTF8 "$env:ARTIFACT_DIR/sync.json"

      - name: Bloquear se os escopos de segredo estiverem separados
        if: steps.flow.outputs.callback_discovered == 'true' && env.FLY_API_TOKEN == ''
        shell: powershell
        run: |
          $result = [ordered]@{
            callback_discovered = $true
            fly_token_present = $false
            synced_to_fly = $false
            reason = 'FLY_API_TOKEN não está no mesmo environment seguro; callback não foi persistido em artifact/output.'
          }
          $result | ConvertTo-Json | Set-Content -Encoding UTF8 "$env:ARTIFACT_DIR/sync.json"
          throw 'BLOQUEIO: callback descoberto, porém FLY_API_TOKEN não está no mesmo environment seguro.'

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teams-powerplatform-trigger-uri-probe-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/teams-powerplatform-trigger-uri-probe/
          if-no-files-found: warn
          retention-days: 30
