name: Validate ReqSys Public Showcase

on:
  workflow_dispatch:
  schedule:
    - cron: "19 10 * * 1-5"
  push:
    branches:
      - main
    paths:
      - 'docs/public-showcase/reqsys-linkedin/**'
      - 'docs/index.html'
      - 'docs/assets/**'
      - '.github/workflows/deploy-reqsys-showcase-pages.yml'
      - '.github/workflows/deploy-reqsys-pages-composite.yml'

permissions:
  contents: read
  actions: write

concurrency:
  group: reqsys-public-showcase-validation
  cancel-in-progress: true

jobs:
  validate:
    name: Validate static showcase
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate public showcase files
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/public-showcase/reqsys-linkedin/index.html
          test -f docs/public-showcase/reqsys-linkedin/assets/styles.css
          # README.md lista termos proibidos como documentação; validar só HTML/CSS/SVG publicáveis.
          scan_targets=(
            docs/public-showcase/reqsys-linkedin/index.html
            docs/public-showcase/reqsys-linkedin/assets
          )
          if grep -RniE \
            '(api[_-]?key|client[_-]?secret|password\s*[:=]|bearer\s+[a-z0-9._-]{20,}|connection\s+string|cpf|cnpj)' \
            "${scan_targets[@]}"; then
            echo 'Sensitive-looking term found in public showcase. Review required.'
            exit 1
          fi

      - name: Solicitar publicação canônica do Pages
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh workflow run teams-notification-dashboard.yml \
            --repo "${{ github.repository }}" \
            --ref main
          echo 'Showcase validado; publicação delegada ao pipeline canônico do dashboard Teams.'
