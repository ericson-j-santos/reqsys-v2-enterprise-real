name: Movimento Email Real Source Bridge — CI

on:
  push:
    branches:
      - feat/movimento-email-real-source-bridge-20260918
    paths:
      - "scripts/sincronizar_movimento_email_corporate.py"
      - "scripts/pc24x7_movimento_email_real_source_worker.py"
      - "docker/movimento-email-real-source/**"
      - "config/movimento-email-corporate-source-map.example.json"
      - "tests/test_movimento_email_corporate_sync.py"
      - ".sdd/specs/movimento-email-real-source-bridge.*"
      - ".github/workflows/movimento-email-real-source-bridge-ci.yml"
  pull_request:
    paths:
      - "scripts/sincronizar_movimento_email_corporate.py"
      - "scripts/pc24x7_movimento_email_real_source_worker.py"
      - "docker/movimento-email-real-source/**"
      - "config/movimento-email-corporate-source-map.example.json"
      - "tests/test_movimento_email_corporate_sync.py"
      - ".sdd/specs/movimento-email-real-source-bridge.*"
      - ".github/workflows/movimento-email-real-source-bridge-ci.yml"

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Testar contrato
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.0.3
          python -m py_compile             scripts/sincronizar_movimento_email_corporate.py             scripts/pc24x7_movimento_email_real_source_worker.py
          pytest -q tests/test_movimento_email_corporate_sync.py

      - name: Bloquear regressão para seed sintético
        run: |
          set -euo pipefail
          if grep -RniE 'seed_e2e|REQSYS_SOURCE_E2E'             scripts/sincronizar_movimento_email_corporate.py             scripts/pc24x7_movimento_email_real_source_worker.py             docker/movimento-email-real-source; then
            echo "::error::A bridge real não pode depender de seed sintético."
            exit 1
          fi

      - name: Validar SDD e política de ambiente
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          spec=json.loads(Path(".sdd/specs/movimento-email-real-source-bridge.spec.json").read_text())
          assert spec["runtime_target"] == "pc24x7"
          assert spec["source"]["synthetic"] is False
          assert spec["controls"]["production_enabled"] is False
          assert spec["controls"]["source_tls_required"] is True
          assert spec["controls"]["source_trust_server_certificate"] is False
          print("SDD_REAL_SOURCE_CONTRACT=passed")
          PY

      - name: Validar build do worker
        run: |
          set -euo pipefail
          docker build             -f docker/movimento-email-real-source/Dockerfile             -t reqsys-movimento-email-real-source:ci .
