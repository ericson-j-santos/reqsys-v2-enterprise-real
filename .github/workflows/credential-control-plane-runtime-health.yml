name: Credential Control Plane Runtime Health

on:
  pull_request:
    paths:
      - "config/credential-control-plane.json"
      - "infra/fly-environments.json"
      - "scripts/project_credential_control_plane_health.py"
      - "scripts/build_credential_control_plane_dashboard.py"
      - "scripts/publish_reqsys_single_state.py"
      - "tests/test_project_credential_control_plane_health.py"
      - "tests/test_build_credential_control_plane_dashboard.py"
      - "tests/test_publish_reqsys_single_state.py"
      - ".github/workflows/credential-control-plane-runtime-health.yml"
  workflow_dispatch:
    inputs:
      strict:
        description: Falhar se a reconciliação não estiver HEALTHY
        required: true
        type: boolean
        default: false
  schedule:
    - cron: "41 */6 * * *"

permissions:
  contents: read

concurrency:
  group: credential-control-plane-runtime-health-${{ github.ref_name }}
  cancel-in-progress: false

env:
  HEALTH_ROOT: artifacts/credential-control-plane

jobs:
  contract-tests:
    name: Validar contrato e projeção
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar testes focados
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==9.0.3"
          python -m pytest -q \
            tests/test_validate_credential_control_plane.py \
            tests/test_project_credential_control_plane_health.py \
            tests/test_build_credential_control_plane_dashboard.py \
            tests/test_publish_reqsys_single_state.py

      - name: Validar catálogo canônico
        run: python scripts/validate_credential_control_plane.py

  capture-fly:
    name: Capturar metadados Fly — ${{ matrix.environment }}
    if: ${{ github.event_name != 'pull_request' }}
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        environment: [dev, hml, prod]
    environment:
      name: ${{ matrix.environment == 'hml' && 'staging' || matrix.environment == 'prod' && 'production' || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Capturar estado sanitizado existente
        id: capture
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          TARGET_ENV: ${{ matrix.environment }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HEALTH_ROOT/fly-states"

          if [ -z "${FLY_API_TOKEN:-}" ]; then
            printf '{"environment":"%s","captured":false,"reason":"FLY_API_TOKEN_unavailable","secret_values_exposed":false}\n' \
              "$TARGET_ENV" > "$HEALTH_ROOT/fly-states/capture-${TARGET_ENV}.json"
            echo "captured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          set +e
          python scripts/capture_fly_environment_state.py \
            --environment "$TARGET_ENV" \
            --expected-sha "$GITHUB_SHA" \
            --phase read_only \
            --output "$HEALTH_ROOT/fly-states/fly-state-${TARGET_ENV}.json"
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            printf '{"environment":"%s","captured":false,"reason":"collector_failed","exit_code":%s,"secret_values_exposed":false}\n' \
              "$TARGET_ENV" "$rc" > "$HEALTH_ROOT/fly-states/capture-${TARGET_ENV}.json"
            rm -f "$HEALTH_ROOT/fly-states/fly-state-${TARGET_ENV}.json"
            echo "captured=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "captured=true" >> "$GITHUB_OUTPUT"

      - name: Upload de evidência sanitizada
        uses: actions/upload-artifact@v4
        with:
          name: credential-control-plane-fly-${{ matrix.environment }}
          path: ${{ env.HEALTH_ROOT }}/fly-states/
          if-no-files-found: error
          retention-days: 30

  aggregate:
    name: Consolidar Control Plane e Dashboard
    if: ${{ always() && github.event_name != 'pull_request' }}
    needs: [contract-tests, capture-fly]
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Baixar evidências de ambientes
        uses: actions/download-artifact@v4
        with:
          pattern: credential-control-plane-fly-*
          path: ${{ env.HEALTH_ROOT }}/fly-states
          merge-multiple: true

      - name: Projetar saúde do Control Plane
        shell: bash
        run: |
          set -euo pipefail
          args=()
          while IFS= read -r path; do
            args+=(--fly-state "$path")
          done < <(find "$HEALTH_ROOT/fly-states" -type f -name 'fly-state-*.json' | sort)

          strict_arg=()
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.strict }}" = "true" ]; then
            strict_arg=(--strict)
          fi

          python scripts/project_credential_control_plane_health.py \
            "${args[@]}" \
            --output "$HEALTH_ROOT/health.json" \
            "${strict_arg[@]}"

      - name: Gerar painel visual autocontido
        run: |
          python scripts/build_credential_control_plane_dashboard.py \
            --health "$HEALTH_ROOT/health.json" \
            --output "$HEALTH_ROOT/index.html"

      - name: Construir fonte executiva determinística
        shell: bash
        run: |
          set -euo pipefail
          workdir=.tmp/credential-control-plane-single-state
          mkdir -p "$workdir"
          cp docs/ops-dashboard/data/runtime-executive-index.json "$workdir/runtime.json" 2>/dev/null || echo '{}' > "$workdir/runtime.json"
          cp docs/ops-dashboard/data/merge-intelligence-index.json "$workdir/quality.json" 2>/dev/null || echo '{}' > "$workdir/quality.json"
          echo '{}' > "$workdir/parallelism.json"
          python scripts/build_unified_executive_integration_index.py \
            --parallelism "$workdir/parallelism.json" \
            --runtime "$workdir/runtime.json" \
            --quality "$workdir/quality.json" \
            --output "$workdir/unified.json"

      - name: Projetar no ReqSys Single State
        run: |
          python scripts/publish_reqsys_single_state.py \
            --source .tmp/credential-control-plane-single-state/unified.json \
            --credential-health "$HEALTH_ROOT/health.json" \
            --output "$HEALTH_ROOT/reqsys-single-state.json"

      - name: Resumo operacional
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os

          path = os.path.join(os.environ["HEALTH_ROOT"], "health.json")
          data = json.load(open(path, encoding="utf-8"))
          summary = data["summary"]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as out:
              out.write("# Credential & Environment Control Plane\n\n")
              out.write(f"- Estado: **{data['status']}**\n")
              out.write(f"- Bindings: **{summary['bindings_total']}**\n")
              out.write(f"- Disponíveis: **{summary['available_bindings']}**\n")
              out.write(f"- Ausentes: **{summary['missing_bindings']}**\n")
              out.write(f"- Degradados: **{summary['degraded_bindings']}**\n")
              out.write(f"- Evidência indisponível: **{summary['unknown_bindings']}**\n")
              out.write("- Valores secretos expostos: **não**\n")
              out.write("- Promoção automática: **não**\n")
          PY

      - name: Publicar artefatos
        uses: actions/upload-artifact@v4
        with:
          name: credential-control-plane-runtime-health
          path: |
            ${{ env.HEALTH_ROOT }}/health.json
            ${{ env.HEALTH_ROOT }}/index.html
            ${{ env.HEALTH_ROOT }}/reqsys-single-state.json
          if-no-files-found: error
          retention-days: 90
