name: Frontend Readiness Gate

on:
  pull_request:
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-readiness-gate.yml'
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-readiness-gate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  readiness:
    name: Frontend readiness matrix
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Test readiness gate contract
        working-directory: frontend
        run: npm run test:readiness

      - name: Test navigation integrity gate contract
        working-directory: frontend
        run: npm run test:navigation-integrity

      - name: Test navigation catalog reachability
        working-directory: frontend
        run: npx vitest run src/constants/navCatalog.test.js

      - name: Generate frontend readiness and navigation integrity evidence
        id: readiness
        working-directory: frontend
        run: |
          set +e
          npm run readiness:frontend
          readiness_code=$?
          npm run navigation:integrity
          navigation_code=$?

          cat artifacts/frontend-readiness/frontend-readiness.md >> "$GITHUB_STEP_SUMMARY"
          printf '\n---\n\n' >> "$GITHUB_STEP_SUMMARY"
          cat artifacts/navigation-integrity/navigation-integrity.md >> "$GITHUB_STEP_SUMMARY"

          if [ "$readiness_code" -ne 0 ] || [ "$navigation_code" -ne 0 ]; then
            exit 1
          fi

      - name: Upload readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-readiness-${{ github.run_id }}
          path: |
            frontend/artifacts/frontend-readiness/
            frontend/artifacts/navigation-integrity/
          if-no-files-found: error
          retention-days: 30
