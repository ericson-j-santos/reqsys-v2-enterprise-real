name: Power Platform Outlook DEV Read-only Probe

on:
  push:
    branches:
      - "ops/power-automate-outlook-probe-*"
    paths:
      - "scripts/powerplatform_outlook_connection_probe.py"
      - "tests/test_powerplatform_outlook_connection_probe.py"
      - ".github/workflows/powerplatform-outlook-dev-probe.yml"

permissions:
  contents: read

concurrency:
  group: powerplatform-outlook-dev-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe Outlook connection reference via governed Noteri
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    env:
      RULES_SHA: 10d2489e8cac3770d1c07fac4ccfece0a0112269
      CORRELATION_ID: powerplatform-outlook-dev-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\\powerplatform-outlook-dev\\evidence.json
      POWERPLATFORM_TENANT_ID: ${{ secrets.POWERPLATFORM_TENANT_ID }}
      POWERPLATFORM_APP_ID: ${{ secrets.POWERPLATFORM_APP_ID }}
      POWERPLATFORM_CLIENT_SECRET: ${{ secrets.POWERPLATFORM_CLIENT_SECRET }}
      DEV_ENVIRONMENT_URL: ${{ secrets.DEV_ENVIRONMENT_URL }}

    steps:
      - name: Checkout immutable source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical rules exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--repo", $env:GITHUB_WORKSPACE,
            "--session-prefix", "pa-outlook-probe",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/$env:GITHUB_REF_NAME"
          )
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=${{ github.sha }}" | Add-Content $env:GITHUB_OUTPUT

      - name: Validate focused tests through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-tests",
            "run", "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1", "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--", "pytest", "tests/test_powerplatform_outlook_connection_probe.py", "-q"
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Probe DEV through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          $probe = Join-Path $env:TARGET_PATH "scripts\\powerplatform_outlook_connection_probe.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run", "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2", "--timeout", "90",
            "--expected-head", $env:ANCHOR_SHA,
            "--", "python", $probe,
            "--evidence-file", $env:EVIDENCE_REL,
            "--correlation-id", $env:CORRELATION_ID
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Validate sanitized evidence
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $path = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path $path)) { throw "POWERPLATFORM_OUTLOOK_EVIDENCE_MISSING" }
          $e = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          if (-not $e.read_only) { throw "PROBE_NOT_READ_ONLY" }
          if ($e.secret_value_exposed) { throw "SECRET_EXPOSURE_REPORTED" }
          if ($e.production_touched) { throw "PRODUCTION_TOUCH_REPORTED" }

      - name: Upload sanitized evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powerplatform-outlook-dev-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\\artifacts\\powerplatform-outlook-dev\\evidence.json
          if-no-files-found: warn
          retention-days: 14
