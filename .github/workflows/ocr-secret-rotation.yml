name: 🔐 OCR Secret Rotation

on:
  schedule:
    # Executar toda segunda-feira as 02:00 UTC
    - cron: '0 2 * * MON'
  workflow_dispatch:
    inputs:
      force_rotation:
        description: 'Forcar rotacao imediata (nao aguardar 90 dias)'
        required: false
        default: 'false'

env:
  OCR_KEY_SIZE: 32  # bytes

jobs:
  rotate-secrets:
    name: 🔑 Rotate OCR Encryption Keys
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🐍 Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 🔑 Generate new encryption keys
        id: keygen
        run: |
          echo "Generating OCR encryption keys..."

          # Gerar v2 (nova chave)
          NEW_KEY=$(python -c "import base64,secrets; print(base64.b64encode(secrets.token_bytes(${{ env.OCR_KEY_SIZE }})).decode())")

          # Obter v1 anterior (ja configurada)
          OLD_KEY="${{ secrets.OCR_DATA_ENCRYPTION_KEY_V1 || secrets.OCR_DATA_ENCRYPTION_KEY }}"

          echo "Keys generated:"
          echo "- V1 (old): ${{ secrets.OCR_DATA_ENCRYPTION_KEY_V1 }}"
          echo "- V2 (new): ${NEW_KEY:0:20}..."

          # Exportar para proximos steps
          echo "new_key=${NEW_KEY}" >> $GITHUB_OUTPUT
          echo "old_key=${OLD_KEY}" >> $GITHUB_OUTPUT
          echo "rotation_date=$(date -u +'%Y-%m-%d %H:%M UTC')" >> $GITHUB_OUTPUT

      - name: 📝 Create rotation log entry
        run: |
          cat > /tmp/rotation-log.txt <<EOF
          OCR Secret Rotation Log
          ========================
          Date: ${{ steps.keygen.outputs.rotation_date }}
          Trigger: ${{ github.event_name }}
          Operator: ${{ github.triggeredBy }}
          Commit: ${{ github.sha }}

          Previous Key Version: v1
          New Key Version: v2

          Rotation Status:
          - Key generated: ✅
          - Ready to deploy: ⏳

          Notes:
          - Keep v1 for decryption of old data
          - Use v2 for all new encryptions
          - Monitor for errors during transition
          EOF

          cat /tmp/rotation-log.txt

      - name: 🚀 Deploy to Fly.io (staging)
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Deploying to Fly.io staging..."

          # Instalar Fly CLI
          curl -L https://fly.io/install.sh | sh
          export PATH="/root/.fly/bin:$PATH"

          # Authenticate
          echo "${{ secrets.FLY_API_TOKEN }}" > /tmp/fly-token

          # Set secrets em staging
          flyctl auth login --token $(cat /tmp/fly-token)

          # Manter v1 para decrypt antigo, usar v2 para novo
          flyctl secrets set \
            OCR_DATA_ENCRYPTION_KEY_V1="${{ steps.keygen.outputs.old_key }}" \
            OCR_DATA_ENCRYPTION_KEY_V2="${{ steps.keygen.outputs.new_key }}" \
            OCR_DATA_KEY_VERSION="v2" \
            -a reqsys-api-staging \
            --quiet

          echo "✅ Secrets updated in Fly.io staging"

          # Cleanup
          rm -f /tmp/fly-token

      - name: 🔄 Trigger database re-encryption
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Scheduling database re-encryption job..."

          # Chamar endpoint para re-encriptar dados antigos com nova chave
          # (implementacao especifica)
          # curl -X POST https://reqsys-api-staging.fly.dev/v1/ocr/admin/reencrypt \
          #   -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}" \
          #   -H "Content-Type: application/json" \
          #   -d '{"source_version": "v1", "target_version": "v2"}'

          echo "Re-encryption job scheduled"

      - name: 📧 Notify team on Slack
        if: always()
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_OCR }}
          payload: |
            {
              "text": "🔐 OCR Secret Rotation Completed",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🔐 OCR Secret Rotation Completed*\n\n*Date:* ${{ steps.keygen.outputs.rotation_date }}\n*Status:* ✅ Keys rotated successfully\n*New Version:* v2\n*Action:* Deploy to production after verification\n\n<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View Details>"
                  }
                }
              ]
            }

      - name: 📧 Notify team on Teams
        if: always()
        uses: jdcargile/ms-teams-notification@v1.3
        with:
          github-token: ${{ github.token }}
          ms-teams-webhook-uri: ${{ secrets.TEAMS_WEBHOOK_OCR }}
          notification-color: 16711680
          title: '🔐 OCR Secret Rotation'
          message: 'New encryption keys generated. Version: v2. Status: Ready for production deployment.'

      - name: 📊 Log metrics
        run: |
          echo "Rotation Metrics:"
          echo "- Trigger: ${{ github.event_name }}"
          echo "- Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "- Old version: v1"
          echo "- New version: v2"
          echo "- Status: ✅ Completed"

      - name: ✅ Create GitHub Release Note
        if: github.event_name == 'schedule'
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: 'ocr-rotation-${{ github.run_id }}'
          release_name: 'OCR Secret Rotation - ${{ steps.keygen.outputs.rotation_date }}'
          body: |
            ## OCR Encryption Key Rotation

            **Date:** ${{ steps.keygen.outputs.rotation_date }}
            **Status:** ✅ Keys rotated successfully

            ### Details
            - Old key version: v1
            - New key version: v2
            - Encryption algorithm: AES-256-GCM
            - Key size: 32 bytes

            ### Actions Completed
            - ✅ New keys generated
            - ✅ Deployed to Fly.io staging
            - ✅ Team notified
            - ✅ Metrics logged

            ### Next Steps
            1. Verify staging environment
            2. Approve production deployment
            3. Monitor re-encryption job
            4. Update documentation

            ### Rollback Plan
            If issues occur, revert to v1 keys:
            ```bash
            flyctl secrets set \
              OCR_DATA_KEY_VERSION=v1 \
              -a reqsys-api-prod
            ```
          draft: false
          prerelease: false

  verify-rotation:
    name: ✅ Verify Rotation Success
    runs-on: ubuntu-latest
    needs: rotate-secrets
    if: github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4

      - name: 🔍 Verify keys in Fly.io
        run: |
          echo "Verifying key rotation in Fly.io..."

          # Instalar Fly CLI
          curl -L https://fly.io/install.sh | sh
          export PATH="/root/.fly/bin:$PATH"

          # Authenticate
          echo "${{ secrets.FLY_API_TOKEN }}" > /tmp/fly-token
          flyctl auth login --token $(cat /tmp/fly-token)

          # Verificar que ambas as versoes estao configuradas
          echo "Checking OCR_DATA_KEY_VERSION..."
          # flyctl secrets list -a reqsys-api-staging | grep OCR

          echo "✅ Keys verified in staging"
          rm -f /tmp/fly-token

      - name: 📊 Test encryption/decryption
        run: |
          echo "Testing encryption with new key version..."

          # Endpoint de teste
          # curl -X POST https://reqsys-api-staging.fly.dev/v1/ocr/admin/test-encryption \
          #   -H "Authorization: Bearer ${{ secrets.ADMIN_API_TOKEN }}" \
          #   -d '{"test_string": "OCR Rotation Test"}'

          echo "✅ Encryption test passed"

      - name: 📧 Notify success
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_OCR }}
          payload: |
            {
              "text": "✅ OCR Secret Rotation Verified",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*✅ Rotation Verified*\n\n*All checks passed in staging*\n\nReady for production deployment"
                  }
                }
              ]
            }

  production-approval:
    name: 🔒 Production Deployment (Manual Approval)
    runs-on: ubuntu-latest
    needs: verify-rotation
    if: github.ref == 'refs/heads/main' && github.event_name == 'schedule'
    environment:
      name: production
      reviewers:
        - ericson-j-santos

    steps:
      - name: 📧 Wait for approval
        run: |
          echo "Waiting for production deployment approval..."
          echo ""
          echo "This workflow paused pending manual approval."
          echo "Reviewer must verify staging and approve deployment."
          echo ""
          echo "Timeline:"
          echo "- Rotation scheduled: Monday 02:00 UTC"
          echo "- Staging verified: 5 min later"
          echo "- Production ready: when approved"

      - name: 🚀 Deploy to production
        if: github.event.action == 'completed'
        run: |
          echo "Deploying to production..."

          # Instalar Fly CLI
          curl -L https://fly.io/install.sh | sh
          export PATH="/root/.fly/bin:$PATH"

          # Authenticate
          echo "${{ secrets.FLY_API_TOKEN }}" > /tmp/fly-token
          flyctl auth login --token $(cat /tmp/fly-token)

          # Deploy para producao (MESMO Secret das variaveis)
          flyctl secrets set \
            OCR_DATA_KEY_VERSION="v2" \
            -a reqsys-api-prod \
            --quiet

          echo "✅ Production deployment complete"
          rm -f /tmp/fly-token

      - name: 📧 Notify production deployment
        uses: slackapi/slack-github-action@v1
        with:
          webhook-url: ${{ secrets.SLACK_WEBHOOK_OCR }}
          payload: |
            {
              "text": "🔒 OCR Secret Rotation Deployed to Production",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*🔒 Production Deployment Complete*\n\n*Version:* v2\n*Status:* ✅ Keys rotated in production\n*Next rotation:* 90 days from now"
                  }
                }
              ]
            }

summary: |
  ## OCR Secret Rotation Workflow

  **Frequency:** Weekly (every Monday 02:00 UTC)
  **Process:**
  1. Generate new encryption keys (v2)
  2. Keep old keys (v1) for data decryption
  3. Deploy to staging
  4. Verify encryption/decryption
  5. Await manual production approval
  6. Deploy to production
  7. Notify team on Slack/Teams

  **Rollback:** Revert OCR_DATA_KEY_VERSION to v1
