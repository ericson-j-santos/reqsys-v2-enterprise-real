name: GitHub Workflow Permission Readiness Watch

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/github-workflow-permission-readiness-watch.yml"
      - "scripts/evaluate_github_workflow_token_readiness.py"
      - "tests/test_evaluate_github_workflow_token_readiness.py"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      enforce:
        description: "Falhar explicitamente quando a credencial continuar bloqueada"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  issues: write

concurrency:
  group: github-workflow-permission-readiness-watch
  cancel-in-progress: false

jobs:
  contract-tests:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependency
        run: python -m pip install --disable-pip-version-check pytest
      - name: Compile readiness evaluator
        run: python -m py_compile scripts/evaluate_github_workflow_token_readiness.py
      - name: Run focused tests
        run: python -m pytest -q tests/test_evaluate_github_workflow_token_readiness.py

  probe:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 7
    outputs:
      ready: ${{ steps.report.outputs.ready }}
      stage: ${{ steps.probe.outputs.stage }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Probe governed workflow permission without exposing credential
        id: probe
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ACTIONS }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -uo pipefail
          set +x

          probe_branch="credential-probe/workflow-write-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          stage="missing_secret"
          branch_created="false"

          cleanup() {
            if [ "$branch_created" = "true" ]; then
              if ! gh api --method DELETE "repos/${REPOSITORY}/git/refs/heads/${probe_branch}" --silent >/dev/null 2>&1; then
                stage="cleanup_failed"
              fi
            fi
            echo "stage=${stage}" >> "$GITHUB_OUTPUT"
            echo "probe_branch=${probe_branch}" >> "$GITHUB_OUTPUT"
          }
          trap cleanup EXIT

          if [ -z "${GH_TOKEN:-}" ]; then
            exit 0
          fi

          if ! gh api user --silent >/dev/null 2>&1; then
            stage="authentication_failed"
            exit 0
          fi

          if ! gh api "repos/${REPOSITORY}" --silent >/dev/null 2>&1; then
            stage="repository_access_failed"
            exit 0
          fi

          main_sha="$(gh api "repos/${REPOSITORY}/commits/main" --jq .sha 2>/dev/null)" || {
            stage="repository_access_failed"
            exit 0
          }

          if ! gh api --method POST "repos/${REPOSITORY}/git/refs" \
            -f ref="refs/heads/${probe_branch}" \
            -f sha="$main_sha" --silent >/dev/null 2>&1; then
            stage="repository_access_failed"
            exit 0
          fi
          branch_created="true"

          payload="$(python - "$probe_branch" <<'PY'
          import base64
          import json
          import sys

          branch = sys.argv[1]
          content = (
              "name: ReqSys Credential Readiness Probe\n\n"
              "on:\n"
              "  workflow_dispatch:\n\n"
              "permissions:\n"
              "  contents: read\n\n"
              "jobs:\n"
              "  inert:\n"
              "    if: false\n"
              "    runs-on: ubuntu-latest\n"
              "    steps:\n"
              "      - run: echo inert\n"
          )
          print(json.dumps({
              "message": "chore(governance): validate workflow write permission",
              "content": base64.b64encode(content.encode()).decode(),
              "branch": branch,
          }))
          PY
          )"

          if ! gh api --method PUT \
            "repos/${REPOSITORY}/contents/.github/workflows/reqsys-credential-readiness-probe.yml" \
            --input - --silent <<<"$payload" >/dev/null 2>&1; then
            stage="workflow_write_failed"
            exit 0
          fi

          stage="ready"

      - name: Build sanitized readiness report
        id: report
        env:
          STAGE: ${{ steps.probe.outputs.stage }}
          PROBE_BRANCH: ${{ steps.probe.outputs.probe_branch }}
          ENFORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.enforce }}
        run: |
          set -euo pipefail
          args=(
            --stage "$STAGE"
            --probe-branch "$PROBE_BRANCH"
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            --output artifacts/governance/github-workflow-token-readiness.json
          )
          if [ "$ENFORCE" = "true" ]; then
            args+=(--enforce)
          fi
          python scripts/evaluate_github_workflow_token_readiness.py "${args[@]}"
          ready="$(python -c 'import json; print(str(json.load(open("artifacts/governance/github-workflow-token-readiness.json"))["ready"]).lower())')"
          echo "ready=$ready" >> "$GITHUB_OUTPUT"

      - name: Publish readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-workflow-token-readiness-${{ github.run_id }}
          path: artifacts/governance/github-workflow-token-readiness.json
          if-no-files-found: error
          retention-days: 365

      - name: Record first validated credential readiness
        if: steps.report.outputs.ready == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- reqsys-gh-workflow-token-ready -->';
            const issue_number = 1130;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              per_page: 100,
            });
            if (comments.some(comment => comment.body?.includes(marker))) {
              core.info('Readiness already recorded; skipping duplicate comment.');
              return;
            }
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number,
              body: [
                marker,
                '## Credencial governada validada',
                '',
                '- Autenticação: `success`',
                '- Acesso ao repositório: `success`',
                '- Escrita de workflow em branch efêmera: `success`',
                '- Limpeza da branch efêmera: `success`',
                `- Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '- Secret exibido ou alterado: `false`',
                '- Promoção executada: `false`',
                '- production_touched: `false`',
              ].join('\n'),
            });
