name: PR1173 Dependency Remediation

on:
  push:
    branches:
      - fix/gitlab-ci-stages-and-staging-target

permissions:
  contents: write

concurrency:
  group: pr1173-dependency-remediation
  cancel-in-progress: false

jobs:
  remediate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: fix/gitlab-ci-stages-and-staging-target
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Remediate frontend dependency audit
        working-directory: frontend
        run: |
          set -euo pipefail
          npm pkg set overrides.undici=7.29.0
          npm pkg set overrides.brace-expansion=5.0.8
          npm install --package-lock-only --ignore-scripts
          npm ci --ignore-scripts
          npm audit --audit-level=high
          npm run build

      - name: Remediate backend dependency audit
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          for relative in ('backend/requirements.txt', 'backend/requirements-audit.txt'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              old = 'cryptography==48.0.1'
              new = 'cryptography==50.0.0'
              if old not in text and new not in text:
                  raise SystemExit(f'cryptography pin not found in {relative}')
              path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          python -m pip install --disable-pip-version-check pip-audit
          pip-audit -r backend/requirements-audit.txt --no-deps

      - name: Commit audited dependency updates and remove temporary workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr1173-dependency-remediation.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/package.json frontend/package-lock.json backend/requirements.txt backend/requirements-audit.txt .github/workflows/pr1173-dependency-remediation.yml
          git diff --cached --check
          git commit -m 'fix(ci): remediate frontend and backend dependency audits'
          git push origin HEAD:fix/gitlab-ci-stages-and-staging-target
