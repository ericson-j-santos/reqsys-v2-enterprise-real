name: Desktop Watchdog RPC Current Rules

on:
  push:
    branches:
      - "diag/desktop-control-plane-inventory-20260927"
    paths:
      - ".github/workflows/desktop-watchdog-rpc-current-rules.yml"

permissions:
  contents: read

concurrency:
  group: desktop-watchdog-rpc-current-rules
  cancel-in-progress: true

jobs:
  recover:
    name: Run installed Desktop watchdog via fixed RPC
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    env:
      RULES_SHA: 881d9ca2f8e77025edb7298b22981109c567a730
      CORRELATION_ID: desktop-watchdog-rpc-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Assert exact Noteri host
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne "Noteri") { throw "NOTERI_HOST_MISMATCH" }

      - name: Checkout immutable diagnostic SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout current canonical operational rules
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed Noteri session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--repo", $env:GITHUB_WORKSPACE,
            "--session-prefix", "desktop-watchdog-rpc",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/$env:GITHUB_REF_NAME"
          )
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = (@($raw)[-1] | ConvertFrom-Json)
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) { throw "SESSION_LAUNCH_BLOCKED" }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          $evidence = Join-Path $env:RUNNER_TEMP "desktop-watchdog-rpc\evidence.json"
          "evidence_file=$evidence" | Add-Content $env:GITHUB_OUTPUT

      - name: Query and run exact installed Desktop watchdog
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          EVIDENCE_FILE: ${{ steps.session.outputs.evidence_file }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_watchdog_rpc_recovery.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "90",
            "--expected-head", "${{ github.sha }}",
            "--",
            "python", $script,
            "--confirm", "RUN-EXISTING-DESKTOP-WATCHDOG",
            "--evidence-file", $env:EVIDENCE_FILE
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Validate fixed-task evidence
        shell: powershell
        env:
          EVIDENCE_FILE: ${{ steps.session.outputs.evidence_file }}
        run: |
          $e = Get-Content -Raw -Encoding UTF8 $env:EVIDENCE_FILE | ConvertFrom-Json
          if (-not $e.ok) { throw "WATCHDOG_RPC_NOT_OK:$($e.result)" }
          if ($e.result -ne "EXISTING_DESKTOP_WATCHDOG_RUN_REQUESTED") { throw "WATCHDOG_RPC_RESULT_MISMATCH" }
          if ($e.source_host -ne "Noteri" -or $e.target_host -ne "DESKTOP-PDQK954") { throw "HOST_IDENTITY_MISMATCH" }
          if (-not $e.run_requested -or $e.task_created_or_modified) { throw "WATCHDOG_MUTATION_CONTRACT_FAILED" }
          if ($e.production_touched -or $e.secrets_read -or $e.credentials_supplied) { throw "WATCHDOG_SAFETY_CONTRACT_FAILED" }

      - name: Upload sanitized evidence
        if: always() && steps.session.outputs.evidence_file != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-watchdog-rpc-${{ github.run_id }}
          path: ${{ steps.session.outputs.evidence_file }}
          if-no-files-found: error
          retention-days: 7
