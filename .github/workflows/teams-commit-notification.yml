name: Teams Commit Notification

on:
  workflow_run:
    workflows:
      - "Ollama CI Triage"
      - "PR CI Remediation"
    types: [completed]
  push:
    branches:
      - main
    paths-ignore:
      - "ops-dashboard/data/teams-notification-slo.json"
      - "ops-dashboard/data/teams-notification-slo.md"
  schedule:
    - cron: "0 12 * * 1"
  workflow_dispatch:
    inputs:
      operation:
        description: Operação manual governada
        required: true
        default: notify
        type: choice
        options:
          - notify
          - reconcile-flow-bot
      message:
        description: Mensagem opcional para validar o canal do Teams
        required: false
        type: string

permissions:
  actions: read
  contents: read

jobs:
  reconcile-flow-bot:
    name: Reconciliar owner e comprovar entrega Flow Bot
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reconcile-flow-bot'
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 8
    env:
      COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
      TEAMS_FLOW_BOT_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      TEAMS_FLOW_BOT_OWNER_EMAIL: ${{ secrets.TEAMS_WEBHOOK_RECIPIENT }}
      TEAMS_FLOW_BOT_RECIPIENT: ${{ secrets.TEAMS_WEBHOOK_RECIPIENT }}
      CORRELATION_ID: pc24x7-teams-flow-bot-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"

      - name: Configurar Node para locator assinado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: "20"

      - name: Validar contrato e secrets sem expor valores
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/reconcile_pc24x7_teams_flow_bot_owner.py
          node scripts/resolve_pc24x7_dev_locator.mjs --self-test
          for name in COFRE_ADMIN_JWT TEAMS_FLOW_BOT_WEBHOOK_URL TEAMS_FLOW_BOT_OWNER_EMAIL TEAMS_FLOW_BOT_RECIPIENT; do
            test -n "${!name:-}" || { echo "::error::$name ausente"; exit 2; }
          done
          echo "::add-mask::$COFRE_ADMIN_JWT"
          echo "::add-mask::$TEAMS_FLOW_BOT_WEBHOOK_URL"
          echo "::add-mask::$TEAMS_FLOW_BOT_OWNER_EMAIL"
          echo "::add-mask::$TEAMS_FLOW_BOT_RECIPIENT"

      - name: Resolver runtime PC24x7 DEV vigente
        id: reconcile-locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pc24x7-teams-flow-bot-reconcile
          node scripts/resolve_pc24x7_dev_locator.mjs \
            --output artifacts/pc24x7-teams-flow-bot-reconcile/signed-locator.json

      - name: Reconciliar owner e executar entrega real
        shell: bash
        env:
          REQSYS_API_BASE_URL: ${{ steps.reconcile-locator.outputs.base_url }}
        run: |
          set -euo pipefail
          python scripts/reconcile_pc24x7_teams_flow_bot_owner.py \
            --confirm RECONCILE-PC24X7-TEAMS-FLOW-BOT-DEV \
            --evidence-file artifacts/pc24x7-teams-flow-bot-reconcile/evidence.json

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: pc24x7-teams-flow-bot-reconcile-${{ github.run_id }}
          path: |
            artifacts/pc24x7-teams-flow-bot-reconcile/evidence.json
            artifacts/pc24x7-teams-flow-bot-reconcile/signed-locator.json
          if-no-files-found: error
          retention-days: 30

  notify-teams:
    name: Enviar commit ao Teams
    if: github.event_name != 'workflow_dispatch' || inputs.operation != 'reconcile-flow-bot'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEAMS_GATEWAY_DESTINO_ID: ${{ secrets.TEAMS_GATEWAY_DESTINO_ID }}
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"

      - name: Preparar Node para locator DEV assinado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: "20"

      - name: Validar gateway
        run: |
          python -m py_compile tools/geradores/teams_graph_gateway_autocontido.py
          python tools/geradores/teams_graph_gateway_autocontido.py self-test

      - name: Validar locator PC24x7 fail-closed
        run: node scripts/resolve_pc24x7_dev_locator.mjs --self-test

      - name: Resolver runtime PC24x7 DEV vigente
        id: locator
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p artifacts/teams-commit-notification
          set +e
          node scripts/resolve_pc24x7_dev_locator.mjs \
            --output artifacts/teams-commit-notification/signed-locator.json
          locator_rc=$?
          set -e
          if [[ "$locator_rc" -eq 0 ]]; then
            echo "resolved=true" >> "$GITHUB_OUTPUT"
            echo "reason=locator assinado vigente" >> "$GITHUB_OUTPUT"
          else
            echo "resolved=false" >> "$GITHUB_OUTPUT"
            echo "reason=locator PC24x7 indisponível" >> "$GITHUB_OUTPUT"
            echo "::warning title=Locator PC24x7 indisponível::A entrega tentará o webhook governado de contingência."
          fi

      - name: Exportar Teams Gateway efêmero
        if: steps.locator.outputs.resolved == 'true'
        shell: bash
        env:
          RESOLVED_GATEWAY_BASE_URL: ${{ steps.locator.outputs.base_url }}
        run: |
          set -euo pipefail
          [[ "$RESOLVED_GATEWAY_BASE_URL" == https://*.trycloudflare.com ]] || {
            echo "::error::Locator resolveu destino não permitido"
            exit 2
          }
          printf 'TEAMS_GATEWAY_BASE_URL=%s\n' "$RESOLVED_GATEWAY_BASE_URL" >> "$GITHUB_ENV"

      - name: Validar configuração do Teams
        id: teams-config
        shell: bash
        env:
          LOCATOR_RESOLVED: ${{ steps.locator.outputs.resolved }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEAMS_WEBHOOK_RECIPIENT: ${{ secrets.TEAMS_WEBHOOK_RECIPIENT }}
        run: |
          set -euo pipefail
          if [[ "$LOCATOR_RESOLVED" == "true" && "${TEAMS_GATEWAY_BASE_URL:-}" == https://*.trycloudflare.com && "${TEAMS_GATEWAY_DESTINO_ID:-}" == *"@"* ]]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "delivery_mode=gateway" >> "$GITHUB_OUTPUT"
            echo "reason=gateway canônico disponível" >> "$GITHUB_OUTPUT"
            echo "Teams Messaging Gateway canônico configurado; notificação será enviada."
          elif [[ "$LOCATOR_RESOLVED" != "true" && -n "${TEAMS_WEBHOOK_URL:-}" && "${TEAMS_WEBHOOK_RECIPIENT:-}" == *"@"* ]]; then
            echo "::add-mask::$TEAMS_WEBHOOK_URL"
            echo "::add-mask::$TEAMS_WEBHOOK_RECIPIENT"
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "delivery_mode=webhook_fallback" >> "$GITHUB_OUTPUT"
            echo "reason=webhook governado de contingência" >> "$GITHUB_OUTPUT"
            echo "::warning title=Teams em modo de contingência::Gateway PC24x7 indisponível; entrega seguirá pelo webhook governado."
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "delivery_mode=unavailable" >> "$GITHUB_OUTPUT"
            echo "reason=Nenhuma rota Teams governada disponível" >> "$GITHUB_OUTPUT"
            echo "::error title=Teams não configurado::Gateway PC24x7 e webhook de contingência estão indisponíveis."
            exit 1
          fi

      - name: Enviar notificação
        if: steps.teams-config.outputs.configured == 'true'
        id: notify
        env:
          EVENT_NAME: ${{ github.event_name }}
          REPOSITORY: ${{ github.repository }}
          REF_NAME: ${{ github.ref_name }}
          ACTOR: ${{ github.actor }}
          SHA: ${{ github.sha }}
          SERVER_URL: ${{ github.server_url }}
          RUN_ID: ${{ github.run_id }}
          MANUAL_MESSAGE: ${{ inputs.message }}
          EVENT_PATH: ${{ github.event_path }}
          GITHUB_TOKEN: ${{ github.token }}
          DELIVERY_MODE: ${{ steps.teams-config.outputs.delivery_mode }}
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEAMS_WEBHOOK_RECIPIENT: ${{ secrets.TEAMS_WEBHOOK_RECIPIENT }}
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          import subprocess
          import sys
          import re
          import tempfile
          import zipfile
          from io import BytesIO
          from pathlib import Path
          from urllib.parse import urlsplit
          from urllib.request import HTTPRedirectHandler, Request, build_opener, urlopen

          event = json.loads(Path(os.environ["EVENT_PATH"]).read_text(encoding="utf-8"))
          repository = os.environ["REPOSITORY"]
          sha = os.environ["SHA"]
          short_sha = sha[:7]
          server_url = os.environ["SERVER_URL"]
          commit_url = f"{server_url}/{repository}/commit/{sha}"
          run_url = f"{server_url}/{repository}/actions/runs/{os.environ['RUN_ID']}"
          repository_url = f"{server_url}/{repository}"
          event_name = os.environ["EVENT_NAME"]
          delivery_mode = os.environ["DELIVERY_MODE"]
          if delivery_mode not in {"gateway", "webhook_fallback"}:
              raise SystemExit(f"Modo de entrega Teams inválido: {delivery_mode}")

          class StripAuthorizationOnCrossHostRedirect(HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  redirected = super().redirect_request(req, fp, code, msg, headers, newurl)
                  if (
                      redirected is not None
                      and urlsplit(req.full_url).netloc.casefold()
                      != urlsplit(newurl).netloc.casefold()
                  ):
                      redirected.remove_header("Authorization")
                  return redirected

          artifact_opener = build_opener(StripAuthorizationOnCrossHostRedirect())

          def github_json(path):
              request = Request(
                  f"https://api.github.com/repos/{repository}/{path.lstrip('/')}",
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with urlopen(request, timeout=30) as response:
                  return json.loads(response.read().decode("utf-8"))

          def artifact_json(run_id, prefix, filename):
              payload = github_json(f"actions/runs/{run_id}/artifacts?per_page=100")
              artifacts = [
                  item for item in payload.get("artifacts", [])
                  if str(item.get("name") or "").startswith(prefix) and not item.get("expired")
              ]
              if not artifacts:
                  return None
              artifact = max(artifacts, key=lambda item: int(item.get("id") or 0))
              request = Request(
                  artifact["archive_download_url"],
                  headers={
                      "Authorization": f"Bearer {os.environ['GITHUB_TOKEN']}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  },
              )
              with artifact_opener.open(request, timeout=30) as response:
                  archive = BytesIO(response.read())
              with zipfile.ZipFile(archive) as bundle:
                  candidates = [name for name in bundle.namelist() if name.endswith(filename)]
                  if not candidates:
                      return None
                  return json.loads(bundle.read(candidates[0]).decode("utf-8"))

          if event_name == "push":
              head = event.get("head_commit") or {}
              commit_message = str(head.get("message") or "Commit sem mensagem").splitlines()[0]
              author = (head.get("author") or {}).get("name") or os.environ["ACTOR"]
              compare_url = event.get("compare") or commit_url
              commits = event.get("commits") or []
              commit_count = len(commits) or 1
              merge_match = re.search(r"governed CI-driven merge PR #(\d+)", commit_message, flags=re.IGNORECASE)
              if merge_match:
                  pr_number = int(merge_match.group(1))
                  title = f"ReqSys — PR #{pr_number} integrado"
                  subtitle = commit_message
              else:
                  pr_number = None
                  title = "ReqSys — novo commit"
                  subtitle = commit_message
              facts = [
                  {"title": "Repositório", "value": repository},
                  {"title": "Branch", "value": os.environ["REF_NAME"]},
                  {"title": "Commit", "value": short_sha},
                  {"title": "Autor", "value": author},
                  {"title": "Commits no push", "value": str(commit_count)},
              ]
              actions = [
                  {"type": "Action.OpenUrl", "title": "Ver alterações", "url": compare_url},
                  {"type": "Action.OpenUrl", "title": "Abrir workflow", "url": run_url},
              ]
              if pr_number:
                  actions.insert(
                      0,
                      {"type": "Action.OpenUrl", "title": f"Abrir PR #{pr_number}", "url": f"{repository_url}/pull/{pr_number}"},
                  )
              message = (
                  f"**{title}**\n\n"
                  f"{commit_message}\n\n"
                  f"**Repositório:** {repository}\n\n"
                  f"**Branch:** {os.environ['REF_NAME']}\n\n"
                  f"**Commit:** {short_sha}\n\n"
                  f"**Autor:** {author}\n\n"
                  f"[Ver alterações]({compare_url}) · [Abrir workflow]({run_url})"
              )
          elif event_name == "workflow_run":
              source = event.get("workflow_run") or {}
              source_name = str(source.get("name") or "")
              source_run_id = int(source.get("id") or 0)
              source_url = str(source.get("html_url") or run_url)
              source_conclusion = str(source.get("conclusion") or "unknown")

              if source_name == "Ollama CI Triage":
                  evidence = artifact_json(source_run_id, "ollama-ci-triage-", "evidence.json") or {}
                  pr = evidence.get("pr") if isinstance(evidence.get("pr"), dict) else {}
                  triage = evidence.get("triage") if isinstance(evidence.get("triage"), dict) else {}
                  pool = evidence.get("worker_pool") if isinstance(evidence.get("worker_pool"), dict) else {}
                  pr_number = pr.get("number")
                  pool_status = str(pool.get("status") or "not_enqueued")
                  if pool_status == "enqueued":
                      title = f"ReqSys — PR #{pr_number} correção automática acionada" if pr_number else "ReqSys — correção automática acionada"
                  elif pool_status == "blocked":
                      title = f"ReqSys — PR #{pr_number} correção automática bloqueada" if pr_number else "ReqSys — correção automática bloqueada"
                  else:
                      title = f"ReqSys — PR #{pr_number} triagem automática concluída" if pr_number else "ReqSys — triagem automática concluída"
                  subtitle = str(triage.get("root_cause") or evidence.get("result") or "Falha de CI analisada")
                  facts = [
                      {"title": "Workflow", "value": str(evidence.get("workflow") or "CI")},
                      {"title": "Categoria", "value": str(triage.get("category") or "n/a")},
                      {"title": "Worker Pool", "value": pool_status},
                      {"title": "HEAD", "value": str(evidence.get("analyzed_sha") or "n/a")[:12]},
                      {"title": "Resultado", "value": str(evidence.get("result") or source_conclusion)},
                  ]
                  actions = [{"type": "Action.OpenUrl", "title": "Abrir triagem", "url": source_url}]
                  if pr_number:
                      actions.insert(0, {"type": "Action.OpenUrl", "title": f"Abrir PR #{pr_number}", "url": f"{repository_url}/pull/{pr_number}"})
                  message = (
                      f"**{title}**\n\n{subtitle}\n\n"
                      f"**Worker Pool:** {pool_status}\n\n"
                      f"**HEAD:** {str(evidence.get('analyzed_sha') or 'n/a')[:12]}\n\n"
                      f"[Abrir triagem]({source_url})"
                  )
              elif source_name == "PR CI Remediation":
                  report = artifact_json(source_run_id, "pr-ci-remediation-evidence-", "report.json") or {}
                  reruns = int(report.get("reruns_executed") or 0)
                  if reruns <= 0:
                      with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                          output.write("notification_skipped=true\n")
                          output.write("skip_reason=no_material_remediation\n")
                      raise SystemExit(0)
                  pr_number = report.get("target_pr_number")
                  title = f"ReqSys — PR #{pr_number} CI reexecutado" if pr_number else "ReqSys — CI reexecutado"
                  subtitle = f"{reruns} reexecução(ões) transitória(s) disparada(s) de forma governada."
                  facts = [
                      {"title": "PR", "value": f"#{pr_number}" if pr_number else "fila"},
                      {"title": "Reexecuções", "value": str(reruns)},
                      {"title": "HEAD", "value": str(report.get("target_head_sha") or "n/a")[:12]},
                      {"title": "Estado", "value": "remediação automática"},
                  ]
                  actions = [{"type": "Action.OpenUrl", "title": "Abrir remediação", "url": source_url}]
                  if pr_number:
                      actions.insert(0, {"type": "Action.OpenUrl", "title": f"Abrir PR #{pr_number}", "url": f"{repository_url}/pull/{pr_number}"})
                  message = f"**{title}**\n\n{subtitle}\n\n[Abrir remediação]({source_url})"
              else:
                  with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
                      output.write("notification_skipped=true\n")
                      output.write("skip_reason=workflow_run_not_supported\n")
                  raise SystemExit(0)
          elif event_name == "schedule":
              title = "ReqSys — canário Teams"
              subtitle = "Validação semanal da integração GitHub → Teams"
              facts = [
                  {"title": "Repositório", "value": repository},
                  {"title": "Branch monitorada", "value": "main"},
                  {"title": "Commit atual", "value": short_sha},
                  {"title": "Status", "value": "Canário executado"},
              ]
              actions = [
                  {"type": "Action.OpenUrl", "title": "Abrir workflow", "url": run_url},
                  {"type": "Action.OpenUrl", "title": "Abrir repositório", "url": repository_url},
              ]
              message = f"**{title}**\n\n{subtitle}\n\n[ Abrir workflow ]({run_url})"
          else:
              manual = os.environ.get("MANUAL_MESSAGE", "").strip()
              title = "ReqSys — teste de notificação"
              subtitle = manual or "Teste manual da integração GitHub → Teams"
              facts = [
                  {"title": "Repositório", "value": repository},
                  {"title": "Executado por", "value": os.environ["ACTOR"]},
                  {"title": "Commit", "value": short_sha},
                  {"title": "Status", "value": "Teste solicitado"},
              ]
              actions = [
                  {"type": "Action.OpenUrl", "title": "Abrir workflow", "url": run_url},
                  {"type": "Action.OpenUrl", "title": "Abrir repositório", "url": repository_url},
              ]
              message = f"**{title}**\n\n{subtitle}\n\n[Abrir workflow]({run_url})"

          if delivery_mode == "webhook_fallback":
              facts.append({"title": "Rota de entrega", "value": "Webhook governado de contingência"})
              message += "\n\n**Rota:** webhook governado de contingência (PC24x7 indisponível)."

          card = {
              "$schema": "http://adaptivecards.io/schemas/adaptive-card.json",
              "type": "AdaptiveCard",
              "version": "1.2",
              "msteams": {"width": "Full"},
              "body": [
                  {
                      "type": "Container",
                      "style": "emphasis",
                      "bleed": True,
                      "items": [
                          {
                              "type": "ColumnSet",
                              "columns": [
                                  {
                                      "type": "Column",
                                      "width": "stretch",
                                      "items": [
                                          {
                                              "type": "TextBlock",
                                              "text": title,
                                              "weight": "Bolder",
                                              "size": "Large",
                                              "wrap": True,
                                          },
                                          {
                                              "type": "TextBlock",
                                              "text": subtitle,
                                              "spacing": "Small",
                                              "isSubtle": True,
                                              "wrap": True,
                                              "maxLines": 3,
                                          },
                                      ],
                                  },
                                  {
                                      "type": "Column",
                                      "width": "auto",
                                      "verticalContentAlignment": "Center",
                                      "items": [
                                          {
                                              "type": "TextBlock",
                                              "text": "✓",
                                              "weight": "Bolder",
                                              "size": "ExtraLarge",
                                              "color": "Good",
                                              "horizontalAlignment": "Right",
                                          }
                                      ],
                                  },
                              ],
                          }
                      ],
                  },
                  {
                      "type": "FactSet",
                      "spacing": "Medium",
                      "facts": facts,
                  },
                  {
                      "type": "TextBlock",
                      "text": "Entrega automatizada pelo ReqSys",
                      "spacing": "Medium",
                      "isSubtle": True,
                      "size": "Small",
                      "wrap": True,
                  },
              ],
              "actions": actions,
          }

          with tempfile.NamedTemporaryFile("w", encoding="utf-8", suffix=".json", delete=False) as card_file:
              json.dump(card, card_file, ensure_ascii=False)
              card_path = card_file.name

          evidence_path = Path(tempfile.gettempdir()) / f"teams-commit-{os.environ['RUN_ID']}.json"
          if delivery_mode == "gateway":
              command = [
                  sys.executable,
                  "scripts/notificar_teams.py",
                  "--titulo",
                  title,
                  "--texto",
                  message,
                  "--modo",
                  "flow_bot",
                  "--destino-tipo",
                  "chat_1a1",
                  "--strict",
                  "--output",
                  str(evidence_path),
              ]
          else:
              command = [
                  sys.executable,
                  "tools/geradores/teams_graph_gateway_autocontido.py",
                  "send-webhook",
                  "--title",
                  title,
                  "--message",
                  message,
                  "--adaptive-card-file",
                  card_path,
                  "--event-type",
                  "commit-notification-fallback",
              ]

          completed = subprocess.run(
              command,
              text=True,
              capture_output=True,
              check=False,
          )
          Path(card_path).unlink(missing_ok=True)
          if completed.stdout:
              print(completed.stdout)
          if completed.stderr:
              print(completed.stderr, file=sys.stderr)
          if completed.returncode != 0:
              raise SystemExit(completed.returncode)

          if delivery_mode == "gateway":
              result = json.loads(evidence_path.read_text(encoding="utf-8"))
              evidence_path.unlink(missing_ok=True)
              result["success"] = bool(result.get("entregue"))
              result["status_code"] = result.get("status_code") or result.get("provider_response", {}).get("status_code")
              result["correlation_id"] = result.get("correlation_id") or result.get("provider_response", {}).get("correlation_id")
          else:
              result = json.loads(completed.stdout)

          if not result.get("success"):
              raise SystemExit(f"Teams não confirmou envio pela rota {delivery_mode}: {result}")
          status_code = result.get("status_code")
          if status_code is not None and not 200 <= int(status_code) < 300:
              raise SystemExit(f"Teams retornou HTTP inesperado: {status_code}")

          correlation_id = result.get("correlation_id", "n/a")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write("notification_skipped=false\n")
              output.write(f"delivery_route={delivery_mode}\n")
              output.write(f"correlation_id={correlation_id}\n")
              output.write(f"status_code={status_code or 'accepted'}\n")
          PY

      - name: Registrar evidência
        if: always()
        shell: bash
        run: |
          {
            echo "### Teams Commit Notification"
            echo "- Evento: ${{ github.event_name }}"
            echo "- Commit: ${{ github.sha }}"
            echo "- Layout: Adaptive Card 1.5 com fallback Markdown"
            echo "- Modo: estrito"
            echo "- Rota selecionada: ${{ steps.teams-config.outputs.delivery_mode }}"
            echo "- Motivo da rota: ${{ steps.teams-config.outputs.reason }}"
            if [[ "${{ steps.teams-config.outputs.configured }}" != "true" ]]; then
              echo "- Status: ignorado"
              echo "- Motivo: ${{ steps.teams-config.outputs.reason }}"
              echo "- Ação manual: Settings → Secrets and variables → Actions"
            elif [[ "${{ steps.notify.outputs.notification_skipped }}" == "true" ]]; then
              echo "- Status: ignorado — sem mudança material"
              echo "- Motivo: ${{ steps.notify.outputs.skip_reason }}"
            elif [[ "${{ steps.notify.outcome }}" == "success" ]]; then
              echo "- Status: entregue/aceito"
              echo "- HTTP: ${{ steps.notify.outputs.status_code }}"
              echo "- Correlation ID: ${{ steps.notify.outputs.correlation_id }}"
              if [[ "${{ steps.notify.outputs.delivery_route }}" == "webhook_fallback" ]]; then
                echo "- Estado da rota: contingência ativa; restaurar locator/PC24x7"
              fi
            else
              echo "- Status: degradado — entrega não confirmada"
              echo "- Resultado da etapa: ${{ steps.notify.outcome }}"
              echo "- Workflow falhou: sim"
              echo "- Ação: validar o contrato/execução do fluxo Power Automate e repetir via workflow_dispatch"
              echo "::warning title=Entrega ao Teams não confirmada::A integração falhou e a execução permanece visivelmente degradada."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
