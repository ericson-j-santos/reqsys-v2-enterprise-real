name: Pages Single Writer Guard

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar proprietário único do Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validar publicador canônico
        shell: bash
        run: |
          set -euo pipefail
          canonical='.github/workflows/deploy-reqsys-pages-composite.yml'
          deploy_uses_pattern='^[[:space:]]*(-[[:space:]]*)?uses:[[:space:]]*actions/deploy-pages@'
          pages_write_pattern='^[[:space:]]*pages:[[:space:]]*write([[:space:]]*#.*)?$'

          mapfile -t publishers < <(
            grep -RIlE --include='*.yml' --include='*.yaml' "$deploy_uses_pattern" .github/workflows |
              sort
          )

          printf 'Publicadores encontrados (%s):\n' "${#publishers[@]}"
          printf ' - %s\n' "${publishers[@]:-nenhum}"

          if [[ ${#publishers[@]} -ne 1 ]]; then
            echo "Esperado exatamente 1 publicador GitHub Pages; encontrados ${#publishers[@]}." >&2
            exit 1
          fi

          if [[ "${publishers[0]}" != "$canonical" ]]; then
            echo "Publicador inesperado: ${publishers[0]}. Canônico: $canonical." >&2
            exit 1
          fi

          if grep -RIlE --include='*.yml' --include='*.yaml' "$pages_write_pattern" .github/workflows |
            grep -vFx "$canonical"; then
            echo 'Workflow não canônico possui permissão pages: write.' >&2
            exit 1
          fi

          echo "Proprietário único validado: $canonical"
