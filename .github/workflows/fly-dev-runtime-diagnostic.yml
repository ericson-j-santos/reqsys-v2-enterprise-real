name: Fly DEV Runtime Diagnostic

on:
  workflow_run:
    workflows: ["Fly DEV Fast Deploy"]
    types: [completed]

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: fly-dev-runtime-diagnostic-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

jobs:
  diagnostico:
    name: Diagnóstico somente leitura da API DEV
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    environment: dev
    timeout-minutes: 5
    env:
      FLY_APP: reqsys-api-dev
      API_URL: https://reqsys-api-dev.fly.dev
      REPORT_DIR: audit/fly-dev-runtime-diagnostic
    steps:
      - name: Checkout do SHA que falhou
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolver credencial Fly da API DEV
        uses: ./.github/actions/resolve-managed-credential
        with:
          credential-id: fly-api-dev-deploy
          consumer: github-actions:fly-dev
          export-env: FLY_API_TOKEN
          vault-name: ${{ vars.REQSYS_KEY_VAULT_NAME }}
          azure-client-id: ${{ vars.CCP_AZURE_CLIENT_ID_DEV }}
          azure-tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          evidence-path: audit/fly-dev-runtime-diagnostic/credential.json

      - name: Coletar estado e logs sem alterar o ambiente
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$REPORT_DIR"
          report="$REPORT_DIR/diagnostic.txt"

          {
            echo "correlation_id=fly-dev-diagnostic-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}"
            echo "source_run_id=${{ github.event.workflow_run.id }}"
            echo "source_attempt=${{ github.event.workflow_run.run_attempt }}"
            echo "source_sha=${{ github.event.workflow_run.head_sha }}"
            echo "collected_at_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            echo "=== FLY STATUS ==="
          } > "$report"

          timeout 30s flyctl status --app "$FLY_APP" >> "$report" 2>&1 || echo "fly_status_exit=$?" >> "$report"

          {
            echo
            echo "=== FLY LOGS ==="
          } >> "$report"
          timeout 45s flyctl logs --app "$FLY_APP" --no-tail >> "$report" 2>&1 || echo "fly_logs_exit=$?" >> "$report"

          {
            echo
            echo "=== PUBLIC ENDPOINTS ==="
          } >> "$report"
          for path in /health /api/runtime/health /api/runtime/readiness /api/runtime/liveness; do
            echo "--- $path ---" >> "$report"
            curl --silent --show-error --location \
              --connect-timeout 5 --max-time 10 \
              --write-out '\nhttp_code=%{http_code} total_seconds=%{time_total}\n' \
              "$API_URL$path" >> "$report" 2>&1 || echo "curl_exit=$?" >> "$report"
          done

          cat "$report"

      - name: Publicar evidência de diagnóstico
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-dev-runtime-diagnostic-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          path: audit/fly-dev-runtime-diagnostic
          if-no-files-found: error
          retention-days: 14
