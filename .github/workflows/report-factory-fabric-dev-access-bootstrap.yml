name: Report Factory Fabric DEV Access Bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-factory-fabric-dev-access-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    name: report-factory-fabric-dev-access-bootstrap
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    environment: development
    timeout-minutes: 8
    env:
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      EVIDENCE_FILE: artifacts/report-factory/fabric-dev-access-bootstrap.json

    steps:
      - name: Checkout immutable SHA
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validar alvo governado
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CCP_AZURE_CLIENT_ID)) {
            throw "CCP_AZURE_CLIENT_ID_missing"
          }

      - name: Aplicar acesso minimo e revalidar
        shell: powershell
        run: python scripts/report_factory_fabric_dev_access_bootstrap.py

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-factory-fabric-dev-access-bootstrap-${{ github.run_id }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Gate pos-condicao
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path $env:EVIDENCE_FILE)) { throw "evidence_missing" }
          $e = Get-Content -Raw $env:EVIDENCE_FILE | ConvertFrom-Json
          if ($e.status -ne "ok") { throw "bootstrap_not_ok" }
          if ($e.contributor_or_higher_after -ne $true) { throw "contributor_not_evidenced" }
          if ($e.secret_value_exposed -ne $false) { throw "secret_exposure_flag" }
          if ($e.identifiers_exposed -ne $false) { throw "identifier_exposure_flag" }
          if ($e.production_touched -ne $false) { throw "production_touched" }
          Write-Host "REPORT_FACTORY_FABRIC_DEV_ACCESS_OK"
