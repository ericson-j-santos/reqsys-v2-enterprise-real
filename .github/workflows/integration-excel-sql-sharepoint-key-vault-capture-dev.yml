name: Integration SQL Capture via Key Vault — DEV

on:
  push:
    branches:
      - main
      - ops/auto-capture-sql-locator-dev-20260913-v3
    paths:
      - ".github/workflows/integration-excel-sql-sharepoint-key-vault-capture-dev.yml"
      - "scripts/integration_excel_sql_sharepoint_sql_locator.py"
      - "tests/test_integration_excel_sql_sharepoint_sql_locator.py"
      - "scripts/provision_integration_excel_sql_sharepoint_dev_sql.py"
      - "tests/test_provision_integration_excel_sql_sharepoint_dev_sql.py"
  workflow_dispatch:
    inputs:
      strict:
        description: "Compatibilidade com o bootstrap RBAC DEV; o gate funcional permanece obrigatório"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: integration-excel-sql-sharepoint-key-vault-capture-dev
  cancel-in-progress: false

env:
  INTEGRATION_E2E_ENVIRONMENT: dev
  INTEGRATION_E2E_SQL_PROCEDURE: integration.usp_ConsultarPorIdentificadores
  EVIDENCE_DIR: audit/user-journey/excel-sql-sharepoint-dev/key-vault-capture
  EXPECTED_KEY_VAULT_NAME: kv-reqsys-ccp
  INTEGRATION_E2E_SQL_DSN_SECRET_NAME: ${{ vars.INTEGRATION_E2E_SQL_DSN_SECRET_NAME }}
  INTEGRATION_E2E_SQL_VALIDATION_MODE: ${{ vars.INTEGRATION_E2E_SQL_VALIDATION_MODE }}

jobs:
  capture:
    name: Key Vault → DSN → procedure → contrato SQL
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - name: Inicializar evidência sanitizada antes de passos falíveis
        shell: bash
        run: |
          set -euo pipefail
          python scripts/integration_sql_capture_preflight.py init \
            --output "$EVIDENCE_DIR/source.json"

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        id: python-setup
        continue-on-error: true
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências mínimas
        id: dependencies
        if: steps.python-setup.outcome == 'success'
        continue-on-error: true
        run: |
          set -euo pipefail
          bash .github/scripts/install-unixodbc-ci.sh
          python -m pip install --upgrade pip
          pip install pyodbc pytest

      - name: Validar contrato da sonda
        id: contract-tests
        if: steps.dependencies.outcome == 'success'
        continue-on-error: true
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest tests/test_integration_excel_sql_sharepoint_sql_locator.py -q

      - name: Resolver modo e atualizar evidência sanitizada
        id: sql-mode
        if: always()
        shell: bash
        env:
          AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
          PYTHON_SETUP_OUTCOME: ${{ steps.python-setup.outcome }}
          DEPENDENCIES_OUTCOME: ${{ steps.dependencies.outcome }}
          CONTRACT_TESTS_OUTCOME: ${{ steps.contract-tests.outcome }}
        run: |
          set -euo pipefail
          python scripts/integration_sql_capture_preflight.py resolve \
            --output "$EVIDENCE_DIR/source.json" \
            --mode "$INTEGRATION_E2E_SQL_VALIDATION_MODE" \
            --expected-vault "$EXPECTED_KEY_VAULT_NAME" \
            --actual-vault "$REQSYS_KEY_VAULT_NAME" \
            --tenant-configured "${AZURE_TENANT_ID:+true}" \
            --subscription-configured "${AZURE_SUBSCRIPTION_ID:+true}" \
            --secret-name "$INTEGRATION_E2E_SQL_DSN_SECRET_NAME" \
            --reader-configured false \
            --python-setup-outcome "$PYTHON_SETUP_OUTCOME" \
            --dependencies-outcome "$DEPENDENCIES_OUTCOME" \
            --contract-tests-outcome "$CONTRACT_TESTS_OUTCOME" \
            --github-output "$GITHUB_OUTPUT"

      - name: Login Azure OIDC com identidade reader Key Vault DEV
        id: azure-login
        if: steps.sql-mode.outputs.upstream_ready == 'true' && steps.sql-mode.outputs.direct_dsn_required == 'true' && steps.sql-mode.outputs.preflight_ready == 'true'
        continue-on-error: true
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ steps.sql-mode.outputs.azure_client_id }}
          tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Registrar resultado OIDC sanitizado
        if: always() && steps.sql-mode.outputs.upstream_ready == 'true' && steps.sql-mode.outputs.direct_dsn_required == 'true' && steps.sql-mode.outputs.preflight_ready == 'true' && steps.azure-login.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/integration_sql_capture_preflight.py oidc \
            --output "$EVIDENCE_DIR/source.json" \
            --outcome "${{ steps.azure-login.outcome }}"

      - name: Capturar DSN sem expor nome ou valor
        id: key-vault
        if: steps.sql-mode.outputs.direct_dsn_required == 'true' && steps.sql-mode.outputs.preflight_ready == 'true' && steps.azure-login.outcome == 'success'
        env:
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          secret_name="${INTEGRATION_E2E_SQL_DSN_SECRET_NAME:-}"
          if ! dsn="$(az keyvault secret show --vault-name "$REQSYS_KEY_VAULT_NAME" --name "$secret_name" --query value -o tsv 2>/dev/null)"; then
            printf '%s\n' '{"source":"azure_key_vault","status":"secret_read_unavailable","selection_mode":"exact_configured_name","dsn_resolved":false,"secret_value_exposed":false,"business_data_read":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/source.json"
            echo "dsn_resolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -z "$dsn" ]; then
            printf '%s\n' '{"source":"azure_key_vault","status":"secret_empty","selection_mode":"exact_configured_name","dsn_resolved":false,"secret_value_exposed":false,"business_data_read":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/source.json"
            echo "dsn_resolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "$dsn" in *$'\n'*|*$'\r'*)
            printf '%s\n' '{"source":"azure_key_vault","status":"secret_multiline_rejected","selection_mode":"exact_configured_name","dsn_resolved":false,"secret_value_exposed":false,"business_data_read":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/source.json"
            echo "dsn_resolved=false" >> "$GITHUB_OUTPUT"
            exit 0
          esac
          echo "::add-mask::$dsn"
          printf 'INTEGRATION_E2E_SQL_DSN=%s\n' "$dsn" >> "$GITHUB_ENV"
          echo "dsn_resolved=true" >> "$GITHUB_OUTPUT"
          printf '%s\n' '{"source":"azure_key_vault","status":"resolved","selection_mode":"exact_configured_name","dsn_resolved":true,"secret_value_exposed":false,"business_data_read":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/source.json"

      - name: Validar procedure e contrato SQL
        if: steps.sql-mode.outputs.direct_dsn_required == 'true' && steps.key-vault.outputs.dsn_resolved == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python scripts/integration_excel_sql_sharepoint_sql_locator.py \
            --output "$EVIDENCE_DIR/sql-locator.json" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "kv-sql-capture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Gerar evidência consolidada sanitizada
        if: always()
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          locator_arg=()
          if [ "${{ steps.key-vault.outputs.dsn_resolved }}" = "true" ]; then
            locator_arg=(--locator "$EVIDENCE_DIR/sql-locator.json")
          fi
          # A decisao vinculante fica no gate final; aqui apenas materializamos
          # a evidencia para que o artefato seja publicado mesmo quando bloqueia.
          python scripts/evaluate_integration_sql_capture_contract.py \
            --mode "${{ steps.sql-mode.outputs.mode }}" \
            --source "$EVIDENCE_DIR/source.json" \
            "${locator_arg[@]}" \
            --output "$EVIDENCE_DIR/capture-summary.json" \
            --source-sha "$GITHUB_SHA" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --correlation-id "kv-sql-capture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" || true

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: integration-sql-key-vault-capture-dev-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Gate funcional obrigatório antes do verde
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="$EVIDENCE_DIR/capture-summary.json"
          test -f "$summary"
          python - "$summary" <<'PY'
          import json, sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          print(json.dumps({
            "gate": payload["gate"],
            "sql_validation_mode": payload["sql_validation_mode"],
            "direct_dsn_required": payload["direct_dsn_required"],
            "passed": payload["passed"],
            "failed_checks": payload["failed_checks"],
          }, ensure_ascii=False))
          if not payload["passed"]:
              raise SystemExit(1)
          PY
