name: Integration SQL Capture via Key Vault — DEV

on:
  push:
    branches:
      - main
      - ops/auto-capture-sql-locator-dev-20260913-v3
    paths:
      - ".github/workflows/integration-excel-sql-sharepoint-key-vault-capture-dev.yml"
      - "scripts/integration_excel_sql_sharepoint_sql_locator.py"
      - "tests/test_integration_excel_sql_sharepoint_sql_locator.py"
      - "scripts/provision_integration_excel_sql_sharepoint_dev_sql.py"
      - "tests/test_provision_integration_excel_sql_sharepoint_dev_sql.py"
  workflow_dispatch:
    inputs:
      strict:
        description: "Compatibilidade com o bootstrap RBAC DEV; o gate funcional permanece obrigatório"
        required: false
        type: boolean
        default: true
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: integration-excel-sql-sharepoint-key-vault-capture-dev
  cancel-in-progress: false

env:
  INTEGRATION_E2E_ENVIRONMENT: dev
  INTEGRATION_E2E_SQL_PROCEDURE: integration.usp_ConsultarPorIdentificadores
  EVIDENCE_DIR: audit/user-journey/excel-sql-sharepoint-dev/key-vault-capture
  EXPECTED_KEY_VAULT_NAME: kv-reqsys-ccp
  INTEGRATION_E2E_SQL_DSN_SECRET_NAME: ${{ vars.INTEGRATION_E2E_SQL_DSN_SECRET_NAME }}

jobs:
  capture:
    name: Key Vault → DSN → procedure → contrato SQL
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências mínimas
        run: |
          set -euo pipefail
          bash .github/scripts/install-unixodbc-ci.sh
          python -m pip install --upgrade pip
          pip install pyodbc pytest

      - name: Validar contrato da sonda
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest tests/test_integration_excel_sql_sharepoint_sql_locator.py -q

      - name: Validar configuração OIDC DEV
        env:
          AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID_FLY_GOVERNED_COMMAND }}
          AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID REQSYS_KEY_VAULT_NAME; do
            test -n "${!name:-}"
          done
          test "$REQSYS_KEY_VAULT_NAME" = "$EXPECTED_KEY_VAULT_NAME"

      - name: Login Azure OIDC com identidade Key Vault DEV
        id: azure-login
        continue-on-error: true
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.CCP_AZURE_CLIENT_ID_FLY_GOVERNED_COMMAND }}
          tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Capturar DSN sem expor nome ou valor
        id: key-vault
        if: steps.azure-login.outcome == 'success'
        env:
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p "$EVIDENCE_DIR"
          secret_name="${INTEGRATION_E2E_SQL_DSN_SECRET_NAME:-}"
          if [ -z "$secret_name" ]; then
            printf '%s\n' '{"source":"azure_key_vault","status":"secret_name_unconfigured","selection_mode":"exact_configured_name","dsn_resolved":false,"secret_value_exposed":false,"business_data_read":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/source.json"
            exit 0
          fi
          if [[ ! "$secret_name" =~ ^[A-Za-z0-9-]{1,127}$ ]]; then
            printf '%s\n' '{"source":"azure_key_vault","status":"secret_name_invalid","selection_mode":"exact_configured_name","dsn_resolved":false,"secret_value_exposed":false,"business_data_read":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/source.json"
            exit 0
          fi
          if ! dsn="$(az keyvault secret show --vault-name "$REQSYS_KEY_VAULT_NAME" --name "$secret_name" --query value -o tsv 2>/dev/null)"; then
            printf '%s\n' '{"source":"azure_key_vault","status":"secret_read_unavailable","dsn_resolved":false,"secret_value_exposed":false,"business_data_read":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/source.json"
            exit 0
          fi
          if [ -z "$dsn" ]; then
            printf '%s\n' '{"source":"azure_key_vault","status":"secret_empty","dsn_resolved":false,"secret_value_exposed":false,"business_data_read":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/source.json"
            exit 0
          fi
          case "$dsn" in *$'\n'*|*$'\r'*)
            printf '%s\n' '{"source":"azure_key_vault","status":"secret_multiline_rejected","dsn_resolved":false,"secret_value_exposed":false,"business_data_read":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/source.json"
            exit 0
          esac

          echo "::add-mask::$dsn"
          printf 'INTEGRATION_E2E_SQL_DSN=%s\n' "$dsn" >> "$GITHUB_ENV"
          printf '%s\n' '{"source":"azure_key_vault","status":"resolved","selection_mode":"exact_configured_name","dsn_resolved":true,"secret_value_exposed":false,"business_data_read":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/source.json"

      - name: Registrar bloqueio OIDC sanitizado
        if: steps.azure-login.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' '{"source":"azure_key_vault","status":"oidc_login_failed","dsn_resolved":false,"secret_value_exposed":false,"business_data_read":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/source.json"

      - name: Validar procedure e contrato SQL
        shell: bash
        run: |
          set -euo pipefail
          python scripts/integration_excel_sql_sharepoint_sql_locator.py \
            --output "$EVIDENCE_DIR/sql-locator.json" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "kv-sql-capture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Gerar evidência consolidada sanitizada
        shell: bash
        run: |
          set -euo pipefail
          python - "$EVIDENCE_DIR/source.json" "$EVIDENCE_DIR/sql-locator.json" "$EVIDENCE_DIR/capture-summary.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          source=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          locator=json.loads(Path(sys.argv[2]).read_text(encoding='utf-8'))
          resolved=(source.get('status')=='resolved' and locator.get('status')=='resolved' and locator.get('procedure_exists') is True and locator.get('parameter_contract_ok') is True)
          payload={
            'schema_version':'1.0.0','feature':'excel_sql_sharepoint_key_vault_capture',
            'status':'resolved' if resolved else 'blocked','source':'azure_key_vault',
            'source_status':source.get('status'),'dsn_resolved':source.get('dsn_resolved') is True,
            'procedure':locator.get('procedure'),'procedure_exists':locator.get('procedure_exists') is True,
            'parameter_contract_ok':locator.get('parameter_contract_ok') is True,
            'locator_error':locator.get('error'),'source_sha':os.getenv('GITHUB_SHA',''),
            'run_id':os.getenv('GITHUB_RUN_ID',''),'run_attempt':os.getenv('GITHUB_RUN_ATTEMPT',''),
            'secret_value_exposed':False,'business_data_read':False,
            'production_touched':False,'test_touched':False
          }
          Path(sys.argv[3]).write_text(json.dumps(payload, indent=2)+'\n', encoding='utf-8')
          print(json.dumps({k:payload[k] for k in ('status','source_status','dsn_resolved','procedure_exists','parameter_contract_ok','locator_error')}))
          PY

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-sql-key-vault-capture-dev-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Gate funcional obrigatório antes do verde
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          summary="$EVIDENCE_DIR/capture-summary.json"
          test -f "$summary"
          python - "$summary" <<'PY'
          import json, sys
          from pathlib import Path

          payload=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          checks={
            'status_resolved': payload.get('status') == 'resolved',
            'dsn_resolved': payload.get('dsn_resolved') is True,
            'procedure_exists': payload.get('procedure_exists') is True,
            'parameter_contract_ok': payload.get('parameter_contract_ok') is True,
          }
          failed=[name for name, passed in checks.items() if not passed]
          print(json.dumps({
            'gate':'functional_readiness',
            'passed': not failed,
            'failed_checks': failed,
          }))
          if failed:
              raise SystemExit(1)
          PY
