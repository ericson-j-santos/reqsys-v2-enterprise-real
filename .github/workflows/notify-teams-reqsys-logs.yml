name: Notify Teams - ReqSys Logs

on:
  workflow_run:
    workflows:
      - CI — ReqSys v2 Enterprise
      - PR CI Watch
      - Main Post-Merge Validation
      - Fly Runtime P0
      - Runtime Health Validator
      - Repository Health Watchdog
      - Teams Notification Control Center Smoke
    types: [completed]
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente, branch ou contexto afetado
        required: true
        default: dev
        type: choice
        options: [dev, stg, prod, main, pull-request]
      severity:
        description: Severidade operacional
        required: true
        default: error
        type: choice
        options: [warning, error, critical]
      summary:
        description: Resumo objetivo do evento
        required: true
        type: string
      details:
        description: Detalhes adicionais; segredos e e-mails serão removidos
        required: false
        type: string
      run_url:
        description: URL de evidência
        required: false
        type: string
      strict:
        description: Falhar se a entrega no Teams não for confirmada
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: read
  pull-requests: read
  issues: write

# Eventos workflow_run da mesma branch representam o mesmo fluxo operacional.
# Manter o run_id apenas para dispatch manual preserva notificações independentes.
concurrency:
  group: notify-teams-reqsys-logs-${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || github.run_id }}
  cancel-in-progress: true

jobs:
  notify:
    name: Enviar Adaptive Card seguro ao Teams
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.name == 'PR CI Watch' && github.event.workflow_run.conclusion != 'success')
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      TEAMS_RECIPIENT_POLICY: reqsys-operations
      TEAMS_DELIVERY_MODE: all
      TEAMS_GATEWAY_DESTINO_ID: ${{ secrets.TEAMS_GATEWAY_DESTINO_ID }}
      TEAMS_GATEWAY_BASE_URL: ""
      TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
      TEAMS_WEBHOOK_RECIPIENT: ${{ secrets.TEAMS_WEBHOOK_RECIPIENT }}
      GITHUB_TOKEN: ${{ github.token }}
      REQSYS_LOG_OUTPUT: reqsys-log-teams-evidence.json
    steps:
      - name: Persistir checkpoint de bloqueio no PR recuperado
        id: queue_checkpoint
        if: github.event_name == 'workflow_run'
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const { owner, repo } = context.repo;
            const run = context.payload.workflow_run;
            let pr = null;
            if ((run.pull_requests || []).length === 1) {
              const response = await github.rest.pulls.get({
                owner, repo, pull_number: run.pull_requests[0].number,
              });
              pr = response.data;
            } else {
              const associated = await github.rest.repos.listPullRequestsAssociatedWithCommit({
                owner, repo, commit_sha: run.head_sha,
              });
              pr = associated.data.find((item) => item.state === 'open') || null;
            }
            if (!pr) { core.setOutput('queue_event', 'false'); return; }
            const labels = await github.paginate(github.rest.issues.listLabelsOnIssue, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const names = labels.map((label) => label.name);
            if (!names.includes('ci:recuperado')) {
              core.setOutput('queue_event', 'false');
              return;
            }
            const marker = '<!-- reqsys-recovered-queue-blocked -->';
            const body = [
              marker,
              '## Fila recuperada — checkpoint de bloqueio',
              '',
              `- PR: #${pr.number}`,
              `- HEAD: \`${pr.head.sha}\``,
              `- Workflow: \`${run.name}\``,
              `- Run: [${run.id}](${run.html_url})`,
              `- Conclusão: \`${run.conclusion}\``,
              '- Estado: blocked_after_event_driven_remediation',
              '- Próximo passo: corrigir causa determinística no mesmo PR; não fechar, recriar ou usar force-push.',
            ].join('\n');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pr.number, per_page: 100,
            });
            const existing = comments.find((item) => String(item.body || '').includes(marker));
            if (existing) await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
            else await github.rest.issues.createComment({ owner, repo, issue_number: pr.number, body });
            core.setOutput('queue_event', 'true');
            core.setOutput('pr_number', String(pr.number));
            core.setOutput('head_sha', pr.head.sha);
            core.setOutput('pr_url', pr.html_url);

      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        if: github.event_name == 'workflow_dispatch' || steps.queue_checkpoint.outputs.queue_event == 'true'

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        if: github.event_name == 'workflow_dispatch' || steps.queue_checkpoint.outputs.queue_event == 'true'
        with:
          python-version: "3.12"

      - name: Notificar bloqueio da fila recuperada com Adaptive Card
        if: github.event_name == 'workflow_run' && steps.queue_checkpoint.outputs.queue_event == 'true'
        env:
          REQSYS_LOG_FROM_WORKFLOW_RUN: "true"
          REQSYS_LOG_SOURCE: github-actions
          REQSYS_LOG_ENVIRONMENT: PR #${{ steps.queue_checkpoint.outputs.pr_number }}
          REQSYS_LOG_SEVERITY: error
          REQSYS_LOG_STATUS: ${{ github.event.workflow_run.conclusion }}
          REQSYS_LOG_SUMMARY: Fila recuperada bloqueada após remediação automática orientada por evento
          REQSYS_LOG_WORKFLOW: ${{ github.event.workflow_run.name }}
          REQSYS_LOG_RUN_ID: ${{ github.event.workflow_run.id }}
          REQSYS_LOG_RUN_URL: ${{ github.event.workflow_run.html_url }}
          REQSYS_LOG_CORRELATION_ID: reqsys-queue-${{ steps.queue_checkpoint.outputs.pr_number }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
          REQSYS_LOG_STRICT: "true"
        run: python scripts/notify_reqsys_logs_teams.py

      - name: Notificar evento manual com Adaptive Card
        if: github.event_name == 'workflow_dispatch'
        env:
          REQSYS_LOG_SOURCE: manual
          REQSYS_LOG_ENVIRONMENT: ${{ inputs.environment }}
          REQSYS_LOG_SEVERITY: ${{ inputs.severity }}
          REQSYS_LOG_STATUS: reported
          REQSYS_LOG_SUMMARY: ${{ inputs.summary }}
          REQSYS_LOG_DETAILS: ${{ inputs.details }}
          REQSYS_LOG_RUN_URL: ${{ inputs.run_url }}
          REQSYS_LOG_STRICT: ${{ inputs.strict }}
          REQSYS_LOG_CORRELATION_ID: reqsys-manual-${{ github.run_id }}-${{ github.run_attempt }}
        run: python scripts/notify_reqsys_logs_teams.py

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: reqsys-log-teams-evidence-${{ github.run_id }}
          path: reqsys-log-teams-evidence.json
          if-no-files-found: warn
          retention-days: 30
