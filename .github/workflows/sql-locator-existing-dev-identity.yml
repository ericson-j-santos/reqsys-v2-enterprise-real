name: SQL Locator via Existing DEV Identity

on:
  push:
    branches:
      - ops/temp-kv-secrets-user-dev-20260913
    paths:
      - .github/workflows/sql-locator-existing-dev-identity.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  EVIDENCE_DIR: artifacts/sql-locator-existing-dev-identity
  INTEGRATION_E2E_ENVIRONMENT: dev
  INTEGRATION_E2E_SQL_PROCEDURE: integration.usp_ConsultarPorIdentificadores

jobs:
  locator:
    name: Key Vault -> DSN -> SQL locator com identidade DEV existente
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: dev
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Preparar evidência
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/result.json" <<'JSON'
          {"status":"started","environment":"dev","identity":"CCP_AZURE_CLIENT_ID_DEV","permissions_changed":false,"production_touched":false,"test_touched":false,"secret_value_exposed":false}
          JSON

      - name: Validar configuração DEV
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID_DEV }}
          AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID REQSYS_KEY_VAULT_NAME; do test -n "${!name:-}"; done
          test "$REQSYS_KEY_VAULT_NAME" = "kv-reqsys-ccp"

      - name: Login Azure OIDC DEV existente
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.CCP_AZURE_CLIENT_ID_DEV }}
          tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Resolver DSN no Key Vault sem expor nome ou valor
        id: kv
        continue-on-error: true
        shell: bash
        env:
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          set +x
          names="$RUNNER_TEMP/secret-names.txt"
          selected="$RUNNER_TEMP/sql-secret-name.txt"
          az keyvault secret list --vault-name "$REQSYS_KEY_VAULT_NAME" --query '[].name' -o tsv > "$names"
          python - "$names" "$selected" <<'PY'
          import re, sys
          from pathlib import Path
          names=[x.strip() for x in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines() if x.strip()]
          candidates=[n for n in names if re.search(r'(sql.*(dsn|connection|conn|string)|(?:dsn|connection|conn|string).*sql)', n, re.I)]
          print(f'sql_candidate_count={len(candidates)}')
          if len(candidates) != 1:
              raise SystemExit(9)
          Path(sys.argv[2]).write_text(candidates[0], encoding='utf-8')
          PY
          secret_name="$(cat "$selected")"
          dsn="$(az keyvault secret show --vault-name "$REQSYS_KEY_VAULT_NAME" --name "$secret_name" --query value -o tsv)"
          test -n "$dsn"
          case "$dsn" in *$'\n'*|*$'\r'*) exit 10;; esac
          echo "::add-mask::$dsn"
          printf 'INTEGRATION_E2E_SQL_DSN=%s\n' "$dsn" >> "$GITHUB_ENV"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['EVIDENCE_DIR'],'result.json'); d=json.loads(p.read_text()); d['dsn_resolved']=True; d['status']='dsn_resolved'; p.write_text(json.dumps(d, indent=2)+'\n')
          PY

      - name: Instalar dependências da sonda
        if: steps.kv.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-unixodbc-ci.sh
          python -m pip install --upgrade pip
          pip install pyodbc

      - name: Executar SQL locator DEV
        id: locator
        if: steps.kv.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/integration_excel_sql_sharepoint_sql_locator.py --strict --output "$EVIDENCE_DIR/sql-locator.json" --source-sha "$GITHUB_SHA" --correlation-id "existing-dev-identity-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Consolidar resultado
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          s=Path(os.environ['EVIDENCE_DIR'],'result.json'); d=json.loads(s.read_text())
          p=Path(os.environ['EVIDENCE_DIR'],'sql-locator.json')
          if p.exists():
              x=json.loads(p.read_text()); d['locator_status']=x.get('status'); d['procedure_exists']=x.get('procedure_exists'); d['parameter_contract_ok']=x.get('parameter_contract_ok'); d['dsn_present']=x.get('dsn_present'); d['status']='resolved' if x.get('status')=='resolved' else 'blocked'; d['blocker']=x.get('error') if x.get('error') else d.get('blocker')
          elif d.get('status') != 'dsn_resolved':
              d['status']='blocked'; d['blocker']='key_vault_dsn_resolution_failed'
          else:
              d['status']='blocked'; d['blocker']='sql_locator_evidence_missing'
          s.write_text(json.dumps(d, indent=2)+'\n')
          PY

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sql-locator-existing-dev-identity-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed final
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          d=json.loads(Path(os.environ['EVIDENCE_DIR'],'result.json').read_text())
          if d.get('status') != 'resolved': raise SystemExit('sql_locator_not_resolved')
          if d.get('procedure_exists') is not True or d.get('parameter_contract_ok') is not True: raise SystemExit('sql_locator_contract_not_green')
          PY
