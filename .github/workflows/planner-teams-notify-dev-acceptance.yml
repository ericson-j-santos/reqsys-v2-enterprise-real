name: Planner Teams Notify DEV Acceptance

on:
  push:
    branches:
      - chore/planner-teams-dev-acceptance
    paths:
      - .github/workflows/planner-teams-notify-dev-acceptance.yml
      - scripts/planner_teams_dev_acceptance_v2.mjs
      - scripts/msal_device_code_prepare.mjs
      - scripts/msal_device_code_complete.mjs
      - frontend/tests/e2e/helpers/msal-token-helper.mjs
  workflow_dispatch:

permissions:
  contents: read

env:
  EVIDENCE_PATH: audit/user-journey/planner-teams-dev/acceptance.json
  DEVICE_CODE_PUBLIC_PATH: audit/user-journey/planner-teams-dev/device-login.json
  PLANNER_TEAMS_DEV_TEAM_ID: 07936381-2d94-41db-9f46-a7b28008caba
  PLANNER_TEAMS_DEV_CHANNEL_ID: 19:ZW3ncXvFEGrJY-9yHd2MuFiRstJ8TQGmz2Fr_KUXqCI1@thread.tacv2
  PLANNER_TEAMS_POLL_SECONDS: '420'
  PLANNER_TEAMS_RUN_POLL_INTERVAL_MS: '30000'
  PLANNER_TEAMS_FLOW_START_TIMEOUT_SECONDS: '120'
  PLANNER_TEAMS_FLOW_START_POLL_INTERVAL_MS: '5000'
  PLANNER_TEAMS_TRIGGER_WARMUP_SECONDS: '15'

concurrency:
  group: planner-teams-notify-dev-acceptance-v2
  cancel-in-progress: true

jobs:
  acceptance:
    name: Planner → Teams — prova real DEV
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 70
    env:
      API_URL: ${{ vars.PC24X7_DEV_BASE_URL }}
      POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
      POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
      POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
      WSJF_MSAL_STORAGE_STATE_B64: ${{ secrets.WSJF_MSAL_STORAGE_STATE_B64 }}
      WSJF_DEV_ENVIRONMENT_ID: 567445cb-49a2-ef0f-8490-cc81a281d6ed
      WSJF_DEV_GROUP_ID: ${{ vars.WSJF_DEV_GROUP_ID }}
      WSJF_DEV_PLAN_ID: ${{ vars.WSJF_DEV_PLAN_ID }}
      WSJF_DEV_BUCKET_ID: ${{ vars.WSJF_DEV_BUCKET_ID }}
      WSJF_DEV_PLANNER_CONNECTION_ID: ${{ vars.WSJF_DEV_PLANNER_CONNECTION_ID }}
      PLANNER_TEAMS_DEV_TEAMS_CONNECTION_ID: ${{ vars.PLANNER_TEAMS_DEV_TEAMS_CONNECTION_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar runtime DEV PC24x7
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${API_URL:-}" ]; then
            echo "::error::PC24X7_DEV_BASE_URL não configurada"
            exit 1
          fi
          case "$API_URL" in
            https://*) ;;
            *) echo "::error::PC24X7_DEV_BASE_URL deve usar HTTPS"; exit 1 ;;
          esac
          case "$API_URL" in
            *.fly.dev|*.fly.dev/*)
              echo "::error::Planner Teams DEV Acceptance não pode usar Fly.io"
              exit 1
              ;;
          esac
          curl --fail --silent --show-error --max-time 15 "${API_URL%/}/api/runtime/health" >/dev/null

      - name: Restaurar sessão Microsoft real sem expor credenciais
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WSJF_MSAL_STORAGE_STATE_B64:-}" ]; then
            echo "::error::WSJF_MSAL_STORAGE_STATE_B64 ausente"
            exit 1
          fi
          state="$RUNNER_TEMP/msal-storage-state.json"
          device_private="$RUNNER_TEMP/planner-teams-device-code-private.json"
          printf '%s' "$WSJF_MSAL_STORAGE_STATE_B64" | base64 --decode > "$state"
          chmod 600 "$state"
          echo "MSAL_STORAGE_STATE_PATH=$state" >> "$GITHUB_ENV"
          echo "DEVICE_CODE_PRIVATE_PATH=$device_private" >> "$GITHUB_ENV"

      - name: Preparar autorização Microsoft somente quando necessária
        run: node scripts/msal_device_code_prepare.mjs

      - name: Publicar código de autorização Microsoft desta tentativa
        uses: actions/upload-artifact@v4
        with:
          name: planner-teams-device-login-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ env.DEVICE_CODE_PUBLIC_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Exibir autorização Microsoft no resumo da execução
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs')
          const payload = JSON.parse(fs.readFileSync(process.env.DEVICE_CODE_PUBLIC_PATH, 'utf8'))
          if (payload.required !== true) {
            console.log('Sessão Microsoft reutilizável; nenhuma ação humana necessária.')
            process.exit(0)
          }
          const safeUri = String(payload.verification_uri || '')
          const safeCode = String(payload.user_code || '')
          const expires = Number(payload.expires_in_seconds || 900)
          const summary = [
            '## Autorização Microsoft necessária',
            '',
            `Abra [${safeUri}](${safeUri}) e informe **\`${safeCode}\`**.`,
            `O código vale aproximadamente ${Math.round(expires / 60)} minutos. Se expirar, o job renovará automaticamente sem reiniciar a execução.`,
            '',
          ].join('\n')
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, summary)
          console.log(`::notice title=Autorização Microsoft necessária::Abra ${safeUri} e informe ${safeCode}. Se expirar, o job renovará automaticamente.`)
          NODE

      - name: Aguardar autorização Microsoft com renovação automática
        run: node scripts/msal_device_code_complete.mjs

      - name: Executar CT-01 e CT-02 contra Planner → Power Automate → Teams DEV
        run: node scripts/planner_teams_dev_acceptance_v2.mjs

      - name: Publicar evidência operacional desta tentativa
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: planner-teams-notify-dev-acceptance-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: warn
          retention-days: 30
