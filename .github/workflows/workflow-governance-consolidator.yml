name: Workflow Governance Consolidator

on:
  schedule:
    - cron: "41 9 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/**"
      - "config/workflow-governance-registry.json"
      - "scripts/workflow_governance_consolidator.py"
      - "scripts/operational_runtime_mesh_hub.py"
      - "docs/ci/WORKFLOW_GOVERNANCE_CONSOLIDATION.md"

permissions:
  contents: read

# Execuções do mesmo PR compartilham o grupo e podem substituir uma anterior.
# Schedule e workflow_dispatch usam run_id para não cancelar execuções independentes.
concurrency:
  group: workflow-governance-consolidator-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  consolidate:
    name: Mapear e classificar workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Gerar relatório de consolidação governada
        run: |
          python scripts/workflow_governance_consolidator.py \
            --workflows-dir .github/workflows \
            --registry config/workflow-governance-registry.json \
            --out-dir artifacts/workflow-governance

      - name: Publicar resumo
        run: |
          head -n 40 artifacts/workflow-governance/workflow-governance-consolidation.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: workflow-governance-consolidation
          path: artifacts/workflow-governance
          if-no-files-found: error
          retention-days: 30
