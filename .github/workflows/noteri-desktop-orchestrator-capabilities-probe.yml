name: Noteri → Desktop Orchestrator Capabilities Probe

on:
  push:
    branches:
      - "fix/ops-gap-1818-desktop-orchestrator-capabilities-*"
    paths:
      - "scripts/noteri_desktop_orchestrator_capabilities_probe.py"
      - "tests/test_noteri_desktop_orchestrator_capabilities_probe.py"
      - ".sdd/specs/noteri-desktop-orchestrator-capabilities-probe.requirements.md"
      - ".github/workflows/noteri-desktop-orchestrator-capabilities-probe.yml"
      - ".github/self-hosted-runner-policy.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noteri-desktop-orchestrator-capabilities-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Read Desktop Orchestrator capabilities from Noteri
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    env:
      RULES_SHA: 881d9ca2f8e77025edb7298b22981109c567a730
      TARGET_REPO: ${{ github.workspace }}
      CORRELATION_ID: desktop-orchestrator-capabilities-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout immutable source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $syncRef = "origin/$env:GITHUB_REF_NAME"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "desktop-orchestrator-capabilities",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", $syncRef
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Validate targeted tests through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-tests",
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "pytest", "tests/test_noteri_desktop_orchestrator_capabilities_probe.py", "-q"
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Probe fixed Desktop Orchestrator through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
          EVIDENCE_FILE: ${{ runner.temp }}\noteri-desktop-orchestrator-capabilities\evidence.json
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $probe = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_orchestrator_capabilities_probe.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "30",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $probe,
            "--confirm", "PROBE-DESKTOP-ORCHESTRATOR-CAPABILITIES",
            "--correlation-id", $env:CORRELATION_ID,
            "--evidence-file", $env:EVIDENCE_FILE,
            "--timeout-seconds", "5"
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Upload sanitized capability evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-desktop-orchestrator-capabilities-${{ github.run_id }}
          path: ${{ runner.temp }}\noteri-desktop-orchestrator-capabilities\evidence.json
          if-no-files-found: warn
          retention-days: 30
