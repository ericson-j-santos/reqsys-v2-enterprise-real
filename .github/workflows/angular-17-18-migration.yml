name: Angular 17 to 18 Migration

on:
  push:
    branches:
      - agent/angular-17-18

permissions:
  contents: write

concurrency:
  group: angular-17-18-migration
  cancel-in-progress: false

jobs:
  migrate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend-angular/package-lock.json

      - name: Install current Angular 17 dependencies
        working-directory: frontend-angular
        run: npm ci

      - name: Migrate Angular core and CLI to 18
        working-directory: frontend-angular
        run: npx ng update @angular/core@18 @angular/cli@18

      - name: Migrate Angular Material and CDK to 18
        working-directory: frontend-angular
        run: npx ng update @angular/material@18 @angular/cdk@18

      - name: Run unit tests
        working-directory: frontend-angular
        run: npm test -- --runInBand

      - name: Build production bundle
        working-directory: frontend-angular
        run: npm run build

      - name: Capture dependency audit evidence
        working-directory: frontend-angular
        shell: bash
        run: |
          npm audit --json > npm-audit-angular18.json || true
          node - <<'NODE'
          const fs = require('fs');
          const audit = JSON.parse(fs.readFileSync('npm-audit-angular18.json', 'utf8'));
          console.log(JSON.stringify(audit.metadata?.vulnerabilities ?? {}, null, 2));
          NODE

      - name: Upload audit evidence
        uses: actions/upload-artifact@v4
        with:
          name: angular-18-npm-audit
          path: frontend-angular/npm-audit-angular18.json
          if-no-files-found: error

      - name: Remove transient audit file
        run: rm -f frontend-angular/npm-audit-angular18.json

      - name: Commit migration generated by Angular CLI
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend-angular && git diff --cached --quiet -- frontend-angular; then
            echo 'No Angular migration changes generated.'
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend-angular
          git commit -m 'chore(frontend-angular): migra Angular 17 para 18'
          git push origin HEAD:agent/angular-17-18
