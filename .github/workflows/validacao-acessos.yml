name: Validação de Acessos Públicos — ReqSys

on:
  workflow_dispatch:
    inputs:
      fail_on_unavailable:
        description: "Falhar quando algum endpoint estiver indisponível ou com status inesperado"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  pull_request:
    branches:
      - main
    types:
      - closed

  push:
    branches:
      - main

  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: validacao-acessos-${{ github.event_name }}-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  validar-acessos:
    name: Validar URLs públicas e gerar analítico
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do SHA pós-merge exato
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          fetch-depth: 2

      - name: Validar vínculo com o SHA pós-merge
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          observed_sha="$(git rev-parse HEAD)"
          test "$observed_sha" = "$EXPECTED_SHA" || {
            echo "::error::SHA validado diverge do SHA pós-merge: observed=$observed_sha expected=$EXPECTED_SHA"
            exit 2
          }

      - name: Set up Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Resolver locator DEV assinado
        id: dev_locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p reports/pc24x7-dev
          node scripts/resolve_pc24x7_dev_locator.mjs --self-test
          node scripts/resolve_pc24x7_dev_locator.mjs --output reports/pc24x7-dev/signed-locator.json
          base_url="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("reports/pc24x7-dev/signed-locator.json").read_text(encoding="utf-8"))["selected_url"])')"
          [[ "$base_url" == https://*.trycloudflare.com ]] || {
            echo "::error::Locator DEV resolveu destino não permitido"
            exit 3
          }
          echo "base_url=$base_url" >> "$GITHUB_OUTPUT"

      - name: Classificar defasagem do runtime DEV
        id: runtime_scope
        shell: bash
        env:
          BASE_URL: ${{ steps.dev_locator.outputs.base_url }}
          EVENT_NAME: ${{ github.event_name }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          evidence_dir="reports/pc24x7-dev"
          changed_file="$evidence_dir/runtime-drift-files.txt"
          scope_file="$evidence_dir/runtime-sha-scope.json"
          mkdir -p "$evidence_dir"

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path
          from urllib.request import Request, urlopen

          request = Request(
              os.environ["BASE_URL"].rstrip("/") + "/api/runtime/build-info",
              headers={"User-Agent": "ReqSysPublicAccessScope/1.0", "Accept": "application/json"},
          )
          with urlopen(request, timeout=20) as response:
              if response.status != 200:
                  raise SystemExit(f"build_info_http_{response.status}")
              payload = json.loads(response.read(524288).decode("utf-8"))
          data = payload.get("data", payload)
          observed = str(data.get("build_sha") or "").lower()
          if not re.fullmatch(r"[0-9a-f]{40}", observed):
              raise SystemExit("build_sha_invalid")
          Path("reports/pc24x7-dev/runtime-build-info.json").write_text(
              json.dumps({"observed_sha": observed}, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

          observed_sha="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("reports/pc24x7-dev/runtime-build-info.json").read_text(encoding="utf-8"))["observed_sha"])')"
          : > "$changed_file"
          scope_available=false
          if git cat-file -e "$observed_sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$observed_sha"; then
            if git diff --no-renames --name-only "$observed_sha" "$EXPECTED_SHA" -- > "$changed_file"; then
              scope_available=true
            fi
          fi

          args=(
            --changed-files-file "$changed_file"
            --event-name "$EVENT_NAME"
            --base-sha "$observed_sha"
            --head-sha "$EXPECTED_SHA"
            --output "$scope_file"
          )
          if [[ "$scope_available" == "true" ]]; then
            args+=(--scope-available)
          fi
          python .github/scripts/classify_public_access_runtime_scope.py "${args[@]}"

          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path

          build = json.loads(Path("reports/pc24x7-dev/runtime-build-info.json").read_text(encoding="utf-8"))
          scope = json.loads(Path("reports/pc24x7-dev/runtime-sha-scope.json").read_text(encoding="utf-8"))
          print(f"observed_sha={build['observed_sha']}")
          print(f"runtime_sha_required={str(scope['runtime_sha_required']).lower()}")
          print(f"decision_reason={scope['decision_reason']}")
          PY

      - name: Validar runtime DEV real com política de SHA por escopo
        shell: bash
        env:
          BASE_URL: ${{ steps.dev_locator.outputs.base_url }}
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
          CLASSIFIED_OBSERVED_SHA: ${{ steps.runtime_scope.outputs.observed_sha }}
          RUNTIME_SHA_REQUIRED: ${{ steps.runtime_scope.outputs.runtime_sha_required }}
          RUNTIME_SCOPE_REASON: ${{ steps.runtime_scope.outputs.decision_reason }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import re
          import time
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = os.environ["BASE_URL"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"].lower()
          classified_observed = os.environ["CLASSIFIED_OBSERVED_SHA"].lower()
          runtime_sha_required = os.environ["RUNTIME_SHA_REQUIRED"].lower() == "true"
          runtime_scope_reason = os.environ["RUNTIME_SCOPE_REASON"]

          def get(path, timeout=20):
              started = time.monotonic()
              request = Request(
                  base + path,
                  headers={"User-Agent": "ReqSysPublicAccessValidation/2.0", "Accept": "*/*"},
              )
              try:
                  with urlopen(request, timeout=timeout) as response:
                      body = response.read(524288).decode("utf-8", errors="replace")
                      return response.status, body, round((time.monotonic() - started) * 1000, 2)
              except HTTPError as exc:
                  body = exc.read(524288).decode("utf-8", errors="replace")
                  return exc.code, body, round((time.monotonic() - started) * 1000, 2)

          evidence = {
              "environment": "dev",
              "expected_sha": expected,
              "base_url_kind": "signed_locator",
              "runtime_sha_required": runtime_sha_required,
              "runtime_scope_reason": runtime_scope_reason,
          }

          for path in (
              "/api/health",
              "/api/runtime/health",
              "/api/runtime/readiness",
              "/api/runtime/build-info",
          ):
              status, body, latency = get(path)
              if status != 200:
                  raise SystemExit(f"{path}: HTTP {status}")
              evidence[path] = {"http": status, "latency_ms": latency}
              if path == "/api/runtime/build-info":
                  payload = json.loads(body)
                  data = payload.get("data", payload)
                  observed = str(data.get("build_sha") or "").lower()
                  if not re.fullmatch(r"[0-9a-f]{40}", observed):
                      raise SystemExit("build_sha_invalid")
                  if observed != classified_observed:
                      raise SystemExit("build_sha_changed_during_validation")
                  if runtime_sha_required and observed != expected:
                      raise SystemExit("build_sha_mismatch")
                  evidence["observed_sha"] = observed
                  evidence["build_sha_matches_expected"] = observed == expected
                  evidence["build_sha_policy"] = (
                      "exact_required" if runtime_sha_required else "health_strict_sha_informational"
                  )

          status, html, latency = get("/task-console")
          if status != 200 or "/assets/" not in html or "/src/main.js" in html:
              raise SystemExit("frontend_not_static")

          vite_status, _, _ = get("/@vite/client")
          if vite_status != 404:
              raise SystemExit("vite_hmr_exposed")

          asset = re.search(r'(?:src|href)="([^"]*/assets/[^"]+)"', html)
          if not asset:
              raise SystemExit("static_asset_not_found")
          asset_status, _, asset_latency = get(asset.group(1))
          if asset_status != 200:
              raise SystemExit("static_asset_unavailable")

          final_status, final_body, final_latency = get("/api/runtime/build-info")
          if final_status != 200:
              raise SystemExit(f"/api/runtime/build-info final: HTTP {final_status}")
          final_payload = json.loads(final_body)
          final_data = final_payload.get("data", final_payload)
          final_observed = str(final_data.get("build_sha") or "").lower()
          if not re.fullmatch(r"[0-9a-f]{40}", final_observed):
              raise SystemExit("final_build_sha_invalid")
          if final_observed != classified_observed:
              raise SystemExit("build_sha_changed_after_validation")

          evidence["frontend"] = {
              "http": status,
              "latency_ms": latency,
              "vite_client_http": vite_status,
              "asset_http": asset_status,
              "asset_latency_ms": asset_latency,
              "mode": "static_nginx",
          }
          evidence["final_observed_sha"] = final_observed
          evidence["final_build_info_latency_ms"] = final_latency
          Path("reports/pc24x7-dev/runtime-smoke.json").write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          PY

      - name: Validar acessos públicos
        env:
          ACCESS_VALIDATION_TIMEOUT_MS: "15000"
          ACCESS_VALIDATION_FAIL_ON_UNAVAILABLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fail_on_unavailable || 'true' }}
        run: |
          mkdir -p reports
          node scripts/validar-acessos-publicos.mjs | tee reports/validacao-acessos-publicos.json

      - name: Publicar relatório analítico
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: validacao-acessos-publicos
          path: reports/
          if-no-files-found: error
