name: Validação de Acessos Públicos — ReqSys

on:
  workflow_dispatch:
    inputs:
      fail_on_unavailable:
        description: "Falhar quando algum endpoint estiver indisponível ou com status inesperado"
        required: true
        default: "true"
        type: choice
        options:
          - "true"
          - "false"

  pull_request:
    branches:
      - main
    types:
      - closed

  push:
    branches:
      - main

  schedule:
    - cron: "17 10 * * *"

permissions:
  contents: read

concurrency:
  group: validacao-acessos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-acessos:
    name: Validar URLs públicas e gerar analítico
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.merged == true
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do SHA pós-merge exato
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}

      - name: Validar vínculo com o SHA pós-merge
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}
        run: |
          set -euo pipefail
          observed_sha="$(git rev-parse HEAD)"
          test "$observed_sha" = "$EXPECTED_SHA" || {
            echo "::error::SHA validado diverge do SHA pós-merge: observed=$observed_sha expected=$EXPECTED_SHA"
            exit 2
          }

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validar acessos públicos
        env:
          ACCESS_VALIDATION_TIMEOUT_MS: "15000"
          ACCESS_VALIDATION_FAIL_ON_UNAVAILABLE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.fail_on_unavailable || 'true' }}
        run: |
          mkdir -p reports
          node scripts/validar-acessos-publicos.mjs | tee reports/validacao-acessos-publicos.json

      - name: Publicar relatório analítico
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validacao-acessos-publicos
          path: reports/validacao-acessos-publicos.json
          if-no-files-found: error
