name: Deploy ReqSys Pages Composite

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "SHA completo da main autorizado para publicação"
        required: true
        type: string
      producer_run_id:
        description: "Run ID opcional do Teams Notification Dashboard; vazio usa o último sucesso"
        required: false
        type: string
      authorization:
        description: "Confirmação explícita; deve ser DEPLOY_PAGES"
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: reqsys-pages-composite
  cancel-in-progress: true

jobs:
  deploy:
    name: Publicar Pages canônico sem colisão
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Validar autorização explícita e SHA alvo
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          AUTHORIZATION: ${{ inputs.authorization }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_REF: ${{ github.ref }}
        run: |
          set -euo pipefail

          test "$EVENT_NAME" = "workflow_dispatch" || {
            echo "Deploy permitido somente por workflow_dispatch explícito." >&2
            exit 2
          }
          test "$EVENT_REF" = "refs/heads/main" || {
            echo "Deploy deve ser despachado a partir de refs/heads/main." >&2
            exit 3
          }
          test "$AUTHORIZATION" = "DEPLOY_PAGES" || {
            echo "Autorização explícita DEPLOY_PAGES ausente." >&2
            exit 4
          }
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
            echo "expected_sha inválido; informe SHA completo de 40 caracteres." >&2
            exit 5
          }

          main_head="$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
          test "$main_head" = "$EXPECTED_SHA" || {
            echo "expected_sha não corresponde ao HEAD atual da main." >&2
            echo "expected=$EXPECTED_SHA observed=$main_head" >&2
            exit 6
          }

      - name: Checkout da main autorizada
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}

      - name: Confirmar checkout exato
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"

      - name: Resolver execução produtora
        id: producer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RUN_ID: ${{ inputs.producer_run_id }}
        run: |
          set -euo pipefail

          if [[ -n "${INPUT_RUN_ID:-}" ]]; then
            run_id="$INPUT_RUN_ID"
            source="workflow_dispatch_input"
          else
            run_id="$(gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/teams-notification-dashboard.yml/runs?status=success&per_page=20" \
              --jq '.workflow_runs[0].id // empty')"
            source="latest_success"
          fi

          if [[ -z "${run_id:-}" || ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Não foi possível resolver um run_id válido do produtor." >&2
            exit 1
          fi

          producer_name="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.name')"
          producer_conclusion="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.conclusion')"
          producer_created_at="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" --jq '.created_at')"

          if [[ "$producer_name" != "Teams Notification Dashboard" ]]; then
            echo "Run ${run_id} pertence a workflow inesperado: ${producer_name}" >&2
            exit 1
          fi
          if [[ "$producer_conclusion" != "success" ]]; then
            echo "Run ${run_id} não concluiu com sucesso: ${producer_conclusion}" >&2
            exit 1
          fi

          python - "$producer_created_at" <<'PY'
          import sys
          from datetime import datetime, timezone

          created_at = datetime.fromisoformat(sys.argv[1].replace("Z", "+00:00"))
          age_hours = (datetime.now(timezone.utc) - created_at).total_seconds() / 3600
          if age_hours < 0 or age_hours > 48:
              raise SystemExit(f"Execução produtora fora da janela de 48h: {age_hours:.2f}h")
          print(f"Execução produtora válida: {age_hours:.2f}h")
          PY

          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "created_at=$producer_created_at" >> "$GITHUB_OUTPUT"

      - name: Baixar artefato do produtor Teams
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: teams-dashboard-site
          path: teams-dashboard-site
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ steps.producer.outputs.run_id }}

      - name: Setup Python para documentação
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Instalar dependências da documentação
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements-docs.txt

      - name: Preparar Node.js para o frontend DEV estável
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Compilar frontend DEV para GitHub Pages
        shell: bash
        working-directory: frontend
        env:
          VITE_BASE_PATH: /reqsys-v2-enterprise-real/dev/
          VITE_PUBLIC_URL: https://ericson-j-santos.github.io/reqsys-v2-enterprise-real/dev
          VITE_MSAL_PUBLIC_ORIGIN: https://ericson-j-santos.github.io/reqsys-v2-enterprise-real/dev
          VITE_MSAL_REDIRECT_URI: https://ericson-j-santos.github.io/reqsys-v2-enterprise-real/dev/
          VITE_MSAL_POST_LOGOUT_PATH: /login
          VITE_MSAL_LOGIN_REDIRECT_START_PATH: /login
        run: |
          set -euo pipefail
          npm ci
          npm run build
          cp dist/index.html dist/404.html

      - name: Montar site composto
        shell: bash
        run: |
          set -euo pipefail

          rm -rf site
          mkdir -p site/showcase site/codex-local-online site/dev

          test -s teams-dashboard-site/index.html
          test -s teams-dashboard-site/data.json
          test -s teams-dashboard-site/certification-status.json

          cp -a teams-dashboard-site/. site/
          cp -a docs/public-showcase/reqsys-linkedin/. site/showcase/
          cp -a tools/codex-local-online/. site/codex-local-online/
          cp -a frontend/dist/. site/dev/
          mkdocs build --strict --site-dir site/docs
          : > site/.nojekyll

      - name: Validar contrato público consolidado
        shell: bash
        run: |
          set -euo pipefail
          test -s site/index.html
          test -s site/data.json
          test -s site/certification-status.json
          test -s site/global-status.json
          test -s site/teams/index.html
          test -s site/teams/data.json
          test -s site/teams/certification-status.json
          test -s site/showcase/index.html
          test -s site/showcase/assets/styles.css
          test -s site/codex-local-online/index.html
          test -s site/dev/index.html
          test -s site/dev/404.html
          test -s site/dev/auth/callback.html
          test -s site/dev/runtime-locator.json
          test -s site/docs/index.html

          grep -Fq 'GitHub' site/index.html
          grep -Fq 'Microsoft Teams' site/index.html
          grep -Fq 'Certificação' site/index.html
          grep -Fq 'SLO' site/index.html

          python - <<'PY'
          import json
          from datetime import datetime, timezone

          payload = json.load(open('site/data.json', encoding='utf-8'))
          required = {
              'schema_version',
              'service',
              'generated_at',
              'state',
              'success_rate_percent',
              'total_runs',
              'recent_runs',
              'certification',
          }
          missing = sorted(required.difference(payload))
          if missing:
              raise SystemExit('campos ausentes em data.json: ' + ', '.join(missing))

          generated_at = datetime.fromisoformat(str(payload['generated_at']).replace('Z', '+00:00'))
          age_hours = (datetime.now(timezone.utc) - generated_at).total_seconds() / 3600
          if age_hours < 0 or age_hours > 48:
              raise SystemExit(f'data.json fora da janela pública de 48h: {age_hours:.2f}h')

          certification = json.load(open('site/certification-status.json', encoding='utf-8'))
          required_certification = {
              'state',
              'delivery_rate',
              'monitor_rate',
              'observed_days',
              'blockers',
              'evidence_sha256',
          }
          missing_certification = sorted(required_certification.difference(certification))
          if missing_certification:
              raise SystemExit(
                  'campos ausentes em certification-status.json: ' + ', '.join(missing_certification)
              )
          PY

          if grep -RniE \
            '(api[_-]?key|client[_-]?secret|password\s*[:=]|bearer\s+[a-z0-9._-]{20,}|connection\s+string|cpf|cnpj)' \
            site/showcase/index.html site/showcase/assets; then
            echo 'Sensitive-looking term found in public showcase. Review required.'
            exit 1
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b

      - name: Empacotar site composto
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: site

      - name: Publicar site composto
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

      - name: Resumo operacional
        shell: bash
        run: |
          {
            echo '### ReqSys Pages Composite'
            echo '- `/`: painel central de andamentos'
            echo '- `/global-status.json`: projeção viva GitHub/PR/CI/TODO/Teams/Runtime/projetos'
            echo '- `/teams/`: dashboard detalhado GitHub → Teams'
            echo '- `/data.json`: contrato dinâmico compatível do dashboard Teams'
            echo '- `/certification-status.json`: evidência de certificação Teams'
            echo '- `/showcase/`: showcase público ReqSys'
            echo '- `/docs/`: documentação MkDocs'
            echo '- `/codex-local-online/`: interface Codex Local Online'
            echo '- `/dev/`: frontend ReqSys estável; API resolvida pelo locator assinado do runtime DEV PC24x7'
            echo '- Proprietário único: `.github/workflows/deploy-reqsys-pages-composite.yml`.'
            echo '- Run produtor: `${{ steps.producer.outputs.run_id }}`.'
            echo '- Origem da resolução: `${{ steps.producer.outputs.source }}`.'
          } >> "$GITHUB_STEP_SUMMARY"
