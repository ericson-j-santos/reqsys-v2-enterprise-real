name: Noteri Control Plane Fallback Probe

on:
  workflow_dispatch:
  # Pre-merge evidence runs only for owner pushes in the canonical repository.
  # Fork pull_request code is never executed on this self-hosted runner.
  push:
    paths:
      - '.github/workflows/noteri-control-plane-probe.yml'
      - 'scripts/noteri_control_plane_probe.py'
      - 'scripts/noteri_control_plane_watchdog.py'
      - 'tests/test_noteri_control_plane_fallback.py'
      - '.sdd/specs/noteri-control-plane-fallback.requirements.md'
      - '.sdd/specs/noteri-control-plane-fallback.spec.json'

permissions:
  contents: read

concurrency:
  group: noteri-control-plane-fallback-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Prove Noteri fallback without RDC
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' &&
       github.repository == 'ericson-j-santos/reqsys-v2-enterprise-real' &&
       github.actor == 'ericson-j-santos')
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    env:
      CORRELATION_ID: noteri-control-plane-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts/noteri-control-plane/evidence.json
      RUNTIME_EVIDENCE_FILE: artifacts/noteri-runtime/evidence.json
      RUNTIME_CORRELATION_ID: noteri-runtime-cross-repo-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned portable Python 3.12
        shell: powershell
        env:
          PORTABLE_PYTHON_VERSION: "3.12.10"
          PORTABLE_PYTHON_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PORTABLE_PYTHON_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP ("reqsys-python-" + $env:PORTABLE_PYTHON_VERSION + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $zip = "$root.zip"
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest -Uri $env:PORTABLE_PYTHON_URL -OutFile $zip -UseBasicParsing
          $observedHash = (Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($observedHash -ne $env:PORTABLE_PYTHON_SHA256) { throw "portable_python_sha256_mismatch:$observedHash" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $python = Join-Path $root "python.exe"
          if (-not (Test-Path -LiteralPath $python)) { throw "portable_python_executable_missing" }
          $observedVersion = (& $python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne "Python $env:PORTABLE_PYTHON_VERSION") {
            throw "portable_python_version_mismatch:$observedVersion"
          }
          "REQSYS_PYTHON=$python" | Add-Content $env:GITHUB_ENV

      - name: Prove exact host and active runner
        shell: powershell
        run: |
          & $env:REQSYS_PYTHON scripts/noteri_control_plane_probe.py --confirm PROBE-NOTERI-CONTROL-PLANE --correlation-id "$env:CORRELATION_ID" --evidence-file "$env:EVIDENCE_FILE"
          exit $LASTEXITCODE

      - name: Resolve immutable noteri-runtime main SHA
        id: noteri_runtime
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: 'ericson-j-santos',
              repo: 'noteri-runtime',
              branch: 'main'
            });
            const sha = String(data.commit?.sha || '').trim().toLowerCase();
            if (!/^[0-9a-f]{40}$/.test(sha)) {
              throw new Error('noteri_runtime_main_sha_invalid');
            }
            core.setOutput('sha', sha);

      - name: Checkout immutable noteri-runtime source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ericson-j-santos/noteri-runtime
          ref: ${{ steps.noteri_runtime.outputs.sha }}
          path: noteri-runtime-source
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable noteri-runtime checkout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $observed = (git -C "$env:GITHUB_WORKSPACE\noteri-runtime-source" rev-parse HEAD).Trim().ToLowerInvariant()
          if ($observed -ne '${{ steps.noteri_runtime.outputs.sha }}') { throw "noteri_runtime_checkout_sha_mismatch:$observed" }

      - name: Execute isolated physical E2E from noteri-runtime
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          & $env:REQSYS_PYTHON "$env:GITHUB_WORKSPACE\noteri-runtime-source\scripts\noteri_runtime_isolated_e2e.py" --expected-sha "${{ steps.noteri_runtime.outputs.sha }}" --correlation-id "$env:RUNTIME_CORRELATION_ID" --evidence-path "$env:RUNTIME_EVIDENCE_FILE"
          exit $LASTEXITCODE

      - name: Validate independent noteri-runtime evidence
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $e = Get-Content -Raw -Encoding UTF8 $env:RUNTIME_EVIDENCE_FILE | ConvertFrom-Json
          if (-not $e.ok) { throw 'noteri_runtime_physical_e2e_failed' }
          if ($e.host -ne 'Noteri') { throw 'noteri_runtime_host_mismatch' }
          if ($e.expected_sha -ne '${{ steps.noteri_runtime.outputs.sha }}') { throw 'noteri_runtime_expected_sha_mismatch' }
          if ($e.observed_sha -ne '${{ steps.noteri_runtime.outputs.sha }}') { throw 'noteri_runtime_observed_sha_mismatch' }
          if (-not $e.source_sha_verified) { throw 'noteri_runtime_source_sha_not_verified' }
          if ($e.production_touched) { throw 'noteri_runtime_production_touched' }
          if ($e.secrets_read) { throw 'noteri_runtime_secrets_read' }
          if ($e.rdc_required) { throw 'noteri_runtime_rdc_dependency' }
          if ($e.independent_readback.profile -ne 'NORMAL') { throw 'noteri_runtime_final_profile_not_normal' }
          if (-not $e.independent_readback.idempotent_replay) { throw 'noteri_runtime_idempotency_missing' }
          if (-not $e.independent_readback.negative_control) { throw 'noteri_runtime_negative_control_missing' }

      - name: Upload sanitized fallback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-control-plane-${{ github.run_id }}
          path: artifacts/noteri-control-plane/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Upload sanitized noteri-runtime E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-runtime-physical-e2e-${{ github.run_id }}
          path: artifacts/noteri-runtime/evidence.json
          if-no-files-found: warn
          retention-days: 30

      - name: Summary
        if: always()
        shell: powershell
        run: |
          "## Noteri Control Plane Fallback" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Host esperado: Noteri" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- RDC necessário: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Segredos lidos: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Correlation ID: $env:CORRELATION_ID" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- noteri-runtime SHA: ${{ steps.noteri_runtime.outputs.sha }}" | Add-Content $env:GITHUB_STEP_SUMMARY
