name: Noteri Control Plane Fallback Probe

on:
  workflow_dispatch:
  push:
    branches:
      - ops/noteri-runtime-migration-e2e-20260923
    paths:
      - '.github/workflows/noteri-control-plane-probe.yml'

permissions:
  contents: read

concurrency:
  group: noteri-control-plane-fallback-probe
  cancel-in-progress: false

jobs:
  probe:
    if: github.event_name == 'workflow_dispatch'
    name: Prove Noteri fallback without RDC
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    env:
      CORRELATION_ID: noteri-control-plane-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts/noteri-control-plane/evidence.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Prove exact host and active runner
        shell: powershell
        run: python scripts/noteri_control_plane_probe.py --confirm PROBE-NOTERI-CONTROL-PLANE --correlation-id "$env:CORRELATION_ID" --evidence-file "$env:EVIDENCE_FILE"

      - name: Upload sanitized fallback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-control-plane-${{ github.run_id }}
          path: artifacts/noteri-control-plane/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: powershell
        run: |
          "## Noteri Control Plane Fallback" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Host esperado: Noteri" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- RDC necessário: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Segredos lidos: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Correlation ID: $env:CORRELATION_ID" | Add-Content $env:GITHUB_STEP_SUMMARY

  noteri-runtime-migration-e2e:
    if: github.event_name == 'push' && github.ref_name == 'ops/noteri-runtime-migration-e2e-20260923'
    name: Validate noteri-runtime exact SHA on Noteri
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    env:
      TARGET_SHA: cc06e6530ca57058db22651ac75d623f6ec921c1
      CORRELATION_ID: noteri-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts/noteri-runtime/evidence.json
    steps:
      - name: Checkout exact noteri-runtime SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/noteri-runtime
          ref: cc06e6530ca57058db22651ac75d623f6ec921c1
          path: noteri-runtime
          fetch-depth: 1
          persist-credentials: false

      - name: Verify immutable checkout
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $observed = (git -C noteri-runtime rev-parse HEAD).Trim()
          if ($observed -ne $env:TARGET_SHA) { throw "target_sha_mismatch:$observed" }

      - name: Run isolated physical E2E
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python noteri-runtime/scripts/noteri_runtime_isolated_e2e.py --expected-sha "$env:TARGET_SHA" --correlation-id "$env:CORRELATION_ID" --evidence-path "$env:EVIDENCE_FILE"

      - name: Validate independent evidence contract
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $e = Get-Content -Raw -Encoding UTF8 $env:EVIDENCE_FILE | ConvertFrom-Json
          if (-not $e.ok) { throw 'noteri_runtime_e2e_failed' }
          if ($e.host -ne 'Noteri') { throw 'host_mismatch' }
          if ($e.expected_sha -ne $env:TARGET_SHA) { throw 'evidence_sha_mismatch' }
          if ($e.production_touched) { throw 'production_touched' }
          if ($e.secrets_read) { throw 'secrets_read' }
          if ($e.rdc_required) { throw 'rdc_dependency_detected' }
          if ($e.independent_readback.profile -ne 'NORMAL') { throw 'final_profile_not_normal' }
          if (-not $e.independent_readback.idempotent_replay) { throw 'idempotency_missing' }
          if (-not $e.independent_readback.negative_control) { throw 'negative_control_missing' }

      - name: Upload sanitized runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-runtime-e2e-${{ github.run_id }}
          path: artifacts/noteri-runtime/evidence.json
          if-no-files-found: error
          retention-days: 30
