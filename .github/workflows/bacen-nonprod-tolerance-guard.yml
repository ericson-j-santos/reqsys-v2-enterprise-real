name: BACEN Non-Production Temporary Tolerance Guard

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "governance/bacen/NONPROD-TEMPORARY-TOLERANCE-POLICY.yaml"
      - "scripts/generate_bacen_nonprod_tolerance_decision.py"
      - ".github/workflows/bacen-nonprod-tolerance-guard.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "governance/bacen/NONPROD-TEMPORARY-TOLERANCE-POLICY.yaml"
      - "scripts/generate_bacen_nonprod_tolerance_decision.py"
      - ".github/workflows/bacen-nonprod-tolerance-guard.yml"
  schedule:
    - cron: "23 8 * * *"
  workflow_dispatch:
    inputs:
      scope:
        description: Escopo avaliado
        required: true
        default: pull_request
        type: choice
        options:
          - pull_request
          - dev
          - stg
          - prod

permissions:
  contents: read

concurrency:
  group: bacen-nonprod-tolerance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN temporary tolerance decision
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_nonprod_tolerance_decision.py

      - name: Resolve evaluated scope
        id: scope
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            value="${{ inputs.scope }}"
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            value="pull_request"
          else
            value="dev"
          fi
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Generate tolerance decision
        run: |
          python scripts/generate_bacen_nonprod_tolerance_decision.py \
            --matrix governance/bacen/BACEN-CONTROL-MATRIX.yaml \
            --policy governance/bacen/NONPROD-TEMPORARY-TOLERANCE-POLICY.yaml \
            --scope "${{ steps.scope.outputs.value }}" \
            --output artifacts/bacen/bacen-nonprod-tolerance-decision.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("artifacts/bacen/bacen-nonprod-tolerance-decision.json").read_text(
                  encoding="utf-8"
              )
          )
          assert evidence["mode"] == "temporary_nonprod_tolerance"
          assert evidence["decision"] == "allow"
          assert evidence["automatic_blocking"] is False
          assert evidence["preserved_control_status"] is True
          assert evidence["temporary_tolerance_applied"] == bool(
              evidence["tolerated_controls"]
          )
          assert evidence["production_deployment_allowed"] is False
          assert evidence["production_touched"] is False
          assert len(evidence["matrix_sha256"]) == 64
          assert len(evidence["policy_sha256"]) == 64
          print("BACEN temporary non-production tolerance: valid")
          PY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-nonprod-tolerance-decision
          path: artifacts/bacen/bacen-nonprod-tolerance-decision.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-nonprod-tolerance-decision.json")
          print("## BACEN — Tolerância temporária não produtiva")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          print(f"\n- Escopo: **{evidence['scope']}**")
          print(f"- Decisão: **{evidence['decision']}**")
          print(f"- Controles tolerados: **{len(evidence['tolerated_controls'])}**")
          print(f"- Produção liberada: **{evidence['production_deployment_allowed']}**")
          print(f"- Revisão até: **{evidence['review_deadline']}**")
          print("- Status regulatório preservado: **true**")
          print("- Produção acessada: **false**")
          PY
