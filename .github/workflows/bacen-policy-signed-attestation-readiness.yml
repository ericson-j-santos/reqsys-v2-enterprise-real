name: BACEN Policy Signed Attestation Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/CYBERSECURITY-POLICY.md"
      - "governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml"
      - "scripts/generate_bacen_policy_signed_attestation_readiness.py"
      - ".github/workflows/bacen-policy-signed-attestation-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/CYBERSECURITY-POLICY.md"
      - "governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml"
      - "scripts/generate_bacen_policy_signed_attestation_readiness.py"
      - ".github/workflows/bacen-policy-signed-attestation-readiness.yml"
  schedule:
    - cron: "29 8 12 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-policy-signed-attestation-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-01 Signed Attestation Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_policy_signed_attestation_readiness.py

      - name: Generate readiness evidence
        run: |
          python scripts/generate_bacen_policy_signed_attestation_readiness.py \
            --policy governance/bacen/CYBERSECURITY-POLICY.md \
            --metadata governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml \
            --output artifacts/bacen/bacen-01-signed-attestation-readiness.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("artifacts/bacen/bacen-01-signed-attestation-readiness.json").read_text(encoding="utf-8"))
          assert evidence["control_id"] == "BACEN-01"
          assert evidence["structural_checks_passed"] is True
          assert len(evidence["policy_sha256"]) == 64
          assert evidence["readiness_status"] in {
              "pending_signed_attestation",
              "signed_attestation_validated",
          }
          if evidence["attestation_present"]:
              assert evidence["attestation_valid"] is True
          else:
              assert "signed_attestation_pending" in evidence["advisory_findings"]
          assert evidence["production_touched"] is False
          print("BACEN-01 signed attestation readiness: valid")
          PY

      - name: Publish readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-01-signed-attestation-readiness
          path: artifacts/bacen/bacen-01-signed-attestation-readiness.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish executive summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-01-signed-attestation-readiness.json")
          print("## BACEN-01 — Atestação assinada")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          print(f"\n- Atestação presente: **{evidence['attestation_present']}**")
          print(f"- Atestação válida: **{evidence['attestation_valid']}**")
          print(f"- Checks estruturais: **{evidence['structural_checks_passed']}**")
          print(f"- Prontidão: **{evidence['readiness_status']}**")
          print(f"- SHA-256 da política: `{evidence['policy_sha256']}`")
          print("- Produção acessada: **false**")
          PY
