name: Pre-PR Readiness Gate

on:
  push:
    branches-ignore:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
    inputs:
      base_ref:
        description: "Branch base para validação"
        required: true
        default: "main"
        type: string

permissions:
  contents: read

env:
  CORRELATION_ID: pre-pr-${{ github.run_id }}-${{ github.run_attempt }}
  EVALUATED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  BASE_REF: ${{ github.event.pull_request.base.ref || github.event.inputs.base_ref || 'main' }}

concurrency:
  group: pre-pr-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ready-for-pr:
    name: READY_FOR_PR
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout completo
        uses: actions/checkout@v4
        with:
          ref: ${{ env.EVALUATED_SHA }}
          fetch-depth: 0

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node 20 para validação condicional de frontend
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependências do gate por perfil
        run: |
          set -euo pipefail
          git fetch origin "$BASE_REF" --prune
          # Os testes raiz podem ser selecionados mesmo quando o diff também contém backend.
          # Portanto, as dependências mínimas do próprio gate são invariantes de perfil.
          python -m pip install --disable-pip-version-check PyYAML pytest ruff 'httpx==0.28.1' 'openpyxl==3.1.5'
          backend_profile=false
          if git diff --name-only "origin/$BASE_REF...HEAD" | grep -q '^backend/'; then
            backend_profile=true
          else
            while IFS= read -r spec; do
              if [[ -f "$spec" ]] && grep -q '"backend/tests/' "$spec"; then
                backend_profile=true
                break
              fi
            done < <(git diff --name-only "origin/$BASE_REF...HEAD" | grep -E '^\.sdd/specs/.*\.spec\.json$' || true)
          fi
          if [[ "$backend_profile" != "true" ]]; then
            if python -c 'import os; from pathlib import Path; from scripts.pre_pr_readiness import candidate_pytests, changed_files; files = changed_files(os.environ["BASE_REF"]); raise SystemExit(0 if any(path.startswith("backend/tests/") for path in candidate_pytests(files, Path.cwd())) else 1)'; then
              backend_profile=true
            fi
          fi
          if [[ "$backend_profile" == "true" ]]; then
            echo "Perfil backend detectado: instalando também as dependências oficiais do backend."
            python -m pip install --disable-pip-version-check -r backend/requirements.txt
          fi

      - name: Testes do contrato do gate
        id: contract
        continue-on-error: true
        run: |
          set -euo pipefail
          python -m pytest tests/test_pre_pr_readiness.py -q
          python scripts/pre_pr_readiness.py --self-test-negative

      - name: Executar prontidão no HEAD atual
        id: readiness
        if: always()
        run: |
          set +e
          python scripts/pre_pr_readiness.py \
            --base-ref "$BASE_REF" \
            --expected-head-sha "$EVALUATED_SHA" \
            --correlation-id "$CORRELATION_ID" \
            --output artifacts/pre-pr-readiness/pre-pr-readiness.json
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Publicar evidência READY_FOR_PR
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pre-pr-readiness-${{ env.EVALUATED_SHA }}
          path: artifacts/pre-pr-readiness/pre-pr-readiness.json
          if-no-files-found: warn
          retention-days: 30

      - name: Resumo
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "## Pre-PR Readiness" >> "$GITHUB_STEP_SUMMARY"
          echo "- Correlation ID: \`$CORRELATION_ID\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- HEAD: \`$EVALUATED_SHA\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Contract tests: \`${{ steps.contract.outcome }}\`" >> "$GITHUB_STEP_SUMMARY"
          if [[ -f artifacts/pre-pr-readiness/pre-pr-readiness.json ]]; then
            python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          p = json.loads(Path('artifacts/pre-pr-readiness/pre-pr-readiness.json').read_text(encoding='utf-8'))
          print(f"- READY_FOR_PR: `{p['status']}`")
          print(f"- Base SHA: `{p['base_sha']}`")
          print(f"- Behind: `{p['behind_by']}`")
          print(f"- Arquivos alterados: `{len(p['changed_files'])}`")
          print(f"- Perfis: `{', '.join(p['profiles'])}`")
          if p['blockers']:
              print('### Bloqueios')
              for item in p['blockers']:
                  print(f"- {item}")
          if p['warnings']:
              print('### Alertas')
              for item in p['warnings']:
                  print(f"- {item}")
          PY
          fi

      - name: Bloquear publicação de PR quando não estiver pronta
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.contract.outcome }}" = "success" || {
            echo "Contrato do Pre-PR Readiness falhou."
            exit 1
          }
          test "${{ steps.readiness.outputs.exit_code }}" = "0" || {
            echo "READY_FOR_PR bloqueado."
            exit 1
          }
