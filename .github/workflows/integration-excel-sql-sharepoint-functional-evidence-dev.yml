name: Integration Excel SQL SharePoint — Functional Evidence DEV

on:
  pull_request:
    paths:
      - ".github/workflows/integration-excel-sql-sharepoint-functional-evidence-dev.yml"
      - "scripts/msal_device_code.mjs"
      - "scripts/msal_device_code_prepare.mjs"
      - "scripts/msal_device_code_complete.mjs"
      - "tests/msal_device_code_complete.test.mjs"
      - "scripts/select_integration_excel_sql_sharepoint_real_candidate.py"
      - "scripts/validate_integration_excel_sql_sharepoint_functional_evidence.py"
      - "scripts/integration_excel_sql_sharepoint_discovery.py"
      - "scripts/integration_excel_sql_sharepoint_readiness.py"
      - "scripts/integration_excel_sql_sharepoint_e2e.py"
      - "backend/app/services/integration_excel_sql_sharepoint_flow.py"
      - "backend/app/services/integration_profile_provisioning.py"
      - "tests/test_select_integration_excel_sql_sharepoint_real_candidate.py"
      - "tests/test_validate_integration_excel_sql_sharepoint_functional_evidence.py"
      - "tests/test_integration_excel_sql_sharepoint_e2e.py"
      - "tests/test_integration_excel_sql_sharepoint_readiness.py"
  workflow_dispatch:
    inputs:
      site_hint:
        description: "Trecho opcional do nome/URL do site SharePoint DEV"
        required: false
        default: ""
      file_hint:
        description: "Trecho opcional do nome do workbook DEV"
        required: false
        default: ""
      power_platform_environment_hint:
        description: "Trecho opcional do nome/ID do ambiente Power Platform DEV"
        required: false
        default: ""
      excel_connection_hint:
        description: "Trecho opcional do nome da conexão Excel DEV"
        required: false
        default: ""
      sql_connection_hint:
        description: "Trecho opcional do nome da conexão SQL DEV"
        required: false
        default: ""
      sharepoint_connection_hint:
        description: "Trecho opcional do nome da conexão SharePoint DEV"
        required: false
        default: ""
      auth_wait_minutes:
        description: "Minutos totais de espera pela autorização Microsoft (5-50; o device code é renovado automaticamente)"
        required: false
        default: "25"

permissions:
  contents: read

concurrency:
  group: integration-excel-sql-sharepoint-functional-${{ github.ref }}
  cancel-in-progress: true

env:
  INTEGRATION_E2E_ENVIRONMENT: dev
  INTEGRATION_E2E_SQL_VALIDATION_MODE: power_platform_gateway
  EVIDENCE_DIR: audit/user-journey/excel-sql-sharepoint-functional-dev

jobs:
  functional-evidence:
    name: Functional Evidence DEV — Excel → SQL Server → SharePoint
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - name: Instalar dependências mínimas
        run: |
          set -euo pipefail
          bash .github/scripts/install-msodbc18-ci.sh
          python -m pip install --upgrade pip
          pip install httpx pyodbc openpyxl pytest

      # Em pull_request só roda o que é verificável sem tenant e sem humano:
      # testes e compilação. A autorização interativa e o E2E DEV ficam no
      # workflow_dispatch, onde existe alguém para autorizar.
      - name: Validar automação e controles contra falso positivo
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          node --test tests/msal_device_code_complete.test.mjs
          python -m pytest \
            tests/test_select_integration_excel_sql_sharepoint_real_candidate.py \
            tests/test_validate_integration_excel_sql_sharepoint_functional_evidence.py \
            tests/test_integration_excel_sql_sharepoint_discovery.py \
            tests/test_integration_excel_sql_sharepoint_readiness.py \
            tests/test_integration_excel_sql_sharepoint_flow.py \
            tests/test_integration_excel_sql_sharepoint_e2e.py \
            tests/test_normalize_msal_storage_state.py \
            tests/test_integration_profile_provisioning.py \
            -q
          python -m py_compile \
            scripts/select_integration_excel_sql_sharepoint_real_candidate.py \
            scripts/validate_integration_excel_sql_sharepoint_functional_evidence.py \
            scripts/integration_excel_sql_sharepoint_discovery.py \
            scripts/integration_excel_sql_sharepoint_readiness.py \
            scripts/integration_excel_sql_sharepoint_e2e.py \
            backend/app/services/integration_excel_sql_sharepoint_flow.py

      - name: Inicializar correlação da execução
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "E2E_CORRELATION_ID=excel-sql-sharepoint-functional-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Preparar sessão Microsoft para autorização móvel
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          WSJF_MSAL_STORAGE_STATE_B64: ${{ secrets.WSJF_MSAL_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${WSJF_MSAL_STORAGE_STATE_B64:-}" ]; then
            echo "::error::WSJF_MSAL_STORAGE_STATE_B64 ausente."
            exit 1
          fi
          state="$RUNNER_TEMP/msal-storage-state.json"
          device_private="$RUNNER_TEMP/excel-sql-sharepoint-device-code-private.json"
          device_public="$EVIDENCE_DIR/device-login.json"
          mkdir -p "$EVIDENCE_DIR"
          printf '%s' "$WSJF_MSAL_STORAGE_STATE_B64" | base64 --decode > "$state"
          chmod 600 "$state"
          python scripts/normalize_msal_storage_state.py --path "$state"
          echo "MSAL_STORAGE_STATE_PATH=$state" >> "$GITHUB_ENV"
          echo "DEVICE_CODE_PRIVATE_PATH=$device_private" >> "$GITHUB_ENV"
          echo "DEVICE_CODE_PUBLIC_PATH=$device_public" >> "$GITHUB_ENV"

      - name: Preparar autorização Microsoft somente se necessária
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
        run: node scripts/msal_device_code_prepare.mjs

      - name: Registrar instrução de autenticação quando necessária
        if: ${{ github.event_name == 'workflow_dispatch' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          payload = json.loads(Path(os.environ["DEVICE_CODE_PUBLIC_PATH"]).read_text(encoding="utf-8"))
          summary = Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary.open("a", encoding="utf-8") as handle:
              if payload.get("required"):
                  uri = payload.get("verification_uri") or "https://microsoft.com/devicelogin"
                  code = payload.get("user_code") or ""
                  handle.write("## Autorização Microsoft necessária\n\n")
                  handle.write(f"Abra [{uri}]({uri}) e informe **`{code}`**. O job continuará automaticamente.\n\n")
                  handle.write(
                      "Se este código expirar antes da autorização, o job gera um novo automaticamente "
                      "e publica o código renovado neste mesmo resumo, até esgotar a janela configurada "
                      "em `auth_wait_minutes`.\n"
                  )
              else:
                  handle.write("## Autorização Microsoft\n\nSessão existente válida; nenhuma ação humana necessária.\n")
          PY

      - name: Publicar instrução temporária de autenticação
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-functional-device-login-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ env.DEVICE_CODE_PUBLIC_PATH }}
          if-no-files-found: error
          retention-days: 1

      - name: Concluir sessão Microsoft efêmera
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          DEVICE_CODE_TOTAL_WAIT_MINUTES: ${{ inputs.auth_wait_minutes }}
        run: node scripts/msal_device_code_complete.mjs

      - name: Descobrir referências DEV sem segredos
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
          INTEGRATION_E2E_SITE_HINT: ${{ inputs.site_hint }}
          INTEGRATION_E2E_FILE_HINT: ${{ inputs.file_hint }}
          INTEGRATION_E2E_POWER_PLATFORM_ENVIRONMENT_HINT: ${{ inputs.power_platform_environment_hint }}
          INTEGRATION_E2E_EXCEL_CONNECTION_HINT: ${{ inputs.excel_connection_hint }}
          INTEGRATION_E2E_SQL_CONNECTION_HINT: ${{ inputs.sql_connection_hint }}
          INTEGRATION_E2E_SHAREPOINT_CONNECTION_HINT: ${{ inputs.sharepoint_connection_hint }}
        run: |
          set -euo pipefail
          python scripts/integration_excel_sql_sharepoint_discovery.py \
            --output "$EVIDENCE_DIR/discovery.json" \
            --github-env "$GITHUB_ENV" \
            --msal-state "$MSAL_STORAGE_STATE_PATH" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "$E2E_CORRELATION_ID"

      - name: Selecionar candidato real já existente no Excel
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python scripts/select_integration_excel_sql_sharepoint_real_candidate.py \
            --output "$EVIDENCE_DIR/real-candidate.json" \
            --github-env "$GITHUB_ENV" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "$E2E_CORRELATION_ID"

      - name: Readiness estrito no mesmo SHA
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python scripts/integration_excel_sql_sharepoint_readiness.py \
            --strict \
            --output "$EVIDENCE_DIR/readiness.json" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "$E2E_CORRELATION_ID"

      - name: Executar E2E real
        if: ${{ github.event_name == 'workflow_dispatch' }}
        env:
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
        run: |
          set -euo pipefail
          python scripts/integration_excel_sql_sharepoint_e2e.py \
            --output "$EVIDENCE_DIR/e2e.json" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "$E2E_CORRELATION_ID" \
            --msal-state "$MSAL_STORAGE_STATE_PATH" \
            --wait-seconds 420

      - name: Gate final de evidência funcional
        if: ${{ github.event_name == 'workflow_dispatch' }}
        run: |
          set -euo pipefail
          python scripts/validate_integration_excel_sql_sharepoint_functional_evidence.py \
            --candidate-evidence "$EVIDENCE_DIR/real-candidate.json" \
            --e2e-evidence "$EVIDENCE_DIR/e2e.json" \
            --output "$EVIDENCE_DIR/functional-evidence.json" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "$E2E_CORRELATION_ID" \
            --strict

      - name: Publicar evidências sanitizadas
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-functional-evidence-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_DIR }}/device-login.json
            ${{ env.EVIDENCE_DIR }}/discovery.json
            ${{ env.EVIDENCE_DIR }}/real-candidate.json
            ${{ env.EVIDENCE_DIR }}/readiness.json
            ${{ env.EVIDENCE_DIR }}/e2e.json
            ${{ env.EVIDENCE_DIR }}/functional-evidence.json
          if-no-files-found: warn
          retention-days: 30
