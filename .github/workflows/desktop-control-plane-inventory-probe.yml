name: Desktop Control Plane Inventory Probe

on:
  push:
    branches:
      - "diag/desktop-control-plane-inventory-*"
    paths:
      - "scripts/noteri_desktop_orchestrator_inventory.py"
      - ".github/workflows/desktop-control-plane-inventory-probe.yml"

permissions:
  contents: read

concurrency:
  group: desktop-control-plane-inventory-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Inventory Desktop control plane through Noteri
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 4
    env:
      RULES_SHA: 881d9ca2f8e77025edb7298b22981109c567a730
      CORRELATION_ID: desktop-inventory-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts/desktop-control-plane-inventory/evidence.json

    steps:
      - name: Assert exact Noteri host
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne "Noteri") { throw "NOTERI_HOST_MISMATCH" }

      - name: Checkout immutable source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed Noteri session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--repo", $env:GITHUB_WORKSPACE,
            "--session-prefix", "desktop-inventory",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/$env:GITHUB_REF_NAME"
          )
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = (@($raw)[-1] | ConvertFrom-Json)
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) { throw "SESSION_LAUNCH_BLOCKED" }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT

      - name: Run fixed read-only inventory through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_orchestrator_inventory.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "90",
            "--expected-head", "${{ github.sha }}",
            "--",
            "python", $script,
            "--confirm", "INVENTORY-DESKTOP-CONTROL-PLANE",
            "--correlation-id", $env:CORRELATION_ID,
            "--evidence-file", $env:EVIDENCE_REL
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Validate sanitized evidence
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $path = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          $e = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          if (-not $e.ok) { throw "INVENTORY_NOT_OK" }
          if ($e.result -ne "DESKTOP_CONTROL_PLANE_INVENTORY_COMPLETED") { throw "INVENTORY_RESULT_MISMATCH" }
          if ($e.target_host -ne "DESKTOP-PDQK954") { throw "TARGET_HOST_MISMATCH" }
          if ($e.file_contents_read) { throw "FILE_CONTENTS_READ" }
          if ($e.secrets_read) { throw "SECRETS_READ" }
          if ($e.production_touched) { throw "PRODUCTION_TOUCHED" }

      - name: Upload sanitized inventory evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-control-plane-inventory-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}/artifacts/desktop-control-plane-inventory/evidence.json
          if-no-files-found: error
          retention-days: 7
