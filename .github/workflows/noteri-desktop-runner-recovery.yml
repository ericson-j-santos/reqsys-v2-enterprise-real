name: Noteri to Desktop Runner Recovery

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/noteri-desktop-runner-recovery-after-migration-*"
    paths:
      - "scripts/noteri_desktop_runner_recovery.py"
      - "tests/test_noteri_desktop_runner_recovery.py"
      - ".github/workflows/noteri-desktop-runner-recovery.yml"

permissions:
  contents: read

concurrency:
  group: noteri-desktop-runner-recovery-${{ github.ref }}
  cancel-in-progress: true

jobs:
  recover:
    name: Recover Desktop runner from Noteri
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    env:
      RULES_SHA: 881d9ca2f8e77025edb7298b22981109c567a730
      TARGET_REPO: ${{ github.workspace }}
      CORRELATION_ID: noteri-desktop-runner-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\noteri-desktop-runner-recovery\evidence.json

    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $syncRef = "origin/$env:GITHUB_REF_NAME"
          $args = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "noteri-desktop-runner",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", $syncRef
          )
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Validate bridge tests through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-tests",
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", "-m", "unittest", "-v", "tests.test_noteri_desktop_runner_recovery"
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Recover Desktop runner through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_runner_recovery.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "90",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $script,
            "--correlation-id", $env:CORRELATION_ID,
            "--evidence-file", $env:EVIDENCE_REL,
            "--timeout-seconds", "45"
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Validate sanitized evidence
        if: always() && steps.session.outputs.target_path != ''
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $path = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path $path)) { throw "evidence_missing" }
          $e = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          if (-not $e.ok) { throw ("desktop_runner_recovery_failed: " + $e.error) }
          if ($e.controller_version -ne "0.2.53") { throw "controller_version_mismatch" }
          if ([int]$e.recovery_contract_version -ne 1) { throw "recovery_contract_mismatch" }
          if ($e.production_touched) { throw "production_touched" }
          if ($e.secrets_read) { throw "secrets_read" }

      - name: Upload sanitized evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-desktop-runner-recovery-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\noteri-desktop-runner-recovery\evidence.json
          if-no-files-found: warn
          retention-days: 30
