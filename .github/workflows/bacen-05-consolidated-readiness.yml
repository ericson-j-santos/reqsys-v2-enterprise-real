name: BACEN-05 Consolidated Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/**"
      - "scripts/generate_bacen_vendor_risk_assessment.py"
      - "scripts/generate_bacen_vendor_dpa_readiness.py"
      - "scripts/validate_bacen_dpa_evidence_contract.py"
      - "scripts/consolidate_bacen_05_evidence.py"
      - "tests/test_consolidate_bacen_05_evidence.py"
      - ".github/workflows/bacen-05-consolidated-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/**"
      - "scripts/generate_bacen_vendor_risk_assessment.py"
      - "scripts/generate_bacen_vendor_dpa_readiness.py"
      - "scripts/validate_bacen_dpa_evidence_contract.py"
      - "scripts/consolidate_bacen_05_evidence.py"
      - "tests/test_consolidate_bacen_05_evidence.py"
      - ".github/workflows/bacen-05-consolidated-readiness.yml"
  schedule:
    - cron: "29 9 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-05-consolidated-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  consolidate:
    name: BACEN-05 Consolidated Evidence
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML pytest
      - name: Compile and test
        run: |
          python -m py_compile scripts/consolidate_bacen_05_evidence.py
          python -m py_compile tests/test_consolidate_bacen_05_evidence.py
          python -m pytest tests/test_consolidate_bacen_05_evidence.py -q
      - name: Generate source evidence
        run: |
          mkdir -p artifacts/bacen
          python scripts/generate_bacen_vendor_risk_assessment.py \
            --register governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml \
            --output artifacts/bacen/bacen-05-vendor-risk-assessment.json
          python scripts/generate_bacen_vendor_dpa_readiness.py \
            --register governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml \
            --manifest governance/bacen/VENDOR-DPA-READINESS.yaml \
            --output artifacts/bacen/bacen-05-vendor-dpa-readiness.json
          python scripts/validate_bacen_dpa_evidence_contract.py \
            --contract governance/bacen/VENDOR-DPA-EVIDENCE-CONTRACT.yaml \
            --output artifacts/bacen/bacen-05-dpa-evidence-contract.json
      - name: Consolidate BACEN-05 evidence
        run: |
          python scripts/consolidate_bacen_05_evidence.py \
            --risk artifacts/bacen/bacen-05-vendor-risk-assessment.json \
            --readiness artifacts/bacen/bacen-05-vendor-dpa-readiness.json \
            --contract artifacts/bacen/bacen-05-dpa-evidence-contract.json \
            --output artifacts/bacen/bacen-05-consolidated-readiness.json
      - name: Validate consolidated artifact
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/bacen/bacen-05-consolidated-readiness.json").read_text())
          assert report["control_id"] == "BACEN-05"
          assert report["control_status"] in {"partial", "implemented"}
          assert report["technical_consolidation_passed"] is True
          assert report["production_touched"] is False
          assert all(len(source["sha256"]) == 64 for source in report["sources"].values())
          PY
      - name: Publish consolidated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-05-consolidated-readiness
          path: artifacts/bacen/
          if-no-files-found: error
          retention-days: 365
      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("artifacts/bacen/bacen-05-consolidated-readiness.json")
          print("## BACEN-05 — Evidência consolidada")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          report = json.loads(path.read_text())
          summary = report["summary"]
          print(f"\n- Fornecedores registrados: **{summary['registered_vendors']}**")
          print(f"- DPAs validados: **{summary['validated_dpas']}**")
          print(f"- Cobertura DPA: **{summary['validated_dpa_coverage_percent']}%**")
          print(f"- Pendências jurídicas: **{summary['pending_legal_signoff_vendors']}**")
          print(f"- Status: **{report['control_status']}**")
          print("- Modo: **advisory**")
          print("- Produção acessada: **false**")
          PY
