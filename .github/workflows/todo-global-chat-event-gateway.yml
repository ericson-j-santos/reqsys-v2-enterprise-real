name: TODO Global Chat Event Gateway

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  id-token: write

concurrency:
  group: todo-global-chat-event-gateway-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish governed ChatGPT TodoEvent
    if: >-
      github.event.issue.number == 1705 &&
      github.event.comment.user.login == 'ericson-j-santos' &&
      startsWith(github.event.comment.body, '/reqsys todo-event-v1 ')
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    env:
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}

    steps:
      - name: Checkout immutable event SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Node 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "20"

      - name: Validar contrato local antes de autenticar
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.0.3
          python -m py_compile scripts/todo_global_chat_event_gateway.py scripts/todo_global_hourly_cycle.py
          python -m pytest -q tests/test_todo_global_chat_event_gateway.py tests/test_todo_global_hourly_cycle.py

      - name: Validar configuração OIDC governada
        shell: bash
        run: |
          set -euo pipefail
          for name in REQSYS_KEY_VAULT_NAME CCP_AZURE_CLIENT_ID CCP_AZURE_TENANT_ID CCP_AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || {
              echo "::error::${name} missing"
              exit 2
            }
          done

      - name: Login Azure OIDC governado
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Resolver locator DEV assinado
        id: locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/todo-global-chat-event
          node scripts/resolve_pc24x7_dev_locator.mjs --self-test
          node scripts/resolve_pc24x7_dev_locator.mjs --output artifacts/todo-global-chat-event/locator.json

      - name: Ler token de produtor sem expor valor
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show --vault-name "$REQSYS_KEY_VAULT_NAME" --name reqsys-pc24x7-todo-runtime-producer-token --query value --output tsv --only-show-errors)"
          test -n "$token"
          echo "::add-mask::$token"
          printf 'TODO_GLOBAL_RUNTIME_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Validar runtime público no mesmo SHA
        shell: bash
        env:
          BASE_URL: ${{ steps.locator.outputs.base_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          base = os.environ["BASE_URL"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"].lower()

          def observed(path):
              request = Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "TODOGlobalChatGateway/1.0"},
              )
              with urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read(262144).decode("utf-8"))
              data = payload.get("data", payload)
              return str(data.get("build_sha") or "").lower()

          reqsys_sha = observed("/api/runtime/build-info")
          todo_sha = observed("/runtime-core/api/runtime/build-info")
          if reqsys_sha != expected:
              raise SystemExit("reqsys_public_api_sha_mismatch")
          if todo_sha != expected:
              raise SystemExit("todo_runtime_public_sha_mismatch")
          PY

      - name: Publicar TodoEvent e comprovar readback + replay
        shell: bash
        env:
          RUNTIME_BASE: ${{ steps.locator.outputs.base_url }}/runtime-core
        run: |
          set -euo pipefail
          python scripts/todo_global_chat_event_gateway.py \
            --github-event-path "$GITHUB_EVENT_PATH" \
            --runtime-url "$RUNTIME_BASE" \
            --timeout-seconds 180 \
            --poll-seconds 5 \
            --output artifacts/todo-global-chat-event/evidence.json

      - name: Publicar resumo sanitizado
        if: always()
        shell: bash
        run: |
          {
            printf '%s\n' "## TODO Global Chat Event Gateway"
            printf '%s\n' "- SHA: \`$GITHUB_SHA\`"
            printf '%s\n' "- Issue autorizadora: \`#1705\`"
            if [[ -f artifacts/todo-global-chat-event/evidence.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/todo-global-chat-event/evidence.json").read_text(encoding="utf-8"))
          print(f"- Event ID: \`{data['event_id']}\`")
          print(f"- Correlation ID: \`{data['correlation_id']}\`")
          print(f"- Estado terminal: \`{data['terminal_status']}\`")
          print(f"- Readback independente: \`{data['readback_verified']}\`")
          print(f"- Replay idempotente: \`{data['replay_duplicate_event']}\`")
          PY
            else
              printf '%s\n' '- Estado: `BLOQUEADO/PARCIAL`'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preservar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: todo-global-chat-event-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/todo-global-chat-event/evidence.json
          if-no-files-found: warn
          retention-days: 30
