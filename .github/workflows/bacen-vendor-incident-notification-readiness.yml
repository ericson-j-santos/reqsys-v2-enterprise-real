name: BACEN Vendor Incident Notification Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml"
      - "governance/bacen/VENDOR-DPA-EVIDENCE-CONTRACT.yaml"
      - "scripts/generate_bacen_vendor_incident_notification_readiness.py"
      - ".github/workflows/bacen-vendor-incident-notification-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml"
      - "governance/bacen/VENDOR-DPA-EVIDENCE-CONTRACT.yaml"
      - "scripts/generate_bacen_vendor_incident_notification_readiness.py"
      - ".github/workflows/bacen-vendor-incident-notification-readiness.yml"
  schedule:
    - cron: "23 9 2 * *"
  workflow_dispatch:
    inputs:
      max_notification_sla_hours:
        description: "SLA máximo auditado para notificação de incidente"
        required: false
        default: "72"

permissions:
  contents: read

concurrency:
  group: bacen-vendor-incident-notification-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-05 Incident Notification Terms
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MAX_NOTIFICATION_SLA_HOURS: ${{ github.event.inputs.max_notification_sla_hours || '72' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_vendor_incident_notification_readiness.py

      - name: Generate readiness evidence
        run: |
          python scripts/generate_bacen_vendor_incident_notification_readiness.py \
            --register governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml \
            --contract governance/bacen/VENDOR-DPA-EVIDENCE-CONTRACT.yaml \
            --max-notification-sla-hours "$MAX_NOTIFICATION_SLA_HOURS" \
            --output artifacts/bacen/bacen-05-vendor-incident-notification-readiness.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-05-vendor-incident-notification-readiness.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          summary = evidence["summary"]
          assert evidence["control_id"] == "BACEN-05"
          assert summary["target_vendors"] > 0
          assert summary["complete_terms"] + summary["pending_terms"] == summary["target_vendors"]
          assert evidence["max_notification_sla_hours"] > 0
          assert evidence["automatic_blocking"] is False
          assert evidence["control_status"] in {"partial", "implemented"}
          assert evidence["production_touched"] is False
          assert len(evidence["register_sha256"]) == 64
          assert len(evidence["contract_sha256"]) == 64
          print("BACEN-05 incident notification terms evidence: valid")
          PY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-05-vendor-incident-notification-readiness
          path: artifacts/bacen/bacen-05-vendor-incident-notification-readiness.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-05-vendor-incident-notification-readiness.json")
          print("## BACEN-05 — Notificação de incidentes por terceiros")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          summary = evidence["summary"]
          print(f"\n- Fornecedores críticos/altos: **{summary['target_vendors']}**")
          print(f"- Cláusulas completas: **{summary['complete_terms']}**")
          print(f"- Pendentes: **{summary['pending_terms']}**")
          print(f"- SLA máximo auditado: **{evidence['max_notification_sla_hours']}h**")
          print(f"- Bloqueio estrutural: **{evidence['automatic_blocking']}**")
          print("- Produção acessada: **false**")
          PY
