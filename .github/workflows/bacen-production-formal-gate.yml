name: BACEN Production Formal Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/validate_bacen_production_gate.py"
      - "tests/test_bacen_production_gate.py"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "governance/bacen/BACEN-GOVERNANCE-RECONCILIATION.yaml"
      - ".github/workflows/bacen-production-formal-gate.yml"
      - "governance/merge/current-sha-required-workflows.json"
  push:
    branches: [main]
    paths:
      - "scripts/validate_bacen_production_gate.py"
      - "tests/test_bacen_production_gate.py"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "governance/bacen/BACEN-GOVERNANCE-RECONCILIATION.yaml"
      - ".github/workflows/bacen-production-formal-gate.yml"
      - "governance/merge/current-sha-required-workflows.json"
  workflow_dispatch:
    inputs:
      target_stage:
        description: "Estágio alvo a validar"
        required: false
        default: "PRODUCTION"
        type: choice
        options:
          - DEVELOPMENT
          - STAGING
          - PRODUCTION

permissions:
  contents: read

concurrency:
  group: bacen-production-formal-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-production-formal-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Testar contrato do gate formal BACEN
        run: |
          python -m pip install --disable-pip-version-check pytest PyYAML
          python -m pytest -q tests/test_bacen_production_gate.py
      - name: Validar estágio não produtivo atual
        run: |
          mkdir -p artifacts/bacen-production-formal-gate
          python scripts/validate_bacen_production_gate.py \
            --matrix governance/bacen/BACEN-CONTROL-MATRIX.yaml \
            --reconciliation governance/bacen/BACEN-GOVERNANCE-RECONCILIATION.yaml \
            --target-stage DEVELOPMENT \
            --output artifacts/bacen-production-formal-gate/development.json
      - name: Confirmar bloqueio obrigatório para produção
        run: |
          python scripts/validate_bacen_production_gate.py \
            --matrix governance/bacen/BACEN-CONTROL-MATRIX.yaml \
            --reconciliation governance/bacen/BACEN-GOVERNANCE-RECONCILIATION.yaml \
            --target-stage PRODUCTION \
            --expect-block \
            --output artifacts/bacen-production-formal-gate/production.json
      - name: Publicar resumo
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/bacen-production-formal-gate/production.json").read_text())
          print("## BACEN Production Formal Gate")
          print(f"- Decisão produção: **{report['decision']}**")
          print(f"- Controles obrigatórios: **{', '.join(report['required_controls'])}**")
          print(f"- Bloqueios: **{len(report['blockers'])}**")
          print("- Produção tocada: **false**")
          print("- Sobrescrita automática permitida: **false**")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bacen-production-formal-gate
          path: artifacts/bacen-production-formal-gate/
          if-no-files-found: error
          retention-days: 90
