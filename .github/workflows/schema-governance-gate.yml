name: Schema Governance Gate

on:
  pull_request:
    paths:
      - "schemas/**"
      - "examples/**"
      - "docs/schema-registry.json"
      - "docs/schema-governance-gates.md"
      - "tools/schema_governance/**"
      - "tests/schema_governance/**"
      - ".github/workflows/schema-governance-gate.yml"
  push:
    branches:
      - main
    paths:
      - "schemas/**"
      - "examples/**"
      - "docs/schema-registry.json"
      - "docs/schema-governance-gates.md"
      - "tools/schema_governance/**"
      - "tests/schema_governance/**"
      - ".github/workflows/schema-governance-gate.yml"

jobs:
  schema-governance:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Run schema governance self-validation
        run: |
          python tests/schema_governance/test_schema_governance_gate.py

      - name: Validate governed JSON schemas on pull request
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          python tools/schema_governance/validate_schema_governance.py --base-ref "origin/${{ github.base_ref }}"

      - name: Validate governed JSON schemas on push
        if: github.event_name != 'pull_request'
        run: |
          python tools/schema_governance/validate_schema_governance.py

      - name: Publish schema governance summary
        if: always()
        run: |
          if [ -f schema-governance-report.md ]; then
            cat schema-governance-report.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload schema governance artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: schema-governance-executive-report
          path: |
            schema-governance-report.md
            schema-governance-report.json
            schema-governance-report.html
          if-no-files-found: error
