name: Integration SQL Locator — DEV

on:
  push:
    branches:
      - main
      - ops/auto-capture-sql-locator-dev-20260913
    paths:
      - "scripts/integration_excel_sql_sharepoint_sql_locator.py"
      - "tests/test_integration_excel_sql_sharepoint_sql_locator.py"
      - ".github/workflows/integration-excel-sql-sharepoint-sql-locator-dev.yml"
  workflow_dispatch:
    inputs:
      strict:
        description: "Falhar se nenhuma fonte segura resolver o locator SQL DEV"
        required: true
        type: boolean
        default: true
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  id-token: write

concurrency:
  group: integration-excel-sql-sharepoint-sql-locator-dev
  cancel-in-progress: false

env:
  INTEGRATION_E2E_ENVIRONMENT: dev
  INTEGRATION_E2E_SQL_PROCEDURE: integration.usp_ConsultarPorIdentificadores
  EVIDENCE_DIR: audit/user-journey/excel-sql-sharepoint-dev
  EXPECTED_KEY_VAULT_NAME: kv-reqsys-ccp

jobs:
  environment-secret:
    name: Capturar DSN do environment e validar SQL
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 10
    outputs:
      dsn_present: ${{ steps.source.outputs.dsn_present }}
      locator_status: ${{ steps.result.outputs.status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências mínimas
        run: |
          set -euo pipefail
          bash .github/scripts/install-unixodbc-ci.sh
          python -m pip install --upgrade pip
          pip install pyodbc pytest

      - name: Validar contrato da sonda
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest tests/test_integration_excel_sql_sharepoint_sql_locator.py -q

      - name: Capturar DSN do GitHub Environment sem expor valor
        id: source
        env:
          SECRET_DSN: ${{ secrets.INTEGRATION_E2E_SQL_DSN }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if [ -n "${SECRET_DSN:-}" ]; then
            echo "::add-mask::$SECRET_DSN"
            printf 'INTEGRATION_E2E_SQL_DSN=%s\n' "$SECRET_DSN" >> "$GITHUB_ENV"
            echo "dsn_present=true" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"source":"github_environment_secret","available":true,"secret_value_exposed":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/capture-source-environment.json"
          else
            echo "dsn_present=false" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"source":"github_environment_secret","available":false,"secret_value_exposed":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/capture-source-environment.json"
          fi

      - name: Consultar somente metadados SQL DEV
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python scripts/integration_excel_sql_sharepoint_sql_locator.py \
            --output "$EVIDENCE_DIR/sql-locator-environment.json" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "sql-locator-env-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Consolidar resultado do environment
        id: result
        shell: bash
        run: |
          set -euo pipefail
          status="$(python - "$EVIDENCE_DIR/sql-locator-environment.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(payload.get('status') or 'blocked')
          PY
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "environment_secret_locator_status=$status"

      - name: Publicar evidência sanitizada do environment
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-sql-locator-env-dev-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_DIR }}/capture-source-environment.json
            ${{ env.EVIDENCE_DIR }}/sql-locator-environment.json
          if-no-files-found: error
          retention-days: 30

  key-vault:
    name: Capturar DSN do Key Vault e validar SQL
    needs: environment-secret
    if: needs.environment-secret.outputs.locator_status != 'resolved'
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    outputs:
      locator_status: ${{ steps.result.outputs.status }}
      key_vault_status: ${{ steps.kv.outputs.kv_status }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências mínimas
        run: |
          set -euo pipefail
          bash .github/scripts/install-unixodbc-ci.sh
          python -m pip install --upgrade pip
          pip install pyodbc pytest

      - name: Validar contrato da sonda
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m pytest tests/test_integration_excel_sql_sharepoint_sql_locator.py -q

      - name: Validar configuração OIDC/Key Vault governada
        id: config
        env:
          AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID_FLY_GOVERNED_COMMAND }}
          AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID REQSYS_KEY_VAULT_NAME; do
            test -n "${!name:-}"
          done
          test "$REQSYS_KEY_VAULT_NAME" = "$EXPECTED_KEY_VAULT_NAME"

      - name: Login Azure OIDC governado
        id: azure-login
        continue-on-error: true
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.CCP_AZURE_CLIENT_ID_FLY_GOVERNED_COMMAND }}
          tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Resolver DSN no Key Vault sem expor nome ou valor
        id: kv
        if: steps.azure-login.outcome == 'success'
        env:
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p "$EVIDENCE_DIR"
          names="$RUNNER_TEMP/kv-secret-names.txt"
          selected="$RUNNER_TEMP/sql-secret-name.txt"
          if ! az keyvault secret list --vault-name "$REQSYS_KEY_VAULT_NAME" --query '[].name' -o tsv > "$names" 2>/dev/null; then
            echo "kv_status=read_unavailable" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"source":"azure_key_vault","status":"read_unavailable","dsn_resolved":false,"secret_value_exposed":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/capture-source-key-vault.json"
            exit 0
          fi
          candidate_count="$(python - "$names" "$selected" <<'PY'
          import re, sys
          from pathlib import Path
          names=[x.strip() for x in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines() if x.strip()]
          candidates=[n for n in names if re.search(r'(sql.*(dsn|connection|conn|string)|(?:dsn|connection|conn|string).*sql)', n, re.I)]
          if len(candidates) == 1:
              Path(sys.argv[2]).write_text(candidates[0], encoding='utf-8')
          print(len(candidates))
          PY
          )"
          echo "sql_candidate_count=$candidate_count"
          if [ "$candidate_count" != "1" ]; then
            echo "kv_status=candidate_count_${candidate_count}" >> "$GITHUB_OUTPUT"
            CANDIDATE_COUNT="$candidate_count" python - "$EVIDENCE_DIR/capture-source-key-vault.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          Path(sys.argv[1]).write_text(json.dumps({
              'source':'azure_key_vault','status':'candidate_count_mismatch',
              'candidate_count':int(os.environ['CANDIDATE_COUNT']),
              'dsn_resolved':False,'secret_value_exposed':False,
              'production_touched':False,'test_touched':False,
          }, indent=2)+'\n', encoding='utf-8')
          PY
            exit 0
          fi
          secret_name="$(cat "$selected")"
          if ! dsn="$(az keyvault secret show --vault-name "$REQSYS_KEY_VAULT_NAME" --name "$secret_name" --query value -o tsv 2>/dev/null)"; then
            echo "kv_status=secret_read_unavailable" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"source":"azure_key_vault","status":"secret_read_unavailable","dsn_resolved":false,"secret_value_exposed":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/capture-source-key-vault.json"
            exit 0
          fi
          if [ -z "$dsn" ]; then
            echo "kv_status=secret_empty" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"source":"azure_key_vault","status":"secret_empty","dsn_resolved":false,"secret_value_exposed":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/capture-source-key-vault.json"
            exit 0
          fi
          case "$dsn" in *$'\n'*|*$'\r'*)
            echo "kv_status=secret_multiline_rejected" >> "$GITHUB_OUTPUT"
            printf '%s\n' '{"source":"azure_key_vault","status":"secret_multiline_rejected","dsn_resolved":false,"secret_value_exposed":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/capture-source-key-vault.json"
            exit 0
          esac
          echo "::add-mask::$dsn"
          printf 'INTEGRATION_E2E_SQL_DSN=%s\n' "$dsn" >> "$GITHUB_ENV"
          echo "kv_status=resolved" >> "$GITHUB_OUTPUT"
          printf '%s\n' '{"source":"azure_key_vault","status":"resolved","candidate_count":1,"dsn_resolved":true,"secret_value_exposed":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/capture-source-key-vault.json"

      - name: Registrar bloqueio de login OIDC
        if: steps.azure-login.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          printf '%s\n' '{"source":"azure_key_vault","status":"oidc_login_failed","dsn_resolved":false,"secret_value_exposed":false,"production_touched":false,"test_touched":false}' > "$EVIDENCE_DIR/capture-source-key-vault.json"

      - name: Consultar somente metadados SQL DEV
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          python scripts/integration_excel_sql_sharepoint_sql_locator.py \
            --output "$EVIDENCE_DIR/sql-locator-key-vault.json" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "sql-locator-kv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Consolidar resultado do Key Vault
        id: result
        shell: bash
        run: |
          set -euo pipefail
          status="$(python - "$EVIDENCE_DIR/sql-locator-key-vault.json" <<'PY'
          import json, sys
          from pathlib import Path
          payload=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          print(payload.get('status') or 'blocked')
          PY
          )"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          echo "key_vault_locator_status=$status"

      - name: Publicar evidência sanitizada do Key Vault
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-sql-locator-kv-dev-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_DIR }}/capture-source-key-vault.json
            ${{ env.EVIDENCE_DIR }}/sql-locator-key-vault.json
          if-no-files-found: error
          retention-days: 30

  decision:
    name: Consolidar captura segura SQL DEV
    needs: [environment-secret, key-vault]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Gerar resumo sanitizado
        id: summary
        env:
          ENV_STATUS: ${{ needs.environment-secret.outputs.locator_status }}
          KV_STATUS: ${{ needs.key-vault.outputs.locator_status }}
          KV_SOURCE_STATUS: ${{ needs.key-vault.outputs.key_vault_status }}
          EVENT_NAME: ${{ github.event_name }}
          STRICT_REQUESTED: ${{ inputs.strict || 'false' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python - "$EVIDENCE_DIR/capture-summary.json" <<'PY'
          import json, os, sys
          from pathlib import Path
          env_status=(os.getenv('ENV_STATUS') or '').strip()
          kv_status=(os.getenv('KV_STATUS') or '').strip()
          if env_status == 'resolved':
              status='resolved'; selected_source='github_environment_secret'
          elif kv_status == 'resolved':
              status='resolved'; selected_source='azure_key_vault'
          else:
              status='blocked'; selected_source=None
          payload={
              'schema_version':'1.0.0',
              'feature':'excel_sql_sharepoint_secure_capture',
              'status':status,
              'selected_source':selected_source,
              'environment_secret_locator_status':env_status or 'not_available',
              'key_vault_locator_status':kv_status or 'not_executed',
              'key_vault_source_status':(os.getenv('KV_SOURCE_STATUS') or 'not_executed'),
              'source_sha':os.getenv('GITHUB_SHA',''),
              'run_id':os.getenv('GITHUB_RUN_ID',''),
              'run_attempt':os.getenv('GITHUB_RUN_ATTEMPT',''),
              'secret_value_exposed':False,
              'business_data_read':False,
              'production_touched':False,
              'test_touched':False,
          }
          Path(sys.argv[1]).write_text(json.dumps(payload, indent=2)+'\n', encoding='utf-8')
          print(json.dumps({'status':status,'selected_source':selected_source,'environment_status':env_status,'key_vault_status':kv_status}))
          PY

      - name: Publicar resumo sanitizado
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-sql-locator-summary-dev-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/capture-summary.json
          if-no-files-found: error
          retention-days: 30

      - name: Aplicar modo estrito somente em execução manual
        if: github.event_name == 'workflow_dispatch' && inputs.strict
        shell: bash
        run: |
          set -euo pipefail
          status="$(python - "$EVIDENCE_DIR/capture-summary.json" <<'PY'
          import json, sys
          from pathlib import Path
          print(json.loads(Path(sys.argv[1]).read_text(encoding='utf-8')).get('status'))
          PY
          )"
          test "$status" = "resolved"
