name: Report Builder Main Protection Once

on:
  push:
    branches:
      - ops/report-builder-main-protection-20260923

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: report-builder-main-protection-once
  cancel-in-progress: true

jobs:
  protect:
    name: Proteger report-builder-platform/main
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 12
    env:
      TARGET_REPO: C:\dev\chatgpt-workers\operational-rules-validation
      HELPER_SHA: 0d5d73fff91efa56b50c5827c47b2666e291be3a
      HELPER_SYNC_REF: origin/ops/report-builder-main-protection-20260923
      CORRELATION_ID: report-builder-main-protection-once-${{ github.run_id }}-${{ github.run_attempt }}
      ACTION_ID: reqsys.report-builder-main-protection.dev
      ACTION_SCOPE: repo://ericson-j-santos/report-builder-platform/branch/main
      EVIDENCE_REL: artifacts/report-builder-main-protection-noteri/evidence.json
    steps:
      - name: Checkout regras canônicas
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: main
          path: _rules
          fetch-depth: 1

      - name: Validar host Noteri exato
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME.ToLowerInvariant() -ne "noteri") {
            throw "UNEXPECTED_HOST"
          }

      - name: Bootstrap obrigatório de sessão
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "report-builder-protect",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $env:HELPER_SHA,
            "--sync-ref", $env:HELPER_SYNC_REF
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $env:HELPER_SHA) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT

      - name: Validar helper via Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $commands = @(
            @("python", "-B", "scripts/run_report_builder_main_protection_local.py", "--help"),
            @("python", "-B", "scripts/configure_report_builder_main_protection_risk3.py", "--help"),
            @("python", "-B", "tests/test_report_builder_main_protection_ops.py")
          )
          $index = 0
          foreach ($command in $commands) {
            $index += 1
            $gatewayArgs = @(
              "--policy", $policy,
              "--correlation-id", "$env:CORRELATION_ID-validate-$index",
              "run",
              "--cwd", $env:TARGET_PATH,
              "--session-id", $env:SESSION_ID,
              "--risk", "1",
              "--"
            ) + $command
            & python $gateway @gatewayArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Instalar autorização Risk3 exata e temporária
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_report_builder_main_protection_risk3.py `
              --enable `
              --ttl-minutes 30 `
              --confirm ENABLE-REPORT-BUILDER-MAIN-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Aplicar proteção via Owner Risk3 Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\owner_risk3_gateway.py"
          $riskArgs = @(
            "--action-id", $env:ACTION_ID,
            "--scope", $env:ACTION_SCOPE,
            "--cwd", $env:TARGET_PATH,
            "--timeout", "300",
            "--correlation-id", $env:CORRELATION_ID
          )
          & python $gateway @riskArgs
          exit $LASTEXITCODE

      - name: Remover autorização Risk3 temporária
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_RISK3_CLEANUP" }
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_report_builder_main_protection_risk3.py `
              --disable `
              --confirm DISABLE-REPORT-BUILDER-MAIN-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Validar evidência sanitizada
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_EVIDENCE" }
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path $evidence)) { throw "PROTECTION_EVIDENCE_MISSING" }
          $data = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
          if ($data.status -notin @("PROTECTION_APPLIED", "ALREADY_COMPLIANT")) { throw "PROTECTION_NOT_CONFIRMED" }
          if ($data.repository -ne "ericson-j-santos/report-builder-platform") { throw "TARGET_REPOSITORY_MISMATCH" }
          if ($data.branch -ne "main") { throw "TARGET_BRANCH_MISMATCH" }
          if ($data.target_sha -ne "b80c999d83a82b3454bb6c486e16129f4f04f434") { throw "TARGET_SHA_MISMATCH" }
          if ($data.evidence_sha -ne "b80c999d83a82b3454bb6c486e16129f4f04f434") { throw "EVIDENCE_SHA_MISMATCH" }
          if (-not $data.protected) { throw "BRANCH_NOT_PROTECTED" }
          if (-not $data.pull_request_required) { throw "PULL_REQUEST_NOT_REQUIRED" }
          if (-not $data.enforce_admins) { throw "ADMINS_NOT_ENFORCED" }
          if (-not $data.strict_required_checks) { throw "REQUIRED_CHECKS_NOT_STRICT" }
          if ($data.force_push_allowed) { throw "FORCE_PUSH_ALLOWED" }
          if ($data.deletion_allowed) { throw "BRANCH_DELETION_ALLOWED" }
          if (-not $data.required_check_states."Quality / Python 3.11") { throw "PY311_CHECK_NOT_GREEN" }
          if (-not $data.required_check_states."Quality / Python 3.14") { throw "PY314_CHECK_NOT_GREEN" }
          if ($data.secret_value_exposed) { throw "SECRET_EXPOSURE_REPORTED" }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-builder-main-protection-noteri-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\report-builder-main-protection-noteri\evidence.json
          if-no-files-found: warn
          retention-days: 30
