name: CI Governance Drift Guard

on:
  workflow_dispatch: {}
  schedule:
    - cron: '15 */6 * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-governance-drift-guard.yml'
      - 'scripts/ci_governance_permissions.py'
      - 'tests/test_ci_governance_permissions.py'

permissions:
  actions: read
  contents: read

concurrency:
  group: ci-governance-drift-guard
  cancel-in-progress: true

jobs:
  drift-guard:
    name: Detect CI governance drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validar parser e controles negativos de permissoes
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check 'PyYAML==6.0.3'
          python -m unittest tests/test_ci_governance_permissions.py -q

      - name: Build drift report
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/ci-governance-drift-guard
          python - <<'PY'
          from pathlib import Path
          import json
          from datetime import datetime, timezone
          from scripts.ci_governance_permissions import audit_permissions

          critical = {
              '.github/workflows/ci.yml': {
                  'triggers_any': ['pull_request', 'push', 'workflow_dispatch'],
                  'artifact_required': False,
              },
              '.github/workflows/pr-evidence-gate.yml': {
                  'triggers_any': ['pull_request', 'workflow_dispatch'],
                  'artifact_required': True,
              },
              '.github/workflows/pr-governed-ci-validation.yml': {
                  'triggers_any': ['pull_request', 'workflow_dispatch'],
                  'artifact_required': True,
              },
              '.github/workflows/pr-ci-watch.yml': {
                  'triggers_any': ['pull_request', 'workflow_dispatch', 'workflow_run'],
                  'artifact_required': True,
              },
              '.github/workflows/pr-conflict-guard.yml': {
                  'triggers_any': ['pull_request', 'workflow_dispatch'],
                  'artifact_required': False,
              },
              '.github/workflows/ci-runtime-health-summary.yml': {
                  'triggers_any': ['workflow_dispatch', 'schedule'],
                  'artifact_required': True,
              },
          }

          failures = []
          observations = []

          for file_name, rules in critical.items():
              path = Path(file_name)
              if not path.exists():
                  failures.append(f'critical workflow removed: {file_name}')
                  observations.append({'file': file_name, 'status': 'missing'})
                  continue

              text = path.read_text(encoding='utf-8')
              lowered = text.lower()
              file_failures = []

              if not any(trigger in lowered for trigger in rules['triggers_any']):
                  file_failures.append('missing required trigger')

              if rules['artifact_required'] and 'actions/upload-artifact' not in lowered:
                  file_failures.append('missing required artifact upload')

              permission_result = audit_permissions(text, file_name)
              allowed_write_permissions = permission_result['allowed']
              observed_write_permissions = permission_result['observed']
              file_failures.extend(permission_result['violations'])

              for item in file_failures:
                  failures.append(f'{file_name}: {item}')

              observations.append({
                  'file': file_name,
                  'status': 'failed' if file_failures else 'passed',
                  'failures': file_failures,
                  'observed_write_permissions': observed_write_permissions,
                  'allowed_write_permissions': allowed_write_permissions,
              })

          report = {
              'schema_version': '1.1.0',
              'generated_at': datetime.now(timezone.utc).isoformat(),
              'status': 'failed' if failures else 'passed',
              'failures': failures,
              'observations': observations,
          }

          out = Path('artifacts/ci-governance-drift-guard')
          (out / 'drift-report.json').write_text(json.dumps(report, indent=2, ensure_ascii=False), encoding='utf-8')

          lines = [
              '# CI Governance Drift Guard',
              '',
              f"- Status: {report['status']}",
              f"- Failures: {len(failures)}",
              f"- Generated at: {report['generated_at']}",
              '',
              '## Failures',
          ]
          if failures:
              lines.extend(f'- {failure}' for failure in failures)
          else:
              lines.append('- None')
          lines.extend(['', '## Observations'])
          for item in observations:
              allowed = ', '.join(item['allowed_write_permissions']) or 'none'
              observed = ', '.join(item['observed_write_permissions']) or 'none'
              lines.append(
                  f"- {item['file']}: {item['status']} | observed writes: {observed} | allowed writes: {allowed}"
              )

          (out / 'drift-report.md').write_text('\n'.join(lines), encoding='utf-8')
          print('\n'.join(lines))

          if failures:
              raise SystemExit(1)
          PY

      - name: Upload drift report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ci-governance-drift-report
          path: artifacts/ci-governance-drift-guard/
          if-no-files-found: error
          retention-days: 30
