name: Minimum Controlled Version Gate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimum-controlled-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test minimum controlled version policy
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_minimum_controlled_version.py
      - name: Validate repository manifest
        run: python scripts/validate_minimum_controlled_version.py governance/minimum-controlled-version.json
