name: Minimum Controlled Version Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/minimum-controlled-version.json"
      - "scripts/validate_minimum_controlled_version.py"
      - "tests/test_minimum_controlled_version.py"
      - "tests/test_generated_minimum_controlled_manifest_contract.py"
      - ".github/workflows/minimum-controlled-version-gate.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: minimum-controlled-version-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Test minimum controlled version policy and artifact emitter
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_minimum_controlled_version.py \
            tests/test_generated_minimum_controlled_manifest_contract.py
      - name: Validate repository manifest
        run: python scripts/validate_minimum_controlled_version.py governance/minimum-controlled-version.json
