name: Report Factory Fabric DEV Preflight

on:
  push:
    branches:
      - "consolidate/report-factory-*"
    paths:
      - ".github/workflows/report-factory-fabric-dev-preflight.yml"
      - "tools/geradores/report_factory.py"
      - "scripts/fabric_oidc_readonly_probe.py"
      - "tests/test_report_factory_fabric_dev_preflight.py"
      - ".sdd/specs/report-factory-rdl-mvp.spec.json"
      - ".sdd/specs/report-factory-rdl-mvp.requirements.md"
      - ".sdd/specs/report-factory-rdl-mvp.tasks.md"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: report-factory-fabric-dev-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fabric-dev-preflight:
    name: fabric-dev-preflight
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    env:
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      EVIDENCE_FILE: artifacts/report-factory/fabric-dev-preflight.json

    steps:
      - name: Checkout do SHA exato
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}

      - name: Validar configuração OIDC governada
        shell: bash
        run: |
          set -euo pipefail
          for name in CCP_AZURE_CLIENT_ID CCP_AZURE_TENANT_ID CCP_AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name não configurado no environment development."
              exit 2
            fi
          done

      - name: Login Azure OIDC governado
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Descobrir Fabric DEV sem mutação
        shell: bash
        env:
          AZURE_CORE_OUTPUT: none
        run: |
          set -euo pipefail
          python scripts/fabric_oidc_readonly_probe.py             --tenant-id "$CCP_AZURE_TENANT_ID"             --client-id "$CCP_AZURE_CLIENT_ID"             --output "$EVIDENCE_FILE"

      - name: Exibir decisão sanitizada
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$EVIDENCE_FILE" || {
            echo "::error::Evidência Fabric não foi produzida."
            exit 1
          }
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["EVIDENCE_FILE"]).read_text(encoding="utf-8"))
          print(f"status={data.get('status')}")
          print(f"tenant_match={str(data.get('tenant_match')).lower()}")
          print(f"oidc_client_id={data.get('oidc_client_id')}")
          fabric = data.get("fabric") or {}
          print(f"fabric_token_obtained={str(fabric.get('token_obtained')).lower()}")
          print(f"fabric_status={fabric.get('status')}")
          for item in data.get("candidate_workspaces") or []:
              print(f"workspace={item.get('name')}|{item.get('id')}")
          print(f"graph_status={(data.get('graph') or {}).get('status')}")
          print("secret_value_exposed=false")
          print("mutations_performed=false")
          PY

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-factory-fabric-dev-preflight-${{ github.sha }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Gate de prontidão Fabric DEV
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path(os.environ["EVIDENCE_FILE"]).read_text(encoding="utf-8"))
          fabric = data.get("fabric") or {}
          assert data.get("status") == "completed", data
          assert data.get("tenant_match") is True, data
          assert fabric.get("token_obtained") is True, data
          assert fabric.get("status") == 200, data
          assert data.get("secret_value_exposed") is False, data
          assert data.get("mutations_performed") is False, data
          assert data.get("candidate_workspaces"), data
          print("REPORT_FACTORY_FABRIC_DEV_PREFLIGHT_OK")
          PY
