name: BACEN Policy Governance Attestation

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/CYBERSECURITY-POLICY.md"
      - "governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_policy_attestation.py"
      - ".github/workflows/bacen-policy-governance-attestation.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/CYBERSECURITY-POLICY.md"
      - "governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_policy_attestation.py"
      - ".github/workflows/bacen-policy-governance-attestation.yml"
  schedule:
    - cron: "23 9 28 7 *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-policy-governance-attestation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  attest-policy:
    name: BACEN-01 Policy Governance Attestation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_policy_attestation.py

      - name: Generate technical attestation
        run: |
          python scripts/generate_bacen_policy_attestation.py \
            --policy governance/bacen/CYBERSECURITY-POLICY.md \
            --metadata governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml \
            --output artifacts/bacen/bacen-01-policy-governance-attestation.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-01-policy-governance-attestation.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          assert evidence["control_id"] == "BACEN-01"
          assert evidence["technical_checks_passed"] is True
          assert evidence["review_overdue"] is False
          assert evidence["missing_sections"] == []
          assert evidence["formal_approval_present"] is False
          assert evidence["control_status"] == "partial"
          assert len(evidence["policy_sha256"]) == 64
          assert len(evidence["metadata_sha256"]) == 64
          assert evidence["production_touched"] is False
          print("BACEN-01 policy governance attestation: valid")
          PY

      - name: Publish technical attestation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-01-policy-governance-attestation
          path: artifacts/bacen/bacen-01-policy-governance-attestation.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish executive summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-01-policy-governance-attestation.json")
          print("## BACEN-01 — Governança da política")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          print(f"\n- Checks técnicos: **{evidence['technical_checks_passed']}**")
          print(f"- Revisão vencida: **{evidence['review_overdue']}**")
          print(f"- Aprovação institucional formal: **{evidence['formal_approval_present']}**")
          print(f"- Status do controle: **{evidence['control_status']}**")
          print(f"- Próxima revisão: `{evidence['next_technical_review_due_at']}`")
          print(f"- SHA-256 da política: `{evidence['policy_sha256']}`")
          print("- Produção acessada: **false**")
          PY
