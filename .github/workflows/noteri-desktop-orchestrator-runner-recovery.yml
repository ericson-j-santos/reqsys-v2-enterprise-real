name: Noteri to Desktop Orchestrator Runner Recovery

on:
  push:
    branches:
      - fix/noteri-desktop-orchestrator-runner-recovery-20260924
    paths:
      - scripts/noteri_desktop_orchestrator_runner_recovery.py
      - tests/test_noteri_desktop_orchestrator_runner_recovery.py
      - .github/workflows/noteri-desktop-orchestrator-runner-recovery.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: noteri-desktop-orchestrator-runner-recovery
  cancel-in-progress: true

jobs:
  recover:
    name: Recover Desktop runner through Engineering Orchestrator
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 6
    env:
      TARGET_REPO: ${{ github.workspace }}
      RULES_SHA: 5d1f603241dde37a597d2b7bdc5e07425db7b451
      CORRELATION_ID: noteri-orchestrator-runner-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\noteri-desktop-orchestrator-runner\evidence.json

    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $syncRef = "origin/$env:GITHUB_REF_NAME"
          $args = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "noteri-orchestrator-runner",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", $syncRef
          )
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Validate targeted tests through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-tests",
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "pytest", "tests/test_noteri_desktop_orchestrator_runner_recovery.py", "-q"
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Recover Desktop runner through fixed Orchestrator handler
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_orchestrator_runner_recovery.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "120",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $script,
            "--confirm", "RECOVER-DESKTOP-RUNNER-VIA-ORCHESTRATOR",
            "--correlation-id", $env:CORRELATION_ID,
            "--evidence-file", $env:EVIDENCE_REL,
            "--timeout-seconds", "90"
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Dispatch independent Desktop pickup canary
        id: canary
        uses: actions/github-script@v7
        with:
          script: |
            const started = new Date();
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'codex-worker-pool-smoke-dev.yml',
              ref: 'main',
            });

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            let target = null;
            for (let attempt = 0; attempt < 12; attempt++) {
              const runs = await github.rest.actions.listWorkflowRuns({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'codex-worker-pool-smoke-dev.yml',
                event: 'workflow_dispatch',
                branch: 'main',
                per_page: 10,
              });
              target = runs.data.workflow_runs.find((run) => new Date(run.created_at) >= started) || null;
              if (target) break;
              await sleep(5000);
            }
            if (!target) {
              core.setFailed('DESKTOP_CANARY_RUN_NOT_FOUND');
              return;
            }

            core.setOutput('run_id', String(target.id));
            const deadline = Date.now() + 120000;
            let pickup = null;
            while (Date.now() < deadline) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: target.id,
                per_page: 100,
              });
              pickup = jobs.data.jobs.find((job) =>
                job.name === 'Validar Worker Pool no PC24x7 DEV' &&
                (job.status !== 'queued' || Number(job.runner_id || 0) > 0)
              ) || null;
              if (pickup) break;
              await sleep(5000);
            }

            if (!pickup) {
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: target.id,
              });
              core.setFailed('DESKTOP_RUNNER_PICKUP_NOT_PROVEN');
              return;
            }
            core.info(`DESKTOP_RUNNER_PICKUP_PROVEN run=${target.id} job=${pickup.id} status=${pickup.status}`);

      - name: Upload sanitized recovery evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-desktop-orchestrator-runner-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\noteri-desktop-orchestrator-runner\evidence.json
          if-no-files-found: warn
          retention-days: 30


  queue_watchdog:
    name: Noteri recovery queue watchdog
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions:
      actions: write
      contents: read
    env:
      TARGET_RUN_ID: ${{ github.run_id }}
      TARGET_JOB_NAME: Recover Desktop runner through Engineering Orchestrator
      STALL_AFTER_SECONDS: "75"
    steps:
      - name: Observe Noteri pickup and fail closed
        uses: actions/github-script@v7
        with:
          script: |
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
            const runId = Number(process.env.TARGET_RUN_ID);
            const deadline = Date.now() + Number(process.env.STALL_AFTER_SECONDS) * 1000;
            while (Date.now() < deadline) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
                per_page: 100,
              });
              const target = jobs.data.jobs.find((job) => job.name === process.env.TARGET_JOB_NAME) || null;
              if (target && (target.status !== 'queued' || Number(target.runner_id || 0) > 0)) {
                core.info(`NOTERI_PICKUP_OBSERVED job=${target.id} status=${target.status}`);
                return;
              }
              await sleep(5000);
            }
            core.setFailed('NOTERI_RUNNER_PICKUP_TIMEOUT');
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: runId,
            });
