name: Credential Consumer Cutover Contract

on:
  pull_request:
    paths:
      - "scripts/resolve_managed_credential.py"
      - "scripts/pr_quality_review_entry.py"
      - "tests/test_resolve_managed_credential.py"
      - "tests/test_pr_quality_review.py"
      - ".github/actions/resolve-managed-credential/**"
      - ".github/workflows/*fly*.yml"
      - ".github/workflows/deploy-production-sync.yml"
      - ".github/workflows/deploy-staging-auth-fix.yml"
      - ".github/workflows/gitlab-main-mirror.yml"
      - ".github/workflows/credential-control-plane-cutover-smoke.yml"
      - ".github/workflows/credential-consumer-cutover-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes do resolvedor e classificação governada
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==9.0.3"
          python -m pytest -q tests/test_resolve_managed_credential.py tests/test_pr_quality_review.py
          python -m py_compile scripts/resolve_managed_credential.py scripts/pr_quality_review_entry.py
      - name: Bloquear regressão dos consumidores migrados
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/gitlab-main-mirror.yml
            .github/workflows/fly-runtime-p0.yml
            .github/workflows/deploy-staging-auth-fix.yml
            .github/workflows/deploy-production-sync.yml
            .github/workflows/fly-enterprise-sync.yml
          )
          for file in "${files[@]}"; do
            if grep -Eq 'secrets\.(FLY_API_TOKEN|GITLAB_MIRROR_TOKEN)' "$file"; then
              echo "::error::$file ainda referencia secret legado gerenciado pelo Control Plane."
              exit 1
            fi
            if grep -Fq 'vars.CCP_AZURE_CLIENT_ID }}' "$file"; then
              echo "::error::$file reutiliza a identidade mutadora do lifecycle; use reader dedicado."
              exit 1
            fi
            grep -q 'resolve-managed-credential' "$file" || {
              echo "::error::$file não utiliza o resolvedor canônico."
              exit 1
            }
          done

          grep -q 'CCP_AZURE_CLIENT_ID_GITLAB' .github/workflows/gitlab-main-mirror.yml
          grep -q 'CCP_AZURE_CLIENT_ID_HML' .github/workflows/deploy-staging-auth-fix.yml
          grep -q 'CCP_AZURE_CLIENT_ID_PROD' .github/workflows/deploy-production-sync.yml
          grep -q 'CCP_AZURE_CLIENT_ID_PROD' .github/workflows/fly-runtime-p0.yml
          for identity in DEV HML PROD; do
            grep -q "CCP_AZURE_CLIENT_ID_${identity}" .github/workflows/fly-enterprise-sync.yml || {
              echo "::error::Fly Enterprise Sync não referencia reader ${identity}."
              exit 1
            }
          done
