name: Credential Consumer Cutover Contract

on:
  pull_request:
    paths:
      - "scripts/resolve_managed_credential.py"
      - "tests/test_resolve_managed_credential.py"
      - ".github/actions/resolve-managed-credential/**"
      - ".github/workflows/*fly*.yml"
      - ".github/workflows/gitlab-main-mirror.yml"
      - ".github/workflows/credential-consumer-cutover-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Testes do resolvedor
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==9.0.3"
          python -m pytest -q tests/test_resolve_managed_credential.py
          python -m py_compile scripts/resolve_managed_credential.py
      - name: Bloquear regressão dos consumidores migrados
        shell: bash
        run: |
          set -euo pipefail
          files=(
            .github/workflows/gitlab-main-mirror.yml
            .github/workflows/fly-runtime-p0.yml
            .github/workflows/deploy-staging-auth-fix.yml
          )
          for file in "${files[@]}"; do
            if grep -Eq 'secrets\.(FLY_API_TOKEN|GITLAB_MIRROR_TOKEN)' "$file"; then
              echo "::error::$file ainda referencia secret legado gerenciado pelo Control Plane."
              exit 1
            fi
            grep -q 'resolve-managed-credential' "$file" || {
              echo "::error::$file não utiliza o resolvedor canônico."
              exit 1
            }
          done
