name: BACEN DPA Lifecycle Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/VENDOR-DPA-EVIDENCE-CONTRACT.yaml"
      - "scripts/generate_bacen_dpa_lifecycle_readiness.py"
      - ".github/workflows/bacen-dpa-lifecycle-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/VENDOR-DPA-EVIDENCE-CONTRACT.yaml"
      - "scripts/generate_bacen_dpa_lifecycle_readiness.py"
      - ".github/workflows/bacen-dpa-lifecycle-readiness.yml"
  schedule:
    - cron: "23 8 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-dpa-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    name: BACEN-05 DPA Lifecycle Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML
      - run: python -m py_compile scripts/generate_bacen_dpa_lifecycle_readiness.py
      - name: Generate lifecycle evidence
        run: |
          python scripts/generate_bacen_dpa_lifecycle_readiness.py \
            --contract governance/bacen/VENDOR-DPA-EVIDENCE-CONTRACT.yaml \
            --output artifacts/bacen/bacen-05-dpa-lifecycle-readiness.json \
            --warning-days 90
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bacen-05-dpa-lifecycle-readiness
          path: artifacts/bacen/bacen-05-dpa-lifecycle-readiness.json
          if-no-files-found: error
          retention-days: 365
