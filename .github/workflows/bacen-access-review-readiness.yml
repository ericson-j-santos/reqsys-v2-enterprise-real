name: BACEN Access Review Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/ACCESS-REVIEW-REGISTER.yaml"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_access_review_readiness.py"
      - ".github/workflows/bacen-access-review-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/ACCESS-REVIEW-REGISTER.yaml"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_access_review_readiness.py"
      - ".github/workflows/bacen-access-review-readiness.yml"
  schedule:
    - cron: "13 10 1 */3 *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-access-review-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    name: BACEN-02 Quarterly Access Review Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_access_review_readiness.py

      - name: Generate readiness evidence
        run: |
          python scripts/generate_bacen_access_review_readiness.py \
            --register governance/bacen/ACCESS-REVIEW-REGISTER.yaml \
            --output artifacts/bacen/bacen-02-access-review-readiness.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("artifacts/bacen/bacen-02-access-review-readiness.json").read_text(encoding="utf-8")
          )
          assert evidence["control_id"] == "BACEN-02"
          assert evidence["structural_checks_passed"] is True
          assert evidence["review_cycle_days"] == 90
          assert evidence["missing_review_dimensions"] == []
          assert evidence["missing_privileged_roles"] == []
          assert evidence["control_status"] in {"partial", "implemented"}
          assert len(evidence["register_sha256"]) == 64
          assert evidence["production_touched"] is False
          print("BACEN-02 access review readiness: valid")
          PY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-02-access-review-readiness
          path: artifacts/bacen/bacen-02-access-review-readiness.json
          if-no-files-found: error
          retention-days: 90

      - name: Publish executive summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-02-access-review-readiness.json")
          print("## BACEN-02 — Revisão trimestral de acessos")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          print(f"\n- Estrutura governada válida: **{evidence['structural_checks_passed']}**")
          print(f"- Revisão formal concluída: **{evidence['formal_review_completed']}**")
          print(f"- MFA evidenciado: **{evidence['mfa_evidenced']}**")
          print(f"- Status do controle: **{evidence['control_status']}**")
          print(f"- Findings: `{', '.join(evidence['findings']) or 'nenhum'}`")
          print("- Modo: **advisory**")
          print("- Produção acessada: **false**")
          PY
