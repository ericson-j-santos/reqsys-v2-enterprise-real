name: Noteri Desktop Listener Probe

on:
  push:
    branches:
      - fix/noteri-desktop-orchestrator-runner-recovery-20260924
    paths:
      - scripts/noteri_desktop_listener_probe.py
      - .github/workflows/noteri-desktop-listener-probe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: noteri-desktop-listener-probe
  cancel-in-progress: true

jobs:
  probe:
    name: Probe known Desktop listeners from Noteri
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 3
    env:
      RULES_SHA: 5d1f603241dde37a597d2b7bdc5e07425db7b451
      CORRELATION_ID: noteri-desktop-listener-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\\noteri-desktop-listener\\evidence.json
    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--repo", $env:GITHUB_WORKSPACE,
            "--session-prefix", "noteri-listener-probe",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/$env:GITHUB_REF_NAME"
          )
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT

      - name: Probe fixed listeners through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_listener_probe.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "30",
            "--expected-head", "${{ github.sha }}",
            "--",
            "python", $script,
            "--correlation-id", $env:CORRELATION_ID,
            "--evidence-file", $env:EVIDENCE_REL
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Upload sanitized evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-desktop-listener-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\noteri-desktop-listener\evidence.json
          if-no-files-found: warn
          retention-days: 30

  pickup_watchdog:
    name: Noteri probe pickup watchdog
    runs-on: windows-latest
    timeout-minutes: 2
    steps:
      - name: Fail fast if Noteri does not pick up
        uses: actions/github-script@v7
        with:
          script: |
            const sleep = (ms) => new Promise(resolve => setTimeout(resolve, ms));
            const start = Date.now();
            while (Date.now() - start < 60000) {
              const jobs = await github.rest.actions.listJobsForWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: context.runId,
                per_page: 100
              });
              const target = jobs.data.jobs.find(j => j.name === 'Probe known Desktop listeners from Noteri');
              if (target && (target.status !== 'queued' || Number(target.runner_id || 0) > 0)) {
                core.info('NOTERI_PROBE_PICKUP_PROVEN');
                return;
              }
              await sleep(5000);
            }
            core.setFailed('NOTERI_PROBE_PICKUP_TIMEOUT');
            await github.rest.actions.cancelWorkflowRun({
              owner: context.repo.owner,
              repo: context.repo.repo,
              run_id: context.runId
            });
