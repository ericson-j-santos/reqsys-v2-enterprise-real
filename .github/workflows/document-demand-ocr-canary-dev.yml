name: Document Demand OCR Canary DEV

on:
  push:
    branches:
      - ops/document-demand-ocr-canary-dev
    paths:
      - backend/fly.dev.toml
      - .github/workflows/document-demand-ocr-canary-dev.yml
      - backend/app/documento_demanda_canary.py
      - backend/app/api/documento_demanda.py
      - backend/app/ocr/documento_worker.py
      - backend/app/services/documento_demanda.py
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  APP_NAME: reqsys-api-dev
  API_URL: https://reqsys-api-dev.fly.dev
  REPORT_DIR: artifacts/document-demand-ocr-canary-dev
  SAMPLE_URL: https://www.gov.br/anvisa/pt-br/centraisdeconteudo/publicacoes/certificacao-e-fiscalizacao/compilado-procedimentos-SNVS/0019-pop-o-snvs-019/pop-o-snvs-019-rev-1-elaboracao-de-relatorio-gases-medicinais-atualiz.pdf/@@download/file
  SAMPLE_SOURCE: ANVISA-POP-O-SNVS-019-REV-1

jobs:
  canary:
    name: Ativar DEV, implantar e executar canário OCR documental
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar isolamento DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'DOCUMENTO_DEMANDA_OCR_ENABLED = \"true\"' backend/fly.dev.toml)" -eq 1
          if grep -R -n 'DOCUMENTO_DEMANDA_OCR_ENABLED = "true"' backend/fly.staging.toml backend/fly.toml 2>/dev/null; then
            echo '::error::OCR documental não pode ser habilitado em STG/PROD neste incremento.'
            exit 2
          fi
          mkdir -p "${REPORT_DIR}"

      - name: Autenticar Azure por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.CCP_AZURE_CLIENT_ID_FLY_GOVERNED_COMMAND }}
          tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Resolver token Fly do cofre
        shell: bash
        run: |
          set -euo pipefail
          value="$(az keyvault secret show \
            --vault-name "${{ vars.REQSYS_KEY_VAULT_NAME }}" \
            --name reqsys-fly-control-plane-org-token \
            --query value -o tsv)"
          test -n "$value" || { echo '::error::Token Fly ausente no Key Vault.'; exit 3; }
          echo "::add-mask::$value"
          echo "FLY_API_TOKEN=$value" >> "$GITHUB_ENV"

      - name: Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Implantar backend somente em DEV
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && flyctl deploy --config fly.dev.toml --app "${APP_NAME}" --remote-only)

      - name: Aguardar saúde do DEV
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "${API_URL}/health" > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo '::error::DEV não ficou saudável após o deploy.'
          exit 4

      - name: Executar canário dentro da máquina DEV
        shell: bash
        run: |
          set -euo pipefail
          set +e
          remote_output="$(flyctl ssh console --app "${APP_NAME}" -C "python -m app.documento_demanda_canary --sample-url '${SAMPLE_URL}' --sample-source '${SAMPLE_SOURCE}' --run-id '${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}'" 2>&1)"
          remote_status=$?
          set -e

          if [ "$remote_status" -ne 0 ]; then
            printf '%s\n' "$remote_output"
            echo '::error::Canário remoto falhou dentro do DEV.'
            exit "$remote_status"
          fi

          payload="$(printf '%s\n' "$remote_output" | sed -n 's/^REQSYS_CANARY_REPORT_B64=//p' | tail -n 1)"
          test -n "$payload" || {
            printf '%s\n' "$remote_output"
            echo '::error::Relatório sanitizado do canário não foi produzido.'
            exit 5
          }

          printf '%s' "$payload" | python -c "import base64,json,sys,pathlib; raw=base64.urlsafe_b64decode(sys.stdin.read().encode()); data=json.loads(raw); pathlib.Path('${REPORT_DIR}/canary-report.json').write_text(json.dumps(data, ensure_ascii=False, indent=2), encoding='utf-8')"

      - name: Validar resultado do canário
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/document-demand-ocr-canary-dev/canary-report.json')
          report = json.loads(path.read_text(encoding='utf-8'))
          assert report['environment'] == 'desenvolvimento', report
          assert report['readiness']['enabled'] is True, report
          assert report['readiness']['ready'] is True, report
          assert report['status'] == 'AGUARDANDO_REVISAO_HUMANA', report
          assert report['extraction_success'] is True, report
          assert report['candidates_total'] > 0, report
          assert report['human_review_required_rate'] == 1.0, report
          assert report['automatic_incorporation'] is False, report
          assert report['idempotent_retry'] is True, report
          assert report['stg_touched'] is False and report['prod_touched'] is False, report
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Publicar resumo
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          {
            echo '# Canário OCR documental — DEV'
            echo
            echo "- Run: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo '- STG tocado: não'
            echo '- PROD tocado: não'
            if [ -f "${REPORT_DIR}/canary-report.json" ]; then
              python - <<'PY'
          import json
          p=json.load(open('artifacts/document-demand-ocr-canary-dev/canary-report.json', encoding='utf-8'))
          print(f"- Ambiente: {p['environment']}")
          print(f"- Status: {p['status']}")
          print(f"- Páginas: {p['sample']['pages']}")
          print(f"- SHA-256: {p['sample']['sha256']}")
          print(f"- Candidatos: {p['candidates_total']}")
          print(f"- Candidatos com página: {p['candidate_with_page_rate']:.0%}")
          print(f"- Revisão humana: {p['human_review_required_rate']:.0%}")
          print(f"- Reenvio idempotente: {'sim' if p['idempotent_retry'] else 'não'}")
          print(f"- Consistência dos gatilhos: {p['trigger_consistency_rate']:.0%}")
          print('- Falso positivo semântico: requer rotulagem humana; não inferido automaticamente.')
          PY
            fi
          } | tee "${REPORT_DIR}/summary.md"

      - name: Publicar evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-demand-ocr-canary-dev
          path: artifacts/document-demand-ocr-canary-dev
          if-no-files-found: error
          retention-days: 30
