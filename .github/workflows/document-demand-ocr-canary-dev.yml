name: Document Demand OCR Canary DEV

on:
  push:
    branches:
      - ops/document-demand-ocr-canary-dev
    paths:
      - backend/fly.dev.toml
      - .github/workflows/document-demand-ocr-canary-dev.yml
      - backend/app/api/documento_demanda.py
      - backend/app/ocr/documento_worker.py
      - backend/app/services/documento_demanda.py
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  APP_NAME: reqsys-api-dev
  API_URL: https://reqsys-api-dev.fly.dev
  REPORT_DIR: artifacts/document-demand-ocr-canary-dev
  SAMPLE_URL: https://www.gov.br/anvisa/pt-br/setorregulado/regularizacao/medicamentos/fitoterapicos-dinamizados-e-especificos/informes/especificos/no5_avaliacao_nome-2.pdf/@@download/file
  SAMPLE_SOURCE: ANVISA-NT-005-2016

jobs:
  canary:
    name: Ativar DEV, implantar e executar canário OCR documental
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar isolamento DEV
        shell: bash
        run: |
          set -euo pipefail
          test "$(grep -c 'DOCUMENTO_DEMANDA_OCR_ENABLED = \"true\"' backend/fly.dev.toml)" -eq 1
          if grep -R -n 'DOCUMENTO_DEMANDA_OCR_ENABLED = "true"' backend/fly.staging.toml backend/fly.toml 2>/dev/null; then
            echo '::error::OCR documental não pode ser habilitado em STG/PROD neste incremento.'
            exit 2
          fi
          mkdir -p "${REPORT_DIR}"

      - name: Autenticar Azure por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.CCP_AZURE_CLIENT_ID_FLY_GOVERNED_COMMAND }}
          tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Resolver token Fly do cofre
        shell: bash
        run: |
          set -euo pipefail
          value="$(az keyvault secret show \
            --vault-name "${{ vars.REQSYS_KEY_VAULT_NAME }}" \
            --name reqsys-fly-control-plane-org-token \
            --query value -o tsv)"
          test -n "$value" || { echo '::error::Token Fly ausente no Key Vault.'; exit 3; }
          echo "::add-mask::$value"
          echo "FLY_API_TOKEN=$value" >> "$GITHUB_ENV"

      - name: Instalar flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Implantar backend somente em DEV
        shell: bash
        run: |
          set -euo pipefail
          (cd backend && flyctl deploy --config fly.dev.toml --app "${APP_NAME}" --remote-only)

      - name: Aguardar saúde do DEV
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 10 "${API_URL}/health" > /tmp/health.json; then
              cat /tmp/health.json
              exit 0
            fi
            sleep 5
          done
          echo '::error::DEV não ficou saudável após o deploy.'
          exit 4

      - name: Gerar credencial efêmera no DEV
        shell: bash
        run: |
          set -euo pipefail
          token=''
          for tentativa in 1 2 3; do
            set +e
            remote_output="$(flyctl ssh console --app "${APP_NAME}" -C "python -c \"from app.core.security import criar_token; print('REQSYS_CANARY_TOKEN='+criar_token({'sub':'reqsys-ocr-canary','papel':'admin'}, minutos=10))\"" 2>&1)"
            remote_status=$?
            set -e
            if [ "$remote_status" -eq 0 ]; then
              token="$(printf '%s\n' "$remote_output" | sed -n 's/^REQSYS_CANARY_TOKEN=//p' | tail -n 1)"
              [ -n "$token" ] && break
            fi
            sleep $((tentativa * 2))
          done
          test -n "$token" || {
            echo '::error::Não foi possível obter a credencial efêmera do DEV após 3 tentativas.'
            exit 5
          }
          echo "::add-mask::$token"
          echo "CANARY_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Validar prontidão OCR documental
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 30 \
            -H "Authorization: Bearer ${CANARY_TOKEN}" \
            "${API_URL}/v1/ocr/demandas/documentos/ocr-readiness" \
            > "${REPORT_DIR}/readiness.json"
          python - <<'PY'
          import json
          p=json.load(open('artifacts/document-demand-ocr-canary-dev/readiness.json', encoding='utf-8'))
          d=p['data']
          assert d.get('enabled') is True, d
          assert d.get('ready_pdf') is True, d
          assert d.get('tesseract') is True, d
          assert d.get('pdftoppm') is True, d
          assert d.get('pdfinfo') is True, d
          print(json.dumps({'enabled': True, 'ready_pdf': True, 'environment': d.get('environment')}, ensure_ascii=False))
          PY

      - name: Baixar e validar amostra real pública
        shell: bash
        run: |
          set -euo pipefail
          curl -fL --retry 4 --retry-delay 2 --connect-timeout 20 --max-time 120 \
            "${SAMPLE_URL}" -o /tmp/canary.pdf
          test -s /tmp/canary.pdf
          bytes=$(stat -c%s /tmp/canary.pdf)
          test "$bytes" -le 10485760 || { echo '::error::Amostra excede 10 MB.'; exit 6; }
          if ! command -v pdfinfo >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq poppler-utils >/dev/null
          fi
          pages=$(pdfinfo /tmp/canary.pdf | awk '/^Pages:/ {print $2}')
          test -n "$pages"
          test "$pages" -le 25 || { echo "::error::Amostra tem ${pages} páginas; máximo governado é 25."; exit 7; }
          sha=$(sha256sum /tmp/canary.pdf | awk '{print $1}')
          printf '{"source":"%s","url":"%s","sha256":"%s","bytes":%s,"pages":%s,"classification":"HOMOLOGATED_APPROVED","contains_personal_data":false,"approval_reference":"user-request-2026-08-26"}\n' \
            "${SAMPLE_SOURCE}" "${SAMPLE_URL}" "$sha" "$bytes" "$pages" \
            > "${REPORT_DIR}/sample-manifest.json"

      - name: Executar canário pelo endpoint DEV
        shell: bash
        run: |
          set -euo pipefail
          demanda_ref="CANARY-OCR-DEV-${GITHUB_RUN_ID}"
          correlation="OCR-CANARY-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          first_code=$(curl -sS --max-time 600 -o /tmp/first.json -w '%{http_code}' \
            -X POST "${API_URL}/v1/ocr/demandas/documentos/analisar" \
            -H "Authorization: Bearer ${CANARY_TOKEN}" \
            -H "X-Correlation-Id: ${correlation}" \
            -F "demanda_ref=${demanda_ref}" \
            -F 'arquivo=@/tmp/canary.pdf;type=application/pdf')
          if [ "$first_code" != '200' ]; then
            python - <<'PY'
          import json
          try:
              data=json.load(open('/tmp/first.json', encoding='utf-8'))
              print('Erro sanitizado:', data.get('detail') or data.get('errors') or 'sem detalhe')
          except Exception:
              print('Erro sanitizado: resposta não JSON')
          PY
            echo "::error::Primeira análise retornou HTTP ${first_code}."
            exit 8
          fi

          retry_code=$(curl -sS --max-time 120 -o /tmp/retry.json -w '%{http_code}' \
            -X POST "${API_URL}/v1/ocr/demandas/documentos/analisar" \
            -H "Authorization: Bearer ${CANARY_TOKEN}" \
            -H "X-Correlation-Id: ${correlation}-RETRY" \
            -F "demanda_ref=${demanda_ref}" \
            -F 'arquivo=@/tmp/canary.pdf;type=application/pdf')
          test "$retry_code" = '200' || { echo "::error::Reenvio retornou HTTP ${retry_code}."; exit 9; }

          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path

          first=json.load(open('/tmp/first.json', encoding='utf-8'))['data']
          retry=json.load(open('/tmp/retry.json', encoding='utf-8'))['data']
          manifest=json.load(open('artifacts/document-demand-ocr-canary-dev/sample-manifest.json', encoding='utf-8'))
          readiness=json.load(open('artifacts/document-demand-ocr-canary-dev/readiness.json', encoding='utf-8'))['data']
          candidates=first.get('candidatos') or []

          assert first.get('status') == 'AGUARDANDO_REVISAO_HUMANA', first
          assert first.get('incorporacao_automatica') is False, first
          assert candidates, 'Canário não produziu candidatos.'
          assert all(c.get('requer_validacao_humana') is True for c in candidates), candidates
          assert retry.get('id') == first.get('id'), (first, retry)
          assert retry.get('idempotente') is True, retry
          assert retry.get('incorporacao_automatica') is False, retry

          triggers={
            'POSSIVEL_REQUISITO': ('deve ', 'deverá ', 'precisa ', 'necessário ', 'obrigatório '),
            'POSSIVEL_REGRA_NEGOCIO': ('somente ', 'apenas ', 'não pode ', 'proibido ', 'permitido '),
            'POSSIVEL_REQUISITO_NAO_FUNCIONAL': ('segundo', 'até ', 'ms', 'disponibilidade', 'latência'),
          }
          inconsistent=0
          for c in candidates:
            expected=triggers.get(c.get('tipo'), ())
            text=(c.get('texto') or '').lower()
            if expected and not any(t in text for t in expected):
              inconsistent += 1

          total=len(candidates)
          report={
            'schema_version':'1.0.0',
            'environment': readiness.get('environment'),
            'sample': manifest,
            'readiness': {
              'enabled': readiness.get('enabled'),
              'ready': readiness.get('ready_pdf'),
              'tesseract': readiness.get('tesseract'),
              'pdftoppm': readiness.get('pdftoppm'),
              'pdfinfo': readiness.get('pdfinfo'),
            },
            'analysis_id': first.get('id'),
            'status': first.get('status'),
            'extraction_success': True,
            'candidates_total': total,
            'candidate_types': dict(Counter(c.get('tipo') for c in candidates)),
            'candidate_with_page_rate': round(sum(c.get('pagina') is not None for c in candidates)/total, 4),
            'human_review_required_rate': round(sum(c.get('requer_validacao_humana') is True for c in candidates)/total, 4),
            'automatic_incorporation': first.get('incorporacao_automatica'),
            'idempotent_retry': retry.get('idempotente') is True and retry.get('id') == first.get('id'),
            'trigger_consistency_rate': round((total-inconsistent)/total, 4),
            'semantic_false_positive_rate': None,
            'semantic_false_positive_status': 'REQUIRES_HUMAN_LABELING',
            'stg_touched': False,
            'prod_touched': False,
          }
          Path('artifacts/document-demand-ocr-canary-dev/canary-report.json').write_text(
            json.dumps(report, ensure_ascii=False, indent=2), encoding='utf-8'
          )
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Validar resultado do canário
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          report=json.loads(Path('artifacts/document-demand-ocr-canary-dev/canary-report.json').read_text(encoding='utf-8'))
          assert report['environment'] in {'desenvolvimento', 'development'}, report
          assert report['readiness']['enabled'] is True, report
          assert report['readiness']['ready'] is True, report
          assert report['status'] == 'AGUARDANDO_REVISAO_HUMANA', report
          assert report['extraction_success'] is True, report
          assert report['candidates_total'] > 0, report
          assert report['human_review_required_rate'] == 1.0, report
          assert report['automatic_incorporation'] is False, report
          assert report['idempotent_retry'] is True, report
          assert report['stg_touched'] is False and report['prod_touched'] is False, report
          print(json.dumps(report, ensure_ascii=False, indent=2))
          PY

      - name: Publicar resumo
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${REPORT_DIR}"
          {
            echo '# Canário OCR documental — DEV'
            echo
            echo "- Run: ${GITHUB_RUN_ID}/${GITHUB_RUN_ATTEMPT}"
            echo '- STG tocado: não'
            echo '- PROD tocado: não'
            if [ -f "${REPORT_DIR}/canary-report.json" ]; then
              python - <<'PY'
          import json
          p=json.load(open('artifacts/document-demand-ocr-canary-dev/canary-report.json', encoding='utf-8'))
          print(f"- Ambiente: {p['environment']}")
          print(f"- Status: {p['status']}")
          print(f"- Páginas: {p['sample']['pages']}")
          print(f"- SHA-256: {p['sample']['sha256']}")
          print(f"- Candidatos: {p['candidates_total']}")
          print(f"- Candidatos com página: {p['candidate_with_page_rate']:.0%}")
          print(f"- Revisão humana: {p['human_review_required_rate']:.0%}")
          print(f"- Reenvio idempotente: {'sim' if p['idempotent_retry'] else 'não'}")
          print(f"- Consistência dos gatilhos: {p['trigger_consistency_rate']:.0%}")
          print('- Falso positivo semântico: requer rotulagem humana; não inferido automaticamente.')
          PY
            fi
          } | tee "${REPORT_DIR}/summary.md"

      - name: Publicar evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: document-demand-ocr-canary-dev
          path: artifacts/document-demand-ocr-canary-dev
          if-no-files-found: error
          retention-days: 30
