name: Executive Final Sync History Public Smoke Trend Public

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      environment:
        description: "Ambiente alvo"
        required: true
        type: choice
        options: [dev, stg, prod]
      base_url:
        description: "URL pública base do Ops Dashboard"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: executive-final-sync-history-public-smoke-trend-public-${{ github.event.deployment.environment || inputs.environment }}
  cancel-in-progress: true

jobs:
  smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'deployment_status' &&
        github.event.deployment_status.state == 'success' &&
        contains(fromJSON('["dev","development","stg","staging","prod","production"]'), github.event.deployment.environment)
      )
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      TARGET_ENVIRONMENT: ${{ github.event.deployment.environment || inputs.environment }}
      TARGET_URL: ${{ github.event.deployment_status.environment_url || inputs.base_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate implementation
        run: |
          set -euo pipefail
          python -m py_compile scripts/smoke_executive_final_sync_history_public_smoke_trend.py
          python -m unittest tests/test_smoke_executive_final_sync_history_public_smoke_trend.py

      - name: Resolve governed target
        run: |
          set -euo pipefail
          test -n "$TARGET_ENVIRONMENT"
          case "$TARGET_ENVIRONMENT" in
            dev|development)
              mkdir -p artifacts/pc24x7-dev
              node scripts/resolve_pc24x7_dev_locator.mjs --output artifacts/pc24x7-dev/signed-locator.json >/dev/null
              resolved_url="$(python -c 'import json; from pathlib import Path; print(json.loads(Path("artifacts/pc24x7-dev/signed-locator.json").read_text(encoding="utf-8"))["selected_url"])')"
              ;;
            stg|staging)
              test -n "$TARGET_URL" || {
                echo "::error::Ambiente $TARGET_ENVIRONMENT não possui runtime canônico publicado; fallback Fly.io é proibido."
                exit 2
              }
              resolved_url="$TARGET_URL"
              ;;
            prod|production)
              test -n "$TARGET_URL" || {
                echo "::error::Ambiente $TARGET_ENVIRONMENT não possui runtime canônico publicado; fallback Fly.io é proibido."
                exit 2
              }
              resolved_url="$TARGET_URL"
              ;;
            *) echo "Ambiente não governado: $TARGET_ENVIRONMENT" >&2; exit 1 ;;
          esac
          case "$resolved_url" in
            https://*.fly.dev|https://*.fly.dev/*)
              echo "::error::Runtime legado Fly.io rejeitado: $resolved_url"
              exit 2
              ;;
          esac
          test -n "$resolved_url"
          echo "TARGET_URL=$resolved_url" >> "$GITHUB_ENV"
          echo "Destino governado resolvido: $resolved_url"

      - name: Smoke synchronized public trend
        run: |
          set +e
          python scripts/smoke_executive_final_sync_history_public_smoke_trend.py \
            --base-url "$TARGET_URL" \
            --environment "$TARGET_ENVIRONMENT" \
            --output "artifacts/executive-final-sync-history-public-smoke-trend/${TARGET_ENVIRONMENT}.json"
          smoke_rc=$?
          set -e
          if [ "$smoke_rc" -ne 0 ]; then
            echo "::warning::Smoke público report-only detectou divergência em ${TARGET_ENVIRONMENT}; evidência será publicada para revisão humana."
          fi
          echo "SMOKE_RESULT_CODE=$smoke_rc" >> "$GITHUB_ENV"

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: executive-final-sync-history-public-smoke-trend-${{ env.TARGET_ENVIRONMENT }}
          path: artifacts/executive-final-sync-history-public-smoke-trend
          if-no-files-found: error
          retention-days: 90

      - name: Summary
        if: always()
        run: |
          {
            echo "# Executive Final Sync History Public Smoke Trend"
            echo ""
            echo "- Ambiente: ${TARGET_ENVIRONMENT}"
            echo "- URL: ${TARGET_URL}"
            echo "- Resultado técnico: ${SMOKE_RESULT_CODE:-não executado}"
            echo "- Sincronização: Estado Único + contrato + Ops Dashboard"
            echo "- Artefato: report-only para decisão executiva"
            echo "- Resultado técnico: obrigatório; falha torna o workflow vermelho"
            echo "- Aprovação humana: obrigatória"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce public smoke result
        if: always()
        run: |
          set -euo pipefail
          test "${SMOKE_RESULT_CODE:-1}" = "0" || {
            echo "::error::Smoke público falhou; sucesso verde não pode mascarar divergência funcional."
            exit 1
          }
