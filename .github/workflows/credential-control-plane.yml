name: Credential Control Plane

on:
  pull_request:
    paths:
      - "config/credential-control-plane.json"
      - "infra/fly-environments.json"
      - "scripts/validate_credential_control_plane.py"
      - "tests/test_validate_credential_control_plane.py"
      - ".github/workflows/credential-control-plane.yml"
  push:
    branches: [main]
    paths:
      - "config/credential-control-plane.json"
      - "infra/fly-environments.json"
      - "scripts/validate_credential_control_plane.py"
      - "tests/test_validate_credential_control_plane.py"
      - ".github/workflows/credential-control-plane.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validar catálogo e bindings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Instalar dependências de teste
        run: python -m pip install --disable-pip-version-check --no-cache-dir "pytest==9.0.3"

      - name: Validar control plane
        run: python scripts/validate_credential_control_plane.py

      - name: Executar testes focados
        run: python -m pytest tests/test_validate_credential_control_plane.py -q
