name: Generate Current SHA Stability Patch

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/evaluate_current_sha_workflow_stability.py"
      - "scripts/patch_governed_merge_queue_sha_stability.py"
      - "governance/merge/current-sha-required-workflows.json"
      - "tests/test_evaluate_current_sha_workflow_stability.py"
      - "tests/test_patch_governed_merge_queue_sha_stability.py"
      - "tests/test_governed_merge_queue_current_sha_stability_contract.py"
      - ".github/workflows/generate-current-sha-stability-patch.yml"

permissions:
  contents: write

concurrency:
  group: generate-current-sha-stability-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  generate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pytest PyYAML

      - name: Run evaluator and patcher tests
        run: |
          python -m pytest -q \
            tests/test_evaluate_current_sha_workflow_stability.py \
            tests/test_patch_governed_merge_queue_sha_stability.py

      - name: Generate final governed merge queue workflow
        run: |
          mkdir -p generated/.github/workflows
          python scripts/patch_governed_merge_queue_sha_stability.py \
            --workflow .github/workflows/governed-merge-queue.yml \
            --output generated/.github/workflows/governed-merge-queue.yml

      - name: Validate generated YAML and final contract
        env:
          GOVERNED_MERGE_QUEUE_WORKFLOW_PATH: generated/.github/workflows/governed-merge-queue.yml
        run: |
          python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("generated/.github/workflows/governed-merge-queue.yml")
          payload = yaml.safe_load(path.read_text(encoding="utf-8"))
          assert isinstance(payload, dict)
          assert "jobs" in payload
          PY
          python -m pytest -q tests/test_governed_merge_queue_current_sha_stability_contract.py

      - name: Assemble immutable final bundle
        run: |
          mkdir -p final-bundle/scripts final-bundle/governance/merge final-bundle/tests final-bundle/.github/workflows
          cp generated/.github/workflows/governed-merge-queue.yml final-bundle/.github/workflows/
          cp scripts/evaluate_current_sha_workflow_stability.py final-bundle/scripts/
          cp governance/merge/current-sha-required-workflows.json final-bundle/governance/merge/
          cp tests/test_evaluate_current_sha_workflow_stability.py final-bundle/tests/
          cp tests/test_governed_merge_queue_current_sha_stability_contract.py final-bundle/tests/
          find final-bundle -type f -print0 | sort -z | xargs -0 sha256sum > final-bundle/SHA256SUMS

      - name: Publish validated final branch
        env:
          FINAL_BRANCH: agent/current-sha-stability-gate-final-v1
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/current-sha-stability-final
          cp -a final-bundle /tmp/current-sha-stability-final

          git fetch --no-tags origin "+refs/heads/main:refs/remotes/origin/main"
          git checkout --detach origin/main

          mkdir -p .github/workflows governance/merge scripts tests
          cp /tmp/current-sha-stability-final/.github/workflows/governed-merge-queue.yml .github/workflows/
          cp /tmp/current-sha-stability-final/governance/merge/current-sha-required-workflows.json governance/merge/
          cp /tmp/current-sha-stability-final/scripts/evaluate_current_sha_workflow_stability.py scripts/
          cp /tmp/current-sha-stability-final/tests/test_evaluate_current_sha_workflow_stability.py tests/
          cp /tmp/current-sha-stability-final/tests/test_governed_merge_queue_current_sha_stability_contract.py tests/

          python -m pytest -q \
            tests/test_evaluate_current_sha_workflow_stability.py \
            tests/test_governed_merge_queue_current_sha_stability_contract.py

          git add \
            .github/workflows/governed-merge-queue.yml \
            governance/merge/current-sha-required-workflows.json \
            scripts/evaluate_current_sha_workflow_stability.py \
            tests/test_evaluate_current_sha_workflow_stability.py \
            tests/test_governed_merge_queue_current_sha_stability_contract.py

          python - <<'PY'
          import subprocess
          expected = {
              '.github/workflows/governed-merge-queue.yml',
              'governance/merge/current-sha-required-workflows.json',
              'scripts/evaluate_current_sha_workflow_stability.py',
              'tests/test_evaluate_current_sha_workflow_stability.py',
              'tests/test_governed_merge_queue_current_sha_stability_contract.py',
          }
          actual = set(subprocess.check_output(['git', 'diff', '--cached', '--name-only'], text=True).splitlines())
          if actual != expected:
              raise SystemExit(f'Unexpected final diff: {sorted(actual)}')
          PY

          git config user.name "reqsys-current-sha-stability"
          git config user.email "actions@github.com"
          git commit -m "fix(ci): bloquear merge até estabilização do SHA atual"
          git push origin "HEAD:refs/heads/${FINAL_BRANCH}"

      - name: Publish summary
        run: |
          {
            echo "## Current SHA Stability Patch"
            echo ""
            echo "- Patcher tests: **green**"
            echo "- Evaluator tests: **green**"
            echo "- Generated workflow YAML: **valid**"
            echo "- Final contract: **green**"
            echo "- Hidden workflow included: **true**"
            echo "- Final branch: **agent/current-sha-stability-gate-final-v1**"
            echo "- Force push: **false**"
            echo "- Branch protection reduced: **false**"
            echo "- Production touched: **false**"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: current-sha-stability-final-bundle
          path: final-bundle/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
