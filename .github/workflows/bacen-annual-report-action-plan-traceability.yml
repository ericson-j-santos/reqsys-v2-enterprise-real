name: BACEN Annual Report Action Plan Traceability

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_annual_report_action_plan_traceability.py"
      - ".github/workflows/bacen-annual-report-action-plan-traceability.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_annual_report_action_plan_traceability.py"
      - ".github/workflows/bacen-annual-report-action-plan-traceability.yml"
  schedule:
    - cron: "41 9 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bacen-annual-report-action-plan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-08 Action Plan Traceability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_annual_report_action_plan_traceability.py

      - name: Generate traceability evidence
        run: |
          python scripts/generate_bacen_annual_report_action_plan_traceability.py \
            --report governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md \
            --matrix governance/bacen/BACEN-CONTROL-MATRIX.yaml \
            --output artifacts/bacen/bacen-08-annual-report-action-plan-traceability.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-08-annual-report-action-plan-traceability.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          summary = evidence["summary"]
          assert evidence["control_id"] == "BACEN-08"
          assert evidence["action_plan_section_present"] is True
          assert summary["target_controls"] > 0
          assert summary["traceable_controls"] + summary["pending_controls"] == summary["target_controls"]
          assert evidence["automatic_blocking"] is False
          assert evidence["control_status"] in {"partial", "implemented"}
          assert len(evidence["report_sha256"]) == 64
          assert len(evidence["matrix_sha256"]) == 64
          assert evidence["production_touched"] is False
          print("BACEN-08 action plan traceability evidence: valid")
          PY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-08-annual-report-action-plan-traceability
          path: artifacts/bacen/bacen-08-annual-report-action-plan-traceability.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-08-annual-report-action-plan-traceability.json")
          print("## BACEN-08 — Rastreabilidade do plano de ação")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          summary = evidence["summary"]
          print(f"\n- Controles alvo: **{summary['target_controls']}**")
          print(f"- Controles rastreáveis: **{summary['traceable_controls']}**")
          print(f"- Controles pendentes: **{summary['pending_controls']}**")
          print(f"- Bloco estruturado presente: **{evidence['structured_block_present']}**")
          print(f"- Bloqueio estrutural: **{evidence['automatic_blocking']}**")
          print("- Produção acessada: **false**")
          PY
