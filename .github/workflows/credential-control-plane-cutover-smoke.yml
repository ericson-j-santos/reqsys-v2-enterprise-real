name: Credential Control Plane Cutover Smoke

on:
  workflow_dispatch:
    inputs:
      target:
        description: "Credencial a validar sem mutação"
        required: true
        type: choice
        default: gitlab
        options:
          - gitlab
          - fly-api-dev
          - fly-app-dev
          - fly-api-hml
          - fly-app-hml
          - fly-api-prod
          - fly-app-prod

permissions:
  contents: read
  id-token: write

concurrency:
  group: credential-control-plane-cutover-smoke-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  gitlab:
    if: inputs.target == 'gitlab'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      GITLAB_MIRROR_REPOSITORY: https://gitlab.com/ericson-j-santos/reqsys-v2-enterprise-real.git
      CORRELATION_ID: credential-cutover-smoke-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolver token GitLab
        uses: ./.github/actions/resolve-managed-credential
        with:
          credential-id: gitlab-main-mirror
          consumer: github-actions:gitlab-main-mirror
          export-env: GITLAB_MIRROR_TOKEN
          vault-name: ${{ vars.REQSYS_KEY_VAULT_NAME }}
          azure-client-id: ${{ vars.CCP_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          evidence-path: audit/cutover-smoke-gitlab.json
      - name: Validar GitLab sem push
        run: python scripts/sync_gitlab_mirror.py --dry-run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-cutover-smoke-gitlab-${{ github.run_id }}
          path: |
            audit/cutover-smoke-gitlab.json
            audit/gitlab-mirror-sync.json
          if-no-files-found: warn
          retention-days: 90

  fly:
    if: startsWith(inputs.target, 'fly-')
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: ${{ contains(inputs.target, '-dev') && 'dev' || contains(inputs.target, '-hml') && 'staging' || 'production' }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolver alvo Fly
        id: target
        shell: bash
        env:
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            fly-api-dev)
              echo "credential_id=fly-api-dev-deploy" >> "$GITHUB_OUTPUT"
              echo "consumer=github-actions:fly-dev" >> "$GITHUB_OUTPUT"
              echo "app=reqsys-api-dev" >> "$GITHUB_OUTPUT"
              ;;
            fly-app-dev)
              echo "credential_id=fly-app-dev-deploy" >> "$GITHUB_OUTPUT"
              echo "consumer=github-actions:fly-dev" >> "$GITHUB_OUTPUT"
              echo "app=reqsys-app-dev" >> "$GITHUB_OUTPUT"
              ;;
            fly-api-hml)
              echo "credential_id=fly-api-hml-deploy" >> "$GITHUB_OUTPUT"
              echo "consumer=github-actions:fly-staging" >> "$GITHUB_OUTPUT"
              echo "app=reqsys-api-stg" >> "$GITHUB_OUTPUT"
              ;;
            fly-app-hml)
              echo "credential_id=fly-app-hml-deploy" >> "$GITHUB_OUTPUT"
              echo "consumer=github-actions:fly-staging" >> "$GITHUB_OUTPUT"
              echo "app=reqsys-app-stg" >> "$GITHUB_OUTPUT"
              ;;
            fly-api-prod)
              echo "credential_id=fly-api-prod-deploy" >> "$GITHUB_OUTPUT"
              echo "consumer=github-actions:fly-production" >> "$GITHUB_OUTPUT"
              echo "app=reqsys-api" >> "$GITHUB_OUTPUT"
              ;;
            fly-app-prod)
              echo "credential_id=fly-app-prod-deploy" >> "$GITHUB_OUTPUT"
              echo "consumer=github-actions:fly-production" >> "$GITHUB_OUTPUT"
              echo "app=reqsys-app" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "Alvo inválido" >&2; exit 2 ;;
          esac
      - name: Resolver token Fly
        uses: ./.github/actions/resolve-managed-credential
        with:
          credential-id: ${{ steps.target.outputs.credential_id }}
          consumer: ${{ steps.target.outputs.consumer }}
          export-env: FLY_API_TOKEN
          vault-name: ${{ vars.REQSYS_KEY_VAULT_NAME }}
          azure-client-id: ${{ vars.CCP_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          evidence-path: audit/cutover-smoke-${{ inputs.target }}.json
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Validar token Fly sem mutação
        env:
          APP: ${{ steps.target.outputs.app }}
        run: |
          set -euo pipefail
          flyctl status --app "$APP" --json >/dev/null
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: credential-cutover-smoke-${{ inputs.target }}-${{ github.run_id }}
          path: audit/cutover-smoke-${{ inputs.target }}.json
          if-no-files-found: warn
          retention-days: 90
