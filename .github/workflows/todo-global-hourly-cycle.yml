name: TODO Global Hourly Cycle

on:
  schedule:
    - cron: "3 * * * *"
  push:
    branches: [main]
    paths:
      - '.github/workflows/todo-global-hourly-cycle.yml'
      - 'backend/app/api/todo_global_adapter.py'
      - 'backend/app/main.py'
      - 'docker-compose.pc24x7-todo-runtime.yml'
      - 'infra/nginx/default.dev.conf'
      - 'infra/nginx/default.pc24x7-public-dev.conf'
      - 'runtime/**'
      - 'scripts/reconcile_pc24x7_todo_runtime.py'
      - 'scripts/todo_global_hourly_cycle.py'
      - 'scripts/todo_producer_keyvault_credit_gate.py'
      - 'tests/test_todo_global_hourly_cycle.py'
      - 'tests/test_todo_producer_keyvault_credit_gate.py'
      - 'tests/test_todo_producer_keyvault_credit_gate_workflow.py'
      - '.sdd/specs/todo-producer-keyvault-credit-gate.requirements.md'
      - '.sdd/specs/todo-producer-keyvault-credit-gate.spec.json'
  pull_request:
    paths:
      - '.github/workflows/todo-global-hourly-cycle.yml'
      - 'backend/app/api/todo_global_adapter.py'
      - 'backend/app/main.py'
      - 'backend/tests/test_todo_global_adapter.py'
      - 'docker-compose.pc24x7-todo-runtime.yml'
      - 'infra/nginx/default.dev.conf'
      - 'infra/nginx/default.pc24x7-public-dev.conf'
      - 'runtime/**'
      - 'scripts/reconcile_pc24x7_todo_runtime.py'
      - 'scripts/todo_global_hourly_cycle.py'
      - 'tests/test_pc24x7_todo_runtime_reconcile.py'
      - 'tests/test_todo_global_hourly_cycle.py'
      - 'scripts/todo_producer_keyvault_credit_gate.py'
      - 'tests/test_todo_producer_keyvault_credit_gate.py'
      - 'tests/test_todo_producer_keyvault_credit_gate_workflow.py'
      - '.sdd/specs/todo-producer-keyvault-credit-gate.requirements.md'
      - '.sdd/specs/todo-producer-keyvault-credit-gate.spec.json'
  workflow_dispatch:
    inputs:
      operation:
        description: "Operação DEV governada"
        required: true
        default: "cycle"
        type: choice
        options:
          - cycle
          - reconcile-runtime
          - producer-credit-gated
      authorization_comment_id:
        description: "ID de comentário validado no Gateway #1705, apenas modo producer-credit-gated"
        required: false
        default: ""
        type: string
      timeout_seconds:
        description: "Limite para aguardar o estado terminal"
        required: false
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  group: todo-global-hourly-cycle-${{ (github.event_name == 'workflow_dispatch' || github.event_name == 'schedule') && 'runtime' || format('{0}-{1}', github.event_name, github.ref) }}
  cancel-in-progress: false

jobs:
  contract:
    name: Validar contrato TODO Global / Runtime
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Validar sintaxe e contratos focados
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.0.3 PyYAML==6.0.2
          python -m py_compile scripts/reconcile_pc24x7_todo_runtime.py scripts/todo_global_hourly_cycle.py scripts/todo_producer_keyvault_credit_gate.py
          python -m pytest -q tests/test_pc24x7_todo_runtime_reconcile.py tests/test_todo_global_hourly_cycle.py tests/test_todo_producer_keyvault_credit_gate.py tests/test_todo_producer_keyvault_credit_gate_workflow.py

  reconcile-runtime:
    name: Materializar TODO Runtime no Desktop PC24x7
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reconcile-runtime' && github.actor == 'ericson-j-santos'
    needs: contract
    runs-on: [self-hosted, Windows, X64, reqsys-dev, reqsys-dev-pool-v1]
    environment: development
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      CORRELATION_ID: todo-runtime-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts/pc24x7-todo-runtime/evidence.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed runner capability preflight
        uses: ./.github/actions/reqsys-dev-runner-preflight
        with:
          profile: runtime
          repository-path: .

      - name: Validar configuração governada
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('REQSYS_KEY_VAULT_NAME','CCP_AZURE_CLIENT_ID','CCP_AZURE_TENANT_ID','CCP_AZURE_SUBSCRIPTION_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name missing"
            }
          }

      - name: Login Azure por OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Bloquear reconciliação sem prova autoritativa de custo literal zero
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -B scripts/todo_producer_keyvault_credit_gate.py runtime-cost
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preparar dependências do reconciliador
        shell: powershell
        run: |
          python -m pip install --disable-pip-version-check azure-identity azure-keyvault-secrets
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Reconciliar runtime, autenticação e E2E físico
        shell: powershell
        env:
          COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/reconcile_pc24x7_todo_runtime.py --confirm RECONCILE-PC24X7-TODO-RUNTIME-DEV --environment dev --expected-sha "${{ github.sha }}" --vault-name "$env:REQSYS_KEY_VAULT_NAME" --run-id "${{ github.run_id }}" --run-attempt "${{ github.run_attempt }}" --correlation-id "$env:CORRELATION_ID" --evidence-file "$env:EVIDENCE_FILE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar evidência física sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pc24x7-todo-runtime-${{ github.run_id }}
          path: artifacts/pc24x7-todo-runtime/evidence.json
          if-no-files-found: error
          retention-days: 30

  public-e2e:
    name: E2E público TODO Runtime + Notion
    if: github.event_name == 'workflow_dispatch' && inputs.operation == 'reconcile-runtime' && github.actor == 'ericson-j-santos'
    needs: [contract, reconcile-runtime]
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Login Azure por OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Resolver locator DEV assinado
        id: locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pc24x7-todo-runtime
          node scripts/resolve_pc24x7_dev_locator.mjs --self-test
          node scripts/resolve_pc24x7_dev_locator.mjs --output artifacts/pc24x7-todo-runtime/locator.json

      - name: Ler e validar token de produtor antes de exportar
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/todo_producer_keyvault_credit_gate.py export-token

      - name: Validar same-SHA público
        shell: bash
        env:
          BASE_URL: ${{ steps.locator.outputs.base_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          base = os.environ['BASE_URL'].rstrip('/')
          expected = os.environ['EXPECTED_SHA'].lower()

          def observed(path):
              with urlopen(Request(base + path, headers={'Accept': 'application/json'}), timeout=20) as response:
                  payload = json.loads(response.read(262144).decode('utf-8'))
              data = payload.get('data', payload)
              return str(data.get('build_sha') or '').lower()

          if observed('/api/runtime/build-info') != expected:
              raise SystemExit('public_api_sha_mismatch')
          if observed('/runtime-core/api/runtime/build-info') != expected:
              raise SystemExit('todo_runtime_sha_mismatch')
          PY

      - name: Executar ciclo público com replay e leitura independente
        shell: bash
        env:
          RUNTIME_BASE: ${{ steps.locator.outputs.base_url }}/runtime-core
        run: |
          set -euo pipefail
          python scripts/todo_global_hourly_cycle.py             --runtime-url "$RUNTIME_BASE"             --run-id "${{ github.run_id }}"             --run-attempt "${{ github.run_attempt }}"             --timeout-seconds 180             --poll-seconds 5             --output artifacts/pc24x7-todo-runtime/public-e2e.json

      - name: Publicar evidência pública
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pc24x7-todo-runtime-public-e2e-${{ github.run_id }}
          path: artifacts/pc24x7-todo-runtime/
          if-no-files-found: error
          retention-days: 30

  cycle:
    name: Reconciliar TODO Global com E2E e replay
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.operation == 'cycle' && github.actor == 'ericson-j-santos')
    needs: contract
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 12
    permissions:
      contents: read
      id-token: write
    env:
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      CORRELATION_ID: todo-global-hourly-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "20"

      - name: Login Azure por OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Resolver runtime PC24x7 DEV por locator assinado
        id: locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/todo-global-hourly
          node scripts/resolve_pc24x7_dev_locator.mjs --self-test
          node scripts/resolve_pc24x7_dev_locator.mjs --output artifacts/todo-global-hourly/locator.json

      - name: Exportar superfície TODO Runtime
        shell: bash
        env:
          RESOLVED_BASE_URL: ${{ steps.locator.outputs.base_url }}
        run: |
          set -euo pipefail
          test -n "$RESOLVED_BASE_URL"
          case "$RESOLVED_BASE_URL" in
            https://*) ;;
            *) echo "::error::Locator DEV não retornou HTTPS."; exit 1 ;;
          esac
          printf 'TODO_GLOBAL_RUNTIME_URL=%s/runtime-core\n' "${RESOLVED_BASE_URL%/}" >> "$GITHUB_ENV"

      - name: Bloquear Key Vault sem prova autoritativa de custo literal zero
        shell: bash
        run: |
          set -euo pipefail
          python3 -B scripts/todo_producer_keyvault_credit_gate.py cycle-secret

      - name: Validar runtime público no SHA corrente
        shell: bash
        env:
          BASE_URL: ${{ steps.locator.outputs.base_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          base = os.environ["BASE_URL"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"].lower()

          def build_sha(path):
              request = Request(base + path, headers={"Accept": "application/json", "User-Agent": "TODOGlobalHourly/1.0"})
              with urlopen(request, timeout=20) as response:
                  payload = json.loads(response.read(262144).decode("utf-8"))
              data = payload.get("data", payload)
              return str(data.get("build_sha") or "").lower()

          if build_sha("/api/runtime/build-info") != expected:
              raise SystemExit("reqsys_public_api_sha_mismatch")
          if build_sha("/runtime-core/api/runtime/build-info") != expected:
              raise SystemExit("todo_runtime_public_sha_mismatch")
          PY

      - name: Executar reconciliação e aguardar estado terminal
        shell: bash
        run: |
          set -euo pipefail
          python scripts/todo_global_hourly_cycle.py             --runtime-url "$TODO_GLOBAL_RUNTIME_URL"             --run-id "$GITHUB_RUN_ID"             --run-attempt "$GITHUB_RUN_ATTEMPT"             --timeout-seconds "${{ inputs.timeout_seconds || '300' }}"             --output artifacts/todo-global-hourly/evidence.json

      - name: Publicar resumo sanitizado
        if: always()
        shell: bash
        run: |
          {
            printf '%s\n' "## TODO Global Hourly Cycle"
            printf '%s\n' "- SHA: \`$GITHUB_SHA\`"
            printf '%s\n' "- Correlation ID: \`$CORRELATION_ID\`"
            if [[ -f artifacts/todo-global-hourly/evidence.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/todo-global-hourly/evidence.json").read_text(encoding="utf-8"))
          print(f"- Estado terminal: `{data['terminal_status']}`")
          print(f"- Leitura independente: `{data['readback_verified']}`")
          print(f"- Replay sem segundo job: `{data['replay_duplicate_event']}`")
          PY
            else
              printf '%s\n' '- Estado: `BLOQUEADO/PARCIAL`'
              printf '%s\n' '- Evidência terminal não produzida; consulte o log sem presumir sucesso.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Preservar evidência
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: todo-global-hourly-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/todo-global-hourly/
          if-no-files-found: warn
          retention-days: 30

  credential-dev:
    name: Comprovar limite Azure e bloquear sem custo literal zero
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.operation == 'producer-credit-gated' &&
      github.actor == 'github-actions[bot]' &&
      github.ref == 'refs/heads/main'
    needs: contract
    runs-on: ubuntu-24.04
    environment: development
    timeout-minutes: 8
    permissions:
      contents: read
      issues: read
      id-token: write
    env:
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      AZURE_CORE_OUTPUT: none
    steps:
      - name: Checkout imutável da main autorizada
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Login Azure OIDC DEV
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}
      - name: Validar autorização e bloquear sem prova literal-zero
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/todo-producer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 -B scripts/todo_producer_keyvault_credit_gate.py cost --receipt "$proof"
      - name: Recuperar/provisionar somente após prova literal-zero
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/todo-producer-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT.json"
          python3 -B scripts/todo_producer_keyvault_credit_gate.py secret --receipt "$proof"
      - name: Publicar status sanitizado sem credenciais
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '## TODO Producer Key Vault Credit Gate — DEV'
            echo "- Run: $GITHUB_RUN_ID"
            echo "- SHA: $GITHUB_SHA"
            echo '- Hard stop: spendingLimit On não comprova custo literal zero'
            echo '- Data plane: bloqueado sem prova autoritativa de custo literal zero'
            echo '- Readback: metadados somente; binding ao runtime não validado'
            echo '- Docker/deploy/produção/RBAC: não executados'
            echo '- TODO-38 continua EM ANDAMENTO / E2E PARCIAL'
          } >> "$GITHUB_STEP_SUMMARY"
