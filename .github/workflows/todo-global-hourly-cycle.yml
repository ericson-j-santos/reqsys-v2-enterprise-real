name: TODO Global Hourly Cycle

on:
  schedule:
    - cron: "3 * * * *"
  workflow_dispatch:
    inputs:
      timeout_seconds:
        description: "Limite para aguardar o estado terminal"
        required: false
        default: "300"
        type: string

permissions:
  contents: read

concurrency:
  group: todo-global-hourly-cycle
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconciliar TODO Global com E2E e replay
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TODO_GLOBAL_RUNTIME_URL: ${{ vars.TODO_GLOBAL_RUNTIME_URL }}
      TODO_GLOBAL_RUNTIME_TOKEN: ${{ secrets.TODO_GLOBAL_RUNTIME_TOKEN }}
      CORRELATION_ID: todo-global-hourly-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout do SHA agendado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar contrato local e controle negativo
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==9.0.3
          python -m pytest -q tests/test_todo_global_hourly_cycle.py

      - name: Validar configuração sem expor segredo
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${TODO_GLOBAL_RUNTIME_URL}" ]]; then
            echo "::error::A variável TODO_GLOBAL_RUNTIME_URL não está configurada."
            exit 1
          fi
          case "${TODO_GLOBAL_RUNTIME_URL}" in
            https://*) ;;
            *)
              echo "::error::TODO_GLOBAL_RUNTIME_URL deve usar HTTPS."
              exit 1
              ;;
          esac

      - name: Executar reconciliação e aguardar estado terminal
        shell: bash
        run: |
          set -euo pipefail
          python scripts/todo_global_hourly_cycle.py             --runtime-url "${TODO_GLOBAL_RUNTIME_URL}"             --run-id "${GITHUB_RUN_ID}"             --run-attempt "${GITHUB_RUN_ATTEMPT}"             --timeout-seconds "${{ inputs.timeout_seconds || '300' }}"             --output artifacts/todo-global-hourly/evidence.json

      - name: Publicar resumo sanitizado
        if: always()
        shell: bash
        run: |
          {
            echo "## TODO Global Hourly Cycle"
            echo "- SHA: \`${GITHUB_SHA}\`"
            echo "- Correlation ID: \`${CORRELATION_ID}\`"
            if [[ -f artifacts/todo-global-hourly/evidence.json ]]; then
              python - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path("artifacts/todo-global-hourly/evidence.json").read_text(encoding="utf-8"))
          print(f"- Estado terminal: \`{data['terminal_status']}\`")
          print(f"- Leitura independente: \`{data['readback_verified']}\`")
          print(f"- Replay sem segundo job: \`{data['replay_duplicate_event']}\`")
          PY
            else
              echo "- Estado: \`BLOQUEADO/PARCIAL\`"
              echo "- Evidência terminal não produzida; consulte o log sem presumir sucesso."
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Preservar evidência
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: todo-global-hourly-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/todo-global-hourly/evidence.json
          if-no-files-found: warn
          retention-days: 30
