name: One-shot ReqSys Data Platform Main Protection PC24x7

on:
  push:
    branches:
      - ops/data-main-protection-pc24x7-20260923

permissions:
  contents: read

concurrency:
  group: reqsys-data-platform-main-protection-pc24x7-once
  cancel-in-progress: false

jobs:
  protect-main:
    name: Protect reqsys-data-platform/main via PC24x7 Risk3
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 12
    env:
      TARGET_REPO: C:\dev\reqsys-v2-enterprise-real
      CORRELATION_ID: data-main-protection-pc24x7-${{ github.run_id }}-${{ github.run_attempt }}
      ACTION_ID: reqsys.data-platform-main-protection.dev
      ACTION_SCOPE: repo://ericson-j-santos/reqsys-data-platform/branch/main
      EVIDENCE_REL: artifacts/reqsys-data-platform-main-protection-pc24x7/evidence.json
      EXPECTED_TARGET_SHA: a992d15f6fc4a642ee417ffd93576cccba342c37

    steps:
      - name: Checkout operational branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical rules at validated SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ae9b681b6cbe5c6e0c6c82b187b3245c0749118f
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Validate exact PC24x7 host
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME -ne "DESKTOP-PDQK954") {
            throw "UNEXPECTED_HOST: $env:COMPUTERNAME"
          }

      - name: Mandatory session bootstrap
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "data-protect-pc24x7",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/${{ github.ref_name }}"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT

      - name: Install exact temporary Risk3 authorization
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_reqsys_data_platform_main_protection_pc24x7_risk3.py `
              --enable `
              --ttl-minutes 30 `
              --confirm ENABLE-REQSYS-DATA-PLATFORM-MAIN-PROTECTION-PC24X7-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Apply protection through Owner Risk3 Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\owner_risk3_gateway.py"
          $riskArgs = @(
            "--action-id", $env:ACTION_ID,
            "--scope", $env:ACTION_SCOPE,
            "--cwd", $env:TARGET_PATH,
            "--timeout", "300",
            "--correlation-id", $env:CORRELATION_ID
          )
          & python $gateway @riskArgs
          exit $LASTEXITCODE

      - name: Remove temporary Risk3 authorization
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) {
            Write-Output "No session target path; no temporary authorization was installed."
            exit 0
          }
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_reqsys_data_platform_main_protection_pc24x7_risk3.py `
              --disable `
              --confirm DISABLE-REQSYS-DATA-PLATFORM-MAIN-PROTECTION-PC24X7-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Validate sanitized evidence
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_EVIDENCE" }
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path $evidence)) { throw "PROTECTION_EVIDENCE_MISSING" }
          $data = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
          if ($data.status -notin @("PROTECTION_APPLIED", "ALREADY_COMPLIANT")) { throw "PROTECTION_NOT_CONFIRMED" }
          if ($data.repository -ne "ericson-j-santos/reqsys-data-platform") { throw "TARGET_REPOSITORY_MISMATCH" }
          if ($data.branch -ne "main") { throw "TARGET_BRANCH_MISMATCH" }
          if ($data.target_sha -ne $env:EXPECTED_TARGET_SHA) { throw "TARGET_SHA_MISMATCH" }
          $expected = @("repository-hygiene", "backup-restore-e2e", "sqlite-postgres-e2e", "data-quality-e2e")
          foreach ($check in $expected) {
            if ($data.required_checks -notcontains $check) { throw "REQUIRED_CHECK_MISMATCH" }
          }
          if (-not $data.protected) { throw "BRANCH_NOT_PROTECTED" }
          if (-not $data.pull_request_required) { throw "PULL_REQUEST_NOT_REQUIRED" }
          if (-not $data.enforce_admins) { throw "ADMINS_NOT_ENFORCED" }
          if ($data.force_push_allowed) { throw "FORCE_PUSH_ALLOWED" }
          if ($data.deletion_allowed) { throw "BRANCH_DELETION_ALLOWED" }
          if ($data.secret_value_exposed) { throw "SECRET_EXPOSURE_REPORTED" }
          if (-not $data.independent_readback) { throw "INDEPENDENT_READBACK_MISSING" }

      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: reqsys-data-platform-main-protection-pc24x7-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\reqsys-data-platform-main-protection-pc24x7\evidence.json
          if-no-files-found: warn
          retention-days: 30
