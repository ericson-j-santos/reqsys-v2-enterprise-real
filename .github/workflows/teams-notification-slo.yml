name: Teams Notification SLO

on:
  schedule:
    - cron: "20 12 * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: teams-notification-slo
  cancel-in-progress: true

jobs:
  calculate-slo:
    name: Calcular SLO GitHub → Teams
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      SLO_TARGET: "99.0"
      WINDOW_DAYS: "30"
      WORKFLOW_FILE: "teams-commit-notification.yml"
      INCIDENT_TITLE: "[INCIDENT][TEAMS] SLO de notificações abaixo da meta"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Coletar execuções e calcular indicadores
        id: slo
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations
          
          import json
          import os
          import subprocess
          from datetime import datetime, timezone
          from pathlib import Path
          
          from scripts.teams_notification_slo_metrics import calculate_metrics
          
          repository = os.environ["GITHUB_REPOSITORY"]
          workflow_file = os.environ["WORKFLOW_FILE"]
          window_days = int(os.environ["WINDOW_DAYS"])
          target = float(os.environ["SLO_TARGET"])
          
          completed = subprocess.run(
              [
                  "gh", "api", "--paginate", "--slurp",
                  f"repos/{repository}/actions/workflows/{workflow_file}/runs?per_page=100",
              ],
              text=True,
              capture_output=True,
              check=False,
          )
          if completed.returncode != 0:
              raise SystemExit(completed.stderr or "Falha ao consultar execuções do workflow Teams")
          
          pages = json.loads(completed.stdout)
          report = calculate_metrics(
              pages,
              now=datetime.now(timezone.utc),
              window_days=window_days,
              target_percent=target,
          )
          output_dir = Path("teams-slo-evidence")
          output_dir.mkdir(exist_ok=True)
          (output_dir / "teams-notification-slo.json").write_text(
              json.dumps(report, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          
          markdown = [
              "# Teams Notification SLO — proxy de execução (entrega NÃO verificada)",
              "",
              f"- Estado de entrega: **{report['delivery_state']}** (sem readback independente)",
              f"- Estado do proxy de execução: **{report['workflow_execution_state']}**",
              f"- Janela: **{window_days} dias**",
              f"- Meta de execução (proxy, não entrega): **{target:.2f}%**",
              f"- Taxa de workflows candidatos bem-sucedidos: **{report['success_rate_percent']:.2f}%**",
              f"- Workflows candidatos (push/workflow_run): **{report['total_runs']}**",
              f"- Conclusões success: **{report['successful_runs']}**",
              f"- Conclusões não-success: **{report['non_successful_runs']}**",
              f"- Erros de workflow (failure + timed_out): **{report['workflow_execution_errors']}**",
              f"- Conclusões por categoria: `{json.dumps(report['workflow_conclusions'], sort_keys=True)}`",
              f"- Execuções excluídas da amostra candidata: **{report['excluded_non_candidate_runs']}**",
              f"- Watchdog locator schedule: **{report['locator_watch']['total_runs']}**",
              f"- Orçamento restante do proxy (não entrega): **{report['remaining_error_budget']}**",
              f"- Falhas consecutivas do proxy: **{report['consecutive_failures']}**",
              f"- Duração média do proxy: **{report['mean_duration_seconds']:.2f}s**",
              "",
              "A conclusão dos workflows não identifica tentativa, aceitação nem leitura de mensagens.",
              "Sem confirmação independente por commit/correlation_id, o SLO de entrega permanece indeterminado.",
          ]
          (output_dir / "teams-notification-slo.md").write_text(
              "\n".join(markdown) + "\n", encoding="utf-8"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              fields = {
                  "state": report["state"],
                  "workflow_state": report["workflow_execution_state"],
                  "delivery_state": report["delivery_state"],
                  "delivery_verified": "false",
                  "success_rate": report["success_rate_percent"],
                  "total": report["total_runs"],
                  "failures": report["non_successful_runs"],
                  "workflow_errors": report["workflow_execution_errors"],
                  "remaining_budget": report["remaining_error_budget"],
                  "consecutive_failures": report["consecutive_failures"],
                  "excluded_runs": report["excluded_non_candidate_runs"],
                  "locator_watch_runs": report["locator_watch"]["total_runs"],
                  "conclusion_counts": json.dumps(report["workflow_conclusions"], sort_keys=True),
              }
              for key, value in fields.items():
                  output.write(f"{key}={value}\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write("\n".join(markdown) + "\n")
          PY

      - name: Publicar evidência SLO
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: teams-notification-slo-${{ github.run_id }}
          path: teams-slo-evidence/
          retention-days: 90

      - name: Abrir ou atualizar incidente de SLO
        if: steps.slo.outputs.workflow_state == 'breached' || steps.slo.outputs.delivery_state == 'unverified'
        shell: bash
        run: |
          existing=$(gh issue list --state open --search '"${{ env.INCIDENT_TITLE }}" in:title' --json number --jq '.[0].number // empty')
          body=$(cat <<EOF
          ## SLO GitHub → Teams — entrega sem verificação independente

          - Meta da execução (proxy): **${SLO_TARGET}%**
          - Sucesso do workflow candidato (não entrega): **${{ steps.slo.outputs.success_rate }}%**
          - Janela: **${WINDOW_DAYS} dias**
          - Execuções candidatas (push/workflow_run): **${{ steps.slo.outputs.total }}**
          - Conclusões não-success: **${{ steps.slo.outputs.failures }}**
          - Orçamento restante do proxy: **${{ steps.slo.outputs.remaining_budget }}**
          - Não-success consecutivos: **${{ steps.slo.outputs.consecutive_failures }}**
          - Evidência: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

          - Falhas reais de workflow (failure/timed_out): **${{ steps.slo.outputs.workflow_errors }}**
          - Watchdogs do locator excluídos: **${{ steps.slo.outputs.locator_watch_runs }}**
          - Classes detalhadas no artifact JSON: workflow_conclusions
          - Entrega confirmada no Teams: **não** (ainda sem recibo independente)

          Não fechar o incidente por CI verde ou pelo proxy de execução. A entrega depende de prova independente no Teams vinculada à mesma mensagem.
          EOF
          )
          if [[ -n "$existing" ]]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --title "${INCIDENT_TITLE}" --body "$body" --label incident
          fi

      - name: Manter incidente aberto sem recibo independente
        if: steps.slo.outputs.delivery_verified != 'true'
        run: |
          echo "::notice title=Teams sem readback::O proxy do GitHub não é prova de entrega. Incidente preservado para validação no Teams."

      - name: Aplicar gate de dados mínimos
        if: steps.slo.outputs.workflow_state == 'insufficient_data'
        run: |
          echo "::warning title=SLO sem amostra::Ainda não há execuções concluídas na janela de 30 dias."
