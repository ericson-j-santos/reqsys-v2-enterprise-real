name: Validar Painel de Ciclo ReqSys

on:
  pull_request:
    paths:
      - "docs/painel-ciclo-completo-reqsys.html"
      - "docs/ciclo-completo/**"
      - "scripts/validar_painel_ciclo.py"
      - "scripts/generate_cycle_dashboard_state.py"
      - "config/operational-dashboard-projects.json"
      - "tests/test_generate_cycle_dashboard_state.py"
      - "tests/test_validar_painel_ciclo.py"
      - ".sdd/specs/live-cycle-dashboard.*"
      - ".github/workflows/validar-painel-ciclo.yml"
  workflow_dispatch:

jobs:
  validar-painel-ciclo:
    name: Validar painel HTML + JSON
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Instalar dependência de teste
        run: python -m pip install --disable-pip-version-check pytest==9.0.3

      - name: Validar contratos do painel
        run: |
          python -m pytest tests/test_generate_cycle_dashboard_state.py tests/test_validar_painel_ciclo.py -q
          python scripts/validar_painel_ciclo.py

      - name: Publicar painel como artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: reqsys-painel-ciclo-completo
          path: |
            docs/painel-ciclo-completo-reqsys.html
            docs/ciclo-completo/estado-ciclo-reqsys.json
            docs/ciclo-completo/TEST_REPORT.md
          if-no-files-found: error
