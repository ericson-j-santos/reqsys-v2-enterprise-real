name: Noteri MSAL Secret Probe

on:
  push:
    branches:
      - diag/noteri-msal-secret-probe-20261011
    paths:
      - .github/workflows/noteri-msal-secret-probe.yml

permissions:
  contents: read

concurrency:
  group: noteri-msal-secret-probe
  cancel-in-progress: false

jobs:
  auth-options:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Resolve signed DEV locator and inspect public auth options
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve_pc24x7_dev_locator.mjs --output "$RUNNER_TEMP/locator.json" >/dev/null
          base_url="$(node -e "const x=require(process.argv[1]); process.stdout.write(x.selected_url)" "$RUNNER_TEMP/locator.json")"
          curl --fail --silent --show-error --max-time 20 "$base_url/api/v1/auth/config" > "$RUNNER_TEMP/auth-config.json"
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const d=x.data||{}; console.log(JSON.stringify({azure_enabled:d.azure_enabled===true,auth_status:d.auth_status||null,demo_login_enabled:d.demo_login_enabled===true,certificate_enabled:d.certificate_enabled===true,environment:d.environment||null}));" "$RUNNER_TEMP/auth-config.json"

  device-code-capability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
      - name: Probe Microsoft Entra device-code capability without user authentication
        shell: bash
        run: |
          set -euo pipefail
          node scripts/resolve_pc24x7_dev_locator.mjs --output "$RUNNER_TEMP/locator.json" >/dev/null
          base_url="$(node -e "const x=require(process.argv[1]); process.stdout.write(x.selected_url)" "$RUNNER_TEMP/locator.json")"
          curl --fail --silent --show-error --max-time 20 "$base_url/api/v1/auth/config" > "$RUNNER_TEMP/auth-config.json"
          python - "$RUNNER_TEMP/auth-config.json" "$RUNNER_TEMP/device.json" <<'PY'
          import json, sys, urllib.parse, urllib.request
          cfg=json.load(open(sys.argv[1], encoding="utf-8"))["data"]
          tenant=cfg["azure_tenant_id"]; client=cfg["azure_client_id"]
          body=urllib.parse.urlencode({"client_id":client,"scope":"openid profile email"}).encode()
          req=urllib.request.Request(f"https://login.microsoftonline.com/{tenant}/oauth2/v2.0/devicecode",data=body,headers={"Content-Type":"application/x-www-form-urlencoded"})
          try:
              with urllib.request.urlopen(req, timeout=20) as r:
                  raw=r.read()
                  status=r.status
          except urllib.error.HTTPError as e:
              raw=e.read(); status=e.code
          data=json.loads(raw.decode("utf-8"))
          safe={
              "http_status":status,
              "supported": status==200 and all(k in data for k in ("device_code","user_code","verification_uri","expires_in","interval")),
              "verification_uri": data.get("verification_uri"),
              "expires_in": data.get("expires_in"),
              "interval": data.get("interval"),
              "error": data.get("error"),
          }
          print(json.dumps(safe, sort_keys=True))
          if not safe["supported"]:
              raise SystemExit(3)
          PY

  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"

      - name: Validate provisioned MSAL state without exposing it
        shell: bash
        env:
          WSJF_MSAL_STORAGE_STATE_B64: ${{ secrets.WSJF_MSAL_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${WSJF_MSAL_STORAGE_STATE_B64:-}" ]; then
            echo "::error::msal_state_missing"
            exit 2
          fi
          state_file="$RUNNER_TEMP/msal-state.json"
          result_file="$RUNNER_TEMP/msal-status.json"
          printf '%s' "$WSJF_MSAL_STORAGE_STATE_B64" | base64 --decode > "$state_file"
          chmod 600 "$state_file"
          set +e
          MSAL_STORAGE_STATE_PATH="$state_file" node frontend/scripts/check-msal-state.mjs --json > "$result_file"
          rc=$?
          set -e
          node -e "const fs=require('fs'); const x=JSON.parse(fs.readFileSync(process.argv[1],'utf8')); const safe={status:x.status,capturedAt:x.capturedAt||null,expiraEm:x.expiraEm||null,restanteSegundos:x.restanteSegundos??null}; console.log(JSON.stringify(safe)); if(!['valido','expirando'].includes(x.status)) process.exit(3)" "$result_file"
          if [ "$rc" -ne 0 ]; then
            echo "::error::msal_state_not_valid"
            exit "$rc"
          fi
