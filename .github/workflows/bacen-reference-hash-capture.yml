name: BACEN Reference Hash Capture

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/normative/NORMATIVE-BASELINE-V2.yaml"
      - "scripts/capture_bacen_reference_hashes.py"
      - "scripts/validate_bacen_normative_axis.py"
      - ".github/workflows/bacen-reference-hash-capture.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/normative/NORMATIVE-BASELINE-V2.yaml"
      - "scripts/capture_bacen_reference_hashes.py"
      - "scripts/validate_bacen_normative_axis.py"
      - ".github/workflows/bacen-reference-hash-capture.yml"
  schedule:
    - cron: "17 11 * * 1"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-reference-hash-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capture:
    name: BACEN — Captura de hashes normalizados
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install deterministic parser dependencies
        run: python -m pip install --disable-pip-version-check PyYAML pypdf==6.16.2

      - name: Compile capture script
        run: python -m py_compile scripts/capture_bacen_reference_hashes.py

      - name: Resolve strict verification scope
        id: scope
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          strict=true
          reason="${{ github.event_name }}"
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            strict=false
            reason="workflow_runtime_only"
            git fetch --no-tags --depth=1 origin "$BASE_SHA" "$HEAD_SHA"
            if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -Eq '^(governance/bacen/normative/NORMATIVE-BASELINE-V2\.yaml|scripts/capture_bacen_reference_hashes\.py|scripts/validate_bacen_normative_axis\.py)
      - name: Print computed hash evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/bacen/bacen-reference-hashes.json")
          if not path.exists():
              raise SystemExit("evidência de captura não gerada")
          report = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps({
              "result": report["result"],
              "documents": [
                  {
                      "uid": item["uid"],
                      "version": item["version"],
                      "published_at": item["published_at"],
                      "capture_scope": item["capture_scope"],
                      "parser": item["parser"],
                      "parser_version": item.get("parser_version"),
                      "pages": item.get("pages"),
                      "members": item.get("members"),
                      "normalized_chars": item["normalized_chars"],
                      "content_sha256": item["content_sha256"],
                      "matches_baseline": item["matches_baseline"],
                  }
                  for item in report["documents"]
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish capture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bacen-reference-hashes
          path: artifacts/bacen/bacen-reference-hashes.json
          if-no-files-found: error
          retention-days: 90

      - name: Append summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("artifacts/bacen/bacen-reference-hashes.json")
          print("## BACEN — referências técnicas vivas")
          if not path.exists():
              print("- Evidência de captura não gerada.")
              raise SystemExit(1)
          report = json.loads(path.read_text(encoding="utf-8"))
          print(f"- Resultado: `{report['result']}`")
          print(f"- Baseline: `{report['baseline_uid']}`")
          for item in report["documents"]:
              print(f"- `{item['uid']}` v{item['version']}: `{item['content_sha256']}` — match=`{item['matches_baseline']}`")
          PY
; then
              strict=true
              reason="normative_input_changed"
            fi
          fi
          echo "strict=$strict" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"

      - name: Capture official BCB references
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "${{ steps.scope.outputs.strict }}" == "true" ]]; then
            args+=(--verify)
          fi
          python scripts/capture_bacen_reference_hashes.py "${args[@]}"

      - name: Report external reference drift on workflow-only PR
        if: ${{ github.event_name == 'pull_request' && steps.scope.outputs.strict != 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/bacen/bacen-reference-hashes.json").read_text(encoding="utf-8"))
          if report.get("result") != "valid":
              mismatches = [
                  item.get("uid")
                  for item in report.get("documents", [])
                  if item.get("matches_baseline") is False
              ]
              print(f"::warning::External BACEN reference drift detected outside normative PR scope: {mismatches}")
          PY

      - name: Print computed hash evidence
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("artifacts/bacen/bacen-reference-hashes.json")
          if not path.exists():
              raise SystemExit("evidência de captura não gerada")
          report = json.loads(path.read_text(encoding="utf-8"))
          print(json.dumps({
              "result": report["result"],
              "documents": [
                  {
                      "uid": item["uid"],
                      "version": item["version"],
                      "published_at": item["published_at"],
                      "capture_scope": item["capture_scope"],
                      "parser": item["parser"],
                      "parser_version": item.get("parser_version"),
                      "pages": item.get("pages"),
                      "members": item.get("members"),
                      "normalized_chars": item["normalized_chars"],
                      "content_sha256": item["content_sha256"],
                      "matches_baseline": item["matches_baseline"],
                  }
                  for item in report["documents"]
              ],
          }, ensure_ascii=False, indent=2))
          PY

      - name: Publish capture evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bacen-reference-hashes
          path: artifacts/bacen/bacen-reference-hashes.json
          if-no-files-found: error
          retention-days: 90

      - name: Append summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          path = Path("artifacts/bacen/bacen-reference-hashes.json")
          print("## BACEN — referências técnicas vivas")
          if not path.exists():
              print("- Evidência de captura não gerada.")
              raise SystemExit(1)
          report = json.loads(path.read_text(encoding="utf-8"))
          print(f"- Resultado: `{report['result']}`")
          print(f"- Baseline: `{report['baseline_uid']}`")
          for item in report["documents"]:
              print(f"- `{item['uid']}` v{item['version']}: `{item['content_sha256']}` — match=`{item['matches_baseline']}`")
          PY
