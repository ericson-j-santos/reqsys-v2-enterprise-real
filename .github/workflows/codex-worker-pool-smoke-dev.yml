              $tasks[0].issue_number -ne 2546 -or $tasks[1].issue_number -ne 2547) {
            throw "INVENTORY_TASK_IDENTITY_INVALID"
          }
          if ($e.inventory.worker_count -lt 0 -or
              $e.inventory.builders_registered -lt 0 -or
              $e.inventory.validators_registered -lt 0) {
            throw "INVENTORY_WORKER_COUNTS_INVALID"
          }

      - name: Upload sanitized readonly inventory
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
