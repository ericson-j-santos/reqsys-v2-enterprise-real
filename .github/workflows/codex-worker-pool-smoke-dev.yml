          if ($observedHash -ne $env:PORTABLE_PYTHON_SHA256) {
            throw "portable_python_sha256_mismatch:$observedHash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $python = Join-Path $root "python.exe"
          if (-not (Test-Path -LiteralPath $python)) { throw "portable_python_executable_missing" }
          $observedVersion = (& $python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne "Python $env:PORTABLE_PYTHON_VERSION") {
            throw "portable_python_version_mismatch:$observedVersion"
          }
          "REQSYS_PYTHON=$python" | Add-Content $env:GITHUB_ENV

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rulesScripts = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts"
          $pythonRoot = Split-Path -Parent $env:REQSYS_PYTHON
          $pth = Join-Path $pythonRoot "python312._pth"
          if (-not (Test-Path -LiteralPath $pth)) { throw "PORTABLE_PYTHON_PTH_MISSING" }
          $pthLines = @(Get-Content -LiteralPath $pth)
          if ($pthLines -notcontains $rulesScripts) {
            Add-Content -LiteralPath $pth -Value $rulesScripts
          }
          $launcher = Join-Path $rulesScripts "session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "pc24x7-worker-pool-inventory-dev",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--require-runner-version-preflight",
