            "--confirm", "READ-WORKER-POOL-DEV-SQL-ONLY"
          )
          & "$env:REQSYS_PYTHON" $gateway @args
          exit $LASTEXITCODE

      - name: Validate immutable SQLite inventory evidence
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "INVENTORY_WORKTREE_MISSING" }
          $path = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path -LiteralPath $path)) { throw "INVENTORY_EVIDENCE_MISSING" }
          $e = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          if ($e.result -ne "WORKER_POOL_PHYSICAL_INVENTORY_READ_OK" -or
              $e.environment -ne "dev" -or $e.host -ne "DESKTOP-PDQK954" -or
              $e.source_sha -ne $env:GITHUB_SHA -or
              $e.correlation_id -ne $env:CORRELATION_ID -or
              $e.container_image_id_sha256 -notmatch '^[0-9a-f]{64}$') {
            throw "INVENTORY_IDENTITY_OR_IMAGE_MISMATCH"
          }
          if ($e.docker_inspect_read_only -ne $true -or $e.sql_mode_ro -ne $true -or
              $e.production_touched -ne $false -or
              $e.inventory.read_mode -ne "sqlite_mode_ro" -or
