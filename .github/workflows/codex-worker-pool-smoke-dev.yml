          if (-not (Test-Path -LiteralPath $path)) { throw "VERSION_PROBE_EVIDENCE_MISSING" }
          $e = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          if ($e.result -ne "WORKER_POOL_VERSION_PROBE_OK" -or
              $e.task_id -ne "cwp-7d84018f3319356181ab9b47" -or
              $e.request_id -ne "9a9783d5ac78199eacfd13c0" -or
              $e.issue_number -ne 2547 -or
              $e.upgrade_required -notin @($true,$false)) {
            throw "VERSION_PROBE_IDENTITY_OR_RESULT_INVALID"
          }
          if ($e.source_sha -ne "${{ github.sha }}" -or $e.host -ne "DESKTOP-PDQK954") {
            throw "VERSION_PROBE_SOURCE_OR_HOST_INVALID"
          }
          if ($e.snapshot_called -ne $false -or $e.runtime_mutated_by_probe -ne $false -or
              $e.production_touched -ne $false -or $e.secrets_exposed -ne $false -or
              $e.runtime_source_sha_attested -ne $false -or $e.deploy_executed -ne $false) {
            throw "VERSION_PROBE_SAFETY_CONTRACT_FAILED"
          }

      - name: Upload sanitized fixed-task evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-worker-pool-version-2547-read-dev-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\codex-worker-pool-version-2547-read-dev\evidence.json
          if-no-files-found: error
          retention-days: 30

  inventory-read:
    if: ${{ inputs.mode == 'inventory-read' }}
    name: Inspect fixed Worker Pool SQLite and capacity on PC24x7 DEV
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 5
    env:
      TARGET_REPO: ${{ github.workspace }}
