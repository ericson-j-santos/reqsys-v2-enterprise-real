name: Codex Worker Pool Smoke DEV

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Operação fixa do Worker Pool DEV
        required: false
        default: smoke
        type: choice
        options:
          - smoke
          - restore
          - task-read
          - task-2547-read
          - version-2547-read
          - inventory-read

permissions:
  contents: read

concurrency:
  group: codex-worker-pool-smoke-dev
  cancel-in-progress: false

jobs:
  smoke:
    if: inputs.mode == 'smoke' || inputs.mode == ''
    name: Validar Worker Pool no PC24x7 DEV
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 10
    env:
      CODEX_WORKER_POOL_URL: http://127.0.0.1:8097
      CORRELATION_ID: codex-worker-pool-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts/codex-worker-pool-smoke-dev/evidence.json

    steps:
      - name: Checkout SHA imutável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verificar host DEV exato
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne "DESKTOP-PDQK954") {
            throw "UNEXPECTED_HOST: $env:COMPUTERNAME"
          }

      - name: Executar smoke governado do Worker Pool
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          python scripts/codex_worker_pool_smoke_dev.py `
            --expected-sha "${{ github.sha }}" `
            --correlation-id "$env:CORRELATION_ID" `
            --output "$env:EVIDENCE_FILE"

      - name: Validar evidência independente
        shell: powershell
        run: |
          $evidence = Get-Content -Raw "$env:EVIDENCE_FILE" | ConvertFrom-Json
          if ($evidence.result -ne "WORKER_POOL_SMOKE_PASSED") { throw "Smoke não aprovado." }
          if ($evidence.lane_enabled -ne $false) { throw "Lane sintética não está desabilitada." }
          if ($evidence.task_state -ne "queued" -or $null -ne $evidence.leased_by) {
            throw "Task sintética tornou-se executável."
          }
          if ($evidence.replay_created -ne $false -or $evidence.independent_readback -ne $true) {
            throw "Replay ou leitura independente não comprovados."
          }
          if ($evidence.expected_sha -ne "${{ github.sha }}") { throw "SHA divergente." }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-worker-pool-smoke-dev-${{ github.run_id }}
          path: artifacts/codex-worker-pool-smoke-dev/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Resumo
        if: always()
        shell: powershell
        run: |
          "## Codex Worker Pool Smoke DEV" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Host esperado: DESKTOP-PDQK954" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Lane sintética: desabilitada" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Replay idempotente: obrigatório" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Deploy executado: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Correlation ID: $env:CORRELATION_ID" | Add-Content $env:GITHUB_STEP_SUMMARY

  restore:
    if: inputs.mode == 'restore'
    name: Restaurar autenticação do Worker Pool no PC24x7 DEV
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 12
    env:
      CORRELATION_ID: worker-pool-token-restore-${{ github.run_id }}-${{ github.run_attempt }}
      TARGET_REPO: C:\dev\reqsys-v2-enterprise-real
      EVIDENCE_REL: artifacts/codex-worker-pool-auth-restore-dev/evidence.json

    steps:
      - name: Checkout regras canônicas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: main
          path: _rules
          fetch-depth: 1

      - name: Bootstrap obrigatório de sessão
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "worker-pool-restore",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/main"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT

      - name: Instalar autorização Risk3 exata e temporária
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_worker_pool_auth_restore_risk3.py `
              --enable `
              --ttl-minutes 30 `
              --confirm ENABLE-WORKER-POOL-AUTH-RESTORE-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Restaurar auth via Owner Risk3 Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\owner_risk3_gateway.py"
          $riskArgs = @(
            "--action-id", "reqsys.worker-pool-auth-file-restore.dev",
            "--scope", "repo://reqsys/environment/dev/worker-pool",
            "--cwd", $env:TARGET_PATH,
            "--timeout", "300",
            "--correlation-id", $env:CORRELATION_ID
          )
          & python $gateway @riskArgs
          exit $LASTEXITCODE

      - name: Remover autorização Risk3 temporária
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_RISK3_CLEANUP" }
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_worker_pool_auth_restore_risk3.py `
              --disable `
              --confirm DISABLE-WORKER-POOL-AUTH-RESTORE-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-worker-pool-token-restore-dev-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\codex-worker-pool-auth-restore-dev\evidence.json
          if-no-files-found: error
          retention-days: 30

  task-read:
    if: ${{ inputs.mode == 'task-read' }}
    name: Read fixed Worker Pool task #2546 on Desktop DEV
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 5
    env:
      TARGET_REPO: ${{ github.workspace }}
      RULES_SHA: f6ccb143a581e28650e9b640226f9ef671d469f2
      CORRELATION_ID: codex-worker-pool-task-read-dev-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\codex-worker-pool-task-read-dev\evidence.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned portable Python 3.12
        shell: powershell
        env:
          PORTABLE_PYTHON_VERSION: "3.12.10"
          PORTABLE_PYTHON_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PORTABLE_PYTHON_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP ("reqsys-python-" + $env:PORTABLE_PYTHON_VERSION + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $zip = "$root.zip"
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest -Uri $env:PORTABLE_PYTHON_URL -OutFile $zip -UseBasicParsing
          $observedHash = ([BitConverter]::ToString(([Security.Cryptography.SHA256]::Create()).ComputeHash([IO.File]::ReadAllBytes($zip)))).Replace('-', '').ToLowerInvariant()
          if ($observedHash -ne $env:PORTABLE_PYTHON_SHA256) {
            throw "portable_python_sha256_mismatch:$observedHash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $python = Join-Path $root "python.exe"
          if (-not (Test-Path -LiteralPath $python)) { throw "portable_python_executable_missing" }
          $observedVersion = (& $python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne "Python $env:PORTABLE_PYTHON_VERSION") {
            throw "portable_python_version_mismatch:$observedVersion"
          }
          "REQSYS_PYTHON=$python" | Add-Content $env:GITHUB_ENV

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rulesScripts = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts"
          $pythonRoot = Split-Path -Parent $env:REQSYS_PYTHON
          $pth = Join-Path $pythonRoot "python312._pth"
          if (-not (Test-Path -LiteralPath $pth)) { throw "PORTABLE_PYTHON_PTH_MISSING" }
          $pthLines = @(Get-Content -LiteralPath $pth)
          if ($pthLines -notcontains $rulesScripts) {
            Add-Content -LiteralPath $pth -Value $rulesScripts
          }
          $launcher = Join-Path $rulesScripts "session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "codex-worker-pool-task-read-dev",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--require-runner-version-preflight",
            "--sync-ref", "origin/main"
          )
          $raw = & "$env:REQSYS_PYTHON" $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Prove exact physical host through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\codex_worker_pool_task_read_dev.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $script,
            "--expected-sha", $env:ANCHOR_SHA
          )
          & "$env:REQSYS_PYTHON" $gateway @args
          exit $LASTEXITCODE

      - name: Validate sanitized fixed-task evidence
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $path = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path -LiteralPath $path)) { throw "TASK_READ_EVIDENCE_MISSING" }
          $e = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          if ($e.result -ne "WORKER_POOL_TASK_READ_OK" -or
              $e.task_id -ne "cwp-cdb85c31e3cc4e972f3094ab" -or
              $e.request_id -ne "4f6f18810783cdc6872f04f1" -or
              $e.issue_number -ne 2546 -or
              $e.repository -ne "ericson-j-santos/reqsys-v2-enterprise-real") {
            throw "TASK_READ_IDENTITY_OR_RESULT_INVALID"
          }
          if ($e.source_sha -ne "${{ github.sha }}" -or $e.host -ne "DESKTOP-PDQK954") {
            throw "TASK_READ_SOURCE_OR_HOST_INVALID"
          }
          if ($e.snapshot_called -ne $false -or $e.runtime_mutated -ne $false -or
              $e.production_touched -ne $false -or $e.secrets_exposed -ne $false) {
            throw "TASK_READ_SAFETY_CONTRACT_FAILED"
          }

      - name: Upload sanitized fixed-task evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-worker-pool-task-read-dev-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\codex-worker-pool-task-read-dev\evidence.json
          if-no-files-found: error
          retention-days: 30

  task-2547-read:
    if: ${{ inputs.mode == 'task-2547-read' }}
    name: Read fixed Worker Pool task #2547 on Desktop DEV
