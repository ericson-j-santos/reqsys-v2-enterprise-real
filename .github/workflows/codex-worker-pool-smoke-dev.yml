      CORRELATION_ID: pc24x7-worker-pool-inventory-dev-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\pc24x7-worker-pool-inventory-dev\evidence.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
