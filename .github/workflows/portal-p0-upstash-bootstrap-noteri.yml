name: Portal P0 Upstash Bootstrap via Noteri

on:
  push:
    branches:
      - ops/portal-p0-upstash-bootstrap-20260928
    paths:
      - '.github/workflows/portal-p0-upstash-bootstrap-noteri.yml'

permissions:
  contents: read

concurrency:
  group: portal-p0-upstash-bootstrap-noteri
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Portal preview persistence from Noteri
    if: github.repository == 'ericson-j-santos/reqsys-v2-enterprise-real' && github.actor == 'ericson-j-santos'
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 12
    env:
      EXPECTED_HOST: Noteri
      PORTAL_REPO: ericson-j-santos/portal-portabilidade-2025
      PORTAL_PR: '54'
      EXPECTED_PORTAL_HEAD: ae11659d2a61b62c4a1c893d62dca220f4aa3ef7
      VERCEL_SCOPE: ericsons-projects-2dc94fbf
      VERCEL_ORG_ID: team_o4wyHrN2sFJBZ79KKrtkIVE9
      VERCEL_PROJECT_ID: prj_GcQEm3O9AlURnthV1iwC7c99Q289
      RESOURCE_NAME: portal-portabilidade-2025-preview
      SOURCE_PREVIEW_URL: https://portal-portabilidade-2025-an16k4b0m-ericsons-projects-2dc94fbf.vercel.app
      EVIDENCE_FILE: artifacts/portal-p0-upstash-noteri/evidence.json

    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify host, local sessions and exact Portal HEAD
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:COMPUTERNAME -ine $env:EXPECTED_HOST) { throw "host_mismatch:$env:COMPUTERNAME" }
          if ($env:RUNNER_OS -ine 'Windows') { throw "runner_os_mismatch:$env:RUNNER_OS" }

          $savedGh = $env:GH_TOKEN
          $savedGithub = $env:GITHUB_TOKEN
          Remove-Item Env:GH_TOKEN -ErrorAction SilentlyContinue
          Remove-Item Env:GITHUB_TOKEN -ErrorAction SilentlyContinue
          try {
            $login = (& gh api user --jq '.login').Trim()
            if ($LASTEXITCODE -ne 0 -or $login -ine 'ericson-j-santos') { throw 'github_local_session_unavailable' }
            $observed = (& gh api "repos/$env:PORTAL_REPO/pulls/$env:PORTAL_PR" --jq '.head.sha').Trim().ToLowerInvariant()
            if ($LASTEXITCODE -ne 0) { throw 'portal_pr_read_failed' }
            if ($observed -ne $env:EXPECTED_PORTAL_HEAD) { throw "portal_head_mismatch:$observed" }
          } finally {
            if ($null -ne $savedGh) { $env:GH_TOKEN = $savedGh }
            if ($null -ne $savedGithub) { $env:GITHUB_TOKEN = $savedGithub }
          }

          $env:CI = '1'
          $env:VERCEL_TELEMETRY_DISABLED = '1'
          $who = (& npx --yes vercel@latest whoami --scope $env:VERCEL_SCOPE 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($who)) { throw 'vercel_local_session_unavailable' }
          Write-Output 'NOTERI_AND_SESSIONS=PASS'

      - name: Provision Free preview resource and run persistent E2E
        id: execute
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TEMP "portal-p0-upstash-$env:GITHUB_RUN_ID-$env:GITHUB_RUN_ATTEMPT"
          New-Item -ItemType Directory -Force -Path (Join-Path $root '.vercel') | Out-Null
          $project = @{ orgId = $env:VERCEL_ORG_ID; projectId = $env:VERCEL_PROJECT_ID } | ConvertTo-Json -Compress
          [IO.File]::WriteAllText((Join-Path $root '.vercel\project.json'), $project, [Text.UTF8Encoding]::new($false))
          Push-Location $root
          try {
            $listPath = Join-Path $env:RUNNER_TEMP "upstash-list-$env:GITHUB_RUN_ID.json"
            & npx --yes vercel@latest integration list --integration upstash --format=json --scope $env:VERCEL_SCOPE | Out-File $listPath -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'upstash_list_failed' }
            $before = (Get-Content -Raw -Encoding UTF8 $listPath).Contains('"' + $env:RESOURCE_NAME + '"')
            $created = $false
            if (-not $before) {
              $addPath = Join-Path $env:RUNNER_TEMP "upstash-add-$env:GITHUB_RUN_ID.json"
              & npx --yes vercel@latest integration add upstash/upstash-redis --name $env:RESOURCE_NAME --plan free --environment preview --metadata primaryRegion=iad1 --no-claim --no-env-pull --yes --format=json --scope $env:VERCEL_SCOPE | Out-File $addPath -Encoding utf8
              if ($LASTEXITCODE -ne 0) { throw 'upstash_free_preview_provision_failed' }
              $created = $true
            }

            & npx --yes vercel@latest integration list --integration upstash --format=json --scope $env:VERCEL_SCOPE | Out-File $listPath -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'upstash_verify_failed' }
            if (-not (Get-Content -Raw -Encoding UTF8 $listPath).Contains('"' + $env:RESOURCE_NAME + '"')) { throw 'upstash_resource_not_visible' }

            $redeployOutput = (& npx --yes vercel@latest redeploy $env:SOURCE_PREVIEW_URL --yes --scope $env:VERCEL_SCOPE 2>&1 | Out-String)
            if ($LASTEXITCODE -ne 0) { throw 'portal_preview_redeploy_failed' }
            $match = [regex]::Matches($redeployOutput, 'https://[A-Za-z0-9.-]+\.vercel\.app') | Select-Object -Last 1
            if ($null -eq $match) { throw 'redeploy_url_missing' }
            $redeployUrl = $match.Value

            $e2ePath = Join-Path $env:RUNNER_TEMP "portal-p0-e2e-$env:GITHUB_RUN_ID.json"
            & npx --yes vercel@latest curl "$redeployUrl/api/e2eRun?mode=persistent" --scope $env:VERCEL_SCOPE | Out-File $e2ePath -Encoding utf8
            if ($LASTEXITCODE -ne 0) { throw 'persistent_e2e_request_failed' }
            $p = Get-Content -Raw -Encoding UTF8 $e2ePath | ConvertFrom-Json
            if ($p.result -ne 'PASS') { throw 'persistent_e2e_not_pass' }
            if ($p.head_sha -ne $env:EXPECTED_PORTAL_HEAD) { throw "persistent_e2e_sha_mismatch:$($p.head_sha)" }
            if ($p.upstash_resource -ne 'vercel-preview-persistent') { throw 'persistent_resource_mismatch' }
            if (-not $p.credentials_persisted -or $p.credentials_exposed) { throw 'credential_state_invalid' }
            if ($p.production_changed) { throw 'production_changed' }
            if ($p.redis_ping -ne 'PASS' -or $p.cleanup -ne 'PASS') { throw 'redis_validation_failed' }
            if ($p.checks.create -ne 201 -or $p.checks.independent_read -ne 200 -or $p.checks.idempotent_replay -ne 200 -or $p.checks.replay_read -ne 200 -or $p.checks.invalid_write -ne 400 -or $p.checks.invalid_read -ne 404 -or $p.checks.unavailable -ne 503) { throw 'e2e_matrix_failed' }

            $evidence = [ordered]@{
              ok = $true
              host = $env:COMPUTERNAME
              portal_head = $env:EXPECTED_PORTAL_HEAD
              resource_name = $env:RESOURCE_NAME
              plan = 'free'
              environment = 'preview'
              resource_created = $created
              redeploy_host = ([uri]$redeployUrl).Host
              e2e_result = 'PASS'
              cleanup = 'PASS'
              production_changed = $false
              credential_exported = $false
              observed_at = [DateTimeOffset]::UtcNow.ToString('o')
            }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $env:EVIDENCE_FILE) | Out-Null
            $evidence | ConvertTo-Json -Depth 5 | Out-File $env:EVIDENCE_FILE -Encoding utf8
            Write-Output 'PORTAL_P0_PERSISTENT_E2E=PASS'
          } finally {
            Pop-Location
            Remove-Item -Recurse -Force $root -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $env:RUNNER_TEMP "upstash-list-$env:GITHUB_RUN_ID.json") -Force -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $env:RUNNER_TEMP "upstash-add-$env:GITHUB_RUN_ID.json") -Force -ErrorAction SilentlyContinue
            Remove-Item (Join-Path $env:RUNNER_TEMP "portal-p0-e2e-$env:GITHUB_RUN_ID.json") -Force -ErrorAction SilentlyContinue
          }

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: portal-p0-upstash-noteri-${{ github.run_id }}
          path: artifacts/portal-p0-upstash-noteri/evidence.json
          if-no-files-found: warn
          retention-days: 14
