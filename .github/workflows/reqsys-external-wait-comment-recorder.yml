name: ReqSys External Wait Comment Recorder

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: external-wait-comment-${{ github.event.comment.id }}
  cancel-in-progress: false

jobs:
  record:
    if: >-
      github.event.issue.pull_request == null &&
      github.event.issue.number == 1683 &&
      startsWith(github.event.comment.body, '/external-wait ')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      LEDGER_ISSUE: "1683"
      COMMENT_MAX_PAGES: "3"
      API_TIMEOUT_SECONDS: "30"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate authenticated actor permission
        id: permission
        env:
          ACTOR: ${{ github.event.comment.user.login }}
        run: |
          set -euo pipefail
          permission="$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${ACTOR}/permission" --jq .permission)"
          case "$permission" in
            write|maintain|admin) ;;
            *) echo "Ator sem permissão suficiente para registrar espera externa." >&2; exit 1 ;;
          esac
          echo "permission=$permission" >> "$GITHUB_OUTPUT"

      - name: Parse and validate command
        env:
          COMMAND_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          mkdir -p .tmp artifacts/external-wait
          printf '%s' "$COMMAND_BODY" > .tmp/external-wait-command.txt
          python scripts/parse_external_wait_command.py \
            --command-file .tmp/external-wait-command.txt \
            --output .tmp/external-wait-command.json

      - name: Build immutable event payload
        id: event
        env:
          TRIGGER_COMMENT_ID: ${{ github.event.comment.id }}
          TRIGGER_ACTOR: ${{ github.event.comment.user.login }}
          TRIGGER_PERMISSION: ${{ steps.permission.outputs.permission }}
        run: |
          set -euo pipefail
          EVENT_ID="wait-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          export EVENT_ID
          echo "event_id=${EVENT_ID}" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          command = json.loads(Path('.tmp/external-wait-command.json').read_text(encoding='utf-8'))
          event = {
              'schema_version': '1.0.0',
              'event_id': os.environ['EVENT_ID'],
              'wait_id': command['wait_id'],
              'action': command['action'],
              'category': command['category'],
              'correlation_id': command['correlation_id'],
              'sha': command.get('sha'),
              'source_reference': command.get('source_reference'),
              'recorder_run_id': os.environ['GITHUB_RUN_ID'],
              'recorder_run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'trigger_comment_id': os.environ['TRIGGER_COMMENT_ID'],
              'trigger_actor': os.environ['TRIGGER_ACTOR'],
              'trigger_permission': os.environ['TRIGGER_PERMISSION'],
          }
          Path('artifacts/external-wait/event.json').write_text(
              json.dumps(event, indent=2, ensure_ascii=False) + '\n',
              encoding='utf-8',
          )
          body = (
              '<!-- reqsys-external-wait-event:v1 -->\n'
              '```json\n'
              + json.dumps(event, indent=2, ensure_ascii=False)
              + '\n```\n'
          )
          Path('.tmp/comment.md').write_text(body, encoding='utf-8')
          PY

      - name: Persist event in GitHub issue ledger
        run: |
          set -euo pipefail
          gh issue comment "$LEDGER_ISSUE" --body-file .tmp/comment.md

      - name: Verify persisted event independently
        env:
          EVENT_ID: ${{ steps.event.outputs.event_id }}
        run: |
          set -euo pipefail
          found=""
          for page in $(seq 1 "$COMMENT_MAX_PAGES"); do
            ids="$(timeout "${API_TIMEOUT_SECONDS}s" gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${LEDGER_ISSUE}/comments?per_page=100&page=${page}" \
              --jq ".[] | select(.user.login == \"github-actions[bot]\") | select(.body | contains(\"${EVENT_ID}\")) | .id")"
            if [ -n "$ids" ]; then
              found="$(printf '%s\n' "$ids" | tail -1)"
              break
            fi
          done
          test -n "$found" || {
            echo "Evento persistido não foi reencontrado na fonte independente." >&2
            exit 1
          }
          echo "verified_comment_id=$found" >> "$GITHUB_STEP_SUMMARY"
          echo "trigger_comment_id=${{ github.event.comment.id }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Publish recorder evidence
        uses: actions/upload-artifact@v4
        with:
          name: external-wait-${{ steps.event.outputs.event_id }}
          path: artifacts/external-wait/event.json
          retention-days: 90
