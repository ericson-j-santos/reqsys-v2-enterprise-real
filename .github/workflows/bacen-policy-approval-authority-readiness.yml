name: BACEN Policy Approval Authority Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml"
      - "scripts/generate_bacen_policy_approval_authority_readiness.py"
      - ".github/workflows/bacen-policy-approval-authority-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml"
      - "scripts/generate_bacen_policy_approval_authority_readiness.py"
      - ".github/workflows/bacen-policy-approval-authority-readiness.yml"
  schedule:
    - cron: "17 8 5 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-policy-approval-authority-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-01 Approval Authority Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_policy_approval_authority_readiness.py

      - name: Generate readiness evidence
        run: |
          python scripts/generate_bacen_policy_approval_authority_readiness.py \
            --metadata governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml \
            --output artifacts/bacen/bacen-01-approval-authority-readiness.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("artifacts/bacen/bacen-01-approval-authority-readiness.json").read_text(encoding="utf-8"))
          assert evidence["control_id"] == "BACEN-01"
          assert evidence["structural_checks_passed"] is True
          assert evidence["readiness_status"] in {
              "pending_formal_designation",
              "ready_for_formal_approval",
              "authority_validated",
          }
          if evidence["authority_designated"]:
              assert evidence["segregation_of_duties_valid"] is True
          else:
              assert "formal_approval_authority_pending" in evidence["advisory_findings"]
          assert evidence["production_touched"] is False
          print("BACEN-01 approval authority readiness: valid")
          PY

      - name: Publish readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-01-approval-authority-readiness
          path: artifacts/bacen/bacen-01-approval-authority-readiness.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish executive summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-01-approval-authority-readiness.json")
          print("## BACEN-01 — Autoridade aprovadora")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          print(f"\n- Autoridade designada: **{evidence['authority_designated']}**")
          print(f"- Segregação de funções válida: **{evidence['segregation_of_duties_valid']}**")
          print(f"- Checks estruturais: **{evidence['structural_checks_passed']}**")
          print(f"- Prontidão: **{evidence['readiness_status']}**")
          print("- Produção acessada: **false**")
          PY
