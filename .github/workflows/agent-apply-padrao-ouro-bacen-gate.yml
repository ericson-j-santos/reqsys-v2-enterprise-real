name: Agent Build Padrão Ouro BACEN Gate Artifact

on:
  pull_request:
    types: [opened, reopened]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: agent-build-padrao-ouro-bacen-gate-artifact
  cancel-in-progress: false

jobs:
  build:
    if: github.head_ref == 'agent/padrao-ouro-bacen-prod-gate-v1'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/padrao-ouro-bacen-prod-gate-v1
          fetch-depth: 0
          persist-credentials: false

      - name: Apply strict patch locally
        run: python scripts/agent_patch_padrao_ouro_bacen_gate.py

      - name: Validate generated contracts
        run: |
          python - <<'PY'
          from pathlib import Path
          delivery = Path('.github/workflows/padrao-ouro-delivery-automation.yml').read_text()
          reusable = Path('.github/workflows/bacen-production-hard-gate.yml').read_text()
          required_delivery = [
              '# REQSYS_PRODUCTION_GOVERNANCE_GATE',
              '\n  production-gate:\n',
              'uses: ./.github/workflows/bacen-production-hard-gate.yml',
              "needs.production-gate.outputs.production_allowed == 'true'",
              '| BACEN production gate |',
          ]
          missing = [item for item in required_delivery if item not in delivery]
          if missing:
              raise SystemExit(f'missing delivery contract markers: {missing}')
          if delivery.index('\n  production-gate:\n') > delivery.index('\n  configure-prod-secrets:\n'):
              raise SystemExit('production gate must precede production secrets job')
          for item in ['production_allowed:', 'decision:', 'value: ${{ jobs.gate.outputs.production_allowed }}']:
              if item not in reusable:
                  raise SystemExit(f'missing reusable output: {item}')
          PY

      - name: Publish generated workflows
        uses: actions/upload-artifact@v4
        with:
          name: padrao-ouro-bacen-gate-generated
          path: |
            .github/workflows/padrao-ouro-delivery-automation.yml
            .github/workflows/bacen-production-hard-gate.yml
          if-no-files-found: error
          retention-days: 7
