name: Correção temporária PR 1395

on:
  push:
    branches:
      - fix/linguagem-simples-33223568476
    paths:
      - '.github/workflows/fix-pr1395-fast-ci-temp.yml'
      - 'frontend/**'

permissions:
  contents: write

concurrency:
  group: fix-pr1395-fast-ci-temp
  cancel-in-progress: true

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Obter branch
        uses: actions/checkout@v4
        with:
          ref: fix/linguagem-simples-33223568476
          fetch-depth: 0

      - name: Aplicar correções exatas
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              'frontend/src/services/api.js': [
                  ("return 'Atualizando informações do execução…'", "return 'Atualizando informações da execução…'"),
              ],
              'frontend/src/services/__tests__/api.test.js': [
                  ("expect(journeyLoadingMessage({ url: '/runtime/health' })).toContain('runtime')", "expect(journeyLoadingMessage({ url: '/runtime/health' })).toContain('execução')"),
              ],
              'frontend/src/services/__tests__/estatisticas.test.js': [
                  ("expect(invalido.motivos).toContain('Origem do artefato não é runtime.')", "expect(invalido.motivos).toContain('Origem do artefato não é execução.')"),
                  ("expect(invalido.motivos).toContain('SHA runtime completo e verificável ausente.')", "expect(invalido.motivos).toContain('SHA execução completo e verificável ausente.')"),
                  ("expect(resultadoSemAtestacao.motivos).toContain('Atestação runtime positiva e verificável ausente.')", "expect(resultadoSemAtestacao.motivos).toContain('Atestação execução positiva e verificável ausente.')"),
              ],
              'frontend/src/composables/__tests__/useAppVersion.test.js': [
                  (' · API v9.9.9', ' · serviço v9.9.9'),
              ],
              'frontend/src/views/UserFinalShellView.vue': [
                  ('/api/requisitos/área de trabalho', '/api/requisitos/workspace'),
                  ('${situação}', '${status}'),
              ],
          }

          changed = []
          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{file_name}: esperado 1 ocorrência de {old!r}; encontrado {count}')
                  text = text.replace(old, new, 1)
              if text != original:
                  path.write_text(text, encoding='utf-8')
                  changed.append(file_name)

          print('Arquivos corrigidos:')
          for item in changed:
              print(f'- {item}')
          PY

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Validar testes afetados
        working-directory: frontend
        run: >-
          npx vitest run
          src/composables/__tests__/useAppVersion.test.js
          src/services/__tests__/api.test.js
          src/services/__tests__/estatisticas.test.js
          src/views/__tests__/UserFinalShellView.spec.js

      - name: Validar linguagem simples
        run: |
          node --test frontend/scripts/validate-user-facing-language.test.mjs
          node frontend/scripts/validate-user-facing-language.mjs

      - name: Registrar correção
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração a registrar.'
            exit 0
          fi
          git commit -m 'fix(ci): restaurar contratos técnicos após correção de linguagem'
          git push origin HEAD:fix/linguagem-simples-33223568476
