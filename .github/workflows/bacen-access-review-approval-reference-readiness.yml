name: BACEN Access Review Approval Reference Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/ACCESS-REVIEW-REGISTER.yaml"
      - "scripts/generate_bacen_access_review_approval_reference_readiness.py"
      - ".github/workflows/bacen-access-review-approval-reference-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/ACCESS-REVIEW-REGISTER.yaml"
      - "scripts/generate_bacen_access_review_approval_reference_readiness.py"
      - ".github/workflows/bacen-access-review-approval-reference-readiness.yml"
  schedule:
    - cron: "19 9 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-access-review-approval-reference-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-02 Approval Reference Provenance
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_access_review_approval_reference_readiness.py

      - name: Generate readiness evidence
        run: |
          python scripts/generate_bacen_access_review_approval_reference_readiness.py \
            --register governance/bacen/ACCESS-REVIEW-REGISTER.yaml \
            --output artifacts/bacen/bacen-02-access-review-approval-reference-readiness.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-02-access-review-approval-reference-readiness.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          assert evidence["control_id"] == "BACEN-02"
          assert evidence["structural_checks_passed"] is True
          assert evidence["approval_reference_present"] is False
          assert evidence["provenance_complete"] is False
          assert evidence["readiness_status"] == "pending"
          assert evidence["production_touched"] is False
          assert len(evidence["register_sha256"]) == 64
          print("BACEN-02 approval reference provenance evidence: valid")
          PY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-02-access-review-approval-reference-readiness
          path: artifacts/bacen/bacen-02-access-review-approval-reference-readiness.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-02-access-review-approval-reference-readiness.json")
          print("## BACEN-02 — Proveniência da aprovação")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          print(f"\n- Referência presente: **{evidence['approval_reference_present']}**")
          print(f"- Proveniência completa: **{evidence['provenance_complete']}**")
          print(f"- Integridade estrutural: **{evidence['structural_checks_passed']}**")
          print(f"- Prontidão: **{evidence['readiness_status']}**")
          print("- Produção acessada: **false**")
          PY
