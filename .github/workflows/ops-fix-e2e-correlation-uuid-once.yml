name: Ops validate and dispatch Excel SQL E2E once

on:
  push:
    branches:
      - fix/excel-sql-e2e-correlation-uuid-20260917
    paths:
      - ".github/workflows/ops-fix-e2e-correlation-uuid-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  validate-and-dispatch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Validar correção do correlation id SQL
        run: |
          set -euo pipefail
          python -m pip install --quiet pytest
          python -m pytest tests/test_integration_excel_sql_sharepoint_flow.py -q
          python -m py_compile backend/app/services/integration_excel_sql_sharepoint_flow.py

      - name: Disparar E2E real DEV no mesmo ref
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/integration-excel-sql-sharepoint-e2e-dev.yml/dispatches" \
            -f ref="${GITHUB_REF_NAME}" \
            -f 'inputs[power_platform_environment_hint]=567445cb-49a2-ef0f-8490-cc81a281d6ed'
          echo "E2E_DISPATCHED_REF=${GITHUB_REF_NAME}"
          echo "E2E_DISPATCHED_SHA=${GITHUB_SHA}"