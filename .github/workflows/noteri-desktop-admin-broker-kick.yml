name: Desktop Admin Broker Local Kick

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noteri-desktop-admin-broker-kick
  cancel-in-progress: true

jobs:
  kick:
    name: Start existing Desktop Admin Broker locally
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 5
    env:
      EVIDENCE_FILE: artifacts/noteri-desktop-admin-broker-kick/evidence.json
      EVALUATED_SHA: ${{ github.sha }}

    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.EVALUATED_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned portable Python 3.12
        shell: powershell
        env:
          PORTABLE_PYTHON_VERSION: "3.12.10"
          PORTABLE_PYTHON_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PORTABLE_PYTHON_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP ("reqsys-python-" + $env:PORTABLE_PYTHON_VERSION + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $zip = "$root.zip"
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest -Uri $env:PORTABLE_PYTHON_URL -OutFile $zip -UseBasicParsing
          $observedHash = ([BitConverter]::ToString(([Security.Cryptography.SHA256]::Create()).ComputeHash([IO.File]::ReadAllBytes($zip)))).Replace('-', '').ToLowerInvariant()
          if ($observedHash -ne $env:PORTABLE_PYTHON_SHA256) { throw "portable_python_sha256_mismatch:$observedHash" }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $python = Join-Path $root "python.exe"
          if (-not (Test-Path -LiteralPath $python)) { throw "portable_python_executable_missing" }
          $observedVersion = (& $python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne "Python $env:PORTABLE_PYTHON_VERSION") {
            throw "portable_python_version_mismatch:$observedVersion"
          }
          "REQSYS_PYTHON=$python" | Add-Content $env:GITHUB_ENV

      - name: Run exact existing Desktop Admin Broker task
        shell: powershell
        run: |
          & "$env:REQSYS_PYTHON" scripts/noteri_desktop_admin_broker_kick.py --confirm KICK-EXISTING-DESKTOP-ADMIN-BROKER --evidence-file "$env:EVIDENCE_FILE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: noteri-desktop-admin-broker-kick-${{ github.run_id }}
          path: artifacts/noteri-desktop-admin-broker-kick/
          if-no-files-found: error
          retention-days: 30
