name: Executive Sync Stability Index Public Smoke Trend Dashboard

on:
  workflow_run:
    workflows:
      - Executive Sync Stability Index Public Smoke Trend State
    types: [completed]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: executive-sync-stability-index-public-smoke-trend-dashboard
  cancel-in-progress: false

jobs:
  publish-card:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Configure Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Compile and test
        run: |
          python -m py_compile scripts/inject_executive_sync_stability_index_public_smoke_trend_card.py
          python -m py_compile scripts/validate_executive_sync_stability_index_public_smoke_trend_card.py
          python -m unittest tests/test_executive_sync_stability_index_public_smoke_trend_dashboard.py

      - name: Download latest canonical dashboard
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477
        with:
          workflow: ops-dashboard.yml
          name: ops-dashboard-static
          path: dist/ops-dashboard-static
          workflow_conclusion: success
          branch: main
          if_no_artifact_found: fail

      - name: Download latest trend state
        uses: dawidd6/action-download-artifact@eab87c9830c39eff17e5a6eadb20bfb4bc880477
        with:
          workflow: executive-sync-stability-index-public-smoke-trend-state.yml
          name: executive-sync-stability-index-public-smoke-trend-state
          path: evidence/trend-state
          workflow_conclusion: success
          branch: main
          if_no_artifact_found: fail

      - name: Resolve runtime contract
        run: |
          set -euo pipefail
          runtime=$(find evidence/trend-state -type f -name 'runtime-executive-index.json' | head -n 1)
          test -n "$runtime"
          mkdir -p dist/ops-dashboard-static/data evidence/dashboard
          cp "$runtime" dist/ops-dashboard-static/data/runtime-executive-index.json

      - name: Inject and validate card
        run: |
          python scripts/inject_executive_sync_stability_index_public_smoke_trend_card.py \
            --html dist/ops-dashboard-static/index.html \
            --runtime-index dist/ops-dashboard-static/data/runtime-executive-index.json
          python scripts/validate_executive_sync_stability_index_public_smoke_trend_card.py \
            --html dist/ops-dashboard-static/index.html \
            --runtime-index dist/ops-dashboard-static/data/runtime-executive-index.json \
            --evidence evidence/dashboard/validation.json

      - name: Publish canonical dashboard
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: ops-dashboard-static
          path: dist/ops-dashboard-static
          retention-days: 90
          if-no-files-found: error

      - name: Publish validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: executive-sync-stability-index-public-smoke-trend-dashboard-evidence
          path: evidence/dashboard
          retention-days: 90
          if-no-files-found: error
