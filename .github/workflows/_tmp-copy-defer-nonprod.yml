name: Temporary Copy Validated NONPROD Defer Hotfix

on:
  push:
    branches:
      - fix/defer-human-gates-nonprod-20260913-v2

permissions:
  contents: write

jobs:
  copy-and-test:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Copiar incremento já validado
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin fix/defer-human-gates-nonprod-20260913
          source_ref=origin/fix/defer-human-gates-nonprod-20260913
          for path in \
            scripts/pending_development_orchestrator.py \
            scripts/human_pending_satellite.py \
            tests/test_pending_development_orchestrator.py \
            tests/test_human_pending_satellite.py \
            .github/workflows/human-pending-satellite.yml
          do
            git show "${source_ref}:${path}" > "$path"
          done
      - name: Validar incremento
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q tests/test_pending_development_orchestrator.py tests/test_human_pending_satellite.py
          python -m py_compile scripts/pending_development_orchestrator.py scripts/human_pending_satellite.py
          git diff --check
      - name: Publicar apenas código e testes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            scripts/pending_development_orchestrator.py \
            scripts/human_pending_satellite.py \
            tests/test_pending_development_orchestrator.py \
            tests/test_human_pending_satellite.py
          git diff --cached --check
          git commit -m "fix: defer scoped human gates outside target scope"
          git push origin HEAD:fix/defer-human-gates-nonprod-20260913-v2
