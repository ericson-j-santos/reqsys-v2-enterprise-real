name: Domain Coverage Ratchet

on:
  workflow_run:
    workflows: ["Domain Coverage Governance"]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: "Run ID do Domain Coverage Governance"
        required: true
        type: string
      minimum_gain:
        description: "Ganho mínimo em pontos percentuais"
        required: false
        default: "0.5"
        type: string

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: domain-coverage-ratchet
  cancel-in-progress: false

jobs:
  propose-ratchet:
    if: >-
      (github.event_name == 'workflow_dispatch') ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verificar baseline ativo
        id: policy
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          policy = json.loads(Path('config/domain-coverage-policy.json').read_text(encoding='utf-8'))
          print(f"active={'true' if policy.get('baseline') else 'false'}")
          PY

      - name: Resolver origem
        if: steps.policy.outputs.active == 'true'
        id: source
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "run_id=${{ inputs.run_id }}" >> "$GITHUB_OUTPUT"
            echo "minimum_gain=${{ inputs.minimum_gain }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
            echo "minimum_gain=0.5" >> "$GITHUB_OUTPUT"
          fi

      - name: Baixar evidência
        if: steps.policy.outputs.active == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p /tmp/domain-coverage
          gh run download "${{ steps.source.outputs.run_id }}" \
            --repo "${{ github.repository }}" \
            --name domain-coverage-evidence \
            --dir /tmp/domain-coverage

      - name: Gerar proposta monotônica
        if: steps.policy.outputs.active == 'true'
        run: |
          python scripts/ratchet_domain_coverage_baseline.py \
            --report /tmp/domain-coverage/artifacts/domain-coverage/report.json \
            --minimum-gain "${{ steps.source.outputs.minimum_gain }}"

      - name: Detectar promoção
        if: steps.policy.outputs.active == 'true'
        id: promotion
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          from pathlib import Path
          evidence = json.loads(Path('artifacts/domain-coverage/ratchet-evidence.json').read_text(encoding='utf-8'))
          print(f"required={'true' if evidence.get('promoted') else 'false'}")
          PY

      - name: Gerar token temporário para publicação governada
        if: steps.promotion.outputs.required == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REQSYS_STACK_REBASE_APP_ID }}
          private-key: ${{ secrets.REQSYS_STACK_REBASE_PRIVATE_KEY }}

      - name: Criar PR de elevação
        if: steps.promotion.outputs.required == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
          READY_FOR_PR_WAIT_SECONDS: "480"
        run: |
          set -euo pipefail
          git config --local --unset-all http.https://github.com/.extraheader || true
          gh auth setup-git
          cp artifacts/domain-coverage/ratcheted-policy.json config/domain-coverage-policy.json
          mkdir -p docs/ops-dashboard/data
          cp artifacts/domain-coverage/ratchet-evidence.json docs/ops-dashboard/data/domain-coverage-ratchet-latest.json

          BRANCH="automation/domain-coverage-ratchet-${RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git ls-remote --exit-code --heads origin "$BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BRANCH"
            git switch -C "$BRANCH" "origin/$BRANCH"
          else
            git switch -c "$BRANCH"
          fi

          git add config/domain-coverage-policy.json docs/ops-dashboard/data/domain-coverage-ratchet-latest.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(test): elevar baseline de cobertura por domínio"
            git push origin "$BRANCH"
          fi

          cat > /tmp/pr-body.md <<EOF
          ## Ratchet monotônico

          Eleva apenas domínios com ganho mínimo de ${{ steps.source.outputs.minimum_gain }} p.p.

          - Nunca reduz baseline.
          - Requer CI e aprovação humana.
          - Evidência: run ${RUN_ID}.
          EOF

          PR_REQUEST_ARTIFACT_DIR="artifacts/auto-pr/domain-ratchet" \
            python scripts/auto_open_agent_pr.py \
              --base main \
              --branch "$BRANCH" \
              --head-sha "$(git rev-parse HEAD)" \
              --title "chore(test): elevar baseline de cobertura por domínio" \
              --body-file /tmp/pr-body.md \
              --ready

          PR_URL="$(gh pr list --repo "${{ github.repository }}" --base main --head "$BRANCH" --state open --json url --jq '.[0].url // empty')"
          test -n "$PR_URL" || { echo "::error::READY_FOR_PR passou, mas nenhuma PR governada foi criada."; exit 1; }
          echo "PR governada: $PR_URL"

      - name: Publicar evidência
        if: always() && steps.policy.outputs.active == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: domain-coverage-ratchet-evidence
          path: artifacts/domain-coverage/ratchet-evidence.json
          if-no-files-found: warn
          retention-days: 30
