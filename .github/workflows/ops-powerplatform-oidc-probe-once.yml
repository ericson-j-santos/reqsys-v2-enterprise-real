name: Ops Power Platform OIDC probe once

on:
  push:
    branches:
      - feat/e2e-powerplatform-oidc-20260917
    paths:
      - ".github/workflows/ops-powerplatform-oidc-probe-once.yml"

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Autenticar identidade ReqSys DEV por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          tenant-id: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Provar tokens app-only sem expor credenciais
        shell: bash
        env:
          ENVIRONMENT_ID: "567445cb-49a2-ef0f-8490-cc81a281d6ed"
          DATAVERSE_URL: "https://orge9b920f1.crm2.dynamics.com"
        run: |
          set -euo pipefail
          mkdir -p audit/oidc
          python - <<'PY'
          import json
          from pathlib import Path
          Path("audit/oidc/oidc-probe.json").write_text(json.dumps({
              "schema_version": "1.0.0",
              "environment": "dev",
              "checks": {}
          }, indent=2) + "\n", encoding="utf-8")
          PY

          probe() {
            local name="$1"
            local resource="$2"
            local url="$3"
            local token http body
            body="/tmp/oidc-probe-$name.json"
            set +e
            token="$(az account get-access-token --resource "$resource" --query accessToken -o tsv 2>/dev/null)"
            local token_rc=$?
            set -e
            if [ "$token_rc" -ne 0 ] || [ -z "$token" ]; then
              python - "$name" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path("audit/oidc/oidc-probe.json")
          d=json.loads(p.read_text())
          d["checks"][sys.argv[1]]={"token_acquired": False, "http_status": None}
          p.write_text(json.dumps(d, indent=2)+"\n")
          PY
              return 0
            fi
            echo "::add-mask::$token"
            set +e
            http="$(curl -sS -o "$body" -w '%{http_code}' -H "Authorization: Bearer $token" -H 'Accept: application/json' "$url")"
            local curl_rc=$?
            set -e
            TOKEN="$token" BODY_PATH="$body" python - "$name" "$http" "$curl_rc" <<'PY'
          import base64, json, os, sys
          from pathlib import Path

          def claims(token):
              try:
                  raw=token.split(".")[1]
                  raw += "=" * (-len(raw) % 4)
                  payload=json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))
                  roles=payload.get("roles") or []
                  if isinstance(roles, str):
                      roles=[roles]
                  return {
                      "aud": payload.get("aud"),
                      "appid_or_azp": payload.get("appid") or payload.get("azp"),
                      "roles": sorted(str(x) for x in roles),
                  }
              except Exception:
                  return {"decode_failed": True}

          def safe_error(path):
              try:
                  payload=json.loads(Path(path).read_text(encoding="utf-8"))
              except Exception:
                  return None
              err=payload.get("error")
              if isinstance(err, dict):
                  code=err.get("code")
                  msg=err.get("message")
              else:
                  code=payload.get("code") or payload.get("Code")
                  msg=payload.get("message") or payload.get("Message") or (err if isinstance(err, str) else None)
              result={}
              if code:
                  result["code"]=str(code)[:120]
              if msg:
                  result["message"]=str(msg).replace("\n"," ")[:300]
              return result or None

          p=Path("audit/oidc/oidc-probe.json")
          d=json.loads(p.read_text())
          d["checks"][sys.argv[1]]={
              "token_acquired": True,
              "http_status": int(sys.argv[2] or 0),
              "transport_ok": int(sys.argv[3]) == 0,
              "claims": claims(os.environ["TOKEN"]),
              "error": safe_error(os.environ["BODY_PATH"]),
          }
          p.write_text(json.dumps(d, indent=2)+"\n")
          PY
          }

          probe graph "https://graph.microsoft.com/" "https://graph.microsoft.com/v1.0/sites/root?\$select=id"
          probe power_platform "https://api.powerplatform.com/" "https://api.powerplatform.com/environmentmanagement/environments?api-version=2024-10-01"
          probe flow "https://service.flow.microsoft.com/" "https://api.flow.microsoft.com/providers/Microsoft.ProcessSimple/environments/$ENVIRONMENT_ID/flows?api-version=2016-11-01"
          probe dataverse "$DATAVERSE_URL/" "$DATAVERSE_URL/api/data/v9.2/workflows?\$select=workflowid,name,statecode,statuscode&\$top=1"

          cat audit/oidc/oidc-probe.json

      - name: Publicar evidência OIDC
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: powerplatform-oidc-probe-${{ github.run_id }}
          path: audit/oidc/oidc-probe.json
          if-no-files-found: error
          retention-days: 7
