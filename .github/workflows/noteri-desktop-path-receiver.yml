name: Noteri Desktop Path Receiver

on:
  push:
    branches:
      - "fix/noteri-desktop-path-receiver-*"
    paths:
      - "scripts/noteri_desktop_path_receiver.py"
      - "tests/test_noteri_desktop_path_receiver.py"
      - ".github/workflows/noteri-desktop-path-receiver.yml"

permissions:
  contents: read

concurrency:
  group: noteri-desktop-path-receiver-${{ github.ref }}
  cancel-in-progress: true

jobs:
  receive:
    name: Receive sanitized Desktop paths on Noteri
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 6
    env:
      TARGET_REPO: ${{ github.workspace }}
      RULES_SHA: 5d1f603241dde37a597d2b7bdc5e07425db7b451
      CORRELATION_ID: noteri-desktop-paths-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\\noteri-desktop-paths\\evidence.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $syncRef = "origin/$env:GITHUB_REF_NAME"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "noteri-desktop-paths",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", $syncRef
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Validate receiver tests through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          & python $gateway --policy $policy --correlation-id "$env:CORRELATION_ID-tests" run --cwd $env:TARGET_PATH --session-id $env:SESSION_ID --risk 1 --timeout 60 --expected-head $env:ANCHOR_SHA -- pytest tests/test_noteri_desktop_path_receiver.py -q
          exit $LASTEXITCODE

      - name: Receive one sanitized Desktop path payload
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          $receiver = Join-Path $env:TARGET_PATH "scripts\\noteri_desktop_path_receiver.py"
          & python $gateway --policy $policy --correlation-id $env:CORRELATION_ID run --cwd $env:TARGET_PATH --session-id $env:SESSION_ID --risk 2 --timeout 300 --expected-head $env:ANCHOR_SHA -- python $receiver --confirm RECEIVE-DESKTOP-PATHS --correlation-id $env:CORRELATION_ID --evidence-file $env:EVIDENCE_REL --port 8766 --timeout-seconds 240
          exit $LASTEXITCODE

      - name: Upload sanitized evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-desktop-paths-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\\artifacts\\noteri-desktop-paths\\evidence.json
          if-no-files-found: warn
          retention-days: 7
