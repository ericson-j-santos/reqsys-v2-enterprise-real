name: PC24x7 Teams Bot Secret Relay DEV

on:
  push:
    branches:
      - ops/pc24x7-runner-recovery-20260919
    paths:
      - '.github/workflows/pc24x7-teams-secret-relay-dev.yml'

permissions:
  contents: read
  id-token: write

concurrency:
  group: pc24x7-teams-secret-relay-dev
  cancel-in-progress: false

jobs:
  relay-existing-secret:
    name: Relay existing Teams Bot secret to PC24x7 DEV
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 15
    env:
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      EXPECTED_BOT_APP_ID: cc233a8b-e2dc-425c-bbb2-afcc876a865d
      RELAY_URL: https://gdp-rapid-ground-jail.trycloudflare.com/relay/-9rctLL90_FMyqkLXU-5yYg6uSty4-Mj
      RELAY_PUBLIC_KEY_B64: 
    steps:
      - name: Checkout immutable relay SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate governed OIDC configuration
        shell: bash
        run: |
          set -euo pipefail
          for name in CCP_AZURE_CLIENT_ID CCP_AZURE_TENANT_ID CCP_AZURE_SUBSCRIPTION_ID REQSYS_KEY_VAULT_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name is not configured"
              exit 2
            fi
          done

      - name: Login Azure by existing development OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Install cryptography only on ephemeral GitHub host
        run: python -m pip install --disable-pip-version-check cryptography==50.0.0

      - name: Relay existing credential encrypted
        shell: bash
        run: |
          set -euo pipefail
          python scripts/relay_teams_bot_secret_from_keyvault.py \
            --vault-name "$REQSYS_KEY_VAULT_NAME" \
            --secret-name reqsys-teams-bot-dev-secret \
            --expected-app-id "$EXPECTED_BOT_APP_ID" \
            --tenant-id "$CCP_AZURE_TENANT_ID" \
            --relay-url "$RELAY_URL" \
            --public-key-b64 "$RELAY_PUBLIC_KEY_B64"
