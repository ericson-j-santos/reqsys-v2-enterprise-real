name: Teams Notification Observability

on:
  workflow_run:
    workflows:
      - Teams Commit Notification
    types:
      - completed
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  issues: write

concurrency:
  group: teams-notification-observability
  cancel-in-progress: false

jobs:
  observe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      INCIDENT_TITLE: "[Teams] Falha na notificação de commits"
      OBSERVABILITY_TITLE: "[Teams] Observabilidade da notificação indisponível"

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Gerar evidência operacional
        id: evidence
        env:
          EVENT_NAME: ${{ github.event_name }}
          WORKFLOW_NAME: ${{ github.event.workflow_run.name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_EVENT: ${{ github.event.workflow_run.event }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          HEAD_BRANCH: ${{ github.event.workflow_run.head_branch }}
        shell: bash
        run: |
          python - <<'PY'
          from __future__ import annotations

          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          from scripts.teams_notification_event_policy import workflow_run_delivery_decision

          manual = os.environ["EVENT_NAME"] == "workflow_dispatch"
          conclusion = "manual_validation" if manual else (os.environ.get("RUN_CONCLUSION") or "unknown")
          run_id = "manual" if manual else (os.environ.get("RUN_ID") or "unknown")
          run_url = (
              f"https://github.com/{os.environ['REPOSITORY']}/actions"
              if manual
              else os.environ.get("RUN_URL", "")
          )
          jobs_payload = None
          if not manual:
              try:
                  jobs = []
                  total_count = None
                  for page in range(1, 101):
                      request = Request(
                          f"https://api.github.com/repos/{os.environ['REPOSITORY']}/actions/runs/{run_id}/jobs?filter=latest&per_page=100&page={page}",
                          headers={
                              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
                              "Accept": "application/vnd.github+json",
                              "X-GitHub-Api-Version": "2022-11-28",
                          },
                      )
                      with urlopen(request, timeout=30) as response:
                          page_payload = json.load(response)
                      if not isinstance(page_payload, dict) or not isinstance(page_payload.get("jobs"), list):
                          raise ValueError("invalid jobs response")
                      if total_count is None:
                          total_count = page_payload.get("total_count")
                      jobs.extend(page_payload["jobs"])
                      if isinstance(total_count, int) and len(jobs) >= total_count:
                          break
                  jobs_payload = {"total_count": total_count, "jobs": jobs}
              except (HTTPError, URLError, TimeoutError, ValueError, json.JSONDecodeError):
                  jobs_payload = None
          delivery_state, delivery_reason = (
              ("manual", "manual_validation")
              if manual
              else workflow_run_delivery_decision(
                  int(run_id), os.environ.get("HEAD_SHA", ""), jobs_payload
              )
          )
          recovery_confirmed = not manual and conclusion == "success" and delivery_state == "delivered"
          suppressed = not manual and delivery_state == "suppressed"
          observation_unavailable = not manual and delivery_state == "observation_unavailable"
          incident_required = (
              not manual
              and not recovery_confirmed
              and not suppressed
              and not observation_unavailable
          )
          healthy = manual or recovery_confirmed
          payload = {
              "schema_version": "1.0.0",
              "observed_at_utc": datetime.now(timezone.utc).isoformat(),
              "repository": os.environ["REPOSITORY"],
              "workflow": "Teams Commit Notification" if manual else os.environ.get("WORKFLOW_NAME"),
              "run_id": run_id,
              "run_url": run_url,
              "event": "workflow_dispatch" if manual else os.environ.get("RUN_EVENT"),
              "conclusion": conclusion,
              "head_sha": "manual" if manual else os.environ.get("HEAD_SHA"),
              "head_branch": "manual" if manual else os.environ.get("HEAD_BRANCH"),
              "healthy": healthy,
              "delivery_state": delivery_state,
              "delivery_reason": delivery_reason,
              "recovery_confirmed": recovery_confirmed,
              "incident_required": incident_required,
              "observation_unavailable": observation_unavailable,
              "suppressed": suppressed,
          }
          Path("evidence").mkdir(exist_ok=True)
          Path("evidence/teams-notification-delivery.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"conclusion={conclusion}\n")
              output.write(f"run_id={run_id}\n")
              output.write(f"run_url={run_url}\n")
              output.write(f"healthy={'true' if payload['healthy'] else 'false'}\n")
              output.write(f"delivery_state={delivery_state}\n")
              output.write(f"delivery_reason={delivery_reason}\n")
              output.write(f"recovery_confirmed={'true' if recovery_confirmed else 'false'}\n")
              output.write(f"incident_required={'true' if incident_required else 'false'}\n")
              output.write(f"observation_unavailable={'true' if observation_unavailable else 'false'}\n")
              output.write(f"suppressed={'true' if suppressed else 'false'}\n")
          print(json.dumps(payload, ensure_ascii=False, indent=2))
          PY

      - name: Publicar evidência
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: teams-notification-evidence-${{ steps.evidence.outputs.run_id }}
          path: evidence/teams-notification-delivery.json
          retention-days: 30

      - name: Abrir ou atualizar incidente
        if: steps.evidence.outputs.incident_required == 'true'
        env:
          CONCLUSION: ${{ steps.evidence.outputs.conclusion }}
          RUN_URL: ${{ steps.evidence.outputs.run_url }}
          RUN_ID: ${{ steps.evidence.outputs.run_id }}
          DELIVERY_REASON: ${{ steps.evidence.outputs.delivery_reason }}
        shell: bash
        run: |
          body=$(cat <<EOF
          ## Falha automática na entrega ao Microsoft Teams

          - Conclusão: **${CONCLUSION}**
          - Workflow run: ${RUN_URL}
          - Run ID: ${RUN_ID}
          - Evidência de entrega: **${DELIVERY_REASON}**
          - Detectado em: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          A automação de commits não confirmou entrega ao Teams. Validar primeiro o secret \`TEAMS_WEBHOOK_URL\`, a disponibilidade do Workflow/Webhook no canal e o log do gateway.
          EOF
          )

          issue_number=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --search "${INCIDENT_TITLE} in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${INCIDENT_TITLE}\") | .number" \
            | head -n1)

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$INCIDENT_TITLE" --body "$body"
          fi

      - name: Registrar falha de observabilidade
        if: steps.evidence.outputs.observation_unavailable == 'true'
        env:
          RUN_URL: ${{ steps.evidence.outputs.run_url }}
          RUN_ID: ${{ steps.evidence.outputs.run_id }}
          DELIVERY_REASON: ${{ steps.evidence.outputs.delivery_reason }}
        shell: bash
        run: |
          body=$(cat <<EOF
          ## Observabilidade da notificação indisponível

          - Workflow run: ${RUN_URL}
          - Run ID: ${RUN_ID}
          - Motivo sanitizado: **${DELIVERY_REASON}**
          - Detectado em: $(date -u +'%Y-%m-%dT%H:%M:%SZ')

          Não foi possível determinar o estado da entrega ao Teams. Este registro não afirma falha de entrega e não autoriza fechar o incidente de entrega.
          EOF
          )

          issue_number=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --search "${OBSERVABILITY_TITLE} in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${OBSERVABILITY_TITLE}\") | .number" \
            | head -n1)

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" --repo "$REPOSITORY" --body "$body"
          else
            gh issue create --repo "$REPOSITORY" --title "$OBSERVABILITY_TITLE" --body "$body"
          fi

      - name: Fechar incidente após recuperação
        if: steps.evidence.outputs.recovery_confirmed == 'true' && github.event_name == 'workflow_run'
        env:
          RUN_URL: ${{ steps.evidence.outputs.run_url }}
        shell: bash
        run: |
          issue_number=$(gh issue list \
            --repo "$REPOSITORY" \
            --state open \
            --search "${INCIDENT_TITLE} in:title" \
            --json number,title \
            --jq ".[] | select(.title == \"${INCIDENT_TITLE}\") | .number" \
            | head -n1)

          if [[ -n "$issue_number" ]]; then
            gh issue comment "$issue_number" \
              --repo "$REPOSITORY" \
              --body "Recuperação confirmada por entrega real ao Teams: ${RUN_URL}"
            gh issue close "$issue_number" \
              --repo "$REPOSITORY" \
              --reason completed
          fi

      - name: Resumo operacional
        shell: bash
        run: |
          {
            echo "### Teams Notification Observability"
            echo "- Saudável: ${{ steps.evidence.outputs.healthy }}"
            echo "- Conclusão: ${{ steps.evidence.outputs.conclusion }}"
            echo "- Estado de entrega: ${{ steps.evidence.outputs.delivery_state }}"
            echo "- Motivo: ${{ steps.evidence.outputs.delivery_reason }}"
            echo "- Suprimido sem mudança material: ${{ steps.evidence.outputs.suppressed }}"
            echo "- Observação indisponível: ${{ steps.evidence.outputs.observation_unavailable }}"
            echo "- Execução observada: ${{ steps.evidence.outputs.run_url }}"
            echo "- Evidência: artifact teams-notification-evidence-${{ steps.evidence.outputs.run_id }}"
          } >> "$GITHUB_STEP_SUMMARY"
