name: PC24x7 Teams Ephemeral E2E — DEV

on:
  workflow_dispatch:
    inputs:
      auth_mode:
        description: Autenticação da prova conversacional DEV.
        required: true
        default: scoped-service-token
        type: choice
        options:
          - scoped-service-token
          - ephemeral-admin
      diagnose_main_runtime:
        description: Executa o script da ref selecionada contra o SHA vigente da main.
        required: false
        default: false
        type: boolean
  pull_request:
    paths:
      - '.github/workflows/pc24x7-teams-ephemeral-e2e.yml'
      - 'scripts/pc24x7_teams_ephemeral_e2e.py'
      - 'scripts/resolve_pc24x7_dev_locator.mjs'
      - 'scripts/pc24x7_teams_queue.py'
      - 'tests/test_pc24x7_teams_ephemeral_e2e.py'
      - 'tests/test_pc24x7_teams_ephemeral_provider_selection.py'
      - 'tests/test_pc24x7_teams_ephemeral_e2e_workflow.py'
      - 'tests/test_pc24x7_teams_queue.py'

permissions:
  contents: read

jobs:
  contract:
    name: Contrato do E2E efêmero
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Executar testes focados
        run: |
          python -m pip install --disable-pip-version-check pytest
          python -m pytest -q \
            tests/test_pc24x7_teams_ephemeral_e2e.py \
            tests/test_pc24x7_teams_ephemeral_provider_selection.py \
            tests/test_pc24x7_teams_ephemeral_e2e_workflow.py \
            tests/test_pc24x7_teams_queue.py

  e2e-dev:
    name: Readiness + Teams real + revogação — DEV
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    permissions:
      contents: read
      id-token: write
    env:
      COFRE_ADMIN_JWT: ${{ inputs.auth_mode == 'ephemeral-admin' && secrets.COFRE_ADMIN_JWT || '' }}
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      PC24X7_TEAMS_E2E_AUTH_MODE: ${{ inputs.auth_mode || 'scoped-service-token' }}
      PC24X7_TEAMS_E2E_CORRELATION_ID: pc24x7-ephemeral-${{ github.run_id }}-${{ github.run_attempt }}
      # Gemini é o provedor primário configurado no ReqSys. Groq permanece visível
      # no readiness e sua degradação HTTP 502 é tratada separadamente, sem bloquear
      # a prova ponta a ponta do canal Teams.
      PC24X7_TEAMS_E2E_PROVIDER: gemini
      PC24X7_TEAMS_E2E_MODEL: gemini-2.5-flash
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Preparar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Preparar Node para locator DEV assinado
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '20'

      - name: Validar contrato fail-closed do locator
        shell: bash
        run: node scripts/resolve_pc24x7_dev_locator.mjs --self-test

      - name: Resolver runtime PC24x7 DEV vigente
        id: locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pc24x7-teams-ephemeral-e2e
          node scripts/resolve_pc24x7_dev_locator.mjs             --output artifacts/pc24x7-teams-ephemeral-e2e/signed-locator.json

      - name: Validar runtime PC24x7 no mesmo SHA
        shell: bash
        env:
          REQSYS_API_BASE_URL: ${{ steps.locator.outputs.base_url }}
          EXPECTED_SHA: ${{ github.sha }}
          DIAGNOSE_MAIN_RUNTIME: ${{ inputs.diagnose_main_runtime || 'false' }}
        run: |
          set -euo pipefail
          if [[ "$DIAGNOSE_MAIN_RUNTIME" == "true" ]]; then
            EXPECTED_SHA="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
            [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]] || {
              echo "main_head_sha_unavailable" >&2
              exit 1
            }
            export EXPECTED_SHA
          fi
          python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          base = os.environ['REQSYS_API_BASE_URL'].rstrip('/')
          expected = os.environ['EXPECTED_SHA'].strip().lower()
          request = Request(
              base + '/api/runtime/build-info',
              headers={'Accept': 'application/json', 'User-Agent': 'reqsys-teams-pc24x7-e2e/1.0'},
          )
          with urlopen(request, timeout=20) as response:
              payload = json.loads(response.read(262_144).decode('utf-8'))
          data = payload.get('data', payload) if isinstance(payload, dict) else {}
          observed = str(data.get('build_sha') or data.get('commit_sha') or '').strip().lower()
          if observed != expected:
              raise SystemExit(f'pc24x7_runtime_sha_mismatch:expected={expected}:observed={observed}')
          print(f'PC24x7 runtime SHA validado: {observed}')
          PY

      - name: Exportar runtime PC24x7 DEV
        shell: bash
        env:
          RESOLVED_API_BASE: ${{ steps.locator.outputs.base_url }}
        run: |
          set -euo pipefail
          test -n "$RESOLVED_API_BASE"
          printf 'REQSYS_API_BASE_URL=%s\n' "$RESOLVED_API_BASE" >> "$GITHUB_ENV"

      - name: Validar configuração OIDC para token S2S
        if: inputs.auth_mode == 'scoped-service-token'
        shell: bash
        run: |
          set -euo pipefail
          for name in REQSYS_KEY_VAULT_NAME CCP_AZURE_CLIENT_ID CCP_AZURE_TENANT_ID CCP_AZURE_SUBSCRIPTION_ID; do
            [[ -n "${!name:-}" ]] || {
              echo "::error::${name} não configurado; prova S2S permanece fail-closed."
              exit 2
            }
          done

      - name: Login Azure por OIDC para leitura do token S2S DEV
        if: inputs.auth_mode == 'scoped-service-token'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Carregar token S2S escopado sem expor valor
        if: inputs.auth_mode == 'scoped-service-token'
        shell: bash
        run: |
          set -euo pipefail
          token="$(az keyvault secret show \
            --vault-name "$REQSYS_KEY_VAULT_NAME" \
            --name reqsys-pc24x7-teams-service-token \
            --query value \
            --output tsv \
            --only-show-errors)"
          [[ -n "$token" ]] || {
            echo "::error::Token S2S DEV ausente; prova permanece fail-closed."
            exit 3
          }
          echo "::add-mask::$token"
          printf 'REQSYS_TEAMS_SERVICE_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"
          token=''

      - name: Executar E2E DEV com autenticação governada
        shell: bash
        run: |
          set +e
          python scripts/pc24x7_teams_ephemeral_e2e.py \
            --auth-mode "$PC24X7_TEAMS_E2E_AUTH_MODE" \
            --evidence-path artifacts/pc24x7-teams-ephemeral-e2e/evidence.json
          exit_code=$?
          set -e
          printf 'REQSYS_TEAMS_SERVICE_TOKEN=\n' >> "$GITHUB_ENV"
          unset REQSYS_TEAMS_SERVICE_TOKEN
          exit "$exit_code"

      - name: Publicar somente evidência sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: pc24x7-teams-ephemeral-e2e-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            artifacts/pc24x7-teams-ephemeral-e2e/evidence.json
            artifacts/pc24x7-teams-ephemeral-e2e/signed-locator.json
          if-no-files-found: warn
          retention-days: 30
