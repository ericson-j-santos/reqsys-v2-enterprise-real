name: Noteri CORS Regression
on:
  push:
    branches: [fix/noteri-profile-cors-cache-control-20261011]
    paths:
      - frontend/src/services/hostProfileLocalAgent.js
      - frontend/src/services/__tests__/hostProfileLocalAgent.test.js
      - .github/workflows/noteri-cors-regression.yml
permissions:
  contents: read
concurrency:
  group: noteri-cors-regression
  cancel-in-progress: true
jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 16
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install exact frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund
      - name: Unit regression for browser profile readback
        working-directory: frontend
        run: npx vitest run src/services/__tests__/hostProfileLocalAgent.test.js --reporter=verbose
      - name: Compile production Pages frontend
        working-directory: frontend
        env:
          VITE_BASE_PATH: /reqsys-v2-enterprise-real/dev/
          VITE_PUBLIC_URL: https://ericson-j-santos.github.io/reqsys-v2-enterprise-real/dev
          VITE_MSAL_PUBLIC_ORIGIN: https://ericson-j-santos.github.io/reqsys-v2-enterprise-real/dev
          VITE_MSAL_CALLBACK_PATH: /auth/callback.html
          VITE_MSAL_POST_LOGOUT_PATH: /login
          VITE_MSAL_LOGIN_REDIRECT_START_PATH: /login
        run: |
          set -euo pipefail
          npm run build
          test -s dist/index.html
          test -s dist/auth/callback.html
          if ! grep -Rq '_noteri_cache_bust' dist/assets; then
            echo "::error::Noteri GET cache-bust was not emitted in production bundle"
            exit 2
          fi
          echo "frontend_profile_cors_contract=validated"
