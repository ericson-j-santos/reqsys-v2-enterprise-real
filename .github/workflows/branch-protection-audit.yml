name: Branch Protection Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo governado de execução"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - apply-observability-platform
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read
  checks: read

concurrency:
  group: branch-protection-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: main
  REPORT_DIR: ci-reports/branch-protection

jobs:
  audit:
    name: Auditar proteção enterprise da branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar baseline versionável
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"

          STATUS="OK"
          FAILURES=""

          require_file() {
            local path="$1"
            local description="$2"
            if [ ! -f "$path" ]; then
              STATUS="FAIL"
              FAILURES="$FAILURES\n- Ausente: $description ($path)"
            fi
          }

          require_contains() {
            local path="$1"
            local pattern="$2"
            local description="$3"
            if ! grep -Eq "$pattern" "$path"; then
              STATUS="FAIL"
              FAILURES="$FAILURES\n- Incompleto: $description ($path)"
            fi
          }

          require_file ".github/CODEOWNERS" "CODEOWNERS enterprise"
          require_file "docs/governance/branch-protection-enterprise-baseline.md" "documentação canônica de branch protection"

          if [ -f ".github/CODEOWNERS" ]; then
            require_contains ".github/CODEOWNERS" "@ericson-j-santos" "owner técnico definido"
            require_contains ".github/CODEOWNERS" "^/.github/workflows/" "ownership de workflows"
          fi

          if [ -f "docs/governance/branch-protection-enterprise-baseline.md" ]; then
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Required status checks" "checks obrigatórios documentados"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Required approvals" "aprovações obrigatórias documentadas"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Merge queue" "merge queue documentada"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Auto-merge" "auto-merge documentado"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Bypass permissions" "permissões de bypass documentadas"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Block force pushes" "bloqueio de force push documentado"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Squash merge" "política de squash merge documentada"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Checklist de confirmação final" "confirmação final da main documentada"
          fi

          {
            echo "# Branch Protection Audit"
            echo
            echo "| Item | Resultado |"
            echo "|---|---|"
            echo "| Branch alvo | \`$TARGET_BRANCH\` |"
            echo "| Baseline versionável | \`$STATUS\` |"
            echo "| CODEOWNERS | \`$(test -f .github/CODEOWNERS && echo presente || echo ausente)\` |"
            echo "| Documento canônico | \`$(test -f docs/governance/branch-protection-enterprise-baseline.md && echo presente || echo ausente)\` |"
            echo "| Required status checks | \`documentado\` |"
            echo "| Required approvals | \`documentado\` |"
            echo "| Merge queue | \`documentado\` |"
            echo "| Auto-merge | \`documentado\` |"
            echo "| Bypass permissions | \`documentado\` |"
            echo
            echo "## Falhas"
            echo
            if [ -n "$FAILURES" ]; then
              printf "%b\n" "$FAILURES"
            else
              echo "Nenhuma falha versionável detectada."
            fi
            echo
            echo "## Observação"
            echo
            echo "A confirmação efetiva de ruleset/branch protection depende das permissões administrativas do token/usuário no GitHub."
          } > "$REPORT_DIR/branch-protection-baseline.md"

          cat "$REPORT_DIR/branch-protection-baseline.md" >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "OK" ]; then
            exit 1
          fi

      - name: Publicar evidência de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-protection-audit
          path: ci-reports/branch-protection/
          if-no-files-found: error
          retention-days: 30

  apply-observability-platform:
    name: Proteger observability-platform/main
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply-observability-platform' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ secrets.GITHUB_PAT }}
      TARGET_REPOSITORY: ericson-j-santos/observability-platform
      TARGET_BRANCH: main
      EXPECTED_TARGET_SHA: a13450360b85676f40932019119137d89313c58e
      REQUIRED_CHECK: test
      EVIDENCE_DIR: ci-reports/branch-protection/observability-platform
    steps:
      - name: Validar alvo exato e evidência do check
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN" || { echo "GITHUB_PAT_NOT_AVAILABLE" >&2; exit 2; }
          mkdir -p "$EVIDENCE_DIR"
          current_sha="$(gh api "repos/$TARGET_REPOSITORY/commits/$TARGET_BRANCH" --jq '.sha')"
          test "$current_sha" = "$EXPECTED_TARGET_SHA" || {
            echo "TARGET_SHA_CHANGED expected=$EXPECTED_TARGET_SHA actual=$current_sha" >&2
            exit 3
          }
          check_state="$(gh api             -H "Accept: application/vnd.github+json"             "repos/$TARGET_REPOSITORY/commits/$EXPECTED_TARGET_SHA/check-runs"             --jq '.check_runs[] | select(.name == env.REQUIRED_CHECK) | [.status, .conclusion] | @tsv' | tail -n 1)"
          test "$check_state" = $'completed\tsuccess' || {
            echo "REQUIRED_CHECK_NOT_GREEN check=$REQUIRED_CHECK state=$check_state" >&2
            exit 4
          }

      - name: Aplicar proteção mínima governada
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > "$EVIDENCE_DIR/request.json"
          import json
          print(json.dumps({
              "required_status_checks": {
                  "strict": True,
                  "contexts": ["test"],
              },
              "enforce_admins": True,
              "required_pull_request_reviews": {
                  "dismiss_stale_reviews": False,
                  "require_code_owner_reviews": False,
                  "required_approving_review_count": 0,
                  "require_last_push_approval": False,
              },
              "restrictions": None,
              "required_linear_history": False,
              "allow_force_pushes": False,
              "allow_deletions": False,
              "block_creations": False,
              "required_conversation_resolution": False,
              "lock_branch": False,
              "allow_fork_syncing": False,
          }, separators=(",", ":")))
          PY
          gh api             --method PUT             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "repos/$TARGET_REPOSITORY/branches/$TARGET_BRANCH/protection"             --input "$EVIDENCE_DIR/request.json"             > "$EVIDENCE_DIR/update-response.json"

      - name: Revalidar proteção por leitura independente
        shell: bash
        run: |
          set -euo pipefail
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2026-03-10"             "repos/$TARGET_REPOSITORY/branches/$TARGET_BRANCH/protection"             > "$EVIDENCE_DIR/protection-after.json"
          protected="$(gh api "repos/$TARGET_REPOSITORY/branches/$TARGET_BRANCH" --jq '.protected')"
          test "$protected" = "true" || { echo "BRANCH_NOT_PROTECTED" >&2; exit 5; }
          python - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ["EVIDENCE_DIR"])
          payload = json.loads((root / "protection-after.json").read_text(encoding="utf-8"))
          contexts = set((payload.get("required_status_checks") or {}).get("contexts") or [])
          if os.environ["REQUIRED_CHECK"] not in contexts:
              raise SystemExit("REQUIRED_CHECK_MISSING")
          if not (payload.get("enforce_admins") or {}).get("enabled"):
              raise SystemExit("ADMIN_ENFORCEMENT_DISABLED")
          if payload.get("required_pull_request_reviews") is None:
              raise SystemExit("PULL_REQUEST_REQUIREMENT_MISSING")
          if (payload.get("allow_force_pushes") or {}).get("enabled"):
              raise SystemExit("FORCE_PUSH_STILL_ALLOWED")
          if (payload.get("allow_deletions") or {}).get("enabled"):
              raise SystemExit("BRANCH_DELETION_STILL_ALLOWED")

          evidence = {
              "status": "PROTECTION_APPLIED",
              "repository": os.environ["TARGET_REPOSITORY"],
              "branch": os.environ["TARGET_BRANCH"],
              "expected_sha": os.environ["EXPECTED_TARGET_SHA"],
              "required_check": os.environ["REQUIRED_CHECK"],
              "pull_request_required": True,
              "enforce_admins": True,
              "force_push_allowed": False,
              "deletion_allowed": False,
              "secret_value_exposed": False,
              "production_touched": False,
          }
          (root / "evidence.json").write_text(
              json.dumps(evidence, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(evidence, sort_keys=True))
          PY

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-platform-main-protection-${{ github.run_id }}
          path: |
            ci-reports/branch-protection/observability-platform/evidence.json
            ci-reports/branch-protection/observability-platform/protection-after.json
          if-no-files-found: warn
          retention-days: 30
