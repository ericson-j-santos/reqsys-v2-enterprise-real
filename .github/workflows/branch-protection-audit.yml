name: Branch Protection Audit

on:
  push:
    branches:
      - ops/report-builder-main-protection-20260923
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo governado de execução"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - apply-observability-platform
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read
  checks: read

concurrency:
  group: branch-protection-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: main
  REPORT_DIR: ci-reports/branch-protection

jobs:
  audit:
    name: Auditar proteção enterprise da branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar baseline versionável
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"

          STATUS="OK"
          FAILURES=""

          require_file() {
            local path="$1"
            local description="$2"
            if [ ! -f "$path" ]; then
              STATUS="FAIL"
              FAILURES="$FAILURES\n- Ausente: $description ($path)"
            fi
          }

          require_contains() {
            local path="$1"
            local pattern="$2"
            local description="$3"
            if ! grep -Eq "$pattern" "$path"; then
              STATUS="FAIL"
              FAILURES="$FAILURES\n- Incompleto: $description ($path)"
            fi
          }

          require_file ".github/CODEOWNERS" "CODEOWNERS enterprise"
          require_file "docs/governance/branch-protection-enterprise-baseline.md" "documentação canônica de branch protection"

          if [ -f ".github/CODEOWNERS" ]; then
            require_contains ".github/CODEOWNERS" "@ericson-j-santos" "owner técnico definido"
            require_contains ".github/CODEOWNERS" "^/.github/workflows/" "ownership de workflows"
          fi

          if [ -f "docs/governance/branch-protection-enterprise-baseline.md" ]; then
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Required status checks" "checks obrigatórios documentados"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Required approvals" "aprovações obrigatórias documentadas"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Merge queue" "merge queue documentada"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Auto-merge" "auto-merge documentado"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Bypass permissions" "permissões de bypass documentadas"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Block force pushes" "bloqueio de force push documentado"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Squash merge" "política de squash merge documentada"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Checklist de confirmação final" "confirmação final da main documentada"
          fi

          {
            echo "# Branch Protection Audit"
            echo
            echo "| Item | Resultado |"
            echo "|---|---|"
            echo "| Branch alvo | \`$TARGET_BRANCH\` |"
            echo "| Baseline versionável | \`$STATUS\` |"
            echo "| CODEOWNERS | \`$(test -f .github/CODEOWNERS && echo presente || echo ausente)\` |"
            echo "| Documento canônico | \`$(test -f docs/governance/branch-protection-enterprise-baseline.md && echo presente || echo ausente)\` |"
            echo "| Required status checks | \`documentado\` |"
            echo "| Required approvals | \`documentado\` |"
            echo "| Merge queue | \`documentado\` |"
            echo "| Auto-merge | \`documentado\` |"
            echo "| Bypass permissions | \`documentado\` |"
            echo
            echo "## Falhas"
            echo
            if [ -n "$FAILURES" ]; then
              printf "%b\n" "$FAILURES"
            else
              echo "Nenhuma falha versionável detectada."
            fi
            echo
            echo "## Observação"
            echo
            echo "A confirmação efetiva de ruleset/branch protection depende das permissões administrativas do token/usuário no GitHub."
          } > "$REPORT_DIR/branch-protection-baseline.md"

          cat "$REPORT_DIR/branch-protection-baseline.md" >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "OK" ]; then
            exit 1
          fi

      - name: Publicar evidência de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-protection-audit
          path: ci-reports/branch-protection/
          if-no-files-found: error
          retention-days: 30

  apply-observability-platform:
    name: Proteger observability-platform/main via Noteri Risk3
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply-observability-platform' }}
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 12
    env:
      TARGET_REPO: C:\dev\reqsys-v2-enterprise-real
      CORRELATION_ID: observability-main-protection-${{ github.run_id }}-${{ github.run_attempt }}
      ACTION_ID: reqsys.observability-main-protection.dev
      ACTION_SCOPE: repo://ericson-j-santos/observability-platform/branch/main
      EVIDENCE_REL: artifacts/observability-main-protection-noteri/evidence.json
    steps:
      - name: Checkout regras canônicas
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: main
          path: _rules
          fetch-depth: 1

      - name: Validar host Noteri exato
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME.ToLowerInvariant() -ne "noteri") {
            throw "UNEXPECTED_HOST"
          }

      - name: Bootstrap obrigatório de sessão
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "obs-protect",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/main"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT

      - name: Instalar autorização Risk3 exata e temporária
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_observability_main_protection_risk3.py `
              --enable `
              --ttl-minutes 30 `
              --confirm ENABLE-OBSERVABILITY-MAIN-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Aplicar proteção via Owner Risk3 Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\owner_risk3_gateway.py"
          $riskArgs = @(
            "--action-id", $env:ACTION_ID,
            "--scope", $env:ACTION_SCOPE,
            "--cwd", $env:TARGET_PATH,
            "--timeout", "300",
            "--correlation-id", $env:CORRELATION_ID
          )
          & python $gateway @riskArgs
          exit $LASTEXITCODE

      - name: Remover autorização Risk3 temporária
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_RISK3_CLEANUP" }
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_observability_main_protection_risk3.py `
              --disable `
              --confirm DISABLE-OBSERVABILITY-MAIN-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Validar evidência sanitizada
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_EVIDENCE" }
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path $evidence)) { throw "PROTECTION_EVIDENCE_MISSING" }
          $data = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
          if ($data.status -notin @("PROTECTION_APPLIED", "ALREADY_COMPLIANT")) { throw "PROTECTION_NOT_CONFIRMED" }
          if ($data.repository -ne "ericson-j-santos/observability-platform") { throw "TARGET_REPOSITORY_MISMATCH" }
          if ($data.branch -ne "main") { throw "TARGET_BRANCH_MISMATCH" }
          if ($data.required_check -ne "test") { throw "REQUIRED_CHECK_MISMATCH" }
          if (-not $data.protected) { throw "BRANCH_NOT_PROTECTED" }
          if (-not $data.pull_request_required) { throw "PULL_REQUEST_NOT_REQUIRED" }
          if ($data.force_push_allowed) { throw "FORCE_PUSH_ALLOWED" }
          if ($data.deletion_allowed) { throw "BRANCH_DELETION_ALLOWED" }
          if ($data.secret_value_exposed) { throw "SECRET_EXPOSURE_REPORTED" }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-platform-main-protection-noteri-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\observability-main-protection-noteri\evidence.json
          if-no-files-found: warn
          retention-days: 30

  validate-report-builder-protection-helper:
    name: Validar helper de proteção Report Builder via Noteri Gateway
    if: ${{ github.event_name == 'push' && github.ref_name == 'ops/report-builder-main-protection-20260923' }}
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    env:
      TARGET_REPO: C:\dev\reqsys-v2-enterprise-real
      CORRELATION_ID: report-builder-protection-validate-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout regras canônicas para validação
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: main
          path: _rules
          fetch-depth: 1

      - name: Validar host Noteri exato para helper
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME.ToLowerInvariant() -ne "noteri") {
            throw "UNEXPECTED_HOST"
          }

      - name: Bootstrap obrigatório de sessão para validação
        id: helper_session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $syncRef = "origin/${{ github.ref_name }}"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "report-builder-validate",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", $syncRef
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT

      - name: Validar executores e contrato via Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.helper_session.outputs.target_path }}
          SESSION_ID: ${{ steps.helper_session.outputs.session_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $commands = @(
            @("python", "-B", "scripts/run_report_builder_main_protection_local.py", "--help"),
            @("python", "-B", "scripts/configure_report_builder_main_protection_risk3.py", "--help"),
            @("python", "-B", "tests/test_report_builder_branch_protection_noteri.py")
          )
          $index = 0
          foreach ($command in $commands) {
            $index += 1
            $gatewayArgs = @(
              "--policy", $policy,
              "--correlation-id", "$env:CORRELATION_ID-$index",
              "run",
              "--cwd", $env:TARGET_PATH,
              "--session-id", $env:SESSION_ID,
              "--risk", "1",
              "--"
            ) + $command
            & python $gateway @gatewayArgs
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

  apply-report-builder-platform:
    name: Proteger report-builder-platform/main via Noteri Risk3
    needs: validate-report-builder-protection-helper
    if: ${{ github.event_name == 'push' && github.ref_name == 'ops/report-builder-main-protection-20260923' }}
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 12
    env:
      TARGET_REPO: C:\dev\reqsys-v2-enterprise-real
      CORRELATION_ID: report-builder-main-protection-${{ github.run_id }}-${{ github.run_attempt }}
      ACTION_ID: reqsys.report-builder-main-protection.dev
      ACTION_SCOPE: repo://ericson-j-santos/report-builder-platform/branch/main
      EVIDENCE_REL: artifacts/report-builder-main-protection-noteri/evidence.json
    steps:
      - name: Checkout regras canônicas
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: main
          path: _rules
          fetch-depth: 1

      - name: Validar host Noteri exato
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME.ToLowerInvariant() -ne "noteri") {
            throw "UNEXPECTED_HOST"
          }

      - name: Bootstrap obrigatório de sessão Report Builder
        id: report_builder_session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $syncRef = "origin/${{ github.ref_name }}"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "report-builder-protect",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", $syncRef
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT

      - name: Instalar autorização Risk3 exata e temporária Report Builder
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.report_builder_session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_report_builder_main_protection_risk3.py `
              --enable `
              --ttl-minutes 30 `
              --confirm ENABLE-REPORT-BUILDER-MAIN-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Aplicar proteção Report Builder via Owner Risk3 Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.report_builder_session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\owner_risk3_gateway.py"
          $riskArgs = @(
            "--action-id", $env:ACTION_ID,
            "--scope", $env:ACTION_SCOPE,
            "--cwd", $env:TARGET_PATH,
            "--timeout", "300",
            "--correlation-id", $env:CORRELATION_ID
          )
          & python $gateway @riskArgs
          exit $LASTEXITCODE

      - name: Remover autorização Risk3 temporária Report Builder
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.report_builder_session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_RISK3_CLEANUP" }
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_report_builder_main_protection_risk3.py `
              --disable `
              --confirm DISABLE-REPORT-BUILDER-MAIN-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Validar evidência sanitizada Report Builder
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.report_builder_session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_EVIDENCE" }
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path $evidence)) { throw "PROTECTION_EVIDENCE_MISSING" }
          $data = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
          if ($data.status -notin @("PROTECTION_APPLIED", "ALREADY_COMPLIANT")) { throw "PROTECTION_NOT_CONFIRMED" }
          if ($data.repository -ne "ericson-j-santos/report-builder-platform") { throw "TARGET_REPOSITORY_MISMATCH" }
          if ($data.branch -ne "main") { throw "TARGET_BRANCH_MISMATCH" }
          if ($data.target_sha -ne "b80c999d83a82b3454bb6c486e16129f4f04f434") { throw "TARGET_SHA_MISMATCH" }
          if ($data.evidence_sha -ne "b80c999d83a82b3454bb6c486e16129f4f04f434") { throw "EVIDENCE_SHA_MISMATCH" }
          if (-not $data.protected) { throw "BRANCH_NOT_PROTECTED" }
          if (-not $data.pull_request_required) { throw "PULL_REQUEST_NOT_REQUIRED" }
          if (-not $data.enforce_admins) { throw "ADMINS_NOT_ENFORCED" }
          if (-not $data.strict_required_checks) { throw "REQUIRED_CHECKS_NOT_STRICT" }
          if ($data.force_push_allowed) { throw "FORCE_PUSH_ALLOWED" }
          if ($data.deletion_allowed) { throw "BRANCH_DELETION_ALLOWED" }
          if (-not $data.required_check_states."Quality / Python 3.11") { throw "PY311_CHECK_NOT_GREEN" }
          if (-not $data.required_check_states."Quality / Python 3.14") { throw "PY314_CHECK_NOT_GREEN" }
          if ($data.secret_value_exposed) { throw "SECRET_EXPOSURE_REPORTED" }

      - name: Publicar evidência sanitizada Report Builder
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-builder-main-protection-noteri-${{ github.run_id }}
          path: ${{ steps.report_builder_session.outputs.target_path }}\artifacts\report-builder-main-protection-noteri\evidence.json
          if-no-files-found: warn
          retention-days: 30
