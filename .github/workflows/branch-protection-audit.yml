name: Branch Protection Audit

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo governado de execução"
        required: true
        default: "audit"
        type: choice
        options:
          - audit
          - apply-observability-platform
          - apply-engineering-worker-pool
          - apply-engineering-worker-pool-noteri
          - apply-e2e-platform
          - apply-reqsys-main
          - apply-reqsys-main-noteri
  schedule:
    - cron: "30 8 * * *"

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: read
  checks: read

concurrency:
  group: branch-protection-audit-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET_BRANCH: main
  REPORT_DIR: ci-reports/branch-protection

jobs:
  audit:
    name: Auditar proteção enterprise da branch
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validar baseline versionável
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$REPORT_DIR"

          STATUS="OK"
          FAILURES=""

          require_file() {
            local path="$1"
            local description="$2"
            if [ ! -f "$path" ]; then
              STATUS="FAIL"
              FAILURES="$FAILURES\n- Ausente: $description ($path)"
            fi
          }

          require_contains() {
            local path="$1"
            local pattern="$2"
            local description="$3"
            if ! grep -Eq "$pattern" "$path"; then
              STATUS="FAIL"
              FAILURES="$FAILURES\n- Incompleto: $description ($path)"
            fi
          }

          require_file ".github/CODEOWNERS" "CODEOWNERS enterprise"
          require_file "docs/governance/branch-protection-enterprise-baseline.md" "documentação canônica de branch protection"

          if [ -f ".github/CODEOWNERS" ]; then
            require_contains ".github/CODEOWNERS" "@ericson-j-santos" "owner técnico definido"
            require_contains ".github/CODEOWNERS" "^/.github/workflows/" "ownership de workflows"
          fi

          if [ -f "docs/governance/branch-protection-enterprise-baseline.md" ]; then
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Required status checks" "checks obrigatórios documentados"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Required approvals" "aprovações obrigatórias documentadas"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Merge queue" "merge queue documentada"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Auto-merge" "auto-merge documentado"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Bypass permissions" "permissões de bypass documentadas"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Block force pushes" "bloqueio de force push documentado"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Squash merge" "política de squash merge documentada"
            require_contains "docs/governance/branch-protection-enterprise-baseline.md" "Checklist de confirmação final" "confirmação final da main documentada"
          fi

          {
            echo "# Branch Protection Audit"
            echo
            echo "| Item | Resultado |"
            echo "|---|---|"
            echo "| Branch alvo | \`$TARGET_BRANCH\` |"
            echo "| Baseline versionável | \`$STATUS\` |"
            echo "| CODEOWNERS | \`$(test -f .github/CODEOWNERS && echo presente || echo ausente)\` |"
            echo "| Documento canônico | \`$(test -f docs/governance/branch-protection-enterprise-baseline.md && echo presente || echo ausente)\` |"
            echo "| Required status checks | \`documentado\` |"
            echo "| Required approvals | \`documentado\` |"
            echo "| Merge queue | \`documentado\` |"
            echo "| Auto-merge | \`documentado\` |"
            echo "| Bypass permissions | \`documentado\` |"
            echo
            echo "## Falhas"
            echo
            if [ -n "$FAILURES" ]; then
              printf "%b\n" "$FAILURES"
            else
              echo "Nenhuma falha versionável detectada."
            fi
            echo
            echo "## Observação"
            echo
            echo "A confirmação efetiva de ruleset/branch protection depende das permissões administrativas do token/usuário no GitHub."
          } > "$REPORT_DIR/branch-protection-baseline.md"

          cat "$REPORT_DIR/branch-protection-baseline.md" >> "$GITHUB_STEP_SUMMARY"

          if [ "$STATUS" != "OK" ]; then
            exit 1
          fi

      - name: Publicar evidência de auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: branch-protection-audit
          path: ci-reports/branch-protection/
          if-no-files-found: error
          retention-days: 30

  apply-observability-platform:
    name: Proteger observability-platform/main via PC24x7 Risk3
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply-observability-platform' }}
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 12
    env:
      TARGET_REPO: C:\dev\reqsys-v2-enterprise-real
      CORRELATION_ID: observability-main-protection-${{ github.run_id }}-${{ github.run_attempt }}
      ACTION_ID: reqsys.observability-main-protection.dev
      ACTION_SCOPE: repo://ericson-j-santos/observability-platform/branch/main
      EVIDENCE_REL: artifacts/observability-main-protection-pc24x7/evidence.json
    steps:
      - name: Checkout regras canônicas
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: main
          path: _rules
          fetch-depth: 1

      - name: Validar host PC24x7 exato
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME -ne "DESKTOP-PDQK954") {
            throw "UNEXPECTED_HOST: $env:COMPUTERNAME"
          }

      - name: Bootstrap obrigatório de sessão
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "obs-protect",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/main"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT

      - name: Instalar autorização Risk3 exata e temporária
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_observability_main_protection_risk3.py `
              --enable `
              --ttl-minutes 30 `
              --confirm ENABLE-OBSERVABILITY-MAIN-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Aplicar proteção via Owner Risk3 Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\owner_risk3_gateway.py"
          $riskArgs = @(
            "--action-id", $env:ACTION_ID,
            "--scope", $env:ACTION_SCOPE,
            "--cwd", $env:TARGET_PATH,
            "--timeout", "300",
            "--correlation-id", $env:CORRELATION_ID
          )
          & python $gateway @riskArgs
          exit $LASTEXITCODE

      - name: Remover autorização Risk3 temporária
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_RISK3_CLEANUP" }
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_observability_main_protection_risk3.py `
              --disable `
              --confirm DISABLE-OBSERVABILITY-MAIN-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Validar evidência sanitizada
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_EVIDENCE" }
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path $evidence)) { throw "PROTECTION_EVIDENCE_MISSING" }
          $data = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
          if ($data.status -notin @("PROTECTION_APPLIED", "ALREADY_COMPLIANT")) { throw "PROTECTION_NOT_CONFIRMED" }
          if ($data.repository -ne "ericson-j-santos/observability-platform") { throw "TARGET_REPOSITORY_MISMATCH" }
          if ($data.branch -ne "main") { throw "TARGET_BRANCH_MISMATCH" }
          $requiredChecks = @($data.required_checks)
          if ($requiredChecks.Count -ne 2 -or $requiredChecks -notcontains "test" -or $requiredChecks -notcontains "E2E Platform Evidence Gate / validate-evidence") { throw "REQUIRED_CHECKS_MISMATCH" }
          if (-not $data.protected) { throw "BRANCH_NOT_PROTECTED" }
          if (-not $data.pull_request_required) { throw "PULL_REQUEST_NOT_REQUIRED" }
          if ($data.force_push_allowed) { throw "FORCE_PUSH_ALLOWED" }
          if ($data.deletion_allowed) { throw "BRANCH_DELETION_ALLOWED" }
          if ($data.secret_value_exposed) { throw "SECRET_EXPOSURE_REPORTED" }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: observability-platform-main-protection-pc24x7-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\observability-main-protection-pc24x7\evidence.json
          if-no-files-found: warn
          retention-days: 30

  apply-e2e-platform:
    name: Proteger e2e-platform/main via PC24x7 Risk3
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply-e2e-platform' }}
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 12
    env:
      TARGET_REPO: C:\dev\reqsys-v2-enterprise-real
      CORRELATION_ID: e2e-platform-main-protection-${{ github.run_id }}-${{ github.run_attempt }}
      ACTION_ID: reqsys.e2e-platform-main-protection.dev
      ACTION_SCOPE: repo://ericson-j-santos/e2e-platform/branch/main
      EVIDENCE_REL: artifacts/e2e-platform-main-protection-pc24x7/evidence.json
    steps:
      - name: Checkout regras canônicas
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: main
          path: _rules
          fetch-depth: 1

      - name: Validar host PC24x7 exato
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME -ne "DESKTOP-PDQK954") {
            throw "UNEXPECTED_HOST: $env:COMPUTERNAME"
          }

      - name: Bootstrap obrigatório de sessão
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "e2e-protect",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/main"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT

      - name: Instalar autorização Risk3 exata e temporária
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_e2e_platform_main_protection_risk3.py `
              --enable `
              --ttl-minutes 30 `
              --confirm ENABLE-E2E-PLATFORM-MAIN-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Aplicar proteção via Owner Risk3 Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\owner_risk3_gateway.py"
          $riskArgs = @(
            "--action-id", $env:ACTION_ID,
            "--scope", $env:ACTION_SCOPE,
            "--cwd", $env:TARGET_PATH,
            "--timeout", "300",
            "--correlation-id", $env:CORRELATION_ID
          )
          & python $gateway @riskArgs
          exit $LASTEXITCODE

      - name: Remover autorização Risk3 temporária
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_RISK3_CLEANUP" }
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_e2e_platform_main_protection_risk3.py `
              --disable `
              --confirm DISABLE-E2E-PLATFORM-MAIN-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Validar evidência sanitizada
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_EVIDENCE" }
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path $evidence)) { throw "PROTECTION_EVIDENCE_MISSING" }
          $data = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
          if ($data.status -notin @("PROTECTION_APPLIED", "ALREADY_COMPLIANT")) { throw "PROTECTION_NOT_CONFIRMED" }
          if ($data.repository -ne "ericson-j-santos/e2e-platform") { throw "TARGET_REPOSITORY_MISMATCH" }
          if ($data.branch -ne "main") { throw "TARGET_BRANCH_MISMATCH" }
          $requiredChecks = @($data.required_checks)
          if ($requiredChecks.Count -ne 1 -or $requiredChecks -notcontains "contract-self-test") { throw "REQUIRED_CHECKS_MISMATCH" }
          if (-not $data.protected) { throw "BRANCH_NOT_PROTECTED" }
          if (-not $data.pull_request_required) { throw "PULL_REQUEST_NOT_REQUIRED" }
          if ($data.force_push_allowed) { throw "FORCE_PUSH_ALLOWED" }
          if ($data.deletion_allowed) { throw "BRANCH_DELETION_ALLOWED" }
          if ($data.secret_value_exposed) { throw "SECRET_EXPOSURE_REPORTED" }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-platform-main-protection-pc24x7-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\e2e-platform-main-protection-pc24x7\evidence.json
          if-no-files-found: warn
          retention-days: 30

  apply-reqsys-main:
    name: Proteger reqsys-v2-enterprise-real/main ruleset via PC24x7 Risk3
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'apply-reqsys-main' }}
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 12
    env:
      TARGET_REPO: C:\\dev\\reqsys-v2-enterprise-real
      CORRELATION_ID: reqsys-main-ruleset-protection-${{ github.run_id }}-${{ github.run_attempt }}
      ACTION_ID: reqsys.reqsys-main-ruleset-protection.dev
      ACTION_SCOPE: repo://ericson-j-santos/reqsys-v2-enterprise-real/ruleset/17998541
      EVIDENCE_REL: artifacts/reqsys-main-ruleset-protection-pc24x7/evidence.json
    steps:
      - name: Checkout regras canônicas
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: main
          path: _rules
          fetch-depth: 1

      - name: Validar host PC24x7 exato
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME -ne "DESKTOP-PDQK954") {
            throw "UNEXPECTED_HOST: $env:COMPUTERNAME"
          }

      - name: Bootstrap obrigatório de sessão
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "reqsys-ruleset",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/main"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT

      - name: Instalar autorização Risk3 exata e temporária
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_reqsys_main_ruleset_risk3.py `
              --enable `
              --ttl-minutes 30 `
              --confirm ENABLE-REQSYS-MAIN-RULESET-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Aplicar required checks via Owner Risk3 Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\owner_risk3_gateway.py"
          $riskArgs = @(
            "--action-id", $env:ACTION_ID,
            "--scope", $env:ACTION_SCOPE,
            "--cwd", $env:TARGET_PATH,
            "--timeout", "300",
            "--correlation-id", $env:CORRELATION_ID
          )
          & python $gateway @riskArgs
          exit $LASTEXITCODE

      - name: Remover autorização Risk3 temporária
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_RISK3_CLEANUP" }
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_reqsys_main_ruleset_risk3.py `
              --disable `
              --confirm DISABLE-REQSYS-MAIN-RULESET-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Validar evidência sanitizada
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_EVIDENCE" }
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path $evidence)) { throw "PROTECTION_EVIDENCE_MISSING" }
          $data = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
          if ($data.status -notin @("PROTECTION_APPLIED", "ALREADY_COMPLIANT")) { throw "PROTECTION_NOT_CONFIRMED" }
          if ($data.repository -ne "ericson-j-santos/reqsys-v2-enterprise-real") { throw "TARGET_REPOSITORY_MISMATCH" }
          if ($data.branch -ne "main") { throw "TARGET_BRANCH_MISMATCH" }
          if ($data.ruleset_id -ne 17998541) { throw "RULESET_ID_MISMATCH" }
          $requiredChecks = @($data.required_checks)
          $expectedChecks = @(
            "Required Fast Gate",
            "CI Router Result",
            "Sumario CI Enterprise Fast",
            "Validar artefatos de governança",
            "governance-validation",
            "Security Baseline",
            "Auditar proteção enterprise da branch",
            "Gate de merge governado"
          )
          if ($requiredChecks.Count -ne $expectedChecks.Count) { throw "REQUIRED_CHECKS_COUNT_MISMATCH" }
          foreach ($check in $expectedChecks) {
            if ($requiredChecks -notcontains $check) { throw "REQUIRED_CHECKS_MISMATCH: $check" }
          }
          if (-not $data.ruleset_active) { throw "RULESET_NOT_ACTIVE" }
          if (-not $data.strict_required_status_checks) { throw "STRICT_CHECKS_NOT_ENABLED" }
          if ($data.bypass_actor_count -ne 0) { throw "BYPASS_ACTOR_PRESENT" }
          if (-not $data.protected) { throw "BRANCH_NOT_PROTECTED" }
          if (-not $data.independent_readback) { throw "INDEPENDENT_READBACK_MISSING" }
          if ($data.secret_value_exposed) { throw "SECRET_EXPOSURE_REPORTED" }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reqsys-main-ruleset-protection-pc24x7-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\\artifacts\\reqsys-main-ruleset-protection-pc24x7\\evidence.json
          if-no-files-found: warn
          retention-days: 30

  apply-reqsys-main-noteri:
    name: Proteger reqsys-v2-enterprise-real/main ruleset via Noteri Risk3
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.mode == 'apply-reqsys-main-noteri') ||
      (github.event_name == 'pull_request' &&
       github.event.action == 'closed' &&
       github.event.pull_request.merged == true &&
       github.event.pull_request.number == 2079 &&
       github.event.pull_request.head.ref == 'fix/reqsys-main-ruleset-noteri-fallback-20260924')
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 12
    env:
      TARGET_REPO: ${{ github.workspace }}
      CORRELATION_ID: reqsys-main-ruleset-protection-noteri-${{ github.run_id }}-${{ github.run_attempt }}
      ACTION_ID: reqsys.reqsys-main-ruleset-protection.dev
      ACTION_SCOPE: repo://ericson-j-santos/reqsys-v2-enterprise-real/ruleset/17998541
      EVIDENCE_REL: artifacts/reqsys-main-ruleset-protection-pc24x7/evidence.json
    steps:
      - name: Checkout ReqSys no SHA governado
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Checkout regras canônicas
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: main
          path: _rules
          fetch-depth: 1

      - name: Validar host Noteri exato
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME -ne "Noteri") {
            throw "UNEXPECTED_HOST: $env:COMPUTERNAME"
          }

      - name: Bootstrap obrigatório de sessão
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "reqsys-ruleset-noteri",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}",
            "--sync-ref", "origin/main"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          $expectedHead = "${{ github.event_name == 'pull_request' && github.event.pull_request.merge_commit_sha || github.sha }}"
          if ($data.head -ne $expectedHead) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT

      - name: Instalar autorização Risk3 exata e temporária
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_reqsys_main_ruleset_risk3.py `
              --enable `
              --ttl-minutes 30 `
              --confirm ENABLE-REQSYS-MAIN-RULESET-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Aplicar required checks via Owner Risk3 Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\owner_risk3_gateway.py"
          $riskArgs = @(
            "--action-id", $env:ACTION_ID,
            "--scope", $env:ACTION_SCOPE,
            "--cwd", $env:TARGET_PATH,
            "--timeout", "300",
            "--correlation-id", $env:CORRELATION_ID
          )
          & python $gateway @riskArgs
          exit $LASTEXITCODE

      - name: Remover autorização Risk3 temporária
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_RISK3_CLEANUP" }
          Push-Location $env:TARGET_PATH
          try {
            python scripts/configure_reqsys_main_ruleset_risk3.py `
              --disable `
              --confirm DISABLE-REQSYS-MAIN-RULESET-PROTECTION-ONCE
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Validar evidência sanitizada
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_EVIDENCE" }
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path $evidence)) { throw "PROTECTION_EVIDENCE_MISSING" }
          $data = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
          if ($data.status -notin @("PROTECTION_APPLIED", "ALREADY_COMPLIANT")) { throw "PROTECTION_NOT_CONFIRMED" }
          if ($data.repository -ne "ericson-j-santos/reqsys-v2-enterprise-real") { throw "TARGET_REPOSITORY_MISMATCH" }
          if ($data.branch -ne "main") { throw "TARGET_BRANCH_MISMATCH" }
          if ($data.ruleset_id -ne 17998541) { throw "RULESET_ID_MISMATCH" }
          $requiredChecks = @($data.required_checks)
          $expectedChecks = @(
            "Required Fast Gate",
            "CI Router Result",
            "Sumario CI Enterprise Fast",
            "Validar artefatos de governança",
            "governance-validation",
            "Security Baseline",
            "Auditar proteção enterprise da branch",
            "Gate de merge governado"
          )
          if ($requiredChecks.Count -ne $expectedChecks.Count) { throw "REQUIRED_CHECKS_COUNT_MISMATCH" }
          foreach ($check in $expectedChecks) {
            if ($requiredChecks -notcontains $check) { throw "REQUIRED_CHECKS_MISMATCH: $check" }
          }
          if (-not $data.ruleset_active) { throw "RULESET_NOT_ACTIVE" }
          if (-not $data.strict_required_status_checks) { throw "STRICT_CHECKS_NOT_ENABLED" }
          if ($data.bypass_actor_count -ne 0) { throw "BYPASS_ACTOR_PRESENT" }
          if (-not $data.protected) { throw "BRANCH_NOT_PROTECTED" }
          if (-not $data.independent_readback) { throw "INDEPENDENT_READBACK_MISSING" }
          if ($data.secret_value_exposed) { throw "SECRET_EXPOSURE_REPORTED" }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reqsys-main-ruleset-protection-noteri-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\\artifacts\\reqsys-main-ruleset-protection-pc24x7\\evidence.json
          if-no-files-found: warn
          retention-days: 30

