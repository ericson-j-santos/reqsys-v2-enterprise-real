# REQSYS_PRODUCTION_GOVERNANCE_GATE
name: ReqSys Fly Runtime P0

on:
  pull_request:
    paths:
      - "fly.toml"
      - "Dockerfile.fly"
      - "scripts/fly_boot.sh"
      - "backend/**"
      - "scripts/validate_fly_runtime_config.py"
      - "scripts/validate_public_runtime.py"
      - "scripts/runtime_public_validator.py"
      - ".github/workflows/fly-runtime-p0.yml"
  workflow_dispatch:
    inputs:
      public_url:
        description: "URL pública da API ReqSys"
        required: true
        default: "https://reqsys-api.fly.dev"
      deploy:
        description: "Executar deploy no Fly após validação"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write

jobs:
  validate-config:
    name: Validate Fly runtime config
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate Trilha A runtime público
        run: |
          python scripts/runtime_public_validator.py \
            --artifact-root . \
            --output artifacts/runtime/runtime-public-validation.json \
            --strict

      - name: Upload Trilha A validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-public-validation
          path: artifacts/runtime/runtime-public-validation.json
          if-no-files-found: warn

  production-gate:
    name: BACEN authorization before Fly deploy
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy == true }}
    uses: ./.github/workflows/bacen-production-hard-gate.yml
    with:
      enforce: true

  deploy:
    name: Deploy to Fly
    runs-on: ubuntu-latest
    needs: [validate-config, production-gate]
    if: >-
      always() &&
      github.event_name == 'workflow_dispatch' &&
      inputs.deploy == true &&
      needs.validate-config.result == 'success' &&
      needs.production-gate.result == 'success'
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolver credencial Fly API produção
        uses: ./.github/actions/resolve-managed-credential
        with:
          credential-id: fly-api-prod-deploy
          consumer: github-actions:fly-production
          export-env: FLY_API_TOKEN
          vault-name: ${{ vars.REQSYS_KEY_VAULT_NAME }}
          azure-client-id: ${{ vars.CCP_AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          evidence-path: audit/fly-runtime-p0-credential-resolution.json

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy
        run: flyctl deploy --remote-only --config fly.toml

      - name: Publicar evidência de credencial
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fly-runtime-p0-credential-${{ github.run_id }}-${{ github.run_attempt }}
          path: audit/fly-runtime-p0-credential-resolution.json
          if-no-files-found: warn
          retention-days: 30

  public-smoke:
    name: Public runtime smoke
    runs-on: ubuntu-latest
    needs:
      - validate-config
      - deploy
    if: ${{ always() && github.event_name == 'workflow_dispatch' && (inputs.deploy == false || needs.deploy.result == 'success') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate public runtime (Trilha A probe)
        run: |
          python scripts/runtime_public_validator.py \
            --probe \
            --base-url "${{ inputs.public_url }}" \
            --environment prod \
            --include-optional-evidence \
            --artifact-root . \
            --output artifacts/runtime/runtime-public-validation.json

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-runtime-validation
          path: |
            artifacts/runtime/runtime-public-validation.json
            artifacts/runtime/runtime-public-probe.json
            artifacts/runtime/runtime-public-readiness.json
