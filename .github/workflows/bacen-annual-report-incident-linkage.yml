name: BACEN Annual Report Incident Evidence Linkage

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_annual_report_incident_linkage.py"
      - ".github/workflows/bacen-annual-report-incident-linkage.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_annual_report_incident_linkage.py"
      - ".github/workflows/bacen-annual-report-incident-linkage.yml"
  schedule:
    - cron: "29 9 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bacen-annual-report-incident-linkage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-08 Incident Evidence Linkage
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_annual_report_incident_linkage.py

      - name: Generate linkage evidence
        run: |
          python scripts/generate_bacen_annual_report_incident_linkage.py \
            --report governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md \
            --matrix governance/bacen/BACEN-CONTROL-MATRIX.yaml \
            --output artifacts/bacen/bacen-08-annual-report-incident-linkage.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-08-annual-report-incident-linkage.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          assert evidence["control_id"] == "BACEN-08"
          assert evidence["source_control_id"] == "BACEN-03"
          assert evidence["incident_section_present"] is True
          assert evidence["required_incident_linkage_complete"] is True
          assert evidence["automatic_blocking"] is False
          assert len(evidence["report_sha256"]) == 64
          assert len(evidence["matrix_sha256"]) == 64
          assert evidence["production_touched"] is False
          print("BACEN-08 incident evidence linkage: valid")
          PY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-08-annual-report-incident-linkage
          path: artifacts/bacen/bacen-08-annual-report-incident-linkage.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-08-annual-report-incident-linkage.json")
          print("## BACEN-08 — Vínculo de evidências de incidentes")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          print(f"\n- Vínculos obrigatórios completos: **{evidence['required_incident_linkage_complete']}**")
          print(f"- Vínculos recomendados pendentes: **{len(evidence['missing_recommended_linkages'])}**")
          print(f"- Bloqueio estrutural: **{evidence['automatic_blocking']}**")
          print("- Produção acessada: **false**")
          PY
