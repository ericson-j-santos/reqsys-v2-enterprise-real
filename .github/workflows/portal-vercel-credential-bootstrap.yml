name: Portal Vercel Credential Bootstrap

on:
  push:
    branches:
      - automation/portal-vercel-credential-bootstrap-20260928
    paths:
      - ".github/workflows/portal-vercel-credential-bootstrap.yml"

permissions:
  contents: read

concurrency:
  group: portal-vercel-credential-bootstrap-noteri
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Bootstrap Portal Vercel automation
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GH_PAT_ACTIONS }}
      PORTAL_REPO: ericson-j-santos/portal-portabilidade-2025
      VERCEL_SCOPE: ericsons-projects-2dc94fbf
      VERCEL_PROJECT_NAME: portal-portabilidade-2025
      VERCEL_PROJECT_ID: prj_GcQEm3O9AlURnthV1iwC7c99Q289
      VERCEL_ORG_ID: team_o4wyHrN2sFJBZ79KKrtkIVE9
      UPSTASH_RESOURCE_NAME: portal-portabilidade-2025-preview

    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate governed GitHub credential
        shell: powershell
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            Write-Error "GH_PAT_ACTIONS ausente."
            exit 2
          }

      - name: Verify local Vercel session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & npx --yes vercel@latest whoami --scope $env:VERCEL_SCOPE *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "VERCEL_LOCAL_SESSION_UNAVAILABLE"
            exit 3
          }
          Write-Output "VERCEL_LOCAL_SESSION=available"

      - name: Link Portal project locally
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path ".vercel" | Out-Null
          $link = @{ orgId = $env:VERCEL_ORG_ID; projectId = $env:VERCEL_PROJECT_ID } | ConvertTo-Json -Compress
          Set-Content -Path ".vercel/project.json" -Value $link -Encoding UTF8

      - name: Generate automation bypass and store it directly in Portal
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $raw = & npx --yes vercel@latest project protection enable $env:VERCEL_PROJECT_NAME --protection-bypass --format json --scope $env:VERCEL_SCOPE
          if ($LASTEXITCODE -ne 0) {
            Write-Error "VERCEL_BYPASS_GENERATION_FAILED"
            exit 4
          }
          $parsed = ($raw -join [Environment]::NewLine) | ConvertFrom-Json
          $secret = $null
          if ($parsed.protectionBypass -is [string]) {
            $secret = [string]$parsed.protectionBypass
          } elseif ($null -ne $parsed.protectionBypass) {
            $props = @($parsed.protectionBypass.PSObject.Properties)
            if ($props.Count -ge 1 -and $props[0].Name -match '^[A-Za-z0-9]{32}$') {
              $secret = $props[0].Name
            } elseif ($null -ne $parsed.protectionBypass.secret) {
              $secret = [string]$parsed.protectionBypass.secret
            }
          }
          if ([string]::IsNullOrWhiteSpace($secret)) {
            Write-Error "VERCEL_BYPASS_SECRET_NOT_FOUND_IN_RESPONSE"
            exit 5
          }
          Write-Output "::add-mask::$secret"
          $secret | gh secret set VERCEL_AUTOMATION_BYPASS_SECRET --repo $env:PORTAL_REPO
          if ($LASTEXITCODE -ne 0) {
            Write-Error "PORTAL_SECRET_WRITE_FAILED"
            exit 6
          }
          Write-Output "PORTAL_AUTOMATION_BYPASS=stored"

      - name: Detect or provision Upstash Free for preview only
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $raw = & npx --yes vercel@latest integration list --integration upstash --format=json --scope $env:VERCEL_SCOPE
          if ($LASTEXITCODE -ne 0) {
            Write-Error "UPSTASH_LIST_FAILED"
            exit 7
          }
          $exists = ($raw -join [Environment]::NewLine).Contains($env:UPSTASH_RESOURCE_NAME)
          if ($exists) {
            Write-Output "UPSTASH_RESOURCE_EXISTS=true"
            exit 0
          }
          & npx --yes vercel@latest integration add upstash/upstash-redis --name $env:UPSTASH_RESOURCE_NAME --plan free --environment preview --metadata primaryRegion=iad1 --no-claim --no-env-pull --yes --format=json --scope $env:VERCEL_SCOPE *> $null
          if ($LASTEXITCODE -ne 0) {
            Write-Error "UPSTASH_FREE_PREVIEW_PROVISION_FAILED"
            exit 8
          }
          Write-Output "UPSTASH_RESOURCE_CREATED=free_preview"

      - name: Verify Portal secret name without reading value
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $names = gh secret list --repo $env:PORTAL_REPO --json name --jq '.[].name'
          if ($LASTEXITCODE -ne 0) {
            Write-Error "PORTAL_SECRET_LIST_FAILED"
            exit 9
          }
          if (-not ($names -contains "VERCEL_AUTOMATION_BYPASS_SECRET")) {
            Write-Error "PORTAL_AUTOMATION_BYPASS_SECRET_NOT_VISIBLE"
            exit 10
          }
          Write-Output "PORTAL_AUTOMATION_BYPASS_SECRET=present"

      - name: Publish sanitized evidence
        if: always()
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path "artifacts/portal-vercel-bootstrap" | Out-Null
          @{ workflow_sha = "${{ github.sha }}"; portal_repository = $env:PORTAL_REPO; vercel_project_id = $env:VERCEL_PROJECT_ID; bypass_secret_value_exposed = $false; requested_plan = "free"; requested_environment = "preview"; production_changed = $false } | ConvertTo-Json | Set-Content "artifacts/portal-vercel-bootstrap/evidence.json" -Encoding UTF8

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: portal-vercel-bootstrap-${{ github.run_id }}
          path: artifacts/portal-vercel-bootstrap/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Remove local link
        if: always()
        shell: powershell
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue ".vercel/project.json"
