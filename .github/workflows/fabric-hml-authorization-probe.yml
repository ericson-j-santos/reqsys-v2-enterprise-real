name: Fabric HML Authorization Probe

on:
  pull_request:
    paths:
      - ".github/workflows/fabric-hml-authorization-probe.yml"
      - "scripts/fabric_hml_authorization_probe_temp.py"
      - ".sdd/specs/fabric-hml-authorization-probe.spec.json"
      - ".sdd/specs/fabric-hml-authorization-probe.requirements.md"
      - "tests/test_fabric_hml_authorization_probe_contract.py"

permissions:
  contents: read

concurrency:
  group: fabric-hml-authorization-probe-temp
  cancel-in-progress: false

jobs:
  authorization-probe:
    name: fabric-hml-authorization-probe
    if: ${{ github.head_ref == 'probe/fabric-hml-authorization-20260921' }}
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    steps:
      - name: Checkout immutable SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 1

      - name: Probe read-only da autorização Fabric
        shell: powershell
        run: python scripts/fabric_hml_authorization_probe_temp.py

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fabric-hml-authorization-probe-${{ github.run_id }}
          path: artifacts/fabric-hml-authorization-probe/evidence.json
          if-no-files-found: error
          retention-days: 7
