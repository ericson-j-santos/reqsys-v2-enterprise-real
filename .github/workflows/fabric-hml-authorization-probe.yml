name: Fabric HML Authorization Verify Temp

on:
  push:
    branches:
      - "ops/fabric-hml-contributor-grant-20260922"

permissions:
  contents: read

concurrency:
  group: fabric-hml-authorization-verify-temp
  cancel-in-progress: false

jobs:
  authorization-verify:
    name: fabric-hml-authorization-verify
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    steps:
      - name: Checkout immutable SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify Fabric HML authorization read-only
        shell: powershell
        run: python scripts/fabric_hml_authorization_probe_temp.py

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fabric-hml-authorization-verify-${{ github.run_id }}
          path: artifacts/fabric-hml-authorization-probe/evidence.json
          if-no-files-found: error
          retention-days: 7
