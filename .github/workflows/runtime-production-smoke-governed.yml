name: Runtime Production Smoke Governed

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: "URL pública base do ReqSys"
        required: false
        default: ""
        type: string
      allow_degraded:
        description: "Não falhar workflow se smoke retornar degraded"
        required: false
        default: false
        type: boolean
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/runtime-production-smoke-governed.yml"
      - "scripts/runtime_production_smoke_governed.py"
      - "tests/test_runtime_production_smoke_governed.py"
      - "tests/test_runtime_production_smoke_workflow.py"
      - "backend/app/main.py"
  push:
    branches: [main]

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

concurrency:
  group: runtime-production-smoke-governed-${{ github.ref }}
  cancel-in-progress: false

jobs:
  runtime-production-smoke:
    name: Runtime production smoke governed
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Instalar dependências mínimas de teste
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pytest PyYAML

      - name: Validar script e testes do smoke
        run: |
          set -euo pipefail
          python -m py_compile scripts/runtime_production_smoke_governed.py
          python -m pytest tests/test_runtime_production_smoke_governed.py tests/test_runtime_production_smoke_workflow.py -q

      - name: Executar smoke público governado
        if: github.event_name != 'pull_request'
        env:
          RUNTIME_PUBLIC_BASE_URL: ${{ github.event.inputs.base_url || vars.RUNTIME_PUBLIC_BASE_URL }}
          ALLOW_DEGRADED: ${{ github.event.inputs.allow_degraded || 'false' }}
        run: |
          set -euo pipefail
          if [[ -z "${RUNTIME_PUBLIC_BASE_URL}" ]]; then
            echo "::error::Configure RUNTIME_PUBLIC_BASE_URL com o runtime aprovado; nenhum fallback é permitido."
            exit 1
          fi
          case "${RUNTIME_PUBLIC_BASE_URL}" in
            *fly.io*|*fly.dev*) echo "::error::Provedor retirado não pode receber smoke."; exit 1 ;;
          esac
          args=(
            --base-url "${RUNTIME_PUBLIC_BASE_URL}"
            --output artifacts/runtime-production-smoke-governed.json
            --repository "${{ github.repository }}"
            --github-run-id "${{ github.run_id }}"
            --json
          )
          if [[ "${ALLOW_DEGRADED}" == "true" ]]; then
            args+=(--allow-degraded)
          fi
          python scripts/runtime_production_smoke_governed.py "${args[@]}"

      - name: Resumo operacional
        if: always()
        run: |
          set -euo pipefail
          REPORT="artifacts/runtime-production-smoke-governed.json"
          if [[ ! -f "${REPORT}" ]]; then
            echo "## Runtime Production Smoke" >> "$GITHUB_STEP_SUMMARY"
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo "PR: código e testes do smoke validados. Ambiente publicado não foi consultado; isso não comprova disponibilidade." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            echo "Artifact ausente: smoke público não comprovado." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/runtime-production-smoke-governed.json").read_text())
          print("## Runtime Production Smoke Governed")
          print()
          print(f"- Status: **{report['status']}**")
          print(f"- Base URL: {report['base_url']}")
          print(f"- Required: {report['required_ok']}/{report['required_total']} ({report['required_success_percentual']}%)")
          print(f"- Total: {report['total_success_percentual']}%")
          print(f"- Latência média: {report['average_latency_ms']} ms")
          print(f"- Risco: {report['risk']}")
          print()
          print("| Endpoint | Required | HTTP | OK | Latência |")
          print("|---|---:|---:|---:|---:|")
          for item in report["checks"]:
              print(f"| {item['path']} | {item['required']} | {item['actual_http']} | {item['ok']} | {item['latency_ms']} ms |")
          PY

      - name: Publicar artifact do smoke
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: runtime-production-smoke-governed
          path: artifacts/runtime-production-smoke-governed.json
          if-no-files-found: warn
          retention-days: 30
