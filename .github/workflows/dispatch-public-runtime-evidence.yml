name: Dispatch Public Runtime Evidence

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Operação manual governada"
        required: true
        type: choice
        default: "public-runtime-evidence"
        options:
          - "public-runtime-evidence"
          - "relay-dev-locator"
      public_url:
        description: "URL pública da API ReqSys"
        required: true
        default: "https://reqsys-api.fly.dev"
      strict:
        description: "Executar gate strict"
        required: true
        type: boolean
        default: true
      publish_comment:
        description: "Publicar comentário governado"
        required: true
        type: boolean
        default: false
      issue_number:
        description: "Issue/PR para receber comentário"
        required: false
        default: ""
      ref:
        description: "Ref alvo do workflow Public Runtime Evidence Gate"
        required: true
        default: "main"

      expected_sha:
        description: "SHA completo e atual da main autorizado para o relay"
        required: false
        default: ""
        type: string
      authorization:
        description: "Confirmação literal da operação DEV"
        required: false
        default: ""
        type: string
      envelope_b64:
        description: "Envelope público assinado, codificado em Base64 canônico"
        required: false
        default: ""
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  dispatch-public-runtime-evidence:
    name: Dispatch public runtime evidence
    if: ${{ inputs.operation == 'public-runtime-evidence' }}
    runs-on: ubuntu-latest
    steps:
      - name: Validate governed token
        env:
          GH_PAT_ACTIONS: ${{ secrets.GH_PAT_ACTIONS }}
        run: |
          if [ -z "${GH_PAT_ACTIONS}" ]; then
            echo "Secret GH_PAT_ACTIONS não configurado."
            exit 1
          fi

      - name: Dispatch Public Runtime Evidence Gate
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ACTIONS }}
          REPOSITORY: ${{ github.repository }}
          PUBLIC_URL: ${{ inputs.public_url }}
          STRICT: ${{ inputs.strict }}
          PUBLISH_COMMENT: ${{ inputs.publish_comment }}
          ISSUE_NUMBER: ${{ inputs.issue_number }}
          TARGET_REF: ${{ inputs.ref }}
        run: |
          args=(
            -R "${REPOSITORY}"
            --ref "${TARGET_REF}"
            -f "public_url=${PUBLIC_URL}"
            -f "strict=${STRICT}"
            -f "publish_comment=${PUBLISH_COMMENT}"
            -f "issue_number=${ISSUE_NUMBER}"
          )

          gh workflow run public-runtime-evidence.yml "${args[@]}"

      - name: Show dispatched runs
        env:
          GH_TOKEN: ${{ secrets.GH_PAT_ACTIONS }}
          REPOSITORY: ${{ github.repository }}
        run: |
          gh run list \
            -R "${REPOSITORY}" \
            --workflow="public-runtime-evidence.yml" \
            -L 5

  relay:
    name: Verify, smoke, relay and read back on GitHub-hosted runner
    if: ${{ inputs.operation == 'relay-dev-locator' }}
    permissions:
      contents: read
    concurrency:
      group: pc24x7-dev-locator-relay
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate authorization and current main SHA before checkout
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          AUTHORIZATION: ${{ inputs.authorization }}
          GH_TOKEN: ${{ github.token }}
          MAIN_RESPONSE_PATH: ${{ runner.temp }}/reqsys-dev-locator-main.json
        run: |
          set -euo pipefail
          test "$GITHUB_EVENT_NAME" = 'workflow_dispatch'
          test "$GITHUB_REF" = 'refs/heads/main'
          test "$AUTHORIZATION" = 'RELAY_DEV_LOCATOR'
          [[ "$EXPECTED_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$GITHUB_SHA" = "$EXPECTED_SHA"
          trap 'rm -f "$MAIN_RESPONSE_PATH"' EXIT
          status="$(curl --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 20 \
            --max-filesize 1048576 \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            --output "$MAIN_RESPONSE_PATH" \
            --write-out '%{http_code}' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/commits/main")"
          test "$status" = '200'
          test "$(wc -c < "$MAIN_RESPONSE_PATH")" -le 1048576
          python3 - <<'PY'
          import json
          import os

          with open(os.environ["MAIN_RESPONSE_PATH"], encoding="utf-8") as response:
              main = json.load(response)
          if main.get("sha") != os.environ["EXPECTED_SHA"]:
              raise SystemExit("main_sha_changed")
          PY

      - name: Checkout exact authorized SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ inputs.expected_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'

      - name: Validate immutable checkout and signed envelope
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          SIGNED_ENVELOPE_B64: ${{ inputs.envelope_b64 }}
          SIGNED_ENVELOPE_PATH: ${{ runner.temp }}/reqsys-dev-locator-envelope.json
          SAFE_METADATA_PATH: ${{ runner.temp }}/reqsys-dev-locator-metadata.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { execFileSync } from 'node:child_process'
          import { createHash } from 'node:crypto'
          import { writeFileSync } from 'node:fs'
          import { PUBLIC_KEY_B64, TITLE, TOPIC, verifyEnvelope } from './scripts/resolve_pc24x7_dev_locator.mjs'

          const fail = (message) => { throw new Error(message) }
          if (TOPIC !== 'reqsys-dev-locator-1651e9182d6e1c939fa6672c1248c9d532716fe7') {
            fail('relay_topic_constant_mismatch')
          }
          if (TITLE !== 'reqsys-dev-locator') fail('relay_title_constant_mismatch')
          const expectedSha = process.env.EXPECTED_SHA || ''
          if (!/^[0-9a-f]{40}$/.test(expectedSha)) fail('expected_sha_invalid')
          const checkoutSha = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          if (checkoutSha !== expectedSha) fail('checkout_sha_mismatch')

          const encoded = process.env.SIGNED_ENVELOPE_B64 || ''
          if (encoded.length < 172 || encoded.length > 21_848 || encoded.length % 4 !== 0) {
            fail('relay_base64_size_invalid')
          }
          if (!/^[A-Za-z0-9+/]+={0,2}$/.test(encoded)) fail('relay_base64_invalid')
          const envelopeBytes = Buffer.from(encoded, 'base64')
          if (envelopeBytes.toString('base64') !== encoded) fail('relay_base64_noncanonical')
          if (envelopeBytes.length < 128 || envelopeBytes.length > 16_384) fail('relay_envelope_size_invalid')
          let envelopeText
          try {
            envelopeText = new TextDecoder('utf-8', { fatal: true }).decode(envelopeBytes)
          } catch {
            fail('relay_envelope_utf8_invalid')
          }
          let envelope
          try { envelope = JSON.parse(envelopeText) } catch { fail('relay_envelope_json_invalid') }
          const keys = Object.keys(envelope).sort()
          if (keys.join(',') !== 'payload_b64,signature_b64,v' || envelope.v !== 1) {
            fail('relay_envelope_shape_invalid')
          }
          const payload = verifyEnvelope(envelopeText)
          if (!payload) fail('relay_signature_or_contract_invalid')
          const now = Math.floor(Date.now() / 1000)
          const remainingTtlSeconds = payload.expires_at - now
          if (remainingTtlSeconds < 300) fail('relay_ttl_below_300_seconds')
          const envelopeSha = createHash('sha256').update(envelopeBytes).digest('hex')

          writeFileSync(process.env.SIGNED_ENVELOPE_PATH, envelopeBytes, { mode: 0o600 })
          writeFileSync(process.env.SAFE_METADATA_PATH, JSON.stringify({
            schema_version: '1.0.0',
            contract: 'reqsys-pc24x7-dev-locator-relay',
            environment: 'dev',
            topic: TOPIC,
            title: TITLE,
            public_key_sha256: createHash('sha256').update(Buffer.from(PUBLIC_KEY_B64, 'base64')).digest('hex'),
            envelope_sha256: envelopeSha,
            issued_at: payload.issued_at,
            expires_at: payload.expires_at,
            remaining_ttl_seconds_at_validation: remainingTtlSeconds,
            selected_url: payload.selected_url,
            urls: payload.urls,
            expected_control_plane_sha: expectedSha,
            production_touched: false,
            secrets_exported: false,
            envelope_in_evidence: false,
          }, null, 2) + '\n', { mode: 0o600 })
          NODE

      - name: Preflight public DEV runtime before relay
        shell: bash
        env:
          SAFE_METADATA_PATH: ${{ runner.temp }}/reqsys-dev-locator-metadata.json
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs'

          const fail = (message) => { throw new Error(message) }
          const evidence = JSON.parse(readFileSync(process.env.SAFE_METADATA_PATH, 'utf8'))
          if (!Array.isArray(evidence.urls) || evidence.urls.length < 1) fail('preflight_urls_missing')

          async function readBoundedBody(response, maxBytes, path) {
            if (!response.body) return Buffer.alloc(0)
            const reader = response.body.getReader()
            const chunks = []
            let total = 0
            while (true) {
              const { done, value } = await reader.read()
              if (done) break
              total += value.byteLength
              if (total > maxBytes) {
                await reader.cancel()
                fail(`preflight_body_too_large_${path}`)
              }
              chunks.push(Buffer.from(value))
            }
            return Buffer.concat(chunks, total)
          }

          async function boundedFetch(base, path, { expectedStatus, maxBytes, accept }) {
            const controller = new AbortController()
            const timeout = setTimeout(() => controller.abort(), 15_000)
            try {
              const response = await fetch(new URL(path, base), {
                redirect: 'error',
                signal: controller.signal,
                headers: { Accept: accept },
              })
              if (response.status !== expectedStatus) fail(`preflight_http_${path}_${response.status}`)
              const declared = Number(response.headers.get('content-length') || '0')
              if (declared > maxBytes) fail(`preflight_body_too_large_${path}`)
              const body = await readBoundedBody(response, maxBytes, path)
              return { response, body }
            } finally {
              clearTimeout(timeout)
            }
          }

          const preflight = {}
          for (const baseUrl of evidence.urls) {
            const base = new URL(baseUrl)
            if (base.protocol !== 'https:' || !base.hostname.endsWith('.trycloudflare.com')) {
              fail('preflight_base_url_invalid')
            }
            const smoke = {}
            for (const path of ['/api/health', '/api/runtime/health', '/api/runtime/readiness', '/api/runtime/build-info']) {
              const { response, body } = await boundedFetch(base, path, {
                expectedStatus: 200,
                maxBytes: 262_144,
                accept: 'application/json',
              })
              if (!String(response.headers.get('content-type') || '').toLowerCase().includes('application/json')) {
                fail(`preflight_content_type_${path}`)
              }
              let parsed
              try { parsed = JSON.parse(body.toString('utf8')) } catch { fail(`preflight_json_invalid_${path}`) }
              if (!parsed || typeof parsed !== 'object' || Array.isArray(parsed)) {
                fail(`preflight_json_shape_${path}`)
              }
              smoke[path] = { http_status: 200, content_type: 'application/json' }
              if (path === '/api/runtime/build-info') {
                const data = parsed.data && typeof parsed.data === 'object' ? parsed.data : parsed
                smoke[path].runtime_build_sha = String(data.build_sha || data.git_sha || data.sha || 'unknown')
                smoke[path].compared_to_control_plane_sha = false
              }
            }
            const taskConsole = await boundedFetch(base, '/task-console', {
              expectedStatus: 200,
              maxBytes: 524_288,
              accept: 'text/html',
            })
            const html = taskConsole.body.toString('utf8')
            if (!html.includes('/assets/') || html.includes('/src/main.js')) fail('task_console_not_static')
            smoke['/task-console'] = { http_status: 200, static_frontend: true }
            await boundedFetch(base, '/@vite/client', {
              expectedStatus: 404,
              maxBytes: 65_536,
              accept: '*/*',
            })
            smoke['/@vite/client'] = { http_status: 404, vite_hmr_forbidden: true }
            preflight[baseUrl] = smoke
          }
          evidence.pre_publish_smoke = preflight
          evidence.runtime_sha_is_evidence_only = true
          evidence.production_touched = false
          evidence.secrets_exported = false
          evidence.envelope_in_evidence = false
          writeFileSync(process.env.SAFE_METADATA_PATH, JSON.stringify(evidence, null, 2) + '\n', { mode: 0o600 })
          NODE

      - name: Revalidate TTL and publish once to the fixed ntfy DEV topic
        shell: bash
        env:
          SIGNED_ENVELOPE_PATH: ${{ runner.temp }}/reqsys-dev-locator-envelope.json
          SAFE_METADATA_PATH: ${{ runner.temp }}/reqsys-dev-locator-metadata.json
          NTFY_RESPONSE_PATH: ${{ runner.temp }}/reqsys-dev-locator-ntfy-response.json
        run: |
          set -euo pipefail
          trap 'rm -f "$NTFY_RESPONSE_PATH"' EXIT
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs'
          import { verifyEnvelope } from './scripts/resolve_pc24x7_dev_locator.mjs'

          const fail = (message) => { throw new Error(message) }
          const envelopeText = readFileSync(process.env.SIGNED_ENVELOPE_PATH, 'utf8')
          const payload = verifyEnvelope(envelopeText)
          if (!payload) fail('relay_pre_post_reverification_failed')
          const evidence = JSON.parse(readFileSync(process.env.SAFE_METADATA_PATH, 'utf8'))
          if (!evidence.pre_publish_smoke || evidence.selected_url !== payload.selected_url) {
            fail('relay_pre_publish_smoke_missing')
          }
          if (!evidence.pre_publish_smoke[payload.selected_url]) fail('relay_selected_url_not_preflighted')
          const now = Math.floor(Date.now() / 1000)
          if (payload.expires_at - now < 300) fail('relay_ttl_below_300_seconds_before_post')
          NODE
          status="$(curl --silent --show-error \
            --request POST \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 20 \
            --max-filesize 16384 \
            --header 'Content-Type: text/plain; charset=utf-8' \
            --header 'Title: reqsys-dev-locator' \
            --header 'Firebase: no' \
            --data-binary "@$SIGNED_ENVELOPE_PATH" \
            --output "$NTFY_RESPONSE_PATH" \
            --write-out '%{http_code}' \
            'https://ntfy.sh/reqsys-dev-locator-1651e9182d6e1c939fa6672c1248c9d532716fe7')"
          test "$status" = '200'
          test "$(wc -c < "$NTFY_RESPONSE_PATH")" -le 16384

      - name: Read back exact envelope and reverify
        shell: bash
        env:
          SIGNED_ENVELOPE_PATH: ${{ runner.temp }}/reqsys-dev-locator-envelope.json
          SAFE_METADATA_PATH: ${{ runner.temp }}/reqsys-dev-locator-metadata.json
          NTFY_READBACK_PATH: ${{ runner.temp }}/reqsys-dev-locator-readback.ndjson
          RELAY_EVIDENCE_PATH: artifacts/pc24x7-dev-locator-relay/relay-evidence.json
        run: |
          set -euo pipefail
          trap 'rm -f "$NTFY_READBACK_PATH" "$SIGNED_ENVELOPE_PATH" "$SAFE_METADATA_PATH"' EXIT
          status="$(curl --silent --show-error \
            --proto '=https' \
            --tlsv1.2 \
            --connect-timeout 10 \
            --max-time 20 \
            --max-filesize 1048576 \
            --output "$NTFY_READBACK_PATH" \
            --write-out '%{http_code}' \
            'https://ntfy.sh/reqsys-dev-locator-1651e9182d6e1c939fa6672c1248c9d532716fe7/json?poll=1&since=10m')"
          test "$status" = '200'
          test "$(wc -c < "$NTFY_READBACK_PATH")" -le 1048576
          node --input-type=module <<'NODE'
          import { createHash } from 'node:crypto'
          import { mkdirSync, readFileSync, writeFileSync } from 'node:fs'
          import { dirname } from 'node:path'
          import { TITLE, verifyEnvelope } from './scripts/resolve_pc24x7_dev_locator.mjs'

          const fail = (message) => { throw new Error(message) }
          const expectedBytes = readFileSync(process.env.SIGNED_ENVELOPE_PATH)
          const expectedSha = createHash('sha256').update(expectedBytes).digest('hex')
          const safe = JSON.parse(readFileSync(process.env.SAFE_METADATA_PATH, 'utf8'))
          if (expectedSha !== safe.envelope_sha256) fail('relay_expected_sha_changed')
          const rows = readFileSync(process.env.NTFY_READBACK_PATH, 'utf8').split(/\r?\n/).filter(Boolean)
          const matches = []
          for (const row of rows) {
            let item
            try { item = JSON.parse(row) } catch { continue }
            if (item?.event !== 'message' || item?.title !== TITLE || typeof item?.message !== 'string') continue
            const messageBytes = Buffer.from(item.message, 'utf8')
            const messageSha = createHash('sha256').update(messageBytes).digest('hex')
            if (messageSha === expectedSha) matches.push({ item, messageBytes })
          }
          if (matches.length < 1) fail('exact_relay_envelope_not_found')
          const exact = matches.at(-1)
          if (!exact.messageBytes.equals(expectedBytes)) fail('exact_relay_envelope_bytes_mismatch')
          const payload = verifyEnvelope(exact.messageBytes.toString('utf8'))
          if (!payload) fail('relay_readback_reverification_failed')
          const now = Math.floor(Date.now() / 1000)
          if (payload.expires_at - now < 180) fail('relay_readback_ttl_below_180_seconds')
          if (safe.selected_url !== payload.selected_url) fail('relay_selected_url_mismatch')
          safe.readback = {
            exact_envelope_sha256: expectedSha,
            signature_reverified: true,
            ntfy_message_id: String(exact.item.id || ''),
            ntfy_time: Number(exact.item.time || 0),
          }
          safe.production_touched = false
          safe.secrets_exported = false
          safe.envelope_in_evidence = false
          mkdirSync(dirname(process.env.RELAY_EVIDENCE_PATH), { recursive: true })
          writeFileSync(process.env.RELAY_EVIDENCE_PATH, JSON.stringify(safe, null, 2) + '\n')
          NODE

      - name: Cleanup relay temporary files
        if: always()
        shell: bash
        env:
          SIGNED_ENVELOPE_PATH: ${{ runner.temp }}/reqsys-dev-locator-envelope.json
          SAFE_METADATA_PATH: ${{ runner.temp }}/reqsys-dev-locator-metadata.json
          NTFY_RESPONSE_PATH: ${{ runner.temp }}/reqsys-dev-locator-ntfy-response.json
          NTFY_READBACK_PATH: ${{ runner.temp }}/reqsys-dev-locator-readback.ndjson
          MAIN_RESPONSE_PATH: ${{ runner.temp }}/reqsys-dev-locator-main.json
        run: |
          rm -f \
            "$SIGNED_ENVELOPE_PATH" \
            "$SAFE_METADATA_PATH" \
            "$NTFY_RESPONSE_PATH" \
            "$NTFY_READBACK_PATH" \
            "$MAIN_RESPONSE_PATH"

      - name: Upload sanitized relay evidence
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pc24x7-dev-locator-relay-${{ github.run_id }}
          path: artifacts/pc24x7-dev-locator-relay/relay-evidence.json
          if-no-files-found: error
          retention-days: 7
