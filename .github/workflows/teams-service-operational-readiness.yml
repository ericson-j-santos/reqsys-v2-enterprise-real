name: Teams Service Operational Readiness

on:
  pull_request:
    paths:
      - docs/runbooks/teams-notification-service.md
      - .github/workflows/teams-*.yml
      - .github/workflows/deploy-reqsys-pages-composite.yml
      - tools/geradores/teams_graph_gateway_autocontido.py
      - docs/ops-dashboard/teams-notification/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-readiness:
    name: Validar prontidão operacional Teams
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validar componentes obrigatórios
        shell: bash
        run: |
          set -euo pipefail
          required=(
            '.github/workflows/teams-commit-notification.yml'
            '.github/workflows/teams-commit-notification-contract.yml'
            '.github/workflows/teams-notification-observability.yml'
            '.github/workflows/teams-notification-slo.yml'
            '.github/workflows/teams-notification-dashboard.yml'
            '.github/workflows/teams-dashboard-availability-monitor.yml'
            '.github/workflows/deploy-reqsys-pages-composite.yml'
            'tools/geradores/teams_graph_gateway_autocontido.py'
            'docs/ops-dashboard/teams-notification/index.html'
            'docs/runbooks/teams-notification-service.md'
          )
          for path in "${required[@]}"; do
            test -s "$path" || { echo "::error title=Componente ausente::$path"; exit 1; }
          done

      - name: Validar contrato do runbook
        shell: bash
        run: |
          set -euo pipefail
          runbook='docs/runbooks/teams-notification-service.md'
          markers=(
            'RTO para falha de entrega'
            'RPO das evidências'
            'CFG-001'
            'AUTH-001'
            'PAGE-001'
            'Critérios de recuperação'
            'Definição de padrão ouro consolidado'
          )
          for marker in "${markers[@]}"; do
            grep -Fq "$marker" "$runbook" || { echo "::error title=Runbook incompleto::Marcador ausente: $marker"; exit 1; }
          done

      - name: Validar segurança e automações
        shell: bash
        run: |
          set -euo pipefail
          producer='.github/workflows/teams-notification-dashboard.yml'
          publisher='.github/workflows/deploy-reqsys-pages-composite.yml'

          python -m py_compile tools/geradores/teams_graph_gateway_autocontido.py
          python tools/geradores/teams_graph_gateway_autocontido.py self-test
          grep -Fq 'TEAMS_GATEWAY_BASE_URL' .github/workflows/teams-commit-notification.yml
          grep -Fq 'TEAMS_GATEWAY_DESTINO_ID' .github/workflows/teams-commit-notification.yml
          grep -Fq 'scripts/notificar_teams.py' .github/workflows/teams-commit-notification.yml
          grep -Fq 'TEAMS_WEBHOOK_URL:' .github/workflows/teams-commit-notification.yml
          grep -Fq 'secrets.TEAMS_WEBHOOK_URL' .github/workflows/teams-commit-notification.yml
          grep -Fq 'TEAMS_WEBHOOK_RECIPIENT:' .github/workflows/teams-commit-notification.yml
          grep -Fq 'secrets.TEAMS_WEBHOOK_RECIPIENT' .github/workflows/teams-commit-notification.yml
          grep -Fq 'delivery_mode=webhook_fallback' .github/workflows/teams-commit-notification.yml
          grep -Fq 'commit-notification-fallback' .github/workflows/teams-commit-notification.yml
          ! grep -Fq 'continue-on-error:' .github/workflows/teams-commit-notification.yml
          grep -Fq 'schedule:' .github/workflows/teams-commit-notification.yml
          grep -Fq 'upload-artifact' .github/workflows/teams-notification-observability.yml
          grep -Fq 'SLO_TARGET' .github/workflows/teams-notification-slo.yml

          # Contrato Pages: Teams produz o artefato; somente o composto publica.
          grep -Fq 'actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a' "$producer"
          grep -Fq 'teams-dashboard-site' "$producer"
          ! grep -Fq 'actions/deploy-pages@' "$producer"
          grep -Fq 'workflow_dispatch:' "$publisher"
          grep -Fq 'expected_sha:' "$publisher"
          grep -Fq 'authorization:' "$publisher"
          grep -Fq 'DEPLOY_PAGES' "$publisher"
          ! grep -Fq 'workflow_run:' "$publisher"
          grep -Fq 'teams-dashboard-site' "$publisher"
          grep -Fq 'actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346' "$publisher"

          # Contrato de concorrência: novos disparos aguardam; não cancelam o produtor ativo.
          grep -Fq 'group: teams-notification-dashboard' "$producer"
          grep -Fq 'cancel-in-progress: false' "$producer"

          grep -Fq 'MAX_DATA_AGE_HOURS' .github/workflows/teams-dashboard-availability-monitor.yml
          ! grep -R --include='*.json' --include='*.html' -E 'https://[^ ]*(webhook|logic\.azure|powerautomate)' docs/ops-dashboard/teams-notification

      - name: Registrar evidência
        run: |
          {
            echo '### Teams Service Operational Readiness'
            echo '- Componentes: OK'
            echo '- Runbook: OK'
            echo '- Gateway: OK'
            echo '- Segurança: OK'
            echo '- Pages: produtor e publicador único validados'
            echo '- Concorrência: fila sem cancelamento do produtor ativo'
            echo '- Resultado: padrão operacional validado'
          } >> "$GITHUB_STEP_SUMMARY"
