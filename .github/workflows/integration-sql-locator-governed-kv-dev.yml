name: Integration SQL Locator via Governed Key Vault — DEV

on:
  push:
    branches:
      - ops/auto-sql-locator-1649-20260913
    paths:
      - .github/workflows/integration-sql-locator-governed-kv-dev.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  INTEGRATION_E2E_ENVIRONMENT: dev
  INTEGRATION_E2E_SQL_PROCEDURE: integration.usp_ConsultarPorIdentificadores
  EVIDENCE_DIR: audit/user-journey/excel-sql-sharepoint-dev-governed-kv

jobs:
  locator:
    name: Descobrir locator SQL DEV via identidade governada
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: development
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências mínimas
        run: |
          set -euo pipefail
          bash .github/scripts/install-unixodbc-ci.sh
          python -m pip install --upgrade pip
          pip install pyodbc pytest

      - name: Validar sonda
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_integration_excel_sql_sharepoint_sql_locator.py -q

      - name: Login Azure OIDC com identidade governada já confiável
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.CCP_AZURE_CLIENT_ID_FLY_GOVERNED_COMMAND }}
          tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Resolver DSN no Key Vault sem expor nome ou valor
        id: kv
        continue-on-error: true
        shell: bash
        env:
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          names="$RUNNER_TEMP/names.txt"
          selected="$RUNNER_TEMP/selected.txt"
          az keyvault secret list --vault-name "$REQSYS_KEY_VAULT_NAME" --query '[].name' -o tsv > "$names"
          python - "$names" "$selected" <<'PY'
          import re, sys
          from pathlib import Path
          names=[x.strip() for x in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines() if x.strip()]
          candidates=[n for n in names if re.search(r'(sql.*(dsn|connection|conn|string)|(?:dsn|connection|conn|string).*sql)', n, re.I)]
          print(f'sql_candidate_count={len(candidates)}')
          if len(candidates) != 1:
              raise SystemExit(3)
          Path(sys.argv[2]).write_text(candidates[0], encoding='utf-8')
          PY
          name="$(cat "$selected")"
          dsn="$(az keyvault secret show --vault-name "$REQSYS_KEY_VAULT_NAME" --name "$name" --query value -o tsv)"
          if [ -z "$dsn" ]; then exit 4; fi
          case "$dsn" in *$'\n'*|*$'\r'*) exit 5;; esac
          echo "::add-mask::$dsn"
          printf 'INTEGRATION_E2E_SQL_DSN=%s\n' "$dsn" >> "$GITHUB_ENV"

      - name: Registrar bloqueio sanitizado do Key Vault
        if: steps.kv.outcome != 'success'
        shell: bash
        run: |
          mkdir -p "$EVIDENCE_DIR"
          python - <<'PY'
          import json, os
          from pathlib import Path
          Path(os.environ['EVIDENCE_DIR'],'sql-locator.json').write_text(json.dumps({
            'schema_version':'1.0.0','feature':'excel_sql_sharepoint_sql_locator',
            'source_sha':os.environ.get('GITHUB_SHA',''),'environment':'dev',
            'status':'blocked','error':'governed_keyvault_dsn_resolution_failed',
            'mocked':False,'simulated':False,'dsn_present':False,
            'production_touched':False,'test_touched':False
          }, indent=2)+'\n', encoding='utf-8')
          PY

      - name: Consultar somente metadados SQL DEV
        if: steps.kv.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python scripts/integration_excel_sql_sharepoint_sql_locator.py \
            --strict \
            --output "$EVIDENCE_DIR/sql-locator.json" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "sql-locator-governed-kv-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-sql-locator-governed-kv-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/sql-locator.json
          if-no-files-found: error
          retention-days: 30

      - name: Falhar fechado se Key Vault permanecer bloqueado
        if: always() && steps.kv.outcome != 'success'
        run: exit 1
