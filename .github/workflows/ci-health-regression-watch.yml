name: CI Health Regression Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-health-regression-watch.yml'
      - 'scripts/ci_health_regression_monitor.py'
      - 'tests/test_ci_health_regression_watch.py'
      - 'config/workflow-governance-registry.json'

concurrency:
  group: ci-health-regression-watch-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze rolling 14-day CI health
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      actions: read
      contents: read
      pull-requests: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Validate monitor contract and negative controls
        run: python tests/test_ci_health_regression_watch.py

      - name: Analyze current 14-day window
        id: analyze
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          LOOKBACK_DAYS: '14'
        run: python scripts/ci_health_regression_monitor.py

      - name: Publish current evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ci-health-regression-watch-${{ github.run_id }}
          path: artifacts/ci-health-regression-watch/
          if-no-files-found: error
          retention-days: 30

  alert:
    name: Notify only on material regression
    needs: analyze
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && needs.analyze.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write

    steps:
      - name: Download current evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ci-health-regression-watch-${{ github.run_id }}
          path: artifacts/ci-health-regression-watch/

      - name: Synchronize regression episode issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          REPORT_JSON: artifacts/ci-health-regression-watch/report.json
          REPORT_MD: artifacts/ci-health-regression-watch/report.md
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync(process.env.REPORT_JSON, 'utf8'));
            const markdown = fs.readFileSync(process.env.REPORT_MD, 'utf8');
            const marker = '<!-- reqsys-ci-health-regression-watch -->';

            const openIssues = await github.paginate(
              github.rest.issues.listForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100
              }
            );
            const current = openIssues.find(
              item => !item.pull_request && String(item.body || '').includes(marker)
            );

            if (!report.material_regression) {
              if (current) {
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: current.number,
                  state: 'closed'
                });
              }
              return;
            }

            const signatureParts = Array.from(report.active_metrics || []);
            for (const alert of report.alerts || []) {
              if (alert.metric === 'post_merge_false_green') {
                for (const item of alert.evidence || []) {
                  signatureParts.push('false-green:' + String(item.merge_sha || ''));
                }
              }
              if (alert.metric === 'sha_divergence') {
                for (const item of alert.evidence || []) {
                  signatureParts.push(
                    'sha-divergence:' +
                    String(item.pr_number || '') +
                    ':' +
                    String(item.current_head_sha || '')
                  );
                }
              }
            }
            const signature = signatureParts.sort().join('|');
            const body =
              markdown +
              '\n<!-- alert_signature:' +
              signature +
              ' -->\n' +
              '- Workflow run: https://github.com/' +
              context.repo.owner +
              '/' +
              context.repo.repo +
              '/actions/runs/' +
              context.runId +
              '\n';

            const title =
              '[CI Health] Regressão material: ' +
              Array.from(report.active_metrics || []).join(', ');

            if (!current) {
              await github.rest.issues.create({
                owner: context.repo.owner,
                repo: context.repo.repo,
                title,
                body
              });
              return;
            }

            const match = String(current.body || '').match(
              /<!-- alert_signature:([^>]*) -->/
            );
            const previousSignature = match ? match[1] : '';
            if (previousSignature === signature) {
              return;
            }

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: current.number,
              title,
              body
            });
