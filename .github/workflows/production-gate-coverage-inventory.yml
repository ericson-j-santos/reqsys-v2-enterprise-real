name: Production Gate Coverage Inventory

on:
  workflow_dispatch:
  schedule:
    - cron: "53 * * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/inventory_production_gate_coverage.py"
      - "tests/test_inventory_production_gate_coverage.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/inventory_production_gate_coverage.py"
      - "tests/test_inventory_production_gate_coverage.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: production-gate-coverage-inventory
  cancel-in-progress: true

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Run focused tests
        run: python -m pytest -q tests/test_inventory_production_gate_coverage.py

      - name: Build production gate inventory
        run: |
          mkdir -p artifacts/production-gate-coverage
          python scripts/inventory_production_gate_coverage.py \
            --workflow-dir .github/workflows \
            --output artifacts/production-gate-coverage/report.json \
            --issue-body artifacts/production-gate-coverage/issue-body.md

      - name: Collect managed issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate --slurp "repos/${{ github.repository }}/issues?state=all&per_page=100" \
            --jq 'add | [.[] | select(.pull_request == null and ((.body // "") | contains("<!-- reqsys-production-gate-coverage -->")))] | sort_by(.number) | last // {}' \
            > artifacts/production-gate-coverage/existing-issue.json

      - name: Synchronize P0 delivery blocker issue
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          repo = os.environ["REPOSITORY"]
          root = Path("artifacts/production-gate-coverage")
          report = json.loads((root / "report.json").read_text(encoding="utf-8"))
          existing = json.loads((root / "existing-issue.json").read_text(encoding="utf-8"))
          body = (root / "issue-body.md").read_text(encoding="utf-8")

          def api(method, endpoint, payload):
              subprocess.run(
                  ["gh", "api", "--method", method, endpoint, "--input", "-"],
                  input=json.dumps(payload, ensure_ascii=False),
                  text=True,
                  check=True,
              )

          subprocess.run(
              [
                  "gh",
                  "api",
                  "--method",
                  "POST",
                  f"repos/{repo}/labels",
                  "-f",
                  "name=delivery-blocker",
                  "-f",
                  "color=b60205",
                  "-f",
                  "description=Bloqueador objetivo da entrega",
              ],
              check=False,
              stdout=subprocess.DEVNULL,
              stderr=subprocess.DEVNULL,
          )

          number = existing.get("number")
          if report["delivery_blocker"]:
              payload = {
                  "title": "[Delivery][P0] Caminhos de produção sem gate governado",
                  "body": body,
                  "labels": ["delivery-blocker", "bacen", "priority-p0"],
                  "state": "open",
              }
              if number:
                  api("PATCH", f"repos/{repo}/issues/{number}", payload)
              else:
                  api("POST", f"repos/{repo}/issues", payload)
          elif number and str(existing.get("state") or "").lower() == "open":
              api(
                  "POST",
                  f"repos/{repo}/issues/{number}/comments",
                  {"body": "Todos os caminhos de produção possuem gate governado. Fechamento automático."},
              )
              api(
                  "PATCH",
                  f"repos/{repo}/issues/{number}",
                  {"state": "closed", "state_reason": "completed"},
              )
          PY

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(
              Path("artifacts/production-gate-coverage/report.json").read_text(
                  encoding="utf-8"
              )
          )
          summary = report["summary"]
          print("## Production Gate Coverage Inventory")
          print(f"\n- Capazes de tocar PROD: **{summary['production_capable_workflows']}**")
          print(f"- Protegidos: **{summary['protected_workflows']}**")
          print(f"- Não protegidos: **{summary['unprotected_workflows']}**")
          print(f"- Bloqueador de entrega: **{str(report['delivery_blocker']).lower()}**")
          print(f"- Enforcement pronto: **{str(report['automatic_enforcement_ready']).lower()}**")
          print("- Produção acessada: **false**")
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-gate-coverage
          path: artifacts/production-gate-coverage/
          if-no-files-found: error
          retention-days: 365
