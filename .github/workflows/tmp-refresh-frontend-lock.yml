name: Temporary Refresh Frontend Lockfile

on:
  push:
    branches:
      - agent/bacen-minimum-controls-v1
    paths:
      - frontend/package.json
      - .github/workflows/tmp-refresh-frontend-lock.yml

permissions:
  contents: write

jobs:
  refresh-lockfile:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bacen-minimum-controls-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Regenerate package-lock only
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate clean install and audit
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm audit --audit-level=high

      - name: Commit regenerated lockfile
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- frontend/package-lock.json; then
            echo "package-lock.json já está consistente"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/package-lock.json
          git commit -m "fix(ci): sincronizar lockfile frontend"
          git push origin HEAD:agent/bacen-minimum-controls-v1
