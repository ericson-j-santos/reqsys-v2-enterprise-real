name: Trilhas — Padrão Ouro Consolidado

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/trilhas-padrao-ouro.yml'
      - 'scripts/trilhas_padrao_ouro.py'
      - 'scripts/trilha_*_*.py'
      - 'docs/architecture/trilhas/**'
      - 'docs/architecture/trilha-*/**'
      - 'docs/adr/ADR-03*-trilha-*.md'
      - 'docs/adr/ADR-040-trilhas-padrao-ouro.md'
      - 'docs/runbooks/trilhas-padrao-ouro.md'
      - 'docs/runbooks/trilha-*.md'
      - 'docs/contracts/trilhas-padrao-ouro.schema.json'
      - 'tests/test_trilhas_padrao_ouro.py'
      - 'tests/test_dev_runtime_manifest.py'
      - 'tests/test_trilhas_validator_contract.py'
      - 'scripts/validate_dev_runtime_manifest.py'
      - 'infra/public-access-urls.json'
  push:
    branches: [main]
    paths:
      - '.github/workflows/trilhas-padrao-ouro.yml'
      - 'scripts/trilhas_padrao_ouro.py'
      - 'docs/architecture/trilhas/**'

concurrency:
  group: trilhas-padrao-ouro-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate-trilhas-padrao-ouro:
    # Contrato estático: CI não comprova host físico, lease nem assinatura viva.
    name: Consolidar Trilhas A–E — Padrão Ouro (report-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validar contrato DEV PC24x7 e controles negativos
        shell: bash
        run: |
          set -euo pipefail
          python -m unittest discover -s tests -p 'test_dev_runtime_manifest.py' -v
          python -m unittest discover -s tests -p 'test_trilhas_validator_contract.py' -v

      - name: Executar consolidacao A-E report-only
        id: consolidate
        shell: bash
        run: |
          set -euo pipefail
          python scripts/trilhas_padrao_ouro.py | tee /tmp/trilhas-padrao-ouro-summary.json

      - name: Resumo executivo
        if: always()
        shell: bash
        run: |
          REPORT="audit/trilhas/trilhas-padrao-ouro-report.json"
          if [[ ! -f "${REPORT}" ]]; then exit 0; fi
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          report = json.loads(Path("audit/trilhas/trilhas-padrao-ouro-report.json").read_text())
          s = report["summary"]
          print("## Trilhas — Padrão Ouro Consolidado")
          print()
          print(f"- Estado estatico: **{report['status']}** (E2E fisico nao verificado)")
          print(f"- Maturidade: {s['gold_standard_percent']}%")
          print(f"- Trilhas: {s['trails_passed']} verde / {s['trails_warning']} amarelo / {s['trails_failed']} vermelho")
          print()
          print("| Trilha | Status | Faltando |")
          print("|---|---|---|")
          for t in report["trails"]:
              missing = ", ".join(t["missing"]) if t["missing"] else "—"
              print(f"| {t['trail_id']} | {t['status']} | {missing} |")
          PY

      - name: Upload consolidated evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: trilhas-padrao-ouro-evidence-${{ github.run_id }}
          path: |
            audit/trilhas/
            audit/trilha-a/
            audit/trilha-b/
            audit/trilha-c/
            audit/trilha-e/
          retention-days: 30
