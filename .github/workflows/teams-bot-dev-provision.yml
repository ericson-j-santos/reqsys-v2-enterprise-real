name: Teams Bot DEV Provision

on:
  pull_request:
    paths:
      - ".github/workflows/teams-bot-dev-provision.yml"
      - "scripts/bootstrap_teams_bot_dev_identity.py"
      - "scripts/configure_teams_bot_dev_identity_risk3.py"
      - "scripts/run_teams_bot_dev_identity_bootstrap_local.py"
      - ".github/self-hosted-runner-policy.json"
      - ".github/workflows/reqsys-authorized-actions-gateway.yml"
      - "tests/test_teams_bot_dev_provision_workflow.py"
      - "tests/test_bootstrap_teams_bot_dev_identity.py"
      - "tests/test_teams_bot_dev_identity_automation.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/teams-bot-dev-provision.yml"
  workflow_dispatch:
    inputs:
      operation:
        description: "Operação DEV governada"
        type: choice
        options:
          - identity-bootstrap
        default: identity-bootstrap

concurrency:
  group: teams-bot-dev-provision
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: Validar contrato de ativação do Azure Bot DEV
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Executar testes focados
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==9.0.3" "PyYAML==6.0.2"
          python -m pytest -q \
            tests/test_teams_bot_dev_provision_workflow.py \
            tests/test_bootstrap_teams_bot_dev_identity.py \
            tests/test_teams_bot_dev_identity_automation.py

  identity-bootstrap-dev:
    name: Executar bootstrap Teams Bot DEV via Noteri Risk3
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'identity-bootstrap' }}
    needs: contract
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 10
    env:
      TARGET_REPO: ${{ github.workspace }}\_target_source
      CORRELATION_ID: teams-bot-dev-identity-${{ github.run_id }}-${{ github.run_attempt }}
      ACTION_ID: reqsys.teams-bot-dev-identity-bootstrap.dev
      ACTION_SCOPE: repo://ericson-j-santos/reqsys-v2-enterprise-real/environment/dev/teams-bot-identity
      EVIDENCE_REL: artifacts/teams-bot-dev-identity-bootstrap/evidence.json
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}

    steps:
      - name: Checkout regras canônicas
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: main
          path: _rules
          fetch-depth: 1

      - name: Checkout ReqSys no SHA imutável
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ericson-j-santos/reqsys-v2-enterprise-real
          ref: ${{ github.sha }}
          path: _target_source
          fetch-depth: 0
          persist-credentials: false

      - name: Preparar Python portátil verificado no runner Noteri
        shell: powershell
        env:
          PORTABLE_PYTHON_VERSION: "3.12.10"
          PORTABLE_PYTHON_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PORTABLE_PYTHON_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP ("reqsys-python-" + $env:PORTABLE_PYTHON_VERSION + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force -Path $root | Out-Null
          $zip = Join-Path $root "python.zip"
          Invoke-WebRequest -Uri $env:PORTABLE_PYTHON_URL -OutFile $zip -UseBasicParsing -TimeoutSec 120
          $stream = [System.IO.File]::OpenRead($zip)
          try {
            $sha256 = [System.Security.Cryptography.SHA256]::Create()
            try {
              $observedHash = ([System.BitConverter]::ToString($sha256.ComputeHash($stream))).Replace('-', '').ToLowerInvariant()
            }
            finally {
              $sha256.Dispose()
            }
          }
          finally {
            $stream.Dispose()
          }
          if ($observedHash -ne $env:PORTABLE_PYTHON_SHA256) {
            throw "portable_python_sha256_mismatch:$observedHash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $pythonExe = Join-Path $root "python.exe"
          if (-not (Test-Path -LiteralPath $pythonExe -PathType Leaf)) { throw "portable_python_executable_missing" }
          $observedVersion = & $pythonExe --version
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne "Python $env:PORTABLE_PYTHON_VERSION") {
            throw "portable_python_version_mismatch:$observedVersion"
          }
          "REQSYS_PYTHON=$pythonExe" | Add-Content $env:GITHUB_ENV

      - name: Validar host e tenant esperados
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME -ne "NOTERI") {
            throw "UNEXPECTED_HOST: $env:COMPUTERNAME"
          }
          if (-not $env:CCP_AZURE_TENANT_ID) {
            throw "CCP_AZURE_TENANT_ID_MISSING"
          }

      - name: Bootstrap obrigatório de sessão
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "teamsbot-id",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/main"
          )
          $raw = & $env:REQSYS_PYTHON $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") {
            throw "SESSION_HEAD_MISMATCH"
          }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT

      - name: Instalar autorização Risk3 exata e temporária
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:TARGET_PATH
          try {
            $args = @("scripts/configure_teams_bot_dev_identity_risk3.py", "--enable", "--ttl-minutes", "30", "--confirm", "ENABLE-TEAMS-BOT-DEV-IDENTITY-BOOTSTRAP-ONCE")
            & $env:REQSYS_PYTHON @args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Executar bootstrap via Owner Risk3 Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\owner_risk3_gateway.py"
          $riskArgs = @(
            "--action-id", $env:ACTION_ID,
            "--scope", $env:ACTION_SCOPE,
            "--cwd", $env:TARGET_PATH,
            "--timeout", "300",
            "--correlation-id", $env:CORRELATION_ID
          )
          & $env:REQSYS_PYTHON $gateway @riskArgs
          exit $LASTEXITCODE

      - name: Remover autorização Risk3 temporária
        if: ${{ always() && steps.session.outputs.target_path != '' }}
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          Push-Location $env:TARGET_PATH
          try {
            $args = @("scripts/configure_teams_bot_dev_identity_risk3.py", "--disable", "--confirm", "DISABLE-TEAMS-BOT-DEV-IDENTITY-BOOTSTRAP-ONCE")
            & $env:REQSYS_PYTHON @args
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          finally {
            Pop-Location
          }

      - name: Validar evidência sanitizada
        if: ${{ always() && steps.session.outputs.target_path != '' }}
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path $evidence)) { throw "TEAMS_BOT_IDENTITY_EVIDENCE_MISSING" }
          $data = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
          if ($data.status -notin @("READY", "ALREADY_COMPLIANT")) { throw "TEAMS_BOT_IDENTITY_NOT_READY" }
          if ($data.environment -ne "dev") { throw "ENVIRONMENT_MISMATCH" }
          if ($data.host -ne "NOTERI") { throw "HOST_MISMATCH" }
          if ($data.independent_readback -ne $true) { throw "INDEPENDENT_READBACK_MISSING" }
          if ($data.secret_value_exposed -ne $false) { throw "SECRET_EXPOSURE_REPORTED" }
          if ($data.production_touched -ne $false) { throw "PRODUCTION_TOUCH_REPORTED" }
          if (-not $data.app_id) { throw "APP_ID_MISSING" }

      - name: Publicar evidência sanitizada
        if: ${{ always() && steps.session.outputs.target_path != '' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: teams-bot-dev-identity-bootstrap-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\teams-bot-dev-identity-bootstrap\
          if-no-files-found: warn
          retention-days: 30
