name: Teams Bot DEV Provision

on:
  pull_request:
    paths:
      - ".github/workflows/teams-bot-dev-provision.yml"
      - "scripts/bootstrap_teams_bot_dev_identity.py"
      - "tests/test_teams_bot_dev_provision_workflow.py"
      - "tests/test_bootstrap_teams_bot_dev_identity.py"
  push:
    branches: [main]
    paths:
      - ".github/workflows/teams-bot-dev-provision.yml"
  schedule:
    # Retomada automática: assim que o bootstrap humano materializar a identidade
    # no Key Vault, a próxima janela conclui o provisionamento sem novo merge.
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      force_runtime_sync:
        description: "Regravar os segredos do bot no Fly mesmo que já estejam presentes"
        type: boolean
        default: false

concurrency:
  group: teams-bot-dev-provision
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  contract:
    name: Validar contrato de ativação do Azure Bot DEV
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Executar testes focados
        run: |
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==9.0.3" "PyYAML==6.0.2"
          python -m pytest -q \
            tests/test_teams_bot_dev_provision_workflow.py \
            tests/test_bootstrap_teams_bot_dev_identity.py

  activate-dev:
    name: Ativar Azure Bot e runtime ReqSys DEV
    if: ${{ github.event_name != 'pull_request' && vars.CCP_ENABLED == 'true' }}
    needs: contract
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    env:
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      BOT_SECRET_VAULT_NAME: reqsys-teams-bot-dev-secret
      FLY_TRUST_ANCHOR_SECRET_NAME: reqsys-fly-control-plane-org-token
      BOT_NAME: reqsys-teams-bot-dev-1228361750
      RESOURCE_GROUP: rg-reqsys-teams-bot-dev
      AZURE_LOCATION: brazilsouth
      TARGET_ENDPOINT: https://reqsys-api-dev.fly.dev/v1/teams-gateway/ai-conversations/bot/messages
      FLY_APP: reqsys-api-dev
      HEALTH_URL: https://reqsys-api-dev.fly.dev/health
      PACKAGE_DIR: audit/teams-app-dev-package
      PACKAGE_ZIP: audit/reqsys-teams-gateway-dev-v1.2.0.zip
      EVIDENCE_FILE: audit/teams-bot-dev-activation.json
      AZURE_CORE_OUTPUT: none
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validar pré-requisitos da identidade mutadora
        shell: bash
        run: |
          set -euo pipefail
          for name in CCP_AZURE_CLIENT_ID CCP_AZURE_TENANT_ID CCP_AZURE_SUBSCRIPTION_ID REQSYS_KEY_VAULT_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name não configurado; ativação permanece fail-closed."
              exit 2
            fi
          done

      - name: Autenticar identidade mutadora no Azure por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Validar identidade dedicada e acesso Fly sem mutação
        id: preflight
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p audit
          status="precondition_failed"
          blocker=""
          app_id=""
          bot_exists=false

          write_evidence() {
            STATUS="$status" BLOCKER="$blocker" APP_ID="$app_id" BOT_EXISTS="$bot_exists" python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'schema_version': '1.2.0',
              'environment': 'dev',
              'status': os.environ['STATUS'],
              'blocker': os.environ.get('BLOCKER') or None,
              'app_id': os.environ.get('APP_ID') or None,
              'bot_exists': os.environ.get('BOT_EXISTS') == 'true',
              'bot_secret_name': os.environ['BOT_SECRET_VAULT_NAME'],
              'fly_trust_anchor_secret_name': os.environ['FLY_TRUST_ANCHOR_SECRET_NAME'],
              'secret_value_exposed': False,
          }
          Path(os.environ['EVIDENCE_FILE']).write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY
          }

          secret_json="$(az keyvault secret show \
            --vault-name "$REQSYS_KEY_VAULT_NAME" \
            --name "$BOT_SECRET_VAULT_NAME" \
            --query '{enabled:attributes.enabled,tags:tags}' \
            --output json --only-show-errors 2>/dev/null)" || {
              blocker="TEAMS_BOT_IDENTITY_BOOTSTRAP_REQUIRED"
              write_evidence
              echo "::error::Identidade dedicada ainda não foi materializada no Key Vault. Execute scripts/bootstrap_teams_bot_dev_identity.py com uma conta Entra autorizada."
              exit 20
            }

          app_id="$(jq -r '.tags["app-id"] // empty' <<<"$secret_json")"
          if ! [[ "$app_id" =~ ^[0-9a-fA-F-]{36}$ ]]; then
            blocker="TEAMS_BOT_APP_ID_TAG_INVALID"
            write_evidence
            echo "::error::O segredo $BOT_SECRET_VAULT_NAME não possui tag app-id válida."
            exit 21
          fi

          bot_secret="$(az keyvault secret show \
            --vault-name "$REQSYS_KEY_VAULT_NAME" \
            --name "$BOT_SECRET_VAULT_NAME" \
            --query value --output tsv --only-show-errors)"
          if [ -z "$bot_secret" ]; then
            blocker="TEAMS_BOT_SECRET_EMPTY"
            write_evidence
            exit 22
          fi
          echo "::add-mask::$bot_secret"
          unset bot_secret

          fly_admin_token="$(az keyvault secret show \
            --vault-name "$REQSYS_KEY_VAULT_NAME" \
            --name "$FLY_TRUST_ANCHOR_SECRET_NAME" \
            --query value --output tsv --only-show-errors)"
          if [ -z "$fly_admin_token" ]; then
            blocker="FLY_TRUST_ANCHOR_UNREADABLE"
            write_evidence
            exit 23
          fi
          echo "::add-mask::$fly_admin_token"
          if ! FLY_API_TOKEN="$fly_admin_token" flyctl status --app "$FLY_APP" --json >/dev/null; then
            blocker="FLY_TRUST_ANCHOR_CANNOT_ACCESS_DEV"
            write_evidence
            exit 24
          fi
          fly_inventory=""
          if ! fly_inventory="$(FLY_API_TOKEN="$fly_admin_token" flyctl secrets list --app "$FLY_APP")"; then
            blocker="FLY_TRUST_ANCHOR_CANNOT_READ_SECRET_INVENTORY"
            write_evidence
            exit 25
          fi
          unset fly_admin_token

          runtime_secrets_present=true
          for secret_name in TEAMS_BOT_APP_ID TEAMS_BOT_APP_TENANT_ID TEAMS_BOT_SECRET; do
            if ! grep -q "$secret_name" <<<"$fly_inventory"; then
              runtime_secrets_present=false
            fi
          done

          if az bot show --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
            bot_exists=true
            current_app_id="$(az bot show --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --query properties.msaAppId --output tsv --only-show-errors)"
            current_endpoint="$(az bot show --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --query properties.endpoint --output tsv --only-show-errors)"
            current_sku="$(az bot show --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --query sku.name --output tsv --only-show-errors)"
            if [ "$current_app_id" != "$app_id" ] || [ "${current_endpoint%/}" != "${TARGET_ENDPOINT%/}" ] || [ "$current_sku" != "F0" ]; then
              blocker="EXISTING_BOT_CONTRACT_MISMATCH"
              write_evidence
              exit 26
            fi
          fi

          runtime_synced=false
          if [ "$bot_exists" = "true" ] && [ "$runtime_secrets_present" = "true" ]; then
            runtime_synced=true
          fi

          status="preflight_ready"
          write_evidence
          echo "app_id=$app_id" >> "$GITHUB_OUTPUT"
          echo "runtime_synced=$runtime_synced" >> "$GITHUB_OUTPUT"

      - name: Ativar Azure Bot, Teams e segredos no Fly DEV
        if: steps.preflight.outcome == 'success'
        id: activate
        shell: bash
        env:
          BOT_APP_ID: ${{ steps.preflight.outputs.app_id }}
          RUNTIME_ALREADY_SYNCED: ${{ steps.preflight.outputs.runtime_synced }}
          FORCE_RUNTIME_SYNC: ${{ inputs.force_runtime_sync || false }}
        run: |
          set -Eeuo pipefail
          mkdir -p audit "$PACKAGE_DIR"
          test -n "$BOT_APP_ID"

          CREATED_GROUP=0
          CREATED_BOT=0
          CREATED_CHANNEL=0
          RUNTIME_COMMITTED=0
          STAGE="read_secrets"

          write_failure_evidence() {
            STATUS="activation_failed" STAGE_VALUE="$STAGE" APP_ID_VALUE="$BOT_APP_ID" python - <<'PY'
          import json, os
          from pathlib import Path
          payload = {
              'schema_version': '1.2.0',
              'environment': 'dev',
              'status': os.environ['STATUS'],
              'stage': os.environ['STAGE_VALUE'],
              'app_id': os.environ['APP_ID_VALUE'],
              'bot_name': os.environ['BOT_NAME'],
              'messaging_endpoint': os.environ['TARGET_ENDPOINT'],
              'secret_value_exposed': False,
          }
          Path(os.environ['EVIDENCE_FILE']).write_text(
              json.dumps(payload, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY
          }

          cleanup() {
            rc=$?
            if [ "$rc" -ne 0 ]; then
              write_failure_evidence || true
              if [ "$RUNTIME_COMMITTED" -eq 0 ]; then
                echo "::warning::Falha antes do commit dos segredos Fly; revertendo somente recursos Azure criados nesta execução."
                if [ "$CREATED_BOT" -eq 1 ]; then
                  az bot delete --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1 || true
                elif [ "$CREATED_CHANNEL" -eq 1 ]; then
                  az bot msteams delete --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1 || true
                fi
                if [ "$CREATED_GROUP" -eq 1 ]; then
                  az group delete --name "$RESOURCE_GROUP" --yes --no-wait >/dev/null 2>&1 || true
                fi
              fi
            fi
            exit "$rc"
          }
          trap cleanup ERR

          BOT_SECRET="$(az keyvault secret show \
            --vault-name "$REQSYS_KEY_VAULT_NAME" \
            --name "$BOT_SECRET_VAULT_NAME" \
            --query value --output tsv --only-show-errors)"
          FLY_ADMIN_TOKEN="$(az keyvault secret show \
            --vault-name "$REQSYS_KEY_VAULT_NAME" \
            --name "$FLY_TRUST_ANCHOR_SECRET_NAME" \
            --query value --output tsv --only-show-errors)"
          test -n "$BOT_SECRET"
          test -n "$FLY_ADMIN_TOKEN"
          echo "::add-mask::$BOT_SECRET"
          echo "::add-mask::$FLY_ADMIN_TOKEN"

          STAGE="ensure_resource_group"
          if ! az group show --name "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
            az group create \
              --name "$RESOURCE_GROUP" \
              --location "$AZURE_LOCATION" \
              --tags reqsys=true environment=dev component=teams-bot managed-by=github-actions \
              --only-show-errors --output none
            CREATED_GROUP=1
          fi

          STAGE="ensure_azure_bot"
          if az bot show --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --only-show-errors >/dev/null 2>&1; then
            current_app_id="$(az bot show --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --query properties.msaAppId --output tsv --only-show-errors)"
            current_endpoint="$(az bot show --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --query properties.endpoint --output tsv --only-show-errors)"
            current_sku="$(az bot show --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --query sku.name --output tsv --only-show-errors)"
            test "$current_app_id" = "$BOT_APP_ID"
            test "${current_endpoint%/}" = "${TARGET_ENDPOINT%/}"
            test "$current_sku" = "F0"
          else
            az bot create \
              --name "$BOT_NAME" \
              --resource-group "$RESOURCE_GROUP" \
              --app-type SingleTenant \
              --appid "$BOT_APP_ID" \
              --tenant-id "$CCP_AZURE_TENANT_ID" \
              --endpoint "$TARGET_ENDPOINT" \
              --location global \
              --sku F0 \
              --tags reqsys=true environment=dev component=teams-bot managed-by=github-actions \
              --only-show-errors --output none
            CREATED_BOT=1
          fi

          STAGE="ensure_teams_channel"
          if ! az bot msteams show --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --with-secrets false --only-show-errors >/dev/null 2>&1; then
            az bot msteams create --name "$BOT_NAME" --resource-group "$RESOURCE_GROUP" --only-show-errors --output none
            CREATED_CHANNEL=1
          fi

          STAGE="build_teams_package"
          python scripts/build_teams_app_package.py \
            --source-dir infra/teams-app \
            --output-dir "$PACKAGE_DIR" \
            --output-zip "$PACKAGE_ZIP" \
            --app-id "$BOT_APP_ID"

          STAGE="configure_fly_runtime"
          RUNTIME_SECRET_SYNC="applied"
          if [ "$RUNTIME_ALREADY_SYNCED" != "true" ] || [ "$FORCE_RUNTIME_SYNC" = "true" ]; then
            FLY_API_TOKEN="$FLY_ADMIN_TOKEN" flyctl secrets set \
              "TEAMS_BOT_APP_ID=$BOT_APP_ID" \
              "TEAMS_BOT_APP_TENANT_ID=$CCP_AZURE_TENANT_ID" \
              "TEAMS_BOT_SECRET=$BOT_SECRET" \
              --app "$FLY_APP"
          else
            RUNTIME_SECRET_SYNC="skipped_already_present"
            echo "::notice::Runtime DEV já possui as três credenciais do bot; regravação ignorada para não reiniciar $FLY_APP."
          fi
          RUNTIME_COMMITTED=1

          secret_names="$(FLY_API_TOKEN="$FLY_ADMIN_TOKEN" flyctl secrets list --app "$FLY_APP")"
          for secret_name in TEAMS_BOT_APP_ID TEAMS_BOT_APP_TENANT_ID TEAMS_BOT_SECRET; do
            if ! grep -q "$secret_name" <<<"$secret_names"; then
              echo "::error::Secret $secret_name não apareceu no inventário sanitizado do Fly."
              exit 30
            fi
          done

          STAGE="validate_health"
          curl --fail --silent --show-error --retry 8 --retry-delay 5 --retry-all-errors "$HEALTH_URL" >/dev/null

          STAGE="write_evidence"
          APP_ID_VALUE="$BOT_APP_ID" RUNTIME_SECRET_SYNC="$RUNTIME_SECRET_SYNC" python - <<'PY'
          import json, os, zipfile
          from pathlib import Path
          with zipfile.ZipFile(os.environ['PACKAGE_ZIP']) as zf:
              manifest = json.loads(zf.read('manifest.json'))
          app_id = os.environ['APP_ID_VALUE']
          assert manifest['id'] == app_id
          assert manifest['bots'][0]['botId'] == app_id
          assert manifest['bots'][0]['isNotificationOnly'] is False
          evidence = {
              'schema_version': '1.2.0',
              'environment': 'dev',
              'status': 'azure_bot_and_runtime_configured',
              'bot_name': os.environ['BOT_NAME'],
              'resource_group': os.environ['RESOURCE_GROUP'],
              'app_id': app_id,
              'messaging_endpoint': os.environ['TARGET_ENDPOINT'],
              'teams_channel_enabled': True,
              'sku': 'F0',
              'fly_app': os.environ['FLY_APP'],
              'fly_secret_names': [
                  'TEAMS_BOT_APP_ID',
                  'TEAMS_BOT_APP_TENANT_ID',
                  'TEAMS_BOT_SECRET',
              ],
              'health_ok': True,
              'runtime_secret_sync': os.environ['RUNTIME_SECRET_SYNC'],
              'bot_secret_store': 'Azure Key Vault',
              'bot_secret_name': os.environ['BOT_SECRET_VAULT_NAME'],
              'fly_auth_source': 'Azure Key Vault control-plane trust anchor',
              'fly_trust_anchor_secret_name': os.environ['FLY_TRUST_ANCHOR_SECRET_NAME'],
              'secret_value_exposed': False,
              'teams_app_package': os.environ['PACKAGE_ZIP'],
              'next_action': 'Instalar o pacote Teams no usuário DEV e enviar a primeira mensagem para criar conversationReference.',
          }
          Path(os.environ['EVIDENCE_FILE']).write_text(
              json.dumps(evidence, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          PY
          unset BOT_SECRET FLY_ADMIN_TOKEN
          trap - ERR

      - name: Publicar pacote e evidência da ativação
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teams-bot-dev-activation-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            audit/teams-bot-dev-activation.json
            audit/reqsys-teams-gateway-dev-v1.2.0.zip
          if-no-files-found: warn
          retention-days: 90

      - name: Bloquear até bootstrap humano mínimo
        if: always() && steps.preflight.outcome != 'success'
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -uo pipefail
          blocker="$(jq -r '.blocker // "UNKNOWN"' "$EVIDENCE_FILE" 2>/dev/null || echo UNKNOWN)"
          if [ "$EVENT_NAME" = "schedule" ] && [ "$blocker" = "TEAMS_BOT_IDENTITY_BOOTSTRAP_REQUIRED" ]; then
            echo "::notice::Identidade dedicada ainda não materializada. Nada foi alterado; a próxima janela agendada retoma automaticamente após o bootstrap humano."
            exit 0
          fi
          echo "::error::Bootstrap Entra/Key Vault pendente. Nenhum recurso Azure Bot/Fly foi alterado nesta execução."
          exit 20
