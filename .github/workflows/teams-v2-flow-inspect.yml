name: Teams v2 Flow Inspect (read-only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: teams-v2-flow-inspect
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect robo_envia_teamsv2 definition (no writes)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: reqsys-power-platform-dev
    env:
      POWERPLATFORM_DEV_ENVIRONMENT_URL: ${{ secrets.POWER_PLATFORM_ENVIRONMENT_URL }}
      POWERPLATFORM_APP_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
      POWERPLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
      POWERPLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'

      - name: Run inspection (read-only)
        run: |
          python scripts/inspect_teams_v2_flow_condition.py \
            --environment-url "$POWERPLATFORM_DEV_ENVIRONMENT_URL" \
            --tenant-id "$POWERPLATFORM_TENANT_ID" \
            --client-id "$POWERPLATFORM_APP_ID" \
            --client-secret "$POWERPLATFORM_CLIENT_SECRET"
