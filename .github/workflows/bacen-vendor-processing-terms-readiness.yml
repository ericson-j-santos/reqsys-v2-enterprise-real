name: BACEN Vendor Processing Terms Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/VENDOR-DPA-READINESS.yaml"
      - "scripts/generate_bacen_vendor_processing_terms_readiness.py"
      - ".github/workflows/bacen-vendor-processing-terms-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/VENDOR-DPA-READINESS.yaml"
      - "scripts/generate_bacen_vendor_processing_terms_readiness.py"
      - ".github/workflows/bacen-vendor-processing-terms-readiness.yml"
  schedule:
    - cron: "17 7 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-vendor-processing-terms-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-05 Processing Terms Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML
      - name: Compile generator
        run: python -m py_compile scripts/generate_bacen_vendor_processing_terms_readiness.py
      - name: Generate evidence
        run: |
          python scripts/generate_bacen_vendor_processing_terms_readiness.py \
            --manifest governance/bacen/VENDOR-DPA-READINESS.yaml \
            --output artifacts/bacen/bacen-05-processing-terms-readiness.json
      - name: Validate artifact contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          report = json.loads(Path("artifacts/bacen/bacen-05-processing-terms-readiness.json").read_text())
          assert report["control_id"] == "BACEN-05"
          assert report["production_touched"] is False
          assert report["control_status"] in {"partial", "implemented"}
          PY
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bacen-05-processing-terms-readiness
          path: artifacts/bacen/bacen-05-processing-terms-readiness.json
          if-no-files-found: error
          retention-days: 365
