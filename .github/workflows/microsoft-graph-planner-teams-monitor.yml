name: Microsoft Graph Planner Teams Official Monitor

on:
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/microsoft-graph-planner-teams-monitor.yml"
      - "scripts/graph_official_change_monitor.py"
      - "tests/test_graph_official_change_monitor.py"

permissions:
  contents: read
  issues: write

concurrency:
  group: microsoft-graph-planner-teams-monitor-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  monitor:
    name: Monitorar contrato oficial Graph
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Validar contrato do monitor
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-cache-dir "pytest==9.0.3"
          python -m pytest -q tests/test_graph_official_change_monitor.py

      - name: Consultar somente fontes oficiais
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        id: graph
        shell: bash
        run: |
          set +e
          python scripts/graph_official_change_monitor.py
          code=$?
          set -e
          state="$(jq -r '.state' artifacts/graph-official-monitor/report.json)"
          count="$(jq -r '.material_change_count' artifacts/graph-official-monitor/report.json)"
          signature="$(jq -r '.signature' artifacts/graph-official-monitor/report.json)"
          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "signature=$signature" >> "$GITHUB_OUTPUT"
          cat artifacts/graph-official-monitor/report.md >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      - name: Publicar evidência do mesmo run
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: graph-official-monitor-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/graph-official-monitor/
          if-no-files-found: error
          retention-days: 90

      - name: Alertar somente mudança material
        if: always() && steps.graph.outputs.state == 'material_change'
        env:
          GH_TOKEN: ${{ github.token }}
          INCIDENT_TITLE: "[MONITOR][GRAPH] Mudança oficial material no E2E Planner→Teams"
          SIGNATURE: ${{ steps.graph.outputs.signature }}
        shell: bash
        run: |
          set -euo pipefail
          marker="<!-- reqsys-graph-official:$SIGNATURE -->"
          existing="$(
            gh issue list               --repo "$GITHUB_REPOSITORY"               --state open               --search "\"$INCIDENT_TITLE\" in:title"               --json number               --jq '.[0].number // empty'
          )"
          body="$(
            {
              echo "$marker"
              cat artifacts/graph-official-monitor/report.md
              echo
              echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
              echo "SHA: $GITHUB_SHA"
            }
          )"

          if [[ -z "$existing" ]]; then
            gh issue create               --repo "$GITHUB_REPOSITORY"               --title "$INCIDENT_TITLE"               --body "$body"
            exit 0
          fi

          previous="$(
            gh issue view "$existing"               --repo "$GITHUB_REPOSITORY"               --json body,comments               --jq '[.body, (.comments[].body // "")] | join("\n")'
          )"
          if grep -Fq "$marker" <<<"$previous"; then
            echo "Mudança material já registrada; alerta duplicado suprimido."
            exit 0
          fi

          gh issue comment "$existing"             --repo "$GITHUB_REPOSITORY"             --body "$body"
