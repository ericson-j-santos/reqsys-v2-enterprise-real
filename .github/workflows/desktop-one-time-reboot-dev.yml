name: Desktop One-Time Reboot DEV

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reboot:
    name: Owner-authorized one-time Desktop reboot
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    env:
      RULES_SHA: 3dc23924279f04672d87fcc3c5a7a7cbff2e4794
      ACTION_ID: host-power.remote-reboot-once.desktop.study-mode-20260928
      TARGET_HOST: DESKTOP-PDQK954
      AUTHORIZATION_REF: chat-20260928-desktop-study-mode-unblock-explicit
      CORRELATION_ID: desktop-reboot-once-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts\desktop-one-time-reboot\evidence.json

    steps:
      - name: Assert exact Noteri executor
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne "Noteri") {
            throw "NOTERI_HOST_MISMATCH"
          }

      - name: Checkout immutable ReqSys SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed Noteri session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--repo", $env:GITHUB_WORKSPACE,
            "--session-prefix", "desktop-reboot-once",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/$env:GITHUB_REF_NAME"
          )
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT

      - name: Validate canonical remote reboot exception
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          & python -m unittest -v _rules/tests/test_owner_remote_host_power_once.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Authorize, submit, deny replay and revoke
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $script = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\owner_remote_host_power_once.py"
          $evidence = Join-Path $env:GITHUB_WORKSPACE $env:EVIDENCE_FILE
          New-Item -ItemType Directory -Force -Path (Split-Path $evidence) | Out-Null

          $authorizeArgs = @(
            "authorize",
            "--action-id", $env:ACTION_ID,
            "--executor-host", "Noteri",
            "--target-host", $env:TARGET_HOST,
            "--minutes", "10",
            "--authorization-ref", $env:AUTHORIZATION_REF,
            "--confirm", "AUTHORIZE-ONE-TIME-REMOTE-REBOOT"
          )
          $authorizeRaw = & python $script @authorizeArgs
          if ($LASTEXITCODE -ne 0) { throw "REMOTE_REBOOT_AUTHORIZATION_FAILED" }
          $authorize = @($authorizeRaw)[-1] | ConvertFrom-Json
          if (-not $authorize.ok -or $authorize.target_host -ne $env:TARGET_HOST) {
            throw "REMOTE_REBOOT_AUTHORIZATION_READBACK_FAILED"
          }

          $executeArgs = @(
            "execute",
            "--action-id", $env:ACTION_ID,
            "--correlation-id", $env:CORRELATION_ID,
            "--delay-seconds", "30",
            "--confirm", "EXECUTE-ONE-TIME-REMOTE-REBOOT"
          )
          $executeRaw = & python $script @executeArgs
          if ($LASTEXITCODE -ne 0) { throw "REMOTE_REBOOT_SUBMISSION_FAILED" }
          $execute = @($executeRaw)[-1] | ConvertFrom-Json
          if (-not $execute.ok -or -not $execute.consumed -or $execute.target_host -ne $env:TARGET_HOST) {
            throw "REMOTE_REBOOT_SUBMISSION_READBACK_FAILED"
          }

          $replayArgs = @(
            "execute",
            "--action-id", $env:ACTION_ID,
            "--correlation-id", "$env:CORRELATION_ID-replay",
            "--delay-seconds", "30",
            "--confirm", "EXECUTE-ONE-TIME-REMOTE-REBOOT"
          )
          $replayRaw = & python $script @replayArgs 2>&1
          $replayCode = $LASTEXITCODE
          if ($replayCode -eq 0) { throw "REMOTE_REBOOT_REPLAY_WAS_NOT_BLOCKED" }

          $revokeRaw = & python $script revoke --confirm "REVOKE-ONE-TIME-REMOTE-REBOOT"
          if ($LASTEXITCODE -ne 0) { throw "REMOTE_REBOOT_REVOKE_FAILED" }
          $revoke = @($revokeRaw)[-1] | ConvertFrom-Json
          if (-not $revoke.ok -or -not $revoke.revoked) {
            throw "REMOTE_REBOOT_REVOKE_READBACK_FAILED"
          }

          [ordered]@{
            schema_version = "1.0.0"
            ok = $true
            result = "DESKTOP_ONE_TIME_REBOOT_SUBMITTED"
            source_sha = "${{ github.sha }}"
            rules_sha = $env:RULES_SHA
            executor_host = "Noteri"
            target_host = $env:TARGET_HOST
            environment = "dev"
            action_id = $env:ACTION_ID
            correlation_id = $env:CORRELATION_ID
            reboot_requested = $true
            delay_seconds = 30
            authorization_consumed = $true
            replay_blocked = $true
            authorization_revoked = $true
            arbitrary_target_supported = $false
            arbitrary_command_supported = $false
            production_touched = $false
            secrets_read = $false
          } | ConvertTo-Json -Depth 4 | Set-Content -LiteralPath $evidence -Encoding UTF8

      - name: Upload sanitized reboot evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-one-time-reboot-${{ github.run_id }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 30
