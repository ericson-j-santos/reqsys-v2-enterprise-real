name: WSJF conexoes - sessao MSAL real

on:
  push:
    branches: [main]
    paths:
      - "frontend/tests/e2e/wsjf-planner-excel-conexoes-live.spec.js"
      - "frontend/src/auth/msal.js"
      - "frontend/src/services/copilotMemoryInstaller.js"
      - "backend/app/services/copilot_memory_install_assistant.py"
      - "backend/app/api/copilot_memory.py"
      - ".github/workflows/wsjf-conexoes-msal-live.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  FRONTEND_URL: https://reqsys-app-dev.fly.dev

jobs:
  conexoes-msal-real:
    # Fly.io retirado definitivamente pelo usuario em 2026-10-02.
    if: ${{ false }}
    name: Conexoes Planner/Excel via token delegado MSAL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias e Chromium
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Exigir e decodificar sessao MSAL real
        id: state
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${WSJF_MSAL_STORAGE_STATE_B64:-}" ]; then
            echo "::error::WSJF_MSAL_STORAGE_STATE_B64 ausente: o gate real nao pode ser aprovado por skip."
            exit 2
          fi
          echo "$WSJF_MSAL_STORAGE_STATE_B64" | base64 --decode > "$RUNNER_TEMP/msal-storage-state.json"
          echo "path=$RUNNER_TEMP/msal-storage-state.json" >> "$GITHUB_OUTPUT"
        env:
          WSJF_MSAL_STORAGE_STATE_B64: ${{ secrets.WSJF_MSAL_STORAGE_STATE_B64 }}

      - name: Verificar validade da sessao MSAL decodificada
        working-directory: frontend
        env:
          MSAL_STORAGE_STATE_PATH: ${{ steps.state.outputs.path }}
        run: |
          set -euo pipefail
          # Refresh token de SPA tem vida fixa de 24h (AADSTS700084), sem
          # renovacao possivel. Falhar aqui (segundos) com mensagem clara e
          # melhor do que deixar o Playwright falhar la na frente (minutos,
          # erro generico de interacao necessaria) quando o secret ficou
          # velho — WSJF_MSAL_STORAGE_STATE_B64 precisa ser recadastrado
          # rodando "npm run setup:msal-state" localmente de novo.
          npm run check:msal-state

      - name: Jornada real de conexoes com sessao Microsoft real
        working-directory: frontend
        env:
          REAL_USER_JOURNEY: "true"
          E2E_BASE_URL: ${{ env.FRONTEND_URL }}
          MSAL_STORAGE_STATE_PATH: ${{ steps.state.outputs.path }}
        run: npx playwright test tests/e2e/wsjf-planner-excel-conexoes-live.spec.js --reporter=line

      - name: Publicar evidencia
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wsjf-conexoes-msal-live-${{ github.run_id }}
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 14
