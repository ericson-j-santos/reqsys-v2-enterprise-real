name: Actions Auto Operator

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo de execução"
        required: true
        default: "dry_run"
        type: choice
        options:
          - dry_run
          - execute
      branch:
        description: "Branch monitorada"
        required: false
        default: "main"
        type: string

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-auto-operator-${{ github.event.inputs.branch || 'main' }}
  cancel-in-progress: false

jobs:
  auto-operator:
    name: Classificar e reexecutar falhas transitórias allowlisted
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Executar operador governado consolidado
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event.inputs.mode || 'dry_run' }}
          TARGET_BRANCH: ${{ github.event.inputs.branch || 'main' }}
        run: |
          set -euo pipefail
          args=(
            --repo "${GITHUB_REPOSITORY}"
            --branch "${TARGET_BRANCH}"
            --limit "30"
            --output-dir "artifacts/actions-auto-operator"
          )
          if [[ "${MODE}" == "execute" ]]; then
            args+=(--execute)
          fi
          python scripts/auto_rerun_governed.py "${args[@]}"

      - name: Publicar artifact de auditoria
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: actions-auto-operator-evidence
          path: artifacts/actions-auto-operator
          if-no-files-found: error
          retention-days: 30
