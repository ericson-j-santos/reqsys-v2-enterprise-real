name: Desktop Runtime Dedicated Runner Bridge

on:
  push:
    branches:
      - fix/desktop-runtime-runner-bridge-consolidate-20260924
    paths:
      - .github/workflows/desktop-runtime-runner-bridge.yml
      - .sdd/specs/desktop-runtime-runner-bridge.requirements.md
      - .sdd/specs/desktop-runtime-runner-bridge.spec.json
      - tests/test_desktop_runtime_runner_bridge.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-runtime-runner-bridge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bridge:
    name: Recover dedicated Desktop runtime runner from legacy PC24x7
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 15
    env:
      RULES_SHA: ac2297988651f41ab03469808e41f83496e9c58f
      RUNTIME_SHA: 05f9c63253f7da1eb73d88db5494a98471f0df2e
      TARGET_REPO: C:\\dev\\reqsys-v2-enterprise-real
      CORRELATION_ID: desktop-runtime-bridge-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout Desktop runtime exact candidate SHA
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: ericson-j-santos/desktop-pc24x7-runtime
          ref: ${{ env.RUNTIME_SHA }}
          path: runtime-bootstrap
          fetch-depth: 1
          persist-credentials: false

      - name: Resolve current ReqSys main anchor
        id: anchor
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const { data } = await github.rest.repos.getBranch({
              owner: 'ericson-j-santos',
              repo: 'reqsys-v2-enterprise-real',
              branch: 'main'
            });
            core.setOutput('sha', data.commit.sha);

      - name: Bootstrap governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          $anchorSha = "${{ steps.anchor.outputs.sha }}"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "desktop-runtime-bridge",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", "origin/main"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $line = @($raw)[-1]
          $data = $line | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Activate dedicated runner through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\\scripts\\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\\config\\command-gateway.policy.json"
          $runtimeScript = Join-Path $env:GITHUB_WORKSPACE "runtime-bootstrap\\scripts\\activate_desktop_runtime_runner.py"
          $gatewayArgs = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "480",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $runtimeScript,
            "--confirm", "ACTIVATE-DESKTOP-RUNTIME-RUNNER",
            "--source-sha", $env:RUNTIME_SHA,
            "--non-interactive-auth"
          )
          & python $gateway @gatewayArgs
          exit $LASTEXITCODE
