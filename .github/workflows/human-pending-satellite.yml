name: Human Pending Satellite

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Executar sem comentar nas issues"
        required: false
        default: false
        type: boolean
      scope:
        description: "Escopo da varredura humana"
        required: false
        default: nonprod
        type: choice
        options:
          - nonprod
          - prod
          - ocr-certification
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: read
  issues: write
  pull-requests: read
  actions: write
  checks: read
  deployments: read

concurrency:
  group: human-pending-satellite
  cancel-in-progress: false

jobs:
  scan:
    name: Detectar e capturar pendências humanas
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência de teste
        run: python -m pip install --disable-pip-version-check pytest==9.0.3

      - name: Executar testes do classificador e remediador
        run: |
          python -m pytest -q \
            tests/test_human_pending_satellite.py \
            tests/test_human_pending_auto_remediation.py

      - name: Tentar remediação automática antes da escalada
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          python scripts/human_pending_auto_remediation.py \
            --output artifacts/human-pending-satellite/remediation.json

      - name: Executar rotina satélite
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          args=(--scope "${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'nonprod' }}")
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.dry_run }}" == "true" ]]; then
            args+=(--dry-run)
          fi
          python scripts/human_pending_satellite.py \
            --remediation-file artifacts/human-pending-satellite/remediation.json \
            "${args[@]}"

      - name: Resumo
        if: always()
        shell: bash
        run: |
          if [[ -f artifacts/human-pending-satellite/evidence.json ]]; then
            python - <<'PY'
          import json
          from pathlib import Path
          p = Path('artifacts/human-pending-satellite/evidence.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          findings = data.get('human_findings', [])
          print('## Human Pending Satellite')
          print()
          print(f"- Escopo: {data.get('scope', 'nonprod')}")
          print(f"- Pendências humanas detectadas: {len(findings)}")
          print(f"- Novas notificações: {data.get('notification_count', 0)}")
          print('- Evidência bruta/segredos: não armazenados pelo workflow')
          PY
          fi >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: human-pending-satellite-${{ github.run_id }}
          path: artifacts/human-pending-satellite/
          if-no-files-found: ignore
          retention-days: 30
