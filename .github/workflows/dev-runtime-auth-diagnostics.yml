name: DEV Runtime Auth Diagnostics

on:
  pull_request:
    paths:
      - 'scripts/diagnose_dev_runtime_auth.py'
      - 'tests/test_diagnose_dev_runtime_auth.py'
      - '.github/workflows/dev-runtime-auth-diagnostics.yml'
      - 'backend/fly.dev.toml'
      - 'frontend/fly.dev.toml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dev-runtime-auth-diagnostics-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose:
    name: Diagnosticar runtime e autenticação DEV
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependência de teste
        run: python -m pip install --disable-pip-version-check pytest

      - name: Validar contrato do diagnóstico
        run: python -m pytest -q tests/test_diagnose_dev_runtime_auth.py

      - name: Executar 10 probes por alvo
        timeout-minutes: 2
        run: |
          python scripts/diagnose_dev_runtime_auth.py \
            --attempts 10 \
            --timeout-seconds 5 \
            --interval-seconds 0.5 \
            --warning-seconds 30 \
            --budget-seconds 60 \
            --output artifacts/dev-runtime-auth-diagnostics/evidence.json

      - name: Publicar resumo sanitizado
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/dev-runtime-auth-diagnostics/evidence.json')
          if not path.exists():
              print('Evidência não foi produzida.')
              raise SystemExit(0)

          payload = json.loads(path.read_text(encoding='utf-8'))
          classification = payload['classification']
          performance = payload.get('performance', {})
          slowest_round = performance.get('slowest_round') or {}
          slowest_endpoint = performance.get('slowest_endpoint') or {}

          performance_status = performance.get('status', 'unknown')
          if performance_status == 'yellow':
              print(
                  '::warning title=DEV Auth Diagnostic lento::'
                  f"Duração {performance.get('total_duration_ms')} ms; "
                  'limiar amarelo acima de 30 s.'
              )
          elif performance_status == 'red':
              print(
                  '::error title=DEV Auth Diagnostic excedeu budget::'
                  f"Código {performance.get('alert_code')}; "
                  f"duração {performance.get('total_duration_ms')} ms; budget 60 s."
              )

          print('## DEV Runtime Auth Diagnostics', file=open('/tmp/summary.md', 'w', encoding='utf-8'))
          with open('/tmp/summary.md', 'a', encoding='utf-8') as out:
              out.write(f"\n- Status: `{classification['status']}`\n")
              out.write(f"- Risco: `{classification['operational_risk']}`\n")
              out.write(f"- Auth disponível: `{classification['auth_available']}`\n")
              out.write(f"- Min machines >= 1: `{classification['minimum_running_configuration_ok']}`\n")
              out.write(f"- Performance diagnóstico: `{performance_status}`\n")
              out.write(f"- Duração total: `{performance.get('total_duration_ms')} ms`\n")
              out.write(f"- p95 global: `{performance.get('overall_p95_ms')} ms`\n")
              out.write(f"- Timeouts: `{performance.get('timeout_count')}`\n")
              out.write(
                  f"- Rodada mais lenta: `#{slowest_round.get('attempt')}` / "
                  f"`{slowest_round.get('duration_ms')} ms`\n"
              )
              out.write(
                  f"- Endpoint mais lento: `{slowest_endpoint.get('name')}` / "
                  f"p95 `{slowest_endpoint.get('p95_ms')} ms`\n"
              )
              out.write(f"- Budget global: `{performance.get('budget_seconds')} s`\n")
              out.write(f"- Causas suspeitas: `{', '.join(classification['suspected_causes']) or 'nenhuma'}`\n")
              out.write('- production_touched: `false`\n\n')

              out.write('### Duração por rodada\n\n')
              out.write('| Rodada | Duração ms | Budget restante ms |\n|---:|---:|---:|\n')
              for row in performance.get('rounds', []):
                  out.write(
                      f"| {row.get('attempt')} | {row.get('duration_ms')} | "
                      f"{row.get('budget_remaining_ms')} |\n"
                  )

              out.write('\n### Probes por alvo\n\n')
              out.write('| Alvo | Sucesso | Falha | p95 ms | HTTP |\n|---|---:|---:|---:|---|\n')
              for name, data in payload['probe_summary'].items():
                  out.write(
                      f"| {name} | {data['success_count']} | {data['failure_count']} | "
                      f"{data['latency_ms']['p95']} | {data['status_codes']} |\n"
                  )
          PY
          cat /tmp/summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload da evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-runtime-auth-diagnostics
          path: artifacts/dev-runtime-auth-diagnostics/evidence.json
          if-no-files-found: warn
          retention-days: 30

  fly-state:
    name: Inspecionar estado Fly DEV sem alterar runtime
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: development
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar flyctl pinado
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1

      - name: Validar credencial sem exibir valor
        shell: bash
        run: |
          set -euo pipefail
          set +x
          if [ -z "${FLY_API_TOKEN:-}" ]; then
            echo 'FLY_API_TOKEN ausente no GitHub Environment development.' >&2
            exit 1
          fi

      - name: Coletar metadados read-only e sanitizar
        shell: bash
        run: |
          set -euo pipefail
          set +x
          mkdir -p /tmp/reqsys-fly-dev artifacts/dev-runtime-auth-diagnostics

          status_rc=0
          checks_rc=0
          releases_rc=0
          flyctl status --json --app reqsys-api-dev > /tmp/reqsys-fly-dev/status.json 2>/dev/null || status_rc=$?
          flyctl checks list --json --app reqsys-api-dev > /tmp/reqsys-fly-dev/checks.json 2>/dev/null || checks_rc=$?
          flyctl releases --json --app reqsys-api-dev > /tmp/reqsys-fly-dev/releases.json 2>/dev/null || releases_rc=$?

          export STATUS_RC="$status_rc" CHECKS_RC="$checks_rc" RELEASES_RC="$releases_rc"
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          from scripts.capture_fly_environment_state import (
              _extract_machine_records,
              _latest_release,
              _normalize_checks,
          )

          root = Path('/tmp/reqsys-fly-dev')

          def read_json(name):
              path = root / name
              if not path.exists() or path.stat().st_size == 0:
                  return None
              try:
                  return json.loads(path.read_text(encoding='utf-8'))
              except json.JSONDecodeError:
                  return None

          status = read_json('status.json')
          checks_raw = read_json('checks.json')
          releases_raw = read_json('releases.json')
          machines = _extract_machine_records(status) if status is not None else []
          checks = _normalize_checks(checks_raw) if checks_raw is not None else []
          release = _latest_release(releases_raw) if releases_raw is not None else None

          machine_states = {}
          regions = set()
          for machine in machines:
              state = machine.get('state', 'unknown')
              machine_states[state] = machine_states.get(state, 0) + 1
              if machine.get('region'):
                  regions.add(machine['region'])

          safe_release = None
          if release:
              safe_release = {
                  'version': release.get('version'),
                  'status': release.get('status'),
                  'created_at': release.get('created_at'),
              }

          payload = {
              'schema_version': '1.0.0',
              'contract': 'dev-fly-runtime-state-read-only',
              'generated_at_epoch': int(time.time()),
              'app': 'reqsys-api-dev',
              'commands': {
                  'status_ok': os.environ['STATUS_RC'] == '0',
                  'checks_ok': os.environ['CHECKS_RC'] == '0',
                  'releases_ok': os.environ['RELEASES_RC'] == '0',
              },
              'machines': {
                  'count': len(machines),
                  'states': machine_states,
                  'regions': sorted(regions),
              },
              'checks': checks,
              'latest_release': safe_release,
              'guardrails': {
                  'read_only': True,
                  'logs_collected': False,
                  'secrets_collected': False,
                  'machine_ids_persisted': False,
                  'production_touched': False,
              },
          }
          output = Path('artifacts/dev-runtime-auth-diagnostics/fly-state.json')
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Resumir estado Fly DEV
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('artifacts/dev-runtime-auth-diagnostics/fly-state.json')
          if not path.exists():
              print('Estado Fly sanitizado não foi produzido.')
              raise SystemExit(0)
          data = json.loads(path.read_text(encoding='utf-8'))
          with open('/tmp/fly-summary.md', 'w', encoding='utf-8') as out:
              out.write('## Fly DEV — estado read-only\n\n')
              out.write(f"- Machines detectadas: `{data['machines']['count']}`\n")
              out.write(f"- Estados: `{data['machines']['states']}`\n")
              out.write(f"- Regiões: `{data['machines']['regions']}`\n")
              out.write(f"- Checks: `{data['checks']}`\n")
              out.write(f"- Release: `{data['latest_release']}`\n")
              out.write('- logs_collected: `false`\n')
              out.write('- secrets_collected: `false`\n')
              out.write('- production_touched: `false`\n')
          PY
          cat /tmp/fly-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload do estado Fly sanitizado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dev-fly-runtime-state
          path: artifacts/dev-runtime-auth-diagnostics/fly-state.json
          if-no-files-found: warn
          retention-days: 30
