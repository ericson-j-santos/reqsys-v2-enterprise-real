name: Report Factory Fabric FIC Bootstrap

on:
  pull_request:
    paths:
      - ".github/workflows/report-factory-fabric-fic-bootstrap.yml"
      - "scripts/bootstrap_report_factory_fabric_fic.py"
      - "tests/test_bootstrap_report_factory_fabric_fic.py"
  workflow_dispatch:
    inputs:
      mode:
        description: "plan ou apply"
        required: true
        default: "plan"
        type: choice
        options:
          - plan
          - apply
      confirm:
        description: "Para apply: CRIAR-FIC-REPORT-FACTORY-DEV"
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: report-factory-fabric-fic-bootstrap
  cancel-in-progress: false

jobs:
  contract:
    name: report-factory-fic-bootstrap-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Instalar dependência de teste
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest

      - name: Validar contrato
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/bootstrap_report_factory_fabric_fic.py
          python -m pytest -q tests/test_bootstrap_report_factory_fabric_fic.py

  bootstrap:
    name: report-factory-fic-bootstrap
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    env:
      EVIDENCE_FILE: artifacts/report-factory/fabric-fic-bootstrap.json
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validar autorização explícita
        shell: powershell
        run: |
          $mode = "${{ inputs.mode }}"
          $confirm = "${{ inputs.confirm }}"
          if ($mode -eq "apply" -and $confirm -ne "CRIAR-FIC-REPORT-FACTORY-DEV") {
            throw "explicit_confirmation_required"
          }

      - name: Planejar ou aplicar FIC
        shell: powershell
        run: |
          $args = @(
            "scripts/bootstrap_report_factory_fabric_fic.py",
            "--output", "$env:EVIDENCE_FILE"
          )
          if ("${{ inputs.mode }}" -eq "apply") {
            $args += @("--apply", "--confirm", "CRIAR-FIC-REPORT-FACTORY-DEV")
          }
          python @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: report-factory-fabric-fic-bootstrap-${{ github.run_id }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 30
