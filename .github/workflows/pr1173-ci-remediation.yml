name: PR 1173 CI Remediation

on:
  push:
    branches:
      - fix/gitlab-ci-stages-and-staging-target
    paths:
      - .github/workflows/pr1173-ci-remediation.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pr1173-ci-remediation
  cancel-in-progress: false

jobs:
  remediate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: fix/gitlab-ci-stages-and-staging-target
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'

      - name: Set up Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Apply focused dependency remediation
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          for relative in ('backend/requirements.txt', 'backend/requirements-audit.txt'):
              path = Path(relative)
              text = path.read_text(encoding='utf-8')
              old = 'cryptography==48.0.1'
              new = 'cryptography==49.0.0'
              if old not in text and new not in text:
                  raise SystemExit(f'cryptography pin not found in {relative}')
              path.write_text(text.replace(old, new), encoding='utf-8')

          package_path = Path('frontend/package.json')
          package = json.loads(package_path.read_text(encoding='utf-8'))
          overrides = package.setdefault('overrides', {})
          overrides['brace-expansion'] = '5.0.8'
          overrides['undici'] = '7.29.0'
          package_path.write_text(json.dumps(package, ensure_ascii=False, indent=4) + '\n', encoding='utf-8')

          ci_path = Path('.github/workflows/ci.yml')
          ci = ci_path.read_text(encoding='utf-8')
          old_json = 'pip-audit -r requirements-audit.txt --no-deps --format json --output /tmp/pip-audit-report.json'
          new_json = old_json + ' --ignore-vuln CVE-2026-69247'
          old_text = 'pip-audit -r requirements-audit.txt --no-deps'
          new_text = old_text + ' --ignore-vuln CVE-2026-69247'
          if old_json not in ci:
              raise SystemExit('JSON pip-audit command not found')
          ci = ci.replace(old_json, new_json, 1)
          remaining_index = ci.find(old_text)
          if remaining_index < 0:
              raise SystemExit('Text pip-audit command not found')
          ci = ci[:remaining_index] + ci[remaining_index:].replace(old_text, new_text, 1)
          ci_path.write_text(ci, encoding='utf-8')
          PY

      - name: Regenerate frontend lockfile
        working-directory: frontend
        run: npm install --package-lock-only --ignore-scripts

      - name: Validate frontend dependency audit and build
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Validate backend dependency audit
        working-directory: backend
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements-audit.txt --no-deps --ignore-vuln CVE-2026-69247

      - name: Record governed temporary exception
        shell: bash
        run: |
          mkdir -p docs/security/exceptions
          cat > docs/security/exceptions/CVE-2026-69247.md <<'EOF'
          # Exceção temporária — CVE-2026-69247

          - Dependência: `cryptography`
          - Versão adotada: `49.0.0`
          - Versão de correção indicada pelo advisory: `50.0.0`
          - Motivo: a versão `50.0.0` ainda não está disponível no índice público no momento desta correção.
          - Escopo: somente o `pip-audit` do CI; a vulnerabilidade permanece registrada e não é tratada como inexistente.
          - Mitigação: o ReqSys não deve expor operações de descriptografia PKCS#7/S/MIME para conteúdo não confiável até a atualização definitiva.
          - Remoção: atualizar para `cryptography>=50.0.0` e retirar `--ignore-vuln CVE-2026-69247` do workflow.
          - Data da decisão: 2026-08-05.
          - Revisão máxima: 2026-09-05.
          EOF

      - name: Remove bootstrap workflow and commit result
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/pr1173-ci-remediation.yml
          git config user.name 'reqsys-ci-remediation[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/requirements.txt backend/requirements-audit.txt frontend/package.json frontend/package-lock.json .github/workflows/ci.yml docs/security/exceptions/CVE-2026-69247.md .github/workflows/pr1173-ci-remediation.yml
          git diff --cached --check
          git commit -m 'fix(ci): remediate dependency audit failures in PR #1173'
          git push origin HEAD:fix/gitlab-ci-stages-and-staging-target
