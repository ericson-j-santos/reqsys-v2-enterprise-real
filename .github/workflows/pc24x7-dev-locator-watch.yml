name: PC24x7 DEV Locator Watch

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: pc24x7-dev-locator-watch
  cancel-in-progress: true

jobs:
  watch:
    name: Verificar frescor e alertar transições
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      MIN_REMAINING_TTL_SECONDS: "300"
      EVIDENCE_DIR: artifacts/pc24x7-dev-locator-watch
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
        with:
          persist-credentials: false

      - name: Configurar Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: "20"

      - name: Configurar Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validar contratos locais
        run: |
          set -euo pipefail
          node scripts/resolve_pc24x7_dev_locator.mjs --self-test
          python -m py_compile tools/geradores/teams_graph_gateway_autocontido.py
          python tools/geradores/teams_graph_gateway_autocontido.py self-test

      - name: Verificar locator assinado
        id: locator
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p "$EVIDENCE_DIR"
          set +e
          node scripts/resolve_pc24x7_dev_locator.mjs \
            --output "$EVIDENCE_DIR/signed-locator.json" \
            >"$EVIDENCE_DIR/resolver.stdout" \
            2>"$EVIDENCE_DIR/resolver.stderr"
          resolver_rc=$?
          set -e

          state="unavailable"
          reason="no_valid_fresh_signed_locator"
          issued_at="0"
          expires_at="0"
          remaining_ttl_seconds="0"
          if [[ "$resolver_rc" -eq 0 ]]; then
            read -r issued_at expires_at remaining_ttl_seconds < <(
              python - "$EVIDENCE_DIR/signed-locator.json" <<'PY'
          import json
          import sys
          import time

          with open(sys.argv[1], encoding="utf-8") as handle:
              evidence = json.load(handle)
          issued_at = int(evidence["issued_at"])
          expires_at = int(evidence["expires_at"])
          remaining = max(0, expires_at - int(time.time()))
          print(issued_at, expires_at, remaining)
          PY
            )
            if (( remaining_ttl_seconds >= MIN_REMAINING_TTL_SECONDS )); then
              state="healthy"
              reason="signed_locator_fresh"
            else
              state="expiring"
              reason="signed_locator_below_renewal_window"
            fi
          fi

          echo "state=$state" >> "$GITHUB_OUTPUT"
          echo "reason=$reason" >> "$GITHUB_OUTPUT"
          echo "issued_at=$issued_at" >> "$GITHUB_OUTPUT"
          echo "expires_at=$expires_at" >> "$GITHUB_OUTPUT"
          echo "remaining_ttl_seconds=$remaining_ttl_seconds" >> "$GITHUB_OUTPUT"
          echo "resolver_returncode=$resolver_rc" >> "$GITHUB_OUTPUT"

          LOCATOR_STATE="$state" \
          LOCATOR_REASON="$reason" \
          LOCATOR_ISSUED_AT="$issued_at" \
          LOCATOR_EXPIRES_AT="$expires_at" \
          LOCATOR_REMAINING="$remaining_ttl_seconds" \
          LOCATOR_RESOLVER_RC="$resolver_rc" \
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = {
              "schema_version": "1.0.0",
              "contract": "reqsys-pc24x7-dev-locator-watch",
              "environment": "dev",
              "state": os.environ["LOCATOR_STATE"],
              "reason": os.environ["LOCATOR_REASON"],
              "issued_at": int(os.environ["LOCATOR_ISSUED_AT"]),
              "expires_at": int(os.environ["LOCATOR_EXPIRES_AT"]),
              "remaining_ttl_seconds": int(os.environ["LOCATOR_REMAINING"]),
              "minimum_remaining_ttl_seconds": int(os.environ["MIN_REMAINING_TTL_SECONDS"]),
              "resolver_returncode": int(os.environ["LOCATOR_RESOLVER_RC"]),
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "production_touched": False,
              "secrets_exposed": False,
          }
          target = Path(os.environ["EVIDENCE_DIR"]) / "evidence.json"
          target.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

          rm -f "$EVIDENCE_DIR/resolver.stdout" "$EVIDENCE_DIR/resolver.stderr"

      - name: Detectar transição de estado
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_STATE: ${{ steps.locator.outputs.state }}
        shell: bash
        run: |
          set -euo pipefail
          previous_conclusion="$(
            gh api \
              "repos/$GITHUB_REPOSITORY/actions/workflows/pc24x7-dev-locator-watch.yml/runs?status=completed&per_page=10" \
              --jq '.workflow_runs[0].conclusion // "none"'
          )"
          transition="none"
          if [[ "$CURRENT_STATE" != "healthy" && "$previous_conclusion" != "failure" ]]; then
            transition="outage"
          elif [[ "$CURRENT_STATE" == "healthy" && "$previous_conclusion" == "failure" ]]; then
            transition="recovery"
          fi
          echo "previous_conclusion=$previous_conclusion" >> "$GITHUB_OUTPUT"
          echo "transition=$transition" >> "$GITHUB_OUTPUT"

      - name: Alertar transição no Teams pela contingência
        if: steps.history.outputs.transition != 'none'
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEAMS_WEBHOOK_RECIPIENT: ${{ secrets.TEAMS_WEBHOOK_RECIPIENT }}
          TRANSITION: ${{ steps.history.outputs.transition }}
          LOCATOR_STATE: ${{ steps.locator.outputs.state }}
          LOCATOR_REASON: ${{ steps.locator.outputs.reason }}
          REMAINING_TTL_SECONDS: ${{ steps.locator.outputs.remaining_ttl_seconds }}
          PREVIOUS_CONCLUSION: ${{ steps.history.outputs.previous_conclusion }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "${TEAMS_WEBHOOK_URL:-}" || { echo "::error::TEAMS_WEBHOOK_URL ausente"; exit 2; }
          test -n "${TEAMS_WEBHOOK_RECIPIENT:-}" || { echo "::error::TEAMS_WEBHOOK_RECIPIENT ausente"; exit 2; }
          echo "::add-mask::$TEAMS_WEBHOOK_URL"
          echo "::add-mask::$TEAMS_WEBHOOK_RECIPIENT"
          python - <<'PY'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          transition = os.environ["TRANSITION"]
          recovered = transition == "recovery"
          title = "ReqSys — locator PC24x7 DEV recuperado" if recovered else "ReqSys — locator PC24x7 DEV indisponível"
          message = (
              f"Estado: {os.environ['LOCATOR_STATE']}\n\n"
              f"Motivo: {os.environ['LOCATOR_REASON']}\n\n"
              f"TTL restante: {os.environ['REMAINING_TTL_SECONDS']}s\n\n"
              f"Workflow: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}"
          )
          command = [
              sys.executable,
              "tools/geradores/teams_graph_gateway_autocontido.py",
              "send-webhook",
              "--title",
              title,
              "--message",
              message,
              "--event-type",
              "pc24x7-dev-locator-recovery" if recovered else "pc24x7-dev-locator-alert",
          ]
          completed = subprocess.run(command, text=True, capture_output=True, check=False)
          if completed.stdout:
              print(completed.stdout)
          if completed.stderr:
              print(completed.stderr, file=sys.stderr)
          if completed.returncode != 0:
              raise SystemExit(completed.returncode)

          path = Path(os.environ["EVIDENCE_DIR"]) / "evidence.json"
          evidence = json.loads(path.read_text(encoding="utf-8"))
          evidence["transition"] = transition
          evidence["alert_emitted"] = True
          evidence["previous_conclusion"] = os.environ.get("PREVIOUS_CONCLUSION", "")
          path.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Registrar resumo
        if: always()
        shell: bash
        run: |
          {
            echo "## PC24x7 DEV Locator Watch"
            echo "- Estado: ${{ steps.locator.outputs.state }}"
            echo "- Motivo: ${{ steps.locator.outputs.reason }}"
            echo "- TTL restante: ${{ steps.locator.outputs.remaining_ttl_seconds }}s"
            echo "- Transição: ${{ steps.history.outputs.transition || 'unknown' }}"
            echo "- Produção tocada: não"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.4.3
        with:
          name: pc24x7-dev-locator-watch-${{ github.run_id }}
          path: artifacts/pc24x7-dev-locator-watch/
          if-no-files-found: error
          retention-days: 30

      - name: Falhar fechado quando o locator não está fresco
        if: steps.locator.outputs.state != 'healthy'
        shell: bash
        run: |
          echo "::error title=Locator PC24x7 DEV não está fresco::${{ steps.locator.outputs.reason }}"
          exit 1
