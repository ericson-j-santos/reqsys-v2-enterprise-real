name: Fabric OIDC Read-only Probe

on:
  pull_request:
    paths:
      - ".github/workflows/fabric-oidc-readonly-probe.yml"
      - "scripts/fabric_oidc_readonly_probe.py"
      - "tests/test_fabric_oidc_readonly_probe.py"
      - ".sdd/specs/fabric-oidc-readonly-probe.requirements.md"
      - ".sdd/specs/fabric-oidc-readonly-probe.spec.json"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: fabric-oidc-readonly-probe
  cancel-in-progress: true

jobs:
  contract:
    name: fabric-oidc-contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validar contrato local
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/fabric_oidc_readonly_probe.py
          python -m unittest tests/test_fabric_oidc_readonly_probe.py

  probe:
    name: fabric-oidc-readonly-probe
    if: github.event_name == 'workflow_dispatch'
    needs: contract
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 10
    env:
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      EVIDENCE_FILE: artifacts/fabric-oidc-readonly-probe.json

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Inicializar evidência sanitizada
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts
          printf '%s\n' '{"schema":"fabric-oidc-readonly-probe/v1","status":"started","secret_value_exposed":false,"mutations_performed":false}' > "$EVIDENCE_FILE"

      - name: Validar configuração OIDC
        shell: bash
        run: |
          set -euo pipefail
          for name in CCP_AZURE_CLIENT_ID CCP_AZURE_TENANT_ID CCP_AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              echo "::error::$name não configurado."
              exit 2
            fi
          done

      - name: Login Azure OIDC governado
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Executar probe somente leitura
        shell: bash
        env:
          AZURE_CORE_OUTPUT: none
        run: |
          set -euo pipefail
          python scripts/fabric_oidc_readonly_probe.py \
            --tenant-id "$CCP_AZURE_TENANT_ID" \
            --client-id "$CCP_AZURE_CLIENT_ID" \
            --output "$EVIDENCE_FILE"

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fabric-oidc-readonly-probe-${{ github.run_id }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 7

      - name: Gate contra falso verde
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          data = json.loads(Path(os.environ["EVIDENCE_FILE"]).read_text(encoding="utf-8"))
          assert data.get("status") == "completed", data
          assert data.get("secret_value_exposed") is False, data
          assert data.get("mutations_performed") is False, data
          assert data.get("tenant_match") is True, data
          print("FABRIC_OIDC_PROBE_EVIDENCE_OK")
          PY
