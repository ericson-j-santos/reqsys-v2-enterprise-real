name: BACEN Vendor Risk Assessment

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml"
      - "scripts/generate_bacen_vendor_risk_assessment.py"
      - ".github/workflows/bacen-vendor-risk-assessment.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml"
      - "scripts/generate_bacen_vendor_risk_assessment.py"
      - ".github/workflows/bacen-vendor-risk-assessment.yml"
  schedule:
    - cron: "23 11 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-vendor-risk-assessment-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    name: BACEN-05 Vendor Risk Assessment
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check pyyaml

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_vendor_risk_assessment.py

      - name: Generate formal technical assessment
        run: |
          python scripts/generate_bacen_vendor_risk_assessment.py \
            --register governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml \
            --output artifacts/bacen/bacen-05-vendor-risk-assessment.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(Path("artifacts/bacen/bacen-05-vendor-risk-assessment.json").read_text())
          assert report["control_id"] == "BACEN-05"
          assert report["vendor_count"] > 0
          assert len(report["source_sha256"]) == 64
          assert report["production_touched"] is False
          assert report["technical_assessment_complete"] is True
          assert report["control_maturity"] in {"partial_pending_legal_signoff", "implemented"}
          print("BACEN-05 vendor risk assessment evidence: valid")
          PY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-05-vendor-risk-assessment
          path: artifacts/bacen/bacen-05-vendor-risk-assessment.json
          if-no-files-found: error
          retention-days: 90

      - name: Executive summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-05-vendor-risk-assessment.json")
          print("## BACEN-05 — Avaliação formal de terceiros")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          report = json.loads(path.read_text())
          print(f"\n- Terceiros avaliados: **{report['vendor_count']}**")
          print(f"- Avaliação técnica completa: **{report['technical_assessment_complete']}**")
          print(f"- Sign-off jurídico completo: **{report['formal_legal_signoff_complete']}**")
          print(f"- Maturidade: `{report['control_maturity']}`")
          print(f"- Alto/crítico: `{', '.join(map(str, report['high_or_critical_risk_vendor_ids'])) or 'nenhum'}`")
          print("- Produção acessada: **false**")
          PY
