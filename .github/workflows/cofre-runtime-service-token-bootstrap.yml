name: Cofre Runtime Service Token Bootstrap

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cofre-runtime-service-token-bootstrap.yml'
      - 'scripts/bootstrap_pc24x7_teams_service_token.py'

permissions:
  contents: read
  id-token: write

concurrency:
  group: cofre-runtime-service-token-bootstrap-dev
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    environment: development
    timeout-minutes: 15
    env:
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
      REQSYS_SERVICE_TOKEN_SCOPE: cofre:runtime_evidence
      REQSYS_SERVICE_TOKEN_LABEL: cofre-runtime-evidence-dev
      REQSYS_SERVICE_TOKEN_SECRET_NAME: reqsys-cofre-runtime-evidence-service-token
      PC24X7_TEAMS_SERVICE_TOKEN_SECRET: reqsys-cofre-runtime-evidence-service-token
      REQSYS_SERVICE_TOKEN_VALIDATION_PATH: /v1/cofre/runtime/control-status
      PC24X7_TEAMS_ALLOW_PROVISION: 'true'
    steps:
      - name: Checkout immutable SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Login Azure por OIDC
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Resolver locator PC24x7 assinado
        shell: powershell
        run: |
          node scripts/resolve_pc24x7_dev_locator.mjs --self-test
          node scripts/resolve_pc24x7_dev_locator.mjs --output artifacts/cofre-token-bootstrap/signed-locator.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Exportar runtime e credencial transitória do Cofre local
        shell: powershell
        run: |
          $locator = Get-Content artifacts/cofre-token-bootstrap/signed-locator.json -Raw | ConvertFrom-Json
          $base = [string]$locator.selected_url
          if ([string]::IsNullOrWhiteSpace($base)) { throw 'locator_base_url_missing' }
          "REQSYS_API_BASE_URL=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "COFRE_API_URL=$base" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          $vaultToken = [Environment]::GetEnvironmentVariable('VAULT_API_TOKEN')
          if ([string]::IsNullOrWhiteSpace($vaultToken)) { throw 'VAULT_API_TOKEN_missing_on_pc24x7' }
          Write-Output "::add-mask::$vaultToken"
          "VAULT_API_TOKEN=$vaultToken" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Instalar cliente Key Vault
        shell: powershell
        run: python -m pip install --disable-pip-version-check azure-identity azure-keyvault-secrets

      - name: Provisionar ou reutilizar token escopado
        shell: powershell
        run: |
          python scripts/bootstrap_pc24x7_teams_service_token.py | Tee-Object -FilePath cofre-runtime-service-token-bootstrap.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: cofre-runtime-service-token-bootstrap-${{ github.run_id }}
          path: |
            cofre-runtime-service-token-bootstrap.json
            artifacts/cofre-token-bootstrap/signed-locator.json
          if-no-files-found: error
          retention-days: 30
