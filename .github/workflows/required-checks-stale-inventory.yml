name: Required Checks Stale Inventory

on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/build_required_checks_stale_inventory.py'
      - 'tests/test_build_required_checks_stale_inventory.py'
      - 'tests/test_operational_gaps_registry_pareto_alignment.py'
      - 'config/required-checks-inventory-policy.json'
      - 'config/operational-gaps-registry.json'
      - '.github/workflows/required-checks-stale-inventory.yml'
  schedule:
    - cron: "25 6 * * *"
  workflow_dispatch:
    inputs:
      strict:
        description: "Falhar quando houver pendência sem decisão registrada"
        required: false
        default: false
        type: boolean

permissions:
  contents: read
  actions: read
  checks: read
  pull-requests: read

concurrency:
  group: required-checks-stale-inventory-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'daily' }}
  cancel-in-progress: true

jobs:
  contract-tests:
    name: Contrato do inventário de required checks
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pytest pyyaml
      - run: |
          python -m pytest -q \
            tests/test_build_required_checks_stale_inventory.py \
            tests/test_operational_gaps_registry_pareto_alignment.py

  inventory:
    name: Inventário de required checks versus workflows reais
    needs: contract-tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      REPORT_DIR: artifacts/required-checks-stale-inventory
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check pyyaml

      - name: Coletar branch protection (best effort, somente leitura)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .tmp
          if ! gh api "repos/${GITHUB_REPOSITORY}/branches/main/protection/required_status_checks" > .tmp/protection.json 2> .tmp/protection.err; then
            jq -n --arg reason "$(tr '\n' ' ' < .tmp/protection.err | cut -c1-500)" '{unavailable:true,reason:$reason}' > .tmp/protection.json
          fi

      - name: Gerar inventário e classificar stale checks
        shell: bash
        run: |
          set -euo pipefail
          strict_arg=()
          [[ "${{ inputs.strict || false }}" == "true" ]] && strict_arg=(--strict)
          python scripts/build_required_checks_stale_inventory.py \
            --protection .tmp/protection.json \
            --output "$REPORT_DIR/required-checks-stale-inventory.json" \
            --markdown-output "$REPORT_DIR/required-checks-stale-inventory.md" \
            "${strict_arg[@]}"

      - name: Publicar sumário
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "$REPORT_DIR/required-checks-stale-inventory.md" ]; then
            cat "$REPORT_DIR/required-checks-stale-inventory.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Inventário não gerado." >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: required-checks-stale-inventory
          path: artifacts/required-checks-stale-inventory/
          if-no-files-found: error
          retention-days: 30
