name: Desktop Watchdog Recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Bounded recovery mode'
        required: false
        type: choice
        default: watchdog
        options:
          - watchdog
          - watchdog-uac
          - watchdog-uac-stage
          - runner-recover
          - runner-bootstrap
          - runner-canary
          - alm-runner-bootstrap
          - reboot-once

permissions:
  contents: read

concurrency:
  group: noteri-desktop-watchdog-recovery-${{ inputs.mode }}
  cancel-in-progress: false

jobs:
  stage-watchdog-uac:
    if: ${{ inputs.mode == 'watchdog-uac-stage' }}
    name: Stage immutable one-click watchdog UAC activation
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 3
    env:
      EVIDENCE_FILE: artifacts\noteri-desktop-watchdog-recovery\uac-stage.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Validate installed release and stage exact Desktop launcher
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME -ine "DESKTOP-PDQK954") { throw "DESKTOP_HOST_REQUIRED" }
          $runtimeRoot = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA "ReqSys\DesktopControlPlaneWatchdog"))
          $metadataPath = Join-Path $runtimeRoot "metadata.json"
          if (-not (Test-Path -LiteralPath $metadataPath)) { throw "WATCHDOG_METADATA_MISSING" }
          $metadata = Get-Content -Raw -Encoding UTF8 $metadataPath | ConvertFrom-Json
          $sourceSha = [string]$metadata.source_sha
          if ($sourceSha -notmatch '^[0-9a-fA-F]{40}$') { throw "WATCHDOG_SOURCE_SHA_INVALID" }
          $expectedRelease = [IO.Path]::GetFullPath((Join-Path $runtimeRoot ("releases\" + $sourceSha.ToLowerInvariant())))
          $actualRelease = [IO.Path]::GetFullPath([string]$metadata.release_root)
          if ($actualRelease -ine $expectedRelease) { throw "WATCHDOG_RELEASE_ROOT_MISMATCH" }
          $python = [IO.Path]::GetFullPath((Join-Path $runtimeRoot "python\3.12.10\python.exe"))
          if ([IO.Path]::GetFullPath([string]$metadata.python_executable) -ine $python) {
            throw "WATCHDOG_PYTHON_PATH_MISMATCH"
          }
          $launcher = Join-Path $expectedRelease "scripts\desktop_control_plane_watchdog_uac_launcher.py"
          $nativeRepairSource = Join-Path $env:GITHUB_WORKSPACE "scripts\repair_desktop_watchdog_native.ps1"
          $watchdog = Join-Path $expectedRelease "scripts\desktop_control_plane_watchdog.py"
          foreach ($required in @($python, $launcher, $nativeRepairSource, $watchdog)) {
            if (-not (Test-Path -LiteralPath $required)) { throw "WATCHDOG_ACTIVATION_FILE_MISSING" }
          }
          if ($env:GITHUB_SHA -notmatch '^[0-9a-fA-F]{40}$') { throw "WORKFLOW_SOURCE_SHA_INVALID" }
          $version = (& $python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "Python 3.12.10") {
            throw "WATCHDOG_PYTHON_VERSION_MISMATCH:$version"
          }
          $diagnosticFile = Join-Path $env:LOCALAPPDATA "ReqSys\DesktopWatchdogNativeRepair\last.json"
          $ps1Content = @'
          $ErrorActionPreference = 'Stop'
          $repairScript = '__REPAIR_SCRIPT__'
          $evidenceFile = '__EVIDENCE_FILE__'
          try {
            if (-not (Test-Path -LiteralPath $repairScript -PathType Leaf)) {
              throw 'REPARADOR_NATIVO_AUSENTE'
            }
            $powershell = Join-Path $env:SystemRoot 'System32\WindowsPowerShell\v1.0\powershell.exe'
            $arguments = @('-NoProfile', '-ExecutionPolicy', 'Bypass', '-File', ('"' + $repairScript + '"'))
            $process = Start-Process -FilePath $powershell -ArgumentList $arguments -Verb RunAs -Wait -PassThru
            if (-not (Test-Path -LiteralPath $evidenceFile -PathType Leaf)) {
              throw ('DIAGNOSTICO_NAO_GERADO; exit_code=' + $process.ExitCode)
            }
            $evidence = Get-Content -LiteralPath $evidenceFile -Raw -Encoding UTF8 | ConvertFrom-Json
            $evidence | ConvertTo-Json -Depth 8
            if ($process.ExitCode -ne 0 -or $evidence.ok -ne $true -or $evidence.result -ne 'DESKTOP_WATCHDOG_NATIVE_REPAIRED') {
              $detail = [string]$evidence.error
              throw ('REPARO_NATIVO_BLOQUEADO; exit_code=' + $process.ExitCode + '; detalhe=' + $detail)
            }
            Write-Host 'Watchdog ativado e validado com sucesso.' -ForegroundColor Green
            exit 0
          }
          catch {
            Write-Host ('Falha na ativacao: ' + $_.Exception.Message) -ForegroundColor Red
            Write-Host ('Diagnostico: ' + $evidenceFile)
            exit 2
          }
          '@
          $ps1Template = $ps1Content.Replace('__EVIDENCE_FILE__', $diagnosticFile.Replace("'", "''"))
          $cmdContent = @"
          @echo off
          title Ativar ReqSys Desktop Watchdog
          powershell.exe -NoProfile -ExecutionPolicy Bypass -File "%~dp0Ativar-ReqSys-Watchdog.ps1"
          set "REQSYS_EXIT=%ERRORLEVEL%"
          echo.
          if "%REQSYS_EXIT%"=="0" (echo Ativacao concluida.) else (echo Ativacao bloqueada. Codigo: %REQSYS_EXIT%)
          echo Pressione qualquer tecla para fechar.
          pause ^>nul
          exit /b %REQSYS_EXIT%
          "@
          $desktopTargets = @(
            @{ kind = "runner_profile"; directory = [Environment]::GetFolderPath("Desktop") },
            @{ kind = "public"; directory = [Environment]::GetFolderPath("CommonDesktopDirectory") }
          )
          $staged = @()
          $stageFailures = @()
          foreach ($target in $desktopTargets) {
            $directory = [string]$target.directory
            try {
              if ([string]::IsNullOrWhiteSpace($directory) -or -not (Test-Path -LiteralPath $directory)) {
                throw "DESKTOP_TARGET_UNAVAILABLE"
              }
              $cmd = Join-Path $directory "Ativar-ReqSys-Watchdog.cmd"
              $ps1 = Join-Path $directory "Ativar-ReqSys-Watchdog.ps1"
              $repairCopy = Join-Path $directory "ReqSys-Watchdog-Reparador-Nativo.ps1"
              Copy-Item -LiteralPath $nativeRepairSource -Destination $repairCopy -Force
              $targetPs1Content = $ps1Template.Replace('__REPAIR_SCRIPT__', $repairCopy.Replace("'", "''"))
              $targetPs1Content | Set-Content -LiteralPath $ps1 -Encoding UTF8
              $cmdContent | Set-Content -LiteralPath $cmd -Encoding ASCII
              if (
                -not (Test-Path -LiteralPath $cmd) -or
                -not (Test-Path -LiteralPath $ps1) -or
                -not (Test-Path -LiteralPath $repairCopy)
              ) {
                throw "DESKTOP_LAUNCHER_NOT_STAGED"
              }
              $staged += @{
                kind = $target.kind
                path = [IO.Path]::GetFullPath($cmd)
                powershell_path = [IO.Path]::GetFullPath($ps1)
                repair_path = [IO.Path]::GetFullPath($repairCopy)
              }
            } catch {
              $stageFailures += @{
                kind = $target.kind
                error_type = $_.Exception.GetType().Name
              }
            }
          }
          if (-not @($staged | Where-Object { $_.kind -eq "runner_profile" }).Count) {
            throw "RUNNER_PROFILE_DESKTOP_LAUNCHER_NOT_STAGED"
          }
          $nativeDiagnostic = $null
          if (Test-Path -LiteralPath $diagnosticFile -PathType Leaf) {
            try {
              $diagnostic = Get-Content -LiteralPath $diagnosticFile -Raw -Encoding UTF8 | ConvertFrom-Json
              $diagnosticError = ([string]$diagnostic.error -replace '[\r\n]', ' ').Trim()
              if ($diagnosticError.Length -gt 500) { $diagnosticError = $diagnosticError.Substring(0, 500) }
              $nativeDiagnostic = @{
                ok = [bool]$diagnostic.ok
                result = [string]$diagnostic.result
                error = $diagnosticError
                error_type = [string]$diagnostic.error_type
                generated_at_utc = [string]$diagnostic.generated_at_utc
              }
            } catch {
              $nativeDiagnostic = @{
                ok = $false
                result = "NATIVE_DIAGNOSTIC_INVALID"
                error = ""
                error_type = $_.Exception.GetType().Name
                generated_at_utc = ""
              }
            }
          }
          New-Item -ItemType Directory -Force (Split-Path -Parent $env:EVIDENCE_FILE) | Out-Null
          @{
            ok = $true
            result = "DESKTOP_WATCHDOG_UAC_LAUNCHER_STAGED"
            source_sha = $sourceSha.ToLowerInvariant()
            repair_source_sha = $env:GITHUB_SHA.ToLowerInvariant()
            launcher_name = "Ativar-ReqSys-Watchdog.cmd"
            execution_method = "native_powershell_watchdog_task_scheduler_com"
            desktop_paths = @($staged | ForEach-Object { $_.path })
            powershell_paths = @($staged | ForEach-Object { $_.powershell_path })
            repair_paths = @($staged | ForEach-Object { $_.repair_path })
            diagnostic_file = $diagnosticFile
            native_repair_diagnostic = $nativeDiagnostic
            public_desktop_staged = [bool](@($staged | Where-Object { $_.kind -eq "public" }).Count)
            stage_failures = $stageFailures
            activation_pending = $true
            requires_local_uac_approval = $true
            remote_uac_attempted = $false
            production_touched = $false
            secrets_read = $false
            reboot_performed = $false
          } | ConvertTo-Json -Compress | Set-Content -LiteralPath $env:EVIDENCE_FILE -Encoding UTF8

      - name: Upload sanitized UAC staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-watchdog-uac-stage-${{ github.run_id }}
          path: artifacts\noteri-desktop-watchdog-recovery\uac-stage.json
          if-no-files-found: error
          retention-days: 30

  recover:
    if: ${{ inputs.mode == 'watchdog' || inputs.mode == 'watchdog-uac' || inputs.mode == '' }}
    name: Run existing watchdog locally on governed Desktop runner
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 8
    env:
      TARGET_REPO: C:\dev\chatgpt-workers\reqsys-watchdog-session-source
      RULES_SHA: 562fc4274aff24f7058cb135f27a509aa69031c1
      CORRELATION_ID: noteri-desktop-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\noteri-desktop-watchdog-recovery\evidence.json

    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned portable Python 3.12
        shell: powershell
        env:
          PORTABLE_PYTHON_VERSION: "3.12.10"
          PORTABLE_PYTHON_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PORTABLE_PYTHON_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP ("reqsys-python-" + $env:PORTABLE_PYTHON_VERSION + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $zip = "$root.zip"
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest -Uri $env:PORTABLE_PYTHON_URL -OutFile $zip -UseBasicParsing
          $observedHash = ([BitConverter]::ToString(([Security.Cryptography.SHA256]::Create()).ComputeHash([IO.File]::ReadAllBytes($zip)))).Replace('-', '').ToLowerInvariant()
          if ($observedHash -ne $env:PORTABLE_PYTHON_SHA256) {
            throw "portable_python_sha256_mismatch:$observedHash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $python = Join-Path $root "python.exe"
          if (-not (Test-Path -LiteralPath $python)) { throw "portable_python_executable_missing" }
          $observedVersion = (& $python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne "Python $env:PORTABLE_PYTHON_VERSION") {
            throw "portable_python_version_mismatch:$observedVersion"
          }
          "REQSYS_PYTHON=$python" | Add-Content $env:GITHUB_ENV

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare dedicated clean session source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $source = [IO.Path]::GetFullPath($env:TARGET_REPO)
          $allowedRoot = [IO.Path]::GetFullPath("C:\dev\chatgpt-workers")
          if (-not $source.StartsWith($allowedRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw "SESSION_SOURCE_OUTSIDE_GOVERNED_ROOT"
          }
          if (Test-Path -LiteralPath $source) {
            if (-not (Test-Path -LiteralPath (Join-Path $source ".git"))) {
              throw "SESSION_SOURCE_NOT_GIT_REPOSITORY"
            }
            $dirty = & git -C $source status --porcelain=v1
            if ($LASTEXITCODE -ne 0 -or $dirty) { throw "SESSION_SOURCE_NOT_CLEAN" }
          } else {
            New-Item -ItemType Directory -Force (Split-Path -Parent $source) | Out-Null
            & git clone --no-checkout --local $env:GITHUB_WORKSPACE $source
            if ($LASTEXITCODE -ne 0) { throw "SESSION_SOURCE_CLONE_FAILED" }
          }
          & git -C $source remote set-url origin https://github.com/ericson-j-santos/reqsys-v2-enterprise-real.git
          if ($LASTEXITCODE -ne 0) { throw "SESSION_SOURCE_REMOTE_FAILED" }
          & git -C $source fetch --prune --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw "SESSION_SOURCE_FETCH_FAILED" }
          $remoteHead = (& git -C $source rev-parse --verify refs/remotes/origin/main).Trim().ToLowerInvariant()
          $anchorSha = "${{ github.sha }}".ToLowerInvariant()
          if ($remoteHead -ne $anchorSha) { throw "SESSION_SOURCE_REMOTE_HEAD_MISMATCH" }
          & git -C $source checkout --detach $anchorSha
          if ($LASTEXITCODE -ne 0) { throw "SESSION_SOURCE_CHECKOUT_FAILED" }
          $finalHead = (& git -C $source rev-parse HEAD).Trim().ToLowerInvariant()
          $finalDirty = & git -C $source status --porcelain=v1
          if ($LASTEXITCODE -ne 0 -or $finalHead -ne $anchorSha -or $finalDirty) {
            throw "SESSION_SOURCE_FINAL_STATE_INVALID"
          }

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rulesScripts = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts"
          $pythonRoot = Split-Path -Parent $env:REQSYS_PYTHON
          $pth = Join-Path $pythonRoot "python312._pth"
          if (-not (Test-Path -LiteralPath $pth)) { throw "PORTABLE_PYTHON_PTH_MISSING" }
          $pthLines = @(Get-Content -LiteralPath $pth)
          if ($pthLines -notcontains $rulesScripts) {
            Add-Content -LiteralPath $pth -Value $rulesScripts
          }
          $launcher = Join-Path $rulesScripts "session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "noteri-desktop-watchdog",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--require-runner-version-preflight",
            "--sync-ref", "origin/main"
          )
          $raw = & "$env:REQSYS_PYTHON" $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Materialize verified persistent watchdog Python
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $runtimeRoot = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA "ReqSys\DesktopControlPlaneWatchdog"))
          $persistentRoot = [IO.Path]::GetFullPath((Join-Path $runtimeRoot "python\3.12.10"))
          if (-not $persistentRoot.StartsWith($runtimeRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw "WATCHDOG_PYTHON_OUTSIDE_RUNTIME_ROOT"
          }
          $persistentPython = Join-Path $persistentRoot "python.exe"
          if (-not (Test-Path -LiteralPath $persistentPython)) {
            if (Test-Path -LiteralPath $persistentRoot) {
              Remove-Item -LiteralPath $persistentRoot -Recurse -Force
            }
            New-Item -ItemType Directory -Force $persistentRoot | Out-Null
            $portableRoot = Split-Path -Parent $env:REQSYS_PYTHON
            Copy-Item -Path (Join-Path $portableRoot "*") -Destination $persistentRoot -Recurse -Force
          }
          if (-not (Test-Path -LiteralPath $persistentPython)) { throw "WATCHDOG_PYTHON_MISSING_AFTER_COPY" }
          $version = (& $persistentPython --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $version -ne "Python 3.12.10") {
            throw "WATCHDOG_PYTHON_VERSION_MISMATCH:$version"
          }

      - name: Query and run exact existing Desktop watchdog locally through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $recoveryScript = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_watchdog_rpc_recovery.py"
          $gatewayTimeout = "90"
          $recoveryArgs = @(
            $recoveryScript,
            "--confirm", "RUN-EXISTING-DESKTOP-WATCHDOG",
            "--source-sha", $env:ANCHOR_SHA,
            "--evidence-file", $env:EVIDENCE_REL
          )
          if ("${{ inputs.mode }}" -eq "watchdog-uac") {
            $gatewayTimeout = "180"
            $recoveryArgs += @(
              "--allow-uac",
              "--uac-confirm", "LAUNCH-DESKTOP-CONTROL-PLANE-WATCHDOG-UAC"
            )
          }
          $gatewayArgs = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", $gatewayTimeout,
            "--expected-head", $env:ANCHOR_SHA,
            "--", "python"
          ) + $recoveryArgs
          & "$env:REQSYS_PYTHON" $gateway @gatewayArgs
          exit $LASTEXITCODE

      - name: Validate sanitized recovery evidence
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING" }
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path -LiteralPath $evidence)) { throw "RECOVERY_EVIDENCE_MISSING" }
          $e = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
          if (-not $e.ok -or $e.result -ne "EXISTING_DESKTOP_WATCHDOG_RUN_REQUESTED") {
            throw "DESKTOP_WATCHDOG_RECOVERY_NOT_CONFIRMED"
          }
          if ($e.source_host -ne "DESKTOP-PDQK954") { throw "SOURCE_HOST_MISMATCH" }
          if ($e.target_host -ne "DESKTOP-PDQK954") { throw "TARGET_HOST_MISMATCH" }
          if ($e.execution_mode -ne "local_pc24x7_runner") { throw "EXECUTION_MODE_MISMATCH" }
          if ($e.remote_access_attempted) { throw "REMOTE_ACCESS_WAS_ATTEMPTED" }
          if ($e.rdc_required) { throw "RDC_WAS_REQUIRED" }
          if (-not $e.run_requested) { throw "WATCHDOG_RUN_NOT_REQUESTED" }
          if ($e.task_created_or_modified -and (-not $e.task_repair_attempted -or -not $e.task_repair_verified)) {
            throw "UNVERIFIED_TASK_MUTATION_REPORTED"
          }
          if ($e.production_touched) { throw "PRODUCTION_TOUCHED" }
          if ($e.secrets_read -or $e.credentials_supplied) { throw "SECRET_OR_CREDENTIAL_USE_REPORTED" }

      - name: Upload sanitized evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: noteri-desktop-watchdog-recovery-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\noteri-desktop-watchdog-recovery\evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          "## Desktop Watchdog Local Recovery" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($env:TARGET_PATH) {
            $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
            if (Test-Path -LiteralPath $evidence) {
              $e = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
              "- Resultado: $($e.result)" | Add-Content $env:GITHUB_STEP_SUMMARY
              "- Target: DESKTOP-PDQK954" | Add-Content $env:GITHUB_STEP_SUMMARY
              "- Task criada/alterada: $($e.task_created_or_modified)" | Add-Content $env:GITHUB_STEP_SUMMARY
            }
          }
          "- Execução: local no runner PC24x7 governado" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Session Launcher: obrigatório" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Command Gateway risco: 2" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Credenciais fornecidas: não" | Add-Content $env:GITHUB_STEP_SUMMARY


  reboot-once:
    if: ${{ inputs.mode == 'reboot-once' }}
    name: Owner-authorized one-time Desktop reboot
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    env:
      RULES_SHA: 3dc23924279f04672d87fcc3c5a7a7cbff2e4794
      ACTION_ID: host-power.remote-reboot-once.desktop.study-mode-20260928
      TARGET_HOST: DESKTOP-PDQK954
      AUTHORIZATION_REF: chat-20260928-desktop-study-mode-unblock-explicit
      CORRELATION_ID: desktop-reboot-once-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\desktop-one-time-reboot\evidence.json

    steps:
      - name: Assert exact Noteri executor
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne "Noteri") {
            throw "NOTERI_HOST_MISMATCH"
          }

      - name: Checkout immutable source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned portable Python 3.12
        shell: powershell
        env:
          PORTABLE_PYTHON_VERSION: "3.12.10"
          PORTABLE_PYTHON_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
