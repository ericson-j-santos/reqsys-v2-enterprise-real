tgpt-workers\reqsys-watchdog-session-source
      RULES_SHA: 562fc4274aff24f7058cb135f27a509aa69031c1
      CORRELATION_ID: desktop-dedicated-listener-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\desktop-dedicated-listener\evidence.json

    steps:
      - name: Assert exact legacy Desktop runner
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME -ine "DESKTOP-PDQK954") { throw "LEGACY_DESKTOP_HOST_MISMATCH" }
          if ($env:RUNNER_NAME -ine "DESKTOP-PDQK954") { throw "LEGACY_RUNNER_NAME_MISMATCH" }
          if ($env:GITHUB_REPOSITORY -cne "ericson-j-santos/reqsys-v2-enterprise-real") {
            throw "SOURCE_REPOSITORY_MISMATCH"
          }

      - name: Checkout immutable workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare pinned portable Python 3.12
        shell: powershell
        env:
          PORTABLE_PYTHON_VERSION: "3.12.10"
          PORTABLE_PYTHON_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PORTABLE_PYTHON_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
        run: |
          $ErrorActionPreference = "Stop"
          $root = Join-Path $env:RUNNER_TEMP ("reqsys-python-" + $env:PORTABLE_PYTHON_VERSION + "-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          $zip = "$root.zip"
          if (Test-Path -LiteralPath $root) { Remove-Item -LiteralPath $root -Recurse -Force }
          if (Test-Path -LiteralPath $zip) { Remove-Item -LiteralPath $zip -Force }
          New-Item -ItemType Directory -Force $root | Out-Null
          Invoke-WebRequest -Uri $env:PORTABLE_PYTHON_URL -OutFile $zip -UseBasicParsing
          $observedHash = ([BitConverter]::ToString(([Security.Cryptography.SHA256]::Create()).ComputeHash([IO.File]::ReadAllBytes($zip)))).Replace('-', '').ToLowerInvariant()
          if ($observedHash -ne $env:PORTABLE_PYTHON_SHA256) {
            throw "portable_python_sha256_mismatch:$observedHash"
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $root -Force
          $python = Join-Path $root "python.exe"
          if (-not (Test-Path -LiteralPath $python)) { throw "portable_python_executable_missing" }
          $observedVersion = (& $python --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or $observedVersion -ne "Python $env:PORTABLE_PYTHON_VERSION") {
            throw "portable_python_version_mismatch:$observedVersion"
          }
          "REQSYS_PYTHON=$python" | Add-Content $env:GITHUB_ENV

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare dedicated clean session source
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $source = [IO.Path]::GetFullPath($env:TARGET_REPO)
          $allowedRoot = [IO.Path]::GetFullPath("C:\dev\chatgpt-workers")
          if (-not $source.StartsWith($allowedRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
            throw "SESSION_SOURCE_OUTSIDE_GOVERNED_ROOT"
          }
          if (Test-Path -LiteralPath $source) {
            if (-not (Test-Path -LiteralPath (Join-Path $source ".git"))) {
              throw "SESSION_SOURCE_NOT_GIT_REPOSITORY"
            }
            $dirty = & git -C $source status --porcelain=v1
            if ($LASTEXITCODE -ne 0 -or $dirty) { throw "SESSION_SOURCE_NOT_CLEAN" }
          } else {
            New-Item -ItemType Directory -Force (Split-Path -Parent $source) | Out-Null
            & git clone --no-checkout --local $env:GITHUB_WORKSPACE $source
            if ($LASTEXITCODE -ne 0) { throw "SESSION_SOURCE_CLONE_FAILED" }
          }
          & git -C $source remote set-url origin https://github.com/ericson-j-santos/reqsys-v2-enterprise-real.git
          if ($LASTEXITCODE -ne 0) { throw "SESSION_SOURCE_REMOTE_FAILED" }
          & git -C $source fetch --prune --no-tags origin main
          if ($LASTEXITCODE -ne 0) { throw "SESSION_SOURCE_FETCH_FAILED" }
          $remoteHead = (& git -C $source rev-parse --verify refs/remotes/origin/main).Trim().ToLowerInvariant()
          $anchorSha = "${{ github.sha }}".ToLowerInvariant()
          if ($remoteHead -ne $anchorSha) { throw "SESSION_SOURCE_REMOTE_HEAD_MISMATCH" }
          & git -C $source checkout --detach $anchorSha
          if ($LASTEXITCODE -ne 0) { throw "SESSION_SOURCE_CHECKOUT_FAILED" }
          $finalHead = (& git -C $source rev-parse HEAD).Trim().ToLowerInvariant()
          $finalDirty = & git -C $source status --porcelain=v1
          if ($LASTEXITCODE -ne 0 -or $finalHead -ne $anchorSha -or $finalDirty) {
            throw "SESSION_SOURCE_FINAL_STATE_INVALID"
          }

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $rulesScripts = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts"
          $pythonRoot = Split-Path -Parent $env:REQSYS_PYTHON
          $pth = Join-Path $pythonRoot "python312._pth"
          if (-not (Test-Path -LiteralPath $pth)) { throw "PORTABLE_PYTHON_PTH_MISSING" }
          $pthLines = @(Get-Content -LiteralPath $pth)
          if ($pthLines -notcontains $rulesScripts) {
            Add-Content -LiteralPath $pth -Value $rulesScripts
          }
          $launcher = Join-Path $rulesScripts "session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "desktop-dedicated-listener",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--require-runner-version-preflight",
            "--sync-ref", "origin/main"
          )
          $raw = & "$env:REQSYS_PYTHON" $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Run dedicated listener mode through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
          MODE: ${{ inputs.mode }}
          DEDICATED_CONFIRM: ${{ inputs.dedicated_recovery_confirm }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\desktop_dedicated_listener_recovery.py"
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          $gatewayArgs = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "180",
            "--expected-head", $env:ANCHOR_SHA,
            "--", "python", $script,
            "--mode", $env:MODE,
            "--confirm", $env:DEDICATED_CONFIRM,
            "--evidence-file", $evidence
          )
          & "$env:REQSYS_PYTHON" $gateway @gatewayArgs
          exit $LASTEXITCODE

      - name: Validate sanitized dedicated listener evidence
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          MODE: ${{ inputs.mode }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING" }
          $evidencePath = Join-Path $env:TARGET_PATH "artifacts\desktop-dedicated-listener\evidence.json"
          if (-not (Test-Path -LiteralPath $evidencePath)) { throw "DEDICATED_EVIDENCE_MISSING" }
          $e = Get-Content -Raw -Encoding UTF8 $evidencePath | ConvertFrom-Json
          if ($e.mode -ne $env:MODE) { throw "MODE_MISMATCH" }
          if ($e.source_host -ne "DESKTOP-PDQK954") { throw "SOURCE_HOST_MISMATCH" }
          if ($e.source_runner_name -ne "DESKTOP-PDQK954") { throw "SOURCE_RUNNER_NAME_MISMATCH" }
          if ([int]$e.source_runner_id -ne 22) { throw "SOURCE_RUNNER_ID_MISMATCH" }
          if ($e.source_repository -ne "ericson-j-santos/reqsys-v2-enterprise-real") { throw "SOURCE_REPOSITORY_MISMATCH" }
          if ($e.target_repository -ne "ericson-j-santos/desktop-pc24x7-runtime") { throw "TARGET_REPOSITORY_MISMATCH" }
          if ([int]$e.target_runner_id -ne 2) { throw "TARGET_RUNNER_ID_MISMATCH" }
          if ($e.target_runner_name -ne "DESKTOP-PDQK954-runtime") { throw "TARGET_RUNNER_NAME_MISMATCH" }
          $expectedHome = [IO.Path]::GetFullPath((Join-Path $env:LOCALAPPDATA "DesktopPC24x7\GitHubRunner"))
          $expectedExecutable = [IO.Path]::GetFullPath((Join-Path $expectedHome "bin\Runner.Listener.exe"))
          if ([IO.Path]::GetFullPath([string]$e.target_runner_home) -ine $expectedHome) { throw "TARGET_HOME_MISMATCH" }
          if ([IO.Path]::GetFullPath([string]$e.target_listener_executable) -ine $expectedExecutable) { throw "TARGET_EXECUTABLE_MISMATCH" }
          if (-not $e.identity_verified) { throw "IDENTITY_NOT_VERIFIED" }
          if ($e.process_arguments_observed -or $e.credentials_observed -or $e.raw_logs_read) { throw "UNSANITIZED_OBSERVATION" }
          if ($e.remote_shell_used) { throw "REMOTE_SHELL_USED" }
          if ($e.registration_mutated -or $e.labels_mutated -or $e.services_mutated -or $e.tasks_mutated -or $e.firewall_mutated -or $e.acl_mutated -or $e.safe_directory_mutated -or $e.activation_script_called) {
            throw "FORBIDDEN_MUTATION_REPORTED"
          }
          if ([int]$e.action_count -gt 1) { throw "ACTION_LIMIT_EXCEEDED" }
          if ($env:MODE -eq "dedicated-readonly") {
            if ($e.ok -ne $true -or $e.result -ne "DESKTOP_DEDICATED_LISTENER_READONLY_OK" -or [int]$e.action_count -ne 0) {
              throw "READONLY_RESULT_INVALID"
            }
          } else {
            $allowedResults = @(
              "DESKTOP_DEDICATED_LISTENER_STARTED",
              "DESKTOP_DEDICATED_LISTENER_RESTARTED",
              "DESKTOP_DEDICATED_LISTENER_ALREADY_HEALTHY"
            )
            if ($e.ok -ne $true -or $allowedResults -notcontains [string]$e.result) {
              throw "RECOVERY_RESULT_INVALID"
            }
          }

      - name: Upload sanitized dedicated listener evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: desktop-dedicated-listener-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\desktop-dedicated-listener\evidence.json
          if-no-files-found: error
          retention-days: 30
