name: Noteri → Desktop Watchdog Recovery

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Bounded recovery mode'
        required: false
        type: choice
        default: watchdog
        options:
          - watchdog
          - runner-bootstrap
          - runner-canary

permissions:
  contents: read

concurrency:
  group: noteri-desktop-watchdog-recovery
  cancel-in-progress: false

jobs:
  recover:
    if: ${{ inputs.mode == 'watchdog' || inputs.mode == '' }}
    name: Run existing Desktop watchdog through governed Windows RPC
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    env:
      TARGET_REPO: ${{ github.workspace }}
      RULES_SHA: 5af7b5ab6e31c24744176abd774855168c55953f
      CORRELATION_ID: noteri-desktop-watchdog-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\noteri-desktop-watchdog-recovery\evidence.json

    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "noteri-desktop-watchdog",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", "origin/main"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Query and run exact existing Desktop watchdog through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $recoveryScript = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_watchdog_rpc_recovery.py"
          $gatewayArgs = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "90",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $recoveryScript,
            "--confirm", "RUN-EXISTING-DESKTOP-WATCHDOG",
            "--evidence-file", $env:EVIDENCE_REL
          )
          & python $gateway @gatewayArgs
          exit $LASTEXITCODE

      - name: Validate sanitized recovery evidence
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING" }
          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path -LiteralPath $evidence)) { throw "RECOVERY_EVIDENCE_MISSING" }
          $e = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
          if (-not $e.ok -or $e.result -ne "EXISTING_DESKTOP_WATCHDOG_RUN_REQUESTED") {
            throw "DESKTOP_WATCHDOG_RECOVERY_NOT_CONFIRMED"
          }
          if ($e.source_host -ne "Noteri") { throw "SOURCE_HOST_MISMATCH" }
          if ($e.target_host -ne "DESKTOP-PDQK954") { throw "TARGET_HOST_MISMATCH" }
          if (-not $e.run_requested) { throw "WATCHDOG_RUN_NOT_REQUESTED" }
          if ($e.task_created_or_modified) { throw "TASK_MUTATION_REPORTED" }
          if ($e.production_touched) { throw "PRODUCTION_TOUCHED" }
          if ($e.secrets_read -or $e.credentials_supplied) { throw "SECRET_OR_CREDENTIAL_USE_REPORTED" }

      - name: Upload sanitized evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: noteri-desktop-watchdog-recovery-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\noteri-desktop-watchdog-recovery\evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          "## Noteri → Desktop Watchdog Recovery" | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($env:TARGET_PATH) {
            $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
            if (Test-Path -LiteralPath $evidence) {
              $e = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json
              "- Resultado: $($e.result)" | Add-Content $env:GITHUB_STEP_SUMMARY
              "- Target: DESKTOP-PDQK954" | Add-Content $env:GITHUB_STEP_SUMMARY
              "- Task criada/alterada: $($e.task_created_or_modified)" | Add-Content $env:GITHUB_STEP_SUMMARY
            }
          }
          "- Session Launcher: obrigatório" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Command Gateway risco: 2" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Credenciais fornecidas: não" | Add-Content $env:GITHUB_STEP_SUMMARY

  runner-bootstrap:
    if: ${{ inputs.mode == 'runner-bootstrap' }}
    name: Bootstrap registered Desktop GitHub runner through control plane
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 6
    env:
      TARGET_REPO: ${{ github.workspace }}
      RULES_SHA: 881d9ca2f8e77025edb7298b22981109c567a730
      CORRELATION_ID: desktop-runner-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\desktop-runner-bootstrap\evidence.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "desktop-runner-bootstrap",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", "origin/main"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Dispatch fixed runner bootstrap through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\desktop_runner_bootstrap_via_orchestrator.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "150",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $script,
            "--confirm", "BOOTSTRAP-DESKTOP-GITHUB-RUNNER-VIA-ORCHESTRATOR",
            "--correlation-id", $env:CORRELATION_ID,
            "--timeout-seconds", "90",
            "--evidence-file", $env:EVIDENCE_REL
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Validate sanitized bootstrap evidence
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $path = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path -LiteralPath $path)) { throw "BOOTSTRAP_EVIDENCE_MISSING" }
          $e = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          if (-not $e.ok -or $e.result -ne "DESKTOP_GITHUB_RUNNER_LOCAL_BOOTSTRAP_VERIFIED") {
            throw "DESKTOP_RUNNER_BOOTSTRAP_NOT_VERIFIED"
          }
          if (-not $e.bootstrap.local_listener_verified) { throw "LISTENER_NOT_VERIFIED" }
          if (-not $e.pickup_required) { throw "PICKUP_REQUIREMENT_MISSING" }
          if (-not $e.replay.replayed -or -not $e.replay.same_work_item -or $e.replay.redispatched) {
            throw "IDEMPOTENCY_NOT_PROVEN"
          }
          if ($e.production_touched -or $e.secrets_read) { throw "SAFETY_INVARIANT_FAILED" }

      - name: Upload sanitized bootstrap evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-runner-bootstrap-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\desktop-runner-bootstrap\evidence.json
          if-no-files-found: error
          retention-days: 30

  runner-canary:
    if: ${{ inputs.mode == 'runner-canary' }}
    name: Prove physical GitHub Actions pickup on DESKTOP-PDQK954
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 5
    env:
      TARGET_REPO: ${{ github.workspace }}
      RULES_SHA: 881d9ca2f8e77025edb7298b22981109c567a730
      CORRELATION_ID: desktop-runner-pickup-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\desktop-runner-pickup\evidence.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "desktop-runner-pickup",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", "origin/main"
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Prove exact physical host through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\desktop_runner_pickup_canary.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $script,
            "--confirm", "PROVE-DESKTOP-GITHUB-RUNNER-PICKUP",
            "--evidence-file", $env:EVIDENCE_REL
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Validate independent pickup evidence
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = "Stop"
          $path = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL
          if (-not (Test-Path -LiteralPath $path)) { throw "PICKUP_EVIDENCE_MISSING" }
          $e = Get-Content -Raw -Encoding UTF8 $path | ConvertFrom-Json
          if (-not $e.ok -or $e.result -ne "DESKTOP_GITHUB_RUNNER_PICKUP_PROVEN") {
            throw "DESKTOP_RUNNER_PICKUP_NOT_PROVEN"
          }
          if ($e.host -ne "DESKTOP-PDQK954" -or $e.runner_name -ne "DESKTOP-PDQK954") {
            throw "DESKTOP_IDENTITY_MISMATCH"
          }
          if ($e.sha -ne "${{ github.sha }}") { throw "SHA_MISMATCH" }
          if ($e.production_touched -or $e.secrets_read) { throw "SAFETY_INVARIANT_FAILED" }

      - name: Upload sanitized pickup evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: desktop-runner-pickup-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\desktop-runner-pickup\evidence.json
          if-no-files-found: error
          retention-days: 30
