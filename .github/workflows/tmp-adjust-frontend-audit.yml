name: Temporary Repair Frontend Dependencies

on:
  push:
    branches:
      - agent/bacen-minimum-controls-v1
    paths:
      - .github/workflows/tmp-adjust-frontend-audit.yml

permissions:
  contents: write

jobs:
  repair-dependencies:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: agent/bacen-minimum-controls-v1
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "20.20.2"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Repair vulnerable dependencies
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm audit fix --package-lock-only
          npm ci
          npm audit --audit-level=high
          npm run build

      - name: Commit deterministic dependency repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- frontend/package.json frontend/package-lock.json; then
            echo "Nenhuma alteração de dependência foi produzida."
            exit 1
          fi
          git add frontend/package.json frontend/package-lock.json
          git commit -m "fix(frontend): atualizar dependências vulneráveis do audit"
          git push origin HEAD:agent/bacen-minimum-controls-v1

# Trigger de reparo definitivo para a PR 1029 em 2026-07-25.
