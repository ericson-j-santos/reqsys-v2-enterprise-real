name: Runtime Async Jobs

on:
  pull_request:
    paths:
      - 'runtime/**'
      - 'docs-site/assets/openapi/**'
      - '.github/workflows/runtime-async-jobs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime-tests:
    name: Runtime async jobs tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: runtime/requirements.txt

      - name: Install dependencies
        working-directory: runtime
        run: pip install -r requirements.txt

      - name: Run tests
        working-directory: runtime
        shell: bash
        env:
          REQSYS_RUNTIME_REDIS_INTEGRATION: '1'
          REQSYS_RUNTIME_REDIS_TEST_URL: redis://localhost:6379/15
        run: |
          set -o pipefail
          mkdir -p .tmp/test-results
          pytest -q --tb=short --maxfail=2 2>&1 | tee .tmp/test-results/pytest.log

      - name: Validate generated OpenAPI sync
        working-directory: runtime
        run: python scripts/export_openapi.py --check

      - name: Publish test diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-test-diagnostics-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/.tmp/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Publish OpenAPI mismatch diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: runtime-openapi-diff-${{ github.run_id }}-${{ github.run_attempt }}
          path: runtime/.tmp/openapi-diff/
          if-no-files-found: ignore
          retention-days: 7
