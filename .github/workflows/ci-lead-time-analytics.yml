name: CI Lead Time Analytics

on:
  workflow_dispatch:
    inputs:
      window_minutes:
        description: 'Duração fixa da janela de análise em minutos.'
        required: false
        default: '60'
        type: string
      min_completed_runs:
        description: 'Mínimo de execuções concluídas para tornar a janela elegível.'
        required: false
        default: '30'
        type: string
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/ci-lead-time-analytics.yml'
      - '.github/workflows/workflow-command-center.yml'
      - 'scripts/build_ci_process_improvement_analytics.py'
      - 'scripts/build_ci_fixed_window_analytics.py'
      - 'scripts/compare_ci_process_baseline.py'
      - 'scripts/annotate_ci_window_comparability.py'
      - 'scripts/update_ci_process_history.py'
      - 'scripts/update_ci_fixed_window_history.py'
      - 'scripts/restore_ci_process_history.py'
      - 'scripts/enrich_command_center_ci_history.py'
      - 'scripts/enrich_command_center_ci_fixed_history.py'
      - 'scripts/ci_fixed_window_sustainability.py'
      - 'tests/scripts/test_build_ci_process_improvement_analytics.py'
      - 'tests/scripts/test_build_ci_fixed_window_analytics.py'
      - 'tests/scripts/test_compare_ci_process_baseline.py'
      - 'tests/scripts/test_annotate_ci_window_comparability.py'
      - 'tests/scripts/test_update_ci_process_history.py'
      - 'tests/scripts/test_update_ci_fixed_window_history.py'
      - 'tests/scripts/test_restore_ci_process_history.py'
      - 'tests/scripts/test_enrich_command_center_ci_history.py'
      - 'tests/scripts/test_ci_fixed_window_sustainability.py'
      - 'audit/baselines/ci-process-improvement-baseline-2026-09-02.json'
      - 'docs/contracts/ci-lead-time-analytics.schema.json'
      - 'docs/runbooks/ci-lead-time-analytics.md'
  schedule:
    - cron: '45 * * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/ci-lead-time-analytics.yml'
      - '.github/workflows/workflow-command-center.yml'
      - 'scripts/build_ci_fixed_window_analytics.py'
      - 'scripts/update_ci_fixed_window_history.py'
      - 'scripts/enrich_command_center_ci_fixed_history.py'
      - 'scripts/ci_fixed_window_sustainability.py'
      - 'tests/scripts/test_build_ci_fixed_window_analytics.py'
      - 'tests/scripts/test_update_ci_fixed_window_history.py'
      - 'tests/scripts/test_ci_fixed_window_sustainability.py'
      - 'docs/runbooks/ci-lead-time-analytics.md'

concurrency:
  group: ci-lead-time-analytics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  lead-time-report:
    name: Build CI lead time analytics
    runs-on: ubuntu-latest
    env:
      WINDOW_MINUTES: ${{ github.event.inputs.window_minutes || '60' }}
      WINDOW_SETTLE_MINUTES: '5'
      WINDOW_ANCHOR_MINUTE: '40'
      MIN_COMPLETED_RUNS: ${{ github.event.inputs.min_completed_runs || '30' }}
      MIN_COMPLETION_COVERAGE_PERCENT: '90'
      MAX_FETCH_PAGES: '20'
      LEAD_TIME_ALERT_SECONDS: '3600'
      LEAD_TIME_WARNING_SECONDS: '900'
      BASELINE_INCIDENT_MINUTES: '143'
      PROCESS_BASELINE_PATH: 'audit/baselines/ci-process-improvement-baseline-2026-09-02.json'
      CI_PROCESS_HISTORY_PATH: 'audit/history/ci-process-improvement-history.jsonl'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore process improvement history from main artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/restore_ci_process_history.py

      - name: Validate process-improvement statistics
        run: |
          python tests/scripts/test_build_ci_process_improvement_analytics.py
          python tests/scripts/test_build_ci_fixed_window_analytics.py
          python tests/scripts/test_compare_ci_process_baseline.py
          python tests/scripts/test_annotate_ci_window_comparability.py
          python tests/scripts/test_update_ci_process_history.py
          python tests/scripts/test_update_ci_fixed_window_history.py
          python tests/scripts/test_restore_ci_process_history.py
          python tests/scripts/test_enrich_command_center_ci_history.py
          python tests/scripts/test_ci_fixed_window_sustainability.py

      - name: Build fixed-hour analytics artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/build_ci_fixed_window_analytics.py

      - name: Compare current window with frozen historical baseline
        run: python scripts/compare_ci_process_baseline.py

      - name: Annotate historical baseline comparability
        run: python scripts/annotate_ci_window_comparability.py

      - name: Update fixed-window process improvement history
        run: python scripts/update_ci_fixed_window_history.py

      - name: Upload CI lead time analytics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lead-time-analytics-${{ github.run_id }}
          path: audit/
          if-no-files-found: error
          retention-days: 30
