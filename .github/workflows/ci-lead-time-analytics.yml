name: CI Lead Time Analytics

on:
  workflow_dispatch:
    inputs:
      window_runs:
        description: 'Quantidade maxima de workflow runs recentes para analisar.'
        required: false
        default: '100'
        type: string
  schedule:
    - cron: '45 * * * *'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/ci-lead-time-analytics.yml'
      - 'scripts/build_ci_process_improvement_analytics.py'
      - 'tests/scripts/test_build_ci_process_improvement_analytics.py'
      - 'docs/contracts/ci-lead-time-analytics.schema.json'
      - 'docs/runbooks/ci-lead-time-analytics.md'
      - 'docs/runbooks/ci-lead-time-kpi-contract.md'

concurrency:
  group: ci-lead-time-analytics-${{ github.ref }}
  cancel-in-progress: true

permissions:
  actions: read
  contents: read

jobs:
  lead-time-report:
    name: Build CI lead time analytics
    runs-on: ubuntu-latest
    env:
      WINDOW_RUNS: ${{ github.event.inputs.window_runs || '100' }}
      LEAD_TIME_ALERT_SECONDS: '3600'
      LEAD_TIME_WARNING_SECONDS: '900'
      BASELINE_INCIDENT_MINUTES: '143'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate process-improvement statistics
        run: python tests/scripts/test_build_ci_process_improvement_analytics.py

      - name: Build analytics artifact
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          RUN_ID: ${{ github.run_id }}
        run: python scripts/build_ci_process_improvement_analytics.py

      - name: Upload CI lead time analytics evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-lead-time-analytics-${{ github.run_id }}
          path: audit/
          if-no-files-found: error
          retention-days: 30
