name: BACEN DPA Reference Integrity

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/VENDOR-DPA-EVIDENCE-CONTRACT.yaml"
      - "scripts/validate_bacen_dpa_reference_integrity.py"
      - ".github/workflows/bacen-dpa-reference-integrity.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/VENDOR-DPA-EVIDENCE-CONTRACT.yaml"
      - "scripts/validate_bacen_dpa_reference_integrity.py"
      - ".github/workflows/bacen-dpa-reference-integrity.yml"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-dpa-reference-integrity-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-05 DPA Reference Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML
      - run: python -m py_compile scripts/validate_bacen_dpa_reference_integrity.py
      - name: Validate references
        run: |
          python scripts/validate_bacen_dpa_reference_integrity.py \
            --contract governance/bacen/VENDOR-DPA-EVIDENCE-CONTRACT.yaml \
            --output artifacts/bacen/bacen-05-dpa-reference-integrity.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: bacen-05-dpa-reference-integrity
          path: artifacts/bacen/bacen-05-dpa-reference-integrity.json
          if-no-files-found: error
          retention-days: 365
