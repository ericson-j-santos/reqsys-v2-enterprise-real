name: ReqSys Backup R2 Bootstrap Contract

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/bootstrap_reqsys_r2_backup.py"
      - "tests/test_bootstrap_reqsys_r2_backup.py"
      - "docs/operations/backup-r2-bootstrap.md"
      - ".github/workflows/reqsys-backup-r2-bootstrap-contract.yml"

permissions:
  contents: read

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - name: Compile bootstrap
        run: python -m py_compile scripts/bootstrap_reqsys_r2_backup.py
      - name: Run focused tests
        run: python -m unittest -v tests/test_bootstrap_reqsys_r2_backup.py
      - name: Verify no secret file contract
        shell: bash
        run: |
          set -euo pipefail
          ! grep -R "\.env" scripts/bootstrap_reqsys_r2_backup.py
          ! grep -R "write_text\|open(" scripts/bootstrap_reqsys_r2_backup.py
