name: Fast CI - Operational Guardrails

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - ".github/workflows/**"
      - "scripts/**"
      - "tests/**"
      - "docs/runbooks/**"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fast-ci-operational-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  operational-guardrails:
    name: Fast CI / operational guardrails
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar sintaxe Python
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/pr_ci_watch.py
          python -m py_compile scripts/workflow_command_center.py
          python -m py_compile scripts/auto_rerun_governed.py
          python -m py_compile scripts/workflow_inventory_audit.py
          python -m py_compile scripts/workflow_inventory_decision_gate.py

      - name: Executar testes rápidos operacionais
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pytest
          python -m pytest \
            tests/test_pr_ci_watch.py \
            tests/test_workflow_command_center.py \
            tests/test_auto_rerun_governed.py \
            tests/test_workflow_inventory_audit.py \
            tests/test_workflow_inventory_decision_gate.py \
            -q

      - name: Validar workflow PR CI Watch
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/pr-ci-watch.yml
          grep -qi -- "--exclude-run-id" .github/workflows/pr-ci-watch.yml
          grep -qi "upload-artifact" .github/workflows/pr-ci-watch.yml
          grep -qi "set -euo pipefail" .github/workflows/pr-ci-watch.yml

      - name: Validar Workflow Command Center
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/workflow-command-center.yml
          test -f scripts/workflow_command_center.py
          test -f tests/test_workflow_command_center.py
          grep -qi "workflow-command-center.html" scripts/workflow_command_center.py
          grep -qi "operational_score" scripts/workflow_command_center.py

      - name: Validar operador consolidado
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/actions-auto-operator.yml
          test ! -f .github/workflows/auto-rerun-governed.yml
          test -f scripts/auto_rerun_governed.py
          test -f tests/test_auto_rerun_governed.py
          grep -qi "auto_rerun_governed.py" .github/workflows/actions-auto-operator.yml
          grep -qi "MAX_RERUN_ATTEMPTS" scripts/auto_rerun_governed.py
          grep -qi "workflow_blocklisted" scripts/auto_rerun_governed.py
          grep -qi "rerun-failed-jobs" scripts/auto_rerun_governed.py

      - name: Validar dispatcher somente manual
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/workflows/actions-dispatcher.yml
          grep -qi "workflow_dispatch" .github/workflows/actions-dispatcher.yml
          if grep -Eq '^  (push|pull_request):' .github/workflows/actions-dispatcher.yml; then
            echo "ERRO: actions-dispatcher voltou a ter gatilho automático redundante."
            exit 1
          fi

      - name: Validar consolidação do gatilho STG
        shell: bash
        run: |
          set -euo pipefail
          target=.github/workflows/stg-end-to-end-evidence.yml
          legacy=.github/workflows/stg-end-to-end-post-merge-trigger.yml
          test -f "$target"
          test -f "$legacy"
          grep -Eq '^  push:' "$target"
          grep -Eq '^    branches: \[main\]' "$target"
          grep -q 'environment-promotion-readiness-gate.yml' "$target"
          grep -q 'stg-blocking-policy-authorization.yml' "$target"
          grep -Eq '^  workflow_dispatch:' "$legacy"
          if grep -Eq '^  (push|pull_request|workflow_run|schedule):' "$legacy"; then
            echo "ERRO: workflow STG intermediário voltou a ter gatilho automático."
            exit 1
          fi
          if grep -Eq 'gh (workflow run|api.+--method POST.+actions/workflows)' "$legacy"; then
            echo "ERRO: workflow STG intermediário voltou a disparar outro Action."
            exit 1
          fi

      - name: Gerar mapa de dependências dos workflows
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python scripts/workflow_inventory_audit.py \
            --repo "${GITHUB_REPOSITORY}" \
            --runs-sample-pages 10 \
            --require-api

      - name: Aplicar gate conservador às recomendações
        shell: bash
        run: |
          set -euo pipefail
          python scripts/workflow_inventory_decision_gate.py \
            --input artifacts/workflow-inventory-audit/workflows.json \
            --output-dir artifacts/workflow-inventory-audit

      - name: Publicar mapa de dependências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-inventory-audit
          path: artifacts/workflow-inventory-audit
          if-no-files-found: warn
          retention-days: 30
