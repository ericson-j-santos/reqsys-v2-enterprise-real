name: One-shot ReqSys Data Platform Main Protection\n\non:\n  push:\n    branches:\n      - ops/data-main-protection-20260923-1719\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: reqsys-data-platform-main-protection-once\n  cancel-in-progress: false\n\njobs:\n  protect-main:\n    name: Protect reqsys-data-platform/main via Noteri Risk3\n    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]\n    timeout-minutes: 12\n    env:\n      TARGET_REPO: C:\dev\reqsys-v2-enterprise-real\n      CORRELATION_ID: data-main-protection-${{ github.run_id }}-${{ github.run_attempt }}\n      ACTION_ID: reqsys.data-platform-main-protection.dev\n      ACTION_SCOPE: repo://ericson-j-santos/reqsys-data-platform/branch/main\n      EVIDENCE_REL: artifacts/reqsys-data-platform-main-protection-noteri/evidence.json\n    steps:\n      - name: Checkout operational branch\n        uses: actions/checkout@v4\n\n      - name: Checkout canonical rules\n        uses: actions/checkout@v4\n        with:\n          repository: ericson-j-santos/chatgpt-operational-rules\n          ref: main\n          path: _rules\n          fetch-depth: 1\n\n      - name: Validate exact Noteri host\n        shell: powershell\n        run: |\n          $ErrorActionPreference = "Stop"\n          if ($env:COMPUTERNAME.ToLowerInvariant() -ne "noteri") {\n            throw "UNEXPECTED_HOST"\n          }\n\n      - name: Mandatory session bootstrap\n        id: session\n        shell: powershell\n        run: |\n          $ErrorActionPreference = "Stop"\n          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"\n          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"\n          $launcherArgs = @(\n            "--policy", $policy,\n            "--repo", $env:TARGET_REPO,\n            "--session-prefix", "data-protect",\n            "--correlation-id", $env:CORRELATION_ID,\n            "--expected-head", "${{ github.sha }}",\n            "--sync-ref", "origin/${{ github.ref_name }}"\n          )\n          $raw = & python $launcher @launcherArgs\n          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n          $line = @($raw)[-1]\n          $data = $line | ConvertFrom-Json\n          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {\n            throw "SESSION_LAUNCH_BLOCKED"\n          }\n          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }\n          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT\n\n      - name: Install exact temporary Risk3 authorization\n        shell: powershell\n        env:\n          TARGET_PATH: ${{ steps.session.outputs.target_path }}\n        run: |\n          $ErrorActionPreference = "Stop"\n          Push-Location $env:TARGET_PATH\n          try {\n            python scripts/configure_reqsys_data_platform_main_protection_risk3.py `\n              --enable `\n              --ttl-minutes 30 `\n              --confirm ENABLE-REQSYS-DATA-PLATFORM-MAIN-PROTECTION-ONCE\n            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n          }\n          finally {\n            Pop-Location\n          }\n\n      - name: Apply protection through Owner Risk3 Gateway\n        shell: powershell\n        env:\n          TARGET_PATH: ${{ steps.session.outputs.target_path }}\n        run: |\n          $ErrorActionPreference = "Stop"\n          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\owner_risk3_gateway.py"\n          $riskArgs = @(\n            "--action-id", $env:ACTION_ID,\n            "--scope", $env:ACTION_SCOPE,\n            "--cwd", $env:TARGET_PATH,\n            "--timeout", "300",\n            "--correlation-id", $env:CORRELATION_ID\n          )\n          & python $gateway @riskArgs\n          exit $LASTEXITCODE\n\n      - name: Remove temporary Risk3 authorization\n        if: always()\n        shell: powershell\n        env:\n          TARGET_PATH: ${{ steps.session.outputs.target_path }}\n        run: |\n          $ErrorActionPreference = "Stop"\n          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_RISK3_CLEANUP" }\n          Push-Location $env:TARGET_PATH\n          try {\n            python scripts/configure_reqsys_data_platform_main_protection_risk3.py `\n              --disable `\n              --confirm DISABLE-REQSYS-DATA-PLATFORM-MAIN-PROTECTION-ONCE\n            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }\n          }\n          finally {\n            Pop-Location\n          }\n\n      - name: Validate sanitized evidence\n        if: always()\n        shell: powershell\n        env:\n          TARGET_PATH: ${{ steps.session.outputs.target_path }}\n        run: |\n          $ErrorActionPreference = "Stop"\n          if (-not $env:TARGET_PATH) { throw "TARGET_PATH_MISSING_FOR_EVIDENCE" }\n          $evidence = Join-Path $env:TARGET_PATH $env:EVIDENCE_REL\n          if (-not (Test-Path $evidence)) { throw "PROTECTION_EVIDENCE_MISSING" }\n          $data = Get-Content -Raw -Encoding UTF8 $evidence | ConvertFrom-Json\n          if ($data.status -notin @("PROTECTION_APPLIED", "ALREADY_COMPLIANT")) { throw "PROTECTION_NOT_CONFIRMED" }\n          if ($data.repository -ne "ericson-j-santos/reqsys-data-platform") { throw "TARGET_REPOSITORY_MISMATCH" }\n          if ($data.branch -ne "main") { throw "TARGET_BRANCH_MISMATCH" }\n          if ($data.target_sha -ne "721a1c57c21b0732bfaa1fac62a8a1af531fe6d0") { throw "TARGET_SHA_MISMATCH" }\n          $expected = @("repository-hygiene", "backup-restore-e2e", "sqlite-postgres-e2e", "data-quality-e2e")\n          foreach ($check in $expected) {\n            if ($data.required_checks -notcontains $check) { throw "REQUIRED_CHECK_MISMATCH" }\n          }\n          if (-not $data.protected) { throw "BRANCH_NOT_PROTECTED" }\n          if (-not $data.pull_request_required) { throw "PULL_REQUEST_NOT_REQUIRED" }\n          if ($data.force_push_allowed) { throw "FORCE_PUSH_ALLOWED" }\n          if ($data.deletion_allowed) { throw "BRANCH_DELETION_ALLOWED" }\n          if ($data.secret_value_exposed) { throw "SECRET_EXPOSURE_REPORTED" }\n\n      - name: Publish sanitized evidence\n        if: always()\n        uses: actions/upload-artifact@v4\n        with:\n          name: reqsys-data-platform-main-protection-${{ github.run_id }}\n          path: ${{ steps.session.outputs.target_path }}\artifacts\reqsys-data-platform-main-protection-noteri\evidence.json\n          if-no-files-found: warn\n          retention-days: 30\n