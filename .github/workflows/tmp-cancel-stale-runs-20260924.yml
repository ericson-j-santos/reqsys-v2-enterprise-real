name: Temporary stale run cleanup 20260924

on:
  push:
    branches:
      - fix/authorized-actions-fast-pickup-20260924
    paths:
      - .github/workflows/tmp-cancel-stale-runs-20260924.yml

permissions:
  actions: write
  contents: read

concurrency:
  group: temporary-stale-run-cleanup-20260924
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel exact orphaned runs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for run_id in 36019040530 36018117667; do
            state="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status,conclusion --jq '[.status, (.conclusion // "")] | @tsv')"
            IFS=$'\t' read -r status conclusion <<< "$state"
            if [ "$status" = "completed" ]; then
              printf '%s already terminal: %s\n' "$run_id" "$conclusion"
              continue
            fi
            gh run cancel "$run_id" --repo "$GITHUB_REPOSITORY" || true
            if [ "$run_id" = "36019040530" ]; then
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$run_id/force-cancel" >/dev/null
            fi
          done

          for attempt in 1 2 3 4 5 6; do
            all_terminal=true
            for run_id in 36019040530 36018117667; do
              status="$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq '.status')"
              if [ "$status" != "completed" ]; then
                all_terminal=false
              fi
            done
            if [ "$all_terminal" = "true" ]; then
              exit 0
            fi
            sleep 5
          done
          echo "STALE_RUN_CLEANUP_NOT_TERMINAL" >&2
          exit 4
