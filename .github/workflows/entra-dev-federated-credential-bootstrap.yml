name: Entra DEV Federated Credential Bootstrap

on:
  push:
    branches:
      - ops/auto-sql-locator-1649-20260913
    paths:
      - .github/workflows/entra-dev-federated-credential-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  TARGET_APP_CLIENT_ID: f1c7cf3a-c338-43f7-8162-5fd0b278dcda
  TARGET_ISSUER: https://token.actions.githubusercontent.com
  TARGET_SUBJECT: repo:ericson-j-santos/reqsys-v2-enterprise-real:environment:reqsys-power-platform-dev
  TARGET_AUDIENCE: api://AzureADTokenExchange
  TARGET_NAME: reqsys-power-platform-dev-github-oidc
  EVIDENCE_DIR: artifacts/entra-dev-federated-bootstrap

jobs:
  bootstrap:
    name: Bootstrap credencial federada DEV
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: development
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Preparar evidência inicial
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/result.json" <<'JSON'
          {"status":"started","environment":"development","production_touched":false,"test_touched":false}
          JSON

      - name: Validar configuração OIDC da identidade governada
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID_FLY_GOVERNED_COMMAND }}
          AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID; do
            if [ -z "${!name:-}" ]; then
              printf '{"status":"blocked","blocker":"missing_%s","production_touched":false,"test_touched":false}\n' "$name" > "$EVIDENCE_DIR/result.json"
              exit 2
            fi
          done

      - name: Login Azure por OIDC governado
        uses: azure/login@v2
        with:
          client-id: ${{ vars.CCP_AZURE_CLIENT_ID_FLY_GOVERNED_COMMAND }}
          tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Criar ou validar credencial federada exata
        shell: bash
        run: |
          set -euo pipefail
          set +x

          if ! az ad app show --id "$TARGET_APP_CLIENT_ID" --query appId -o tsv >/tmp/target-app-id.txt 2>/tmp/app-error.txt; then
            python - <<'PY'
          import json
          from pathlib import Path
          Path("artifacts/entra-dev-federated-bootstrap/result.json").write_text(json.dumps({
              "status": "blocked",
              "blocker": "target_app_not_readable_by_governed_identity",
              "production_touched": False,
              "test_touched": False,
          }, indent=2) + "\n", encoding="utf-8")
          PY
            exit 3
          fi

          az ad app federated-credential list --id "$TARGET_APP_CLIENT_ID" -o json > /tmp/federated.json

          MATCH_COUNT="$(python - <<'PY'
          import json, os
          items=json.load(open('/tmp/federated.json', encoding='utf-8'))
          wanted=(os.environ['TARGET_ISSUER'], os.environ['TARGET_SUBJECT'], os.environ['TARGET_AUDIENCE'])
          count=0
          for x in items:
              audiences=x.get('audiences') or []
              if x.get('issuer')==wanted[0] and x.get('subject')==wanted[1] and wanted[2] in audiences:
                  count += 1
          print(count)
          PY
          )"

          if [ "$MATCH_COUNT" -gt 1 ]; then
            printf '{"status":"blocked","blocker":"duplicate_exact_federated_credentials","match_count":%s,"production_touched":false,"test_touched":false}\n' "$MATCH_COUNT" > "$EVIDENCE_DIR/result.json"
            exit 4
          fi

          if [ "$MATCH_COUNT" -eq 0 ]; then
            cat > /tmp/federated-create.json <<JSON
          {
            "name": "$TARGET_NAME",
            "issuer": "$TARGET_ISSUER",
            "subject": "$TARGET_SUBJECT",
            "description": "ReqSys DEV only - GitHub Actions OIDC for reqsys-power-platform-dev",
            "audiences": ["$TARGET_AUDIENCE"]
          }
          JSON
            az ad app federated-credential create --id "$TARGET_APP_CLIENT_ID" --parameters @/tmp/federated-create.json >/tmp/create-output.json
          fi

          az ad app federated-credential list --id "$TARGET_APP_CLIENT_ID" -o json > /tmp/federated-after.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          items=json.load(open('/tmp/federated-after.json', encoding='utf-8'))
          matches=[]
          for x in items:
              if x.get('issuer')==os.environ['TARGET_ISSUER'] and x.get('subject')==os.environ['TARGET_SUBJECT'] and os.environ['TARGET_AUDIENCE'] in (x.get('audiences') or []):
                  matches.append({
                      'name': x.get('name'),
                      'issuer': x.get('issuer'),
                      'subject': x.get('subject'),
                      'audiences': x.get('audiences') or [],
                  })
          result={
              'status': 'resolved' if len(matches)==1 else 'blocked',
              'exact_match_count': len(matches),
              'credential': matches[0] if len(matches)==1 else None,
              'production_touched': False,
              'test_touched': False,
          }
          Path(os.environ['EVIDENCE_DIR'], 'result.json').write_text(json.dumps(result, indent=2)+"\n", encoding='utf-8')
          if len(matches) != 1:
              raise SystemExit(5)
          PY

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: entra-dev-federated-bootstrap-${{ github.run_id }}
          path: artifacts/entra-dev-federated-bootstrap/result.json
          if-no-files-found: error
          retention-days: 30
