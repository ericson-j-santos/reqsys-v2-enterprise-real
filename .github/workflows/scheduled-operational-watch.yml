name: Scheduled Operational Watch

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

permissions:
  actions: read
  checks: read
  contents: read
  pull-requests: read
  issues: write

jobs:
  operational-watch:
    name: Detect PR evidence gaps
    runs-on: ubuntu-latest
    steps:
      - name: Build operational watch evidence
        id: watch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        with:
          script: |
            const fs = require('fs');
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const now = new Date().toISOString();
            const requiredWorkflowNames = [
              'CI — ReqSys v2 Enterprise',
              'Governance Quality Gates',
              'Governança Padrão Ouro',
              'PR Evidence Gate',
            ];

            const prs = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              per_page: 100,
            });

            const findings = [];
            const prEvidence = [];

            for (const pr of prs) {
              const headSha = pr.head.sha;
              const runs = await github.paginate(github.rest.actions.listWorkflowRunsForRepo, {
                owner,
                repo,
                head_sha: headSha,
                per_page: 100,
              });

              const artifactCountByRun = {};
              for (const run of runs) {
                const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {
                  owner,
                  repo,
                  run_id: run.id,
                  per_page: 100,
                });
                artifactCountByRun[run.id] = artifacts.length;
              }

              const required = requiredWorkflowNames.map((name) => {
                const matchingRuns = runs.filter((run) => run.name === name);
                const successfulRuns = matchingRuns.filter((run) => run.status === 'completed' && run.conclusion === 'success');
                return { name, matching_runs: matchingRuns.length, successful_runs: successfulRuns.length };
              });

              const missing = required.filter((item) => item.successful_runs === 0).map((item) => item.name);
              const hasArtifact = runs.some((run) => artifactCountByRun[run.id] > 0);

              if (runs.length === 0) findings.push({ pr: pr.number, severity: 'high', type: 'missing_runs', message: `No workflow runs for head SHA ${headSha}` });
              if (missing.length > 0) findings.push({ pr: pr.number, severity: 'medium', type: 'missing_required_success', message: `Missing successful required workflows: ${missing.join(', ')}` });
              if (!hasArtifact) findings.push({ pr: pr.number, severity: 'medium', type: 'missing_artifact', message: `No artifact found for current head SHA ${headSha}` });

              prEvidence.push({
                number: pr.number,
                title: pr.title,
                draft: pr.draft,
                html_url: pr.html_url,
                head_ref: pr.head.ref,
                head_sha: headSha,
                mergeable_state: pr.mergeable_state,
                workflow_run_count: runs.length,
                required,
                has_artifact: hasArtifact,
              });
            }

            const audit = {
              schema_version: '1.1.0',
              generated_at: now,
              repository: `${owner}/${repo}`,
              status: findings.some((f) => f.severity === 'high') ? 'failed' : findings.length ? 'warning' : 'passed',
              mode: 'report_only',
              findings,
              pull_requests: prEvidence,
            };

            fs.mkdirSync('audit', { recursive: true });
            fs.writeFileSync('audit/scheduled-operational-watch.json', JSON.stringify(audit, null, 2));
            fs.writeFileSync('audit/scheduled-operational-watch.md', [
              '# Scheduled Operational Watch',
              '',
              `- Repository: ${owner}/${repo}`,
              `- Generated at: ${now}`,
              `- Status: ${audit.status}`,
              `- Mode: ${audit.mode}`,
              `- Findings: ${findings.length}`,
              '',
              '## Findings',
              findings.length ? findings.map((f) => `- PR #${f.pr} [${f.severity}] ${f.type}: ${f.message}`).join('\n') : '- None',
              '',
              '## Policy',
              '- Report-only monitor: evidence gaps are surfaced in artifacts without breaking the scheduled workflow.',
              '- Blocking remains delegated to required CI/quality gates on pull requests.',
            ].join('\n'));

            if (audit.status === 'failed') {
              core.warning(`Operational watch found high severity gaps: ${findings.length}`);
            }

      - name: Upload operational evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scheduled-operational-watch-${{ github.run_id }}
          path: audit/
          if-no-files-found: error
          retention-days: 30

  microsoft-graph-planner-teams-watch:
    name: Detect material Microsoft Graph changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check official Microsoft Graph sources
        id: watch
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b
        env:
          ISSUE_NUMBER: '2165'
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');
            const issueNumber = Number(process.env.ISSUE_NUMBER);
            const sources = [
              {
                id: 'permissions',
                url: 'https://learn.microsoft.com/en-us/graph/permissions-reference',
                anchors: ['ChannelMessage.Read.All', 'ChannelMessage.ReadWrite', 'ChannelMessage.Send']
              },
              {
                id: 'channel-read',
                url: 'https://learn.microsoft.com/en-us/graph/api/channel-list-messages?view=graph-rest-1.0',
                anchors: ['ChannelMessage.Read.Group', 'ChannelMessage.Read.All', 'resource-specific consent']
              },
              {
                id: 'channel-send',
                url: 'https://learn.microsoft.com/en-us/graph/api/chatmessage-post?view=graph-rest-1.0',
                anchors: ['ChannelMessage.Send', 'Teamwork.Migrate.All', 'migration']
              },
              {
                id: 'change-notifications',
                url: 'https://learn.microsoft.com/en-us/graph/teams-changenotifications-chatmessage',
                anchors: ['ChannelMessage.Read.Group', 'ChannelMessage.Read.All', 'resource-specific consent']
              },
              {
                id: 'teams-rsc',
                url: 'https://learn.microsoft.com/en-us/microsoftteams/platform/graph-api/rsc/resource-specific-consent',
                anchors: ['ChannelMessage.Read.Group', 'ChannelMessage.Send.Group', 'applicationPermissions']
              }
            ];
            const rssUrl = 'https://developer.microsoft.com/en-us/graph/changelog/rss';
            const markerStart = '<!-- graph-watch-state\n';
            const markerEnd = '\ngraph-watch-state -->';
            const keywords = [
              'channelmessage', 'channel message', 'chatmessage', 'teamwork.migrate.all',
              'resource-specific consent', 'resource specific consent', 'admin consent',
              'authentication', 'teams'
            ];

            function clean(raw) {
              return raw
                .replace(/<script\b[\s\S]*?<\/script>/gi, ' ')
                .replace(/<style\b[\s\S]*?<\/style>/gi, ' ')
                .replace(/<[^>]+>/g, ' ')
                .replace(/&nbsp;/gi, ' ')
                .replace(/&amp;/gi, '&')
                .replace(/&lt;/gi, '<')
                .replace(/&gt;/gi, '>')
                .replace(/&#39;/g, "'")
                .replace(/&quot;/gi, '"')
                .replace(/\s+/g, ' ')
                .trim();
            }

            function relevantWindow(text, anchors) {
              const lower = text.toLowerCase();
              const ranges = [];
              for (const anchor of anchors) {
                let at = lower.indexOf(anchor.toLowerCase());
                while (at >= 0) {
                  ranges.push([Math.max(0, at - 450), Math.min(text.length, at + anchor.length + 700)]);
                  at = lower.indexOf(anchor.toLowerCase(), at + anchor.length);
                }
              }
              if (!ranges.length) throw new Error('required_anchor_missing');
              ranges.sort((a, b) => a[0] - b[0]);
              const merged = [];
              for (const range of ranges) {
                const last = merged[merged.length - 1];
                if (last && range[0] <= last[1]) last[1] = Math.max(last[1], range[1]);
                else merged.push(range);
              }
              return merged.slice(0, 12).map(([a, b]) => text.slice(a, b)).join('\n---\n');
            }

            function sha256(value) {
              return crypto.createHash('sha256').update(value, 'utf8').digest('hex');
            }

            async function fetchText(url) {
              let last;
              for (let attempt = 0; attempt < 3; attempt++) {
                try {
                  const response = await fetch(url, {
                    headers: {
                      'user-agent': 'ReqSys-MicrosoftGraph-Watch/1.0',
                      accept: 'text/html,application/xml,application/rss+xml;q=0.9,*/*;q=0.8'
                    },
                    signal: AbortSignal.timeout(20000)
                  });
                  if (response.ok) return await response.text();
                  last = new Error('http_' + response.status);
                  if (![429, 500, 502, 503, 504].includes(response.status)) break;
                  const retryAfter = Number(response.headers.get('retry-after') || 0);
                  await new Promise(resolve => setTimeout(resolve, Math.min(8000, retryAfter > 0 ? retryAfter * 1000 : (2 ** attempt) * 1000)));
                } catch (error) {
                  last = error;
                  if (attempt < 2) await new Promise(resolve => setTimeout(resolve, (2 ** attempt) * 1000));
                }
              }
              throw last || new Error('fetch_failed');
            }

            function tag(item, name) {
              const match = item.match(new RegExp('<' + name + '[^>]*>([\\s\\S]*?)<\\/' + name + '>', 'i'));
              return match ? clean(match[1]) : '';
            }

            function rssEntries(raw) {
              const items = raw.match(/<item\b[\s\S]*?<\/item>/gi) || [];
              return items.map(item => {
                const title = tag(item, 'title');
                const description = tag(item, 'description');
                const link = tag(item, 'link');
                const id = tag(item, 'guid') || link || title;
                const published = tag(item, 'pubDate');
                return {id, title, description, link, published};
              }).filter(entry => {
                const haystack = (entry.title + '\n' + entry.description).toLowerCase();
                return keywords.some(keyword => haystack.includes(keyword));
              });
            }

            const issue = await github.rest.issues.get({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issueNumber
            });
            const currentBody = issue.data.body || '';
            const start = currentBody.indexOf(markerStart);
            const end = start >= 0 ? currentBody.indexOf(markerEnd, start + markerStart.length) : -1;
            let previous = {schema_version: '1.0', source_hashes: {}, source_text: {}, rss_initialized: false, seen_rss_ids: []};
            if (start >= 0 && end >= 0) {
              try {
                previous = {...previous, ...JSON.parse(currentBody.slice(start + markerStart.length, end).trim())};
              } catch (error) {
                core.warning('Invalid previous state; seeding safely.');
              }
            }

            const next = {
              schema_version: '1.0',
              source_hashes: {...(previous.source_hashes || {})},
              source_text: {...(previous.source_text || {})},
              rss_initialized: Boolean(previous.rss_initialized),
              seen_rss_ids: Array.isArray(previous.seen_rss_ids) ? previous.seen_rss_ids.slice(-200) : []
            };
            const changes = [];
            const errors = [];
            const seeded = [];

            for (const source of sources) {
              try {
                const text = clean(await fetchText(source.url));
                const excerpt = relevantWindow(text, source.anchors);
                const digest = sha256(excerpt);
                const old = next.source_hashes[source.id];
                if (!old) seeded.push(source.id);
                else if (old !== digest) {
                  changes.push({
                    source: source.id,
                    url: source.url,
                    confirmed_change: 'Relevant official Microsoft documentation changed.',
                    old_digest: old,
                    new_digest: digest,
                    excerpt: excerpt.slice(0, 1800)
                  });
                }
                next.source_hashes[source.id] = digest;
                next.source_text[source.id] = excerpt.slice(0, 4000);
              } catch (error) {
                errors.push({source: source.id, url: source.url, error: String(error.message || error)});
              }
            }

            try {
              const entries = rssEntries(await fetchText(rssUrl));
              const seen = new Set(next.seen_rss_ids);
              if (next.rss_initialized) {
                for (const entry of entries) {
                  if (!seen.has(entry.id)) {
                    changes.push({
                      source: 'graph-changelog-rss',
                      url: entry.link || rssUrl,
                      confirmed_change: entry.title || 'New relevant Microsoft Graph changelog entry.',
                      old_digest: null,
                      new_digest: sha256(entry.id),
                      excerpt: (entry.published + ' ' + entry.description).trim().slice(0, 1800)
                    });
                  }
                }
              } else {
                seeded.push('graph-changelog-rss');
              }
              for (const entry of entries) {
                if (!seen.has(entry.id)) next.seen_rss_ids.push(entry.id);
                seen.add(entry.id);
              }
              next.seen_rss_ids = next.seen_rss_ids.slice(-200);
              next.rss_initialized = true;
            } catch (error) {
              errors.push({source: 'graph-changelog-rss', url: rssUrl, error: String(error.message || error)});
            }

            const impact = 'Pode destravar ou alterar leitura, envio, consentimento ou autenticação do E2E Planner→Teams.';
            const risk = 'Mudar permissões ou autenticação sem validar o contrato oficial pode elevar privilégio ou produzir falso verde no readback do Teams.';
            const adaptation = 'Não conceder permissão automaticamente. Mapear a mudança ao menor escopo oficial, aplicar somente em DEV e reexecutar o E2E com correlation_id único, caso negativo, caso positivo, readback independente e replay sem duplicidade.';

            const stateJson = JSON.stringify(next);
            const status = errors.length ? 'degraded' : 'passed';
            const nextBody = [
              '### Descrição do problema',
              'Monitorar mudanças oficiais do Microsoft Graph que possam destravar ou alterar o E2E Planner→Teams do ReqSys sem ampliar privilégios automaticamente.',
              '',
              '### Estado atual evidenciado',
              '- Execução: GitHub Actions no `Scheduled Operational Watch` existente (cron de 4 horas).',
              '- Último estado técnico: `' + status + '`; fontes com erro: `' + errors.length + '`.',
              '- Comentários do monitor: somente quando houver mudança material detectada nas superfícies oficiais monitoradas.',
              '',
              '### Estado esperado',
              'Detectar mudança material em permissões ChannelMessage, consentimento/RSC, mensagens de canal, change notifications ou autenticação e registrar um único alerta acionável.',
              '',
              '### Causa raiz',
              'O E2E Planner→Teams depende do contrato externo do Microsoft Graph; alterações de permissão, consentimento ou autenticação podem destravar ou invalidar a integração sem mudança no código do ReqSys.',
              '',
              '### Critérios de aceite',
              '- Primeira coleta sem baseline não gera alerta.',
              '- Mudança material futura gera um único comentário com fonte oficial, efeito, risco e menor adaptação segura/idempotente.',
              '- Erro isolado de fonte gera estado degradado, nunca alerta material.',
              '- Replay sem mudança não duplica comentário.',
              '',
              '### Riscos',
              'Falso positivo de documentação e ampliação indevida de privilégio. O monitor não concede permissões, não altera tenant, consentimento, segredo, ambiente ou deploy.',
              '',
              '### Dependências',
              'Microsoft Learn, Microsoft Graph changelog oficial e disponibilidade do GitHub Actions.',
              '',
              '### Evidências',
              '- Artifact sanitizado: `microsoft-graph-planner-teams-watch`.',
              '- Estado/deduplicação persistidos abaixo por SHA-256.',
              '',
              '### PR(s) relacionadas',
              '- #2166',
              '',
              '### Responsável',
              'Engineering Control Plane / GitHub Actions.',
              '',
              '### Prioridade',
              'P1 — confiabilidade do E2E Planner→Teams.',
              '',
              '### Declaração de rastreabilidade',
              'Issue canônica de estado do monitor Microsoft Graph ↔ E2E Planner→Teams ↔ PR #2166.',
              '',
              markerStart + stateJson + markerEnd
            ].join('\n');

            if (currentBody.trim() !== nextBody.trim()) {
              await github.rest.issues.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: nextBody
              });
            }

            if (changes.length) {
              const sections = changes.map(change => [
                '### ' + change.source,
                '- Mudança confirmada: ' + change.confirmed_change,
                '- Fonte oficial: ' + change.url,
                '- Efeito no bloqueio atual: ' + impact,
                '- Risco: ' + risk,
                '- Menor adaptação segura/idempotente: ' + adaptation,
                '- Evidência SHA-256: `' + (change.old_digest || 'new-entry') + '` → `' + change.new_digest + '`',
                '',
                '<details><summary>Trecho oficial observado</summary>',
                '',
                change.excerpt,
                '',
                '</details>'
              ].join('\n')).join('\n\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: issueNumber,
                body: '## Microsoft Graph — mudança material detectada\n\n' + sections
              });
            }

            const report = {
              schema_version: '1.0',
              repository: context.repo.owner + '/' + context.repo.repo,
              run_id: context.runId,
              status,
              notify: changes.length > 0,
              seeded_sources: seeded,
              material_changes: changes,
              source_errors: errors
            };
            fs.mkdirSync('artifacts/microsoft-graph-planner-teams-watch', {recursive: true});
            fs.writeFileSync(
              'artifacts/microsoft-graph-planner-teams-watch/report.json',
              JSON.stringify(report, null, 2) + '\n'
            );
            await core.summary
              .addHeading('Microsoft Graph Planner→Teams Watch')
              .addRaw('Status: ' + status + '\n')
              .addRaw('Material changes: ' + changes.length + '\n')
              .addRaw('Seeded sources: ' + seeded.length + '\n')
              .addRaw('Source errors: ' + errors.length + '\n')
              .write();
            if (errors.length) core.warning('Source errors detected; no alert is emitted from errors alone.');

      - name: Upload sanitized watch evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: microsoft-graph-planner-teams-watch
          path: artifacts/microsoft-graph-planner-teams-watch/report.json
          if-no-files-found: error
          retention-days: 30

