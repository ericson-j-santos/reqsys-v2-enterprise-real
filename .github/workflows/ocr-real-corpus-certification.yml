name: OCR Real Corpus Certification Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/ocr_real_corpus_certify.py'
      - 'scripts/ocr_real_corpus_prepare.py'
      - 'scripts/ocr_real_corpus_policy.py'
      - 'backend/ocr_tests/test_real_corpus_certify.py'
      - 'backend/ocr_tests/test_real_corpus_prepare.py'
      - 'docs/architecture/ocr-real-corpus-certification-v1.md'
      - '.github/workflows/ocr-real-corpus-certification.yml'

permissions:
  contents: read

jobs:
  validate-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: '3.12'
      - name: Validar sintaxe do certificador, preparador e política
        run: python -m py_compile scripts/ocr_real_corpus_certify.py scripts/ocr_real_corpus_prepare.py scripts/ocr_real_corpus_policy.py
      - name: Executar testes do contrato de corpus real
        working-directory: backend
        run: |
          python -m pip install --disable-pip-version-check pytest==9.0.3
          pytest -q ocr_tests/test_real_corpus_certify.py ocr_tests/test_real_corpus_prepare.py
