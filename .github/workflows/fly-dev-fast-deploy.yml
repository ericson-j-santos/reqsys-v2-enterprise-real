name: Fly DEV Fast Deploy

on:
  workflow_dispatch:
    inputs:
      deploy:
        description: "Publicar DEV agora"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write

env:
  CORRELATION_ID: fly-dev-fast-${{ github.run_id }}-${{ github.run_attempt }}

# Fly DEV é contingência manual explícita. Uma execução manual obsoleta é cancelada.
concurrency:
  group: fly-dev-fast-deploy
  cancel-in-progress: true

jobs:
  preflight:
    # Fly.io retirado definitivamente pelo usuario em 2026-10-02.
    if: ${{ false }}
    name: Preflight DEV
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      should_deploy: ${{ steps.plan.outputs.should_deploy }}
      api_url: ${{ steps.env.outputs.api_url }}
      frontend_url: ${{ steps.env.outputs.frontend_url }}
      fly_config: ${{ steps.env.outputs.fly_config }}
      frontend_fly_config: ${{ steps.env.outputs.frontend_fly_config }}
      fly_app: ${{ steps.env.outputs.fly_app }}
      frontend_app: ${{ steps.env.outputs.frontend_app }}
      api_credential_id: ${{ steps.env.outputs.api_credential_id }}
      frontend_credential_id: ${{ steps.env.outputs.frontend_credential_id }}
      credential_consumer: ${{ steps.env.outputs.credential_consumer }}
      azure_client_id: ${{ steps.env.outputs.azure_client_id }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Validar manifesto Fly
        run: python scripts/validate_fly_enterprise_sync.py --output fly-dev-fast-preflight.json
      - name: Planejar publicação
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DEPLOY_INPUT: ${{ github.event.inputs.deploy || 'true' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "workflow_dispatch" ] || [ "$DEPLOY_INPUT" != "true" ]; then
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "should_deploy=true" >> "$GITHUB_OUTPUT"
      - name: Resolver configuração DEV
        id: env
        env:
          CCP_AZURE_CLIENT_ID_DEV: ${{ vars.CCP_AZURE_CLIENT_ID_DEV }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          cfg = json.load(open("infra/fly-environments.json", encoding="utf-8"))["environments"]["dev"]
          print(f"api_url={cfg['api_url']}")
          print(f"frontend_url={cfg['frontend_url']}")
          print(f"fly_config={cfg['fly_config']}")
          print(f"frontend_fly_config={cfg['frontend_fly_config']}")
          print(f"fly_app={cfg['api_app']}")
          print(f"frontend_app={cfg['frontend_app']}")
          print("api_credential_id=fly-api-dev-deploy")
          print("frontend_credential_id=fly-app-dev-deploy")
          print("credential_consumer=github-actions:fly-dev")
          print(f"azure_client_id={os.environ.get('CCP_AZURE_CLIENT_ID_DEV', '')}")
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fly-dev-fast-preflight
          path: fly-dev-fast-preflight.json
          if-no-files-found: warn

  deploy-api:
    # Fly.io retirado definitivamente pelo usuario em 2026-10-02.
    if: >-
      ${{ false && (
        needs.preflight.outputs.should_deploy == 'true'
      ) }}
    name: Deploy API DEV
    runs-on: ubuntu-latest
    needs: preflight
    environment: dev
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Preparar pacote OCR externo
        id: ocr-runtime
        uses: ./.github/actions/prepare-ocr-runtime
        with:
          app-id: ${{ vars.REQSYS_STACK_REBASE_APP_ID }}
          private-key: ${{ secrets.REQSYS_STACK_REBASE_PRIVATE_KEY }}
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master pinned 2026-09-27
      - name: Resolver credencial Fly da API
        uses: ./.github/actions/resolve-managed-credential
        with:
          credential-id: ${{ needs.preflight.outputs.api_credential_id }}
          consumer: ${{ needs.preflight.outputs.credential_consumer }}
          export-env: FLY_API_TOKEN
          vault-name: ${{ vars.REQSYS_KEY_VAULT_NAME }}
          azure-client-id: ${{ needs.preflight.outputs.azure_client_id }}
          azure-tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          evidence-path: audit/fly-dev-fast-api-credential.json
      - name: Preparar demo login sem reinício extra
        run: |
          set -euo pipefail
          flyctl secrets set ALLOW_DEMO_LOGIN=true --stage -a "${{ needs.preflight.outputs.fly_app }}"
      - name: Deploy API Fly app
        working-directory: backend
        env:
          FLY_CONFIG: ${{ needs.preflight.outputs.fly_config }}
          FLY_APP: ${{ needs.preflight.outputs.fly_app }}
        run: |
          set -euo pipefail
          config="${FLY_CONFIG#backend/}"
          # O health público abaixo é o gate autoritativo em DEV. A estratégia
          # immediate evita bloquear por timeout da API de controle Machines do Fly.
          flyctl deploy \
            --remote-only \
            --config "$config" \
            --app "$FLY_APP" \
            --build-arg "GITHUB_SHA=${{ github.sha }}" \
            --build-arg "OCR_EXTERNAL_PACKAGE_REQUIRED=1" \
            --build-arg "OCR_ENGINE_SHA=${{ steps.ocr-runtime.outputs.ocr-sha }}" \
            --build-arg "OCR_ENGINE_VERSION=${{ steps.ocr-runtime.outputs.ocr-version }}" \
            --strategy immediate \
            --deploy-retries 2 \
            --wait-timeout 2m \
            --now
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fly-dev-fast-api
          path: audit/fly-dev-fast-api-credential.json
          if-no-files-found: warn

  deploy-frontend:
    # Fly.io retirado definitivamente pelo usuario em 2026-10-02.
    if: >-
      ${{ false && (
        needs.preflight.outputs.should_deploy == 'true'
      ) }}
    name: Deploy frontend DEV
    runs-on: ubuntu-latest
    needs: preflight
    environment: dev
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1 # master pinned 2026-09-27
      - name: Resolver credencial Fly do frontend
        uses: ./.github/actions/resolve-managed-credential
        with:
          credential-id: ${{ needs.preflight.outputs.frontend_credential_id }}
          consumer: ${{ needs.preflight.outputs.credential_consumer }}
          export-env: FLY_API_TOKEN
          vault-name: ${{ vars.REQSYS_KEY_VAULT_NAME }}
          azure-client-id: ${{ needs.preflight.outputs.azure_client_id }}
          azure-tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          evidence-path: audit/fly-dev-fast-frontend-credential.json
      - name: Deploy frontend Fly app
        working-directory: frontend
        env:
          FRONTEND_FLY_CONFIG: ${{ needs.preflight.outputs.frontend_fly_config }}
          FRONTEND_APP: ${{ needs.preflight.outputs.frontend_app }}
        run: |
          set -euo pipefail
          config="${FRONTEND_FLY_CONFIG#frontend/}"
          flyctl deploy \
            --remote-only \
            --config "$config" \
            --app "$FRONTEND_APP" \
            --strategy immediate \
            --deploy-retries 2 \
            --wait-timeout 2m \
            --now
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fly-dev-fast-frontend
          path: audit/fly-dev-fast-frontend-credential.json
          if-no-files-found: warn

  smoke:
    name: Smoke DEV pós-deploy
    runs-on: ubuntu-latest
    needs: [preflight, deploy-api, deploy-frontend]
    if: >-
      always() &&
      needs.preflight.outputs.should_deploy == 'true' &&
      needs.deploy-api.result == 'success' &&
      needs.deploy-frontend.result == 'success'
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Aguardar API pública ficar pronta
        env:
          API_URL: ${{ needs.preflight.outputs.api_url }}
        run: |
          python - <<'PY'
          import os
          import time
          from urllib.error import HTTPError, URLError
          from urllib.request import Request, urlopen

          url = os.environ["API_URL"].rstrip("/") + "/health"
          deadline = time.monotonic() + 150
          tentativa = 0
          ultimo_erro = "sem tentativa"

          while time.monotonic() < deadline:
              tentativa += 1
              try:
                  request = Request(
                      url,
                      headers={"Accept": "application/json", "User-Agent": "reqsys-dev-fast-readiness/1.0"},
                  )
                  with urlopen(request, timeout=5) as response:
                      if 200 <= int(response.status) < 300:
                          print(f"API DEV pronta na tentativa {tentativa}: HTTP {response.status}")
                          raise SystemExit(0)
                      ultimo_erro = f"HTTP {response.status}"
              except (HTTPError, URLError, TimeoutError, OSError) as exc:
                  ultimo_erro = f"{type(exc).__name__}: {exc}"

              restante = deadline - time.monotonic()
              if restante <= 0:
                  break
              time.sleep(min(2, restante))

          print(f"::error::API DEV não ficou pronta em até 150s: {ultimo_erro}")
          raise SystemExit(1)
          PY
      - name: Validar runtime, sincronização e rota do assistente em paralelo
        env:
          API_URL: ${{ needs.preflight.outputs.api_url }}
          FRONTEND_URL: ${{ needs.preflight.outputs.frontend_url }}
        run: |
          set -uo pipefail

          python scripts/validate_public_runtime.py \
            --base-url "$API_URL" \
            --environment dev \
            --include-optional-evidence \
            --output public-runtime-validation-dev.json &
          runtime_pid=$!

          python scripts/validate_publication_sync.py \
            --environment dev \
            --expected-sha "${{ github.sha }}" \
            --timeout 20 \
            --output publication-sync-dev.json &
          sync_pid=$!

          python - <<'PY' &
          import os, sys, urllib.request
          url = os.environ['FRONTEND_URL'].rstrip('/') + '/hub-lowcode/copilot-memory/instalar'
          try:
              with urllib.request.urlopen(url, timeout=15) as response:
                  body = response.read(262144).decode('utf-8', errors='replace')
                  ok = response.status == 200 and ('<div id="app"' in body or "<div id='app'" in body)
                  print(f"route={url} status={response.status} app_shell={ok}")
                  raise SystemExit(0 if ok else 1)
          except Exception as exc:
              print(f"route={url} error={exc}", file=sys.stderr)
              raise SystemExit(1)
          PY
          route_pid=$!

          set +e
          wait "$runtime_pid"; runtime_status=$?
          wait "$sync_pid"; sync_status=$?
          wait "$route_pid"; route_status=$?
          set -e

          if [ "$runtime_status" -ne 0 ] || [ "$sync_status" -ne 0 ] || [ "$route_status" -ne 0 ]; then
            echo "::error::Smoke DEV falhou: runtime=$runtime_status sync=$sync_status rota=$route_status"
            exit 1
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fly-dev-fast-smoke
          path: |
            public-runtime-validation-dev.json
            publication-sync-dev.json
          if-no-files-found: warn

  summary:
    name: Resumo Fly DEV Fast Deploy
    runs-on: ubuntu-latest
    needs: [preflight, deploy-api, deploy-frontend, smoke]
    if: always()
    steps:
      - name: Garantir resultado final verdadeiro
        env:
          SHOULD_DEPLOY: ${{ needs.preflight.outputs.should_deploy }}
          API_RESULT: ${{ needs.deploy-api.result }}
          FRONTEND_RESULT: ${{ needs.deploy-frontend.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: |
          {
            echo "## Fly DEV Fast Deploy"
            echo "- Correlation ID: \`$CORRELATION_ID\`"
            echo "- SHA: \`${{ github.sha }}\`"
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| Preflight | ${{ needs.preflight.result }} |"
            echo "| API | ${API_RESULT:-skipped} |"
            echo "| Frontend | ${FRONTEND_RESULT:-skipped} |"
            echo "| Smoke | ${SMOKE_RESULT:-skipped} |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SHOULD_DEPLOY" != "true" ]; then
            exit 0
          fi
          if [ "$API_RESULT" != "success" ] || [ "$FRONTEND_RESULT" != "success" ] || [ "$SMOKE_RESULT" != "success" ]; then
            echo "::error::Publicação DEV rápida não concluiu com todas as evidências verdes."
            exit 1
          fi
