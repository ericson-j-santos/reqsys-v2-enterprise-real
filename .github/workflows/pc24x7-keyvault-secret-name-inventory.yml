name: PC24x7 Key Vault Secret Name Inventory

on:
  push:
    branches:
      - ops/desktop-runner-service-recovery-20260921

permissions:
  contents: read
  id-token: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    environment: development
    timeout-minutes: 5
    env:
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Validate federated identity metadata
        shell: bash
        run: |
          set -euo pipefail
          for name in REQSYS_KEY_VAULT_NAME CCP_AZURE_CLIENT_ID CCP_AZURE_TENANT_ID CCP_AZURE_SUBSCRIPTION_ID; do
            test -n "${!name:-}" || { echo "MISSING=$name"; exit 2; }
          done

      - name: Login Azure via existing DEV OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: List Key Vault secret names only
        shell: bash
        run: |
          set -euo pipefail
          names="$(az keyvault secret list --vault-name "$REQSYS_KEY_VAULT_NAME" --query '[].name' -o tsv)"
          count="$(echo "$names" | sed '/^$/d' | wc -l | tr -d ' ')"
          echo "KEYVAULT_SECRET_NAME_COUNT=$count"
          echo "$names" | sed '/^$/d' | sed 's/^/KEYVAULT_SECRET_NAME=/'
