name: Noteri Study Mode DEV Reconcile

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - "fix/noteri-reconcile-preserve-runtime-*"
    paths:
      - '.github/workflows/noteri-study-mode-dev-reconcile.yml'
      - 'backend/app/services/noteri_host_profile.py'
      - 'backend/tests/test_noteri_host_profile_api.py'
      - 'docker-compose.noteri-study-mode.yml'
      - 'frontend/src/services/hostProfileLocalAgent.js'
      - 'frontend/src/views/TaskConsoleView.vue'
      - 'scripts/noteri_study_mode_dev_reconcile.py'
      - 'tests/test_noteri_study_mode_dev_reconcile.py'

permissions:
  contents: read

concurrency:
  group: noteri-study-mode-dev-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: Reconcile Study Mode on PC24x7 DEV
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 15
    environment: development
    steps:
      - name: Checkout immutable source SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Reconcile same-origin Study Mode and execute physical E2E
        shell: powershell
        env:
          EVIDENCE_FILE: artifacts/noteri-study-mode-dev/evidence.json
        run: |
          $ErrorActionPreference = 'Stop'
          python scripts/noteri_study_mode_dev_reconcile.py --repo-root "$env:GITHUB_WORKSPACE" --expected-sha "${{ github.sha }}" --confirm RECONCILE-NOTERI-STUDY-MODE-DEV --evidence-path "$env:EVIDENCE_FILE"

      - name: Validate sanitized evidence
        shell: powershell
        env:
          EVIDENCE_FILE: artifacts/noteri-study-mode-dev/evidence.json
        run: |
          $ErrorActionPreference = 'Stop'
          $e = Get-Content -Raw -Encoding UTF8 $env:EVIDENCE_FILE | ConvertFrom-Json
          if (-not $e.ok) { throw 'study_mode_e2e_failed' }
          if ($e.environment -ne 'dev') { throw 'environment_mismatch' }
          if ($e.host -ne 'DESKTOP-PDQK954') { throw 'host_mismatch' }
          if ($e.production_touched) { throw 'production_touched' }
          if ($e.secrets_read) { throw 'secret_read_detected' }
          if (-not $e.control_plane_bridge) { throw 'control_plane_bridge_missing' }
          if ($e.profile_mount_rw) { throw 'legacy_profile_mount_detected' }
          if (-not $e.api_e2e.estudo_readback) { throw 'api_readback_missing' }
          if (-not $e.api_e2e.idempotent_replay) { throw 'idempotency_missing' }
          if ($e.api_e2e.final_profile -ne 'NORMAL') { throw 'api_final_profile_not_normal' }
          if (-not $e.browser_e2e.estudo_observed_in_ui) { throw 'ui_estudo_not_observed' }
          if ($e.browser_e2e.final_profile -ne 'NORMAL') { throw 'ui_final_profile_not_normal' }

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: noteri-study-mode-dev-evidence
          path: artifacts/noteri-study-mode-dev/evidence.json
          if-no-files-found: error
          retention-days: 14
