name: Noteri Study Mode DEV Reconcile

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Modo governado de reconciliação DEV'
        required: false
        default: 'study-mode'
        type: choice
        options:
          - study-mode
          - public-static
      authorization_comment_id:
        description: 'Comentário exato do owner no gateway; obrigatório em public-static'
        required: false
        type: string
      expected_sha:
        description: 'SHA de main capturado pelo gateway; obrigatório em public-static'
        required: false
        type: string
  push:
    branches:
      - main
    paths:
      - '.github/workflows/noteri-study-mode-dev-reconcile.yml'
      - 'backend/app/api/monitoramento_operacional.py'
      - 'backend/app/api/noteri_host_profile.py'
      - 'backend/app/main.py'
      - 'backend/app/services/noteri_host_profile.py'
      - 'backend/tests/test_noteri_host_profile_api.py'
      - 'docker-compose.dev.yml'
      - 'docker-compose.noteri-study-mode.yml'
      - 'docker-compose.pc24x7-public-dev.yml'
      - 'config/pc24x7-teams-bot-runtime.override.yml'
      - 'infra/nginx/default.dev.conf'
      - 'infra/nginx/default.pc24x7-public-dev.conf'
      - 'frontend/src/services/hostProfileLocalAgent.js'
      - 'frontend/src/views/TaskConsoleView.vue'
      - 'scripts/noteri_study_mode_dev_reconcile.py'
      - 'scripts/pc24x7_public_dev_cutover_guard.py'
      - 'scripts/provision_pc24x7_teams_bot_runtime.py'
      - 'scripts/reconcile_pc24x7_public_dev_runtime.py'
      - 'scripts/dev_runtime_recovery.py'
      - 'scripts/recover_reqsys_engineering_orchestrator_dev.py'
      - 'tests/test_noteri_study_mode_dev_reconcile.py'
      - 'tests/test_pc24x7_public_dev_static_runtime.py'
      - 'tests/test_recover_reqsys_engineering_orchestrator_dev.py'

permissions:
  contents: read

concurrency:
  group: noteri-study-mode-dev-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch'
    name: Reconcile Study Mode on PC24x7 DEV
    permissions:
      contents: read
      id-token: write
      issues: read
    runs-on: [self-hosted, Windows, X64, reqsys-dev, reqsys-dev-pool-v1, reqsys-cap-runtime-v1]
    timeout-minutes: 45
    environment: development
    env:
      RULES_SHA: fabaccc32abbbf6f95be443629ef2ebb1246dad5
      CORRELATION_ID: pc24x7-dev-${{ inputs.mode }}-${{ github.run_id }}-${{ github.run_attempt }}
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
      CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
      CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
    steps:
      - name: Verify owner authorization and exact public DEV SHA
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static'
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHORIZATION_COMMENT_ID: ${{ inputs.authorization_comment_id }}
          EXPECTED_DISPATCH_SHA: ${{ inputs.expected_sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:AUTHORIZATION_COMMENT_ID -notmatch '^[0-9]+$') { throw 'PUBLIC_DEV_AUTHORIZATION_COMMENT_INVALID' }
          if ($env:EXPECTED_DISPATCH_SHA -notmatch '^[0-9a-f]{40}$') { throw 'PUBLIC_DEV_EXPECTED_SHA_INVALID' }
          if ($env:EXPECTED_DISPATCH_SHA -ne '${{ github.sha }}') { throw 'PUBLIC_DEV_DISPATCH_SHA_MISMATCH' }
          $headers = @{
            Accept = 'application/vnd.github+json'
            Authorization = "Bearer $env:GH_TOKEN"
            'X-GitHub-Api-Version' = '2022-11-28'
          }
          $uri = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/comments/$env:AUTHORIZATION_COMMENT_ID"
          try { $comment = Invoke-RestMethod -Method Get -Uri $uri -Headers $headers -TimeoutSec 30 } catch {
            throw 'PUBLIC_DEV_AUTHORIZATION_READBACK_FAILED'
          }
          $expectedIssue = "https://api.github.com/repos/$env:GITHUB_REPOSITORY/issues/1705"
          if ($comment.user.login -ne 'ericson-j-santos' -or
              $comment.issue_url -ne $expectedIssue -or
              $comment.body -cne '/reqsys run pc24x7-public-dev-reconcile') {
            throw 'PUBLIC_DEV_AUTHORIZATION_MISMATCH'
          }
          $created = [DateTimeOffset]::Parse($comment.created_at).ToUniversalTime()
          $age = [DateTimeOffset]::UtcNow - $created
          if ($age.TotalSeconds -lt -300 -or $age.TotalMinutes -gt 30) {
            throw 'PUBLIC_DEV_AUTHORIZATION_EXPIRED'
          }
          Write-Host 'Owner authorization, issue, command and exact SHA verified.'

      - name: Checkout immutable source SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ inputs.mode == 'public-static' && inputs.expected_sha || github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Fail-closed runner capability preflight
        uses: ./.github/actions/reqsys-dev-runner-preflight
        with:
          profile: runtime
          repository-path: .

      - name: Require explicitly provisioned Microsoft test session
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'study-mode'
        shell: powershell
        env:
          REQSYS_NOTERI_DEV_MSAL_STATE_B64: ${{ secrets.REQSYS_NOTERI_DEV_MSAL_STATE_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:REQSYS_NOTERI_DEV_MSAL_STATE_B64)) {
            throw 'NOTERI_DEV_MSAL_TEST_IDENTITY_NOT_PROVISIONED'
          }
          Write-Host 'DEV test credential present; signature, expiration and role will be validated without logging credentials.'

      - name: Checkout immutable rules for governed Desktop session
        if: github.event_name == 'workflow_dispatch'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Validate governed rules repository access
        if: github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/reqsys-dev-runner-preflight
        with:
          profile: runtime
          repository-path: _rules

      - name: Bootstrap isolated and governed Desktop session
        if: github.event_name == 'workflow_dispatch'
        id: session
        shell: powershell
        env:
          PYTHON_VERSION_PIN: "3.12.10"
          PYTHON_DOWNLOAD_URL: https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip
          PYTHON_EXPECTED_SHA256: 4acbed6dd1c744b0376e3b1cf57ce906f9dc9e95e68824584c8099a63025a3c3
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF -ne 'refs/heads/main') { throw 'MAIN_ONLY' }
          $temp = Join-Path $env:RUNNER_TEMP ("noteri-e2e-python-" + $env:GITHUB_RUN_ID + "-" + $env:GITHUB_RUN_ATTEMPT)
          New-Item -ItemType Directory -Force -Path $temp | Out-Null
          $zip = Join-Path $temp 'python.zip'
          Invoke-WebRequest -Uri $env:PYTHON_DOWNLOAD_URL -OutFile $zip -UseBasicParsing -TimeoutSec 120
          if ((Get-FileHash -LiteralPath $zip -Algorithm SHA256).Hash.ToLowerInvariant() -ne $env:PYTHON_EXPECTED_SHA256) {
            throw 'PYTHON_DIGEST_MISMATCH'
          }
          Expand-Archive -LiteralPath $zip -DestinationPath $temp -Force
          $python = Join-Path $temp 'python.exe'
          if ((& $python --version 2>&1 | Out-String).Trim() -ne "Python $env:PYTHON_VERSION_PIN") {
            throw 'PYTHON_VERSION_MISMATCH'
          }
          $rulesScripts = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts'
          Add-Content -LiteralPath (Join-Path $temp 'python312._pth') -Value $rulesScripts
          $launcher = Join-Path $rulesScripts 'session_launcher.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $sessionPrefix = 'noteri-msal-e2e'
          if ('${{ inputs.mode }}' -eq 'public-static') { $sessionPrefix = 'pc24x7-public-inventory' }
          $parameters = @(
            '--policy', $policy, '--repo', $env:GITHUB_WORKSPACE,
            '--session-prefix', $sessionPrefix,
            '--correlation-id', $env:CORRELATION_ID,
            '--expected-head', '${{ github.sha }}',
            '--sync-ref', 'origin/main',
            '--require-runner-version-preflight'
          )
          $raw = & $python $launcher @parameters
          if ($LASTEXITCODE -ne 0) { throw 'SESSION_LAUNCH_FAILED' }
          $session = @($raw)[-1] | ConvertFrom-Json
          if ($session.result -ne 'SESSION_LAUNCH_OK' -or $session.state_validated -ne $true) {
            throw 'SESSION_LAUNCH_BLOCKED'
          }
          if ($session.head -ne '${{ github.sha }}') { throw 'SESSION_SHA_MISMATCH' }
          "target_path=$($session.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($session.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "gateway_python=$python" | Add-Content $env:GITHUB_OUTPUT

      - name: Inventory public DEV through governed Gateway (read-only)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          GATEWAY_PYTHON: ${{ steps.session.outputs.gateway_python }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SESSION_ID) -or
              [string]::IsNullOrWhiteSpace($env:TARGET_PATH) -or
              [string]::IsNullOrWhiteSpace($env:GATEWAY_PYTHON)) {
            throw 'PUBLIC_DEV_SESSION_MISSING'
          }
          $gateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $probe = Join-Path $env:TARGET_PATH 'scripts\diagnose_pc24x7_public_dev.py'
          $output = Join-Path $env:GITHUB_WORKSPACE 'artifacts\pc24x7-public-dev\evidence.json'
          function Write-SanitizedInventoryReceipt {
            param(
              [string]$Status,
              [string]$ReasonCode,
              [bool]$GatewayVerified,
              [bool]$InventoryCollected
            )
            $receipt = [ordered]@{
              status = $Status
              reason_code = $ReasonCode
              runner_instance_id = $env:REQSYS_DEV_RUNNER_INSTANCE_ID
              environment = 'dev'
              source_sha = '${{ github.sha }}'
              correlation_id = $env:CORRELATION_ID
              session_validated = $true
              command_gateway_verified = $GatewayVerified
              inventory_collected = $InventoryCollected
              runtime_sha_verified = $false
              database_result = 'unverified'
              backup_verified = $false
              rollback_rehearsal_verified = $false
              deployment_performed = $false
              runtime_mutated = $false
              production_touched = $false
            }
            New-Item -ItemType Directory -Force -Path (Split-Path -Parent $output) | Out-Null
            [System.IO.File]::WriteAllText(
              $output, (($receipt | ConvertTo-Json -Depth 4) + [Environment]::NewLine),
              [System.Text.UTF8Encoding]::new($false)
            )
          }
          $argv = @(
            '--policy', $policy, '--correlation-id', $env:CORRELATION_ID,
            'run', '--cwd', $env:TARGET_PATH, '--session-id', $env:SESSION_ID,
            '--risk', '1', '--timeout', '120', '--expected-head', '${{ github.sha }}',
            '--', $env:GATEWAY_PYTHON, '-B', $probe, '--environment', 'dev',
            '--expected-sha', '${{ github.sha }}', '--stdout-only'
          )
          $raw = & $env:GATEWAY_PYTHON $gateway @argv
          $gatewayExit = $LASTEXITCODE
          try { $gate = @($raw)[-1] | ConvertFrom-Json } catch {
            Write-SanitizedInventoryReceipt 'inventory_blocked' 'gateway_receipt_invalid' $false $false
            throw 'PUBLIC_DEV_GATEWAY_RECEIPT_INVALID'
          }
          $gatewayReceiptVerified = (
            $null -ne $gate -and $gate.state_changed -eq $false -and
            $gate.session_id -eq $env:SESSION_ID
          )
          if ($gatewayExit -ne 0) {
            $reasonCode = 'inventory_gateway_blocked'
            if ($gatewayReceiptVerified -and $gate.result -eq 'command_failed') {
              try {
                $blocked = $gate.stdout | ConvertFrom-Json
                $allowedReasons = @(
                  'docker_target_override_blocked', 'docker_context_unavailable',
                  'docker_context_not_local_dev', 'docker_read_unavailable',
                  'docker_read_failed', 'docker_read_too_large',
                  'container_inventory_invalid', 'container_metadata_invalid',
                  'non_dev_or_unexpected_target', 'container_state_invalid',
                  'container_health_invalid', 'container_counters_invalid',
                  'container_oom_flag_invalid', 'environment_must_be_dev',
                  'expected_sha_invalid', 'host_not_allowed',
                  'dev_api_8210_not_unique', 'dev_api_identity_invalid',
                  'dev_service_not_unique', 'api_identity_changed',
                  'container_identity_changed'
                )
                if ($blocked.status -eq 'blocked' -and
                    $blocked.runtime_mutated -eq $false -and
                    $allowedReasons -contains [string]$blocked.reason) {
                  $reasonCode = [string]$blocked.reason
                }
              } catch {
                $reasonCode = 'inventory_payload_invalid'
              }
            }
            Write-SanitizedInventoryReceipt 'inventory_blocked' $reasonCode $gatewayReceiptVerified $false
            throw 'PUBLIC_DEV_INVENTORY_GATEWAY_BLOCKED'
          }
          if ($gate.result -ne 'ok' -or $gate.command_exit_code -ne 0 -or
              $gate.state_changed -ne $false -or $gate.session_id -ne $env:SESSION_ID) {
            Write-SanitizedInventoryReceipt 'inventory_blocked' 'inventory_gateway_not_verified' $false $false
            throw 'PUBLIC_DEV_INVENTORY_GATEWAY_NOT_VERIFIED'
          }
          try { $inventory = $gate.stdout | ConvertFrom-Json } catch {
            Write-SanitizedInventoryReceipt 'inventory_blocked' 'inventory_payload_invalid' $true $false
            throw 'PUBLIC_DEV_INVENTORY_INVALID'
          }
          if ($inventory.status -ne 'diagnostic_collected' -or
              $inventory.environment -ne 'dev' -or
              $inventory.expected_sha -ne '${{ github.sha }}' -or
              $inventory.runtime_mutated -ne $false -or
              $inventory.production_touched -ne $false -or
              $inventory.runtime_sha_verified -ne $false -or
              $inventory.runtime_readiness_verified -ne $false) {
            Write-SanitizedInventoryReceipt 'inventory_blocked' 'inventory_contract_invalid' $true $false
            throw 'PUBLIC_DEV_INVENTORY_CONTRACT_INVALID'
          }
          # Never upload raw Docker metadata, stdout/stderr, paths or credentials.
          Write-SanitizedInventoryReceipt 'preflight_only' 'cutover_backup_rollback_risk3_not_attested' $true $true

      - name: Prepare protected PostgreSQL backup and image rollback
        id: recovery
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          GATEWAY_PYTHON: ${{ steps.session.outputs.gateway_python }}
          AUTHORIZATION_COMMENT_ID: ${{ inputs.authorization_comment_id }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:TARGET_PATH -or -not $env:SESSION_ID -or -not $env:GATEWAY_PYTHON) {
            throw 'PUBLIC_DEV_RECOVERY_SESSION_MISSING'
          }
          $ownerGateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\owner_risk3_gateway.py'
          $authorizer = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\set_owner_risk3_action.py'
          $script = Join-Path $env:TARGET_PATH 'scripts\pc24x7_public_dev_cutover_guard.py'
          $runtimeRoot = $env:REQSYS_DEV_RUNTIME_ROOT
          $manifest = Join-Path $runtimeRoot ('.reqsys-recovery\public-dev-' + $env:CORRELATION_ID + '.manifest.json')
          $receiptFile = Join-Path $runtimeRoot ('artifacts\pc24x7-public-dev\cutover-prepare-' + $env:CORRELATION_ID + '.json')
          $scope = 'repo://reqsys/environment/dev/runner-pool/reqsys-dev-pool-v1'
          $commandArgs = @(
            'prepare',
            '--expected-sha', '${{ github.sha }}', '--correlation-id', $env:CORRELATION_ID,
            '--manifest', $manifest, '--receipt-file', $receiptFile,
            '--confirm', 'PREPARE-PC24X7-PUBLIC-DEV-CUTOVER'
          )
          $authorizeArgv = @(
            '--action-id', 'reqsys.pc24x7.public_dev.cutover.prepare',
            '--scope', $scope, '--environment', 'dev',
            '--repo-root', $env:TARGET_PATH, '--expected-head', '${{ github.sha }}',
            '--script', $script, '--expires-minutes', '45',
            '--authorization-ref', "issue-comment:$env:AUTHORIZATION_COMMENT_ID:sha:${{ github.sha }}",
            '--confirm', 'AUTHORIZE-SPECIFIC-RISK3-ACTION'
          )
          foreach ($item in $commandArgs) { $authorizeArgv += ("--arg=" + $item) }
          $authorizationRaw = (& $env:GATEWAY_PYTHON $authorizer @authorizeArgv | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_DEV_RECOVERY_AUTHORIZATION_BLOCKED' }
          try { $authorization = $authorizationRaw | ConvertFrom-Json } catch {
            throw 'PUBLIC_DEV_RECOVERY_AUTHORIZATION_INVALID'
          }
          $expiresAt = [DateTimeOffset]::Parse($authorization.expires_at).ToUniversalTime()
          $remaining = $expiresAt - [DateTimeOffset]::UtcNow
          if ($authorization.status -ne 'authorized' -or
              $authorization.action_id -ne 'reqsys.pc24x7.public_dev.cutover.prepare' -or
              $authorization.environment -ne 'dev' -or
              $authorization.git_head -ne '${{ github.sha }}' -or
              $authorization.broad_development_mode_changed -ne $false -or
              $remaining.TotalMinutes -le 0 -or $remaining.TotalMinutes -gt 46) {
            throw 'PUBLIC_DEV_RECOVERY_AUTHORIZATION_INVALID'
          }
          $ownerArgv = @(
            '--action-id', 'reqsys.pc24x7.public_dev.cutover.prepare',
            '--scope', $scope,
            '--cwd', $env:TARGET_PATH, '--timeout', '900',
            '--correlation-id', $env:CORRELATION_ID
          )
          & $env:GATEWAY_PYTHON $ownerGateway @ownerArgv
          $gatewayExit = $LASTEXITCODE
          if ($gatewayExit -ne 0) {
            $reasonCode = 'prepare_failure_receipt_missing_or_invalid'
            $scopeDiagnosticCode = 'not_applicable'
            $allowedFailureReasons = @(
              'request_contract_invalid',
              'runtime_scope_invalid',
              'governed_dependency_failed',
              'runtime_metadata_invalid',
              'runtime_container_cardinality_invalid',
              'live_runtime_health_invalid',
              'recovery_source_invalid',
              'rollback_image_prepare_failed',
              'database_identity_invalid',
              'database_snapshot_invalid',
              'database_backup_failed',
              'isolated_restore_failed',
              'backup_protection_failed',
              'private_recovery_storage_failed',
              'cutover_failure_unclassified'
            )
            $expectedKeys = @(
              'status', 'reason_code', 'scope_diagnostic_code', 'backup_verified',
              'isolated_restore_verified', 'rollback_images_prepared',
              'production_touched'
            )
            $allowedScopeDiagnosticCodes = @(
              'runner_identity_refused',
              'runtime_root_invalid',
              'root_reparse_refused',
              'external_path_refused',
              'external_source_parent_refused',
              'external_compose_not_allowlisted',
              'external_source_scope_refused',
              'external_source_file_refused',
              'external_source_root_ambiguous',
              'external_environment_scope_refused',
              'external_snapshot_scope_refused',
              'external_snapshot_dir_refused',
              'traversal_refused',
              'link_refused',
              'non_file_refused',
              'compose_identity_mismatch',
              'working_dir_mismatch',
              'database_working_dir_invalid',
              'database_working_dir_mismatch',
              'not_applicable'
            )
            try {
              $blocked = Get-Content -LiteralPath $receiptFile -Raw -Encoding UTF8 | ConvertFrom-Json
              $actualKeys = @($blocked.PSObject.Properties.Name)
              $unexpectedKeys = @($actualKeys | Where-Object { $expectedKeys -notcontains $_ })
              if ($actualKeys.Count -ne $expectedKeys.Count -or $unexpectedKeys.Count -ne 0 -or
                  $blocked.status -ne 'blocked' -or $blocked.reason_code -isnot [string] -or
                  $allowedFailureReasons -notcontains [string]$blocked.reason_code -or
                  $blocked.scope_diagnostic_code -isnot [string] -or
                  $allowedScopeDiagnosticCodes -notcontains [string]$blocked.scope_diagnostic_code -or
                  ($blocked.reason_code -eq 'runtime_scope_invalid' -and
                    $blocked.scope_diagnostic_code -eq 'not_applicable') -or
                  ($blocked.reason_code -ne 'runtime_scope_invalid' -and
                    $blocked.scope_diagnostic_code -ne 'not_applicable') -or
                  $blocked.backup_verified -isnot [bool] -or $blocked.backup_verified -ne $false -or
                  $blocked.isolated_restore_verified -isnot [bool] -or
                  $blocked.isolated_restore_verified -ne $false -or
                  $blocked.rollback_images_prepared -isnot [bool] -or
                  $blocked.rollback_images_prepared -ne $false -or
                  $blocked.production_touched -isnot [bool] -or
                  $blocked.production_touched -ne $false) {
                throw 'PUBLIC_DEV_RECOVERY_FAILURE_RECEIPT_INVALID'
              }
              $reasonCode = [string]$blocked.reason_code
              $scopeDiagnosticCode = [string]$blocked.scope_diagnostic_code
            } catch {
              $reasonCode = 'prepare_failure_receipt_missing_or_invalid'
              $scopeDiagnosticCode = 'not_applicable'
            }
            $evidenceFile = Join-Path $env:GITHUB_WORKSPACE 'artifacts\pc24x7-public-dev\evidence.json'
            $evidenceDirectory = Split-Path -Parent $evidenceFile
            $directoryItem = Get-Item -LiteralPath $evidenceDirectory -Force
            $evidenceItem = Get-Item -LiteralPath $evidenceFile -Force
            if ((($directoryItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0) -or
                $evidenceItem.PSIsContainer -or
                (($evidenceItem.Attributes -band [IO.FileAttributes]::ReparsePoint) -ne 0)) {
              throw 'PUBLIC_DEV_RECOVERY_EVIDENCE_PATH_INVALID'
            }
            $publicEvidence = [ordered]@{
              status = 'preflight_only'
              reason_code = $reasonCode
              scope_diagnostic_code = $scopeDiagnosticCode
              runner_instance_id = $env:REQSYS_DEV_RUNNER_INSTANCE_ID
              environment = 'dev'
              source_sha = '${{ github.sha }}'
              correlation_id = $env:CORRELATION_ID
              session_validated = $true
              command_gateway_verified = $true
              inventory_collected = $true
              runtime_sha_verified = $false
              database_result = 'unverified'
              backup_verified = $false
              rollback_rehearsal_verified = $false
              deployment_performed = $false
              runtime_mutated = $false
              production_touched = $false
            }
            $json = $publicEvidence | ConvertTo-Json -Compress
            $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
            [IO.File]::WriteAllText($evidenceFile, $json + [Environment]::NewLine, $utf8NoBom)
            throw 'PUBLIC_DEV_RECOVERY_PREPARE_BLOCKED'
          }
          try { $receipt = Get-Content -LiteralPath $receiptFile -Raw -Encoding UTF8 | ConvertFrom-Json } catch { throw 'PUBLIC_DEV_RECOVERY_RECEIPT_INVALID' }
          if ($receipt.status -ne 'prepared' -or $receipt.backup_verified -ne $true -or
              $receipt.isolated_restore_verified -ne $true -or
              $receipt.rollback_images_prepared -ne $true -or
              $receipt.production_touched -ne $false -or
              $receipt.fingerprint -notmatch '^[0-9a-f]{64}$') {
            throw 'PUBLIC_DEV_RECOVERY_CONTRACT_INVALID'
          }
          "manifest_path=$manifest" | Add-Content $env:GITHUB_OUTPUT
          "fingerprint=$($receipt.fingerprint)" | Add-Content $env:GITHUB_OUTPUT

      - name: Authorize exact remaining public DEV Risk3 actions
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          GATEWAY_PYTHON: ${{ steps.session.outputs.gateway_python }}
          AUTHORIZATION_COMMENT_ID: ${{ inputs.authorization_comment_id }}
          CUTOVER_MANIFEST: ${{ steps.recovery.outputs.manifest_path }}
          CUTOVER_FINGERPRINT: ${{ steps.recovery.outputs.fingerprint }}
          PUBLIC_DEV_CORRELATION_ID: pc24x7-public-dev-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $authorizer = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\set_owner_risk3_action.py'
          $scope = 'repo://reqsys/environment/dev/runner-pool/reqsys-dev-pool-v1'
          $runtimeRoot = $env:REQSYS_DEV_RUNTIME_ROOT
          $evidence = Join-Path $env:TARGET_PATH 'artifacts\pc24x7-public-dev\evidence.json'
          $rollbackReceipt = Join-Path $runtimeRoot ('artifacts\pc24x7-public-dev\cutover-rollback-' + $env:CORRELATION_ID + '.json')

          function Grant-SpecificRisk3Action {
            param(
              [Parameter(Mandatory = $true)][string]$ActionId,
              [Parameter(Mandatory = $true)][string]$Script,
              [Parameter(Mandatory = $true)][AllowEmptyCollection()][string[]]$CommandArgs
            )
            $authorizeArgv = @(
              '--action-id', $ActionId, '--scope', $scope, '--environment', 'dev',
              '--repo-root', $env:TARGET_PATH, '--expected-head', '${{ github.sha }}',
              '--script', $Script, '--expires-minutes', '45',
              '--authorization-ref', "issue-comment:$env:AUTHORIZATION_COMMENT_ID:sha:${{ github.sha }}",
              '--confirm', 'AUTHORIZE-SPECIFIC-RISK3-ACTION'
            )
            foreach ($item in $CommandArgs) { $authorizeArgv += ("--arg=" + $item) }
            $authorizationRaw = (& $env:GATEWAY_PYTHON $authorizer @authorizeArgv | Out-String).Trim()
            if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_DEV_RISK3_AUTHORIZATION_BLOCKED' }
            try { $authorization = $authorizationRaw | ConvertFrom-Json } catch {
              throw 'PUBLIC_DEV_RISK3_AUTHORIZATION_INVALID'
            }
            $expiresAt = [DateTimeOffset]::Parse($authorization.expires_at).ToUniversalTime()
            $remaining = $expiresAt - [DateTimeOffset]::UtcNow
            if ($authorization.status -ne 'authorized' -or
                $authorization.action_id -ne $ActionId -or
                $authorization.environment -ne 'dev' -or
                $authorization.git_head -ne '${{ github.sha }}' -or
                $authorization.broad_development_mode_changed -ne $false -or
                $remaining.TotalMinutes -le 0 -or $remaining.TotalMinutes -gt 46) {
              throw 'PUBLIC_DEV_RISK3_AUTHORIZATION_INVALID'
            }
          }

          $cutoverScript = Join-Path $env:TARGET_PATH 'scripts\pc24x7_public_dev_cutover_guard.py'
          $reconcileScript = Join-Path $env:TARGET_PATH 'scripts\reconcile_pc24x7_public_dev_runtime.py'
          $tunnelScript = Join-Path $env:TARGET_PATH 'scripts\pc24x7_public_dev_tunnel.py'
          $locatorScript = Join-Path $env:TARGET_PATH 'scripts\pc24x7_dev_locator_publisher.py'
          Grant-SpecificRisk3Action -ActionId 'reqsys.pc24x7.public_dev.runtime.reconcile' -Script $reconcileScript -CommandArgs @(
            '--confirm', 'RECONCILE-PC24X7-PUBLIC-DEV', '--environment', 'dev',
            '--expected-sha', '${{ github.sha }}', '--vault-name', $env:REQSYS_KEY_VAULT_NAME,
            '--expected-tenant-id', $env:CCP_AZURE_TENANT_ID,
            '--correlation-id', $env:PUBLIC_DEV_CORRELATION_ID, '--evidence-file', $evidence,
            '--cutover-manifest', $env:CUTOVER_MANIFEST,
            '--cutover-fingerprint', $env:CUTOVER_FINGERPRINT
          )
          Grant-SpecificRisk3Action -ActionId 'reqsys.pc24x7.public_dev.cutover.rollback' -Script $cutoverScript -CommandArgs @(
            'rollback', '--expected-sha', '${{ github.sha }}', '--correlation-id', $env:CORRELATION_ID,
            '--manifest', $env:CUTOVER_MANIFEST, '--expected-fingerprint', $env:CUTOVER_FINGERPRINT,
            '--receipt-file', $rollbackReceipt,
            '--confirm', 'ROLLBACK-PC24X7-PUBLIC-DEV-CUTOVER'
          )
          Grant-SpecificRisk3Action -ActionId 'reqsys.pc24x7.public_dev.tunnel.reconcile' -Script $tunnelScript -CommandArgs @('--apply')
          Grant-SpecificRisk3Action -ActionId 'reqsys.pc24x7.public_dev.locator.publish' -Script $locatorScript -CommandArgs @()

      - name: Validate public static reconciler syntax
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          python -m py_compile scripts/reconcile_pc24x7_public_dev_runtime.py scripts/pc24x7_public_dev_cutover_guard.py scripts/dev_runtime_recovery.py scripts/provision_pc24x7_teams_bot_runtime.py scripts/pc24x7_dev_runtime_supervisor.py scripts/pc24x7_public_dev_tunnel.py scripts/pc24x7_dev_locator_publisher.py

      - name: Validate governed Azure OIDC configuration
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static'
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('REQSYS_KEY_VAULT_NAME','CCP_AZURE_CLIENT_ID','CCP_AZURE_TENANT_ID','CCP_AZURE_SUBSCRIPTION_ID')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "$name missing; public DEV reconciliation remains fail-closed"
            }
          }

      - name: Login Azure by OIDC for DEV credential reuse
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static'
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v2
        with:
          client-id: ${{ env.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ env.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ env.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Reconcile full DEV runtime and static frontend
        id: deploy
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          GATEWAY_PYTHON: ${{ steps.session.outputs.gateway_python }}
          CUTOVER_MANIFEST: ${{ steps.recovery.outputs.manifest_path }}
          CUTOVER_FINGERPRINT: ${{ steps.recovery.outputs.fingerprint }}
          PUBLIC_DEV_CORRELATION_ID: pc24x7-public-dev-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ownerGateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\owner_risk3_gateway.py'
          $evidence = Join-Path $env:TARGET_PATH 'artifacts\pc24x7-public-dev\evidence.json'
          $ownerArgv = @(
            '--action-id', 'reqsys.pc24x7.public_dev.runtime.reconcile',
            '--scope', 'repo://reqsys/environment/dev/runner-pool/reqsys-dev-pool-v1',
            '--cwd', $env:TARGET_PATH, '--timeout', '900',
            '--correlation-id', $env:PUBLIC_DEV_CORRELATION_ID
          )
          & $env:GATEWAY_PYTHON $ownerGateway @ownerArgv
          if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_DEV_RECONCILE_BLOCKED' }
          try { $receipt = Get-Content -LiteralPath $evidence -Raw -Encoding UTF8 | ConvertFrom-Json } catch { throw 'PUBLIC_DEV_RECONCILE_RECEIPT_INVALID' }
          if ($receipt.status -ne 'ready' -or $receipt.environment -ne 'dev' -or
              $receipt.runtime.build_sha -ne '${{ github.sha }}' -or
              $receipt.backup_verified -ne $true -or
              $receipt.isolated_restore_verified -ne $true -or
              $receipt.rollback_images_prepared -ne $true -or
              $receipt.production_touched -ne $false) {
            throw 'PUBLIC_DEV_RECONCILE_CONTRACT_INVALID'
          }
          $publicEvidence = Join-Path $env:GITHUB_WORKSPACE 'artifacts\pc24x7-public-dev\evidence.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $publicEvidence) | Out-Null
          Copy-Item -LiteralPath $evidence -Destination $publicEvidence -Force

      - name: Roll back DEV images after failed cutover
        if: always() && steps.deploy.outcome == 'failure' && github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static' && steps.recovery.outputs.fingerprint != ''
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          GATEWAY_PYTHON: ${{ steps.session.outputs.gateway_python }}
          CUTOVER_MANIFEST: ${{ steps.recovery.outputs.manifest_path }}
          CUTOVER_FINGERPRINT: ${{ steps.recovery.outputs.fingerprint }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ownerGateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\owner_risk3_gateway.py'
          $runtimeRoot = $env:REQSYS_DEV_RUNTIME_ROOT
          $receiptFile = Join-Path $runtimeRoot ('artifacts\pc24x7-public-dev\cutover-rollback-' + $env:CORRELATION_ID + '.json')
          $ownerArgv = @(
            '--action-id', 'reqsys.pc24x7.public_dev.cutover.rollback',
            '--scope', 'repo://reqsys/environment/dev/runner-pool/reqsys-dev-pool-v1',
            '--cwd', $env:TARGET_PATH, '--timeout', '600',
            '--correlation-id', $env:CORRELATION_ID
          )
          & $env:GATEWAY_PYTHON $ownerGateway @ownerArgv
          $gatewayExit = $LASTEXITCODE
          $rollbackOk = $false
          if ($gatewayExit -eq 0) {
            try {
              $receipt = Get-Content -LiteralPath $receiptFile -Raw -Encoding UTF8 | ConvertFrom-Json
              $rollbackOk = ($receipt.rollback_ok -eq $true -and $receipt.database_unchanged -eq $true -and
                $receipt.production_touched -eq $false)
            } catch { $rollbackOk = $false }
          }
          $publicEvidence = Join-Path $env:GITHUB_WORKSPACE 'artifacts\pc24x7-public-dev\evidence.json'
          New-Item -ItemType Directory -Force -Path (Split-Path -Parent $publicEvidence) | Out-Null
          $sanitized = [ordered]@{
            status = $(if ($rollbackOk) { 'deploy_failed_rollback_completed' } else { 'deploy_failed_rollback_unverified' })
            environment = 'dev'; source_sha = '${{ github.sha }}'; correlation_id = $env:CORRELATION_ID
            backup_verified = $true; isolated_restore_verified = $true
            rollback_verified = $rollbackOk; production_touched = $false
          }
          [System.IO.File]::WriteAllText($publicEvidence, (($sanitized | ConvertTo-Json) + [Environment]::NewLine), [System.Text.UTF8Encoding]::new($false))
          if (-not $rollbackOk) { throw 'PUBLIC_DEV_ROLLBACK_NOT_VERIFIED' }

      - name: Reconcile public tunnels and publish signed locator
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          GATEWAY_PYTHON: ${{ steps.session.outputs.gateway_python }}
        run: |
          $ErrorActionPreference = 'Stop'
          $ownerGateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\owner_risk3_gateway.py'
          foreach ($actionId in @(
            'reqsys.pc24x7.public_dev.tunnel.reconcile',
            'reqsys.pc24x7.public_dev.locator.publish'
          )) {
            $ownerArgv = @(
              '--action-id', $actionId,
              '--scope', 'repo://reqsys/environment/dev/runner-pool/reqsys-dev-pool-v1',
              '--cwd', $env:TARGET_PATH, '--timeout', '180',
              '--correlation-id', $env:CORRELATION_ID
            )
            & $env:GATEWAY_PYTHON $ownerGateway @ownerArgv
            if ($LASTEXITCODE -ne 0) { throw 'PUBLIC_DEV_LOCATOR_GATEWAY_BLOCKED' }
          }

      - name: Upload public DEV physical evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: pc24x7-public-dev-${{ github.run_id }}
          path: artifacts/pc24x7-public-dev/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Recover and validate Engineering Orchestrator DEV
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'study-mode'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          GATEWAY_PYTHON: ${{ steps.session.outputs.gateway_python }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SESSION_ID -or -not $env:TARGET_PATH) { throw 'SESSION_REQUIRED' }
          $gateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $script = Join-Path $env:TARGET_PATH 'scripts\recover_reqsys_engineering_orchestrator_dev.py'
          $argv = @(
            '--policy', $policy, '--correlation-id', $env:CORRELATION_ID,
            'run', '--cwd', $env:TARGET_PATH, '--session-id', $env:SESSION_ID,
            '--risk', '2', '--timeout', '180', '--expected-head', '${{ github.sha }}',
            '--', 'python', $script,
            '--confirm', 'RECOVER-REQSYS-ENGINEERING-ORCHESTRATOR-DEV',
            '--evidence-path', 'artifacts/noteri-study-mode-dev/orchestrator-recovery.json',
            '--timeout-seconds', '60'
          )
          & $env:GATEWAY_PYTHON $gateway @argv
          if ($LASTEXITCODE -ne 0) { throw 'GOVERNED_ORCHESTRATOR_RECOVERY_FAILED' }

      - name: Reconcile same-origin Study Mode and execute physical E2E
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'study-mode'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          GATEWAY_PYTHON: ${{ steps.session.outputs.gateway_python }}
          REQSYS_NOTERI_DEV_MSAL_STATE_B64: ${{ secrets.REQSYS_NOTERI_DEV_MSAL_STATE_B64 }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SESSION_ID -or -not $env:TARGET_PATH) { throw 'SESSION_REQUIRED' }
          if ([string]::IsNullOrWhiteSpace($env:REQSYS_NOTERI_DEV_MSAL_STATE_B64)) {
            throw 'NOTERI_DEV_MSAL_TEST_IDENTITY_NOT_PROVISIONED'
          }
          $gateway = Join-Path $env:GITHUB_WORKSPACE '_rules\scripts\command_gateway.py'
          $policy = Join-Path $env:GITHUB_WORKSPACE '_rules\config\command-gateway.policy.json'
          $script = Join-Path $env:TARGET_PATH 'scripts\noteri_study_mode_pages_e2e.py'
          $argv = @(
            '--policy', $policy, '--correlation-id', $env:CORRELATION_ID,
            'run', '--cwd', $env:TARGET_PATH, '--session-id', $env:SESSION_ID,
            '--risk', '2', '--timeout', '750', '--expected-head', '${{ github.sha }}',
            '--', 'python', $script,
            '--repo-root', $env:TARGET_PATH,
            '--expected-sha', '${{ github.sha }}',
            '--confirm', 'RECONCILE-NOTERI-STUDY-MODE-DEV',
            '--correlation-id', $env:CORRELATION_ID,
            '--evidence-path', 'artifacts/noteri-study-mode-dev/evidence.json'
          )
          & $env:GATEWAY_PYTHON $gateway @argv
          if ($LASTEXITCODE -ne 0) { throw 'GOVERNED_NOTERI_PAGES_E2E_FAILED' }

      - name: Validate sanitized evidence
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'study-mode'
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
        run: |
          $ErrorActionPreference = 'Stop'
          $path = Join-Path $env:TARGET_PATH 'artifacts\noteri-study-mode-dev\evidence.json'
          if (-not (Test-Path -LiteralPath $path)) { throw 'NOTERI_E2E_EVIDENCE_MISSING' }
          $e = Get-Content -LiteralPath $path -Raw -Encoding UTF8 | ConvertFrom-Json
          if ($e.ok -ne $true -or $e.environment -ne 'dev' -or
              $e.runner_instance_id -ne $env:REQSYS_DEV_RUNNER_INSTANCE_ID) {
            throw 'NOTERI_E2E_EVIDENCE_INVALID'
          }
          if ($e.source_sha -ne '${{ github.sha }}' -or $e.runtime_sha -ne '${{ github.sha }}') {
            throw 'NOTERI_E2E_SHA_MISMATCH'
          }
          if ($e.production_touched -or $e.credentials_exposed) { throw 'NOTERI_E2E_SAFETY_INVALID' }
          if ($e.browser_e2e.msal_backend_session_verified -ne $true) { throw 'MSAL_BACKEND_SESSION_NOT_VERIFIED' }
          if ($e.browser_e2e.negative_401_and_409 -ne $true) { throw 'NEGATIVE_CONTROLS_NOT_VERIFIED' }
          if ($e.browser_e2e.ui_and_worker_estudo -ne $true) { throw 'ESTUDO_READBACK_NOT_VERIFIED' }
          if ($e.browser_e2e.replay_idempotent -ne $true) { throw 'REPLAY_NOT_IDEMPOTENT' }
          if ($e.browser_e2e.normal_restored -ne $true -or $e.browser_e2e.final_profile -ne 'NORMAL') {
            throw 'NORMAL_RESTORATION_NOT_VERIFIED'
          }

      - name: Upload runtime evidence
        if: always() && github.event_name == 'workflow_dispatch' && inputs.mode == 'study-mode' && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: noteri-study-mode-dev-evidence-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}/artifacts/noteri-study-mode-dev/
          if-no-files-found: error
          retention-days: 14

  public-smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'public-static'
    needs: reconcile
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v4.4.0
        with:
          node-version: '20'

      - name: Resolve signed locator
        id: locator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/pc24x7-public-dev
          node scripts/resolve_pc24x7_dev_locator.mjs --output artifacts/pc24x7-public-dev/locator.json

      - name: Independent public same-SHA smoke
        shell: bash
        env:
          BASE_URL: ${{ steps.locator.outputs.base_url }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, re, time
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = os.environ["BASE_URL"].rstrip("/")
          expected = os.environ["EXPECTED_SHA"].lower()

          def get(path, timeout=20):
              started = time.monotonic()
              request = Request(base + path, headers={"User-Agent": "ReqSysPublicDevSmoke/1.0", "Accept": "*/*"})
              try:
                  with urlopen(request, timeout=timeout) as response:
                      body = response.read(524288).decode("utf-8", errors="replace")
                      return response.status, body, round((time.monotonic()-started)*1000, 2)
              except HTTPError as exc:
                  return exc.code, exc.read(524288).decode("utf-8", errors="replace"), round((time.monotonic()-started)*1000, 2)

          evidence = {"environment": "dev", "expected_sha": expected}
          for path in ("/api/health", "/api/runtime/health", "/api/runtime/readiness", "/api/runtime/build-info"):
              status, body, latency = get(path)
              if status != 200:
                  raise SystemExit(f"{path}: HTTP {status}")
              evidence[path] = {"http": status, "latency_ms": latency}
              if path == "/api/runtime/build-info":
                  payload = json.loads(body)
                  data = payload.get("data", payload)
                  observed = str(data.get("build_sha") or "").lower()
                  if observed != expected:
                      raise SystemExit("build_sha_mismatch")
                  evidence["observed_sha"] = observed

          status, html, latency = get("/task-console")
          if status != 200 or "/assets/" not in html or "/src/main.js" in html:
              raise SystemExit("frontend_not_static")
          vite_status, _, _ = get("/@vite/client")
          if vite_status != 404:
              raise SystemExit("vite_hmr_exposed")
          asset = re.search(r'(?:src|href)="([^"]*/assets/[^"]+)"', html)
          if not asset:
              raise SystemExit("static_asset_not_found")
          asset_status, _, asset_latency = get(asset.group(1))
          if asset_status != 200:
              raise SystemExit("static_asset_unavailable")

          evidence["frontend"] = {
              "http": status,
              "latency_ms": latency,
              "vite_client_http": vite_status,
              "asset_http": asset_status,
              "asset_latency_ms": asset_latency,
              "mode": "static_nginx",
          }
          evidence["production_touched"] = False
          with open("artifacts/pc24x7-public-dev/public-smoke.json", "w", encoding="utf-8") as fh:
              json.dump(evidence, fh, ensure_ascii=False, indent=2)
              fh.write("\n")
          print(json.dumps(evidence, ensure_ascii=False, sort_keys=True))
          PY

      - name: Upload independent public smoke
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: pc24x7-public-dev-smoke-${{ github.run_id }}
          path: artifacts/pc24x7-public-dev/
          if-no-files-found: error
          retention-days: 30

