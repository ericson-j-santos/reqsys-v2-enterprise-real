name: Environments Readiness

on:
  pull_request:
    paths:
      - scripts/validate_environments_readiness.py
      - scripts/runtime_url_policy.py
      - tests/test_validate_environments_readiness.py
      - docs/ops-dashboard/data/environments-validation.json
      - .github/workflows/environments-readiness.yml
  workflow_dispatch:
    inputs:
      dev_frontend_url:
        description: URL HTTPS explícita do frontend DEV
        required: true
        type: string
      dev_api_url:
        description: URL HTTPS explícita da API DEV
        required: true
        type: string
      hml_frontend_url:
        description: URL HTTPS explícita do frontend HML
        required: true
        type: string
      hml_api_url:
        description: URL HTTPS explícita da API HML
        required: true
        type: string
      prod_frontend_url:
        description: URL HTTPS explícita do frontend PROD
        required: true
        type: string
      prod_api_url:
        description: URL HTTPS explícita da API PROD
        required: true
        type: string

permissions:
  contents: read

env:
  PYTHONPATH: ${{ github.workspace }}

concurrency:
  group: environments-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-environments:
    name: Validate all environments readiness
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validate script syntax
        run: python -m py_compile scripts/validate_environments_readiness.py

      - name: Install test dependencies
        run: python -m pip install pytest

      - name: Run unit tests
        run: python -m pytest tests/test_validate_environments_readiness.py

      - name: Generate environments readiness evidence
        if: github.event_name == 'workflow_dispatch'
        env:
          DEV_FRONTEND_URL: ${{ inputs.dev_frontend_url }}
          DEV_API_URL: ${{ inputs.dev_api_url }}
          HML_FRONTEND_URL: ${{ inputs.hml_frontend_url }}
          HML_API_URL: ${{ inputs.hml_api_url }}
          PROD_FRONTEND_URL: ${{ inputs.prod_frontend_url }}
          PROD_API_URL: ${{ inputs.prod_api_url }}
        run: |
          python scripts/validate_environments_readiness.py \
            --timeout-seconds 5 \
            --environment "dev=${DEV_FRONTEND_URL},${DEV_API_URL}" \
            --environment "hml=${HML_FRONTEND_URL},${HML_API_URL}" \
            --environment "prod=${PROD_FRONTEND_URL},${PROD_API_URL}" \
            --output docs/ops-dashboard/data/environments-validation.json

      - name: Upload environments validation artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: environments-validation
          path: docs/ops-dashboard/data/environments-validation.json
          if-no-files-found: error
          retention-days: 15
