name: Runtime Operational Contract

on:
  pull_request:
    paths:
      - 'docs/contracts/runtime-operational-contract-v1.json'
      - 'docs/runbooks/runtime-operational-contract-v1.md'
      - 'scripts/validate_runtime_operational_contract.py'
      - 'runtime/scripts/e2e_central.py'
      - 'runtime/scripts/e2e_platform_central_pilot.py'
      - 'runtime/tests/test_e2e_platform_central_pilot.py'
      - '.sdd/specs/e2e-platform-central-pilot.spec.json'
      - '.sdd/specs/e2e-platform-central-pilot.requirements.md'
      - '.github/workflows/runtime-operational-contract.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  validate-runtime-operational-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Validate runtime operational contract
        run: python3 scripts/validate_runtime_operational_contract.py

      - name: Validate E2E platform adapter contract
        run: python3 -m unittest discover -s runtime/tests -p 'test_e2e_platform_central_pilot.py' -v

  central-e2e:
    name: Central Global E2E real
    needs: validate-runtime-operational-contract
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: runtime/requirements.txt

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r runtime/requirements.txt

      - name: Execute Central real and emit standard evidence
        env:
          E2E_CORRELATION_ID: reqsys-central-${{ github.run_id }}-${{ github.run_attempt }}
          E2E_ENVIRONMENT: ci
          E2E_EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python runtime/scripts/e2e_platform_central_pilot.py --output artifacts/e2e-platform/central/evidence.json

      - name: Upload standard E2E evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: central-e2e-evidence
          path: artifacts/e2e-platform/central/
          if-no-files-found: error
          retention-days: 30

  central-e2e-evidence-gate:
    name: E2E Platform Evidence Gate
    needs: central-e2e
    uses: ericson-j-santos/e2e-platform/.github/workflows/e2e-evidence.yml@6ca2bf4e63af918872ab5b2b52485cb4f5f07314
    with:
      artifact_name: central-e2e-evidence
      evidence_file: evidence.json
      platform_ref: 6ca2bf4e63af918872ab5b2b52485cb4f5f07314