name: Integration Excel SQL SharePoint — DEV Readiness

on:
  workflow_dispatch:
    inputs:
      strict:
        description: "Falhar se alguma dependência real estiver indisponível"
        required: true
        type: boolean
        default: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/integration-excel-sql-sharepoint-readiness-dev.yml"
      - "scripts/integration_excel_sql_sharepoint_readiness.py"
      - "tests/test_integration_excel_sql_sharepoint_readiness.py"
      - "backend/app/services/integration_profile_generator.py"
      - "backend/app/services/integration_profile_provisioning.py"
      - "docs/integrations/integration-generator/**"

permissions:
  contents: read

env:
  EVIDENCE_DIR: audit/user-journey/excel-sql-sharepoint-dev

jobs:
  readiness:
    name: Preflight real DEV — Excel SQL SharePoint
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar ODBC e dependências mínimas
        run: |
          set -euo pipefail
          bash .github/scripts/install-unixodbc-ci.sh
          python -m pip install --upgrade pip
          pip install httpx pyodbc pytest

      - name: Validar o próprio preflight
        run: python -m pytest tests/test_integration_excel_sql_sharepoint_readiness.py -q

      - name: Executar preflight real em DEV
        env:
          INTEGRATION_E2E_ENVIRONMENT: dev
          POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
          INTEGRATION_E2E_DRIVE_ID: ${{ vars.INTEGRATION_E2E_DRIVE_ID }}
          INTEGRATION_E2E_FILE_ID: ${{ vars.INTEGRATION_E2E_FILE_ID }}
          INTEGRATION_E2E_SITE_ID: ${{ vars.INTEGRATION_E2E_SITE_ID }}
          INTEGRATION_E2E_LIST_ID: ${{ vars.INTEGRATION_E2E_LIST_ID }}
          INTEGRATION_E2E_SQL_DSN: ${{ secrets.INTEGRATION_E2E_SQL_DSN }}
          INTEGRATION_E2E_SQL_PROCEDURE: ${{ vars.INTEGRATION_E2E_SQL_PROCEDURE }}
          INTEGRATION_E2E_POWER_PLATFORM_ENVIRONMENT_ID: ${{ vars.INTEGRATION_E2E_POWER_PLATFORM_ENVIRONMENT_ID }}
          INTEGRATION_E2E_EXCEL_CONNECTION_ID: ${{ vars.INTEGRATION_E2E_EXCEL_CONNECTION_ID }}
          INTEGRATION_E2E_SQL_CONNECTION_ID: ${{ vars.INTEGRATION_E2E_SQL_CONNECTION_ID }}
          INTEGRATION_E2E_SHAREPOINT_CONNECTION_ID: ${{ vars.INTEGRATION_E2E_SHAREPOINT_CONNECTION_ID }}
          STRICT_REQUESTED: ${{ inputs.strict || 'false' }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          args=(
            --output "$EVIDENCE_DIR/readiness.json"
            --source-sha "$GITHUB_SHA"
            --correlation-id "excel-sql-sharepoint-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          )
          if [ "$STRICT_REQUESTED" = "true" ]; then
            args+=(--strict)
          fi
          python scripts/integration_excel_sql_sharepoint_readiness.py "${args[@]}"

      - name: Publicar evidência de readiness
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: integration-excel-sql-sharepoint-readiness-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/readiness.json
          if-no-files-found: warn
          retention-days: 30
