name: Noteri to Desktop Runner Bootstrap E2E

on:
  workflow_dispatch:
  push:
    branches:
      - "fix/desktop-runner-control-plane-bootstrap-*"
    paths:
      - "scripts/noteri_desktop_runner_bootstrap.py"
      - "scripts/desktop_runner_pickup_evidence.py"
      - "tests/test_noteri_desktop_runner_bootstrap.py"
      - "tests/test_reqsys_authorized_actions_gateway.py"
      - ".github/workflows/noteri-desktop-runner-bootstrap.yml"
      - ".github/workflows/reqsys-authorized-actions-gateway.yml"
      - ".github/self-hosted-runner-policy.json"

permissions:
  contents: read

concurrency:
  group: noteri-desktop-runner-bootstrap-${{ github.ref }}
  cancel-in-progress: true

env:
  RULES_SHA: 881d9ca2f8e77025edb7298b22981109c567a730
  ORCHESTRATOR_SHA: 4dbc927595a40fc2fd6b207c0d53fd6e895049ae
  CORRELATION_ID: desktop-runner-bootstrap-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  recover:
    name: Refresh control plane and bootstrap registered runner
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    env:
      TARGET_REPO: ${{ github.workspace }}
      EVIDENCE_FILE: ${{ runner.temp }}\desktop-runner-bootstrap-${{ github.run_id }}.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed Noteri session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $syncRef = "origin/$env:GITHUB_REF_NAME"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "desktop-runner-bootstrap",
            "--correlation-id", $env:CORRELATION_ID,
            "--expected-head", $anchorSha,
            "--sync-ref", $syncRef
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Validate runner recovery contract through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-tests",
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "90",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "pytest",
            "tests/test_noteri_desktop_runner_bootstrap.py",
            "tests/test_reqsys_authorized_actions_gateway.py",
            "-q"
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Recover Desktop runner through typed control plane
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_runner_bootstrap.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2",
            "--timeout", "240",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $script,
            "--confirm", "RECOVER-DESKTOP-GITHUB-RUNNER-VIA-CONTROL-PLANE",
            "--correlation-id", $env:CORRELATION_ID,
            "--evidence-file", $env:EVIDENCE_FILE
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Upload sanitized recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-runner-bootstrap-${{ github.run_id }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: warn
          retention-days: 30

  pickup:
    name: Prove independent GitHub pickup on Desktop
    needs: recover
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 5
    env:
      TARGET_REPO: ${{ github.workspace }}
      EVIDENCE_FILE: ${{ runner.temp }}\desktop-runner-pickup-${{ github.run_id }}.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap mandatory governed Desktop session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $anchorSha = "${{ github.sha }}"
          $syncRef = "origin/$env:GITHUB_REF_NAME"
          $launcherArgs = @(
            "--policy", $policy,
            "--repo", $env:TARGET_REPO,
            "--session-prefix", "desktop-runner-pickup",
            "--correlation-id", "$env:CORRELATION_ID-pickup",
            "--expected-head", $anchorSha,
            "--sync-ref", $syncRef
          )
          $raw = & python $launcher @launcherArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne $anchorSha) { throw "SESSION_HEAD_MISMATCH" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=$anchorSha" | Add-Content $env:GITHUB_OUTPUT

      - name: Prove correct physical runner through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\desktop_runner_pickup_evidence.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-pickup",
            "run",
            "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1",
            "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $script,
            "--confirm", "PROVE-DESKTOP-GITHUB-RUNNER-PICKUP",
            "--correlation-id", "$env:CORRELATION_ID-pickup",
            "--evidence-file", $env:EVIDENCE_FILE
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Upload independent pickup evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-runner-pickup-${{ github.run_id }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 30
