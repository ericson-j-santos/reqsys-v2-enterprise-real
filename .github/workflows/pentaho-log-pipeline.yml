name: Pentaho Log Pipeline

on:
  push:
    paths:
      - "tools/pentaho_log_pipeline/**"
      - "tests/test_pentaho_log_pipeline.py"
      - ".github/workflows/pentaho-log-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test dependency
        run: python -m pip install --disable-pip-version-check pytest

      - name: Compile pipeline
        run: python -m py_compile tools/pentaho_log_pipeline/pipeline.py

      - name: Run focused tests
        run: python -m pytest -q tests/test_pentaho_log_pipeline.py
