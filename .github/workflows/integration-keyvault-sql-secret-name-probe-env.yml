name: Integration Key Vault SQL Secret Name Probe Environment

on:
  push:
    branches:
      - ops/e2e-excel-sql-sharepoint-real-20260911
    paths:
      - ".github/workflows/integration-keyvault-sql-secret-name-probe-env.yml"

permissions:
  contents: read
  id-token: write

jobs:
  probe:
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    steps:
      - name: Validar configuração OIDC sem revelar valores
        shell: bash
        env:
          CCP_AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID }}
          CCP_AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
          CCP_AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          for name in CCP_AZURE_CLIENT_ID CCP_AZURE_TENANT_ID CCP_AZURE_SUBSCRIPTION_ID REQSYS_KEY_VAULT_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "configured=false"
              echo "missing=$name"
              exit 2
            fi
          done
          echo "configured=true"

      - name: Autenticar no Azure por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.CCP_AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Procurar somente nomes candidatos de segredo SQL
        shell: bash
        env:
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          names="$RUNNER_TEMP/secret-names.txt"
          az keyvault secret list --vault-name "$REQSYS_KEY_VAULT_NAME" --query '[].name' -o tsv > "$names"
          python - "$names" <<'PY'
          import re, sys
          from pathlib import Path
          names = [x.strip() for x in Path(sys.argv[1]).read_text().splitlines() if x.strip()]
          candidates = [n for n in names if re.search(r'(sql.*(dsn|connection|conn|string)|(?:dsn|connection|conn|string).*sql)', n, re.I)]
          print('secret_names_total=' + str(len(names)))
          print('sql_candidate_count=' + str(len(candidates)))
          PY
