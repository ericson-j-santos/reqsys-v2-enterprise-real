name: BACEN Access Exception Lifecycle Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/ACCESS-REVIEW-REGISTER.yaml"
      - "scripts/generate_bacen_access_exception_lifecycle_readiness.py"
      - ".github/workflows/bacen-access-exception-lifecycle-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/ACCESS-REVIEW-REGISTER.yaml"
      - "scripts/generate_bacen_access_exception_lifecycle_readiness.py"
      - ".github/workflows/bacen-access-exception-lifecycle-readiness.yml"
  schedule:
    - cron: "53 8 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-access-exception-lifecycle-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-02 Access Exception Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_access_exception_lifecycle_readiness.py

      - name: Generate readiness evidence
        run: |
          python scripts/generate_bacen_access_exception_lifecycle_readiness.py \
            --register governance/bacen/ACCESS-REVIEW-REGISTER.yaml \
            --output artifacts/bacen/bacen-02-access-exception-lifecycle-readiness.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-02-access-exception-lifecycle-readiness.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          assert evidence["control_id"] == "BACEN-02"
          assert evidence["structural_checks_passed"] is True
          assert evidence["declared_open_exceptions"] == 0
          assert evidence["active_exceptions"] == 0
          assert evidence["readiness_status"] == "pending"
          assert evidence["production_touched"] is False
          assert len(evidence["register_sha256"]) == 64
          print("BACEN-02 access exception lifecycle evidence: valid")
          PY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bacen-02-access-exception-lifecycle-readiness
          path: artifacts/bacen/bacen-02-access-exception-lifecycle-readiness.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-02-access-exception-lifecycle-readiness.json")
          print("## BACEN-02 — Ciclo de exceções")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          print(f"\n- Integridade estrutural: **{evidence['structural_checks_passed']}**")
          print(f"- Registro presente: **{evidence['exception_register_present']}**")
          print(f"- Exceções ativas: **{evidence['active_exceptions']}**")
          print(f"- Exceções vencidas: **{evidence['overdue_exceptions']}**")
          print(f"- Prontidão: **{evidence['readiness_status']}**")
          print("- Produção acessada: **false**")
          PY
