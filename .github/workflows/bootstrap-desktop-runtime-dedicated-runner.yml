name: Bootstrap Desktop Runtime Dedicated Runner

on:
  push:
    branches:
      - ops/bootstrap-desktop-runtime-runner-20260923

permissions:
  contents: read

concurrency:
  group: bootstrap-desktop-runtime-dedicated-runner
  cancel-in-progress: false

jobs:
  bootstrap:
    name: Register dedicated desktop runtime runner
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 12
    env:
      GH_TOKEN: ${{ secrets.GH_PAT_ACTIONS }}
      EVIDENCE_FILE: artifacts/desktop-runtime-runner-bootstrap/evidence.json
      TARGET_SHA: 9a367f9a51621ab12cd21ec5176cb1fb0ac082f4
    steps:
      - name: Checkout immutable runtime bootstrap
        uses: actions/checkout@v4
        with:
          repository: ericson-j-santos/desktop-pc24x7-runtime
          ref: 9a367f9a51621ab12cd21ec5176cb1fb0ac082f4
          fetch-depth: 1
          persist-credentials: false
          path: runtime-bootstrap

      - name: Register and start isolated runner
        shell: pwsh
        run: python runtime-bootstrap/scripts/bootstrap_dedicated_runtime_runner.py --confirm BOOTSTRAP-DESKTOP-RUNTIME-RUNNER --source-sha "$env:TARGET_SHA" --evidence-file "$env:EVIDENCE_FILE"

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: desktop-runtime-runner-bootstrap-${{ github.run_id }}
          path: artifacts/desktop-runtime-runner-bootstrap/evidence.json
          if-no-files-found: error
          retention-days: 30
