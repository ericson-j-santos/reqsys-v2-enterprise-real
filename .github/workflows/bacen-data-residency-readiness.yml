name: BACEN Data Residency Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/VENDOR-DPA-READINESS.yaml"
      - "scripts/generate_bacen_data_residency_readiness.py"
      - ".github/workflows/bacen-data-residency-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/VENDOR-DPA-READINESS.yaml"
      - "scripts/generate_bacen_data_residency_readiness.py"
  schedule:
    - cron: "29 8 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check PyYAML
      - run: python -m py_compile scripts/generate_bacen_data_residency_readiness.py
      - run: python scripts/generate_bacen_data_residency_readiness.py --manifest governance/bacen/VENDOR-DPA-READINESS.yaml --output artifacts/bacen/bacen-05-data-residency-readiness.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bacen-05-data-residency-readiness
          path: artifacts/bacen/bacen-05-data-residency-readiness.json
          if-no-files-found: error
          retention-days: 365
