name: Report Factory Fabric FIC Preflight

on:
  push:
    branches:
      - "gap-fix/report-factory-fabric-fic-preflight-*"
    paths:
      - ".github/workflows/report-factory-fabric-fic-preflight.yml"
      - "scripts/report_factory_fabric_fic_preflight.py"
      - "tests/test_report_factory_fabric_fic_preflight.py"
      - ".sdd/specs/report-factory-rdl-mvp.requirements.md"
      - ".sdd/specs/report-factory-rdl-mvp.tasks.md"
      - ".sdd/specs/report-factory-rdl-mvp.spec.json"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-factory-fabric-fic-preflight-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fic-preflight:
    name: report-factory-fabric-fic-preflight
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 8
    env:
      EVIDENCE_FILE: artifacts/report-factory/fabric-fic-preflight.json

    steps:
      - name: Checkout do SHA exato
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Executar preflight somente leitura
        shell: powershell
        run: |
          python scripts/report_factory_fabric_fic_preflight.py --output "$env:EVIDENCE_FILE"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: report-factory-fabric-fic-preflight-${{ github.sha }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 14

      - name: Gate contra falso positivo
        if: always()
        shell: powershell
        run: |
          if (-not (Test-Path $env:EVIDENCE_FILE)) {
            throw "evidence_missing"
          }
          $evidence = Get-Content -Raw $env:EVIDENCE_FILE | ConvertFrom-Json
          if ($evidence.status -ne "ok") { throw "preflight_not_ok" }
          if ($evidence.host_ok -ne $true) { throw "host_not_ok" }
          if ($evidence.tenant_match -ne $true) { throw "tenant_mismatch" }
          if ($evidence.app_exact_count -ne 1) { throw "app_not_unique" }
          if ($evidence.workspace_exact_count -ne 1) { throw "workspace_not_unique" }
          if ($evidence.contributor_or_higher -ne $true) { throw "fabric_role_missing" }
          if ($evidence.mutation_performed -ne $false) { throw "unexpected_mutation" }
          if ($evidence.secret_value_exposed -ne $false) { throw "secret_exposed" }
          if ($evidence.identifiers_exposed -ne $false) { throw "identifier_exposed" }
          Write-Output "fic_ready=$($evidence.fic_ready)"
          Write-Output "fic_exact_count=$($evidence.fic_exact_count)"
          Write-Output "REPORT_FACTORY_FABRIC_FIC_PREFLIGHT_OK"
