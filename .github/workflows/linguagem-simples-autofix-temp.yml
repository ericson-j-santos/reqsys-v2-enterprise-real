name: Linguagem simples - correção temporária

on:
  push:
    branches:
      - feat/linguagem-simples-ptbr-padrao-ouro
    paths:
      - 'frontend/src/**'
      - 'frontend/scripts/fix-user-facing-language.mjs'
      - '.github/workflows/linguagem-simples-autofix-temp.yml'

permissions:
  contents: write

concurrency:
  group: linguagem-simples-autofix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  corrigir:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Obter ramificação
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Aplicar correção controlada
        run: node frontend/scripts/fix-user-facing-language.mjs

      - name: Validar integridade do diff
        run: git diff --check

      - name: Registrar correções na ramificação
        shell: bash
        run: |
          if git diff --quiet -- frontend/src; then
            echo 'Nenhuma correção automática adicional.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src
          git commit -m 'fix(ux): aplica linguagem simples na interface'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Testar verificador
        run: node --test frontend/scripts/validate-user-facing-language.test.mjs

      - name: Medir ocorrências restantes
        run: node frontend/scripts/validate-user-facing-language.mjs
