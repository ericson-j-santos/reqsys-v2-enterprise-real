name: Movimento Email DSN Bootstrap

on:
  workflow_dispatch:
  schedule:
    - cron: '23 11 * * 1-5'

permissions:
  contents: read
  id-token: write
  issues: write

concurrency:
  group: movimento-email-dsn-bootstrap
  cancel-in-progress: false

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
      MOVIMENTO_EMAIL_SQL_SERVER: ${{ vars.MOVIMENTO_EMAIL_SQL_SERVER }}
      MOVIMENTO_EMAIL_SQL_DATABASE: ${{ vars.MOVIMENTO_EMAIL_SQL_DATABASE }}
      MOVIMENTO_EMAIL_SQL_USERNAME_SECRET: ${{ vars.MOVIMENTO_EMAIL_SQL_USERNAME_SECRET }}
      MOVIMENTO_EMAIL_SQL_PASSWORD_SECRET: ${{ vars.MOVIMENTO_EMAIL_SQL_PASSWORD_SECRET }}
      MOVIMENTO_EMAIL_DSN_SECRET_NAME: movimento-email-source-dsn
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Login Azure por OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Instalar dependências SQL
        run: |
          python -m pip install --disable-pip-version-check pyodbc
          sudo ACCEPT_EULA=Y apt-get update
          sudo ACCEPT_EULA=Y apt-get install -y unixodbc-dev

      - name: Montar e armazenar DSN no Key Vault
        id: bootstrap
        shell: bash
        run: |
          set +e
          output="$(python scripts/bootstrap_movimento_email_dsn.py 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$output"
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          if [ "$rc" -eq 0 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Resolver DSN sem expor valor
        if: steps.bootstrap.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          dsn="$(az keyvault secret show --vault-name "$REQSYS_KEY_VAULT_NAME" --name "$MOVIMENTO_EMAIL_DSN_SECRET_NAME" --query value -o tsv)"
          echo "::add-mask::$dsn"
          echo "MOVIMENTO_EMAIL_SOURCE_DSN=$dsn" >> "$GITHUB_ENV"

      - name: Validar conexão e estruturas reais
        if: steps.bootstrap.outputs.ready == 'true'
        run: |
          python scripts/verificar_movimento_email_fontes.py status
          python scripts/verificar_movimento_email_fontes.py verificar

      - name: Atualizar evidência sanitizada na issue 1520
        if: always()
        uses: actions/github-script@v7
        env:
          READY: ${{ steps.bootstrap.outputs.ready }}
          BOOTSTRAP_RC: ${{ steps.bootstrap.outputs.rc }}
        with:
          script: |
            const marker = '<!-- reqsys-movimento-email-dsn-bootstrap -->';
            const ready = process.env.READY === 'true';
            const body = `${marker}\n## Bootstrap automático do DSN — Prospecção Movimento\n\n` +
              `- bootstrap: \`${ready ? 'READY' : 'BLOCKED'}\`;\n` +
              `- DSN armazenado no Key Vault: \`${ready ? 'sim' : 'não'}\`;\n` +
              `- segredo exposto em evidência: \`não\`;\n` +
              `- execução: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}.\n\n` +
              (ready
                ? 'O fluxo avançou para a validação real de conexão/estruturas. A conclusão depende do resultado do verificador.'
                : 'Faltam parâmetros não secretos ou credenciais autorizadas no Key Vault. Nenhuma credencial foi fabricada nem publicada.');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner, repo: context.repo.repo, issue_number: 1520, per_page: 100
            });
            const previous = comments.find(c => c.body && c.body.includes(marker));
            if (previous) {
              await github.rest.issues.updateComment({owner: context.repo.owner, repo: context.repo.repo, comment_id: previous.id, body});
            } else {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: 1520, body});
            }

      - name: Falhar fechado se bootstrap não estiver pronto
        if: steps.bootstrap.outputs.ready != 'true'
        run: exit 4
