name: Codex Ollama E2E DEV

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo DEV governado"
        required: true
        default: "codex-e2e"
        type: choice
        options:
          - codex-e2e
          - mcp-ingress
          - change-impact-pr2144
      target_sha:
        description: "SHA exato resolvido pelo gateway somente para change-impact-pr2144"
        required: false
        default: ""
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: codex-ollama-e2e-dev
  cancel-in-progress: false

jobs:
  e2e:
    name: ReqSys → Ollama Gateway → cloud/fallback on PC24x7 DEV
    if: inputs.mode == 'codex-e2e'
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 25
    env:
      CORRELATION_ID: codex-ollama-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts/codex-ollama-e2e-dev/evidence.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact DEV host
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne "DESKTOP-PDQK954") {
            throw "UNEXPECTED_HOST: $env:COMPUTERNAME"
          }

      - name: Validate preinstalled Python runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pythonCommand = Get-Command python -CommandType Application -ErrorAction Stop
          $pythonExe = [string]$pythonCommand.Source
          if ([string]::IsNullOrWhiteSpace($pythonExe) -or -not (Test-Path -LiteralPath $pythonExe)) {
            throw "PYTHON_RUNTIME_UNAVAILABLE"
          }
          & $pythonExe -c "import sys; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "PYTHON_RUNTIME_UNUSABLE" }
          "REQSYS_PYTHON=$pythonExe" | Add-Content $env:GITHUB_ENV

      - name: Install isolated E2E dependencies
        shell: powershell
        run: |
          & "$env:REQSYS_PYTHON" -m pip install --disable-pip-version-check -r backend/requirements.txt
          & "$env:REQSYS_PYTHON" -m pip install --disable-pip-version-check -e "docs/ollama-local-gateway/bootstrap-files"

      - name: Execute governed ReqSys Ollama E2E
        shell: powershell
        run: |
          & "$env:REQSYS_PYTHON" scripts/validate_codex_cloud_reqsys_e2e.py `
            --expected-model "gemma4:31b-cloud" `
            --expected-fallback-model "gemma4:26b-q8-code" `
            --expected-sha "${{ github.sha }}" `
            --correlation-id "$env:CORRELATION_ID" `
            --evidence-file "$env:EVIDENCE_FILE"

      - name: Upload sanitized E2E evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: codex-ollama-e2e-dev-${{ github.run_id }}
          path: artifacts/codex-ollama-e2e-dev/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: powershell
        run: |
          "## Codex Ollama E2E DEV" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Host esperado: DESKTOP-PDQK954" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Provider: ollama_gateway" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Primário: gemma4:31b-cloud" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Fallback: gemma4:26b-q8-code" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Deploy executado: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Correlation ID: $env:CORRELATION_ID" | Add-Content $env:GITHUB_STEP_SUMMARY

  change-impact-pr2144:
    name: CHANGE impact benchmark PR #2144 via Ollama on PC24x7 DEV
    if: inputs.mode == 'change-impact-pr2144'
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 25
    env:
      CORRELATION_ID: change-impact-pr2144-${{ github.run_id }}-${{ github.run_attempt }}
      BENCHMARK_FILE: artifacts/change-impact/benchmark-pr2144.json
      EVIDENCE_FILE: artifacts/change-impact/runtime-evidence-pr2144.json
    steps:
      - name: Resolve exact allowed PR head before checkout
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_SHA: ${{ inputs.target_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:REQUESTED_SHA -notmatch "^[0-9a-f]{40}$") { throw "TARGET_SHA_INVALID" }
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2026-03-10"
            "User-Agent" = "reqsys-change-impact-pr2144"
          }
          $pr = Invoke-RestMethod -Method Get -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/pulls/2144" -Headers $headers
          if ($pr.state -ne "closed") { throw "PR2144_NOT_CLOSED" }
          if ($pr.merged -ne $true) { throw "PR2144_NOT_MERGED" }
          if ($pr.base.ref -ne "main") { throw "PR2144_BASE_NOT_MAIN" }
          if ($pr.head.repo.full_name -ne $env:GITHUB_REPOSITORY) { throw "PR2144_HEAD_REPOSITORY_MISMATCH" }
          if ($pr.head.ref -ne "copilot/change-impact-benchmark-20260928") { throw "PR2144_HEAD_BRANCH_MISMATCH" }
          if ($pr.merge_commit_sha -ne $env:REQUESTED_SHA) { throw "PR2144_MERGE_SHA_MISMATCH" }
          "TARGET_SHA=$env:REQUESTED_SHA" | Add-Content $env:GITHUB_ENV

      - name: Checkout exact PR #2144 SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ inputs.target_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Verify exact PR SHA and DEV host
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:COMPUTERNAME -ne "DESKTOP-PDQK954") { throw "UNEXPECTED_HOST" }
          $observed = (git rev-parse HEAD).Trim()
          if ($LASTEXITCODE -ne 0 -or $observed -ne $env:TARGET_SHA) { throw "TARGET_SHA_CHECKOUT_MISMATCH" }

      - name: Validate preinstalled Python runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pythonCommand = Get-Command python -CommandType Application -ErrorAction Stop
          $pythonExe = [string]$pythonCommand.Source
          if ([string]::IsNullOrWhiteSpace($pythonExe) -or -not (Test-Path -LiteralPath $pythonExe)) {
            throw "PYTHON_RUNTIME_UNAVAILABLE"
          }
          & $pythonExe -c "import sys; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "PYTHON_RUNTIME_UNUSABLE" }
          "REQSYS_PYTHON=$pythonExe" | Add-Content $env:GITHUB_ENV

      - name: Install isolated benchmark dependencies
        shell: powershell
        run: |
          & "$env:REQSYS_PYTHON" -m pip install --disable-pip-version-check -r backend/requirements.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Execute CHANGE impact benchmark with configured Ollama
        shell: powershell
        run: |
          & "$env:REQSYS_PYTHON" scripts/change_impact_benchmark.py `
            --output "$env:BENCHMARK_FILE" `
            --llm-mode configured `
            --provider ollama_gateway `
            --require-llm `
            --correlation-id "$env:CORRELATION_ID"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Validate benchmark evidence independently
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          if (-not (Test-Path -LiteralPath $env:BENCHMARK_FILE)) { throw "BENCHMARK_ARTIFACT_MISSING" }
          $payload = Get-Content -Raw -Encoding UTF8 $env:BENCHMARK_FILE | ConvertFrom-Json
          if ($payload.llm_mode -ne "configured") { throw "BENCHMARK_LLM_MODE_MISMATCH" }
          if ($payload.llm_used_for_all_cases -ne $true) { throw "BENCHMARK_LLM_NOT_USED_FOR_ALL_CASES" }
          $hybrid = @($payload.cases | Where-Object { $_.strategy -eq "hybrid_rag_llm" })
          if ($hybrid.Count -eq 0) { throw "BENCHMARK_HYBRID_CASES_MISSING" }
          if (@($hybrid | Where-Object { $_.llm_status -ne "used" }).Count -ne 0) { throw "BENCHMARK_HYBRID_NOT_USED" }
          $observed = (git rev-parse HEAD).Trim()
          if ($observed -ne $env:TARGET_SHA) { throw "BENCHMARK_SHA_DRIFT" }
          $digest = (Get-FileHash -Algorithm SHA256 -LiteralPath $env:BENCHMARK_FILE).Hash.ToLowerInvariant()
          $evidence = [ordered]@{
            schema_version = "1.0.0"
            status = "passed"
            target_pr = 2144
            target_sha = $env:TARGET_SHA
            observed_sha = $observed
            correlation_id = $env:CORRELATION_ID
            llm_mode = $payload.llm_mode
            llm_used_for_all_cases = [bool]$payload.llm_used_for_all_cases
            benchmark_sha256 = $digest
            production_touched = $false
            deploy_performed = $false
            secrets_emitted = $false
          }
          $directory = Split-Path -Parent $env:EVIDENCE_FILE
          New-Item -ItemType Directory -Force -Path $directory | Out-Null
          $evidence | ConvertTo-Json -Depth 5 | Set-Content -Encoding UTF8 $env:EVIDENCE_FILE

      - name: Upload sanitized CHANGE impact evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: change-impact-pr2144-${{ github.run_id }}
          path: |
            artifacts/change-impact/benchmark-pr2144.json
            artifacts/change-impact/runtime-evidence-pr2144.json
          if-no-files-found: error
          retention-days: 30

      - name: CHANGE impact summary
        if: always()
        shell: powershell
        run: |
          "## CHANGE impact benchmark PR #2144" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Target SHA: $env:TARGET_SHA" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Provider: ollama_gateway" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Deploy executado: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Correlation ID: $env:CORRELATION_ID" | Add-Content $env:GITHUB_STEP_SUMMARY

  mcp-ingress:
    name: GitHub Copilot → Ollama MCP HTTPS ingress on PC24x7 DEV
    if: inputs.mode == 'mcp-ingress'
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 10
    env:
      EVIDENCE_FILE: artifacts/github-copilot-ollama-mcp-ingress/evidence.json
      CORRELATION_ID: ollama-mcp-ingress-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact DEV host
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne "DESKTOP-PDQK954") {
            throw "UNEXPECTED_HOST"
          }

      - name: Validate preinstalled Python runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pythonCommand = Get-Command python -CommandType Application -ErrorAction Stop
          $pythonExe = [string]$pythonCommand.Source
          if ([string]::IsNullOrWhiteSpace($pythonExe) -or -not (Test-Path -LiteralPath $pythonExe)) {
            throw "PYTHON_RUNTIME_UNAVAILABLE"
          }
          & $pythonExe -c "import sys; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "PYTHON_RUNTIME_UNUSABLE" }
          "REQSYS_PYTHON=$pythonExe" | Add-Content $env:GITHUB_ENV

      - name: Reconcile stable HTTPS MCP route
        shell: powershell
        run: |
          & "$env:REQSYS_PYTHON" scripts/pc24x7_ollama_mcp_funnel.py `
            --apply `
            --source-sha "${{ github.sha }}" `
            --evidence-file "$env:EVIDENCE_FILE"

      - name: Upload sanitized MCP ingress evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: github-copilot-ollama-mcp-ingress-${{ github.run_id }}
          path: artifacts/github-copilot-ollama-mcp-ingress/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: MCP ingress summary
        if: always()
        shell: powershell
        run: |
          "## GitHub Copilot Ollama MCP Ingress DEV" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Host esperado: DESKTOP-PDQK954" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Rota: HTTPS /mcp -> 127.0.0.1:8010" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Ollama :11434 público: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Gateway :8008 público: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Segredos lidos: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Correlation ID: $env:CORRELATION_ID" | Add-Content $env:GITHUB_STEP_SUMMARY
