name: Codex Ollama E2E DEV

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo DEV governado"
        required: true
        default: "codex-e2e"
        type: choice
        options:
          - codex-e2e
          - mcp-ingress

permissions:
  contents: read

concurrency:
  group: codex-ollama-e2e-dev
  cancel-in-progress: false

jobs:
  e2e:
    name: ReqSys → Ollama Gateway → cloud/fallback on PC24x7 DEV
    if: inputs.mode == 'codex-e2e'
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 25
    env:
      CORRELATION_ID: codex-ollama-e2e-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_FILE: artifacts/codex-ollama-e2e-dev/evidence.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact DEV host
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne "DESKTOP-PDQK954") {
            throw "UNEXPECTED_HOST: $env:COMPUTERNAME"
          }

      - name: Validate preinstalled Python runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pythonCommand = Get-Command python -CommandType Application -ErrorAction Stop
          $pythonExe = [string]$pythonCommand.Source
          if ([string]::IsNullOrWhiteSpace($pythonExe) -or -not (Test-Path -LiteralPath $pythonExe)) {
            throw "PYTHON_RUNTIME_UNAVAILABLE"
          }
          & $pythonExe -c "import sys; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "PYTHON_RUNTIME_UNUSABLE" }
          "REQSYS_PYTHON=$pythonExe" | Add-Content $env:GITHUB_ENV

      - name: Install isolated E2E dependencies
        shell: powershell
        run: |
          & "$env:REQSYS_PYTHON" -m pip install --disable-pip-version-check -r backend/requirements.txt
          & "$env:REQSYS_PYTHON" -m pip install --disable-pip-version-check -e "docs/ollama-local-gateway/bootstrap-files"

      - name: Execute governed ReqSys Ollama E2E
        shell: powershell
        run: |
          & "$env:REQSYS_PYTHON" scripts/validate_codex_cloud_reqsys_e2e.py `
            --expected-model "gemma4:31b-cloud" `
            --expected-fallback-model "gemma4:26b-q8-code" `
            --expected-sha "${{ github.sha }}" `
            --correlation-id "$env:CORRELATION_ID" `
            --evidence-file "$env:EVIDENCE_FILE"

      - name: Upload sanitized E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-ollama-e2e-dev-${{ github.run_id }}
          path: artifacts/codex-ollama-e2e-dev/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: powershell
        run: |
          "## Codex Ollama E2E DEV" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Host esperado: DESKTOP-PDQK954" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Provider: ollama_gateway" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Primário: gemma4:31b-cloud" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Fallback: gemma4:26b-q8-code" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Deploy executado: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Correlation ID: $env:CORRELATION_ID" | Add-Content $env:GITHUB_STEP_SUMMARY

  mcp-ingress:
    name: GitHub Copilot → Ollama MCP HTTPS ingress on PC24x7 DEV
    if: inputs.mode == 'mcp-ingress'
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 10
    env:
      EVIDENCE_FILE: artifacts/github-copilot-ollama-mcp-ingress/evidence.json
      CORRELATION_ID: ollama-mcp-ingress-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify exact DEV host
        shell: powershell
        run: |
          if ($env:COMPUTERNAME -ne "DESKTOP-PDQK954") {
            throw "UNEXPECTED_HOST"
          }

      - name: Validate preinstalled Python runtime
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $pythonCommand = Get-Command python -CommandType Application -ErrorAction Stop
          $pythonExe = [string]$pythonCommand.Source
          if ([string]::IsNullOrWhiteSpace($pythonExe) -or -not (Test-Path -LiteralPath $pythonExe)) {
            throw "PYTHON_RUNTIME_UNAVAILABLE"
          }
          & $pythonExe -c "import sys; print(sys.version)"
          if ($LASTEXITCODE -ne 0) { throw "PYTHON_RUNTIME_UNUSABLE" }
          "REQSYS_PYTHON=$pythonExe" | Add-Content $env:GITHUB_ENV

      - name: Ensure MCP bridge dependency
        shell: powershell
        run: |
          & "$env:REQSYS_PYTHON" -c "import importlib.metadata as m; v=m.version('mcp'); raise SystemExit(0 if int(v.split('.')[0]) == 2 else 1)"
          if ($LASTEXITCODE -ne 0) {
            & "$env:REQSYS_PYTHON" -m pip install --disable-pip-version-check -r "services/ollama-mcp-bridge/requirements.txt"
            if ($LASTEXITCODE -ne 0) { throw "MCP_RUNTIME_DEPENDENCY_INSTALL_FAILED" }
          }

      - name: Reconcile PC24x7 supervisor with MCP bridge
        shell: powershell
        run: |
          & "$env:REQSYS_PYTHON" scripts/codex_pc24x7_supervisor.py install `
            --source-root "${{ github.workspace }}" `
            --source-sha "${{ github.sha }}" `
            --python-executable "$env:REQSYS_PYTHON"
          if ($LASTEXITCODE -ne 0) { throw "CODEX_PC24X7_SUPERVISOR_RECONCILE_FAILED" }

      - name: Reconcile stable HTTPS MCP route
        shell: powershell
        run: |
          & "$env:REQSYS_PYTHON" scripts/pc24x7_ollama_mcp_funnel.py `
            --apply `
            --source-sha "${{ github.sha }}" `
            --evidence-file "$env:EVIDENCE_FILE"

      - name: Upload sanitized MCP ingress evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: github-copilot-ollama-mcp-ingress-${{ github.run_id }}
          path: artifacts/github-copilot-ollama-mcp-ingress/evidence.json
          if-no-files-found: error
          retention-days: 30

      - name: MCP ingress summary
        if: always()
        shell: powershell
        run: |
          "## GitHub Copilot Ollama MCP Ingress DEV" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Host esperado: DESKTOP-PDQK954" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Rota: HTTPS /mcp -> 127.0.0.1:8010" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Ollama :11434 público: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Gateway :8008 público: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Segredos lidos: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Correlation ID: $env:CORRELATION_ID" | Add-Content $env:GITHUB_STEP_SUMMARY
