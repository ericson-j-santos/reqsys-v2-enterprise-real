name: BACEN Annual Report Cycle Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md"
      - "scripts/generate_bacen_annual_report_cycle_readiness.py"
      - ".github/workflows/bacen-annual-report-cycle-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md"
      - "scripts/generate_bacen_annual_report_cycle_readiness.py"
  schedule:
    - cron: "43 8 1 */3 *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"
      - run: python -m py_compile scripts/generate_bacen_annual_report_cycle_readiness.py
      - run: >-
          python scripts/generate_bacen_annual_report_cycle_readiness.py
          --report governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md
          --output artifacts/bacen/bacen-08-annual-report-cycle-readiness.json
      - if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: bacen-08-annual-report-cycle-readiness
          path: artifacts/bacen/bacen-08-annual-report-cycle-readiness.json
          if-no-files-found: error
          retention-days: 365
