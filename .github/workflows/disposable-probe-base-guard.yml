name: Guard Rail — Base de probes descartáveis

on:
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - "scripts/validate_disposable_probe_base.py"
      - "tests/test_validate_disposable_probe_base.py"
      - ".github/workflows/disposable-probe-base-guard.yml"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: disposable-probe-base-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validar-base-de-probes:
    name: Nenhum probe descartável usa a branch protegida como base
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVIDENCE_DIR: artifacts/disposable-probe-base-guard
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Instalar dependências mínimas de teste
        run: python -m pip install --disable-pip-version-check pytest

      - name: Executar contrato do guardrail
        env:
          PYTHONPATH: .
        run: python -m pytest tests/test_validate_disposable_probe_base.py -q

      - name: Teste negativo deliberado — base = branch padrão
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          set +e
          python scripts/validate_disposable_probe_base.py \
            --mode decide \
            --base-ref "${{ github.event.repository.default_branch }}" \
            --head-ref "probe/negative-control-${GITHUB_RUN_ID}" \
            --source-sha "$GITHUB_SHA" \
            --base-sha "$GITHUB_SHA" \
            --output "$EVIDENCE_DIR/negative-control.json"
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "Controle negativo falhou: a branch padrão foi aceita como base de probe." >&2
            exit 1
          fi
          python - "$EVIDENCE_DIR/negative-control.json" <<'PY'
          import json, sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["allowed"] is False, payload
          assert any(
              item.startswith("probe_base_is_protected")
              for item in payload["blocking_issues"]
          ), payload
          print("controle negativo aprovado:", payload["blocking_issues"])
          PY

      - name: Caso positivo — base isolada ancorada no SHA corrente
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/validate_disposable_probe_base.py \
            --mode decide \
            --base-ref "probe-base/positive-control-${GITHUB_RUN_ID}" \
            --head-ref "probe/positive-control-${GITHUB_RUN_ID}" \
            --source-sha "$GITHUB_SHA" \
            --base-sha "$GITHUB_SHA" \
            --output "$EVIDENCE_DIR/positive-control.json"

      - name: Varredura estática dos workflows
        shell: bash
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python scripts/validate_disposable_probe_base.py \
            --mode scan \
            --output "$EVIDENCE_DIR/workflow-scan.json"

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v4.6.2
        with:
          name: disposable-probe-base-guard-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30
