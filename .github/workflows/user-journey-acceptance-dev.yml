name: Aceite Real da Jornada do Usuário DEV

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/user-journey-acceptance-dev.yml"
      - "scripts/wsjf_business_effect_probe.py"
      - "scripts/wsjf_business_effect_gate.py"
      - "scripts/user_journey_acceptance_gate.py"
      - "tests/test_wsjf_business_effect_probe.py"
      - "config/user-journey-acceptance-policy.json"
      - "frontend/tests/e2e/wsjf-planner-excel-live.spec.js"
      - "frontend/tests/e2e/wsjf-planner-excel-conexoes-live.spec.js"
  workflow_dispatch:
    inputs:
      feature:
        description: "Jornada real a validar"
        required: true
        type: choice
        default: wsjf_planner_excel_simples
        options:
          - wsjf_planner_excel_simples

permissions:
  contents: read
  actions: read
  id-token: write

env:
  FEATURE: wsjf_planner_excel_simples
  FRONTEND_URL: ${{ vars.PC24X7_DEV_FRONTEND_URL }}
  API_URL: ${{ vars.PC24X7_DEV_BASE_URL }}
  EVIDENCE_DIR: audit/user-journey/wsjf-planner-excel-dev

concurrency:
  group: user-journey-acceptance-dev-wsjf
  cancel-in-progress: true

jobs:
  real-user-journey:
    name: Jornada real WSJF — sem mocks
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 160
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Validar configuração PC24x7 DEV
        shell: bash
        run: |
          set -euo pipefail
          for pair in "PC24X7_DEV_BASE_URL:$API_URL" "PC24X7_DEV_FRONTEND_URL:$FRONTEND_URL"; do
            name="${pair%%:*}"
            value="${pair#*:}"
            if [ -z "$value" ]; then
              echo "::error::$name não configurada."
              exit 1
            fi
            case "$value" in
              https://*) ;;
              *) echo "::error::$name deve usar HTTPS."; exit 1 ;;
            esac
            case "${value,,}" in
              *fly.io*|*fly.dev*) echo "::error::Fly.io está descontinuado; $name deve apontar para PC24x7."; exit 1 ;;
            esac
          done
          curl --fail --silent --show-error --max-time 20 "$API_URL/api/runtime/health" >/dev/null
          curl --fail --silent --show-error --max-time 20 "$FRONTEND_URL/" >/dev/null

      - name: Resolver SHA do teste e SHA realmente publicado
        id: target
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          source_sha="$SOURCE_SHA"
          expected_sha="$(python - <<'PY'
          import json
          import os
          from urllib.request import Request, urlopen

          url = os.environ['API_URL'].rstrip('/') + '/api/runtime/build-info'
          request = Request(url, headers={'Accept': 'application/json', 'User-Agent': 'reqsys-user-journey/2.0'})
          with urlopen(request, timeout=20) as response:
              payload = json.loads(response.read().decode('utf-8'))
          if isinstance(payload.get('data'), dict):
              payload = payload['data']
          sha = str(payload.get('build_sha') or payload.get('commit_sha') or '').strip()
          if not sha:
              raise SystemExit('Runtime PC24x7 DEV não informou SHA publicado')
          print(sha)
          PY
          )"
          if [ "$source_sha" != "$expected_sha" ]; then
            echo "::error::Same-SHA obrigatório: código testado=$source_sha runtime DEV=$expected_sha"
            exit 42
          fi
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "expected_sha=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "Código dos testes: $source_sha"
          echo "Código publicado em DEV: $expected_sha"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Preparar diretório de evidências
        run: mkdir -p "$EVIDENCE_DIR"

      - name: Instalar dependências backend
        run: |
          set -euo pipefail
          bash .github/scripts/install-unixodbc-ci.sh
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Instalar dependências frontend e Chromium
        working-directory: frontend
        run: |
          set -euo pipefail
          npm ci
          npx playwright install --with-deps chromium

      - name: Testes automatizados relevantes
        id: automated
        continue-on-error: true
        env:
          PYTHONPATH: backend
        run: |
          set -euo pipefail
          python -m pytest \
            tests/test_user_journey_acceptance_gate.py \
            tests/test_wsjf_business_effect_gate.py \
            tests/test_wsjf_business_effect_probe.py \
            backend/tests/test_wsjf_planner_excel_provisioning.py \
            -q
          cd frontend
          npx vitest run src/services/__tests__/wsjfPlannerExcelInstaller.test.js

      - name: Validar deploy real e SHA publicado
        id: deploy
        continue-on-error: true
        env:
          TARGET_SHA: ${{ steps.target.outputs.expected_sha }}
        run: |
          set -euo pipefail
          python scripts/validate_public_runtime.py \
            --base-url "$API_URL" \
            --environment dev \
            --include-optional-evidence \
            --output "$EVIDENCE_DIR/public-runtime.json"

      - name: Decodificar sessão MSAL real
        id: msal_state
        continue-on-error: true
        shell: bash
        env:
          WSJF_MSAL_STORAGE_STATE_B64: ${{ secrets.WSJF_MSAL_STORAGE_STATE_B64 }}
        run: |
          set -euo pipefail
          if [ -z "${WSJF_MSAL_STORAGE_STATE_B64:-}" ]; then
            echo "::error::WSJF_MSAL_STORAGE_STATE_B64 ausente; o aceite real não pode usar login demo para conexões delegadas."
            exit 1
          fi
          echo "$WSJF_MSAL_STORAGE_STATE_B64" | base64 --decode > "$RUNNER_TEMP/msal-storage-state.json"
          echo "path=$RUNNER_TEMP/msal-storage-state.json" >> "$GITHUB_OUTPUT"

      - name: Verificar validade da sessão MSAL real
        id: msal_check
        if: steps.msal_state.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        env:
          MSAL_STORAGE_STATE_PATH: ${{ steps.msal_state.outputs.path }}
        run: |
          set -euo pipefail
          npm run check:msal-state

      - name: Browser real no DEV com sessão Microsoft e sem mocks
        id: browser
        if: steps.msal_state.outcome == 'success' && steps.msal_check.outcome == 'success'
        continue-on-error: true
        working-directory: frontend
        env:
          REAL_USER_JOURNEY: "true"
          E2E_BASE_URL: ${{ env.FRONTEND_URL }}
          MSAL_STORAGE_STATE_PATH: ${{ steps.msal_state.outputs.path }}
        run: |
          set -euo pipefail
          npx playwright test tests/e2e/wsjf-planner-excel-conexoes-live.spec.js --reporter=line

      - name: Autenticar integrações Microsoft por OIDC
        id: microsoft_oidc
        continue-on-error: true
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          tenant-id: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Provar Graph e Power Platform reais por identidade federada
        id: microsoft_integrations
        if: steps.microsoft_oidc.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          EXPECTED_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
        run: |
          set -euo pipefail
          graph_token="$(az account get-access-token --resource-type ms-graph --query accessToken -o tsv)"
          power_token="$(az account get-access-token --resource https://api.powerplatform.com/ --query accessToken -o tsv)"
          test -n "$graph_token"
          test -n "$power_token"
          echo "::add-mask::$graph_token"
          echo "::add-mask::$power_token"
          GRAPH_TOKEN="$graph_token" POWER_TOKEN="$power_token" python - <<'PY'
          import base64
          import json
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          expected = os.environ["EXPECTED_CLIENT_ID"]
          def claims(token):
              raw = token.split(".")[1]
              raw += "=" * (-len(raw) % 4)
              return json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))

          for label, token_name in (("graph", "GRAPH_TOKEN"), ("powerplatform", "POWER_TOKEN")):
              actual = claims(os.environ[token_name]).get("appid") or claims(os.environ[token_name]).get("azp")
              if actual != expected:
                  raise SystemExit(f"{label}_oidc_app_identity_mismatch")

          checks = []
          endpoints = (
              ("graph_groups", "https://graph.microsoft.com/v1.0/groups?$top=1&$select=id,displayName", os.environ["GRAPH_TOKEN"]),
              ("powerplatform_environments", "https://api.powerplatform.com/environmentmanagement/environments?api-version=2024-10-01", os.environ["POWER_TOKEN"]),
          )
          for label, url, token in endpoints:
              request = Request(url, headers={"Authorization": f"Bearer {token}", "Accept": "application/json"})
              with urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
                  checks.append({
                      "check": label,
                      "status": "PASS",
                      "http_status": int(response.status),
                      "items_observed": len(payload.get("value", [])) if isinstance(payload, dict) else 0,
                  })
          evidence = {
              "status": "PASS",
              "auth_mode": "oidc",
              "tokens_persisted": False,
              "checks": checks,
          }
          path = Path(os.environ["EVIDENCE_DIR"]) / "microsoft-integrations.json"
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(evidence, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          print(json.dumps(evidence, ensure_ascii=False, separators=(",", ":")))
          PY
          echo "POWER_PLATFORM_GRAPH_ACCESS_TOKEN=$graph_token" >> "$GITHUB_ENV"

      - name: Produzir evidência real Planner → Power Automate → Excel
        id: business_probe
        if: steps.microsoft_integrations.outcome == 'success'
        continue-on-error: true
        env:
          WSJF_DEV_GROUP_ID: ${{ vars.WSJF_DEV_GROUP_ID }}
          WSJF_DEV_PLAN_ID: ${{ vars.WSJF_DEV_PLAN_ID }}
          WSJF_DEV_BUCKET_ID: ${{ vars.WSJF_DEV_BUCKET_ID }}
          WSJF_DEV_DRIVE_ID: ${{ vars.WSJF_DEV_DRIVE_ID }}
          WSJF_DEV_FILE_ID: ${{ vars.WSJF_DEV_FILE_ID }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          python -m pip install 'openpyxl>=3.1,<4'
          python scripts/wsjf_business_effect_probe.py \
            --output "$EVIDENCE_DIR/business-effect-input.json" \
            --run-url "$RUN_URL" \
            --wait-seconds 3900

      - name: Validar efeito de negócio real
        id: business
        continue-on-error: true
        run: |
          set -euo pipefail
          python scripts/wsjf_business_effect_gate.py \
            --evidence "$EVIDENCE_DIR/business-effect-input.json" \
            --output "$EVIDENCE_DIR/business-effect-result.json" \
            --max-age-hours 24

      - name: Consolidar cinco camadas de aceite
        if: always()
        env:
          AUTOMATED_OUTCOME: ${{ steps.automated.outcome }}
          DEPLOY_OUTCOME: ${{ steps.deploy.outcome }}
          BROWSER_OUTCOME: ${{ steps.browser.outcome }}
          INTEGRATIONS_OUTCOME: ${{ steps.microsoft_integrations.outcome }}
          BUSINESS_OUTCOME: ${{ steps.business.outcome }}
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          evidence_dir = Path(os.environ['EVIDENCE_DIR'])
          evidence_dir.mkdir(parents=True, exist_ok=True)

          def passed(name):
              return os.environ.get(name) == 'success'

          automated = passed('AUTOMATED_OUTCOME')
          deploy = passed('DEPLOY_OUTCOME')
          browser = passed('BROWSER_OUTCOME')
          integrations = passed('INTEGRATIONS_OUTCOME')
          business = passed('BUSINESS_OUTCOME')
          run_url = os.environ['RUN_URL']

          data = {
              'feature': os.environ['FEATURE'],
              'environment': 'dev',
              'stages': {
                  'automated_tests': {
                      'status': 'passed' if automated else 'blocked',
                      'real': False,
                      'mocked': False,
                      'evidence': run_url + '#automated-tests',
                  },
                  'real_deploy': {
                      'status': 'passed' if deploy else 'blocked',
                      'real': deploy,
                      'mocked': False,
                      'evidence': run_url + '#real-deploy',
                  },
                  'live_browser_no_mocks': {
                      'status': 'passed' if browser else 'blocked',
                      'real': browser,
                      'mocked': False,
                      'evidence': run_url + '#live-browser',
                  },
                  'real_external_integrations': {
                      'status': 'passed' if integrations else 'blocked',
                      'real': integrations,
                      'mocked': False,
                      'evidence': run_url + '#external-integrations',
                  },
                  'business_effect': {
                      'status': 'passed' if business else 'blocked',
                      'real': business,
                      'mocked': False,
                      'evidence': run_url + '#business-effect',
                  },
              },
          }
          (evidence_dir / 'acceptance-input.json').write_text(
              json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          PY

      - name: Gate final — 100% somente com jornada real completa
        if: always()
        run: |
          python scripts/user_journey_acceptance_gate.py \
            --evidence "$EVIDENCE_DIR/acceptance-input.json" \
            --policy config/user-journey-acceptance-policy.json \
            --output "$EVIDENCE_DIR/acceptance-result.json" \
            --strict

      - name: Publicar evidências da jornada real
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: user-journey-acceptance-dev-wsjf-${{ github.run_id }}
          path: |
            ${{ env.EVIDENCE_DIR }}/
            frontend/test-results/
          if-no-files-found: warn
          retention-days: 30
