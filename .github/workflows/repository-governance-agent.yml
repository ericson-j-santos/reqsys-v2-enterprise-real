name: Repository Governance Agent

on:
  push:
    branches: [main]
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: repository-governance-agent-${{ github.event_name == 'push' && 'main-sync' || github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  sync-current-pr:
    name: Sincronizar a própria PR quando a main avançar
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Inspecionar necessidade de sincronização
        id: sync-check
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const repository = owner + '/' + repo;
            const prNumber = Number(context.payload.pull_request.number);

            const { data: observed } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });

            if (
              observed.state !== 'open' ||
              observed.draft ||
              observed.base.ref !== 'main' ||
              observed.head.repo?.full_name !== repository
            ) {
              core.notice('PR fora do escopo seguro de auto-sincronização.');
              return 'false';
            }
            if (observed.mergeable === false || observed.mergeable_state === 'dirty') {
              core.notice('PR com conflito; sincronização automática bloqueada.');
              return 'false';
            }
            if (observed.mergeable === null) {
              core.notice('Mergeabilidade ainda desconhecida; mantendo fail-closed.');
              return 'false';
            }

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: 'main...' + observed.head.sha,
            });
            if (Number(comparison.behind_by || 0) <= 0) {
              core.notice('PR já está atualizada com a main; credencial de escrita não será emitida.');
              return 'false';
            }

            core.notice('PR está atrás da main; credencial de escrita será solicitada somente agora.');
            return 'true';

      - name: Validar configuração da GitHub App
        if: steps.sync-check.outputs.result == 'true'
        shell: bash
        env:
          APP_ID: ${{ vars.REQSYS_STACK_REBASE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.REQSYS_STACK_REBASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::GitHub App governada não configurada."
            exit 1
          fi

      - name: Gerar token temporário de branch sync
        if: steps.sync-check.outputs.result == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REQSYS_STACK_REBASE_APP_ID }}
          private-key: ${{ secrets.REQSYS_STACK_REBASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: reqsys-v2-enterprise-real
          permission-contents: write
          permission-pull-requests: write

      - name: Atualizar PR atual com proteção por HEAD
        if: steps.sync-check.outputs.result == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const repository = owner + '/' + repo;
            const prNumber = Number(context.payload.pull_request.number);
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const { data: observed } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            const expectedHeadSha = observed.head.sha;

            if (
              observed.state !== 'open' ||
              observed.draft ||
              observed.base.ref !== 'main' ||
              observed.head.repo?.full_name !== repository
            ) {
              core.notice('PR fora do escopo seguro de auto-sincronização.');
              return;
            }
            if (observed.mergeable === false || observed.mergeable_state === 'dirty') {
              core.notice('PR com conflito; sincronização automática bloqueada.');
              return;
            }
            if (observed.mergeable === null) {
              core.notice('Mergeabilidade ainda desconhecida; mantendo fail-closed.');
              return;
            }

            const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
              owner,
              repo,
              basehead: 'main...' + expectedHeadSha,
            });
            if (Number(comparison.behind_by || 0) <= 0) {
              core.notice('PR já está atualizada com a main.');
              return;
            }

            const { data: current } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: prNumber,
            });
            if (
              current.state !== 'open' ||
              current.draft ||
              current.base.ref !== 'main' ||
              current.head.sha !== expectedHeadSha ||
              current.head.repo?.full_name !== repository ||
              current.mergeable === false ||
              current.mergeable_state === 'dirty'
            ) {
              core.notice('Estado mudou antes do update-branch; nenhuma mutação executada.');
              return;
            }

            await github.rest.pulls.updateBranch({
              owner,
              repo,
              pull_number: prNumber,
              expected_head_sha: expectedHeadSha,
            });

            for (let attempt = 1; attempt <= 8; attempt += 1) {
              await sleep(Math.min(attempt * 1000, 5000));
              const { data: after } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              if (after.head.sha === expectedHeadSha) {
                continue;
              }
              const { data: afterComparison } =
                await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: 'main...' + after.head.sha,
                });
              if (Number(afterComparison.behind_by || 0) === 0) {
                core.notice(
                  'PR sincronizada pela GitHub App: ' +
                    expectedHeadSha +
                    ' -> ' +
                    after.head.sha
                );
                return;
              }
            }

            core.setFailed('update-branch aceito, mas behind_by=0 não foi confirmado.');

  sync-open-prs:
    name: Sincronizar PRs atrasadas após avanço da main
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Inspecionar PRs que podem exigir sincronização
        id: sync-scan
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const { owner, repo } = context.repo;
            const repository = owner + '/' + repo;

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
              sort: 'updated',
              direction: 'asc',
            });

            for (const summary of pulls) {
              const { data: observed } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: Number(summary.number),
              });

              if (
                observed.state !== 'open' ||
                observed.draft ||
                observed.base.ref !== 'main' ||
                observed.head.repo?.full_name !== repository ||
                observed.mergeable === false ||
                observed.mergeable_state === 'dirty' ||
                observed.mergeable === null
              ) {
                continue;
              }

              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: 'main...' + observed.head.sha,
              });
              if (Number(comparison.behind_by || 0) > 0) {
                core.notice('Existe PR elegível atrasada; credencial de escrita será solicitada.');
                return 'true';
              }
            }

            core.notice('Nenhuma PR elegível está atrasada; credencial de escrita não será emitida.');
            return 'false';

      - name: Validar configuração da GitHub App
        if: steps.sync-scan.outputs.result == 'true'
        shell: bash
        env:
          APP_ID: ${{ vars.REQSYS_STACK_REBASE_APP_ID }}
          PRIVATE_KEY: ${{ secrets.REQSYS_STACK_REBASE_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [ -z "$APP_ID" ] || [ -z "$PRIVATE_KEY" ]; then
            echo "::error::GitHub App governada não configurada."
            exit 1
          fi

      - name: Gerar token temporário de branch sync
        if: steps.sync-scan.outputs.result == 'true'
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REQSYS_STACK_REBASE_APP_ID }}
          private-key: ${{ secrets.REQSYS_STACK_REBASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: reqsys-v2-enterprise-real
          permission-contents: write
          permission-pull-requests: write

      - name: Atualizar branches com proteção por HEAD
        if: steps.sync-scan.outputs.result == 'true'
        uses: actions/github-script@v7
        env:
          MAX_BRANCH_SYNCS: "3"
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const repository = owner + '/' + repo;
            const maxSyncs = Number(process.env.MAX_BRANCH_SYNCS || '3');
            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms));

            const pulls = await github.paginate(github.rest.pulls.list, {
              owner,
              repo,
              state: 'open',
              base: 'main',
              per_page: 100,
              sort: 'updated',
              direction: 'asc',
            });

            const results = [];
            let updatesStarted = 0;

            for (const summary of pulls) {
              const prNumber = Number(summary.number);
              const { data: observed } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });

              const expectedHeadSha = observed.head.sha;
              const headRepository = observed.head.repo?.full_name || '';

              if (observed.state !== 'open' || observed.base.ref !== 'main') {
                results.push({ pr: prNumber, result: 'skipped', reason: 'not_open_or_not_main' });
                continue;
              }
              if (observed.draft) {
                results.push({ pr: prNumber, result: 'skipped', reason: 'draft' });
                continue;
              }
              if (headRepository !== repository) {
                results.push({ pr: prNumber, result: 'skipped', reason: 'external_fork' });
                continue;
              }
              if (observed.mergeable === false || observed.mergeable_state === 'dirty') {
                results.push({ pr: prNumber, result: 'blocked', reason: 'conflict' });
                continue;
              }
              if (observed.mergeable === null) {
                results.push({ pr: prNumber, result: 'hold', reason: 'mergeability_unknown' });
                continue;
              }

              const { data: comparison } = await github.rest.repos.compareCommitsWithBasehead({
                owner,
                repo,
                basehead: 'main...' + expectedHeadSha,
              });
              if (Number(comparison.behind_by || 0) <= 0) {
                results.push({ pr: prNumber, result: 'noop', reason: 'already_up_to_date' });
                continue;
              }

              if (updatesStarted >= maxSyncs) {
                results.push({
                  pr: prNumber,
                  result: 'deferred',
                  reason: 'branch_sync_budget_exhausted',
                  behind_by: comparison.behind_by,
                });
                continue;
              }

              const { data: current } = await github.rest.pulls.get({
                owner,
                repo,
                pull_number: prNumber,
              });
              if (
                current.state !== 'open' ||
                current.draft ||
                current.base.ref !== 'main' ||
                current.head.sha !== expectedHeadSha ||
                current.head.repo?.full_name !== repository ||
                current.mergeable === false ||
                current.mergeable_state === 'dirty'
              ) {
                results.push({
                  pr: prNumber,
                  result: 'stale_noop',
                  reason: 'state_changed_before_update',
                });
                continue;
              }

              const { data: currentComparison } =
                await github.rest.repos.compareCommitsWithBasehead({
                  owner,
                  repo,
                  basehead: 'main...' + expectedHeadSha,
                });
              if (Number(currentComparison.behind_by || 0) <= 0) {
                results.push({ pr: prNumber, result: 'noop', reason: 'race_already_updated' });
                continue;
              }

              updatesStarted += 1;
              try {
                await github.rest.pulls.updateBranch({
                  owner,
                  repo,
                  pull_number: prNumber,
                  expected_head_sha: expectedHeadSha,
                });
              } catch (error) {
                results.push({
                  pr: prNumber,
                  result: 'blocked',
                  reason: 'update_branch_api_' + (error.status || 'error'),
                });
                continue;
              }

              let confirmed = null;
              for (let attempt = 1; attempt <= 8; attempt += 1) {
                await sleep(Math.min(attempt * 1000, 5000));
                const { data: after } = await github.rest.pulls.get({
                  owner,
                  repo,
                  pull_number: prNumber,
                });
                if (after.head.sha === expectedHeadSha) {
                  continue;
                }
                const { data: afterComparison } =
                  await github.rest.repos.compareCommitsWithBasehead({
                    owner,
                    repo,
                    basehead: 'main...' + after.head.sha,
                  });
                if (Number(afterComparison.behind_by || 0) === 0) {
                  confirmed = {
                    pr: prNumber,
                    result: 'updated',
                    previous_head_sha: expectedHeadSha,
                    current_head_sha: after.head.sha,
                    behind_by: 0,
                  };
                  break;
                }
              }

              if (!confirmed) {
                results.push({
                  pr: prNumber,
                  result: 'blocked',
                  reason: 'update_not_confirmed',
                  expected_head_sha: expectedHeadSha,
                });
                continue;
              }
              results.push(confirmed);
            }

            const failures = results.filter((item) => item.result === 'blocked');
            const updated = results.filter((item) => item.result === 'updated');
            const deferred = results.filter((item) => item.result === 'deferred');

            await core.summary
              .addHeading('Repository Governance Agent — branch sync')
              .addRaw([
                'Main SHA: ' + context.sha,
                'PRs atualizadas: ' + updated.length,
                'PRs adiadas pelo orçamento: ' + deferred.length,
                'Bloqueios: ' + failures.length,
                '',
                'A sincronização não executa merge nem deploy.',
                JSON.stringify(results, null, 2),
              ].join('\n'))
              .write();

            const mutationFailures = failures.filter(
              (item) =>
                item.reason === 'update_not_confirmed' ||
                String(item.reason || '').startsWith('update_branch_api_')
            );
            if (mutationFailures.length) {
              core.setFailed(
                'Uma ou mais mutações falharam ou não foram confirmadas: ' +
                  JSON.stringify(mutationFailures)
              );
            }
