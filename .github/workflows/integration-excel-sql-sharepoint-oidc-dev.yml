name: Integration Excel SQL SharePoint - DEV OIDC E2E

on:
  workflow_call:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/integration-excel-sql-sharepoint-oidc-dev.yml"
      - "backend/app/services/integration_excel_sql_sharepoint_flow.py"
      - "scripts/integration_excel_sql_sharepoint_dataverse.py"
      - "scripts/integration_excel_sql_sharepoint_oidc_discovery.py"
      - "scripts/integration_excel_sql_sharepoint_e2e_oidc.py"
      - "scripts/integration_excel_sql_sharepoint_e2e_cleanup_oidc.py"
      - "scripts/integration_excel_sql_sharepoint_e2e.py"
      - "tests/test_integration_excel_sql_sharepoint_dataverse.py"
      - "tests/test_integration_excel_sql_sharepoint_oidc_discovery.py"
      - "tests/test_integration_excel_sql_sharepoint_e2e_oidc.py"
      - "tests/test_integration_excel_sql_sharepoint_e2e_cleanup_oidc.py"
      - "tests/test_integration_excel_sql_sharepoint_flow.py"
      - "tests/test_integration_excel_sql_sharepoint_workflow_contract.py"
      - ".sdd/specs/excel-sql-sharepoint-oidc-e2e.spec.json"
      - ".sdd/specs/excel-sql-sharepoint-oidc-e2e.requirements.md"

permissions:
  contents: read
  id-token: write

concurrency:
  group: integration-excel-sql-sharepoint-dev
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 35
    env:
      INTEGRATION_E2E_ENVIRONMENT: dev
      INTEGRATION_E2E_DATAVERSE_URL: https://orge9b920f1.crm2.dynamics.com
      INTEGRATION_E2E_SITE_HINT: reqsys-wsjf-dev
      INTEGRATION_E2E_FILE_HINT: ReqSys-Excel-SQL-SharePoint-DEV.xlsx
      INTEGRATION_E2E_FLOW_DISPLAY_NAME: ReqSys - Excel SQL SharePoint DEV E2E
      INTEGRATION_E2E_SQL_FIXTURE_ID: "990000000000001"
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.12"

      - name: Instalar dependencias minimas
        run: |
          mkdir -p audit/integration-e2e
          python -m pip install --disable-pip-version-check httpx openpyxl pytest

      - name: Validar testes OIDC/Dataverse
        run: |
          pytest -q \
            tests/test_integration_excel_sql_sharepoint_dataverse.py \
            tests/test_integration_excel_sql_sharepoint_oidc_discovery.py \
            tests/test_integration_excel_sql_sharepoint_e2e_oidc.py \
            tests/test_integration_excel_sql_sharepoint_e2e_cleanup_oidc.py \
            tests/test_integration_excel_sql_sharepoint_flow.py \
            tests/test_integration_excel_sql_sharepoint_workflow_contract.py

      - name: Autenticar identidade ReqSys DEV por OIDC
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906
        with:
          client-id: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
          tenant-id: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Obter tokens efemeros Graph e Dataverse
        shell: bash
        run: |
          set -euo pipefail
          graph_token="$(az account get-access-token --resource https://graph.microsoft.com/ --query accessToken -o tsv)"
          dataverse_token="$(az account get-access-token --resource "$INTEGRATION_E2E_DATAVERSE_URL/" --query accessToken -o tsv)"
          test -n "$graph_token"
          test -n "$dataverse_token"
          echo "::add-mask::$graph_token"
          echo "::add-mask::$dataverse_token"
          echo "POWER_PLATFORM_GRAPH_ACCESS_TOKEN=$graph_token" >> "$GITHUB_ENV"
          echo "POWER_PLATFORM_DATAVERSE_ACCESS_TOKEN=$dataverse_token" >> "$GITHUB_ENV"

      - name: Inicializar correlacao
        shell: bash
        run: |
          set -euo pipefail
          echo "E2E_CORRELATION_ID=excel-sql-sharepoint-oidc-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Descobrir recursos DEV sem Power Platform Admin API
        id: discovery
        run: |
          mkdir -p audit/integration-e2e
          python scripts/integration_excel_sql_sharepoint_oidc_discovery.py \
            --output audit/integration-e2e/discovery-oidc.json \
            --github-env "$GITHUB_ENV" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "$E2E_CORRELATION_ID"

      - name: Executar aceite real OIDC
        id: acceptance
        timeout-minutes: 16
        run: |
          python scripts/integration_excel_sql_sharepoint_e2e_oidc.py \
            --output audit/integration-e2e/e2e-oidc.json \
            --cleanup-state "$RUNNER_TEMP/e2e-cleanup-state.json" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "$E2E_CORRELATION_ID" \
            --wait-seconds 420

      - name: Restaurar ambiente DEV e validar cleanup
        if: always() && steps.discovery.outcome == 'success'
        timeout-minutes: 15
        run: |
          python scripts/integration_excel_sql_sharepoint_e2e_cleanup_oidc.py \
            --state "$RUNNER_TEMP/e2e-cleanup-state.json" \
            --output audit/integration-e2e/cleanup-oidc.json

      - name: Publicar evidencias
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: integration-excel-sql-sharepoint-oidc-${{ github.run_id }}
          path: audit/integration-e2e
          if-no-files-found: error
          retention-days: 7
