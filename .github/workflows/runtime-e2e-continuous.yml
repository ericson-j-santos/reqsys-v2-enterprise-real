name: Runtime E2E Continuous â€” DEV

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/runtime-e2e-continuous.yml'
      - 'scripts/planner_teams_runtime_e2e.mjs'
      - 'scripts/tests/planner_teams_runtime_e2e.test.mjs'
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/runtime-e2e-continuous.yml'
      - 'scripts/planner_teams_runtime_e2e.mjs'
      - 'scripts/tests/planner_teams_runtime_e2e.test.mjs'
  schedule:
    # 09:15 BRT (UTC-3), dias Ãºteis.
    - cron: '15 12 * * 1-5'
  workflow_run:
    workflows:
      - Fly DEV Fast Deploy
    types:
      - completed

permissions:
  contents: read

concurrency:
  group: runtime-e2e-continuous-dev-${{ github.event_name == 'pull_request' && github.event.pull_request.number || 'runtime' }}
  cancel-in-progress: true

jobs:
  contract:
    name: Contrato do harness E2E
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout do SHA sob teste
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validar rastreabilidade do SHA
        shell: bash
        env:
          EXPECTED_CHECKOUT_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$EXPECTED_CHECKOUT_SHA"
          observed_sha="$(GITHUB_SHA="$actual_sha" node -p 'process.env.GITHUB_SHA')"
          test "$observed_sha" = "$actual_sha"

      - name: Executar testes determinÃ­sticos do harness
        run: node --test scripts/tests/planner_teams_runtime_e2e.test.mjs

  planner-teams-runtime:
    name: Planner â†’ Teams â€” E2E contÃ­nuo DEV
    needs: contract
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'))
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 12
    env:
      TARGET_ENVIRONMENT: dev
      POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
      POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
      POWER_PLATFORM_CLIENT_SECRET: ${{ secrets.POWER_PLATFORM_CLIENT_SECRET }}
      WSJF_DEV_PLAN_ID: ${{ vars.WSJF_DEV_PLAN_ID }}
      WSJF_DEV_BUCKET_ID: ${{ vars.WSJF_DEV_BUCKET_ID }}
      PLANNER_TEAMS_DEV_TEAM_ID: 07936381-2d94-41db-9f46-a7b28008caba
      PLANNER_TEAMS_DEV_CHANNEL_ID: 19:ZW3ncXvFEGrJY-9yHd2MuFiRstJ8TQGmz2Fr_KUXqCI1@thread.tacv2
      PLANNER_TEAMS_POLL_SECONDS: '420'
      PLANNER_TEAMS_RUN_POLL_INTERVAL_MS: '30000'
      PLANNER_TEAMS_SETTLE_SECONDS: '45'
      EVIDENCE_PATH: audit/runtime-e2e/planner-teams/acceptance.json

    steps:
      - name: Checkout do SHA implantado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Identificar identidade E2E sem expor segredo
        shell: bash
        run: |
          case "$POWER_PLATFORM_CLIENT_ID" in
            4061c542-cdc1-4007-ab57-40ab8f9109fc) echo 'E2E_IDENTITY=ReqSys Enterprise' ;;
            a02a473b-19c1-4579-b482-c83e11cc0f4e) echo 'E2E_IDENTITY=Portals-ReqSys IA' ;;
            cb8c924f-70ce-4e5b-a1a7-290c73ca3953) echo 'E2E_IDENTITY=ReqSys ALM Pipeline' ;;
            cc233a8b-e2dc-425c-bbb2-afcc876a865d) echo 'E2E_IDENTITY=ReqSys Teams Bot DEV' ;;
            1c58f055-7b06-4a8a-a607-dd9070a5ee94) echo 'E2E_IDENTITY=reqsys-teams-bot-dev' ;;
            7fa03e05-86f4-4421-91fc-4bfb3750236b) echo 'E2E_IDENTITY=reqsys-automation' ;;
            *) echo 'E2E_IDENTITY=UNKNOWN' ;;
          esac
      - name: Executar prova real Planner â†’ Teams
        shell: bash
        env:
          EXPECTED_EVIDENCE_SHA: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [ "$actual_sha" != "$EXPECTED_EVIDENCE_SHA" ]; then
            echo "::error::SHA efetivamente executado diverge do SHA esperado: actual=$actual_sha expected=$EXPECTED_EVIDENCE_SHA"
            exit 42
          fi
          # O GITHUB_SHA do evento workflow_run aponta para a revisÃ£o do workflow na
          # default branch, nÃ£o necessariamente para o SHA implantado. O processo do
          # harness recebe explicitamente o HEAD efetivamente executado para que o
          # artifact nÃ£o atribua a evidÃªncia a outra revisÃ£o.
          GITHUB_SHA="$actual_sha" node scripts/planner_teams_runtime_e2e.mjs

      - name: Publicar evidÃªncia auditÃ¡vel
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-e2e-planner-teams-${{ github.run_id }}-attempt-${{ github.run_attempt }}
          path: ${{ env.EVIDENCE_PATH }}
          if-no-files-found: warn
          retention-days: 30

      - name: Resumo operacional
        if: always()
        shell: bash
        run: |
          echo '## Runtime E2E â€” Planner â†’ Teams DEV' >> "$GITHUB_STEP_SUMMARY"
          echo '- Disparo: ${{ github.event_name }}' >> "$GITHUB_STEP_SUMMARY"
          echo '- Ambiente: DEV' >> "$GITHUB_STEP_SUMMARY"
          echo "- SHA efetivamente executado: $(git rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
          echo '- Timeout de observaÃ§Ã£o: 420 s' >> "$GITHUB_STEP_SUMMARY"
          echo '- PolÃ­tica: tarefa normal Ã© controle positivo; tarefa REQSYS-E2E-* deve permanecer ausente no Teams.' >> "$GITHUB_STEP_SUMMARY"
          echo '- Sem login por device code e sem reprovisionamento de flow.' >> "$GITHUB_STEP_SUMMARY"

