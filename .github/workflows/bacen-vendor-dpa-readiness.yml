name: BACEN Vendor DPA Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml"
      - "governance/bacen/VENDOR-DPA-READINESS.yaml"
      - "governance/bacen/BACEN-05-LIFECYCLE.yaml"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_vendor_dpa_readiness.py"
      - "scripts/consolidate_bacen_05_evidence.py"
      - "tests/test_bacen_05_deferred_vendor_governance.py"
      - ".github/workflows/bacen-vendor-dpa-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml"
      - "governance/bacen/VENDOR-DPA-READINESS.yaml"
      - "governance/bacen/BACEN-05-LIFECYCLE.yaml"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_vendor_dpa_readiness.py"
      - "scripts/consolidate_bacen_05_evidence.py"
      - "tests/test_bacen_05_deferred_vendor_governance.py"
      - ".github/workflows/bacen-vendor-dpa-readiness.yml"
  schedule:
    - cron: "17 9 1 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-vendor-dpa-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assess:
    name: BACEN-05 Vendor DPA Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML pytest

      - name: Compile and test lifecycle behavior
        run: |
          python -m py_compile scripts/generate_bacen_vendor_dpa_readiness.py
          python -m py_compile scripts/consolidate_bacen_05_evidence.py
          python -m pytest tests/test_bacen_05_deferred_vendor_governance.py -q

      - name: Generate readiness evidence
        run: |
          python scripts/generate_bacen_vendor_dpa_readiness.py \
            --register governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml \
            --manifest governance/bacen/VENDOR-DPA-READINESS.yaml \
            --output artifacts/bacen/bacen-05-vendor-dpa-readiness.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("artifacts/bacen/bacen-05-vendor-dpa-readiness.json").read_text())
          assert evidence["control_id"] == "BACEN-05"
          assert evidence["technical_readiness_passed"] is True
          assert evidence["control_status"] in {"partial", "implemented"}
          assert evidence["lifecycle_stage"] == "DEVELOPMENT"
          assert evidence["readiness_status"] == "deferred_until_institutionalization"
          assert evidence["human_action_required"] is False
          assert evidence["external_evidence_required"] is False
          assert evidence["production_gate_blocking"] is False
          assert len(evidence["register_sha256"]) == 64
          assert len(evidence["manifest_sha256"]) == 64
          assert evidence["production_touched"] is False
          print("BACEN-05 vendor DPA readiness evidence: valid")
          PY

      - name: Publish readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-05-vendor-dpa-readiness
          path: artifacts/bacen/bacen-05-vendor-dpa-readiness.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-05-vendor-dpa-readiness.json")
          print("## BACEN-05 — Prontidão documental de terceiros")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text())
          summary = evidence["summary"]
          print(f"\n- Fornecedores registrados: **{summary['registered_vendors']}**")
          print(f"- Aprovações formais completas: **{summary['formally_approved_vendors']}**")
          print(f"- Pendências documentais: **{summary['pending_vendors']}**")
          print(f"- Lifecycle: **{evidence['lifecycle_stage']}**")
          print(f"- Prontidão: **{evidence['readiness_status']}**")
          print(f"- Ação humana agora: **{evidence['human_action_required']}**")
          print(f"- Prontidão técnica: **{evidence['technical_readiness_passed']}**")
          print(f"- Status do controle: **{evidence['control_status']}**")
          print("- Modo: **advisory**")
          print("- Produção acessada: **false**")
          PY
