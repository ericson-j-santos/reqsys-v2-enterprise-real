name: Schema Runtime Validation

on:
  pull_request:
    paths:
      - "runtime/**"
      - "tests/schema_runtime/**"
      - "examples/runtime/**"
      - "schemas/**"
      - "docs/schema-registry.json"
      - ".github/workflows/schema-runtime-validation.yaml"
  push:
    branches:
      - "main"
    paths:
      - "runtime/**"
      - "tests/schema_runtime/**"
      - "examples/runtime/**"
      - "schemas/**"
      - "docs/schema-registry.json"
      - ".github/workflows/schema-runtime-validation.yaml"

jobs:
  schema-runtime-validation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.11"

      - name: Run schema runtime enforcement tests
        shell: bash
        run: |
          set -euo pipefail
          python tests/schema_runtime/test_schema_runtime_enforcer.py

      - name: Validate runtime valid fixture through CLI
        shell: bash
        run: |
          set -euo pipefail
          python runtime/schema_runtime_enforcer.py \
            product-intelligence-event \
            examples/runtime/product-intelligence-event.runtime.valid.json \
            --correlation-id ci-runtime-valid

      - name: Validate runtime invalid fixture is blocked
        shell: bash
        run: |
          set -euo pipefail
          if python runtime/schema_runtime_enforcer.py \
            product-intelligence-event \
            examples/runtime/product-intelligence-event.runtime.invalid-extra-field.json \
            --correlation-id ci-runtime-invalid; then
            echo "Invalid runtime fixture unexpectedly passed"
            exit 1
          fi
