name: Teams Flow Bot Promotion

on:
  workflow_dispatch:
    inputs:
      ambiente_logico:
        required: true
        default: 'test'
        type: choice
        options: [test, prod]
      environment_url_destino:
        required: true
        type: string
      connection_id_destino:
        required: true
        type: string
      connection_reference_logical_name:
        required: true
        type: string
      solution_name:
        required: true
        default: 'robo_envia_teamsv2'
        type: string
      novo_flow_display_name:
        required: true
        default: 'robo_envia_teamsv2'
        type: string
      managed:
        required: true
        default: true
        type: boolean
      confirmation:
        required: true
        type: string
      approve_producao:
        required: false
        default: ''
        type: string
      issue_number:
        required: false
        default: ''
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: ai-conversation-readiness-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  readiness-probe:
    name: AI Conversations readiness DEV — somente leitura
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: reqsys-power-platform-dev
    env:
      REQSYS_API_BASE_URL: ${{ secrets.REQSYS_API_BASE_URL }}
      REQSYS_API_SERVICE_TOKEN: ${{ secrets.REQSYS_API_SERVICE_TOKEN }}
    steps:
      - name: Validar secrets sem expor valores
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:REQSYS_API_BASE_URL)) { throw 'REQSYS_API_BASE_URL_MISSING' }
          if ([string]::IsNullOrWhiteSpace($env:REQSYS_API_SERVICE_TOKEN)) { throw 'REQSYS_API_SERVICE_TOKEN_MISSING' }
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null

      - name: Consultar readiness autenticado
        id: probe
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ 'X-Service-Token' = $env:REQSYS_API_SERVICE_TOKEN }
          $url = $env:REQSYS_API_BASE_URL.TrimEnd('/') + '/v1/teams-gateway/ai-conversations/readiness'
          try {
            $response = Invoke-RestMethod -Method Get -Uri $url -Headers $headers
            $json = $response | ConvertTo-Json -Depth 20
            $json | Set-Content artifacts/ai-conversation-readiness.json -Encoding utf8
            $data = $response.data
            if ($null -eq $data) { throw 'READINESS_ENVELOPE_INVALID' }
            Write-Host "status=$($data.status) ready=$($data.ready) references=$($data.conversation_references)"
            $codes = @($data.bloqueios | ForEach-Object { $_.codigo })
            if ($codes -contains 'CONVERSATION_REFERENCE_AUSENTE') { throw 'CONVERSATION_REFERENCE_AUSENTE' }
            if ($codes -contains 'DESTINATARIO_SEM_CONVERSATION_REFERENCE') { throw 'DESTINATARIO_SEM_CONVERSATION_REFERENCE' }
          } catch {
            $status = $null
            if ($_.Exception.Response) { $status = [int]$_.Exception.Response.StatusCode }
            $safe = [ordered]@{ success = $false; http_status = $status; error_type = $_.Exception.GetType().Name }
            $safe | ConvertTo-Json | Set-Content artifacts/ai-conversation-readiness-error.json -Encoding utf8
            if ($status -eq 403) { throw 'SERVICE_TOKEN_SCOPE_INSUFFICIENT' }
            if ($status -eq 401) { throw 'SERVICE_TOKEN_INVALID_OR_EXPIRED' }
            throw
          }

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-conversation-readiness-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*.json
          if-no-files-found: warn
          retention-days: 30
