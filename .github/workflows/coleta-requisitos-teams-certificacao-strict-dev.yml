name: Certificacao estrita - Coleta Requisitos Teams DEV

on:
  workflow_dispatch:
  push:
    branches:
      - test/teams-e2e-certificacao-strict
    paths:
      - .github/workflows/coleta-requisitos-teams-certificacao-strict-dev.yml

permissions:
  contents: read

env:
  BASE_URL: https://reqsys-api-dev.fly.dev
  ARTIFACT_DIR: artifacts/coleta-requisitos-teams-certificacao-strict-dev
  CORRELATION_ID: coleta-cert-strict-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  certificar:
    name: Coleta -> fila -> gateway -> Teams ENVIADO -> Dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Executar certificacao fail-closed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          python - <<'PY'
          import copy
          import json
          import os
          from pathlib import Path
          from urllib.error import HTTPError
          from urllib.request import Request, urlopen

          base = os.environ['BASE_URL'].rstrip('/')
          correlation = os.environ['CORRELATION_ID']
          out = Path(os.environ['ARTIFACT_DIR'])

          def call(method, path, payload=None):
              body = json.dumps(payload, ensure_ascii=False).encode('utf-8') if payload is not None else None
              headers = {'Accept': 'application/json', 'X-Correlation-ID': correlation}
              if body is not None:
                  headers['Content-Type'] = 'application/json; charset=utf-8'
              req = Request(base + path, data=body, method=method, headers=headers)
              try:
                  with urlopen(req, timeout=30) as response:
                      raw = response.read().decode('utf-8')
                      status = response.status
              except HTTPError as exc:
                  raw = exc.read().decode('utf-8', errors='replace')
                  status = exc.code
              data = json.loads(raw) if raw else {}
              if status != 200:
                  raise RuntimeError(f'{method} {path}: HTTP {status}: {raw[:500]}')
              return data

          build = call('GET', '/api/runtime/build-info').get('data', {})
          gateway = call('GET', '/v1/teams-gateway/status').get('data', {})
          webhook = next((r for r in gateway.get('rotas', []) if r.get('canal') == 'webhook'), {})
          webhook_disponivel = webhook.get('disponivel') is True

          evidence = {
              'schema_version': '1.0.0',
              'contract': 'reqsys-coleta-requisitos-teams-certificacao-strict-dev',
              'correlation_id': correlation,
              'runtime': {
                  'build_sha': build.get('build_sha') or build.get('commit_sha'),
              },
              'gateway': {
                  'webhook_disponivel': webhook_disponivel,
                  'campos_faltantes': webhook.get('campos_faltantes', []),
              },
              'refinamento': None,
              'geracao': None,
              'dashboard': None,
              'bloqueios': [],
              'certificado': False,
          }

          if not webhook_disponivel:
              evidence['bloqueios'].append('Gateway webhook indisponivel no DEV; entrega Teams nao pode ser certificada.')
              out.joinpath('evidence.json').write_text(
                  json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
              )
              print(json.dumps(evidence, ensure_ascii=False, indent=2))
              raise SystemExit('CERTIFICACAO BLOQUEADA: webhook Teams indisponivel; nenhum evento sintetico foi criado.')

          chave = f"cert-strict-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          payload = {
              'versao_contrato': '1.0.0',
              'chave_idempotencia': chave,
              'origem': 'reqsys',
              'solicitante': 'Teste E2E automatizado',
              'area': 'Engenharia ReqSys',
              'sistema': 'ReqSys',
              'tipo_demanda': 'automacao',
              'problema': 'TESTE E2E DEV: certificar acompanhamento governado da coleta ate o Microsoft Teams.',
              'objetivo': 'Comprovar fila, gateway, entrega ENVIADO e Dashboard com correlacao ponta a ponta.',
              'usuario_afetado': 'Equipe ReqSys',
              'processo_atual': None,
              'cenario_desejado': 'Eventos da coleta devem ser entregues pelo gateway governado e refletidos no Dashboard.',
              'regras_negocio': [],
              'criterios_aceite': ['A coleta em refinamento deve produzir acompanhamento rastreavel.'],
              'dados_necessarios': [],
              'integracoes': [],
              'restricoes': [],
              'impacto_regulatorio': False,
              'urgencia': 'baixa',
              'data_limite': None,
              'referencia_externa': None,
              'observacoes': '[TESTE E2E DEV] Nao representa demanda funcional real.'
          }

          ref = call('POST', '/api/requisitos/coleta/previsualizar', payload).get('data', {})
          ref_eval = ref.get('avaliacao') or {}
          ref_teams = ref.get('acompanhamento_teams') or {}

          completo = copy.deepcopy(payload)
          completo.update({
              'processo_atual': 'A certificacao exige prova automatica ponta a ponta.',
              'regras_negocio': ['Toda entrega automatica deve usar a fila central e preservar correlation_id.'],
              'criterios_aceite': [
                  'O requisito deve atingir o gate de qualidade antes da geracao.',
                  'O evento gerado deve ficar ENVIADO no Teams e aparecer no Dashboard.'
              ],
              'dados_necessarios': ['correlation_id e estado da entrega'],
              'referencia_externa': f"GHA-CERT-{os.environ['GITHUB_RUN_ID']}-{os.environ['GITHUB_RUN_ATTEMPT']}"
          })
          ger = call('POST', '/api/requisitos/coleta/gerar', completo).get('data', {})
          ger_eval = ger.get('avaliacao') or {}
          ger_teams = ger.get('acompanhamento_teams') or {}
          requisito = ger.get('requisito') or {}
          dash = call('GET', '/v1/dashboard/coleta-requisitos?janela_dias=1').get('data', {})
          dash_teams = dash.get('acompanhamento_teams') or {}

          evidence['refinamento'] = {
              'pontuacao': ref_eval.get('pontuacao'),
              'classificacao': ref_eval.get('classificacao'),
              'id_evento': ref_teams.get('id_evento'),
              'status_evento': ref_teams.get('status_evento'),
              'status_http': ref_teams.get('status_http'),
              'canal_usado': ref_teams.get('canal_usado'),
              'correlation_id': ref_teams.get('correlation_id'),
          }
          evidence['geracao'] = {
              'pontuacao': ger_eval.get('pontuacao'),
              'classificacao': ger_eval.get('classificacao'),
              'requisito_codigo': requisito.get('codigo'),
              'id_evento': ger_teams.get('id_evento'),
              'status_evento': ger_teams.get('status_evento'),
              'status_http': ger_teams.get('status_http'),
              'canal_usado': ger_teams.get('canal_usado'),
              'correlation_id': ger_teams.get('correlation_id'),
          }
          evidence['dashboard'] = dash_teams

          if ref_eval.get('pronto_para_gerar') is not False:
              evidence['bloqueios'].append('Primeira coleta nao ficou em refinamento.')
          if ref_teams.get('status_evento') != 'ENVIADO':
              evidence['bloqueios'].append(f"Refinamento={ref_teams.get('status_evento')}")
          if ger_eval.get('pronto_para_gerar') is not True or not requisito.get('codigo'):
              evidence['bloqueios'].append('Geracao do requisito nao atingiu o contrato.')
          if ger_teams.get('status_evento') != 'ENVIADO':
              evidence['bloqueios'].append(f"Geracao={ger_teams.get('status_evento')}")
          if ref_teams.get('correlation_id') != correlation or ger_teams.get('correlation_id') != correlation:
              evidence['bloqueios'].append('correlation_id divergente.')
          if not ref_teams.get('id_evento') or ref_teams.get('id_evento') == ger_teams.get('id_evento'):
              evidence['bloqueios'].append('Eventos de refinamento e geracao nao sao independentes.')
          if dash_teams.get('fonte') != 'teams_notification_queue':
              evidence['bloqueios'].append('Dashboard nao usa a fila central.')
          if int(dash_teams.get('enviadas') or 0) < 2 or not dash_teams.get('ultima_entrega_em'):
              evidence['bloqueios'].append('Dashboard nao evidencia pelo menos duas entregas Teams.')

          evidence['certificado'] = not evidence['bloqueios']
          out.joinpath('evidence.json').write_text(
              json.dumps(evidence, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )
          print(json.dumps(evidence, ensure_ascii=False, indent=2))
          if not evidence['certificado']:
              raise SystemExit('CERTIFICACAO BLOQUEADA: ' + '; '.join(evidence['bloqueios']))
          PY

      - name: Publicar evidencia de certificacao
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coleta-requisitos-teams-certificacao-strict-dev-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coleta-requisitos-teams-certificacao-strict-dev/
          if-no-files-found: error
          retention-days: 30
