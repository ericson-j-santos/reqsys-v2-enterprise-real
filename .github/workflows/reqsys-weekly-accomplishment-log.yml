name: ReqSys Weekly Accomplishment Log

on:
  schedule:
    - cron: "0 12 * * 5"
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

concurrency:
  group: reqsys-weekly-accomplishment-log
  cancel-in-progress: false

jobs:
  generate:
    name: Gerar log semanal baseado em evidências
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validar gerador
        run: python -m unittest -v tests/test_reqsys_weekly_accomplishment_log.py

      - name: Restaurar último snapshot comparável
        shell: bash
        run: |
          set -euo pipefail
          previous_dir="artifacts/reqsys-weekly-accomplishment-log/previous"
          mkdir -p "$previous_dir"
          run_id="$(gh run list             --workflow reqsys-weekly-accomplishment-log.yml             --branch main             --status success             --limit 1             --json databaseId             --jq '.[0].databaseId // empty' || true)"
          if [[ -n "$run_id" ]]; then
            gh run download "$run_id"               --name reqsys-weekly-accomplishment-log               --dir "$previous_dir" || true
          fi

      - name: Gerar relatório
        shell: bash
        run: |
          set -euo pipefail
          previous="artifacts/reqsys-weekly-accomplishment-log/previous/reqsys-weekly-accomplishment-log.json"
          args=()
          if [[ -f "$previous" ]]; then
            args+=(--previous "$previous")
          fi
          python scripts/reqsys_weekly_accomplishment_log.py "${args[@]}"

      - name: Publicar resumo no run
        if: always()
        shell: bash
        run: |
          report="artifacts/reqsys-weekly-accomplishment-log/reqsys-weekly-accomplishment-log.md"
          if [[ -f "$report" ]]; then
            cat "$report" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reqsys-weekly-accomplishment-log
          path: |
            artifacts/reqsys-weekly-accomplishment-log/reqsys-weekly-accomplishment-log.json
            artifacts/reqsys-weekly-accomplishment-log/reqsys-weekly-accomplishment-log.md
          if-no-files-found: error
          retention-days: 90
