name: STG Enforcement Approval

on:
  workflow_dispatch:
    inputs:
      decision:
        description: Human governance decision
        required: true
        default: reject
        type: choice
        options: [approve, reject]
      approval_scope:
        description: Governed scope of the human decision
        required: true
        default: policy_change
        type: choice
        options: [policy_change, exception_retirement]
      policy_pr_number:
        description: Pull request containing the STG policy change
        required: true
        type: string
      rationale:
        description: Human decision rationale
        required: true
        type: string
      ticket:
        description: Governance ticket or change record
        required: true
        type: string
      history_run_id:
        description: Successful Environment Promotion History run ID
        required: true
        type: string

permissions:
  actions: read
  contents: read
  pull-requests: read

concurrency:
  group: stg-enforcement-approval-${{ inputs.policy_pr_number }}-${{ inputs.history_run_id }}
  cancel-in-progress: false

jobs:
  approve:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install focused test dependency
        run: python -m pip install --disable-pip-version-check "pytest>=8.2,<9"

      - name: Run focused tests
        run: python -m pytest -q tests/test_build_stg_enforcement_approval.py tests/test_validate_stg_policy_approval.py

      - name: Resolve human approval context
        id: context
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHENTICATED_ACTOR: ${{ github.actor }}
          AUTHENTICATED_ACTOR_TYPE: ${{ github.event.sender.type }}
          INPUT_DECISION: ${{ inputs.decision }}
          INPUT_APPROVAL_SCOPE: ${{ inputs.approval_scope }}
          INPUT_POLICY_PR: ${{ inputs.policy_pr_number }}
          INPUT_RATIONALE: ${{ inputs.rationale }}
          INPUT_TICKET: ${{ inputs.ticket }}
          INPUT_RUN_ID: ${{ inputs.history_run_id }}
        run: |
          set -euo pipefail

          case "$INPUT_POLICY_PR" in
            ''|*[!0-9]*) echo "::error::policy_pr_number must be numeric"; exit 1 ;;
          esac
          case "$INPUT_RUN_ID" in
            ''|*[!0-9]*) echo "::error::history_run_id must be numeric"; exit 1 ;;
          esac
          case "$INPUT_DECISION" in
            approve|reject) ;;
            *) echo "::error::decision must be approve or reject"; exit 1 ;;
          esac
          case "$INPUT_APPROVAL_SCOPE" in
            policy_change|exception_retirement) ;;
            *) echo "::error::approval_scope is invalid"; exit 1 ;;
          esac

          rationale="$(printf '%s' "$INPUT_RATIONALE" | tr '\r\n' '  ')"
          ticket="$(printf '%s' "$INPUT_TICKET" | tr '\r\n' '  ')"
          test "${#rationale}" -ge 10 || { echo "::error::rationale must contain at least 10 characters"; exit 1; }
          test -n "$ticket" || { echo "::error::ticket is required"; exit 1; }
          if [ "${ticket^^}" = "REQSYS-TEMP-AUTO-APPROVAL" ]; then
            echo "::error::temporary automated approval tickets are forbidden"
            exit 1
          fi
          if [ -z "$AUTHENTICATED_ACTOR" ] || [[ "${AUTHENTICATED_ACTOR,,}" == *"[bot]" ]]; then
            echo "::error::STG approval requires an authenticated human GitHub actor"
            exit 1
          fi
          if [ "$AUTHENTICATED_ACTOR_TYPE" != "User" ]; then
            echo "::error::STG approval sender must be a GitHub User; type=${AUTHENTICATED_ACTOR_TYPE:-missing}"
            exit 1
          fi

          pr_json="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_POLICY_PR}")"
          pr_state="$(jq -r '.state' <<<"$pr_json")"
          source_sha="$(jq -r '.head.sha // empty' <<<"$pr_json")"
          base_sha="$(jq -r '.base.sha // empty' <<<"$pr_json")"
          base_ref="$(jq -r '.base.ref // empty' <<<"$pr_json")"
          head_ref="$(jq -r '.head.ref // empty' <<<"$pr_json")"
          if [ "$pr_state" != "open" ]; then
            echo "::error::Policy PR #${INPUT_POLICY_PR} must be open; state=${pr_state}"
            exit 1
          fi
          [[ "$source_sha" =~ ^[0-9a-fA-F]{40}$ ]] || {
            echo "::error::Unable to resolve the full head SHA for policy PR #${INPUT_POLICY_PR}"
            exit 1
          }

          if [ "$INPUT_APPROVAL_SCOPE" = "exception_retirement" ]; then
            transition="$(jq -c '.exception_retirement_transition' docs/contracts/stg-blocking-change-authorization.json)"
            expected_reference="$(jq -r '.reference // empty' <<<"$transition")"
            expected_scope="$(jq -r '.approval_scope // empty' <<<"$transition")"
            expected_base_sha="$(jq -r '.required_base_sha // empty' <<<"$transition")"
            expected_head_ref="$(jq -r '.required_head_ref // empty' <<<"$transition")"
            reusable="$(jq -r '.reusable' <<<"$transition")"
            if [ "$expected_reference" != "GH-RUN-32615688406" ] \
              || [ "$expected_scope" != "exception_retirement" ] \
              || [ "$expected_base_sha" != "4dd44b064b6099eba78a88ad84d7e465345e11dd" ] \
              || [ "$expected_head_ref" != "hotfix/retire-stg-temporary-exception" ] \
              || [ "$reusable" != "false" ]; then
              echo "::error::Exception retirement transition contract is invalid"
              exit 1
            fi
            if [ "$base_ref" != "main" ] || [ "$base_sha" != "$expected_base_sha" ] || [ "$head_ref" != "$expected_head_ref" ]; then
              echo "::error::Exception retirement approval is restricted to the one-time governed transition"
              exit 1
            fi

            mapfile -t changed_files < <(
              gh api --paginate --slurp "repos/${GITHUB_REPOSITORY}/pulls/${INPUT_POLICY_PR}/files?per_page=100" \
                --jq '.[][] | .filename'
            )
            allowed_files=(
              ".github/workflows/governed-pr-sync.yml"
              ".github/workflows/stg-blocking-policy-authorization.yml"
              ".github/workflows/stg-enforcement-approval.yml"
              ".github/workflows/stg-post-merge-validation.yml"
              ".github/workflows/stg-temporary-exception-retirement.yml"
              ".github/workflows/workflow-regression-contracts.yml"
              "AGENTS.md"
              "artifacts/agent-increment-gate/agent-increment-gate.json"
              "docs/contracts/stg-blocking-change-authorization.json"
              "docs/contracts/stg-enforcement-approval.md"
              "scripts/build_stg_enforcement_approval.py"
              "scripts/validate_stg_policy_approval.py"
              "scripts/validate_workflow_regression_contracts.py"
              "tests/test_build_stg_enforcement_approval.py"
              "tests/test_validate_stg_policy_approval.py"
            )
            required_files=(
              ".github/workflows/stg-blocking-policy-authorization.yml"
              ".github/workflows/stg-enforcement-approval.yml"
              ".github/workflows/stg-temporary-exception-retirement.yml"
              "docs/contracts/stg-blocking-change-authorization.json"
              "scripts/build_stg_enforcement_approval.py"
              "scripts/validate_stg_policy_approval.py"
            )
            declare -A allowed=()
            declare -A changed=()
            for path in "${allowed_files[@]}"; do allowed["$path"]=1; done
            for path in "${changed_files[@]}"; do
              changed["$path"]=1
              if [ -z "${allowed[$path]+x}" ]; then
                echo "::error::File outside exception retirement scope: $path"
                exit 1
              fi
            done
            for path in "${required_files[@]}"; do
              if [ -z "${changed[$path]+x}" ]; then
                echo "::error::Required exception retirement file is unchanged: $path"
                exit 1
              fi
            done
          fi

          history_run_json="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${INPUT_RUN_ID}")"
          history_name="$(jq -r '.name // empty' <<<"$history_run_json")"
          history_conclusion="$(jq -r '.conclusion // empty' <<<"$history_run_json")"
          history_repository="$(jq -r '.head_repository.full_name // empty' <<<"$history_run_json")"
          if [ "$history_name" != "Environment Promotion History" ] || [ "$history_conclusion" != "success" ]; then
            echo "::error::history_run_id must identify a successful Environment Promotion History run"
            exit 1
          fi
          if [ -n "$history_repository" ] && [ "$history_repository" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::History evidence belongs to another repository: ${history_repository}"
            exit 1
          fi

          echo "decision=$INPUT_DECISION" >> "$GITHUB_OUTPUT"
          echo "approval_scope=$INPUT_APPROVAL_SCOPE" >> "$GITHUB_OUTPUT"
          echo "policy_pr_number=$INPUT_POLICY_PR" >> "$GITHUB_OUTPUT"
          echo "rationale=$rationale" >> "$GITHUB_OUTPUT"
          echo "ticket=$ticket" >> "$GITHUB_OUTPUT"
          echo "history_run_id=$INPUT_RUN_ID" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "approver=github:${AUTHENTICATED_ACTOR}" >> "$GITHUB_OUTPUT"
          echo "approver_type=$AUTHENTICATED_ACTOR_TYPE" >> "$GITHUB_OUTPUT"
          echo "approval_mode=human_workflow_dispatch" >> "$GITHUB_OUTPUT"

      - name: Download immutable maturity evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HISTORY_RUN_ID: ${{ steps.context.outputs.history_run_id }}
        run: |
          set -euo pipefail
          mkdir -p .tmp/history artifacts/stg-enforcement-approval
          gh run download "$HISTORY_RUN_ID" -n environment-promotion-history -D .tmp/history
          HISTORY_FILE="$(find .tmp/history -name history.json -print -quit)"
          test -n "$HISTORY_FILE" || { echo "::error::history.json not found in immutable evidence"; exit 1; }
          cp "$HISTORY_FILE" .tmp/history.json

      - name: Build approval record
        env:
          DECISION: ${{ steps.context.outputs.decision }}
          APPROVAL_SCOPE: ${{ steps.context.outputs.approval_scope }}
          APPROVER: ${{ steps.context.outputs.approver }}
          APPROVER_TYPE: ${{ steps.context.outputs.approver_type }}
          RATIONALE: ${{ steps.context.outputs.rationale }}
          TICKET: ${{ steps.context.outputs.ticket }}
          POLICY_PR_NUMBER: ${{ steps.context.outputs.policy_pr_number }}
          HISTORY_RUN_ID: ${{ steps.context.outputs.history_run_id }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
        run: |
          python scripts/build_stg_enforcement_approval.py \
            --history .tmp/history.json \
            --decision "$DECISION" \
            --approval-scope "$APPROVAL_SCOPE" \
            --approver "$APPROVER" \
            --approver-type "$APPROVER_TYPE" \
            --rationale "$RATIONALE" \
            --ticket "$TICKET" \
            --source-pr-number "$POLICY_PR_NUMBER" \
            --source-run-id "$HISTORY_RUN_ID" \
            --source-sha "$SOURCE_SHA" \
            --output artifacts/stg-enforcement-approval/approval.json

      - name: Validate generated approval record
        env:
          DECISION: ${{ steps.context.outputs.decision }}
          APPROVAL_SCOPE: ${{ steps.context.outputs.approval_scope }}
          POLICY_PR_NUMBER: ${{ steps.context.outputs.policy_pr_number }}
          HISTORY_RUN_ID: ${{ steps.context.outputs.history_run_id }}
          SOURCE_SHA: ${{ steps.context.outputs.source_sha }}
        run: |
          set +e
          python scripts/validate_stg_policy_approval.py \
            --approval artifacts/stg-enforcement-approval/approval.json \
            --expected-sha "$SOURCE_SHA" \
            --expected-run-id "$HISTORY_RUN_ID" \
            --expected-pr-number "$POLICY_PR_NUMBER" \
            --expected-scope "$APPROVAL_SCOPE" \
            --output artifacts/stg-enforcement-approval/validation.json
          validation_exit=$?
          set -e

          if [ "$DECISION" = "approve" ]; then
            exit "$validation_exit"
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          approval = json.loads(Path('artifacts/stg-enforcement-approval/approval.json').read_text(encoding='utf-8'))
          if approval.get('requested_decision') != 'reject' or approval.get('status') != 'rejected':
              raise SystemExit('rejection record is inconsistent')
          if approval.get('effective_approval') is not False:
              raise SystemExit('rejection must never be effective')
          PY

      - name: Publish decision summary
        if: always()
        env:
          APPROVAL_MODE: ${{ steps.context.outputs.approval_mode }}
          APPROVAL_SCOPE: ${{ steps.context.outputs.approval_scope }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          path = Path('artifacts/stg-enforcement-approval/approval.json')
          data = json.loads(path.read_text(encoding='utf-8')) if path.exists() else {}
          approval = data.get('approval') or {}
          evidence = data.get('evidence') or {}
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as out:
              out.write('# STG Enforcement Approval\n\n')
              out.write(f"- Status: **{data.get('status', 'unresolved')}**\n")
              out.write(f"- Effective approval: **{data.get('effective_approval', False)}**\n")
              out.write(f"- Approval mode: **{os.environ.get('APPROVAL_MODE', 'unresolved')}**\n")
              out.write(f"- Approval scope: **{os.environ.get('APPROVAL_SCOPE', 'unresolved')}**\n")
              out.write(f"- Policy PR: **#{evidence.get('source_pr_number', 'unresolved')}**\n")
              out.write(f"- Policy SHA: `{evidence.get('source_sha', 'unresolved')}`\n")
              out.write(f"- Approver: **{approval.get('approver', 'unresolved')}**\n")
              out.write(f"- Ticket: **{approval.get('ticket', 'unresolved')}**\n")
              out.write(f"- Evidence maturity: **{evidence.get('maturity_status', 'unresolved')}**\n")
              out.write(f"- Next action: **{data.get('next_action', 'unresolved')}**\n")
              out.write('- Automatic policy change: **disabled**\n')
              out.write('- Automatic deploy: **disabled**\n')
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: stg-enforcement-approval
          path: artifacts/stg-enforcement-approval/
          retention-days: 365
