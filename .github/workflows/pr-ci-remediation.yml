name: PR CI Remediation

on:
  workflow_run:
    workflows:
      - "CI — ReqSys v2 Enterprise"
      - "CI Enterprise Fast"
      - "Pre-PR Readiness Gate"
    types: [completed]
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "Modo do ciclo"
        required: true
        default: "execute"
        type: choice
        options:
          - audit
          - execute

permissions:
  actions: write
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-ci-remediation-${{ github.event.workflow_run.pull_requests[0].number || github.run_id }}
  cancel-in-progress: true

jobs:
  remediation:
    name: Detectar, tratar e escalar CIs vermelhos
    if: >-
      github.event_name != 'workflow_run' ||
      (
        github.event.workflow_run.event == 'pull_request' &&
        github.event.workflow_run.pull_requests[0].number
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Validar política e testes do motor
        run: |
          set -euo pipefail
          python -m json.tool .github/ci-remediation.json >/dev/null
          python -m unittest -v tests/test_pr_ci_remediation.py

      - name: Executar ciclo governado
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MODE: ${{ github.event_name == 'workflow_run' && 'execute' || github.event.inputs.mode || 'execute' }}
          EVENT_PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number || '' }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha || '' }}
        run: |
          set -euo pipefail
          args=(
            --repo "${GITHUB_REPOSITORY}"
            --policy .github/ci-remediation.json
            --output-dir artifacts/pr-ci-remediation
          )
          if [[ "${MODE}" == "execute" ]]; then
            args+=(--execute)
          fi
          if [[ -n "${EVENT_PR_NUMBER}" ]]; then
            args+=(--pr-number "${EVENT_PR_NUMBER}")
          fi
          if [[ -n "${EVENT_HEAD_SHA}" ]]; then
            args+=(--head-sha "${EVENT_HEAD_SHA}")
          fi
          python scripts/ci/pr_ci_remediation.py "${args[@]}"

      - name: Publicar resumo
        if: always()
        run: |
          if [[ -f artifacts/pr-ci-remediation/summary.md ]]; then
            cat artifacts/pr-ci-remediation/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Publicar evidência
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-ci-remediation-evidence-${{ github.run_id }}
          path: artifacts/pr-ci-remediation/
          if-no-files-found: error
          retention-days: 30
