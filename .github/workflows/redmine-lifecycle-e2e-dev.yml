name: Redmine Lifecycle E2E DEV

on:
  push:
    branches: [ops/redmine-lifecycle-e2e-1686-20260915]
    paths:
      - ".github/workflows/redmine-lifecycle-e2e-dev.yml"
      - "backend/app/services/redmine_api.py"
      - "backend/app/services/redmine_lifecycle_sync.py"
      - "backend/tests/test_redmine_api.py"
      - "backend/tests/test_redmine_lifecycle_sync.py"
      - "scripts/redmine_lifecycle_e2e_runtime.py"

permissions:
  contents: read
  id-token: write

concurrency:
  group: redmine-lifecycle-e2e-dev
  cancel-in-progress: false

jobs:
  redmine-lifecycle-e2e:
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 25
    env:
      FLY_APP: reqsys-api-dev
      API_URL: https://reqsys-api-dev.fly.dev
      CORRELATION_ID: redmine-lifecycle-e2e-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolver credencial Fly da API DEV
        uses: ./.github/actions/resolve-managed-credential
        with:
          credential-id: fly-api-dev-deploy
          consumer: github-actions:fly-dev
          export-env: FLY_API_TOKEN
          vault-name: ${{ vars.REQSYS_KEY_VAULT_NAME }}
          azure-client-id: ${{ vars.CCP_AZURE_CLIENT_ID_DEV }}
          azure-tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          evidence-path: audit/redmine-lifecycle-e2e-fly-credential.json

      - name: Confirmar configuração Redmine no runtime sem revelar segredos
        shell: bash
        run: |
          set -euo pipefail
          output="$(flyctl ssh console -a "$FLY_APP" --command "python -c 'import os; keys=[\"REDMINE_BASE_URL\",\"REDMINE_API_KEY\",\"REDMINE_PROJECT_ID\"]; print(\"configured\" if all(os.getenv(k) for k in keys) else \"missing\")'")"
          result="$(printf '%s\n' "$output" | tail -n 1)"
          printf 'redmine_runtime=%s\n' "$result"
          printf '%s\n' "$result" | grep -q '^configured$'

      - name: Implantar temporariamente o HEAD da branch em DEV
        id: deploy_branch
        shell: bash
        run: |
          set -euo pipefail
          echo "deploy_head=${GITHUB_SHA}"
          cd backend
          flyctl deploy --remote-only --config fly.dev.toml --app "$FLY_APP"

      - name: Validar saúde do HEAD implantado
        shell: bash
        run: |
          set -euo pipefail
          for tentativa in $(seq 1 60); do
            health_ok=false
            readiness_ok=false
            curl --fail --silent --show-error --max-time 5 "$API_URL/health" >/dev/null && health_ok=true || true
            curl --fail --silent --show-error --max-time 5 "$API_URL/api/runtime/readiness" >/dev/null && readiness_ok=true || true
            if [ "$health_ok" = true ] && [ "$readiness_ok" = true ]; then
              echo "HEAD da branch saudável no DEV."
              exit 0
            fi
            sleep 2
          done
          echo "::error::HEAD da branch não ficou saudável no DEV."
          exit 1

      - name: Executar E2E ReqSys ↔ Redmine no runtime DEV
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p audit
          payload="$(base64 -w0 scripts/redmine_lifecycle_e2e_runtime.py)"
          set +e
          output="$(flyctl ssh console -a "$FLY_APP" --command "env REQSYS_E2E_CORRELATION_ID=$CORRELATION_ID python -c 'import base64; exec(compile(base64.b64decode(\"$payload\"), \"redmine_lifecycle_e2e_runtime.py\", \"exec\"))'")"
          remote_rc=$?
          set -e
          result="$(printf '%s\n' "$output" | tail -n 1)"
          printf '%s\n' "$result" > audit/redmine-lifecycle-e2e.json
          RESULT="$result" REMOTE_RC="$remote_rc" python - <<'PY'
          import json, os, sys
          try:
              payload = json.loads(os.environ['RESULT'])
          except Exception as exc:
              print(f'::error::Evidência E2E inválida: {type(exc).__name__}')
              sys.exit(1)
          status = payload.get('status')
          correlation_id = payload.get('correlation_id')
          fixture = payload.get('fixture') or {}
          checks = payload.get('checks') or {}
          result = payload.get('result') or {}
          print(f"status={status} correlation_id={correlation_id} requisito_id={fixture.get('requisito_id')} redmine_issue_id={fixture.get('redmine_issue_id')}")
          print(f"checks={json.dumps(checks, sort_keys=True)}")
          print(f"result={json.dumps(result, sort_keys=True)}")
          required_checks = (
              'runtime_redmine_credential_present',
              'reqsys_admin_session',
              'fixture_bootstrap_sync',
              'redmine_direct_read',
              'dry_run_zero_mutations',
              'forward_precondition_confirmed',
              'reqsys_to_redmine_independent_read',
              'reverse_precondition_confirmed',
              'redmine_to_reqsys_independent_read',
              'idempotent_repeat_zero_mutations',
              'restore_confirmed',
          )
          missing = [name for name in required_checks if checks.get(name) is not True]
          if os.environ.get('REMOTE_RC') != '0' or status != 'passed' or missing:
              print(f"::error::E2E Redmine não passou: {payload.get('error') or payload.get('restore_error') or status}; missing_checks={missing}")
              sys.exit(1)
          PY

      - name: Checkout da main para restauração do DEV
        if: always() && steps.deploy_branch.outcome != 'skipped'
        uses: actions/checkout@v4
        with:
          ref: main
          path: restore-main
          fetch-depth: 1

      - name: Restaurar DEV para a main atual
        if: always() && steps.deploy_branch.outcome != 'skipped'
        id: restore_main
        shell: bash
        run: |
          set -euo pipefail
          restore_sha="$(git -C restore-main rev-parse HEAD)"
          echo "restore_main_sha=$restore_sha"
          cd restore-main/backend
          flyctl deploy --remote-only --config fly.dev.toml --app "$FLY_APP"

      - name: Confirmar saúde após restauração da main
        if: always() && steps.restore_main.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          for tentativa in $(seq 1 60); do
            health_ok=false
            readiness_ok=false
            curl --fail --silent --show-error --max-time 5 "$API_URL/health" >/dev/null && health_ok=true || true
            curl --fail --silent --show-error --max-time 5 "$API_URL/api/runtime/readiness" >/dev/null && readiness_ok=true || true
            if [ "$health_ok" = true ] && [ "$readiness_ok" = true ]; then
              echo "DEV restaurado e saudável na main."
              exit 0
            fi
            sleep 2
          done
          echo "::error::DEV não ficou saudável após restauração da main."
          exit 1

      - name: Publicar evidência auditável
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: redmine-lifecycle-e2e-dev
          path: |
            audit/redmine-lifecycle-e2e-fly-credential.json
            audit/redmine-lifecycle-e2e.json
          if-no-files-found: warn
