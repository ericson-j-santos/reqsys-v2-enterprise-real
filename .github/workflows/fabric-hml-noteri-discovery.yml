name: Fabric HML Noteri Discovery\n\non:\n  pull_request:\n    paths:\n      - ".github/workflows/fabric-hml-noteri-discovery.yml"\n      - ".github/self-hosted-runner-policy.json"\n      - "scripts/fabric_hml_noteri_discovery.py"\n      - "tests/test_fabric_hml_noteri_discovery_contract.py"\n      - ".sdd/specs/fabric-hml-noteri-discovery.requirements.md"\n      - ".sdd/specs/fabric-hml-noteri-discovery.spec.json"\n  workflow_dispatch:\n    inputs:\n      apply_nonsecret_vars:\n        description: "Aplicar FABRIC_TENANT_ID/CLIENT_ID/WORKSPACE_ID no painel-powerbi/homologacao"\n        required: true\n        default: false\n        type: boolean\n\npermissions:\n  contents: read\n\nconcurrency:\n  group: fabric-hml-noteri-discovery\n  cancel-in-progress: false\n\njobs:\n  discover:\n    name: fabric-hml-noteri-discovery\n    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]\n    timeout-minutes: 8\n    env:\n      EVIDENCE_FILE: artifacts/fabric-hml-noteri-discovery/evidence.json\n    steps:\n      - name: Checkout immutable SHA\n        uses: actions/checkout@v4\n        with:\n          ref: ${{ github.event.pull_request.head.sha || github.sha }}\n          fetch-depth: 1\n\n      - name: Probe read-only ou aplicar apenas variables nao sensiveis\n        shell: powershell\n        run: |\n          $probeArgs = @(\n            "scripts/fabric_hml_noteri_discovery.py",\n            "--evidence-file", "$env:EVIDENCE_FILE"\n          )\n          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.apply_nonsecret_vars }}" -eq "true") {\n            if ("${{ github.ref }}" -ne "refs/heads/main") {\n              throw "apply_nonsecret_vars_only_on_main"\n            }\n            $probeArgs += @("--apply-nonsecret-vars", "--confirm", "APPLY-FABRIC-HML-NONSECRET-VARS")\n          }\n          python @probeArgs\n\n      - name: Upload sanitized evidence\n        if: always()\n        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02\n        with:\n          name: fabric-hml-noteri-discovery-${{ github.run_id }}\n          path: artifacts/fabric-hml-noteri-discovery/evidence.json\n          if-no-files-found: error\n          retention-days: 7\n