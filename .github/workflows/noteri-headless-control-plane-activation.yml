name: Noteri Headless Control Plane Activation

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: noteri-headless-control-plane-activation
  cancel-in-progress: false

jobs:
  activate:
    name: Provision native GitHub runner Windows service
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 6
    env:
      EVIDENCE_FILE: artifacts/noteri-control-plane/headless-activation.json
    steps:
      - name: Checkout immutable workflow SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Stage one-click native service launcher on Noteri desktop
        shell: powershell
        run: |
          $desktop = [Environment]::GetFolderPath('Desktop')
          if ([string]::IsNullOrWhiteSpace($desktop)) { throw 'Desktop path unavailable' }
          $ps1 = Join-Path $desktop 'Ativar-Noteri-Headless.ps1'
          $cmd = Join-Path $desktop 'Ativar-Noteri-Headless.cmd'
          @'
          $ErrorActionPreference = 'Stop'
          $isAdmin = ([Security.Principal.WindowsPrincipal] [Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole(
            [Security.Principal.WindowsBuiltInRole]::Administrator
          )
          if (-not $isAdmin) {
            $argLine = '-NoProfile -ExecutionPolicy Bypass -File "' + $PSCommandPath + '"'
            Start-Process -FilePath 'powershell.exe' -Verb RunAs -ArgumentList $argLine
            exit 0
          }

          $p = 'C:\dev\reqsys-free-control-plane-20260921'
          git -C $p fetch origin main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $p checkout -f origin/main
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sha = (git -C $p rev-parse HEAD).Trim()
          $resultPath = Join-Path $env:LOCALAPPDATA 'ReqSys\NoteriControlPlaneWatchdog\headless-service-result.json'
          python "$p\scripts\activate_noteri_free_control_plane.py" `
            --mode headless-service `
            --confirm ACTIVATE-NOTERI-FREE-CONTROL-PLANE `
            --repo-root $p `
            --source-sha $sha `
            --runner-home 'C:\actions-runner-noteri-headless' `
            --result-path $resultPath
          $code = $LASTEXITCODE
          Write-Host ''
          Write-Host 'Resultado acima. Pressione Enter para fechar.'
          [void](Read-Host)
          exit $code
          '@ | Set-Content -LiteralPath $ps1 -Encoding UTF8
          @'
          @echo off
          powershell -NoProfile -ExecutionPolicy Bypass -File "%~dp0Ativar-Noteri-Headless.ps1"
          '@ | Set-Content -LiteralPath $cmd -Encoding ASCII
          Write-Host "NOTERI_INTERACTIVE_SERVICE_LAUNCHER_STAGED=$cmd"

      - name: Validate native GitHub runner Windows service
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force (Split-Path $env:EVIDENCE_FILE) | Out-Null
          $output = python scripts/activate_noteri_free_control_plane.py `
            --mode headless-service-status `
            --confirm ACTIVATE-NOTERI-FREE-CONTROL-PLANE `
            --repo-root "$env:GITHUB_WORKSPACE" `
            --source-sha "${{ github.sha }}" `
            --runner-home 'C:\actions-runner-noteri-headless'
          $output | Tee-Object -FilePath $env:EVIDENCE_FILE
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload sanitized activation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: noteri-headless-control-plane-${{ github.run_id }}
          path: artifacts/noteri-control-plane/headless-activation.json
          if-no-files-found: error
          retention-days: 30
