name: Cofre Runtime Evidence Gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente para validação runtime do Cofre
        required: true
        type: choice
        options:
          - dev
      timeout_seconds:
        description: Timeout HTTP por chamada
        required: true
        type: string
        default: "20"
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      timeout_seconds:
        required: false
        type: string
        default: "20"
    secrets:
      COFRE_ADMIN_JWT:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: cofre-runtime-evidence-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ARTIFACT_DIR: artifacts/cofre-runtime-evidence
  CORRELATION_ID: cofre-runtime-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate-inputs:
    name: Validar contrato PC24x7 DEV
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.resolve.outputs.base_url }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
    steps:
      - name: Resolver DEV canônico
        id: resolve
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          DEV_BASE_URL: ${{ vars.PC24X7_DEV_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" != "dev" ]; then
            echo "Somente DEV é permitido até existir evidência DEV PC24x7 verde no SHA atual." >&2
            exit 1
          fi
          if ! [[ "$TIMEOUT_SECONDS" =~ ^[0-9]+$ ]] || [ "$TIMEOUT_SECONDS" -lt 1 ] || [ "$TIMEOUT_SECONDS" -gt 120 ]; then
            echo "timeout_seconds deve estar entre 1 e 120." >&2
            exit 1
          fi
          if [ -z "${DEV_BASE_URL:-}" ]; then
            echo "PC24X7_DEV_BASE_URL não configurada." >&2
            exit 1
          fi
          case "$DEV_BASE_URL" in
            https://*) ;;
            *) echo "PC24X7_DEV_BASE_URL deve usar HTTPS." >&2; exit 1 ;;
          esac
          case "${DEV_BASE_URL,,}" in
            *fly.io*|*fly.dev*) echo "Fly.io é bloqueado como runtime do Cofre DEV." >&2; exit 1 ;;
          esac
          echo "base_url=${DEV_BASE_URL%/}" >> "$GITHUB_OUTPUT"
          echo "github_environment=development" >> "$GITHUB_OUTPUT"

  runtime-evidence:
    name: Evidência Cofre DEV PC24x7
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: ${{ needs.validate-inputs.outputs.github_environment }}
    env:
      STATE_FILE: .tmp/cofre-runtime-state.bin
      BASE_URL: ${{ needs.validate-inputs.outputs.base_url }}
      TARGET_ENV: dev
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
    steps:
      - name: Checkout do SHA imutável
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência criptográfica mínima
        run: python -m pip install --disable-pip-version-check "cryptography>=44,<51"

      - name: Validar runtime remoto PC24x7 e SHA antes da mutação
        env:
          COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          test -n "${COFRE_ADMIN_JWT:-}"
          python scripts/cofre_remote_runtime_control.py inspect             --base-url "$BASE_URL"             --expected-sha "${{ github.sha }}"             --correlation-id "$CORRELATION_ID-preflight"             --timeout "$TIMEOUT_SECONDS"             --evidence-file "$ARTIFACT_DIR/runtime-preflight.json"

      - name: Preparar estado efêmero criptografado
        shell: bash
        run: |
          set -euo pipefail
          state_key="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          test -n "$state_key"
          echo "::add-mask::$state_key"
          echo "COFRE_STATE_FERNET_KEY=$state_key" >> "$GITHUB_ENV"

      - name: Validar ciclo antes do restart
        env:
          COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cofre_runtime_evidence.py             --phase before-restart             --base-url "$BASE_URL"             --environment "$TARGET_ENV"             --correlation-id "$CORRELATION_ID"             --state-file "$STATE_FILE"             --evidence-file "$ARTIFACT_DIR/before-restart.json"             --timeout "$TIMEOUT_SECONDS"

      - name: Solicitar restart autenticado somente da API DEV
        env:
          COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cofre_remote_runtime_control.py restart             --base-url "$BASE_URL"             --expected-sha "${{ github.sha }}"             --correlation-id "$CORRELATION_ID-restart"             --timeout "$TIMEOUT_SECONDS"             --evidence-file "$ARTIFACT_DIR/runtime-restart.json"

      - name: Comprovar novo boot no mesmo SHA
        env:
          COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cofre_remote_runtime_control.py verify             --base-url "$BASE_URL"             --expected-sha "${{ github.sha }}"             --correlation-id "$CORRELATION_ID-verify"             --timeout "$TIMEOUT_SECONDS"             --wait-seconds 180             --restart-evidence-file "$ARTIFACT_DIR/runtime-restart.json"             --evidence-file "$ARTIFACT_DIR/runtime-restart-verified.json"

      - name: Aguardar readiness público após restart
        shell: bash
        run: |
          set -euo pipefail
          python scripts/validate_public_runtime.py             --base-url "$BASE_URL"             --environment dev             --timeout "$TIMEOUT_SECONDS"             --endpoint /api/runtime/readiness             --output "$ARTIFACT_DIR/public-readiness.json"             --readiness-output "$ARTIFACT_DIR/public-readiness-summary.json"

      - name: Validar persistência e cleanup
        env:
          COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
        shell: bash
        run: |
          set -euo pipefail
          python scripts/cofre_runtime_evidence.py             --phase after-restart             --base-url "$BASE_URL"             --environment "$TARGET_ENV"             --correlation-id "$CORRELATION_ID"             --state-file "$STATE_FILE"             --evidence-file "$ARTIFACT_DIR/after-restart.json"             --timeout "$TIMEOUT_SECONDS"

      - name: Consolidar evidência sanitizada
        if: always()
        shell: bash
        run: |
          python scripts/consolidate_cofre_runtime_evidence.py \
            --artifact-dir "$ARTIFACT_DIR" \
            --base-url "$BASE_URL" \
            --workflow-sha "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-attempt "${{ github.run_attempt }}" \
            --correlation-id "$CORRELATION_ID"

      - name: Remover estado sensível residual
        if: always()
        shell: bash
        run: |
          rm -f "$STATE_FILE"
          unset COFRE_STATE_FERNET_KEY || true

      - name: Upload das evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cofre-runtime-evidence-dev-${{ github.run_id }}
          path: artifacts/cofre-runtime-evidence/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Resumo do gate
        if: always()
        shell: bash
        run: |
          {
            echo "## Cofre Runtime Evidence Gate"
            echo "- Ambiente: dev"
            echo "- Runtime: pc24x7"
            echo "- Executor CI: GitHub-hosted"
            echo "- Controle: restart remoto autenticado da própria API"
            echo "- SHA: ${{ github.sha }}"
            echo "- Correlation ID: $CORRELATION_ID"
            echo "- Produção tocada: não"
            echo "- Valores sensíveis publicados: não"
          } >> "$GITHUB_STEP_SUMMARY"
