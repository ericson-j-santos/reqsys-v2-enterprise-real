name: Cofre Runtime Evidence Gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente para validação runtime do Cofre
        required: true
        type: choice
        options:
          - dev
          - stg
      timeout_seconds:
        description: Timeout HTTP por chamada
        required: true
        type: string
        default: "20"
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      timeout_seconds:
        required: false
        type: string
        default: "20"

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: cofre-runtime-evidence-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ARTIFACT_DIR: artifacts/cofre-runtime-evidence
  CORRELATION_ID: cofre-runtime-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate-inputs:
    name: Validar contrato do gate
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.resolve.outputs.base_url }}
      fly_app: ${{ steps.resolve.outputs.fly_app }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      credential_id: ${{ steps.resolve.outputs.credential_id }}
      consumer: ${{ steps.resolve.outputs.consumer }}
      azure_client_id: ${{ steps.resolve.outputs.azure_client_id }}
    steps:
      - name: Resolver ambiente permitido
        id: resolve
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail
          case "$TARGET_ENV" in
            dev)
              echo "base_url=https://reqsys-api-dev.fly.dev" >> "$GITHUB_OUTPUT"
              echo "fly_app=reqsys-api-dev" >> "$GITHUB_OUTPUT"
              echo "github_environment=development" >> "$GITHUB_OUTPUT"
              echo "credential_id=fly-api-dev-deploy" >> "$GITHUB_OUTPUT"
              echo "consumer=github-actions:fly-dev" >> "$GITHUB_OUTPUT"
              echo "azure_client_id=${{ vars.CCP_AZURE_CLIENT_ID_DEV }}" >> "$GITHUB_OUTPUT"
              ;;
            stg)
              echo "base_url=https://reqsys-api-stg.fly.dev" >> "$GITHUB_OUTPUT"
              echo "fly_app=reqsys-api-stg" >> "$GITHUB_OUTPUT"
              echo "github_environment=staging" >> "$GITHUB_OUTPUT"
              echo "credential_id=fly-api-hml-deploy" >> "$GITHUB_OUTPUT"
              echo "consumer=github-actions:fly-staging" >> "$GITHUB_OUTPUT"
              echo "azure_client_id=${{ vars.CCP_AZURE_CLIENT_ID_HML }}" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "Somente dev e stg são permitidos. Produção é bloqueada por contrato." >&2
              exit 1
              ;;
          esac

          if ! [[ "$TIMEOUT_SECONDS" =~ ^[0-9]+$ ]] || [ "$TIMEOUT_SECONDS" -lt 1 ] || [ "$TIMEOUT_SECONDS" -gt 120 ]; then
            echo "timeout_seconds deve estar entre 1 e 120." >&2
            exit 1
          fi

  runtime-evidence:
    name: Evidência Cofre ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: validate-inputs
    timeout-minutes: 20
    environment:
      name: ${{ needs.validate-inputs.outputs.github_environment }}
    env:
      STATE_FILE: /tmp/cofre-runtime-state.bin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependência criptográfica mínima
        run: python -m pip install --disable-pip-version-check "cryptography>=44,<46"

      - name: Preparar estado efêmero criptografado
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          chmod 700 "$ARTIFACT_DIR"
          state_key="$(python -c 'from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())')"
          echo "::add-mask::$state_key"
          echo "COFRE_STATE_FERNET_KEY=$state_key" >> "$GITHUB_ENV"

      - name: Obter JWT admin via demo login (DEV/STG apenas, produção bloqueada pela API)
        env:
          BASE_URL: ${{ needs.validate-inputs.outputs.base_url }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS --fail --max-time 20 -X POST "$BASE_URL/v1/auth/login" \
            -H "Content-Type: application/json" -d '{}')"
          token="$(python -c "import json,sys; d=json.loads(sys.argv[1]); print(d.get('data',{}).get('access_token') or '')" "$response")"
          if [ -z "$token" ]; then
            echo "::error::Login demo não retornou access_token (verifique ALLOW_DEMO_LOGIN no ambiente)."
            exit 2
          fi
          echo "::add-mask::$token"
          echo "COFRE_ADMIN_JWT=$token" >> "$GITHUB_ENV"

      - name: Validar ciclo antes do restart
        env:
          BASE_URL: ${{ needs.validate-inputs.outputs.base_url }}
          TARGET_ENV: ${{ inputs.environment }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail
          python scripts/cofre_runtime_evidence.py \
            --phase before-restart \
            --base-url "$BASE_URL" \
            --environment "$TARGET_ENV" \
            --correlation-id "$CORRELATION_ID" \
            --state-file "$STATE_FILE" \
            --evidence-file "$ARTIFACT_DIR/before-restart.json" \
            --timeout "$TIMEOUT_SECONDS"

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Resolver credencial Fly API
        uses: ./.github/actions/resolve-managed-credential
        with:
          credential-id: ${{ needs.validate-inputs.outputs.credential_id }}
          consumer: ${{ needs.validate-inputs.outputs.consumer }}
          export-env: FLY_API_TOKEN
          vault-name: ${{ vars.REQSYS_KEY_VAULT_NAME }}
          azure-client-id: ${{ needs.validate-inputs.outputs.azure_client_id }}
          azure-tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          evidence-path: ${{ env.ARTIFACT_DIR }}/credential-resolution.json

      - name: Reiniciar runtime de forma controlada
        env:
          FLY_APP: ${{ needs.validate-inputs.outputs.fly_app }}
        run: |
          set -euo pipefail
          mapfile -t machine_ids < <(
            flyctl machines list --app "$FLY_APP" --json |
              python -c 'import json,sys; print("\n".join(m["id"] for m in json.load(sys.stdin) if m.get("state") != "destroyed"))'
          )
          if [ "${#machine_ids[@]}" -eq 0 ]; then
            echo "Nenhuma máquina ativa encontrada para $FLY_APP." >&2
            exit 1
          fi
          for machine_id in "${machine_ids[@]}"; do
            flyctl machine restart "$machine_id" --app "$FLY_APP"
          done
          flyctl status --app "$FLY_APP"

      - name: Aguardar readiness após restart
        env:
          BASE_URL: ${{ needs.validate-inputs.outputs.base_url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --max-time 10 "$BASE_URL/api/runtime/readiness" >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "Runtime não ficou ready após restart." >&2
          exit 1

      - name: Validar persistência e cleanup
        env:
          BASE_URL: ${{ needs.validate-inputs.outputs.base_url }}
          TARGET_ENV: ${{ inputs.environment }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
        run: |
          set -euo pipefail
          python scripts/cofre_runtime_evidence.py \
            --phase after-restart \
            --base-url "$BASE_URL" \
            --environment "$TARGET_ENV" \
            --correlation-id "$CORRELATION_ID" \
            --state-file "$STATE_FILE" \
            --evidence-file "$ARTIFACT_DIR/after-restart.json" \
            --timeout "$TIMEOUT_SECONDS"

      - name: Consolidar evidência sanitizada
        if: always()
        env:
          TARGET_ENV: ${{ inputs.environment }}
          BASE_URL: ${{ needs.validate-inputs.outputs.base_url }}
        run: |
          set -euo pipefail
          umask 077
          python - <<'PY'
          import json
          import os
          import time
          from pathlib import Path

          root = Path(os.environ["ARTIFACT_DIR"])
          phases = {}
          for name in ("before-restart", "after-restart"):
              path = root / f"{name}.json"
              if path.exists():
                  phases[name] = json.loads(path.read_text(encoding="utf-8"))

          ok = len(phases) == 2 and all(item.get("ok") is True for item in phases.values())
          payload = {
              "schema_version": "1.1.0",
              "contract": "reqsys-cofre-runtime-evidence-summary",
              "ok": ok,
              "environment": os.environ["TARGET_ENV"],
              "base_url": os.environ["BASE_URL"],
              "restart_runtime": True,
              "transient_state_encrypted": True,
              "workflow_sha": os.environ["GITHUB_SHA"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "correlation_id": os.environ["CORRELATION_ID"],
              "generated_at_epoch": int(time.time()),
              "phases": phases,
              "sensitive_values_exposed": False,
          }
          (root / "summary.json").write_text(
              json.dumps(payload, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          if not ok:
              raise SystemExit("Evidência consolidada incompleta ou com falha")
          PY

      - name: Remover estado sensível residual
        if: always()
        run: |
          rm -f "$STATE_FILE"
          unset COFRE_STATE_FERNET_KEY || true

      - name: Upload das evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cofre-runtime-evidence-${{ inputs.environment }}-${{ github.run_id }}
          path: artifacts/cofre-runtime-evidence/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Resumo do gate
        if: always()
        run: |
          {
            echo "## Cofre Runtime Evidence Gate"
            echo "- Ambiente: \`${{ inputs.environment }}\`"
            echo "- Runtime: \`${{ needs.validate-inputs.outputs.fly_app }}\`"
            echo "- Correlation ID: \`$CORRELATION_ID\`"
            echo "- Evidência: \`cofre-runtime-evidence-${{ inputs.environment }}-${{ github.run_id }}\`"
            echo "- Estado transitório criptografado: **sim**"
            echo "- Valores sensíveis publicados: **não**"
          } >> "$GITHUB_STEP_SUMMARY"
