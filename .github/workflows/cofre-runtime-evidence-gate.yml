name: Cofre Runtime Evidence Gate

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Ambiente para validação runtime do Cofre
        required: true
        type: choice
        options:
          - dev
      timeout_seconds:
        description: Timeout HTTP por chamada
        required: true
        type: string
        default: "20"
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      timeout_seconds:
        required: false
        type: string
        default: "20"
    secrets:
      COFRE_ADMIN_JWT:
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: cofre-runtime-evidence-${{ github.workflow }}-${{ github.ref_name }}
  cancel-in-progress: false

env:
  ARTIFACT_DIR: artifacts/cofre-runtime-evidence
  CORRELATION_ID: cofre-runtime-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  validate-inputs:
    name: Validar contrato PC24x7 DEV
    runs-on: ubuntu-latest
    outputs:
      base_url: ${{ steps.resolve.outputs.base_url }}
      github_environment: ${{ steps.resolve.outputs.github_environment }}
      runner_labels: ${{ steps.resolve.outputs.runner_labels }}
      container_name: ${{ steps.resolve.outputs.container_name }}
    steps:
      - name: Resolver DEV canônico
        id: resolve
        env:
          TARGET_ENV: ${{ inputs.environment }}
          TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
          DEV_BASE_URL: ${{ vars.PC24X7_DEV_BASE_URL }}
        shell: bash
        run: |
          set -euo pipefail
          if [ "$TARGET_ENV" != "dev" ]; then
            echo "Somente DEV é permitido até existir evidência DEV PC24x7 verde no SHA atual." >&2
            exit 1
          fi
          if ! [[ "$TIMEOUT_SECONDS" =~ ^[0-9]+$ ]] || [ "$TIMEOUT_SECONDS" -lt 1 ] || [ "$TIMEOUT_SECONDS" -gt 120 ]; then
            echo "timeout_seconds deve estar entre 1 e 120." >&2
            exit 1
          fi
          if [ -z "${DEV_BASE_URL:-}" ]; then
            echo "PC24X7_DEV_BASE_URL não configurada." >&2
            exit 1
          fi
          case "$DEV_BASE_URL" in
            https://*) ;;
            *) echo "PC24X7_DEV_BASE_URL deve usar HTTPS." >&2; exit 1 ;;
          esac
          case "${DEV_BASE_URL,,}" in
            *fly.io*|*fly.dev*) echo "Fly.io é bloqueado como runtime do Cofre DEV." >&2; exit 1 ;;
          esac
          echo "base_url=${DEV_BASE_URL%/}" >> "$GITHUB_OUTPUT"
          echo "github_environment=development" >> "$GITHUB_OUTPUT"
          echo 'runner_labels=["self-hosted","Windows","X64","pc24x7","reqsys-dev"]' >> "$GITHUB_OUTPUT"
          echo "container_name=wt-pc24x7-piloto-api-1" >> "$GITHUB_OUTPUT"

  runtime-evidence:
    name: Evidência Cofre DEV PC24x7
    needs: validate-inputs
    runs-on: ${{ fromJSON(needs.validate-inputs.outputs.runner_labels) }}
    timeout-minutes: 20
    environment:
      name: ${{ needs.validate-inputs.outputs.github_environment }}
    env:
      STATE_FILE: ${{ runner.temp }}/cofre-runtime-state.bin
      BASE_URL: ${{ needs.validate-inputs.outputs.base_url }}
      TARGET_ENV: dev
      TIMEOUT_SECONDS: ${{ inputs.timeout_seconds }}
    steps:
      - name: Checkout do SHA imutável
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependência criptográfica mínima
        run: python -m pip install --disable-pip-version-check "cryptography>=44,<51"

      - name: Validar runtime PC24x7 e SHA antes da mutação
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path $env:ARTIFACT_DIR | Out-Null
          python scripts/pc24x7_cofre_runtime_control.py inspect --expected-sha "${{ github.sha }}" --correlation-id "$env:CORRELATION_ID-preflight" --evidence-file "$env:ARTIFACT_DIR/runtime-preflight.json"

      - name: Preparar estado efêmero criptografado
        shell: pwsh
        run: |
          $stateKey = python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
          if (-not $stateKey) { throw "Falha ao gerar chave efêmera de estado." }
          Write-Output "::add-mask::$stateKey"
          "COFRE_STATE_FERNET_KEY=$stateKey" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Validar ciclo antes do restart
        env:
          COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
        shell: pwsh
        run: |
          if (-not $env:COFRE_ADMIN_JWT) { throw "COFRE_ADMIN_JWT ausente." }
          python scripts/cofre_runtime_evidence.py --phase before-restart --base-url "$env:BASE_URL" --environment "$env:TARGET_ENV" --correlation-id "$env:CORRELATION_ID" --state-file "$env:STATE_FILE" --evidence-file "$env:ARTIFACT_DIR/before-restart.json" --timeout "$env:TIMEOUT_SECONDS"

      - name: Reiniciar somente a API DEV no PC24x7
        shell: pwsh
        run: |
          python scripts/pc24x7_cofre_runtime_control.py restart --expected-sha "${{ github.sha }}" --timeout 180 --correlation-id "$env:CORRELATION_ID-restart" --evidence-file "$env:ARTIFACT_DIR/runtime-restart.json"

      - name: Aguardar readiness público após restart
        shell: pwsh
        run: |
          python scripts/validate_public_runtime.py --base-url "$env:BASE_URL" --environment dev --timeout "$env:TIMEOUT_SECONDS" --endpoint /api/runtime/readiness --output "$env:ARTIFACT_DIR/public-readiness.json" --readiness-output "$env:ARTIFACT_DIR/public-readiness-summary.json"

      - name: Validar persistência e cleanup
        env:
          COFRE_ADMIN_JWT: ${{ secrets.COFRE_ADMIN_JWT }}
        shell: pwsh
        run: |
          python scripts/cofre_runtime_evidence.py --phase after-restart --base-url "$env:BASE_URL" --environment "$env:TARGET_ENV" --correlation-id "$env:CORRELATION_ID" --state-file "$env:STATE_FILE" --evidence-file "$env:ARTIFACT_DIR/after-restart.json" --timeout "$env:TIMEOUT_SECONDS"

      - name: Consolidar evidência sanitizada
        if: always()
        shell: pwsh
        run: |
          $beforePath = Join-Path $env:ARTIFACT_DIR "before-restart.json"
          $afterPath = Join-Path $env:ARTIFACT_DIR "after-restart.json"
          $restartPath = Join-Path $env:ARTIFACT_DIR "runtime-restart.json"
          $phases = @{}
          if (Test-Path $beforePath) { $phases["before-restart"] = Get-Content $beforePath -Raw | ConvertFrom-Json }
          if (Test-Path $afterPath) { $phases["after-restart"] = Get-Content $afterPath -Raw | ConvertFrom-Json }
          $restart = if (Test-Path $restartPath) { Get-Content $restartPath -Raw | ConvertFrom-Json } else { $null }
          $ok = $phases.Count -eq 2 -and $phases["before-restart"].ok -eq $true -and $phases["after-restart"].ok -eq $true -and $restart -ne $null -and $restart.ok -eq $true
          $payload = [ordered]@{
            schema_version = "2.0.0"
            contract = "reqsys-cofre-runtime-evidence-summary"
            ok = $ok
            environment = "dev"
            runtime_target = "pc24x7"
            base_url = $env:BASE_URL
            workflow_sha = "${{ github.sha }}"
            run_id = "${{ github.run_id }}"
            run_attempt = "${{ github.run_attempt }}"
            correlation_id = $env:CORRELATION_ID
            restart_runtime = $true
            transient_state_encrypted = $true
            production_touched = $false
            sensitive_values_exposed = $false
            phases = $phases
            runtime_control = $restart
          }
          $payload | ConvertTo-Json -Depth 20 | Set-Content -Encoding utf8 (Join-Path $env:ARTIFACT_DIR "summary.json")
          if (-not $ok) { throw "Evidência consolidada incompleta ou com falha." }

      - name: Remover estado sensível residual
        if: always()
        shell: pwsh
        run: |
          Remove-Item -Force -ErrorAction SilentlyContinue "$env:STATE_FILE"
          Remove-Item Env:COFRE_STATE_FERNET_KEY -ErrorAction SilentlyContinue

      - name: Upload das evidências
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cofre-runtime-evidence-dev-${{ github.run_id }}
          path: artifacts/cofre-runtime-evidence/*.json
          if-no-files-found: error
          retention-days: 30

      - name: Resumo do gate
        if: always()
        shell: pwsh
        run: |
          "## Cofre Runtime Evidence Gate" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Ambiente: dev" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Runtime: pc24x7" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Container: ${{ needs.validate-inputs.outputs.container_name }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- SHA: ${{ github.sha }}" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Correlation ID: $env:CORRELATION_ID" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Produção tocada: não" | Add-Content $env:GITHUB_STEP_SUMMARY
          "- Valores sensíveis publicados: não" | Add-Content $env:GITHUB_STEP_SUMMARY
