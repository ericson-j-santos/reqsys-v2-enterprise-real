name: Power Automate Outlook Idempotency E2E DEV

on:
  push:
    branches:
      - "ops/powerautomate-outlook-e2e-dev-20260929"
    paths:
      - "backend/scripts/powerautomate_outlook_idempotency_e2e.py"
      - ".github/workflows/powerautomate-outlook-idempotency-e2e-dev.yml"

permissions:
  contents: read

concurrency:
  group: powerautomate-outlook-idempotency-e2e-dev
  cancel-in-progress: false

jobs:
  recover-runner:
    name: Recover PC24x7 runner from Noteri control plane
    runs-on: [self-hosted, Windows, X64, noteri, reqsys-dev]
    timeout-minutes: 5
    env:
      RULES_SHA: 10d2489e8cac3770d1c07fac4ccfece0a0112269
      CORRELATION_ID: pa-outlook-desktop-recovery-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_REL: artifacts\noteri-desktop-orchestrator-runner-recovery\evidence.json

    steps:
      - name: Checkout immutable source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed Noteri session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--repo", $env:GITHUB_WORKSPACE,
            "--session-prefix", "pa-outlook-recover",
            "--correlation-id", "$env:CORRELATION_ID-bootstrap",
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/$env:GITHUB_REF_NAME"
          )
          $raw = & py -3 $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          if ([string]$data.host -ne "Noteri") { throw "UNEXPECTED_SOURCE_HOST:$($data.host)" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=${{ github.sha }}" | Add-Content $env:GITHUB_OUTPUT

      - name: Recover Desktop GitHub runner through Command Gateway
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $script = Join-Path $env:TARGET_PATH "scripts\noteri_desktop_orchestrator_runner_recovery.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", $env:CORRELATION_ID,
            "run", "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2", "--timeout", "120",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "python", $script,
            "--confirm", "RECOVER-DESKTOP-GITHUB-RUNNER-VIA-ORCHESTRATOR",
            "--correlation-id", $env:CORRELATION_ID,
            "--evidence-file", $env:EVIDENCE_REL,
            "--timeout-seconds", "75"
          )
          & py -3 $gateway @args
          exit $LASTEXITCODE

      - name: Upload sanitized runner recovery evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pa-outlook-desktop-runner-recovery-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\${{ env.EVIDENCE_REL }}
          if-no-files-found: warn
          retention-days: 14

  e2e:
    needs: recover-runner
    name: Power Automate -> Outlook idempotency on PC24x7 DEV
    runs-on: [self-hosted, Windows, X64, pc24x7, reqsys-dev]
    timeout-minutes: 12
    env:
      RULES_SHA: 10d2489e8cac3770d1c07fac4ccfece0a0112269
      CANONICAL_REPO: C:\dev\reqsys-v2-enterprise-real
      CORRELATION_ID: pa-outlook-e2e-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout canonical operational rules exact SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: ericson-j-santos/chatgpt-operational-rules
          ref: ${{ env.RULES_SHA }}
          path: _rules
          fetch-depth: 1
          persist-credentials: false

      - name: Bootstrap governed ReqSys session
        id: session
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $launcher = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\session_launcher.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--repo", $env:CANONICAL_REPO,
            "--session-prefix", "pa-outlook-e2e",
            "--correlation-id", "$env:CORRELATION_ID-bootstrap",
            "--expected-head", "${{ github.sha }}",
            "--sync-ref", "origin/$env:GITHUB_REF_NAME"
          )
          $raw = & python $launcher @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $data = @($raw)[-1] | ConvertFrom-Json
          if ($data.result -ne "SESSION_LAUNCH_OK" -or $data.state_validated -ne $true) {
            throw "SESSION_LAUNCH_BLOCKED"
          }
          if ($data.head -ne "${{ github.sha }}") { throw "SESSION_HEAD_MISMATCH" }
          if ([string]$data.host -ne "DESKTOP-PDQK954") { throw "UNEXPECTED_HOST:$($data.host)" }
          "target_path=$($data.target_path)" | Add-Content $env:GITHUB_OUTPUT
          "session_id=$($data.session_id)" | Add-Content $env:GITHUB_OUTPUT
          "anchor_sha=${{ github.sha }}" | Add-Content $env:GITHUB_OUTPUT

      - name: Resolve exact DEV API container through Command Gateway
        id: container
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-container",
            "run", "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1", "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "docker", "ps",
            "--filter", "label=com.docker.compose.service=api",
            "--filter", "status=running",
            "--format", "{{.ID}}|{{.Names}}"
          )
          $raw = & python $gateway @args
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $result = @($raw)[-1] | ConvertFrom-Json
          if ($result.result -ne "command_succeeded") { throw "DOCKER_PS_GATEWAY_FAILED" }
          $lines = @(([string]$result.stdout).Trim().Split([Environment]::NewLine, [System.StringSplitOptions]::RemoveEmptyEntries))
          if ($lines.Count -ne 1) { throw "DEV_API_CONTAINER_AMBIGUOUS:$($lines.Count)" }
          $parts = $lines[0].Split("|", 2)
          if ($parts.Count -ne 2 -or -not $parts[0] -or -not $parts[1]) { throw "DEV_API_CONTAINER_INVALID" }
          if ($parts[1].ToLowerInvariant().Contains("prod")) { throw "PRODUCTION_CONTAINER_FORBIDDEN" }
          "container_id=$($parts[0])" | Add-Content $env:GITHUB_OUTPUT
          "container_name=$($parts[1])" | Add-Content $env:GITHUB_OUTPUT

      - name: Copy immutable executor into DEV API container
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
          CONTAINER_ID: ${{ steps.container.outputs.container_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $source = Join-Path $env:TARGET_PATH "backend\scripts\powerautomate_outlook_idempotency_e2e.py"
          $dest = "${env:CONTAINER_ID}:/tmp/reqsys_pa_outlook_e2e.py"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-copy",
            "run", "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2", "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "docker", "cp", $source, $dest
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Self-test executor inside DEV API container
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
          CONTAINER_ID: ${{ steps.container.outputs.container_id }}
        run: |
          $ErrorActionPreference = "Stop"
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-selftest",
            "run", "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "1", "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "docker", "exec",
            "-e", "PYTHONPATH=/app",
            "-w", "/app",
            $env:CONTAINER_ID,
            "python", "/tmp/reqsys_pa_outlook_e2e.py",
            "--mode", "self-test"
          )
          & python $gateway @args
          exit $LASTEXITCODE

      - name: Execute authorized Power Automate DEV E2E
        id: apply
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
          CONTAINER_ID: ${{ steps.container.outputs.container_id }}
        run: |
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-apply",
            "run", "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2", "--timeout", "270",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "docker", "exec",
            "-e", "PYTHONPATH=/app",
            "-w", "/app",
            $env:CONTAINER_ID,
            "python", "/tmp/reqsys_pa_outlook_e2e.py",
            "--mode", "apply",
            "--correlation-id", $env:CORRELATION_ID,
            "--source-sha", $env:ANCHOR_SHA,
            "--evidence-file", "/tmp/reqsys-pa-e2e/evidence.json",
            "--wait-seconds", "180"
          )
          & python $gateway @args
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content $env:GITHUB_OUTPUT
          if ($code -ne 0) {
            Write-Host "E2E apply falhou; cleanup governado sera executado antes do job falhar."
          }

      - name: Force final flow deactivation through Command Gateway
        id: cleanup
        if: always() && steps.session.outputs.target_path != '' && steps.container.outputs.container_id != ''
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
          CONTAINER_ID: ${{ steps.container.outputs.container_id }}
        run: |
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-cleanup",
            "run", "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2", "--timeout", "90",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "docker", "exec",
            "-e", "PYTHONPATH=/app",
            "-w", "/app",
            $env:CONTAINER_ID,
            "python", "/tmp/reqsys_pa_outlook_e2e.py",
            "--mode", "deactivate-only",
            "--correlation-id", "$env:CORRELATION_ID-cleanup",
            "--source-sha", $env:ANCHOR_SHA,
            "--evidence-file", "/tmp/reqsys-pa-e2e/cleanup.json",
            "--wait-seconds", "60"
          )
          & python $gateway @args
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content $env:GITHUB_OUTPUT

      - name: Copy sanitized E2E evidence back to isolated worktree
        id: evidence
        if: always() && steps.session.outputs.target_path != '' && steps.container.outputs.container_id != ''
        shell: powershell
        env:
          TARGET_PATH: ${{ steps.session.outputs.target_path }}
          SESSION_ID: ${{ steps.session.outputs.session_id }}
          ANCHOR_SHA: ${{ steps.session.outputs.anchor_sha }}
          CONTAINER_ID: ${{ steps.container.outputs.container_id }}
        run: |
          $gateway = Join-Path $env:GITHUB_WORKSPACE "_rules\scripts\command_gateway.py"
          $policy = Join-Path $env:GITHUB_WORKSPACE "_rules\config\command-gateway.policy.json"
          $dest = Join-Path $env:TARGET_PATH "artifacts"
          $source = "${env:CONTAINER_ID}:/tmp/reqsys-pa-e2e"
          $args = @(
            "--policy", $policy,
            "--correlation-id", "$env:CORRELATION_ID-evidence",
            "run", "--cwd", $env:TARGET_PATH,
            "--session-id", $env:SESSION_ID,
            "--risk", "2", "--timeout", "60",
            "--expected-head", $env:ANCHOR_SHA,
            "--",
            "docker", "cp", $source, $dest
          )
          & python $gateway @args
          $code = $LASTEXITCODE
          "exit_code=$code" | Add-Content $env:GITHUB_OUTPUT

      - name: Upload sanitized evidence
        if: always() && steps.session.outputs.target_path != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powerautomate-outlook-idempotency-e2e-${{ github.run_id }}
          path: ${{ steps.session.outputs.target_path }}\artifacts\reqsys-pa-e2e\*.json
          if-no-files-found: warn
          retention-days: 14

      - name: Enforce E2E and cleanup result
        if: always()
        shell: powershell
        env:
          APPLY_EXIT: ${{ steps.apply.outputs.exit_code }}
          CLEANUP_EXIT: ${{ steps.cleanup.outputs.exit_code }}
          EVIDENCE_EXIT: ${{ steps.evidence.outputs.exit_code }}
        run: |
          if ($env:APPLY_EXIT -ne "0") { throw "POWER_AUTOMATE_E2E_FAILED:$env:APPLY_EXIT" }
          if ($env:CLEANUP_EXIT -ne "0") { throw "POWER_AUTOMATE_CLEANUP_FAILED:$env:CLEANUP_EXIT" }
          if ($env:EVIDENCE_EXIT -ne "0") { throw "POWER_AUTOMATE_EVIDENCE_COPY_FAILED:$env:EVIDENCE_EXIT" }
          Write-Host "POWER_AUTOMATE_OUTLOOK_E2E_GOVERNED_OK"
