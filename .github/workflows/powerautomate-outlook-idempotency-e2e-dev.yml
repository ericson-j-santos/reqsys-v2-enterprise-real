name: Power Automate Outlook Idempotency E2E DEV

on:
  push:
    branches:
      - "ops/powerautomate-outlook-e2e-dev-20260929"
    paths:
      - "scripts/powerautomate_outlook_idempotency_e2e_oidc.py"
      - ".github/workflows/powerautomate-outlook-idempotency-e2e-dev.yml"

permissions:
  contents: read
  id-token: write

concurrency:
  group: powerautomate-outlook-idempotency-e2e-dev
  cancel-in-progress: true

jobs:
  e2e:
    name: Power Automate -> Outlook idempotency via GitHub OIDC
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 9
    env:
      POWER_PLATFORM_TENANT_ID: ${{ secrets.POWER_PLATFORM_TENANT_ID }}
      POWER_PLATFORM_CLIENT_ID: ${{ secrets.POWER_PLATFORM_CLIENT_ID }}
      POWER_PLATFORM_DATAVERSE_URL: https://orge9b920f1.crm2.dynamics.com
      EVIDENCE_DIR: audit/powerautomate-outlook
      CORRELATION_ID: pa-outlook-oidc-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout immutable source SHA
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal runtime dependency
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check httpx

      - name: Validate immutable implementation contract
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile scripts/powerautomate_outlook_idempotency_e2e_oidc.py
          python scripts/powerautomate_outlook_idempotency_e2e_oidc.py --mode self-test

      - name: Authenticate ReqSys DEV identity by GitHub OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ env.POWER_PLATFORM_CLIENT_ID }}
          tenant-id: ${{ env.POWER_PLATFORM_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Resolve ephemeral Dataverse token and attest app identity
        shell: bash
        run: |
          set -euo pipefail
          token="$(az account get-access-token --resource "$POWER_PLATFORM_DATAVERSE_URL/" --query accessToken -o tsv)"
          test -n "$token"
          echo "::add-mask::$token"
          TOKEN="$token" python - <<'PY'
          import base64
          import json
          import os

          raw = os.environ["TOKEN"].split(".")[1]
          raw += "=" * (-len(raw) % 4)
          claims = json.loads(base64.urlsafe_b64decode(raw).decode("utf-8"))
          actual = claims.get("appid") or claims.get("azp")
          expected = os.environ["POWER_PLATFORM_CLIENT_ID"]
          if actual != expected:
              raise SystemExit("oidc_app_identity_mismatch")
          print("OIDC_APP_ID_MATCH=true")
          PY
          printf 'POWER_PLATFORM_DATAVERSE_ACCESS_TOKEN=%s\n' "$token" >> "$GITHUB_ENV"

      - name: Execute authorized DEV E2E
        id: apply
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          python scripts/powerautomate_outlook_idempotency_e2e_oidc.py \
            --mode apply \
            --dataverse-url "$POWER_PLATFORM_DATAVERSE_URL" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "$CORRELATION_ID" \
            --output "$EVIDENCE_DIR/evidence.json" \
            --wait-seconds 180

      - name: Force final flow deactivation
        id: cleanup
        if: always()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          if [ -z "${POWER_PLATFORM_DATAVERSE_ACCESS_TOKEN:-}" ]; then
            echo "Dataverse OIDC token unavailable; no authenticated mutation can have occurred in this run."
            exit 0
          fi
          python scripts/powerautomate_outlook_idempotency_e2e_oidc.py \
            --mode deactivate-only \
            --dataverse-url "$POWER_PLATFORM_DATAVERSE_URL" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "$CORRELATION_ID-cleanup" \
            --output "$EVIDENCE_DIR/cleanup.json" \
            --wait-seconds 120

      - name: Validate sanitized evidence
        id: evidence
        if: always()
        continue-on-error: true
        shell: bash
        env:
          APPLY_OUTCOME: ${{ steps.apply.outcome }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          outcome = os.environ.get("APPLY_OUTCOME", "")
          evidence_path = Path("audit/powerautomate-outlook/evidence.json")
          cleanup_path = Path("audit/powerautomate-outlook/cleanup.json")

          if outcome == "success":
              evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
              cleanup = json.loads(cleanup_path.read_text(encoding="utf-8"))
              assert evidence["source_sha"] == os.environ["GITHUB_SHA"], evidence
              assert evidence["environment"] == "dev", evidence
              assert evidence["dataverse_url"] == "https://orge9b920f1.crm2.dynamics.com", evidence
              assert evidence["auth_mode"] == "github_oidc", evidence
              assert evidence["static_client_secret_used"] is False, evidence
              assert evidence["production_touched"] is False, evidence
              assert evidence["two_successful_runs"] is True, evidence
              assert evidence["cleanup"]["deactivated"] is True, evidence
              assert cleanup["cleanup"]["deactivated"] is True, cleanup
              print("POWER_AUTOMATE_OUTLOOK_E2E_EVIDENCE_OK")
          else:
              if evidence_path.exists():
                  evidence = json.loads(evidence_path.read_text(encoding="utf-8"))
                  assert evidence["production_touched"] is False, evidence
                  if evidence.get("cleanup"):
                      assert evidence["cleanup"].get("deactivated") is True, evidence
              print("POWER_AUTOMATE_OUTLOOK_E2E_FAILURE_EVIDENCE_PRESERVED")
          PY

      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: powerautomate-outlook-idempotency-e2e-${{ github.run_id }}
          path: audit/powerautomate-outlook/
          if-no-files-found: warn
          retention-days: 14

      - name: Clear Azure session
        if: always()
        shell: bash
        run: az account clear || true

      - name: Enforce E2E and cleanup gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.apply.outcome }}" = "success"
          test "${{ steps.cleanup.outcome }}" = "success"
          test "${{ steps.evidence.outcome }}" = "success"
          echo "POWER_AUTOMATE_OUTLOOK_E2E_GOVERNED_OK"
