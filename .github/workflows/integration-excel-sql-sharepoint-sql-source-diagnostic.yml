name: Integration Excel SQL SharePoint — SQL Source Diagnostic

on:
  push:
    branches:
      - feat/e2e-mobile-mainline-20260913
    paths:
      - ".github/workflows/integration-excel-sql-sharepoint-sql-source-diagnostic.yml"
      - "scripts/resolve_integration_e2e_sql_dsn.py"
      - ".github/scripts/install-msodbc18-ci.sh"

permissions:
  contents: read

env:
  EVIDENCE_DIR: audit/user-journey/excel-sql-sharepoint-dev

jobs:
  diagnose:
    name: Diagnosticar fonte segura do DSN SQL DEV
    runs-on: ubuntu-latest
    environment: reqsys-power-platform-dev
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Instalar ODBC e dependência mínima
        run: |
          set -euo pipefail
          bash .github/scripts/install-msodbc18-ci.sh
          python -m pip install --upgrade pip
          pip install pyodbc

      - name: Resolver e validar fonte SQL sem expor segredo
        env:
          INTEGRATION_E2E_SQL_DSN: ${{ secrets.INTEGRATION_E2E_SQL_DSN }}
          MOVIMENTO_EMAIL_SOURCE_DSN: ${{ secrets.MOVIMENTO_EMAIL_SOURCE_DSN }}
          COFRE_API_URL: ${{ secrets.COFRE_API_URL }}
          VAULT_API_TOKEN: ${{ secrets.VAULT_API_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          python scripts/resolve_integration_e2e_sql_dsn.py \
            --github-env "$GITHUB_ENV" \
            --evidence "$EVIDENCE_DIR/sql-dsn-resolution.json" \
            --procedure integration.usp_ConsultarPorIdentificadores

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: integration-sql-source-diagnostic-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}/sql-dsn-resolution.json
          if-no-files-found: warn
          retention-days: 1
