name: Pending Development Agent PR Permission Watch

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read
  issues: write

concurrency:
  group: pending-development-agent-pr-permission-watch
  cancel-in-progress: false

jobs:
  watch-pr-write:
    name: Verificar pull_requests write da GitHub App
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Provar escopo mínimo da instalação
        id: app-token
        continue-on-error: true
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ vars.REQSYS_STACK_REBASE_APP_ID }}
          private-key: ${{ secrets.REQSYS_STACK_REBASE_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: reqsys-v2-enterprise-real
          permission-actions: read
          permission-contents: read
          permission-pull-requests: write

      - name: Registrar permissão ainda não efetiva
        if: steps.app-token.outcome != 'success'
        run: |
          set -euo pipefail
          {
            echo "## Pending Development Agent PR Permission Watch"
            echo "- status: \`blocked_permission\`"
            echo "- requisito: \`pull_requests: write\` na instalação da GitHub App"
            echo "- efeito externo: nenhum"
            echo "- próxima tentativa: próximo ciclo nativo do GitHub Actions"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Registrar permissão efetiva de forma idempotente
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          MARKER: pending-development-agent-pr-permission-ready:issue:1677
        run: |
          set -euo pipefail

          existing="$(
            gh api "repos/${GITHUB_REPOSITORY}/issues/1677/comments" \
              --paginate \
              --jq ".[] | select(.body | contains(\"${MARKER}\")) | .id" \
              | head -n 1 || true
          )"

          if [[ -z "$existing" ]]; then
            body="$(cat <<EOF
<!-- ${MARKER} -->
## GitHub App — permissão de Pull Request efetiva

O watcher nativo confirmou que a instalação da GitHub App aceita a emissão de token com escopo mínimo explícito:

- actions: read
- contents: read
- pull_requests: write

Evidência:
- workflow: ${GITHUB_WORKFLOW}
- run: ${GITHUB_RUN_ID}
- SHA da automação: ${GITHUB_SHA}
- correlation_id: github-app-pr-write-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}

Nenhum segredo foi lido ou publicado. O watcher será desabilitado após este registro para evitar novas execuções desnecessárias.
EOF
)"
            gh api --method POST \
              "repos/${GITHUB_REPOSITORY}/issues/1677/comments" \
              -f body="$body" >/dev/null
          fi

          {
            echo "## Pending Development Agent PR Permission Watch"
            echo "- status: \`permission_ready\`"
            echo "- issue: \`#1677\`"
            echo "- registro idempotente: \`ok\`"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Desabilitar watcher após sucesso terminal
        if: steps.app-token.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method PUT \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pending-development-agent-pr-permission-watch.yml/disable"
