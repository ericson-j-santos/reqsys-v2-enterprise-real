name: Copilot Cloud Agent Metadata Probe

on:
  push:
    branches:
      - "fix/ollama-cloud-agent-metadata-probe-*"
    paths:
      - "scripts/probe_copilot_cloud_agent_metadata.py"
      - "tests/test_probe_copilot_cloud_agent_metadata.py"
      - ".github/workflows/copilot-cloud-agent-metadata-probe.yml"

permissions:
  contents: read

concurrency:
  group: copilot-cloud-agent-metadata-probe-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    name: Probe read-only Copilot agent metadata
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EVIDENCE_FILE: artifacts/copilot-cloud-agent-metadata/evidence.json
      CORRELATION_ID: copilot-agent-metadata-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact SHA
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run sanitization contract tests
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check pytest==8.4.2
          python -m pytest -q tests/test_probe_copilot_cloud_agent_metadata.py

      - name: Validate governed GitHub credential presence
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_ACTIONS }}
        run: |
          set -euo pipefail
          if [ -z "${GITHUB_TOKEN:-}" ]; then
            echo "GH_PAT_ACTIONS is not configured."
            exit 2
          fi
          echo "Governed GitHub credential is configured; value remains masked."

      - name: Probe repository metadata
        id: metadata_probe
        continue-on-error: true
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PAT_ACTIONS }}
        run: |
          set -euo pipefail
          python scripts/probe_copilot_cloud_agent_metadata.py \
            --repository "${GITHUB_REPOSITORY}" \
            --correlation-id "${CORRELATION_ID}" \
            --output "${EVIDENCE_FILE}"

      - name: Validate evidence safety contract
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "${EVIDENCE_FILE}"
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          evidence = json.loads(Path(os.environ["EVIDENCE_FILE"]).read_text(encoding="utf-8"))
          assert evidence["repository"] == os.environ["GITHUB_REPOSITORY"]
          assert evidence["credential_endpoint_called"] is False
          assert evidence["mcp_configuration_body_persisted"] is False
          assert evidence["mutation_executed"] is False
          assert evidence["ollama_mcp_variable"]["value_persisted"] is False
          serialized = json.dumps(evidence, sort_keys=True)
          assert "Authorization" not in serialized
          assert "Bearer " not in serialized
          PY

      - name: Publish sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: copilot-cloud-agent-metadata-${{ github.run_id }}
          path: ${{ env.EVIDENCE_FILE }}
          if-no-files-found: error
          retention-days: 30

      - name: Summary
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          import os
          from pathlib import Path

          path = Path(os.environ["EVIDENCE_FILE"])
          print("## Copilot Cloud Agent Metadata Probe")
          print(f"- SHA: `{os.environ['GITHUB_SHA']}`")
          print(f"- Correlation ID: `{os.environ['CORRELATION_ID']}`")
          if not path.exists():
              print("- Result: evidence missing")
          else:
              evidence = json.loads(path.read_text(encoding="utf-8"))
              print(f"- Result: `{evidence['result']}`")
              print(f"- Cloud-agent config HTTP: `{evidence['cloud_agent_configuration']['http_status']}`")
              print(f"- Ollama MCP variable HTTP: `{evidence['ollama_mcp_variable']['http_status']}`")
              print("- Variable value persisted: no")
              print("- Credential endpoint called: no")
              print("- Mutation executed: no")
          PY

      - name: Fail closed when metadata is inaccessible
        if: steps.metadata_probe.outcome != 'success'
        shell: bash
        run: |
          echo "Copilot cloud-agent metadata is not readable with the governed GitHub credential."
          exit 1
