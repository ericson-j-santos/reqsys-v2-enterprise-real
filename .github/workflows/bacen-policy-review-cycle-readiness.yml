name: BACEN Policy Review Cycle Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml"
      - "scripts/generate_bacen_policy_review_cycle_readiness.py"
      - ".github/workflows/bacen-policy-review-cycle-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml"
      - "scripts/generate_bacen_policy_review_cycle_readiness.py"
      - ".github/workflows/bacen-policy-review-cycle-readiness.yml"
  schedule:
    - cron: "41 8 19 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-policy-review-cycle-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-01 Review Cycle Readiness
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install YAML dependency
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_policy_review_cycle_readiness.py

      - name: Generate readiness evidence
        run: |
          python scripts/generate_bacen_policy_review_cycle_readiness.py \
            --metadata governance/bacen/CYBERSECURITY-POLICY-METADATA.yaml \
            --output artifacts/bacen/bacen-01-review-cycle-readiness.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(Path("artifacts/bacen/bacen-01-review-cycle-readiness.json").read_text(encoding="utf-8"))
          assert evidence["control_id"] == "BACEN-01"
          assert evidence["structural_checks_passed"] is True
          assert evidence["review_overdue"] is False
          assert evidence["missing_review_triggers"] == []
          assert evidence["next_technical_review_due_at"] == evidence["expected_next_review_due_at"]
          assert evidence["readiness_status"] == "review_cycle_validated"
          if not evidence["event_register_present"]:
              assert "review_event_register_pending" in evidence["advisory_findings"]
          assert evidence["production_touched"] is False
          print("BACEN-01 review cycle readiness: valid")
          PY

      - name: Publish readiness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-01-review-cycle-readiness
          path: artifacts/bacen/bacen-01-review-cycle-readiness.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish executive summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-01-review-cycle-readiness.json")
          print("## BACEN-01 — Ciclo de revisão")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          print(f"\n- Ciclo coerente: **{evidence['structural_checks_passed']}**")
          print(f"- Revisão vencida: **{evidence['review_overdue']}**")
          print(f"- Gatilhos ausentes: **{len(evidence['missing_review_triggers'])}**")
          print(f"- Registro de eventos presente: **{evidence['event_register_present']}**")
          print(f"- Próxima revisão: `{evidence['next_technical_review_due_at']}`")
          print("- Produção acessada: **false**")
          PY
