name: BACEN Vendor Accountability Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml"
      - "scripts/generate_bacen_vendor_accountability_readiness.py"
      - ".github/workflows/bacen-vendor-accountability-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml"
      - "scripts/generate_bacen_vendor_accountability_readiness.py"
      - ".github/workflows/bacen-vendor-accountability-readiness.yml"
  schedule:
    - cron: "11 9 2 * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: bacen-vendor-accountability-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-05 Vendor Accountability
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: python -m py_compile scripts/generate_bacen_vendor_accountability_readiness.py

      - name: Generate readiness evidence
        run: |
          python scripts/generate_bacen_vendor_accountability_readiness.py \
            --register governance/bacen/CLOUD-THIRD-PARTY-REGISTER.yaml \
            --output artifacts/bacen/bacen-05-vendor-accountability-readiness.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-05-vendor-accountability-readiness.json")
          evidence = json.loads(path.read_text(encoding="utf-8"))
          summary = evidence["summary"]
          assert evidence["control_id"] == "BACEN-05"
          assert summary["target_vendors"] > 0
          assert summary["complete_accountability"] + summary["pending_accountability"] == summary["target_vendors"]
          assert evidence["automatic_blocking"] is False
          assert evidence["control_status"] in {"partial", "implemented"}
          assert evidence["production_touched"] is False
          assert len(evidence["source_sha256"]) == 64
          print("BACEN-05 vendor accountability evidence: valid")
          PY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-05-vendor-accountability-readiness
          path: artifacts/bacen/bacen-05-vendor-accountability-readiness.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-05-vendor-accountability-readiness.json")
          print("## BACEN-05 — Responsabilização de fornecedores")
          if not path.exists():
              print("\n- Evidência não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          summary = evidence["summary"]
          print(f"\n- Fornecedores críticos/altos: **{summary['target_vendors']}**")
          print(f"- Responsabilização completa: **{summary['complete_accountability']}**")
          print(f"- Pendentes: **{summary['pending_accountability']}**")
          print(f"- Bloqueio estrutural: **{evidence['automatic_blocking']}**")
          print("- Produção acessada: **false**")
          PY
