name: Repository Secret Name Inventory

on:
  push:
    branches:
      - ops/desktop-runner-service-recovery-20260921

permissions:
  actions: read
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: List repository Actions secret names only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, urllib.request
          url=f"https://api.github.com/repos/{os.environ['REPO']}/actions/secrets?per_page=100"
          req=urllib.request.Request(url, headers={
              "Authorization": f"Bearer {os.environ['GH_TOKEN']}",
              "Accept": "application/vnd.github+json",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "reqsys-secret-name-inventory",
          })
          try:
              with urllib.request.urlopen(req, timeout=15) as r:
                  payload=json.load(r)
          except Exception as exc:
              print("SECRET_NAME_INVENTORY_UNAVAILABLE", type(exc).__name__, str(exc)[:200])
              raise SystemExit(0)
          names=sorted(str(x.get("name") or "") for x in payload.get("secrets", []) if x.get("name"))
          print("SECRET_NAME_COUNT="+str(len(names)))
          for name in names:
              print("SECRET_NAME="+name)
          PY
