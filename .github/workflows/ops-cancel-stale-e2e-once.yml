name: Ops cancel stale E2E once

on:
  push:
    branches:
      - feat/e2e-powerplatform-oidc-20260917
    paths:
      - ".github/workflows/ops-cancel-stale-e2e-once.yml"

permissions:
  contents: read
  actions: write

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - name: Cancelar run E2E obsoleto
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: "35290544957"
        run: |
          set -euo pipefail
          status="$(curl -sS -o /tmp/cancel-body -w '%{http_code}' \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPOSITORY/actions/runs/$RUN_ID/cancel")"
          if [ "$status" != "202" ] && [ "$status" != "409" ]; then
            cat /tmp/cancel-body
            exit 1
          fi
          echo "cancel_status=$status"
