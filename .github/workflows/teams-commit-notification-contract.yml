name: Teams Commit Notification Contract

on:
  pull_request:
    paths:
      - .github/workflows/teams-commit-notification.yml
      - .github/workflows/pc24x7-dev-locator-watch.yml
      - .github/workflows/teams-commit-notification-contract.yml
      - tools/geradores/teams_graph_gateway_autocontido.py
      - tests/test_teams_graph_gateway_autocontido.py
      - tests/test_teams_commit_notification_fallback_contract.py
      - tests/test_pc24x7_locator_watch_contract.py
      - .sdd/specs/teams-commit-canonical-gateway.requirements.md
      - .sdd/specs/teams-commit-canonical-gateway.spec.json
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4.2.2
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5.6.0
        with:
          python-version: "3.12"
      - name: Validar sintaxe e contrato
        run: |
          python -m py_compile tools/geradores/teams_graph_gateway_autocontido.py
          python tools/geradores/teams_graph_gateway_autocontido.py self-test
          python tests/test_teams_graph_gateway_autocontido.py
          python tests/test_teams_commit_notification_fallback_contract.py
          python tests/test_pc24x7_locator_watch_contract.py
          grep -Fq "scripts/notificar_teams.py" .github/workflows/teams-commit-notification.yml
          grep -Fq -- "--modo" .github/workflows/teams-commit-notification.yml
          grep -Fq '"flow_bot"' .github/workflows/teams-commit-notification.yml
          grep -Fq -- "--strict" .github/workflows/teams-commit-notification.yml
          grep -Fq "resolve_pc24x7_dev_locator.mjs --self-test" .github/workflows/teams-commit-notification.yml
          grep -Fq "signed-locator.json" .github/workflows/teams-commit-notification.yml
          grep -Fq "steps.locator.outputs.base_url" .github/workflows/teams-commit-notification.yml
          grep -Fq "TEAMS_GATEWAY_BASE_URL" .github/workflows/teams-commit-notification.yml
          grep -Fq "TEAMS_GATEWAY_DESTINO_ID" .github/workflows/teams-commit-notification.yml
          ! grep -Fq 'vars.TEAMS_GATEWAY_BASE_URL' .github/workflows/teams-commit-notification.yml
          ! grep -Eq 'fly\\.io|fly\\.dev' .github/workflows/teams-commit-notification.yml
          grep -Fq 'TEAMS_WEBHOOK_URL:' .github/workflows/teams-commit-notification.yml
          grep -Fq 'secrets.TEAMS_WEBHOOK_URL' .github/workflows/teams-commit-notification.yml
          grep -Fq 'TEAMS_WEBHOOK_RECIPIENT:' .github/workflows/teams-commit-notification.yml
          grep -Fq 'secrets.TEAMS_WEBHOOK_RECIPIENT' .github/workflows/teams-commit-notification.yml
          grep -Fq 'delivery_mode=webhook_fallback' .github/workflows/teams-commit-notification.yml
          grep -Fq 'commit-notification-fallback' .github/workflows/teams-commit-notification.yml
          grep -Fq 'webhook governado de contingência' .github/workflows/teams-commit-notification.yml
          grep -Fq "Action.OpenUrl" .github/workflows/teams-commit-notification.yml
          grep -Fq "StripAuthorizationOnCrossHostRedirect" .github/workflows/teams-commit-notification.yml
          grep -Fq 'redirected.remove_header("Authorization")' .github/workflows/teams-commit-notification.yml
          grep -Fq "artifact_opener.open" .github/workflows/teams-commit-notification.yml
          ! grep -Fq "concurrency:" .github/workflows/teams-commit-notification.yml
          ! grep -Fq "continue-on-error:" .github/workflows/teams-commit-notification.yml
          grep -Fq "renderMode" tools/geradores/teams_graph_gateway_autocontido.py
          grep -Fq "adaptiveCardJson" tools/geradores/teams_graph_gateway_autocontido.py
          grep -Fq "adaptive_card=self.card" tests/test_teams_graph_gateway_autocontido.py
