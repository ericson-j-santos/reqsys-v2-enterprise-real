name: Temporary Key Vault SQL Locator — DEV

on:
  push:
    branches:
      - ops/temp-kv-secrets-user-dev-20260913
    paths:
      - .github/workflows/temp-kv-secrets-user-sql-locator-dev.yml
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: temp-kv-secrets-user-sql-locator-dev
  cancel-in-progress: false

env:
  INTEGRATION_E2E_ENVIRONMENT: dev
  INTEGRATION_E2E_SQL_PROCEDURE: integration.usp_ConsultarPorIdentificadores
  EVIDENCE_DIR: artifacts/temp-kv-secrets-user-sql-locator-dev

jobs:
  execute:
    name: Conceder temporariamente, resolver DSN, validar SQL e revogar
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: development

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Preparar evidência fail-closed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$EVIDENCE_DIR"
          cat > "$EVIDENCE_DIR/result.json" <<'JSON'
          {
            "status": "started",
            "environment": "dev",
            "role": "Key Vault Secrets User",
            "temporary_role_created": false,
            "temporary_role_revoked": false,
            "production_touched": false,
            "test_touched": false,
            "secret_value_exposed": false
          }
          JSON

      - name: Validar configuração governada
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ vars.CCP_AZURE_CLIENT_ID_FLY_GOVERNED_COMMAND }}
          AZURE_TENANT_ID: ${{ vars.CCP_AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          for name in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID REQSYS_KEY_VAULT_NAME; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Configuração ausente: $name"
              exit 2
            fi
          done
          if [ "$REQSYS_KEY_VAULT_NAME" != "kv-reqsys-ccp" ]; then
            echo "::error::Cofre fora do escopo autorizado."
            exit 3
          fi

      - name: Login Azure por OIDC governado
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.CCP_AZURE_CLIENT_ID_FLY_GOVERNED_COMMAND }}
          tenant-id: ${{ vars.CCP_AZURE_TENANT_ID }}
          subscription-id: ${{ vars.CCP_AZURE_SUBSCRIPTION_ID }}

      - name: Resolver identidade e escopo sem Graph
        id: context
        shell: bash
        env:
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          set +x
          vault_id="$(az keyvault show --name "$REQSYS_KEY_VAULT_NAME" --query id -o tsv)"
          if [ -z "$vault_id" ]; then
            echo "::error::Não foi possível resolver o recurso do Key Vault."
            exit 4
          fi
          token="$(az account get-access-token --resource https://management.azure.com/ --query accessToken -o tsv)"
          echo "::add-mask::$token"
          oid="$(TOKEN="$token" python - <<'PY'
          import base64, json, os
          parts=os.environ['TOKEN'].split('.')
          if len(parts) < 2:
              raise SystemExit(5)
          payload=parts[1] + '=' * (-len(parts[1]) % 4)
          data=json.loads(base64.urlsafe_b64decode(payload.encode()).decode())
          oid=data.get('oid')
          if not oid:
              raise SystemExit(6)
          print(oid)
          PY
          )"
          if [ -z "$oid" ]; then
            echo "::error::Object ID da identidade governada não resolvido."
            exit 7
          fi
          echo "vault_id=$vault_id" >> "$GITHUB_OUTPUT"
          echo "principal_oid=$oid" >> "$GITHUB_OUTPUT"

      - name: Conceder Key Vault Secrets User temporariamente
        id: grant
        continue-on-error: true
        shell: bash
        env:
          VAULT_ID: ${{ steps.context.outputs.vault_id }}
          PRINCIPAL_OID: ${{ steps.context.outputs.principal_oid }}
        run: |
          set -euo pipefail
          set +x
          existing="$(az role assignment list \
            --assignee-object-id "$PRINCIPAL_OID" \
            --scope "$VAULT_ID" \
            --query "[?roleDefinitionName=='Key Vault Secrets User'].id | [0]" \
            -o tsv)"
          if [ -n "$existing" ]; then
            echo "preexisting=true" >> "$GITHUB_OUTPUT"
            echo "assignment_id=$existing" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          assignment_id="$(az role assignment create \
            --assignee-object-id "$PRINCIPAL_OID" \
            --assignee-principal-type ServicePrincipal \
            --role "Key Vault Secrets User" \
            --scope "$VAULT_ID" \
            --query id -o tsv)"
          test -n "$assignment_id"
          echo "preexisting=false" >> "$GITHUB_OUTPUT"
          echo "assignment_id=$assignment_id" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['EVIDENCE_DIR'],'result.json')
          d=json.loads(p.read_text())
          d['temporary_role_created']=True
          d['status']='role_granted'
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY

      - name: Registrar falha de concessão
        if: steps.grant.outcome != 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['EVIDENCE_DIR'],'result.json')
          d=json.loads(p.read_text())
          d['status']='blocked'
          d['blocker']='azure_rbac_role_assignment_not_permitted'
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY

      - name: Aguardar RBAC e resolver DSN sem expor valor
        id: kv
        if: steps.grant.outcome == 'success'
        continue-on-error: true
        shell: bash
        env:
          REQSYS_KEY_VAULT_NAME: ${{ vars.REQSYS_KEY_VAULT_NAME }}
        run: |
          set -euo pipefail
          set +x
          names="$RUNNER_TEMP/secret-names.txt"
          selected="$RUNNER_TEMP/sql-secret-name.txt"
          ok=false
          for attempt in 1 2 3 4 5 6 7 8; do
            if az keyvault secret list --vault-name "$REQSYS_KEY_VAULT_NAME" --query '[].name' -o tsv > "$names" 2>/dev/null; then
              ok=true
              break
            fi
            sleep 5
          done
          if [ "$ok" != true ]; then
            echo "::error::RBAC não propagou ou leitura de metadados continua negada."
            exit 8
          fi
          python - "$names" "$selected" <<'PY'
          import re, sys
          from pathlib import Path
          names=[x.strip() for x in Path(sys.argv[1]).read_text(encoding='utf-8').splitlines() if x.strip()]
          candidates=[n for n in names if re.search(r'(sql.*(dsn|connection|conn|string)|(?:dsn|connection|conn|string).*sql)', n, re.I)]
          print(f'sql_candidate_count={len(candidates)}')
          if len(candidates) != 1:
              raise SystemExit(9)
          Path(sys.argv[2]).write_text(candidates[0], encoding='utf-8')
          PY
          secret_name="$(cat "$selected")"
          dsn="$(az keyvault secret show --vault-name "$REQSYS_KEY_VAULT_NAME" --name "$secret_name" --query value -o tsv)"
          if [ -z "$dsn" ]; then
            exit 10
          fi
          case "$dsn" in *$'\n'*|*$'\r'*) exit 11;; esac
          echo "::add-mask::$dsn"
          printf 'INTEGRATION_E2E_SQL_DSN=%s\n' "$dsn" >> "$GITHUB_ENV"
          echo "resolved=true" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['EVIDENCE_DIR'],'result.json')
          d=json.loads(p.read_text())
          d['dsn_resolved']=True
          d['secret_value_exposed']=False
          d['status']='dsn_resolved'
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY

      - name: Instalar dependências mínimas da sonda SQL
        if: steps.kv.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          bash .github/scripts/install-unixodbc-ci.sh
          python -m pip install --upgrade pip
          pip install pyodbc

      - name: Executar SQL locator real DEV
        id: locator
        if: steps.kv.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python scripts/integration_excel_sql_sharepoint_sql_locator.py \
            --strict \
            --output "$EVIDENCE_DIR/sql-locator.json" \
            --source-sha "$GITHUB_SHA" \
            --correlation-id "temp-kv-role-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

      - name: Consolidar resultado do locator
        if: steps.kv.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          state=Path(os.environ['EVIDENCE_DIR'],'result.json')
          d=json.loads(state.read_text())
          locator=Path(os.environ['EVIDENCE_DIR'],'sql-locator.json')
          if locator.exists():
              x=json.loads(locator.read_text())
              d['locator_status']=x.get('status')
              d['procedure_exists']=x.get('procedure_exists')
              d['parameter_contract_ok']=x.get('parameter_contract_ok')
              d['dsn_present']=x.get('dsn_present')
              d['status']='resolved' if x.get('status')=='resolved' else 'blocked'
              if x.get('error'):
                  d['blocker']=x.get('error')
          else:
              d['status']='blocked'
              d['blocker']='sql_locator_evidence_missing'
          state.write_text(json.dumps(d, indent=2)+'\n')
          PY

      - name: Revogar função criada por esta execução
        id: revoke
        if: always() && steps.grant.outcome == 'success' && steps.grant.outputs.preexisting == 'false'
        continue-on-error: true
        shell: bash
        env:
          ASSIGNMENT_ID: ${{ steps.grant.outputs.assignment_id }}
        run: |
          set -euo pipefail
          if [ -z "$ASSIGNMENT_ID" ]; then
            exit 12
          fi
          az role assignment delete --ids "$ASSIGNMENT_ID"
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['EVIDENCE_DIR'],'result.json')
          d=json.loads(p.read_text())
          d['temporary_role_revoked']=True
          p.write_text(json.dumps(d, indent=2)+'\n')
          PY

      - name: Confirmar ausência de privilégio residual criado pelo run
        if: always() && steps.grant.outcome == 'success' && steps.grant.outputs.preexisting == 'false'
        shell: bash
        env:
          VAULT_ID: ${{ steps.context.outputs.vault_id }}
          PRINCIPAL_OID: ${{ steps.context.outputs.principal_oid }}
        run: |
          set -euo pipefail
          count="$(az role assignment list \
            --assignee-object-id "$PRINCIPAL_OID" \
            --scope "$VAULT_ID" \
            --query "[?roleDefinitionName=='Key Vault Secrets User'] | length(@)" \
            -o tsv)"
          if [ "$count" != "0" ]; then
            echo "::error::Permissão temporária residual detectada."
            exit 13
          fi

      - name: Publicar evidência sanitizada
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: temp-kv-secrets-user-sql-locator-dev-${{ github.run_id }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed final
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os
          from pathlib import Path
          p=Path(os.environ['EVIDENCE_DIR'],'result.json')
          d=json.loads(p.read_text())
          if d.get('temporary_role_created') and not d.get('temporary_role_revoked'):
              raise SystemExit('temporary_role_not_revoked')
          if d.get('status') != 'resolved':
              raise SystemExit('sql_locator_not_resolved')
          if d.get('procedure_exists') is not True or d.get('parameter_contract_ok') is not True:
              raise SystemExit('sql_locator_contract_not_green')
          PY
