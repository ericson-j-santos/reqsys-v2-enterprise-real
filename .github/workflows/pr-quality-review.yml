name: PR Quality Review

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número do PR para revisar"
        required: true
        type: string
      head_sha:
        description: "SHA exato do PR; opcional para diagnóstico manual"
        required: false
        type: string
      comment:
        description: "Comentar diagnóstico no PR"
        required: true
        default: true
        type: boolean

permissions:
  contents: read
  pull-requests: read
  issues: write

concurrency:
  group: pr-quality-review-${{ inputs.pr_number || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-quality-review:
    name: PR Quality Review governado
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      REPORT_DIR: artifacts/pr-quality-review

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha || github.sha }}

      - name: Resolver contexto
        id: ctx
        shell: bash
        run: |
          set -euo pipefail

          echo "pr_number=${{ inputs.pr_number }}" >> "$GITHUB_OUTPUT"
          echo "draft=false" >> "$GITHUB_OUTPUT"
          echo "comment=${{ inputs.comment }}" >> "$GITHUB_OUTPUT"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Executar PR Quality Review
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          COMMENT_FLAG=""
          if [ "${{ steps.ctx.outputs.comment }}" = "true" ]; then
            COMMENT_FLAG="--comment"
          fi

          python scripts/pr_quality_review_entry.py \
            --repo "${GITHUB_REPOSITORY}" \
            --pr-number "${{ steps.ctx.outputs.pr_number }}" \
            --report-dir "${REPORT_DIR}" \
            ${COMMENT_FLAG}

      - name: Publicar artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-quality-review-report
          path: artifacts/pr-quality-review
          if-no-files-found: error
          retention-days: 15
