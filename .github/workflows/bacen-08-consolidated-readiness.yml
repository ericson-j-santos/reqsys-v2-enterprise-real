name: BACEN-08 Consolidated Readiness

on:
  pull_request:
    branches: [main]
    paths:
      - "governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md"
      - "governance/bacen/EXECUTIVE-DESIGNATION.yaml"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_executive_readiness.py"
      - "scripts/generate_bacen_annual_report_narrative_readiness.py"
      - "scripts/generate_bacen_annual_report_incident_linkage.py"
      - "scripts/generate_bacen_annual_report_action_plan_traceability.py"
      - "scripts/consolidate_bacen_08_evidence.py"
      - ".github/workflows/bacen-08-consolidated-readiness.yml"
  push:
    branches: [main]
    paths:
      - "governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md"
      - "governance/bacen/EXECUTIVE-DESIGNATION.yaml"
      - "governance/bacen/BACEN-CONTROL-MATRIX.yaml"
      - "scripts/generate_bacen_executive_readiness.py"
      - "scripts/generate_bacen_annual_report_narrative_readiness.py"
      - "scripts/generate_bacen_annual_report_incident_linkage.py"
      - "scripts/generate_bacen_annual_report_action_plan_traceability.py"
      - "scripts/consolidate_bacen_08_evidence.py"
      - ".github/workflows/bacen-08-consolidated-readiness.yml"
  schedule:
    - cron: "11 10 3 * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bacen-08-consolidated-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: BACEN-08 consolidated evidence
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check PyYAML

      - name: Validate implementation
        run: |
          python -m py_compile scripts/generate_bacen_executive_readiness.py
          python -m py_compile scripts/generate_bacen_annual_report_narrative_readiness.py
          python -m py_compile scripts/generate_bacen_annual_report_incident_linkage.py
          python -m py_compile scripts/generate_bacen_annual_report_action_plan_traceability.py
          python -m py_compile scripts/consolidate_bacen_08_evidence.py

      - name: Generate component evidence
        run: |
          python scripts/generate_bacen_executive_readiness.py \
            --report governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md \
            --designation governance/bacen/EXECUTIVE-DESIGNATION.yaml \
            --output artifacts/bacen/bacen-08-executive-readiness.json
          python scripts/generate_bacen_annual_report_narrative_readiness.py \
            --report governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md \
            --output artifacts/bacen/bacen-08-annual-report-narrative-readiness.json
          python scripts/generate_bacen_annual_report_incident_linkage.py \
            --report governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md \
            --matrix governance/bacen/BACEN-CONTROL-MATRIX.yaml \
            --output artifacts/bacen/bacen-08-annual-report-incident-linkage.json
          python scripts/generate_bacen_annual_report_action_plan_traceability.py \
            --report governance/bacen/ANNUAL-CYBERSECURITY-REPORT.md \
            --matrix governance/bacen/BACEN-CONTROL-MATRIX.yaml \
            --output artifacts/bacen/bacen-08-annual-report-action-plan-traceability.json

      - name: Consolidate evidence
        run: |
          python scripts/consolidate_bacen_08_evidence.py \
            --matrix governance/bacen/BACEN-CONTROL-MATRIX.yaml \
            --executive artifacts/bacen/bacen-08-executive-readiness.json \
            --narrative artifacts/bacen/bacen-08-annual-report-narrative-readiness.json \
            --incident-linkage artifacts/bacen/bacen-08-annual-report-incident-linkage.json \
            --action-plan artifacts/bacen/bacen-08-annual-report-action-plan-traceability.json \
            --output artifacts/bacen/bacen-08-consolidated-readiness.json

      - name: Validate evidence contract
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          evidence = json.loads(
              Path("artifacts/bacen/bacen-08-consolidated-readiness.json").read_text(
                  encoding="utf-8"
              )
          )
          assert evidence["control_id"] == "BACEN-08"
          assert len(evidence["components"]) == 4
          assert evidence["consolidated_technical_readiness"] is True
          assert evidence["automatic_blocking"] is False
          assert evidence["control_status"] in {"partial", "implemented"}
          assert evidence["production_touched"] is False
          assert len(evidence["matrix_sha256"]) == 64
          print("BACEN-08 consolidated readiness: valid")
          PY

      - name: Publish evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bacen-08-consolidated-readiness
          path: artifacts/bacen/bacen-08-*.json
          if-no-files-found: error
          retention-days: 365

      - name: Publish summary
        if: always()
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path

          path = Path("artifacts/bacen/bacen-08-consolidated-readiness.json")
          print("## BACEN-08 — Prontidão consolidada")
          if not path.exists():
              print("\n- Evidência consolidada não gerada.")
              raise SystemExit(1)
          evidence = json.loads(path.read_text(encoding="utf-8"))
          print(f"\n- Prontidão técnica: **{evidence['consolidated_technical_readiness']}**")
          print(f"- Estado do controle: **{evidence['control_status']}**")
          print(f"- Componentes humanos pendentes: **{len(evidence['pending_components'])}**")
          print(f"- Conclusão formal: **{evidence['formal_completion']}**")
          print("- Produção acessada: **false**")
          PY
