name: Prepare OCR Runtime Package
description: Prepara duas builds limpas e byte-idênticas do OCR privado.

inputs:
  app-id:
    description: GitHub App ID governado
    required: true
  private-key:
    description: Chave privada da GitHub App governada
    required: true

outputs:
  ocr-sha:
    description: SHA imutável do OCR preparado
    value: ${{ steps.lock.outputs.sha }}
  ocr-version:
    description: Versão do pacote OCR
    value: ${{ steps.lock.outputs.version }}
  wheel-sha256:
    description: SHA-256 do wheel preparado
    value: ${{ steps.package.outputs.wheel_sha256 }}

runs:
  using: composite
  steps:
    - name: Ler locks imutáveis do OCR
      id: lock
      shell: bash
      run: |
        set -euo pipefail
        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        import re
        from pathlib import Path

        lock = json.loads(Path("config/ocr-engine-lock.json").read_text(encoding="utf-8"))
        sha = str(lock["sha"])
        if not re.fullmatch(r"[0-9a-f]{40}", sha):
            raise SystemExit("ocr_lock_sha_must_be_full_commit")
        if lock["repository"] != "ericson-j-santos/ocr-evidence-engine":
            raise SystemExit("ocr_lock_repository_mismatch")
        print(f"repository={lock['repository']}")
        print(f"sha={sha}")
        print(f"version={lock['version']}")
        PY

    - name: Emitir token temporário somente leitura
      id: app-token
      uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        owner: ${{ github.repository_owner }}
        repositories: |
          reqsys-v2-enterprise-real
          ocr-evidence-engine
        permission-contents: read

    - name: Checkout limpo A do OCR no SHA do lock
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.lock.outputs.repository }}
        ref: ${{ steps.lock.outputs.sha }}
        token: ${{ steps.app-token.outputs.token }}
        path: .external/ocr-evidence-engine-a
        persist-credentials: false

    - name: Checkout limpo B do OCR no SHA do lock
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: ${{ steps.lock.outputs.repository }}
        ref: ${{ steps.lock.outputs.sha }}
        token: ${{ steps.app-token.outputs.token }}
        path: .external/ocr-evidence-engine-b
        persist-credentials: false

    - name: Instalar toolchain de build fixada
      shell: bash
      run: |
        set -euo pipefail
        python -m pip install --disable-pip-version-check           pip==26.1.2 setuptools==80.9.0 wheel==0.45.1 packaging==25.0
        python - <<'PY'
        import importlib.metadata
        import json
        import sys
        from pathlib import Path

        expected = json.loads(Path("config/ocr-build-toolchain.json").read_text())
        observed = {
            "python": ".".join(map(str, sys.version_info[:3])),
            **{name: importlib.metadata.version(name)
               for name in ("pip", "setuptools", "wheel", "packaging")},
        }
        if observed != expected:
            raise SystemExit(f"ocr_toolchain_mismatch:{observed}")
        print("OCR_BUILD_TOOLCHAIN_OK " + json.dumps(observed, sort_keys=True))
        PY

    - name: Gerar duas builds independentes e comparar bytes
      id: package
      shell: bash
      run: |
        set -euo pipefail
        bundle_a="$RUNNER_TEMP/ocr-bundle-a"
        python scripts/prepare_ocr_runtime_package.py           --source .external/ocr-evidence-engine-a           --output-dir "$bundle_a"
        python scripts/prepare_ocr_runtime_package.py           --source .external/ocr-evidence-engine-b           --output-dir backend/vendor/ocr-evidence-engine           --compare-with "$bundle_a"

        tampered="$RUNNER_TEMP/ocr-bundle-tampered"
        cp -a backend/vendor/ocr-evidence-engine "$tampered"
        printf '\n' >> "$tampered/MANIFEST.sha256"
        set +e
        python - <<'PY' "$bundle_a" "$tampered"
        import sys
        from pathlib import Path
        from scripts.prepare_ocr_runtime_package import RuntimePackageError, compare_bundles

        try:
            compare_bundles(Path(sys.argv[1]), Path(sys.argv[2]))
        except RuntimePackageError:
            raise SystemExit(3)
        raise SystemExit(0)
        PY
        negative_rc=$?
        set -e
        test "$negative_rc" -eq 3
        echo "OCR_REPRODUCIBILITY_NEGATIVE_CONTROL_OK"

        python - <<'PY' >> "$GITHUB_OUTPUT"
        import json
        from pathlib import Path

        data = json.loads(
            Path("backend/vendor/ocr-evidence-engine/provenance.json").read_text(
                encoding="utf-8"
            )
        )
        print(f"wheel_sha256={data['files'][0]['sha256']}")
        PY
