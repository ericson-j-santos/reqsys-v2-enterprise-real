services:
  api:
    environment:
      REQSYS_DATA_DIR: "/data"
      REQSYS_RUNTIME_ENVIRONMENT: "dev"
      COFRE_RUNTIME_SELF_RESTART_ENABLED: "1"
    secrets:
      - cofre_keyring_passphrase
    volumes:
      - reqsys-cofre-data:/data
    command:
      - /bin/sh
      - -ec
      - |
        export COFRE_KEYRING_PASSPHRASE="$$(cat /run/secrets/cofre_keyring_passphrase)"
        exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

secrets:
  cofre_keyring_passphrase:
    file: "${COFRE_KEYRING_PASSPHRASE_FILE:-C:/ProgramData/ReqSys/secrets/cofre-keyring-passphrase.txt}"

volumes:
  reqsys-cofre-data:
