<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>ReqSys DEV</title>
  <meta name="robots" content="noindex,nofollow">
  <style>
    :root{font-family:Inter,system-ui,sans-serif;color-scheme:light dark}
    body{max-width:760px;margin:8vh auto;padding:24px;line-height:1.5}
    .card{border:1px solid #8886;border-radius:14px;padding:24px}
    code{overflow-wrap:anywhere}
    .ok{font-weight:700}.error{font-weight:700}
    a{display:block;margin:.55rem 0}
  </style>
</head>
<body>
  <main class="card">
    <h1>ReqSys DEV</h1>
    <p id="status">Localizando o runtime DEV vigente…</p>
    <div id="links"></div>
    <p><small>Entrada estável governada. O destino efêmero só é aceito com assinatura Ed25519 válida e ainda não expirada.</small></p>
  </main>
<script>
const TOPIC="reqsys-dev-locator-2b0950c3bf37ac05b46bdb70ab793ca4c85b220b";
const PUBLIC_KEY_B64="xMQwHfokBxBOkP1bvDCxBDdzmnXlVxApGQbwQ9h8kr8=";
const ENDPOINT="https://ntfy.sh/"+TOPIC+"/json?poll=1&since=1h";

const b64bytes=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bytesText=b=>new TextDecoder().decode(b);

async function verifyEnvelope(rawMessage){
  let envelope;
  try{ envelope=JSON.parse(rawMessage); }catch{return null;}
  if(envelope.v!==1 || !envelope.payload_b64 || !envelope.signature_b64) return null;
  const key=await crypto.subtle.importKey("raw",b64bytes(PUBLIC_KEY_B64),{name:"Ed25519"},false,["verify"]);
  const signed=new TextEncoder().encode(envelope.payload_b64);
  const valid=await crypto.subtle.verify({name:"Ed25519"},key,b64bytes(envelope.signature_b64),signed);
  if(!valid) return null;
  let payload;
  try{ payload=JSON.parse(bytesText(b64bytes(envelope.payload_b64))); }catch{return null;}
  const now=Math.floor(Date.now()/1000);
  if(payload.environment!=="dev" || payload.expires_at<=now || payload.issued_at>now+60) return null;
  if(!Array.isArray(payload.urls) || !payload.urls.includes(payload.selected_url)) return null;
  const allowed=u=>{
    try{
      const x=new URL(u);
      return x.protocol==="https:" && x.hostname.endsWith(".trycloudflare.com");
    }catch{return false;}
  };
  if(!allowed(payload.selected_url) || !payload.urls.every(allowed)) return null;
  return payload;
}

async function load(){
  const status=document.getElementById("status");
  const links=document.getElementById("links");
  try{
    const response=await fetch(ENDPOINT,{cache:"no-store"});
    if(!response.ok) throw new Error("locator HTTP "+response.status);
    const rows=(await response.text()).trim().split(/\r?\n/).filter(Boolean);
    const messages=[];
    for(const row of rows){
      try{
        const item=JSON.parse(row);
        if(item.event==="message" && item.title==="reqsys-dev-locator") messages.push(item);
      }catch{}
    }
    let payload=null;
    for(const item of messages.reverse()){
      payload=await verifyEnvelope(item.message);
      if(payload) break;
    }
    if(!payload) throw new Error("nenhum estado válido e vigente");
    const params=new URLSearchParams(location.search);
    const requestedTarget=params.get("target")||"/task-console";
    const target=requestedTarget.startsWith("/") && !requestedTarget.startsWith("//") && requestedTarget.length<=2048
      ? requestedTarget
      : "/task-console";
    status.className="ok";
    status.textContent="DEV localizado. Redirecionando…";
    for(const u of payload.urls){
      const a=document.createElement("a");
      a.href=u+target;
      a.rel="noopener";
      a.textContent=u;
      links.appendChild(a);
    }
    const noRedirect=params.get("no_redirect")==="1";
    if(!noRedirect) setTimeout(()=>location.replace(payload.selected_url+target),900);
  }catch(err){
    status.className="error";
    status.textContent="DEV temporariamente sem locator vigente. Os transportes estão em recuperação automática.";
    const p=document.createElement("p");
    p.textContent=String(err);
    links.appendChild(p);
  }
}
load();
</script>
</body>
</html>
