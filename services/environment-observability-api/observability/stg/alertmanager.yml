global:
  resolve_timeout: 5m

route:
  receiver: stg-notification-pending
  group_by: [alertname, severity, environment]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

receivers:
  - name: stg-notification-pending

inhibit_rules:
  - source_matchers: [severity="critical"]
    target_matchers: [severity="warning"]
    equal: [alertname, environment]
