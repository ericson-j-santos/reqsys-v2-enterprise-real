global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/rules/alerts.yaml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: environment-observability-api
    metrics_path: /metrics
    static_configs:
      - targets: ["api:8000"]
        labels:
          environment: production

  - job_name: environment-observability-collector
    static_configs:
      - targets: ["collector:8888"]
        labels:
          environment: production
